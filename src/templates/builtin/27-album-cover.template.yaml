_protocol: template/v1

# Cyber-synthwave square album cover (1080×1080).
# Overlapping rotated rects, neon radial glows, big artist + album, advisory + label.
meta:
  id: tmpl-album-cover
  name: Album Cover
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, album, music, cover, cyber, synthwave, square]

document:
  width: 1080
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: cyber-synthwave

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1080
    fill:
      type: linear
      angle: 160
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  - id: glow-magenta
    type: circle
    z: 1
    cx: 220
    cy: 240
    rx: 360
    ry: 360
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$background", position: 100 }
    opacity: 0.55

  - id: glow-cyan
    type: circle
    z: 2
    cx: 880
    cy: 820
    rx: 320
    ry: 320
    fill:
      type: radial
      stops:
        - { color: "$secondary", position: 0 }
        - { color: "$background", position: 100 }
    opacity: 0.5

  - id: shape-a
    type: rect
    z: 3
    x: 120
    y: 380
    width: 520
    height: 520
    rotation: -8
    fill: { type: solid, color: "$primary" }
    opacity: 0.18

  - id: shape-b
    type: rect
    z: 4
    x: 440
    y: 220
    width: 520
    height: 520
    rotation: 6
    fill: { type: solid, color: "$secondary" }
    opacity: 0.18

  - id: shape-c
    type: rect
    z: 5
    x: 320
    y: 300
    width: 440
    height: 440
    rotation: 22
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }
    opacity: 0.55

  - id: grid-rule-top
    type: rect
    z: 6
    x: 80
    y: 140
    width: 920
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.4

  - id: grid-rule-bottom
    type: rect
    z: 7
    x: 80
    y: 940
    width: 920
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.4

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 96
    width: 920
    height: 0
    content: { type: plain, value: "AN ALBUM IN FOURTEEN PARTS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: artist
    type: text
    z: 11
    x: 80
    y: 480
    width: 920
    height: 0
    content: { type: plain, value: "NEON CATHEDRAL" }
    style:
      font_family: $heading
      font_size: 110
      font_weight: 900
      color: $text
      line_height: 0.95
      letter_spacing: -0.025
      text_transform: uppercase

  - id: album-title
    type: text
    z: 12
    x: 80
    y: 620
    width: 920
    height: 0
    content: { type: plain, value: "Hours After Midnight" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 500
      font_style: italic
      color: $secondary
      line_height: 1.1
      letter_spacing: -0.01

  - id: track-info
    type: text
    z: 13
    x: 80
    y: 720
    width: 920
    height: 0
    content: { type: plain, value: "14 TRACKS · 52 MIN · MASTERED FOR VINYL" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.24
      text_transform: uppercase

  - id: advisory
    type: rect
    z: 14
    x: 80
    y: 960
    width: 130
    height: 36
    fill: { type: solid, color: "$text" }

  - id: advisory-text
    type: text
    z: 15
    x: 80
    y: 968
    width: 130
    height: 0
    content: { type: plain, value: "EXPLICIT" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: "$background"
      letter_spacing: 0.2
      text_align: center
      text_transform: uppercase

  - id: label-text
    type: text
    z: 16
    x: 80
    y: 1004
    width: 920
    height: 0
    content: { type: plain, value: "© 2026 PRISM RECORDS" }
    style:
      font_family: $mono
      font_size: 12
      color: $text_muted
      letter_spacing: 0.24
      text_transform: uppercase

  - id: year
    type: text
    z: 17
    x: 80
    y: 1004
    width: 920
    height: 0
    content: { type: plain, value: "2026" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $primary
      letter_spacing: 0.24
      text_align: right

slots:
  - { id: artist,      path: "layers[9].content.value",  type: text, hint: "Artist / band name",          default: "NEON CATHEDRAL" }
  - { id: album_title, path: "layers[10].content.value", type: text, hint: "Album title",                 default: "Hours After Midnight" }
  - { id: track_info,  path: "layers[11].content.value", type: text, hint: "Track count + duration line", default: "14 TRACKS · 52 MIN · MASTERED FOR VINYL" }
  - { id: year,        path: "layers[15].content.value", type: text, hint: "Release year",                default: "2026" }
  - { id: label,       path: "layers[14].content.value", type: text, hint: "Label / copyright footer",    default: "© 2026 PRISM RECORDS" }
