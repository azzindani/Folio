_protocol: template/v1

# Birthday party invite — 1080×1500 portrait, sunset-glow theme.
# Festive confetti dot field, oversized age numeral, details block.
meta:
  id: tmpl-birthday-party-invite
  name: Birthday Party Invite
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, invitation, birthday, party, festive, portrait]
  description: "Festive birthday party invite with a huge age numeral, confetti decoration, and full event details."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: $background } }

  # ── Confetti dot field ───────────────────────────────────
  - { id: conf-1,  type: circle, z: 2, cx: 120,  cy: 180,  rx: 14, ry: 14, fill: { type: solid, color: "$primary" },   opacity: 0.85 }
  - { id: conf-2,  type: circle, z: 2, cx: 940,  cy: 140,  rx: 10, ry: 10, fill: { type: solid, color: "$secondary" }, opacity: 0.8 }
  - { id: conf-3,  type: circle, z: 2, cx: 220,  cy: 240,  rx: 7,  ry: 7,  fill: { type: solid, color: "$accent" },    opacity: 0.7 }
  - { id: conf-4,  type: circle, z: 2, cx: 880,  cy: 260,  rx: 16, ry: 16, fill: { type: solid, color: "$primary" },   opacity: 0.7 }
  - { id: conf-5,  type: rect,   z: 2, x: 80,    y: 380,   width: 26, height: 8, fill: { type: solid, color: "$accent" },    opacity: 0.7 }
  - { id: conf-6,  type: rect,   z: 2, x: 970,   y: 420,   width: 26, height: 8, fill: { type: solid, color: "$secondary" }, opacity: 0.7 }
  - { id: conf-7,  type: circle, z: 2, cx: 100,  cy: 1300, rx: 12, ry: 12, fill: { type: solid, color: "$secondary" }, opacity: 0.8 }
  - { id: conf-8,  type: circle, z: 2, cx: 960,  cy: 1380, rx: 9,  ry: 9,  fill: { type: solid, color: "$accent" },    opacity: 0.7 }
  - { id: conf-9,  type: rect,   z: 2, x: 180,   y: 1380,  width: 22, height: 8, fill: { type: solid, color: "$primary" },   opacity: 0.7 }
  - { id: conf-10, type: rect,   z: 2, x: 860,   y: 1220,  width: 22, height: 8, fill: { type: solid, color: "$accent" },    opacity: 0.7 }

  # ── Eyebrow ──────────────────────────────────────────────
  - { id: eyebrow, type: text, z: 10, x: 80, y: 220, width: 920, height: 0, content: { type: plain, value: "✦  IT'S A PARTY  ✦" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.5, text_transform: uppercase } }

  - { id: for-line, type: text, z: 11, x: 80, y: 300, width: 920, height: 0, content: { type: plain, value: "to celebrate" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text_muted", text_align: center, line_height: 1.3 } }

  - { id: name, type: text, z: 12, x: 80, y: 360, width: 920, height: 0, content: { type: plain, value: "Luna Hartwell" }, style: { font_family: $heading, font_size: 72, font_weight: 700, color: "$text", text_align: center, line_height: 1.1, letter_spacing: -0.01 } }

  - { id: turning, type: text, z: 13, x: 80, y: 480, width: 920, height: 0, content: { type: plain, value: "is turning" }, style: { font_family: $body, font_size: 24, color: "$text_muted", text_align: center, letter_spacing: 0.3 } }

  # ── Huge age numeral ─────────────────────────────────────
  - { id: age, type: text, z: 20, x: 80, y: 560, width: 920, height: 0, content: { type: plain, value: "8" }, style: { font_family: $heading, font_size: 380, font_weight: 800, color: "$primary", text_align: center, line_height: 1, letter_spacing: -0.04 } }

  # ── Ornament row ─────────────────────────────────────────
  - { id: orn-dot-l, type: circle, z: 25, cx: 420, cy: 1010, rx: 6, ry: 6, fill: { type: solid, color: "$accent" } }
  - { id: orn-line,  type: rect,   z: 25, x: 440, y: 1007, width: 200, height: 3, fill: { type: solid, color: "$accent" } }
  - { id: orn-dot-r, type: circle, z: 25, cx: 660, cy: 1010, rx: 6, ry: 6, fill: { type: solid, color: "$accent" } }

  # ── Details ──────────────────────────────────────────────
  - { id: date, type: text, z: 30, x: 80, y: 1060, width: 920, height: 0, content: { type: plain, value: "Saturday, July 25th" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: "$text", text_align: center, line_height: 1.3 } }

  - { id: time, type: text, z: 31, x: 80, y: 1120, width: 920, height: 0, content: { type: plain, value: "2:00 — 5:00 PM" }, style: { font_family: $body, font_size: 24, color: "$text_muted", text_align: center, line_height: 1.4 } }

  - { id: venue, type: text, z: 32, x: 80, y: 1180, width: 920, height: 0, content: { type: plain, value: "Riverside Park Pavilion · 84 Elm Street" }, style: { font_family: $body, font_size: 22, color: "$text", text_align: center, line_height: 1.4 } }

  - { id: rsvp, type: text, z: 40, x: 80, y: 1330, width: 920, height: 0, content: { type: plain, value: "RSVP by July 15 · text Mia at (555) 219-0648" }, style: { font_family: $body, font_size: 18, font_weight: 500, color: "$primary", text_align: center, letter_spacing: 0.2 } }

slots:
  - { id: name,          path: "layers[13].content.value", type: text, hint: "Celebrant name",      default: "Luna Hartwell" }
  - { id: age,           path: "layers[15].content.value", type: text, hint: "Age (number)",        default: "8" }
  - { id: date,          path: "layers[19].content.value", type: text, hint: "Party date",          default: "Saturday, July 25th" }
  - { id: time,          path: "layers[20].content.value", type: text, hint: "Party time",          default: "2:00 — 5:00 PM" }
  - { id: venue,         path: "layers[21].content.value", type: text, hint: "Venue / address",     default: "Riverside Park Pavilion · 84 Elm Street" }
  - { id: rsvp_contact,  path: "layers[22].content.value", type: text, hint: "RSVP contact info",   default: "RSVP by July 15 · text Mia at (555) 219-0648" }
