_protocol: template/v1

# Single-page market trend poster. LinkedIn 4:5 portrait.
# Eyebrow, headline, mini bar-chart (5 rects), 3 caption cards.
meta:
  id: tmpl-market-trend-poster
  name: Market Trend Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, finance, market, trend, chart, 4-5]
  description: "LinkedIn 4:5 market trend poster with headline, inline bar chart, and 3 caption cards."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 14
    fill: { type: solid, color: "$primary" }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1110
    cy: 130
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "MARKET TREND" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: headline
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "AI is eating\ncustomer support." }
    style:
      font_family: $heading
      font_size: 104
      font_weight: 900
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: chart-label
    type: text
    z: 22
    x: 80
    y: 500
    width: 1040
    height: 0
    content: { type: plain, value: "AI-RESOLVED TICKETS · 2022-2026" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: chart-baseline
    type: rect
    z: 25
    x: 80
    y: 800
    width: 1040
    height: 2
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.4

  - id: bar-1
    type: rect
    z: 30
    x: 100
    y: 720
    width: 160
    height: 80
    radius: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.45

  - id: bar-2
    type: rect
    z: 30
    x: 300
    y: 670
    width: 160
    height: 130
    radius: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.6

  - id: bar-3
    type: rect
    z: 30
    x: 500
    y: 590
    width: 160
    height: 210
    radius: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.75

  - id: bar-4
    type: rect
    z: 30
    x: 700
    y: 490
    width: 160
    height: 310
    radius: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.9

  - id: bar-5
    type: rect
    z: 30
    x: 900
    y: 370
    width: 160
    height: 430
    radius: 6
    fill: { type: solid, color: "$primary" }

  - id: bar-1-label
    type: text
    z: 35
    x: 100
    y: 820
    width: 160
    height: 0
    content: { type: plain, value: "2022" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center }

  - id: bar-2-label
    type: text
    z: 35
    x: 300
    y: 820
    width: 160
    height: 0
    content: { type: plain, value: "2023" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center }

  - id: bar-3-label
    type: text
    z: 35
    x: 500
    y: 820
    width: 160
    height: 0
    content: { type: plain, value: "2024" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center }

  - id: bar-4-label
    type: text
    z: 35
    x: 700
    y: 820
    width: 160
    height: 0
    content: { type: plain, value: "2025" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center }

  - id: bar-5-label
    type: text
    z: 35
    x: 900
    y: 820
    width: 160
    height: 0
    content: { type: plain, value: "2026E" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, text_align: center }

  - id: card-1-bg
    type: rect
    z: 40
    x: 80
    y: 920
    width: 330
    height: 360
    radius: 16
    fill: { type: solid, color: "$surface" }

  - id: card-1-label
    type: text
    z: 41
    x: 110
    y: 950
    width: 270
    height: 0
    content: { type: plain, value: "SAMPLE STAT" }
    style: { font_family: $mono, font_size: 12, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }

  - id: card-1-value
    type: text
    z: 42
    x: 110
    y: 990
    width: 270
    height: 0
    content: { type: plain, value: "63%" }
    style: { font_family: $heading, font_size: 88, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }

  - id: card-1-body
    type: text
    z: 43
    x: 110
    y: 1120
    width: 270
    height: 0
    content: { type: plain, value: "of tier-1 tickets now resolved without a human." }
    style: { font_family: $body, font_size: 18, color: $text, line_height: 1.45 }

  - id: card-2-bg
    type: rect
    z: 40
    x: 435
    y: 920
    width: 330
    height: 360
    radius: 16
    fill: { type: solid, color: "$surface" }

  - id: card-2-label
    type: text
    z: 41
    x: 465
    y: 950
    width: 270
    height: 0
    content: { type: plain, value: "WHAT'S CHANGING" }
    style: { font_family: $mono, font_size: 12, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }

  - id: card-2-headline
    type: text
    z: 42
    x: 465
    y: 990
    width: 270
    height: 0
    content: { type: plain, value: "Agents replace scripts." }
    style: { font_family: $heading, font_size: 30, font_weight: 800, color: $text, line_height: 1.15, letter_spacing: -0.02 }

  - id: card-2-body
    type: text
    z: 43
    x: 465
    y: 1100
    width: 270
    height: 0
    content: { type: plain, value: "LLMs handle multi-turn troubleshooting that flowcharts never could." }
    style: { font_family: $body, font_size: 18, color: $text, line_height: 1.45 }

  - id: card-3-bg
    type: rect
    z: 40
    x: 790
    y: 920
    width: 330
    height: 360
    radius: 16
    fill: { type: solid, color: "$surface" }

  - id: card-3-label
    type: text
    z: 41
    x: 820
    y: 950
    width: 270
    height: 0
    content: { type: plain, value: "WHAT'S NEXT" }
    style: { font_family: $mono, font_size: 12, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }

  - id: card-3-headline
    type: text
    z: 42
    x: 820
    y: 990
    width: 270
    height: 0
    content: { type: plain, value: "Agents-as-service pricing." }
    style: { font_family: $heading, font_size: 30, font_weight: 800, color: $text, line_height: 1.15, letter_spacing: -0.02 }

  - id: card-3-body
    type: text
    z: 43
    x: 820
    y: 1100
    width: 270
    height: 0
    content: { type: plain, value: "Per-resolution billing displaces per-seat across $40B in CX spend." }
    style: { font_family: $body, font_size: 18, color: $text, line_height: 1.45 }

  - id: footer
    type: text
    z: 50
    x: 80
    y: 1380
    width: 800
    height: 0
    content: { type: plain, value: "Source: industry analyst composite · @yourhandle" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, line_height: 1.4 }

  - id: page-mark
    type: text
    z: 51
    x: 880
    y: 1380
    width: 240
    height: 0
    content: { type: plain, value: "17 MAY 2026" }
    style: { font_family: $mono, font_size: 14, font_weight: 600, color: $text_muted, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.25 }
  headline:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  bar-1:
    enter: { type: slide_up, duration: 600, delay: 400, easing: ease-out }
  bar-2:
    enter: { type: slide_up, duration: 600, delay: 500, easing: ease-out }
  bar-3:
    enter: { type: slide_up, duration: 600, delay: 600, easing: ease-out }
  bar-4:
    enter: { type: slide_up, duration: 600, delay: 700, easing: ease-out }
  bar-5:
    enter: { type: slide_up, duration: 600, delay: 800, easing: ease-out }
  card-1-bg:
    enter: { type: fade_up, duration: 600, delay: 1000, easing: ease-out }
  card-2-bg:
    enter: { type: fade_up, duration: 600, delay: 1150, easing: ease-out }
  card-3-bg:
    enter: { type: fade_up, duration: 600, delay: 1300, easing: ease-out }

slots:
  - { id: eyebrow,         path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",          default: "MARKET TREND" }
  - { id: headline,        path: "layers[4].content.value",  type: text, hint: "Main headline",       default: "AI is eating\ncustomer support." }
  - { id: chart_label,     path: "layers[5].content.value",  type: text, hint: "Chart label",         default: "AI-RESOLVED TICKETS · 2022-2026" }
  - { id: card_1_value,    path: "layers[19].content.value", type: text, hint: "Card 1 · stat value", default: "63%" }
  - { id: card_1_body,     path: "layers[20].content.value", type: text, hint: "Card 1 · body",       default: "of tier-1 tickets now resolved without a human." }
  - { id: card_2_headline, path: "layers[23].content.value", type: text, hint: "Card 2 · headline",   default: "Agents replace scripts." }
  - { id: card_2_body,     path: "layers[24].content.value", type: text, hint: "Card 2 · body",       default: "LLMs handle multi-turn troubleshooting that flowcharts never could." }
  - { id: card_3_headline, path: "layers[27].content.value", type: text, hint: "Card 3 · headline",   default: "Agents-as-service pricing." }
  - { id: card_3_body,     path: "layers[28].content.value", type: text, hint: "Card 3 · body",       default: "Per-resolution billing displaces per-seat across $40B in CX spend." }
  - { id: footer,          path: "layers[29].content.value", type: text, hint: "Footer line",         default: "Source: industry analyst composite · @yourhandle" }
