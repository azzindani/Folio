_protocol: template/v1

# Marathon bib number — 1500×1000 landscape, high-contrast theme.
# Race name + date eyebrow, BIB NUMBER HUGE center, runner name,
# distance pill, tear strip with sponsor logos band at bottom.
meta:
  id: tmpl-marathon-bib
  name: Marathon Bib Number
  type: ticket
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [marathon, race, bib, running, ticket, landscape, high-contrast]
  description: "Marathon bib with race name + date, huge BIB NUMBER, runner name, distance badge, tear strip, and sponsor logos band."

document:
  width: 1500
  height: 1000
  unit: px
  dpi: 96

theme:
  ref: high-contrast

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 1000
    fill: { type: solid, color: "$background" }

  # ── Top accent + side rails ───────────────────────────────
  - id: top-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1500
    height: 16
    fill: { type: solid, color: "$primary" }

  - id: bot-band
    type: rect
    z: 2
    x: 0
    y: 760
    width: 1500
    height: 8
    fill: { type: solid, color: "$primary" }

  - id: left-rail
    type: rect
    z: 3
    x: 0
    y: 16
    width: 16
    height: 744
    fill: { type: solid, color: "$text" }

  - id: right-rail
    type: rect
    z: 4
    x: 1484
    y: 16
    width: 16
    height: 744
    fill: { type: solid, color: "$text" }

  # ── Eyebrow: race name + date ─────────────────────────────
  - id: race-name
    type: text
    z: 10
    x: 60
    y: 60
    width: 1380
    height: 0
    content: { type: plain, value: "PACIFIC COAST MARATHON" }
    style:
      font_family: $heading
      font_size: 38
      font_weight: 900
      color: "$text"
      text_align: center
      letter_spacing: 0.06

  - id: race-date
    type: text
    z: 11
    x: 60
    y: 115
    width: 1380
    height: 0
    content: { type: plain, value: "OCTOBER 12, 2026  ·  SAN FRANCISCO, CA" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 700
      color: "$primary"
      text_align: center
      letter_spacing: 0.4

  - id: header-rule
    type: rect
    z: 12
    x: 450
    y: 165
    width: 600
    height: 4
    fill: { type: solid, color: "$text" }

  # ── BIB NUMBER HUGE ───────────────────────────────────────
  - id: bib-number
    type: text
    z: 20
    x: 60
    y: 210
    width: 1380
    height: 0
    content: { type: plain, value: "4287" }
    style:
      font_family: $heading
      font_size: 380
      font_weight: 900
      color: "$text"
      text_align: center
      line_height: 1
      letter_spacing: -0.04

  # ── Runner name ───────────────────────────────────────────
  - id: runner-name
    type: text
    z: 30
    x: 60
    y: 600
    width: 1380
    height: 0
    content: { type: plain, value: "MARIA OKONKWO" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: "$primary"
      text_align: center
      line_height: 1.1
      letter_spacing: 0.04

  # ── Distance badge ────────────────────────────────────────
  - id: dist-pill
    type: rect
    z: 40
    x: 600
    y: 680
    width: 300
    height: 60
    radius: 30
    fill: { type: solid, color: "$text" }

  - id: dist-text
    type: text
    z: 41
    x: 600
    y: 696
    width: 300
    height: 0
    content: { type: plain, value: "26.2 MI · FULL" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: "$background"
      text_align: center
      letter_spacing: 0.1

  # ── Tear strip (perforated divider) ───────────────────────
  - id: tear-line-1
    type: line
    z: 50
    x1: 30
    y1: 800
    x2: 1470
    y2: 800
    stroke: { color: "$text", width: 2, dash: [12, 8] }

  - id: tear-label
    type: text
    z: 51
    x: 60
    y: 815
    width: 1380
    height: 0
    content: { type: plain, value: "✁  TEAR HERE  ·  FINISH LINE CHIP" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3
      text_transform: uppercase

  # ── Sponsor logos band ────────────────────────────────────
  - id: sp-band
    type: rect
    z: 60
    x: 0
    y: 850
    width: 1500
    height: 150
    fill: { type: solid, color: "$surface" }

  - id: sp-label
    type: text
    z: 61
    x: 0
    y: 865
    width: 1500
    height: 0
    content: { type: plain, value: "PROUDLY SPONSORED BY" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 800
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.5

  - id: sp1-box
    type: rect
    z: 62
    x: 100
    y: 895
    width: 220
    height: 80
    radius: 6
    fill: { type: solid, color: "$background" }
    stroke: { color: "$border", width: 1 }

  - id: sp1-text
    type: text
    z: 63
    x: 100
    y: 920
    width: 220
    height: 0
    content: { type: plain, value: "NIKE" }
    style: { font_family: $heading, font_size: 28, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.1 }

  - id: sp2-box
    type: rect
    z: 64
    x: 380
    y: 895
    width: 220
    height: 80
    radius: 6
    fill: { type: solid, color: "$background" }
    stroke: { color: "$border", width: 1 }

  - id: sp2-text
    type: text
    z: 65
    x: 380
    y: 920
    width: 220
    height: 0
    content: { type: plain, value: "GATORADE" }
    style: { font_family: $heading, font_size: 26, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.1 }

  - id: sp3-box
    type: rect
    z: 66
    x: 660
    y: 895
    width: 180
    height: 80
    radius: 6
    fill: { type: solid, color: "$background" }
    stroke: { color: "$border", width: 1 }

  - id: sp3-text
    type: text
    z: 67
    x: 660
    y: 920
    width: 180
    height: 0
    content: { type: plain, value: "GARMIN" }
    style: { font_family: $heading, font_size: 26, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.1 }

  - id: sp4-box
    type: rect
    z: 68
    x: 900
    y: 895
    width: 220
    height: 80
    radius: 6
    fill: { type: solid, color: "$background" }
    stroke: { color: "$border", width: 1 }

  - id: sp4-text
    type: text
    z: 69
    x: 900
    y: 920
    width: 220
    height: 0
    content: { type: plain, value: "STRAVA" }
    style: { font_family: $heading, font_size: 26, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.1 }

  - id: sp5-box
    type: rect
    z: 70
    x: 1180
    y: 895
    width: 220
    height: 80
    radius: 6
    fill: { type: solid, color: "$background" }
    stroke: { color: "$border", width: 1 }

  - id: sp5-text
    type: text
    z: 71
    x: 1180
    y: 920
    width: 220
    height: 0
    content: { type: plain, value: "ASICS" }
    style: { font_family: $heading, font_size: 26, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.1 }

slots:
  - { id: race_name,   path: "layers[5].content.value",  type: text, hint: "Race name",       default: "PACIFIC COAST MARATHON" }
  - { id: race_date,   path: "layers[6].content.value",  type: text, hint: "Race date + city", default: "OCTOBER 12, 2026  ·  SAN FRANCISCO, CA" }
  - { id: bib_number,  path: "layers[8].content.value",  type: text, hint: "BIB number (huge)", default: "4287" }
  - { id: runner_name, path: "layers[9].content.value",  type: text, hint: "Runner full name",  default: "MARIA OKONKWO" }
  - { id: distance,    path: "layers[11].content.value", type: text, hint: "Race distance",     default: "26.2 MI · FULL" }
