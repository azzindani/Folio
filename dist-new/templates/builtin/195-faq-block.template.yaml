_protocol: template/v1

# FAQ section — 1080×1920 portrait, light-clean theme.
# Headline + 5 real-sounding SaaS Q&A pairs.
meta:
  id: tmpl-faq-block
  name: FAQ Block
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, app, screen, faq, help, portrait, light]
  description: "Frequently-asked-questions section with five Q&A pairs in a clean stacked layout."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 100
    width: 920
    height: 0
    content: { type: plain, value: "SUPPORT" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      letter_spacing: 0.32

  # ── Headline ──────────────────────────────────────────────
  - id: headline
    type: text
    z: 11
    x: 80
    y: 140
    width: 920
    height: 0
    content: { type: plain, value: "Frequently Asked\nQuestions" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.025

  # ── Q1 ────────────────────────────────────────────────────
  - id: q1-rule
    type: rect
    z: 20
    x: 80
    y: 360
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: q1-num
    type: text
    z: 21
    x: 80
    y: 390
    width: 920
    height: 0
    content: { type: plain, value: "01" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.15

  - id: q1-q
    type: text
    z: 22
    x: 80
    y: 420
    width: 920
    height: 0
    content: { type: plain, value: "Can I cancel my subscription anytime?" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: q1-a
    type: text
    z: 23
    x: 80
    y: 472
    width: 920
    height: 0
    content: { type: plain, value: "Yes. Cancel from Settings → Billing at any time. Your plan stays active until the end of the current period." }
    style:
      font_family: $body
      font_size: 19
      color: $text_muted
      line_height: 1.55

  # ── Q2 ────────────────────────────────────────────────────
  - id: q2-rule
    type: rect
    z: 30
    x: 80
    y: 620
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: q2-num
    type: text
    z: 31
    x: 80
    y: 650
    width: 920
    height: 0
    content: { type: plain, value: "02" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.15

  - id: q2-q
    type: text
    z: 32
    x: 80
    y: 680
    width: 920
    height: 0
    content: { type: plain, value: "Do you offer a free trial?" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: q2-a
    type: text
    z: 33
    x: 80
    y: 732
    width: 920
    height: 0
    content: { type: plain, value: "Every paid plan starts with a 14-day free trial. No credit card required — we'll email you before the trial ends." }
    style:
      font_family: $body
      font_size: 19
      color: $text_muted
      line_height: 1.55

  # ── Q3 ────────────────────────────────────────────────────
  - id: q3-rule
    type: rect
    z: 40
    x: 80
    y: 880
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: q3-num
    type: text
    z: 41
    x: 80
    y: 910
    width: 920
    height: 0
    content: { type: plain, value: "03" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.15

  - id: q3-q
    type: text
    z: 42
    x: 80
    y: 940
    width: 920
    height: 0
    content: { type: plain, value: "Is my data private and secure?" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: q3-a
    type: text
    z: 43
    x: 80
    y: 992
    width: 920
    height: 0
    content: { type: plain, value: "All data is encrypted in transit (TLS 1.3) and at rest (AES-256). We are SOC 2 Type II audited and GDPR-compliant." }
    style:
      font_family: $body
      font_size: 19
      color: $text_muted
      line_height: 1.55

  # ── Q4 ────────────────────────────────────────────────────
  - id: q4-rule
    type: rect
    z: 50
    x: 80
    y: 1140
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: q4-num
    type: text
    z: 51
    x: 80
    y: 1170
    width: 920
    height: 0
    content: { type: plain, value: "04" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.15

  - id: q4-q
    type: text
    z: 52
    x: 80
    y: 1200
    width: 920
    height: 0
    content: { type: plain, value: "Can I switch plans later?" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: q4-a
    type: text
    z: 53
    x: 80
    y: 1252
    width: 920
    height: 0
    content: { type: plain, value: "Upgrade or downgrade anytime from your dashboard. Pro-rated charges and credits are applied automatically." }
    style:
      font_family: $body
      font_size: 19
      color: $text_muted
      line_height: 1.55

  # ── Q5 ────────────────────────────────────────────────────
  - id: q5-rule
    type: rect
    z: 60
    x: 80
    y: 1400
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: q5-num
    type: text
    z: 61
    x: 80
    y: 1430
    width: 920
    height: 0
    content: { type: plain, value: "05" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.15

  - id: q5-q
    type: text
    z: 62
    x: 80
    y: 1460
    width: 920
    height: 0
    content: { type: plain, value: "Do you offer discounts for non-profits or students?" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: q5-a
    type: text
    z: 63
    x: 80
    y: 1532
    width: 920
    height: 0
    content: { type: plain, value: "Yes — 50% off for verified non-profits and accredited educational institutions. Email support@acme.com to apply." }
    style:
      font_family: $body
      font_size: 19
      color: $text_muted
      line_height: 1.55

  # ── Bottom rule + CTA ─────────────────────────────────────
  - id: bottom-rule
    type: rect
    z: 70
    x: 80
    y: 1680
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: more-text
    type: text
    z: 71
    x: 80
    y: 1730
    width: 920
    height: 0
    content: { type: plain, value: "Still have questions?" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      text_align: center

  - id: more-cta
    type: text
    z: 72
    x: 80
    y: 1770
    width: 920
    height: 0
    content: { type: plain, value: "Talk to support  →" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 700
      color: $primary
      text_align: center

slots:
  - { id: section_title, path: "layers[2].content.value", type: text, hint: "Section title (2 lines)", default: "Frequently Asked\nQuestions" }
