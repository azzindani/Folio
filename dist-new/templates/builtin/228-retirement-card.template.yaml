_protocol: template/v1

# Retirement card — 1080×1500 portrait, editorial-cream theme.
# Elegant script headline, retiree name, years-of-service, thank-you message, signature row.
meta:
  id: tmpl-retirement-card
  name: Retirement Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, greeting, retirement, congratulations, elegant, cream, portrait]
  description: "Elegant retirement card with retiree name, years-of-service highlight, and a heartfelt thank-you message."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1 outer frame
  - { id: outer-frame, type: rect, z: 1, x: 60, y: 60, width: 960, height: 1380, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 2 inner frame
  - { id: inner-frame, type: rect, z: 2, x: 78, y: 78, width: 924, height: 1344, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }

  # 3 top ornament
  - { id: orn-top, type: text, z: 5, x: 80, y: 220, width: 920, height: 0, content: { type: plain, value: "❦  ·  ✦  ·  ❦" }, style: { font_family: $heading, font_size: 30, color: "$primary", text_align: center, letter_spacing: 0.4 } }

  # 4 eyebrow
  - { id: eyebrow, type: text, z: 10, x: 80, y: 320, width: 920, height: 0, content: { type: plain, value: "HAPPY RETIREMENT" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.8, text_transform: uppercase } }

  # 5 headline italic script
  - { id: headline, type: text, z: 11, x: 80, y: 400, width: 920, height: 0, content: { type: plain, value: "Cheers to the\nnext chapter" }, style: { font_family: $heading, font_size: 78, font_weight: 400, font_style: italic, color: "$primary", text_align: center, line_height: 1.1, letter_spacing: -0.01 } }

  # 6 divider
  - { id: divider, type: rect, z: 12, x: 490, y: 620, width: 100, height: 1, fill: { type: solid, color: "$primary" } }

  # 7 retiree label
  - { id: retiree-lbl, type: text, z: 20, x: 80, y: 660, width: 920, height: 0, content: { type: plain, value: "CELEBRATING" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.6 } }
  # 8 retiree name
  - { id: retiree, type: text, z: 21, x: 80, y: 700, width: 920, height: 0, content: { type: plain, value: "Susan Bellamy" }, style: { font_family: $heading, font_size: 56, font_weight: 600, color: "$text", text_align: center, line_height: 1.2 } }

  # 9 service line
  - { id: service, type: text, z: 22, x: 80, y: 800, width: 920, height: 0, content: { type: plain, value: "AFTER 35 YEARS OF SERVICE" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.6 } }

  # 10 divider 2
  - { id: divider-2, type: rect, z: 23, x: 490, y: 870, width: 100, height: 1, fill: { type: solid, color: "$primary" } }

  # 11 message
  - { id: message, type: text, z: 30, x: 160, y: 920, width: 760, height: 0, content: { type: plain, value: "Three and a half decades of patient guidance, steady judgment, and a quiet generosity that shaped every desk in this building. You leave a legacy in the work, in the people you mentored, and in the standards you set. Enjoy the garden, the grandkids, and the very long lunches you have earned." }, style: { font_family: $body, font_size: 20, color: "$text", text_align: center, line_height: 1.7, font_style: italic } }

  # 12 signoff label
  - { id: signoff-lbl, type: text, z: 31, x: 80, y: 1300, width: 920, height: 0, content: { type: plain, value: "WITH GRATITUDE FROM" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.6 } }
  # 13 signed by
  - { id: signed, type: text, z: 32, x: 80, y: 1340, width: 920, height: 0, content: { type: plain, value: "the entire Marlowe & Finch team" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: center, line_height: 1.3 } }

slots:
  - { id: retiree_name,     path: "layers[8].content.value",  type: text, hint: "Retiree name",          default: "Susan Bellamy" }
  - { id: years_of_service, path: "layers[9].content.value",  type: text, hint: "Years of service line", default: "AFTER 35 YEARS OF SERVICE" }
  - { id: message,          path: "layers[11].content.value", type: text, hint: "Thank-you message",     default: "Three and a half decades of patient guidance, steady judgment, and a quiet generosity that shaped every desk in this building. You leave a legacy in the work, in the people you mentored, and in the standards you set. Enjoy the garden, the grandkids, and the very long lunches you have earned." }
  - { id: signed_by,        path: "layers[13].content.value", type: text, hint: "Signed by",             default: "the entire Marlowe & Finch team" }
