_protocol: template/v1

# Yoga studio weekly schedule — 1080×1920 portrait, pastel-dream theme.
# Studio name top, weekday header strip, 5 daily class slots
# (time · class · instructor). Soft, calming layout.
meta:
  id: tmpl-yoga-class-schedule
  name: Yoga Class Schedule
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [yoga, schedule, wellness, studio, poster, portrait, pastel]
  description: "Weekly yoga class schedule with studio name, week-of date, and 5 daily class slots showing time, style, and instructor."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  - id: bg-blob
    type: circle
    z: 1
    cx: 900
    cy: 200
    rx: 260
    ry: 260
    fill: { type: solid, color: "$accent" }
    opacity: 0.18

  - id: bg-blob-2
    type: circle
    z: 2
    cx: 180
    cy: 1720
    rx: 200
    ry: 200
    fill: { type: solid, color: "$primary" }
    opacity: 0.12

  # ── Masthead ──────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 160
    width: 920
    height: 0
    content: { type: plain, value: "WEEKLY SCHEDULE · WEEK OF MAY 18" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.4
      text_transform: uppercase

  - id: studio-name
    type: text
    z: 11
    x: 80
    y: 210
    width: 920
    height: 0
    content: { type: plain, value: "Lotus & Light Yoga" }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 600
      font_style: italic
      color: $primary
      text_align: center
      line_height: 1
      letter_spacing: -0.01

  - id: studio-sub
    type: text
    z: 12
    x: 80
    y: 320
    width: 920
    height: 0
    content: { type: plain, value: "breathe · move · restore" }
    style:
      font_family: $body
      font_size: 18
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.3

  # ── Weekday header row ────────────────────────────────────
  - id: header-band
    type: rect
    z: 20
    x: 60
    y: 410
    width: 960
    height: 70
    radius: 16
    fill: { type: solid, color: "$primary" }

  - id: header-days
    type: text
    z: 21
    x: 60
    y: 432
    width: 960
    height: 0
    content: { type: plain, value: "MON   ·   TUE   ·   WED   ·   THU   ·   FRI   ·   SAT   ·   SUN" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 700
      color: "#FFFFFF"
      text_align: center
      letter_spacing: 0.2
      line_height: 1.3

  # ── Class slot 1 ──────────────────────────────────────────
  - id: slot1-bg
    type: rect
    z: 30
    x: 60
    y: 520
    width: 960
    height: 220
    radius: 20
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: slot1-time
    type: text
    z: 31
    x: 100
    y: 555
    width: 320
    height: 0
    content: { type: plain, value: "7:00 AM" }
