  - { id: week_of_date,  path: "layers[4].content.value",  type: text, hint: "Week-of eyebrow line",   default: "WEEKLY SCHEDULE · WEEK OF MAY 18" }
  - { id: slot1_time,    path: "layers[10].content.value", type: text, hint: "Slot 1 time",            default: "7:00 AM" }
