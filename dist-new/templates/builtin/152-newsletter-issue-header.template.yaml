_protocol: template/v1

# Newsletter masthead — 1200×800 landscape, editorial-cream theme.
# Email-newsletter top banner with publication name big serif,
# issue number + date row, accent rule, then a 4-row table of
# contents (article title + read-time on each line).
meta:
  id: tmpl-newsletter-issue-header
  name: Newsletter Issue Header
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [newsletter, email, masthead, editorial, cream, landscape]
  description: "Email newsletter masthead with publication name, issue number, date, and a 4-article table of contents."

document:
  width: 1200
  height: 800
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 800
    fill: { type: solid, color: "$background" }

  # ── Top hairline ──────────────────────────────────────────
  - id: top-rule
    type: rect
    z: 1
    x: 60
    y: 60
    width: 1080
    height: 2
    fill: { type: solid, color: "$text" }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 5
    x: 60
    y: 80
    width: 1080
    height: 0
    content: { type: plain, value: "WEEKLY DISPATCH" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.48
      text_transform: uppercase

  # ── Publication name (display serif) ──────────────────────
  - id: publication
    type: text
    z: 10
    x: 60
    y: 120
    width: 1080
    height: 0
    content: { type: plain, value: "The Marginal" }
    style:
      font_family: $heading
      font_size: 120
      font_weight: 700
      color: $text
      line_height: 1
      letter_spacing: -0.03
      font_style: italic

  # ── Issue + date row ──────────────────────────────────────
  - id: issue-num
    type: text
    z: 11
    x: 60
    y: 270
    width: 540
    height: 0
    content: { type: plain, value: "Issue Nº 47" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      letter_spacing: 0.04
      line_height: 1.3

  - id: date
    type: text
    z: 12
    x: 60
    y: 270
    width: 1080
    height: 0
    content: { type: plain, value: "May 16, 2026" }
    style:
      font_family: $body
      font_size: 22
      font_style: italic
      color: $text_muted
      text_align: right
      line_height: 1.3

  # ── Accent rule under masthead ────────────────────────────
  - id: accent-rule
    type: rect
    z: 13
    x: 60
    y: 320
    width: 80
    height: 6
    fill: { type: solid, color: "$primary" }

  - id: full-rule
    type: rect
    z: 14
    x: 60
    y: 324
    width: 1080
    height: 1
    fill: { type: solid, color: "$border" }

  # ── In this issue header ──────────────────────────────────
  - id: toc-header
    type: text
    z: 20
    x: 60
    y: 360
    width: 1080
    height: 0
    content: { type: plain, value: "IN THIS ISSUE" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  # ── Article 1 ─────────────────────────────────────────────
  - id: a1-num
    type: text
    z: 30
    x: 60
    y: 410
    width: 60
    height: 0
    content: { type: plain, value: "01" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $primary
      line_height: 1.4

  - id: a1-title
    type: text
    z: 31
    x: 130
    y: 412
    width: 880
    height: 0
    content: { type: plain, value: "The quiet collapse of the open-source maintainer" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.4

  - id: a1-time
    type: text
    z: 32
    x: 60
    y: 416
    width: 1080
    height: 0
    content: { type: plain, value: "12 min" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: right
      line_height: 1.4

  # ── Article 2 ─────────────────────────────────────────────
  - id: a2-num
    type: text
    z: 33
    x: 60
    y: 480
    width: 60
    height: 0
    content: { type: plain, value: "02" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $primary
      line_height: 1.4

  - id: a2-title
    type: text
    z: 34
    x: 130
    y: 482
    width: 880
    height: 0
    content: { type: plain, value: "Why every team eventually rewrites their notification system" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.4

  - id: a2-time
    type: text
    z: 35
    x: 60
    y: 486
    width: 1080
    height: 0
    content: { type: plain, value: "8 min" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: right
      line_height: 1.4

  # ── Article 3 ─────────────────────────────────────────────
  - id: a3-num
    type: text
    z: 36
    x: 60
    y: 550
    width: 60
    height: 0
    content: { type: plain, value: "03" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $primary
      line_height: 1.4

  - id: a3-title
    type: text
    z: 37
    x: 130
    y: 552
    width: 880
    height: 0
    content: { type: plain, value: "Field notes from three months without a calendar app" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.4

  - id: a3-time
    type: text
    z: 38
    x: 60
    y: 556
    width: 1080
    height: 0
    content: { type: plain, value: "5 min" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: right
      line_height: 1.4

  # ── Article 4 ─────────────────────────────────────────────
  - id: a4-num
    type: text
    z: 39
    x: 60
    y: 620
    width: 60
    height: 0
    content: { type: plain, value: "04" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $primary
      line_height: 1.4

  - id: a4-title
    type: text
    z: 40
    x: 130
    y: 622
    width: 880
    height: 0
    content: { type: plain, value: "A short defense of writing your own static site generator" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.4

  - id: a4-time
    type: text
    z: 41
    x: 60
    y: 626
    width: 1080
    height: 0
    content: { type: plain, value: "9 min" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: right
      line_height: 1.4

  # ── Bottom rule ───────────────────────────────────────────
  - id: bottom-rule
    type: rect
    z: 50
    x: 60
    y: 700
    width: 1080
    height: 1
    fill: { type: solid, color: "$border" }

  - id: footer
    type: text
    z: 51
    x: 60
    y: 730
    width: 1080
    height: 0
    content: { type: plain, value: "themarginal.email  ·  Reply to subscribe / unsubscribe" }
    style:
      font_family: $body
      font_size: 14
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.4

slots:
  - { id: publication_name, path: "layers[3].content.value",  type: text, hint: "Publication name (big)",  default: "The Marginal" }
  - { id: issue_number,     path: "layers[4].content.value",  type: text, hint: "Issue number",            default: "Issue Nº 47" }
  - { id: date,             path: "layers[5].content.value",  type: text, hint: "Issue date",              default: "May 16, 2026" }
  - { id: article_1,        path: "layers[10].content.value", type: text, hint: "Article 1 title",         default: "The quiet collapse of the open-source maintainer" }
  - { id: article_2,        path: "layers[13].content.value", type: text, hint: "Article 2 title",         default: "Why every team eventually rewrites their notification system" }
  - { id: article_3,        path: "layers[16].content.value", type: text, hint: "Article 3 title",         default: "Field notes from three months without a calendar app" }
  - { id: article_4,        path: "layers[19].content.value", type: text, hint: "Article 4 title",         default: "A short defense of writing your own static site generator" }
