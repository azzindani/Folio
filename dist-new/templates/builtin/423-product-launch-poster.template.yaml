_protocol: template/v1

# Single-page product launch poster. LinkedIn 4:5 portrait.
# Eyebrow + big product name + subtitle + 3 highlight rows + CTA chip. Neon-bloom theme.
meta:
  id: tmpl-product-launch-poster
  name: Product Launch Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, startup, founder, launch, product, 4-5, neon-bloom]
  description: "LinkedIn 4:5 product launch poster: product name, subtitle, 3 highlight rows, and a CTA chip."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: neon-bloom

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }

  - { id: accent-glow, type: circle, z: 4, cx: 1080, cy: 200, rx: 180, ry: 180, fill: { type: solid, color: "$accent" }, opacity: 0.18 }

  - { id: accent-dot, type: circle, z: 5, cx: 1110, cy: 130, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "LAUNCHING TODAY" }
    style:
      font_family: $mono
      font_size: 20
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: product-name
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "Folio Studio" }
    style:
      font_family: $heading
      font_size: 104
      font_weight: 900
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: subtitle
    type: text
    z: 22
    x: 80
    y: 360
    width: 1040
    height: 0
    content: { type: plain, value: "Local-first design tooling that respects your YAML." }
    style:
      font_family: $body
      font_size: 32
      color: $text_muted
      line_height: 1.4

  - { id: divider-1, type: rect, z: 10, x: 80, y: 540, width: 1040, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }

  - { id: row-1-icon-bg, type: circle, z: 30, cx: 130, cy: 640, rx: 36, ry: 36, fill: { type: solid, color: "$primary" } }
  - id: row-1-icon
    type: text
    z: 31
    x: 80
    y: 620
    width: 100
    height: 0
    content: { type: plain, value: "◆" }
    style: { font_family: $heading, font_size: 32, font_weight: 800, color: "#FFFFFF", text_align: center }
  - id: row-1-text
    type: text
    z: 32
    x: 200
    y: 622
    width: 920
    height: 0
    content: { type: plain, value: "Files on your disk — never on someone else's server." }
    style: { font_family: $body, font_size: 30, font_weight: 600, color: $text, line_height: 1.45 }

  - { id: row-2-icon-bg, type: circle, z: 30, cx: 130, cy: 800, rx: 36, ry: 36, fill: { type: solid, color: "$primary" } }
  - id: row-2-icon
    type: text
    z: 31
    x: 80
    y: 780
    width: 100
    height: 0
    content: { type: plain, value: "▲" }
    style: { font_family: $heading, font_size: 32, font_weight: 800, color: "#FFFFFF", text_align: center }
  - id: row-2-text
    type: text
    z: 32
    x: 200
    y: 782
    width: 920
    height: 0
    content: { type: plain, value: "LLM-first: every layer is a token, not a click." }
    style: { font_family: $body, font_size: 30, font_weight: 600, color: $text, line_height: 1.45 }

  - { id: row-3-icon-bg, type: circle, z: 30, cx: 130, cy: 960, rx: 36, ry: 36, fill: { type: solid, color: "$primary" } }
  - id: row-3-icon
    type: text
    z: 31
    x: 80
    y: 940
    width: 100
    height: 0
    content: { type: plain, value: "●" }
    style: { font_family: $heading, font_size: 32, font_weight: 800, color: "#FFFFFF", text_align: center }
  - id: row-3-text
    type: text
    z: 32
    x: 200
    y: 942
    width: 920
    height: 0
    content: { type: plain, value: "Carousels, posters, decks — one engine, one YAML." }
    style: { font_family: $body, font_size: 30, font_weight: 600, color: $text, line_height: 1.45 }

  - { id: divider-2, type: rect, z: 10, x: 80, y: 1100, width: 1040, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }

  - id: pricing-label
    type: text
    z: 50
    x: 80
    y: 1140
    width: 1040
    height: 0
    content: { type: plain, value: "FREE FOREVER · OPEN SOURCE" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }

  - id: pricing-detail
    type: text
    z: 51
    x: 80
    y: 1180
    width: 1040
    height: 0
    content: { type: plain, value: "MIT licensed. Self-host or use the hosted editor." }
    style: { font_family: $body, font_size: 22, color: $text, line_height: 1.45 }

  - { id: cta-bg, type: rect, z: 60, x: 80, y: 1280, width: 320, height: 80, radius: 40, fill: { type: solid, color: "$primary" } }
  - id: cta-text
    type: text
    z: 61
    x: 80
    y: 1306
    width: 320
    height: 0
    content: { type: plain, value: "Try free →" }
    style: { font_family: $body, font_size: 24, font_weight: 700, color: "#FFFFFF", text_align: center }

  - id: author
    type: text
    z: 70
    x: 80
    y: 1410
    width: 700
    height: 0
    content: { type: plain, value: "folio.studio · @folio" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, line_height: 1.4 }

  - id: page-mark
    type: text
    z: 71
    x: 880
    y: 1410
    width: 240
    height: 0
    content: { type: plain, value: "LAUNCH · 17 MAY 2026" }
    style: { font_family: $mono, font_size: 13, font_weight: 600, color: $text_muted, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  accent-dot:
    loop: { type: glow, duration: 2200, intensity: 1.5 }
  accent-glow:
    loop: { type: glow, duration: 3200, intensity: 1.2 }
  product-name:
    enter: { type: scale_in, duration: 700, delay: 100, easing: ease-out }
  subtitle:
    enter: { type: fade_up, duration: 600, delay: 350, easing: ease-out }
  row-1-text:
    enter: { type: fade_up, duration: 500, delay: 400, easing: ease-out }
  row-2-text:
    enter: { type: fade_up, duration: 500, delay: 600, easing: ease-out }
  row-3-text:
    enter: { type: fade_up, duration: 500, delay: 800, easing: ease-out }
  cta-bg:
    loop: { type: pulse, duration: 1800, scale: 1.05 }

slots:
  - { id: eyebrow,        path: "layers[4].content.value",  type: text, hint: "Eyebrow tag",        default: "LAUNCHING TODAY" }
  - { id: product_name,   path: "layers[5].content.value",  type: text, hint: "Product name",       default: "Folio Studio" }
  - { id: subtitle,       path: "layers[6].content.value",  type: text, hint: "Subtitle",           default: "Local-first design tooling that respects your YAML." }
  - { id: row_1_text,     path: "layers[10].content.value", type: text, hint: "Highlight 1",        default: "Files on your disk — never on someone else's server." }
  - { id: row_2_text,     path: "layers[13].content.value", type: text, hint: "Highlight 2",        default: "LLM-first: every layer is a token, not a click." }
  - { id: row_3_text,     path: "layers[16].content.value", type: text, hint: "Highlight 3",        default: "Carousels, posters, decks — one engine, one YAML." }
  - { id: pricing_detail, path: "layers[19].content.value", type: text, hint: "Pricing line",       default: "MIT licensed. Self-host or use the hosted editor." }
  - { id: cta_text,       path: "layers[21].content.value", type: text, hint: "CTA label",          default: "Try free →" }
  - { id: author,         path: "layers[22].content.value", type: text, hint: "Handle + URL",       default: "folio.studio · @folio" }
