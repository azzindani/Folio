        type: inline
        rows:
          - { bin: "0.0-0.3", control: 42, treatment: 12 }
          - { bin: "0.3-0.6", control: 64, treatment: 22 }
          - { bin: "0.6-0.9", control: 38, treatment: 38 }
          - { bin: "0.9-1.2", control: 22, treatment: 62 }
          - { bin: "1.2-1.5", control:  8, treatment: 48 }
          - { bin: "1.5-1.8", control:  4, treatment: 28 }
          - { bin: "1.8-2.1", control:  2, treatment: 14 }

pages:
  - id: paper
    label: Paper
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "JOURNAL OF METABOLIC MEDICINE · VOL. 47, ISSUE 3 · MAY 2026 · OPEN ACCESS"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 160
        format: markdown
        font_family: Playfair Display
        font_size: 38
        font_weight: 700
        line_height: 1.2
        content: |
          **Continuous Glucose Monitoring with Dietary Coaching in Type 2 Diabetes**

          *A 24-Week Randomized Controlled Trial*

      - id: authors
        type: rich_text
        x: 60
        y: 240
        width: 1160
        height: 60
        format: markdown
        font_family: Inter
        font_size: 14
        line_height: 1.6
        content: "**Authors:** S. Nakamura PhD¹, R. Patel MD¹, A. Lindqvist PhD², M. Okonkwo MD¹, J. Hernandez PhD³, T. Bergmann MD²\n¹Stanford School of Medicine · ²Karolinska Institute · ³Mayo Clinic · *Corresponding: nakamura@stanford.edu*"

      - id: kpi-sample
        type: kpi_card
        x: 60
        y: 320
        width: 280
        height: 140
        label: Sample Size (n)
        value: 412
        format: number

      - id: kpi-effect
        type: kpi_card
        x: 360
        y: 320
        width: 280
        height: 140
        label: Effect Size (Cohen d)
        value: 0.84
        format: number
        decimals: 2

      - id: kpi-pvalue
        type: kpi_card
        x: 660
        y: 320
        width: 280
        height: 140
        label: Primary p-value
        value: 0.001
        format: number
        decimals: 3

      - id: kpi-ci
        type: kpi_card
        x: 960
        y: 320
        width: 260
        height: 140
        label: 95% CI (HbA1c)
        value: 0.62
        format: number
        decimals: 2

      - id: section-methods
        type: rich_text
        x: 60
        y: 490
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Methods**"

      - id: methods-body
        type: rich_text
        x: 60
        y: 540
        width: 1160
        height: 320
        format: markdown
        font_family: Inter
        font_size: 15
        line_height: 1.7
        content: |
          **Design.** Prospective, multi-center, parallel-group randomized controlled trial conducted at three sites between June 2024 and April 2026. Participants were randomized 1:1 to intervention (continuous glucose monitor + biweekly dietary coaching) or control (standard diabetes care + quarterly clinic visits).

          **Participants.** Adults aged 30-70 with type 2 diabetes (HbA1c 7.5-10.0%), BMI 25-40 kg/m², stable medication regimen ≥3 months. Exclusion: insulin therapy, advanced renal disease (eGFR <45), pregnancy, prior bariatric surgery. Enrollment n=440, retained n=412 (94% completion).

          **Outcomes.** Primary outcome: change in HbA1c at 24 weeks. Secondary outcomes: fasting glucose, body weight, blood pressure, lipid profile, quality of life (SF-36), and adverse events. Analysis followed intention-to-treat; missing values imputed via multiple imputation (m=20).

          **Statistical analysis.** Between-group differences analyzed using mixed-effects models adjusted for baseline value, site, age, and sex. Significance threshold α=0.05 (two-sided). Effect sizes reported as Cohen's d with 95% confidence intervals.

      - id: section-results
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Key Results**"

      - id: tbl-results
        type: interactive_table
        x: 60
        y: 960
        width: 1160
        height: 440
        data_ref: key_results
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: measurement,   title: Measurement,        width: 380, sortable: true }
          - { field: control,       title: Control,            width: 140, sortable: true, formatter: number, align: right }
          - { field: treatment,     title: Treatment,          width: 140, sortable: true, formatter: number, align: right }
          - { field: delta,         title: Delta,              width: 140, sortable: true, formatter: number, align: right }
          - { field: p_value,       title: p-value,            width: 140, sortable: true, formatter: number, align: right }
          - { field: significance,  title: Significance,       width: 220, sortable: true, formatter: badge }

      - id: section-distribution
        type: rich_text
        x: 60
        y: 1440
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**HbA1c Change Distribution — Control vs Treatment**"

      - id: chart-distribution
        type: interactive_chart
        x: 60
        y: 1500
        width: 1160
        height: 340
        chart_type: bar
        data_ref: distribution
        x_field: bin
        y_field: treatment
        title: Frequency of HbA1c Reduction (% points) by Group
        legend: true
        grid: true
        animate: true

      - id: section-conclusions
        type: rich_text
        x: 60
        y: 1880
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Conclusions**"

      - id: conclusions-body
        type: rich_text
        x: 60
        y: 1930
        width: 1160
        height: 220
        format: markdown
        font_family: Inter
        font_size: 15
        line_height: 1.7
        content: |
          Continuous glucose monitoring combined with structured dietary coaching produced clinically and statistically significant improvements in glycemic control over 24 weeks compared with standard care. The mean HbA1c reduction of **0.86 percentage points** (95% CI 0.62-1.10) exceeds the 0.5-point threshold commonly cited as clinically meaningful, and was accompanied by favorable changes in body weight, lipid profile, and patient-reported quality of life.

          Adverse event rates did not differ significantly between groups, supporting the safety profile of the intervention. Limitations include the 24-week follow-up (longer-term durability remains to be established) and the predominantly urban academic-center population. Future research should examine cost-effectiveness, real-world adherence, and applicability to insulin-treated populations.

      - id: section-references
        type: rich_text
        x: 60
        y: 2180
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**References**"

      - id: references-body
        type: rich_text
        x: 60
        y: 2230
        width: 1160
        height: 280
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        line_height: 1.7
        content: |
          1. Beck RW, Riddlesworth T, Ruedy K, et al. Effect of CGM on glycemic control in adults with T2D. *JAMA*. 2017;317(4):371-378.
          2. Davies MJ, D'Alessio DA, Fradkin J, et al. Management of hyperglycemia in T2D: ADA/EASD consensus report. *Diabetes Care*. 2018;41(12):2669-2701.
          3. Evert AB, Dennison M, Gardner CD, et al. Nutrition therapy for adults with diabetes. *Diabetes Care*. 2019;42(5):731-754.
          4. Garber AJ, Handelsman Y, Grunberger G, et al. AACE/ACE consensus statement on T2D management. *Endocr Pract*. 2020;26(1):107-139.
          5. Holman RR, Paul SK, Bethel MA, et al. 10-year follow-up of intensive glucose control in T2D. *N Engl J Med*. 2008;359(15):1577-1589.
          6. Inzucchi SE, Bergenstal RM, Buse JB, et al. Management of hyperglycemia: position statement. *Diabetes Care*. 2012;35(6):1364-1379.
          7. Lean MEJ, Leslie WS, Barnes AC, et al. Primary care-led weight management for T2D remission (DiRECT). *Lancet*. 2018;391(10120):541-551.
          8. Look AHEAD Research Group. Cardiovascular effects of intensive lifestyle intervention in T2D. *N Engl J Med*. 2013;369(2):145-154.
          9. Petrie JR, Guzik TJ, Touyz RM. Diabetes, hypertension, and cardiovascular disease. *Can J Cardiol*. 2018;34(5):575-584.
          10. Riddle MC, Gerstein HC, Cefalu WT. Maturation of CGM evidence in T2D. *Diabetes Care*. 2020;43(2):254-256.

