          - { measurement: "Body weight (kg change)",                   control: -0.8, treatment:  -5.4, delta: -4.6,  p_value: 0.004,  significance: "** (p<0.01)"   }
          - { measurement: "Systolic BP (mmHg change)",                 control: -1.6, treatment:  -8.2, delta: -6.6,  p_value: 0.018,  significance: "* (p<0.05)"    }
          - { measurement: "Triglycerides (mg/dL change)",              control: -2.4, treatment: -42.8, delta: -40.4, p_value: 0.006,  significance: "** (p<0.01)"   }
          - { measurement: "HDL cholesterol (mg/dL change)",            control:  0.4, treatment:   4.8, delta:  4.4,  p_value: 0.032,  significance: "* (p<0.05)"    }
          - { measurement: "Quality of life (SF-36 score)",             control:  2.1, treatment:  12.4, delta: 10.3,  p_value: 0.001,  significance: "*** (p<0.001)" }
          - { measurement: "Adverse events (% participants)",           control: 14.2, treatment:  18.6, delta:  4.4,  p_value: 0.284,  significance: "ns"            }
