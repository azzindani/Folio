_protocol: template/v1

# Single-page productivity stat poster · "23 MIN" focus-recovery stat with decorative clock-face shape.
meta:
  id: tmpl-productivity-stat-poster
  name: Productivity Stat Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, productivity, stat, focus, ocean-blue, "4-5"]
  description: "Single-page poster with huge focus-recovery stat, caption, source, and a rotating clock-face accent."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  # Decorative clock-face (rotates)
  - id: clock-ring
    type: circle
    z: 5
    cx: 980
    cy: 280
    rx: 170
    ry: 170
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 3 }
    opacity: 0.4

  - id: clock-inner
    type: circle
    z: 6
    cx: 980
    cy: 280
    rx: 130
    ry: 130
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$accent", width: 2 }
    opacity: 0.5

  - id: clock-tick-12
    type: rect
    z: 7
    x: 976
    y: 124
    width: 8
    height: 28
    fill: { type: solid, color: "$primary" }

  - id: clock-tick-3
    type: rect
    z: 7
    x: 1124
    y: 276
    width: 28
    height: 8
    fill: { type: solid, color: "$primary" }

  - id: clock-tick-6
    type: rect
    z: 7
    x: 976
    y: 408
    width: 8
    height: 28
    fill: { type: solid, color: "$primary" }

  - id: clock-tick-9
    type: rect
    z: 7
    x: 808
    y: 276
    width: 28
    height: 8
    fill: { type: solid, color: "$primary" }

  - id: clock-hub
    type: circle
    z: 8
    cx: 980
    cy: 280
    rx: 12
    ry: 12
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 220
    width: 1040
    height: 0
    content: { type: plain, value: "STAT · ATTENTION RESEARCH" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }

  - id: big-number
    type: text
    z: 21
    x: 80
    y: 380
    width: 1040
    height: 0
    content: { type: plain, value: "23 MIN" }
    style:
      font_family: $heading
      font_size: 260
      font_weight: 900
      color: $primary
      line_height: 0.95
      letter_spacing: -0.05

  - id: divider
    type: rect
    z: 22
    x: 80
    y: 720
    width: 160
    height: 6
    fill: { type: solid, color: "$accent" }

  - id: caption
    type: text
    z: 23
    x: 80
    y: 780
    width: 1040
    height: 0
    content: { type: plain, value: "...the average time it takes\nto refocus after one interruption." }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 700
      color: $text
      line_height: 1.2
      letter_spacing: -0.02

  - id: body
    type: text
    z: 24
    x: 80
    y: 1020
    width: 1040
    height: 0
    content: { type: plain, value: "Every Slack ping, every glance at the inbox, every “quick question” — they all reset the clock. Protect the block." }
    style:
      font_family: $body
      font_size: 26
      color: $text_muted
      line_height: 1.5

  - id: source-label
    type: text
    z: 30
    x: 80
    y: 1340
    width: 1040
    height: 0
    content: { type: plain, value: "SOURCE" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }

  - id: source-attr
    type: text
    z: 31
    x: 80
    y: 1370
    width: 1040
    height: 0
    content: { type: plain, value: "Gloria Mark, UC Irvine · The Cost of Interrupted Work" }
    style: { font_family: $mono, font_size: 16, color: $text, line_height: 1.4 }

  - id: page-mark
    type: text
    z: 32
    x: 880
    y: 1430
    width: 240
    height: 0
    content: { type: plain, value: "FOLIO · STAT" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: right
      text_transform: uppercase

animations:
  clock-ring:
    loop: { type: spin, duration: 20000, easing: linear }
  clock-inner:
    loop: { type: spin, duration: 28000, easing: linear, direction: reverse }
  big-number:
    enter: { type: scale_in, duration: 800, delay: 200, easing: ease-out }
  caption:
    enter: { type: fade_up, duration: 500, delay: 600, easing: ease-out }
  body:
    enter: { type: fade_up, duration: 600, delay: 900, easing: ease-out }

slots:
  - { id: eyebrow,     path: "layers[9].content.value",  type: text, hint: "Eyebrow tag",       default: "STAT · ATTENTION RESEARCH" }
  - { id: big_number,  path: "layers[10].content.value", type: text, hint: "Headline number",   default: "23 MIN" }
  - { id: caption,     path: "layers[12].content.value", type: text, hint: "Caption",           default: "...the average time it takes\nto refocus after one interruption." }
  - { id: body,        path: "layers[13].content.value", type: text, hint: "Supporting body",   default: "Every Slack ping, every glance at the inbox, every “quick question” — they all reset the clock. Protect the block." }
  - { id: source_attr, path: "layers[15].content.value", type: text, hint: "Source attribution",default: "Gloria Mark, UC Irvine · The Cost of Interrupted Work" }
