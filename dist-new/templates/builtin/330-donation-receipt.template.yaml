_protocol: template/v1

# Donation receipt — 1240×1754 A4 portrait, editorial-cream theme.
# Charity name + 501(c)(3) banner, donor info, donation amount HUGE,
# donation type, tax-deductible statement, signed-by line, EIN footer.
meta:
  id: tmpl-donation-receipt
  name: Nonprofit Donation Receipt
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [charity, donation, receipt, nonprofit, tax, editorial, a4]
  description: "Nonprofit donation receipt with charity + 501(c)(3) header, donor info, huge donation amount, donation type, tax-deductible statement, EIN footer."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # ── Header band ───────────────────────────────────────────
  - id: head-rule-top
    type: rect
    z: 1
    x: 80
    y: 80
    width: 1080
    height: 2
    fill: { type: solid, color: "$text" }

  - id: head-rule-bot
    type: rect
    z: 2
    x: 80
    y: 235
    width: 1080
    height: 2
    fill: { type: solid, color: "$text" }

  - id: head-eyebrow
    type: text
    z: 10
    x: 80
    y: 105
    width: 1080
    height: 0
    content: { type: plain, value: "OFFICIAL DONATION RECEIPT" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      text_align: center
      letter_spacing: 0.6
      text_transform: uppercase

  - id: charity-name
    type: text
    z: 11
    x: 80
    y: 140
    width: 1080
    height: 0
    content: { type: plain, value: "Riverside Community Food Bank" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01

  - id: charity-status
    type: text
    z: 12
    x: 80
    y: 200
    width: 1080
    height: 0
    content: { type: plain, value: "Registered 501(c)(3) Tax-Exempt Public Charity" }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.3

  # ── Receipt metadata ──────────────────────────────────────
  - id: rec-num-label
    type: text
    z: 20
    x: 80
    y: 280
    width: 540
    height: 0
    content: { type: plain, value: "RECEIPT NUMBER" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: rec-num-value
    type: text
    z: 21
    x: 80
    y: 305
    width: 540
    height: 0
    content: { type: plain, value: "RCFB-2026-04781" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, letter_spacing: 0.1 }

  - id: rec-date-label
    type: text
    z: 22
    x: 720
    y: 280
    width: 440
    height: 0
    content: { type: plain, value: "DATE OF CONTRIBUTION" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_align: right, text_transform: uppercase }

  - id: rec-date-value
    type: text
    z: 23
    x: 720
    y: 305
    width: 440
    height: 0
    content: { type: plain, value: "May 17, 2026" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.1 }

  # ── Donor block ───────────────────────────────────────────
  - id: donor-card
    type: rect
    z: 30
    x: 80
    y: 380
    width: 1080
    height: 160
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: donor-label
    type: text
    z: 31
    x: 110
    y: 405
    width: 1020
    height: 0
    content: { type: plain, value: "DONOR" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5, text_transform: uppercase }

  - id: donor-name
    type: text
    z: 32
    x: 110
    y: 430
    width: 1020
    height: 0
    content: { type: plain, value: "Jonathan A. Whitfield" }
    style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text, line_height: 1.2 }

  - id: donor-addr
    type: text
    z: 33
    x: 110
    y: 480
    width: 1020
    height: 0
    content: { type: plain, value: "2914 Elm Avenue · Riverside, CA 92505" }
    style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.4 }

  - id: donor-email
    type: text
    z: 34
    x: 110
    y: 505
    width: 1020
    height: 0
    content: { type: plain, value: "j.whitfield@example.com" }
    style: { font_family: $body, font_size: 13, color: $text_muted, line_height: 1.4 }

  # ── Donation amount HUGE ──────────────────────────────────
  - id: amt-label
    type: text
    z: 40
    x: 80
    y: 600
    width: 1080
    height: 0
    content: { type: plain, value: "CONTRIBUTION AMOUNT" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: amt-value
    type: text
    z: 41
    x: 80
    y: 645
    width: 1080
    height: 0
    content: { type: plain, value: "$2,500.00" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1
      letter_spacing: -0.03

  - id: amt-words
    type: text
    z: 42
    x: 80
    y: 855
    width: 1080
    height: 0
    content: { type: plain, value: "two thousand five hundred dollars and 00/100" }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.3

  # ── Donation-type row ─────────────────────────────────────
  - id: type-bg
    type: rect
    z: 50
    x: 80
    y: 930
    width: 1080
    height: 80
    radius: 8
    fill: { type: solid, color: "$primary", opacity: 0.10 }

  - id: type-label
    type: text
    z: 51
    x: 110
    y: 945
    width: 1020
    height: 0
    content: { type: plain, value: "PAYMENT METHOD · DONATION TYPE" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $primary, letter_spacing: 0.5, text_transform: uppercase }

  - id: type-value
    type: text
    z: 52
    x: 110
    y: 970
    width: 1020
    height: 0
    content: { type: plain, value: "Check #4218  ·  Cash gift  ·  Unrestricted general fund" }
    style: { font_family: $heading, font_size: 20, font_weight: 700, color: $text, line_height: 1.3 }

  # ── Tax-deductible statement ──────────────────────────────
  - id: tax-card
    type: rect
    z: 60
    x: 80
    y: 1060
    width: 1080
    height: 220
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: tax-title
    type: text
    z: 61
    x: 110
    y: 1085
    width: 1020
    height: 0
    content: { type: plain, value: "TAX-DEDUCTIBLE STATEMENT" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5, text_transform: uppercase }

  - id: tax-body
    type: text
    z: 62
    x: 110
    y: 1115
    width: 1020
    height: 0
    content: { type: plain, value: "No goods or services were provided to the donor in exchange for this contribution. Riverside Community Food Bank is a 501(c)(3) public charity organized and operated exclusively for charitable purposes." }
    style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55 }

  - id: tax-body-2
    type: text
    z: 63
    x: 110
    y: 1205
    width: 1020
    height: 0
    content: { type: plain, value: "This receipt may be used to substantiate a federal income tax charitable deduction under IRC §170. Please retain for your records." }
    style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, line_height: 1.55 }

  # ── Signed-by line ────────────────────────────────────────
  - id: sig-rule
    type: rect
    z: 70
    x: 80
    y: 1380
    width: 480
    height: 2
    fill: { type: solid, color: "$text" }

  - id: sig-label
    type: text
    z: 71
    x: 80
    y: 1395
    width: 480
    height: 0
    content: { type: plain, value: "AUTHORIZED SIGNATURE" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: sig-name
    type: text
    z: 72
    x: 80
    y: 1418
    width: 480
    height: 0
    content: { type: plain, value: "Elena Vasquez · Executive Director" }
    style: { font_family: $heading, font_size: 16, font_style: italic, color: $text, line_height: 1.3 }

  - id: stamp-circle
    type: circle
    z: 73
    x: 980
    y: 1330
    width: 160
    height: 160
    fill: { type: solid, color: "$primary", opacity: 0 }
    stroke: { color: "$primary", width: 3, dash: [4, 4] }

  - id: stamp-text-1
    type: text
    z: 74
    x: 980
    y: 1380
    width: 160
    height: 0
    content: { type: plain, value: "RECEIVED" }
    style: { font_family: $heading, font_size: 18, font_weight: 800, color: $primary, text_align: center, letter_spacing: 0.1 }

  - id: stamp-text-2
    type: text
    z: 75
    x: 980
    y: 1410
    width: 160
    height: 0
    content: { type: plain, value: "WITH THANKS" }
    style: { font_family: $body, font_size: 11, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.2 }

  # ── EIN + footer ──────────────────────────────────────────
  - id: foot-rule
    type: rect
    z: 80
    x: 80
    y: 1580
    width: 1080
    height: 1
    fill: { type: solid, color: "$border" }

  - id: foot-charity
    type: text
    z: 81
    x: 80
    y: 1610
    width: 1080
    height: 0
    content: { type: plain, value: "Riverside Community Food Bank  ·  118 Magnolia Ave, Riverside, CA 92501  ·  (951) 555-0144" }
    style: { font_family: $body, font_size: 12, color: $text_muted, text_align: center, line_height: 1.4 }

  - id: foot-ein
    type: text
    z: 82
    x: 80
    y: 1640
    width: 1080
    height: 0
    content: { type: plain, value: "EIN  ·  91-4827361" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text, text_align: center, letter_spacing: 0.2 }

  - id: foot-thanks
    type: text
    z: 83
    x: 80
    y: 1675
    width: 1080
    height: 0
    content: { type: plain, value: "Thank you for your generous support of our community." }
    style: { font_family: $body, font_size: 13, font_style: italic, color: $primary, text_align: center, line_height: 1.4 }

slots:
  - { id: charity_name,    path: "layers[4].content.value",  type: text, hint: "Charity name",       default: "Riverside Community Food Bank" }
  - { id: ein,             path: "layers[33].content.value", type: text, hint: "EIN number",         default: "EIN  ·  91-4827361" }
  - { id: donor_name,      path: "layers[12].content.value", type: text, hint: "Donor name",         default: "Jonathan A. Whitfield" }
  - { id: donation_amount, path: "layers[16].content.value", type: text, hint: "Donation amount",    default: "$2,500.00" }
  - { id: donation_date,   path: "layers[9].content.value",  type: text, hint: "Date of donation",   default: "May 17, 2026" }
