  # ── Page 4 · Kitchen Essentials Checklist ──────────────────
  - id: essentials
    label: Kitchen Essentials
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: pagehead, type: text, z: 1, x: 120, y: 120, width: 1000, height: 0, content: { type: plain, value: "KITCHEN ESSENTIALS" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $primary, letter_spacing: 0.6 } }
