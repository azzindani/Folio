      - { id: note-kicker, type: text, z: 41, x: 160, y: 1370, width: 920, height: 0, content: { type: plain, value: "A NOTE ON ORDER" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
