_protocol: template/v1

# 6-page recipe-book front matter — 1240×1754 A4 portrait, editorial-cream theme.
# Title → foreword → contents → essentials checklist → techniques → how to use.
meta:
  id: tmpl-recipe-book-intro
  name: Recipe Book · Intro Pages (6 pages)
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, cookbook, recipe, intro, front-matter, editorial, a4]
  description: "Six-page cookbook front matter: title page, foreword, eight-chapter table of contents, kitchen essentials checklist, two-column technique fundamentals, and a how-to-use guide."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Title Page ────────────────────────────────────
  - id: title-page
    label: Title Page
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: top-rule, type: rect, z: 1, x: 480, y: 200, width: 280, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: kicker, type: text, z: 10, x: 0, y: 240, width: 1240, height: 0, content: { type: plain, value: "A COOKBOOK" }, style: { font_family: $mono, font_size: 16, font_weight: 800, color: $primary, text_align: center, letter_spacing: 0.8 } }
      - { id: sub-kicker, type: text, z: 11, x: 0, y: 280, width: 1240, height: 0, content: { type: plain, value: "for the patient home cook" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text_muted, text_align: center } }
      - { id: title, type: text, z: 12, x: 80, y: 460, width: 1080, height: 0, content: { type: plain, value: "Slow\nWeeknights." }, style: { font_family: $heading, font_size: 160, font_weight: 800, color: $text, text_align: center, line_height: 0.95, letter_spacing: -0.04 } }
      - { id: tagline, type: text, z: 13, x: 120, y: 880, width: 1000, height: 0, content: { type: plain, value: "Sixty unhurried suppers, written for the home cook who has had a long day and would like to enjoy themselves anyway." }, style: { font_family: $heading, font_size: 28, font_style: italic, color: $text, text_align: center, line_height: 1.4 } }
      - { id: divider-1, type: rect, z: 14, x: 580, y: 1080, width: 80, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: author-label, type: text, z: 15, x: 0, y: 1120, width: 1240, height: 0, content: { type: plain, value: "BY" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: author-name, type: text, z: 16, x: 0, y: 1160, width: 1240, height: 0, content: { type: plain, value: "Hadley Mooreland" }, style: { font_family: $heading, font_size: 56, font_weight: 700, font_style: italic, color: $text, text_align: center } }
      - { id: with-name, type: text, z: 17, x: 0, y: 1240, width: 1240, height: 0, content: { type: plain, value: "with photographs by Soren Vance" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center, font_style: italic } }
      - { id: mark, type: text, z: 20, x: 0, y: 1440, width: 1240, height: 0, content: { type: plain, value: "✻" }, style: { font_family: $heading, font_size: 40, color: $primary, text_align: center } }
      - { id: publisher, type: text, z: 21, x: 0, y: 1520, width: 1240, height: 0, content: { type: plain, value: "PEAR & LARDER PRESS  ·  PORTLAND" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.6 } }
      - { id: year, type: text, z: 22, x: 0, y: 1560, width: 1240, height: 0, content: { type: plain, value: "TWENTY TWENTY-SIX" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: center, letter_spacing: 0.6 } }

  # ── Page 2 · Foreword ──────────────────────────────────────
  - id: foreword
    label: Foreword
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: pagehead, type: text, z: 1, x: 120, y: 120, width: 1000, height: 0, content: { type: plain, value: "FOREWORD" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $primary, letter_spacing: 0.6 } }
      - { id: pagehead-rule, type: rect, z: 2, x: 120, y: 150, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: kicker, type: text, z: 10, x: 120, y: 220, width: 1000, height: 0, content: { type: plain, value: "A FEW WORDS BEFORE YOU BEGIN" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 120, y: 260, width: 1000, height: 0, content: { type: plain, value: "On the kindness of a slower dinner." }, style: { font_family: $heading, font_size: 60, font_weight: 700, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: dropcap, type: rect, z: 20, x: 120, y: 460, width: 110, height: 110, fill: { type: solid, color: "$primary" } }
      - { id: dropcap-letter, type: text, z: 21, x: 120, y: 478, width: 110, height: 0, content: { type: plain, value: "T" }, style: { font_family: $heading, font_size: 90, font_weight: 800, color: "$background", text_align: center, line_height: 1 } }
      - { id: body-1, type: text, z: 22, x: 260, y: 460, width: 860, height: 0, content: { type: plain, value: "his book was written for the cook who comes home tired, and who would like to enjoy themselves anyway. The premise is straightforward: every recipe asks for one extra unhurried step — a longer rest, a gentler simmer, a smaller fire — and gives back something the speed version cannot." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.6, text_align: justify } }
      - { id: body-2, type: text, z: 23, x: 120, y: 620, width: 1000, height: 0, content: { type: plain, value: "I did not write a cookbook because I wanted to teach you to cook. I wrote it because I wanted to share what cooking has been teaching me — that the kitchen is one of the very few rooms left in modern life that asks you to be present, to wait, to attend.\n\nNone of these recipes are difficult. Most take under an hour from the moment you reach for the cutting board. Many take less. What they all share is a refusal to rush the part of the recipe that cannot be rushed — the simmer, the rest, the time on the cooling rack — and a deep affection for the small rituals that make a kitchen feel like home.\n\nA few practical notes. I cook by weight where it matters and by feel where it doesn't, and the recipes are written to reflect that. I prefer salted butter for the same reason your grandmother probably did. I rarely call for unusual equipment. I assume you have a good wooden spoon, an honest knife, and one heavy-bottomed pan you have grown attached to over the years.\n\nIf you only ever cook one recipe from this book, please let it be the lemon-thyme chicken on page 78. It is the meal I make for the people I love most. It is, in a way, the whole book in a single dish: a few honest ingredients, patience instead of cleverness, and a long, peaceful evening at the end.\n\nWelcome to my kitchen. I'm glad you're here." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.65, text_align: justify } }
      - { id: sig, type: text, z: 30, x: 120, y: 1500, width: 1000, height: 0, content: { type: plain, value: "— Hadley Mooreland" }, style: { font_family: $heading, font_size: 30, font_style: italic, color: $primary } }
      - { id: sig-location, type: text, z: 31, x: 120, y: 1550, width: 1000, height: 0, content: { type: plain, value: "PORTLAND  ·  WINTER 2026" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.4 } }
      - { id: foot-rule, type: rect, z: 40, x: 120, y: 1690, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: foot, type: text, z: 41, x: 120, y: 1710, width: 1000, height: 0, content: { type: plain, value: "SLOW WEEKNIGHTS  ·  ix" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

