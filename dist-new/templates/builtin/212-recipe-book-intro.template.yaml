      - { id: intro, type: text, z: 11, x: 120, y: 320, width: 1000, height: 0, content: { type: plain, value: "A short and slightly opinionated list. If you have most of what is below, you can cook every recipe in this book. If you do not, you can still cook most of them." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: col-1-h, type: text, z: 20, x: 120, y: 460, width: 460, height: 0, content: { type: plain, value: "TOOLS" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: col-1-rule, type: rect, z: 21, x: 120, y: 490, width: 460, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: col-1-list, type: text, z: 22, x: 120, y: 510, width: 460, height: 0, content: { type: plain, value: "☐  One honest chef's knife (8\")\n☐  One small paring knife\n☐  Cutting board, well-loved\n☐  Heavy-bottomed Dutch oven\n☐  10\" cast-iron skillet\n☐  Wide saucepan with a lid\n☐  Sheet pan, half-sheet\n☐  Microplane / fine grater\n☐  Wooden spoons (at least two)\n☐  Sturdy fish spatula\n☐  Tongs you trust\n☐  Bench scraper\n☐  Digital scale (worth it)\n☐  Instant-read thermometer" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: col-2-h, type: text, z: 30, x: 660, y: 460, width: 460, height: 0, content: { type: plain, value: "PANTRY" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: col-2-rule, type: rect, z: 31, x: 660, y: 490, width: 460, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: col-2-list, type: text, z: 32, x: 660, y: 510, width: 460, height: 0, content: { type: plain, value: "☐  Diamond Crystal kosher salt\n☐  Flaky finishing salt\n☐  Black peppercorns + grinder\n☐  Good olive oil (everyday)\n☐  Great olive oil (for finishing)\n☐  Neutral oil — grapeseed/canola\n☐  Salted butter\n☐  One head of garlic, always\n☐  Yellow onions, several\n☐  Dijon mustard\n☐  Red wine vinegar\n☐  Lemons, a few\n☐  Bay leaves\n☐  Dried pasta, a few shapes" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: tip-card, type: rect, z: 40, x: 120, y: 1300, width: 1000, height: 260, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: tip-kicker, type: text, z: 41, x: 160, y: 1330, width: 920, height: 0, content: { type: plain, value: "A TIP, IF YOU TAKE ONLY ONE" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: tip-text, type: text, z: 42, x: 160, y: 1370, width: 920, height: 0, content: { type: plain, value: "Buy the best salt and the best olive oil you can comfortably afford and keep them within easy reach. Half of what makes a dish taste expensive is a generous, well-timed pinch of both." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: foot-rule, type: rect, z: 50, x: 120, y: 1690, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: foot, type: text, z: 51, x: 120, y: 1710, width: 1000, height: 0, content: { type: plain, value: "SLOW WEEKNIGHTS  ·  xiii" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 5 · Technique Fundamentals ────────────────────────
  - id: techniques
    label: Techniques
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: pagehead, type: text, z: 1, x: 120, y: 120, width: 1000, height: 0, content: { type: plain, value: "TECHNIQUE FUNDAMENTALS" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $primary, letter_spacing: 0.6 } }
      - { id: pagehead-rule, type: rect, z: 2, x: 120, y: 150, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: title, type: text, z: 10, x: 120, y: 220, width: 1000, height: 0, content: { type: plain, value: "Six things every recipe assumes." }, style: { font_family: $heading, font_size: 50, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: intro, type: text, z: 11, x: 120, y: 360, width: 1000, height: 0, content: { type: plain, value: "If a recipe in this book ever feels harder than it should, the answer is almost always on this page." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: divider, type: rect, z: 12, x: 120, y: 440, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: col1-1-num, type: text, z: 20, x: 120, y: 500, width: 60, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary } }
      - { id: col1-1-title, type: text, z: 21, x: 200, y: 504, width: 360, height: 0, content: { type: plain, value: "Heat the pan first." }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col1-1-body, type: text, z: 22, x: 200, y: 540, width: 360, height: 0, content: { type: plain, value: "Then the oil. Then the food. Your sear lives or dies on this order. Cold pans are the enemy of color." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.55 } }
      - { id: col1-2-num, type: text, z: 20, x: 120, y: 660, width: 60, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary } }
      - { id: col1-2-title, type: text, z: 21, x: 200, y: 664, width: 360, height: 0, content: { type: plain, value: "Salt in three places." }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col1-2-body, type: text, z: 22, x: 200, y: 700, width: 360, height: 0, content: { type: plain, value: "At the start, in the middle, at the table. Each round seasons something the last one couldn't reach." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.55 } }
      - { id: col1-3-num, type: text, z: 20, x: 120, y: 820, width: 60, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary } }
      - { id: col1-3-title, type: text, z: 21, x: 200, y: 824, width: 360, height: 0, content: { type: plain, value: "Rest the protein." }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col1-3-body, type: text, z: 22, x: 200, y: 860, width: 360, height: 0, content: { type: plain, value: "Half the cooking time, on a warm plate, loosely tented. The juice you save is the dinner you serve." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.55 } }
      - { id: col2-1-num, type: text, z: 30, x: 660, y: 500, width: 60, height: 0, content: { type: plain, value: "04" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary } }
      - { id: col2-1-title, type: text, z: 31, x: 740, y: 504, width: 380, height: 0, content: { type: plain, value: "Reserve a cup of pasta water." }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col2-1-body, type: text, z: 32, x: 740, y: 560, width: 380, height: 0, content: { type: plain, value: "Always. Before you drain. That salty, starchy water is the glue that turns sauce into a meal." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.55 } }
      - { id: col2-2-num, type: text, z: 30, x: 660, y: 660, width: 60, height: 0, content: { type: plain, value: "05" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary } }
      - { id: col2-2-title, type: text, z: 31, x: 740, y: 664, width: 380, height: 0, content: { type: plain, value: "Taste before you panic." }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col2-2-body, type: text, z: 32, x: 740, y: 700, width: 380, height: 0, content: { type: plain, value: "Acid? Salt? Heat? Fat? Most kitchen disasters are missing one of those four. Add it before you start over." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.55 } }
      - { id: col2-3-num, type: text, z: 30, x: 660, y: 820, width: 60, height: 0, content: { type: plain, value: "06" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary } }
      - { id: col2-3-title, type: text, z: 31, x: 740, y: 824, width: 380, height: 0, content: { type: plain, value: "Read the recipe twice." }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col2-3-body, type: text, z: 32, x: 740, y: 860, width: 380, height: 0, content: { type: plain, value: "Once for the ingredients, once for the timing. The second pass is what saves you at minute seventeen." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.55 } }
      - { id: aside, type: rect, z: 40, x: 120, y: 1040, width: 1000, height: 200, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: aside-kicker, type: text, z: 41, x: 160, y: 1070, width: 920, height: 0, content: { type: plain, value: "WHEN IN DOUBT" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: aside-text, type: text, z: 42, x: 160, y: 1110, width: 920, height: 0, content: { type: plain, value: "Lower the heat, walk away for a minute, and come back. Almost nothing burns at low and slow. Almost everything tastes better when you give it the time it was asking for." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: foot-rule, type: rect, z: 50, x: 120, y: 1690, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: foot, type: text, z: 51, x: 120, y: 1710, width: 1000, height: 0, content: { type: plain, value: "SLOW WEEKNIGHTS  ·  xv" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 6 · How To Use This Book ──────────────────────────
  - id: how-to-use
    label: How to Use
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: pagehead, type: text, z: 1, x: 120, y: 120, width: 1000, height: 0, content: { type: plain, value: "HOW TO USE THIS BOOK" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $primary, letter_spacing: 0.6 } }
      - { id: pagehead-rule, type: rect, z: 2, x: 120, y: 150, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: title, type: text, z: 10, x: 120, y: 220, width: 1000, height: 0, content: { type: plain, value: "A short guide." }, style: { font_family: $heading, font_size: 64, font_weight: 700, color: $text, line_height: 1, letter_spacing: -0.02 } }
      - { id: intro, type: text, z: 11, x: 120, y: 340, width: 1000, height: 0, content: { type: plain, value: "Most of this book is self-explanatory. The bits below are the bits that are not." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: divider, type: rect, z: 12, x: 120, y: 420, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: section-1-h, type: text, z: 20, x: 120, y: 470, width: 1000, height: 0, content: { type: plain, value: "READING A RECIPE" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: section-1-body, type: text, z: 21, x: 120, y: 510, width: 1000, height: 0, content: { type: plain, value: "Every recipe begins with a small headnote — a paragraph or two on why this dish exists, who taught it to me, and what makes it feel like itself. Read the headnote first. It will save you a step later. Yields are given to feed four adults of regular appetite; halve or double freely. All temperatures are Fahrenheit. All times are honest." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.65, text_align: justify } }
      - { id: section-2-h, type: text, z: 30, x: 120, y: 740, width: 1000, height: 0, content: { type: plain, value: "THE SYMBOLS" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: sym-1, type: text, z: 31, x: 120, y: 790, width: 60, height: 0, content: { type: plain, value: "✻" }, style: { font_family: $heading, font_size: 28, color: $primary } }
      - { id: sym-1-text, type: text, z: 32, x: 200, y: 794, width: 900, height: 0, content: { type: plain, value: "A recipe that gets better the next day. Cook in advance if you can." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.55 } }
      - { id: sym-2, type: text, z: 31, x: 120, y: 840, width: 60, height: 0, content: { type: plain, value: "◐" }, style: { font_family: $heading, font_size: 28, color: $primary } }
      - { id: sym-2-text, type: text, z: 32, x: 200, y: 844, width: 900, height: 0, content: { type: plain, value: "A recipe with a long unattended stretch — start it, walk away, do something else." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.55 } }
      - { id: sym-3, type: text, z: 31, x: 120, y: 890, width: 60, height: 0, content: { type: plain, value: "△" }, style: { font_family: $heading, font_size: 28, color: $primary } }
      - { id: sym-3-text, type: text, z: 32, x: 200, y: 894, width: 900, height: 0, content: { type: plain, value: "Worth the time but expects a little focus. Best with a quiet kitchen." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.55 } }
      - { id: sym-4, type: text, z: 31, x: 120, y: 940, width: 60, height: 0, content: { type: plain, value: "♡" }, style: { font_family: $heading, font_size: 28, color: $primary } }
      - { id: sym-4-text, type: text, z: 32, x: 200, y: 944, width: 900, height: 0, content: { type: plain, value: "A recipe I make for the people I love most. Reach for these on the hard days." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.55 } }
      - { id: section-3-h, type: text, z: 40, x: 120, y: 1020, width: 1000, height: 0, content: { type: plain, value: "ON SUBSTITUTIONS" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: section-3-body, type: text, z: 41, x: 120, y: 1060, width: 1000, height: 0, content: { type: plain, value: "Cook the recipe you have, not the recipe in the book. If you do not have shallots, use onion. If you do not have white wine, use a squeeze of lemon. If you do not have time, lower the heat. Almost nothing here is so precious that a substitution will ruin it; I have tested most of them on a Tuesday." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.65, text_align: justify } }
      - { id: section-4-h, type: text, z: 50, x: 120, y: 1280, width: 1000, height: 0, content: { type: plain, value: "AND FINALLY" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: section-4-body, type: text, z: 51, x: 120, y: 1320, width: 1000, height: 0, content: { type: plain, value: "Write in the margins. Underline the bits you love. Cross out anything that doesn't work for you and rewrite it in your own hand. This book is meant to get worse-looking and better-cooking over time, until eventually it is yours and not mine." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.65, text_align: justify } }
      - { id: closing, type: text, z: 60, x: 0, y: 1520, width: 1240, height: 0, content: { type: plain, value: "Happy cooking, slow eater. ✻" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: $primary, text_align: center } }
      - { id: foot-rule, type: rect, z: 70, x: 120, y: 1690, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: foot, type: text, z: 71, x: 120, y: 1710, width: 1000, height: 0, content: { type: plain, value: "SLOW WEEKNIGHTS  ·  xvii" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }
