  - id: bg-noise
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill: { type: noise, opacity: 0.05, frequency: 0.8, octaves: 2 }

  # ── Masthead ──────────────────────────────────────────────
