_protocol: template/v1

# Craft beer tap list — 1080×1620 portrait, forest-deep theme.
# 10 beers on tap with style · ABV · IBU · price.
# Category circle icons left of each beer row.
meta:
  id: tmpl-beer-bar-menu
  name: Beer Bar Menu · Craft Tap List
  type: menu
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [menu, beer, brewery, tap, craft, forest, portrait]
  description: "Craft beer tap list with 10 beers showing style, ABV, IBU and price, plus circular category icons for IPA/Stout/Lager."

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
