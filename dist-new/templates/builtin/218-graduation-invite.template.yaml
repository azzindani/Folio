_protocol: template/v1

# Graduation announcement — 1080×1500 portrait, corporate-slate theme.
# Cap & tassel icon, large graduate name, school + degree + ceremony details.
meta:
  id: tmpl-graduation-invite
  name: Graduation Announcement
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, invitation, graduation, announcement, formal, portrait]
  description: "Proud graduation announcement with cap icon, graduate name, school, degree, and ceremony details."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }

  - { id: top-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
  - { id: bot-band, type: rect, z: 1, x: 0, y: 1488, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }

  # ── Cap & tassel icon (geometric) ────────────────────────
  - { id: cap-base,    type: rect, z: 5, x: 470, y: 220, width: 140, height: 14, fill: { type: solid, color: "$primary" }, radius: 3 }
  - { id: cap-top,     type: rect, z: 6, x: 430, y: 200, width: 220, height: 24, fill: { type: solid, color: "$primary" }, radius: 4 }
  - { id: cap-button,  type: circle, z: 7, cx: 540, cy: 200, rx: 7, ry: 7, fill: { type: solid, color: "$accent" } }
  - { id: tassel-line, type: rect, z: 7, x: 538, y: 200, width: 3, height: 50, fill: { type: solid, color: "$accent" } }
  - { id: tassel-bob,  type: circle, z: 8, cx: 540, cy: 258, rx: 10, ry: 12, fill: { type: solid, color: "$accent" } }

  # ── Eyebrow ──────────────────────────────────────────────
  - { id: eyebrow, type: text, z: 10, x: 80, y: 320, width: 920, height: 0, content: { type: plain, value: "PROUDLY ANNOUNCING" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.7, text_transform: uppercase } }

  - { id: the-grad-of, type: text, z: 11, x: 80, y: 380, width: 920, height: 0, content: { type: plain, value: "the graduation of" }, style: { font_family: $body, font_size: 22, color: "$text_muted", text_align: center, font_style: italic } }

  - { id: grad-name, type: text, z: 12, x: 80, y: 440, width: 920, height: 0, content: { type: plain, value: "Aiden Marcus Whitlock" }, style: { font_family: $heading, font_size: 70, font_weight: 700, color: "$text", text_align: center, line_height: 1.15, letter_spacing: -0.01 } }

  - { id: divider, type: rect, z: 13, x: 460, y: 600, width: 160, height: 2, fill: { type: solid, color: "$accent" } }

  - { id: school, type: text, z: 14, x: 80, y: 650, width: 920, height: 0, content: { type: plain, value: "University of Northfield" }, style: { font_family: $heading, font_size: 34, font_weight: 600, color: "$primary", text_align: center, line_height: 1.3 } }

  - { id: degree, type: text, z: 15, x: 80, y: 710, width: 920, height: 0, content: { type: plain, value: "Bachelor of Science · Mechanical Engineering" }, style: { font_family: $body, font_size: 22, color: "$text", text_align: center, line_height: 1.4 } }

  - { id: honors, type: text, z: 16, x: 80, y: 760, width: 920, height: 0, content: { type: plain, value: "magna cum laude" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text_muted", text_align: center } }

  # ── Ceremony block ───────────────────────────────────────
  - { id: panel, type: rect, z: 20, x: 120, y: 870, width: 840, height: 280, fill: { type: solid, color: "$surface" }, radius: 12 }

  - { id: cer-lbl,    type: text, z: 21, x: 120, y: 900, width: 840, height: 0, content: { type: plain, value: "COMMENCEMENT CEREMONY" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$accent", text_align: center, letter_spacing: 0.5 } }
  - { id: cer-date,   type: text, z: 22, x: 120, y: 940, width: 840, height: 0, content: { type: plain, value: "Saturday, May 23, 2026 · 10:00 AM" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text", text_align: center, line_height: 1.3 } }
  - { id: cer-venue,  type: text, z: 23, x: 120, y: 1000, width: 840, height: 0, content: { type: plain, value: "Northfield Memorial Stadium" }, style: { font_family: $heading, font_size: 24, font_weight: 500, color: "$text", text_align: center } }
  - { id: cer-addr,   type: text, z: 24, x: 120, y: 1040, width: 840, height: 0, content: { type: plain, value: "1200 Campus Drive · Northfield, OH" }, style: { font_family: $body, font_size: 18, color: "$text_muted", text_align: center } }
  - { id: cer-stream, type: text, z: 25, x: 120, y: 1090, width: 840, height: 0, content: { type: plain, value: "live stream · northfield.edu/commencement" }, style: { font_family: $mono, font_size: 16, color: "$text_muted", text_align: center, letter_spacing: 0.05 } }

  # ── Reception ────────────────────────────────────────────
  - { id: rec-lbl, type: text, z: 30, x: 80, y: 1230, width: 920, height: 0, content: { type: plain, value: "RECEPTION TO FOLLOW" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.6 } }
  - { id: rec,     type: text, z: 31, x: 80, y: 1270, width: 920, height: 0, content: { type: plain, value: "Whitlock Family Residence · 2:00 PM\n428 Linden Hollow Court · Northfield, OH" }, style: { font_family: $body, font_size: 20, color: "$text", text_align: center, line_height: 1.5 } }

  - { id: signoff, type: text, z: 40, x: 80, y: 1400, width: 920, height: 0, content: { type: plain, value: "We hope you'll join us in celebrating this milestone." }, style: { font_family: $heading, font_size: 18, font_style: italic, color: "$text_muted", text_align: center } }

slots:
  - { id: graduate_name,   path: "layers[10].content.value", type: text, hint: "Graduate full name",    default: "Aiden Marcus Whitlock" }
  - { id: school,          path: "layers[12].content.value", type: text, hint: "School / university",   default: "University of Northfield" }
  - { id: degree,          path: "layers[13].content.value", type: text, hint: "Degree + major",        default: "Bachelor of Science · Mechanical Engineering" }
  - { id: ceremony_date,   path: "layers[17].content.value", type: text, hint: "Ceremony date / time",  default: "Saturday, May 23, 2026 · 10:00 AM" }
  - { id: ceremony_venue,  path: "layers[18].content.value", type: text, hint: "Ceremony venue",        default: "Northfield Memorial Stadium" }
  - { id: reception_info,  path: "layers[22].content.value", type: text, hint: "Reception info block",  default: "Whitlock Family Residence · 2:00 PM\n428 Linden Hollow Court · Northfield, OH" }
