    style: { font_family: $heading, font_size: 28, font_weight: 700, color: "$text", text_align: center }

  # Lake reflection ripples (decorative inner regions)
  - id: ripple-1
    type: rect
    z: 20
    x: 200
    y: 820
    width: 240
    height: 6
    radius: 3
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 1 }

  - id: ripple-2
    type: rect
