  # Tips footer
  - id: tips-box
    type: rect
    z: 40
    x: 60
    y: 1430
    width: 1120
    height: 220
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$accent", width: 1 }

  - id: tips-title
    type: text
    z: 41
    x: 90
    y: 1450
    width: 1080
    height: 0
    content: { type: plain, value: "PAINTING TIPS" }
    style:
      font_family: $heading
      font_size: 16
      font_weight: 800
      color: "$accent"
      letter_spacing: 0.32
      text_transform: uppercase

  - id: tips-body
    type: text
    z: 42
    x: 90
    y: 1488
    width: 1080
    height: 0
    content:
      type: plain
      value: "1.  Paint light colors first, dark colors last — easier to cover mistakes.\n2.  Use a small brush for tight spots; a wider brush for sky and water.\n3.  Let each region dry before painting an adjacent number — avoid bleed.\n4.  Mix tiny amounts: a drop more white softens any color tastefully."
    style:
      font_family: $body
      font_size: 14
      color: "$text"
      line_height: 1.6

  - id: footer
    type: text
    z: 50
    x: 60
    y: 1700
    width: 1120
    height: 0
    content: { type: plain, value: "© FOLIO PAINT STUDIO  ·  ACRYLIC OR WATERCOLOR  ·  AGES 8+" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.4
      text_transform: uppercase

slots:
  - { id: subject_name, path: "layers[2].content.value", type: text, hint: "Subject name", default: "Sunset Mountain Lake" }
  - { id: difficulty,   path: "layers[3].content.value", type: text, hint: "Difficulty meta line", default: "DIFFICULTY: BEGINNER  ·  10 COLORS  ·  ~2 HOURS" }
