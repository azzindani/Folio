    width: 40
    height: 0
    content: { type: plain, value: "10" }
    style: { font_family: $heading, font_size: 22, font_weight: 700, color: "$text", text_align: center }

  # Color legend — title
  - id: legend-title
    type: text
    z: 30
    x: 60
    y: 1190
    width: 1120
    height: 0
    content: { type: plain, value: "COLOR LEGEND" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: "$primary"
      letter_spacing: 0.32
      text_transform: uppercase

  - id: legend-rule
    type: rect
    z: 31
    x: 60
    y: 1226
    width: 1120
    height: 2
    fill: { type: solid, color: "$primary" }

  # Legend swatches — 2 rows × 5 columns
  - id: sw-1
    type: rect
    z: 32
    x: 60
    y: 1250
    width: 40
    height: 40
    radius: 4
    fill: { type: solid, color: "#FFD580" }
    stroke: { color: "$text", width: 1 }
  - id: sw-1-text
    type: text
    z: 33
    x: 110
    y: 1262
    width: 180
    height: 0
    content: { type: plain, value: "1  Warm Yellow" }
