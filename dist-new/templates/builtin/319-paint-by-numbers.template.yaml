    y: 432
    width: 40
    height: 0
    content: { type: plain, value: "7" }
    style: { font_family: $heading, font_size: 18, font_weight: 700, color: "$text", text_align: center }

  # Lake (water)
  - id: region-water
    type: polygon
    z: 18
    points: "80,720 1160,720 1160,1020 80,1020"
    fill: { type: solid, color: "transparent" }
