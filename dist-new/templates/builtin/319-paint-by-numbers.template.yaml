_protocol: template/v1

# Paint-by-numbers — 1240×1754 A4 portrait, light-clean.
# Outlined subject (polygons), numbered regions, 10-color legend, tips footer.
meta:
  id: tmpl-paint-by-numbers
  name: Paint by Numbers
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, painting, craft, kids, paint-by-numbers, a4, printable]
  description: "Paint-by-numbers worksheet with outlined polygonal subject, numbered regions, 10-color legend with paint names, and painting tips."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # Header
  - id: title
    type: text
    z: 1
    x: 60
    y: 70
    width: 1120
    height: 0
    content: { type: plain, value: "PAINT BY NUMBERS" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: "$primary"
      text_align: center
      letter_spacing: 0.16
      text_transform: uppercase

  - id: subject-name
    type: text
    z: 2
    x: 60
    y: 130
    width: 1120
    height: 0
    content: { type: plain, value: "Sunset Mountain Lake" }
    style:
      font_family: $heading
      font_size: 28
      font_style: italic
      color: "$text"
      text_align: center

  - id: meta-row
    type: text
    z: 3
    x: 60
    y: 180
    width: 1120
    height: 0
    content: { type: plain, value: "DIFFICULTY: BEGINNER  ·  10 COLORS  ·  ~2 HOURS" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: header-rule
    type: rect
    z: 4
    x: 60
    y: 220
    width: 1120
    height: 1
    fill: { type: solid, color: "$border" }

  # Subject canvas
  - id: canvas-bg
    type: rect
    z: 5
    x: 60
    y: 250
    width: 1120
    height: 900
    radius: 8
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$text", width: 2 }

  # Sky region (upper)
  - id: region-sky
    type: polygon
    z: 10
    points: "80,270 1160,270 1160,560 80,560"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-sky
    type: text
    z: 11
    x: 600
    y: 400
    width: 40
    height: 0
    content: { type: plain, value: "1" }
    style: { font_family: $heading, font_size: 28, font_weight: 700, color: "$text", text_align: center }

  # Sun
  - id: region-sun
    type: circle
    z: 12
    cx: 900
    cy: 460
    rx: 90
    ry: 90
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-sun
    type: text
    z: 13
    x: 880
    y: 446
    width: 40
    height: 0
    content: { type: plain, value: "2" }
    style: { font_family: $heading, font_size: 28, font_weight: 700, color: "$text", text_align: center }

  # Cloud
  - id: region-cloud
    type: path
    z: 12
    d: "M 200 380 C 180 350, 220 320, 260 340 C 280 310, 340 320, 350 350 C 390 350, 400 390, 370 410 C 360 430, 290 430, 250 420 C 220 430, 180 410, 200 380 Z"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-cloud
    type: text
    z: 13
    x: 275
    y: 372
    width: 40
    height: 0
    content: { type: plain, value: "3" }
    style: { font_family: $heading, font_size: 24, font_weight: 700, color: "$text", text_align: center }

  # Mountains (3 polygon peaks)
  - id: region-mtn-left
    type: polygon
    z: 14
    points: "80,560 80,720 360,440 540,720 540,560"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-mtn-left
    type: text
    z: 15
    x: 280
    y: 626
    width: 40
    height: 0
    content: { type: plain, value: "4" }
    style: { font_family: $heading, font_size: 28, font_weight: 700, color: "$text", text_align: center }

  - id: region-mtn-mid
    type: polygon
    z: 14
    points: "440,720 660,400 880,720"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-mtn-mid
    type: text
    z: 15
    x: 640
    y: 606
    width: 40
    height: 0
    content: { type: plain, value: "5" }
