  # Mountain snow caps
  - id: region-snow-mid
    type: polygon
    z: 16
    points: "620,460 660,400 700,460"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-snow
