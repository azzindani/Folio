  # Foreground rocks
  - id: region-rock-left
    type: polygon
    z: 22
    points: "80,1020 80,1130 280,1130 200,1020"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: num-rock-left
    type: text
    z: 23
    x: 160
    y: 1066
    width: 40
    height: 0
    content: { type: plain, value: "9" }
    style: { font_family: $heading, font_size: 24, font_weight: 700, color: "$text", text_align: center }

  - id: region-rock-right
    type: polygon
    z: 22
    points: "920,1130 1020,1020 1160,1020 1160,1130"
    fill: { type: solid, color: "transparent" }
