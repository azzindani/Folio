_protocol: template/v1

# RSVP response card — 1500×1080 landscape, editorial-cream theme.
# Reply-by header, name line, accepts/regrets checkboxes, meal-choice rows, notes line.
meta:
  id: tmpl-rsvp-response-card
  name: RSVP Response Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, rsvp, wedding, response, landscape, cream]
  description: "Classic RSVP response card with reply-by header, attendance checkboxes, meal choices, and notes line."

document:
  width: 1500
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1080, fill: { type: solid, color: "$background" } }
  # 1 outer frame
  - { id: outer-frame, type: rect, z: 1, x: 60, y: 60, width: 1380, height: 960, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }

  # 2 ornament
  - { id: orn, type: text, z: 5, x: 60, y: 140, width: 1380, height: 0, content: { type: plain, value: "❀" }, style: { font_family: $heading, font_size: 36, color: "$primary", text_align: center } }

  # 3 hosts
  - { id: hosts, type: text, z: 10, x: 60, y: 200, width: 1380, height: 0, content: { type: plain, value: "Olivia & Daniel" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: "$text", text_align: center, line_height: 1.2 } }

  # 4 event line
  - { id: event-name, type: text, z: 11, x: 60, y: 260, width: 1380, height: 0, content: { type: plain, value: "Wedding Reception · October 17, 2026" }, style: { font_family: $body, font_size: 18, color: "$text_muted", text_align: center, letter_spacing: 0.3 } }

  # 5 kindly reply
  - { id: reply-by, type: text, z: 12, x: 60, y: 320, width: 1380, height: 0, content: { type: plain, value: "KINDLY REPLY BY  ·  SEPTEMBER 15, 2026" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.6 } }

  # 6 name label (M.)
  - { id: name-prefix, type: text, z: 20, x: 160, y: 410, width: 80, height: 0, content: { type: plain, value: "M." }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text" } }

  # 7 name line
  - { id: name-line, type: rect, z: 21, x: 220, y: 450, width: 1120, height: 1, fill: { type: solid, color: "$text" } }

  # ── Attendance row ──────────────────────────────────────
  # 8 accepts box
  - { id: acc-box, type: rect, z: 22, x: 220, y: 510, width: 26, height: 26, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 9 accepts label
  - { id: acc-lbl, type: text, z: 23, x: 260, y: 514, width: 480, height: 0, content: { type: plain, value: "joyfully accepts" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text" } }
  # 10 regrets box
  - { id: reg-box, type: rect, z: 22, x: 800, y: 510, width: 26, height: 26, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 11 regrets label
  - { id: reg-lbl, type: text, z: 23, x: 840, y: 514, width: 480, height: 0, content: { type: plain, value: "regretfully declines" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text" } }

  # 12 meal heading
  - { id: meal-h, type: text, z: 30, x: 220, y: 600, width: 1120, height: 0, content: { type: plain, value: "MENU SELECTION" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", letter_spacing: 0.5 } }

  # 13 meal1 marker
  - { id: m1-mark, type: circle, z: 31, cx: 233, cy: 660, rx: 8, ry: 8, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 14 meal1 label
  - { id: m1-lbl,  type: text, z: 32, x: 260, y: 650, width: 1100, height: 0, content: { type: plain, value: "Filet of beef with truffle butter" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text" } }
  # 15 meal2 marker
  - { id: m2-mark, type: circle, z: 31, cx: 233, cy: 712, rx: 8, ry: 8, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 16 meal2 label
  - { id: m2-lbl,  type: text, z: 32, x: 260, y: 702, width: 1100, height: 0, content: { type: plain, value: "Pan-seared halibut with lemon beurre blanc" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text" } }
  # 17 meal3 marker
  - { id: m3-mark, type: circle, z: 31, cx: 233, cy: 764, rx: 8, ry: 8, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 18 meal3 label
  - { id: m3-lbl,  type: text, z: 32, x: 260, y: 754, width: 1100, height: 0, content: { type: plain, value: "Wild mushroom risotto (vegetarian)" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text" } }

  # 19 notes heading
  - { id: notes-h, type: text, z: 40, x: 220, y: 830, width: 1120, height: 0, content: { type: plain, value: "ADDITIONAL NOTES" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", letter_spacing: 0.5 } }

  # 20 notes line
  - { id: notes-line, type: rect, z: 41, x: 220, y: 890, width: 1120, height: 1, fill: { type: solid, color: "$text" } }

  # 21 footer
  - { id: footer, type: text, z: 50, x: 60, y: 960, width: 1380, height: 0, content: { type: plain, value: "or reply online · oliviaanddaniel.com/rsvp" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: "$text_muted", text_align: center } }

slots:
  - { id: host_couple, path: "layers[3].content.value",  type: text, hint: "Host couple names",  default: "Olivia & Daniel" }
  - { id: event_name,  path: "layers[4].content.value",  type: text, hint: "Event name + date",  default: "Wedding Reception · October 17, 2026" }
  - { id: rsvp_by,     path: "layers[5].content.value",  type: text, hint: "Reply-by line",      default: "KINDLY REPLY BY  ·  SEPTEMBER 15, 2026" }
