_protocol: template/v1

# Craft beer can wrap — 1200×800 landscape (unrolled can), brutalist-mono theme.
# Heavy industrial type: brewery stripe top, beer name HUGE bold, style
# descriptor block, tasting notes panel, IBU/ABV/volume badges row, brewer's
# signature footer. All caps, raw, no-nonsense aesthetic.
meta:
  id: tmpl-beer-can-wrap
  name: Beer Can Wrap
  type: label
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [packaging, label, beer, can, beverage, brutalist, landscape]
  description: "Craft beer can wrap with brewery, beer name, style, IBU/ABV badges, and brewer signature."

document:
  width: 1200
  height: 800
  unit: px
  dpi: 96

theme:
  ref: brutalist-mono

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 800
    fill: { type: solid, color: "$background" }

  # ── Brewery stripe top ────────────────────────────────────
  - id: brewery-stripe
    type: rect
    z: 5
    x: 0
    y: 0
    width: 1200
    height: 80
    fill: { type: solid, color: "$text" }

  - id: brewery
    type: text
    z: 6
    x: 40
    y: 24
    width: 1120
    height: 0
    content: { type: plain, value: "IRON STACK BREWING CO." }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 900
      color: $background
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  # ── Vertical accent bars left ─────────────────────────────
  - id: bar-1
    type: rect
    z: 7
    x: 40
    y: 120
    width: 8
    height: 600
    fill: { type: solid, color: "$primary" }

  - id: bar-2
    type: rect
    z: 8
    x: 56
    y: 120
    width: 4
    height: 600
    fill: { type: solid, color: "$text" }

  # ── Beer name HUGE ────────────────────────────────────────
  - id: beer-name-line-1
    type: text
    z: 10
    x: 80
    y: 140
    width: 1080
    height: 0
    content: { type: plain, value: "BLACK" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: $text
      line_height: 0.92
      letter_spacing: -0.04
      text_transform: uppercase

  - id: beer-name-line-2
    type: text
    z: 11
    x: 80
    y: 290
    width: 1080
    height: 0
    content: { type: plain, value: "HAMMER" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: $primary
      line_height: 0.92
      letter_spacing: -0.04
      text_transform: uppercase

  # ── Style descriptor block ────────────────────────────────
  - id: style-block
    type: rect
    z: 15
    x: 80
    y: 460
    width: 480
    height: 80
    fill: { type: solid, color: "$text" }

  - id: style-text
    type: text
    z: 16
    x: 80
    y: 484
    width: 480
    height: 0
    content: { type: plain, value: "IMPERIAL STOUT" }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 900
      color: $background
      text_align: center
      letter_spacing: 0.06
      text_transform: uppercase

  # ── Tasting notes panel ───────────────────────────────────
  - id: notes-eyebrow
    type: text
    z: 20
    x: 600
    y: 460
    width: 560
    height: 0
    content: { type: plain, value: "// TASTING" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

  - id: notes-text
    type: text
    z: 21
    x: 600
    y: 484
    width: 560
    height: 0
    content: { type: plain, value: "Roasted coffee, dark chocolate, charred oak. Velvety body with a bitter finish." }
    style:
      font_family: $body
      font_size: 16
      color: $text
      line_height: 1.4

  # ── Divider ───────────────────────────────────────────────
  - id: divider
    type: rect
    z: 25
    x: 80
    y: 580
    width: 1080
    height: 4
    fill: { type: solid, color: "$text" }

  # ── Badge row: IBU ────────────────────────────────────────
  - id: badge-ibu-box
    type: rect
    z: 30
    x: 80
    y: 610
    width: 200
    height: 110
    fill: { type: solid, color: "$background" }
    stroke: { color: "$text", width: 3 }

  - id: badge-ibu-label
    type: text
    z: 31
    x: 80
    y: 624
    width: 200
    height: 0
    content: { type: plain, value: "IBU" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $text_muted
      text_align: center
      letter_spacing: 0.32

  - id: badge-ibu-value
    type: text
    z: 32
    x: 80
    y: 650
    width: 200
    height: 0
    content: { type: plain, value: "72" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 900
      color: $text
      text_align: center
      line_height: 1

  # ── Badge row: ABV ────────────────────────────────────────
  - id: badge-abv-box
    type: rect
    z: 33
    x: 310
    y: 610
    width: 200
    height: 110
    fill: { type: solid, color: "$primary" }
    stroke: { color: "$text", width: 3 }

  - id: badge-abv-label
    type: text
    z: 34
    x: 310
    y: 624
    width: 200
    height: 0
    content: { type: plain, value: "ABV" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $background
      text_align: center
      letter_spacing: 0.32

  - id: badge-abv-value
    type: text
    z: 35
    x: 310
    y: 650
    width: 200
    height: 0
    content: { type: plain, value: "9.4%" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 900
      color: $background
      text_align: center
      line_height: 1

  # ── Badge row: VOL ────────────────────────────────────────
  - id: badge-vol-box
    type: rect
    z: 36
    x: 540
    y: 610
    width: 200
    height: 110
    fill: { type: solid, color: "$background" }
    stroke: { color: "$text", width: 3 }

  - id: badge-vol-label
    type: text
    z: 37
    x: 540
    y: 624
    width: 200
    height: 0
    content: { type: plain, value: "VOLUME" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $text_muted
      text_align: center
      letter_spacing: 0.32

  - id: badge-vol-value
    type: text
    z: 38
    x: 540
    y: 650
    width: 200
    height: 0
    content: { type: plain, value: "473 ml" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 900
      color: $text
      text_align: center
      line_height: 1.4

  # ── Brewer's signature ────────────────────────────────────
  - id: brewer-eyebrow
    type: text
    z: 40
    x: 780
    y: 624
    width: 380
    height: 0
    content: { type: plain, value: "// BREWED BY" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

  - id: brewer-name
    type: text
    z: 41
    x: 780
    y: 650
    width: 380
    height: 0
    content: { type: plain, value: "Marcus Holt, Head Brewer" }
    style:
      font_family: $heading
      font_size: 22
      font_style: italic
      color: $text
      line_height: 1.3

  - id: brewer-batch
    type: text
    z: 42
    x: 780
    y: 696
    width: 380
    height: 0
    content: { type: plain, value: "BATCH 047 · LIMITED RELEASE" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $primary
      letter_spacing: 0.32

  # ── Footer bar ────────────────────────────────────────────
  - id: footer-bar
    type: rect
    z: 50
    x: 0
    y: 760
    width: 1200
    height: 40
    fill: { type: solid, color: "$text" }

  - id: footer-text
    type: text
    z: 51
    x: 40
    y: 770
    width: 1120
    height: 0
    content: { type: plain, value: "PORTLAND · OREGON  //  PLEASE DRINK RESPONSIBLY  //  GOVERNMENT WARNING APPLIES" }
    style:
      font_family: $mono
      font_size: 11
      font_weight: 700
      color: $background
      text_align: center
      letter_spacing: 0.24

slots:
  - { id: brewery,    path: "layers[2].content.value",  type: text, hint: "Brewery name",      default: "IRON STACK BREWING CO." }
  - { id: beer_name,  path: "layers[5].content.value",  type: text, hint: "Beer name line 1",  default: "BLACK" }
  - { id: style,      path: "layers[8].content.value",  type: text, hint: "Beer style",        default: "IMPERIAL STOUT" }
  - { id: ibu,        path: "layers[14].content.value", type: text, hint: "IBU value",         default: "72" }
  - { id: abv,        path: "layers[17].content.value", type: text, hint: "ABV percentage",    default: "9.4%" }
  - { id: volume_ml,  path: "layers[20].content.value", type: text, hint: "Volume in ml",      default: "473 ml" }
