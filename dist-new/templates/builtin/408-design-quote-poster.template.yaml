_protocol: template/v1

# Design quote poster — single Steve Jobs-style aphorism. LinkedIn 4:5.
# Massive italic serif quote + author attribution + open-quote glyph.
meta:
  id: tmpl-design-quote-poster
  name: Design Quote Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, design, quote, inspiration, "4-5"]
  description: "LinkedIn 4:5 design quote poster with display serif quote and attribution."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "ON DESIGN" }
    style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase }

  - id: glyph
    type: text
    z: 11
    x: 80
    y: 200
    width: 400
    height: 0
    content: { type: plain, value: "“" }
    style: { font_family: $heading, font_size: 280, font_weight: 800, color: $accent, line_height: 0.8 }

  - id: quote
    type: text
    z: 20
    x: 80
    y: 540
    width: 1040
    height: 0
    content: { type: plain, value: "Design is not just what it looks like and feels like. Design is how it works." }
    style: { font_family: $heading, font_size: 64, font_style: italic, font_weight: 500, color: $text, line_height: 1.2, letter_spacing: -0.02 }

  - { id: divider, type: rect, z: 30, x: 80, y: 1140, width: 80, height: 3, fill: { type: solid, color: "$primary" } }

  - id: author
    type: text
    z: 40
    x: 80
    y: 1180
    width: 1040
    height: 0
    content: { type: plain, value: "Steve Jobs" }
    style: { font_family: $heading, font_size: 36, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.01 }

  - id: author-caption
    type: text
    z: 41
    x: 80
    y: 1232
    width: 1040
    height: 0
    content: { type: plain, value: "Co-founder, Apple · 2003 interview" }
    style: { font_family: $body, font_size: 20, color: $text_muted, line_height: 1.4 }

  - id: page-mark
    type: text
    z: 70
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "01 / FOLIO" }
    style: { font_family: $mono, font_size: 13, font_weight: 600, color: $text_muted, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

  - id: handle
    type: text
    z: 71
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "@yourhandle" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, line_height: 1.4 }

animations:
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  author:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }
  author-caption:
    enter: { type: fade_up, duration: 500, delay: 1000, easing: ease-out }
  glyph:
    loop: { type: breathe, duration: 3200, scale: 1.03 }

slots:
  - { id: eyebrow,        path: "layers[2].content.value", type: text, hint: "Eyebrow",       default: "ON DESIGN" }
  - { id: quote,          path: "layers[4].content.value", type: text, hint: "Quote",         default: "Design is not just what it looks like and feels like. Design is how it works." }
  - { id: author,         path: "layers[6].content.value", type: text, hint: "Author",        default: "Steve Jobs" }
  - { id: author_caption, path: "layers[7].content.value", type: text, hint: "Author caption",default: "Co-founder, Apple · 2003 interview" }
  - { id: handle,         path: "layers[9].content.value", type: text, hint: "Handle",        default: "@yourhandle" }
