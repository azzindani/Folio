_protocol: template/v1

# 4-slide LinkedIn contrarian "hot take" carousel — Cover / Belief / Why-wrong / Do-instead.
# Portrait 1080×1350 (LinkedIn 4:5), brutalist-mono theme to match contrarian energy.
meta:
  id: tmpl-linkedin-hot-take-4slide
  name: LinkedIn Hot Take (4 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, hot-take, contrarian, opinion, 4-5]
  description: "Contrarian opinion carousel for LinkedIn. 4 portrait slides: a polarizing claim, the common belief it pushes against, the flaw, and the alternative. Built for thought leaders and operators who want their hot takes to travel."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: brutalist-mono

pages:
  # ── Slide 1 · Cover (polarizing claim) ─────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 100
        width: 920
        height: 0
        content: { type: plain, value: "HOT TAKE" }
        style: { font_family: $mono, font_size: 20, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase }
      - id: claim
        type: text
        z: 12
        x: 80
        y: 280
        width: 920
        height: 0
        content: { type: plain, value: "Most OKRs are theater." }
        style: { font_family: $heading, font_size: 140, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 }
      - id: divider
        type: rect
        z: 5
        x: 80
        y: 1090
        width: 160
        height: 6
        fill: { type: solid, color: "$accent" }
      - id: tagline
        type: text
        z: 13
        x: 80
        y: 1140
        width: 920
        height: 0
        content: { type: plain, value: "Swipe → unpopular, but I'll defend it." }
        style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.04 }
      - id: counter
        type: text
        z: 14
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "1/4" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · The common belief ────────────────────────────
  - id: belief
    label: Common Belief
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "WHAT EVERYONE SAYS" }
        style: { font_family: $mono, font_size: 20, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase }
      - id: quote-mark
        type: text
        z: 12
        x: 80
        y: 280
        width: 200
        height: 0
        content: { type: plain, value: "“" }
        style: { font_family: $heading, font_size: 220, font_weight: 800, color: $accent, line_height: 1 }
      - id: belief-body
        type: text
        z: 13
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "OKRs align teams around outcomes, give people focus, and turn strategy into measurable goals every quarter." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.25, font_style: italic, letter_spacing: -0.02 }
      - id: attribution
        type: text
        z: 14
        x: 80
        y: 1090
        width: 920
        height: 0
        content: { type: plain, value: "— Every leadership podcast since 2015" }
        style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.04 }
      - id: counter
        type: text
        z: 30
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "2/4" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Why it's wrong ───────────────────────────────
  - id: why-wrong
    label: Why It's Wrong
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "WHY IT'S WRONG" }
        style: { font_family: $mono, font_size: 20, font_weight: 700, color: $accent, letter_spacing: 0.4, text_transform: uppercase }
      - id: headline
        type: text
        z: 12
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "In practice, OKRs become a status ritual." }
        style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.2, letter_spacing: -0.02 }
      - { id: bullet-1-mark, type: rect, z: 20, x: 80, y: 440, width: 28, height: 6, fill: { type: solid, color: "$accent" } }
      - id: bullet-1
        type: text
        z: 21
        x: 130
        y: 420
        width: 870
        height: 0
        content: { type: plain, value: "Teams reverse-engineer KRs from work they were already going to do." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 }
      - { id: bullet-2-mark, type: rect, z: 20, x: 80, y: 620, width: 28, height: 6, fill: { type: solid, color: "$accent" } }
      - id: bullet-2
        type: text
        z: 22
        x: 130
        y: 600
        width: 870
        height: 0
        content: { type: plain, value: "Quarterly cadence is too slow for product reality, too fast for strategy." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 }
      - { id: bullet-3-mark, type: rect, z: 20, x: 80, y: 800, width: 28, height: 6, fill: { type: solid, color: "$accent" } }
      - id: bullet-3
        type: text
        z: 23
        x: 130
        y: 780
        width: 870
        height: 0
        content: { type: plain, value: "Scoring becomes the goal — graded at 0.7 means \"nailed it,\" graded at 1.0 means \"too easy.\"" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 }
      - { id: evidence-box, type: rect, z: 5, x: 80, y: 960, width: 920, height: 160, radius: 4, fill: { type: solid, color: "$surface" }, stroke: { color: "$text_muted", width: 1 } }
      - id: evidence-label
        type: text
        z: 20
        x: 110
        y: 990
        width: 860
        height: 0
        content: { type: plain, value: "// EVIDENCE" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.18 }
      - id: evidence-body
        type: text
        z: 21
        x: 110
        y: 1020
        width: 860
        height: 0
        content: { type: plain, value: "MIT Sloan (2024): 67% of managers said OKRs created \"performative work\" with no link to strategy." }
        style: { font_family: $mono, font_size: 20, color: $text, line_height: 1.45 }
      - id: counter
        type: text
        z: 30
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "3/4" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Do this instead ──────────────────────────────
  - id: do-instead
    label: Do Instead
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "DO THIS INSTEAD" }
        style: { font_family: $mono, font_size: 20, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase }
      - id: headline
        type: text
        z: 12
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "Plan in bets, not goals." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - { id: alt-1-mark, type: rect, z: 20, x: 80, y: 480, width: 28, height: 6, fill: { type: solid, color: "$primary" } }
      - id: alt-1
        type: text
        z: 21
        x: 130
        y: 460
        width: 870
        height: 0
        content: { type: plain, value: "Run 6-week bets with one owner, one hypothesis, one kill-switch date." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 }
      - { id: alt-2-mark, type: rect, z: 20, x: 80, y: 640, width: 28, height: 6, fill: { type: solid, color: "$primary" } }
      - id: alt-2
        type: text
        z: 22
        x: 130
        y: 620
        width: 870
        height: 0
        content: { type: plain, value: "Track 2-3 north-star metrics weekly — drop the per-team KR sprawl." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 }
      - { id: alt-3-mark, type: rect, z: 20, x: 80, y: 800, width: 28, height: 6, fill: { type: solid, color: "$primary" } }
      - id: alt-3
        type: text
        z: 23
        x: 130
        y: 780
        width: 870
        height: 0
        content: { type: plain, value: "Replace quarterly reviews with monthly bet retros — what did we learn, what's next?" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 }
      - { id: cta-chip, type: rect, z: 14, x: 80, y: 1000, width: 720, height: 72, radius: 4, fill: { type: solid, color: "$primary" } }
      - id: cta-text
        type: text
        z: 15
        x: 80
        y: 1022
        width: 720
        height: 0
        content: { type: plain, value: "Save → revisit on your next planning offsite" }
        style: { font_family: $mono, font_size: 20, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.04 }
      - id: handle
        type: text
        z: 16
        x: 80
        y: 1180
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle · agree? disagree? comments are open." }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: counter
        type: text
        z: 30
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "4/4" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

slots:
  - { id: cover_eyebrow,  path: "pages[0].layers[2].content.value", type: text, hint: "Cover eyebrow label",         default: "HOT TAKE" }
  - { id: cover_claim,    path: "pages[0].layers[3].content.value", type: text, hint: "Polarizing claim headline",   default: "Most OKRs are theater." }
  - { id: belief_body,    path: "pages[1].layers[4].content.value", type: text, hint: "The common belief quote",     default: "OKRs align teams around outcomes, give people focus, and turn strategy into measurable goals every quarter." }
  - { id: wrong_headline, path: "pages[2].layers[3].content.value", type: text, hint: "Why-it's-wrong headline",     default: "In practice, OKRs become a status ritual." }
  - { id: wrong_evidence, path: "pages[2].layers[12].content.value",type: text, hint: "Supporting stat / anecdote",  default: "MIT Sloan (2024): 67% of managers said OKRs created \"performative work\" with no link to strategy." }
  - { id: instead_headline,path: "pages[3].layers[3].content.value",type: text, hint: "Do-instead headline",         default: "Plan in bets, not goals." }
  - { id: instead_cta,    path: "pages[3].layers[11].content.value",type: text, hint: "Save / CTA chip copy",        default: "Save → revisit on your next planning offsite" }
