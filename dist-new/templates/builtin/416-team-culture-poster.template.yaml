_protocol: template/v1

# Team culture poster — eyebrow, 3 value rows stacked vertically with icon + name + description.
# 4:5 LinkedIn portrait, forest-deep theme.
meta:
  id: tmpl-team-culture-poster
  name: Team Culture Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, hr, culture, values, portrait, 4-5]
  description: "LinkedIn 4:5 culture poster with three stacked value rows: icon, name, description."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: forest-deep

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "OUR CULTURE" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: title
    type: text
    z: 21
    x: 80
    y: 190
    width: 1040
    height: 0
    content: { type: plain, value: "How we work\nwith each other." }
    style:
      font_family: $heading
      font_size: 80
      font_weight: 900
      color: $text
      line_height: 1.05
      letter_spacing: -0.03

  - id: row-1-icon
    type: rect
    z: 30
    x: 80
    y: 480
    width: 96
    height: 96
    radius: 20
    fill: { type: solid, color: "$primary" }

  - id: row-1-glyph
    type: text
    z: 31
    x: 80
    y: 502
    width: 96
    height: 0
    content: { type: plain, value: "01" }
    style:
      font_family: $mono
      font_size: 30
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  - id: row-1-name
    type: text
    z: 32
    x: 220
    y: 488
    width: 900
    height: 0
    content: { type: plain, value: "Default to writing." }
    style:
      font_family: $heading
      font_size: 42
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: row-1-desc
    type: text
    z: 33
    x: 220
    y: 548
    width: 900
    height: 0
    content: { type: plain, value: "If it's worth a meeting, it's worth a doc first." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.4

  - id: row-2-icon
    type: circle
    z: 30
    cx: 128
    cy: 768
    rx: 48
    ry: 48
    fill: { type: solid, color: "$primary" }

  - id: row-2-glyph
    type: text
    z: 31
    x: 80
    y: 750
    width: 96
    height: 0
    content: { type: plain, value: "02" }
    style:
      font_family: $mono
      font_size: 30
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  - id: row-2-name
    type: text
    z: 32
    x: 220
    y: 736
    width: 900
    height: 0
    content: { type: plain, value: "Ship small. Ship often." }
    style:
      font_family: $heading
      font_size: 42
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: row-2-desc
    type: text
    z: 33
    x: 220
    y: 796
    width: 900
    height: 0
    content: { type: plain, value: "Two-week bets, not six-month plans. Learning compounds." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.4

  - id: row-3-icon
    type: rect
    z: 30
    x: 80
    y: 1016
    width: 96
    height: 96
    radius: 20
    fill: { type: solid, color: "$primary" }

  - id: row-3-glyph
    type: text
    z: 31
    x: 80
    y: 1038
    width: 96
    height: 0
    content: { type: plain, value: "03" }
    style:
      font_family: $mono
      font_size: 30
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  - id: row-3-name
    type: text
    z: 32
    x: 220
    y: 1024
    width: 900
    height: 0
    content: { type: plain, value: "Trust the work, not the hours." }
    style:
      font_family: $heading
      font_size: 42
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: row-3-desc
    type: text
    z: 33
    x: 220
    y: 1084
    width: 900
    height: 0
    content: { type: plain, value: "Outcomes over presence. Async over status meetings." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.4

  - id: divider
    type: rect
    z: 10
    x: 80
    y: 1280
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.3

  - id: footer-team
    type: text
    z: 50
    x: 80
    y: 1320
    width: 700
    height: 0
    content: { type: plain, value: "@yourcompany" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 800
      color: $text
      line_height: 1.2

  - id: footer-sub
    type: text
    z: 51
    x: 80
    y: 1370
    width: 700
    height: 0
    content: { type: plain, value: "Hiring engineers, designers, and PMs." }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.4

  - id: footer-tag
    type: text
    z: 52
    x: 880
    y: 1370
    width: 240
    height: 0
    content: { type: plain, value: "JOIN US →" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_align: right
      text_transform: uppercase

animations:
  title:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  row-1-name:
    enter: { type: slide_up, duration: 600, delay: 400, easing: ease-out }
  row-2-name:
    enter: { type: slide_up, duration: 600, delay: 600, easing: ease-out }
  row-3-name:
    enter: { type: slide_up, duration: 600, delay: 800, easing: ease-out }
  accent-band:
    loop: { type: breathe, duration: 3000, scale: 1.03 }

slots:
  - { id: eyebrow,      path: "layers[2].content.value",  type: text, hint: "Eyebrow",         default: "OUR CULTURE" }
  - { id: title,        path: "layers[3].content.value",  type: text, hint: "Title",           default: "How we work\nwith each other." }
  - { id: value_1_name, path: "layers[6].content.value",  type: text, hint: "Value 1 name",    default: "Default to writing." }
  - { id: value_1_desc, path: "layers[7].content.value",  type: text, hint: "Value 1 desc",    default: "If it's worth a meeting, it's worth a doc first." }
  - { id: value_2_name, path: "layers[10].content.value", type: text, hint: "Value 2 name",    default: "Ship small. Ship often." }
  - { id: value_2_desc, path: "layers[11].content.value", type: text, hint: "Value 2 desc",    default: "Two-week bets, not six-month plans." }
  - { id: value_3_name, path: "layers[14].content.value", type: text, hint: "Value 3 name",    default: "Trust the work, not the hours." }
  - { id: value_3_desc, path: "layers[15].content.value", type: text, hint: "Value 3 desc",    default: "Outcomes over presence. Async over status meetings." }
  - { id: company,      path: "layers[17].content.value", type: text, hint: "Company handle",  default: "@yourcompany" }
  - { id: hiring,       path: "layers[18].content.value", type: text, hint: "Hiring line",     default: "Hiring engineers, designers, and PMs." }
