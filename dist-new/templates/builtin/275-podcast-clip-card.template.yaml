      text_align: right
      text_transform: uppercase

slots:
  - { id: episode_title,  path: "layers[5].content.value",  type: text, hint: "Episode title",     default: "On Curiosity & Quiet Confidence" }
  - { id: hosts,          path: "layers[8].content.value",  type: text, hint: "Host names",        default: "MAYA ELLISON-WONG & THEO KALANI" }
  - { id: quote,          path: "layers[36].content.value", type: text, hint: "Pull quote",        default: "You don't need to shout to be heard. You need to listen long enough to know what to say." }
  - { id: episode_number, path: "layers[38].content.value", type: text, hint: "Episode number",   default: "EPISODE 047" }
  - { id: release_date,   path: "layers[39].content.value", type: text, hint: "Release date",     default: "MAY 14 · 2026" }
