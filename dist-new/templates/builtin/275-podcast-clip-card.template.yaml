_protocol: template/v1

# Podcast clip share card (1080×1080 square).
# Indigo-pro: episode title, host names, waveform bars (rect strip),
# pull-quote from episode, episode # + date footer.
meta:
  id: tmpl-podcast-clip-card
  name: Podcast Clip Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, podcast, clip, audio, share, square, indigo]
  description: "Podcast clip share card with episode title, hosts, waveform, and pull-quote."

document:
  width: 1080
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1080
    fill: { type: solid, color: $background }
  - id: bg-bloom
    type: circle
    z: 1
    cx: 880
    cy: 200
    rx: 320
    ry: 320
    fill: { type: none }
    opacity: 0.5

  - id: top-rule
    type: rect
    z: 2
    x: 80
    y: 120
    width: 80
    height: 6
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 80
    width: 920
    height: 0
    content: { type: plain, value: "PODCAST · CLIP OF THE WEEK" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 800
      color: $primary
      letter_spacing: 0.42
      text_transform: uppercase

  - id: show-name
    type: text
    z: 11
    x: 80
    y: 80
    width: 920
    height: 0
    content: { type: plain, value: "EP 047" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.42
      text_align: right
      text_transform: uppercase

  - id: episode-title
    type: text
    z: 20
    x: 80
    y: 170
    width: 920
    height: 0
    content: { type: plain, value: "On Curiosity & Quiet Confidence" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.015

  - id: hosts-rule
    type: rect
    z: 25
    x: 80
    y: 320
    width: 60
    height: 2
    fill: { type: solid, color: "$secondary" }

  - id: hosts-label
    type: text
    z: 30
    x: 80
    y: 340
    width: 920
    height: 0
    content: { type: plain, value: "HOSTED BY" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.42
      text_transform: uppercase

  - id: hosts
    type: text
    z: 31
    x: 80
    y: 370
    width: 920
    height: 0
    content: { type: plain, value: "MAYA ELLISON-WONG & THEO KALANI" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 800
      color: $text
      letter_spacing: 0.32
      text_transform: uppercase

  - id: waveform-frame
    type: rect
    z: 40
    x: 80
    y: 450
    width: 920
    height: 200
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 1 }
    opacity: 0.7

