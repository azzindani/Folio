_protocol: template/v1

# Single-page LinkedIn new-role announcement poster.
# 4:5 portrait 1200×1500. ocean-blue theme. Eyebrow + role title + day-1 date + body + CTA.
meta:
  id: tmpl-new-role-poster
  name: New Role Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, career, new-role, announcement, 4-5]
  description: "LinkedIn 4:5 poster announcing a new role with company name, day-1 date, and what's next body."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1110
    cy: 130
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "JOINING STRIPE" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_transform: uppercase

  - id: role-title
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "Staff Product\nDesigner" }
    style:
      font_family: $heading
      font_size: 108
      font_weight: 900
      color: $text
      line_height: 0.98
      letter_spacing: -0.03

  - id: company-name
    type: text
    z: 22
    x: 80
    y: 480
    width: 1040
    height: 0
    content: { type: plain, value: "@ Stripe" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: $primary
      line_height: 1.0
      letter_spacing: -0.02

  - id: subtitle
    type: text
    z: 23
    x: 80
    y: 600
    width: 1040
    height: 0
    content: { type: plain, value: "My next chapter starts at the team building global payments infrastructure." }
    style:
      font_family: $body
      font_size: 28
      color: $text_muted
      line_height: 1.45

  - id: divider
    type: rect
    z: 10
    x: 80
    y: 740
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.25

  - id: day1-label
    type: text
    z: 24
    x: 80
    y: 770
    width: 1040
    height: 0
    content: { type: plain, value: "DAY ONE" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: day1-date
    type: text
    z: 25
    x: 80
    y: 810
    width: 1040
    height: 0
    content: { type: plain, value: "2026.06.01" }
    style:
      font_family: $mono
      font_size: 48
      font_weight: 700
      color: $text
      letter_spacing: 0.02

  - id: body-label
    type: text
    z: 26
    x: 80
    y: 920
    width: 1040
    height: 0
    content: { type: plain, value: "WHAT I'LL BE WORKING ON" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: body-p1
    type: text
    z: 27
    x: 80
    y: 960
    width: 1040
    height: 0
    content: { type: plain, value: "Leading the design system that powers checkout for millions of businesses — the kind of work where one button change ripples to every storefront on the internet." }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.55

  - id: body-p2
    type: text
    z: 28
    x: 80
    y: 1130
    width: 1040
    height: 0
    content: { type: plain, value: "Excited to bring everything I've learned about scaling design teams into a place that takes craft this seriously. More to share soon." }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.55

  - id: cta-btn
    type: rect
    z: 50
    x: 80
    y: 1300
    width: 320
    height: 64
    radius: 32
    fill: { type: solid, color: "$primary" }

  - id: cta-text
    type: text
    z: 51
    x: 80
    y: 1318
    width: 320
    height: 64
    content: { type: plain, value: "Follow along →" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

  - id: author
    type: text
    z: 60
    x: 80
    y: 1410
    width: 700
    height: 0
    content: { type: plain, value: "@yourhandle · stripe.com" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      letter_spacing: 0.04

  - id: page-mark
    type: text
    z: 61
    x: 880
    y: 1410
    width: 240
    height: 0
    content: { type: plain, value: "FOLIO" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: right
      text_transform: uppercase

animations:
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.25 }
  role-title:
    enter: { type: fade_up, duration: 800, delay: 100, easing: ease-out }
  company-name:
    enter: { type: scale_in, duration: 600, delay: 300, easing: ease-out }
  body-p1:
    enter: { type: fade_in, duration: 500, delay: 700, easing: ease-out }
  body-p2:
    enter: { type: fade_in, duration: 500, delay: 900, easing: ease-out }

slots:
  - { id: eyebrow,      path: "layers[3].content.value",  type: text, hint: "Eyebrow · JOINING <COMPANY>",  default: "JOINING STRIPE" }
  - { id: role_title,   path: "layers[4].content.value",  type: text, hint: "Role title display",           default: "Staff Product\nDesigner" }
  - { id: company_name, path: "layers[5].content.value",  type: text, hint: "Company name",                 default: "@ Stripe" }
  - { id: subtitle,     path: "layers[6].content.value",  type: text, hint: "Subtitle line",                default: "My next chapter starts at..." }
  - { id: day1_date,    path: "layers[9].content.value",  type: text, hint: "Day-1 date",                   default: "2026.06.01" }
  - { id: body_p1,      path: "layers[11].content.value", type: text, hint: "What I'll work on · P1",       default: "Leading the design system..." }
  - { id: body_p2,      path: "layers[12].content.value", type: text, hint: "What I'll work on · P2",       default: "Excited to bring everything..." }
  - { id: cta_text,     path: "layers[14].content.value", type: text, hint: "CTA text",                     default: "Follow along →" }
  - { id: author,       path: "layers[15].content.value", type: text, hint: "Handle + URL",                 default: "@yourhandle · stripe.com" }
