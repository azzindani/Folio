_protocol: template/v1

# Action movie poster (1280×1920 portrait, 27×40 inch ratio).
# Cinematic: lead-actor names top, tagline above huge title, IN THEATERS
# date strip, studio logos at bottom.
meta:
  id: tmpl-movie-poster-action
  name: Movie Poster — Action
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, movie, film, action, cinematic, theatrical]
  description: "Cinematic action movie poster with huge title, tagline and IN THEATERS release strip."

document:
  width: 1280
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: dark-tech
  overrides:
    primary: "#F2A03D"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1280
    height: 1920
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "#000000", position: 0 }
        - { color: "$background", position: 50 }
        - { color: "#0A0E14", position: 100 }

  - id: skyline-glow
    type: circle
    z: 1
    cx: 640
    cy: 1100
    rx: 720
    ry: 360
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.35

  - id: horizon-line
    type: rect
    z: 2
    x: 0
    y: 1080
    width: 1280
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: lead-actors
    type: text
    z: 10
    x: 120
    y: 140
    width: 1040
    height: 0
    content: { type: plain, value: "JACK MORENO    ELENA HALLOWAY    DEVON ARRIETA" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 800
      color: $text
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: lead-rule
    type: rect
    z: 11
    x: 400
    y: 200
    width: 480
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: studio-presents
    type: text
    z: 12
    x: 120
    y: 230
    width: 1040
    height: 0
    content: { type: plain, value: "A FORTRESS PICTURES PRODUCTION" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: tagline
    type: text
    z: 20
    x: 120
    y: 1140
    width: 1040
    height: 0
    content:
      type: plain
      value: "ONE LAST RUN.\nNO WAY HOME."
    style:
      font_family: $heading
      font_size: 38
      font_weight: 700
      color: $text
      line_height: 1.2
      letter_spacing: 0.04
      text_align: center
      text_transform: uppercase

  - id: title-line-1
    type: text
    z: 30
    x: 80
    y: 1290
    width: 1120
    height: 0
    content: { type: plain, value: "BLACK" }
    style:
      font_family: $heading
      font_size: 280
      font_weight: 900
      color: $text
      line_height: 0.88
      letter_spacing: -0.04
      text_align: center
      text_transform: uppercase

  - id: title-line-2
    type: text
    z: 31
    x: 80
    y: 1500
    width: 1120
    height: 0
    content: { type: plain, value: "HORIZON" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 900
      color: $primary
      line_height: 0.88
      letter_spacing: -0.04
      text_align: center
      text_transform: uppercase

  - id: release-strip
    type: rect
    z: 40
    x: 0
    y: 1740
    width: 1280
    height: 60
    fill: { type: solid, color: "$primary" }

  - id: release-text
    type: text
    z: 41
    x: 120
    y: 1758
    width: 1040
    height: 0
    content: { type: plain, value: "IN THEATERS · 24 JULY 2026" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 900
      color: $background
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: rating-box
    type: rect
    z: 50
    x: 120
    y: 1840
    width: 60
    height: 40
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: rating-text
    type: text
    z: 51
    x: 120
    y: 1850
    width: 60
    height: 0
    content: { type: plain, value: "PG-13" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 800
      color: $text
      letter_spacing: 0.04
      text_align: center

  - id: studios
    type: text
    z: 52
    x: 200
    y: 1855
    width: 880
    height: 0
    content: { type: plain, value: "FORTRESS · ATLAS PICTURES · SUMMIT WORKS · #BLACKHORIZON" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

slots:
  - { id: lead_actors,  path: "layers[3].content.value",  type: text, hint: "Lead actor names",     default: "JACK MORENO    ELENA HALLOWAY    DEVON ARRIETA" }
  - { id: tagline,      path: "layers[6].content.value",  type: text, hint: "Tagline (multi-line)", default: "ONE LAST RUN.\nNO WAY HOME." }
  - { id: title,        path: "layers[7].content.value",  type: text, hint: "Movie title line 1",   default: "BLACK" }
  - { id: title_line_2, path: "layers[8].content.value",  type: text, hint: "Movie title line 2",   default: "HORIZON" }
  - { id: release_date, path: "layers[10].content.value", type: text, hint: "Release strip text",   default: "IN THEATERS · 24 JULY 2026" }
