_protocol: template/v1

# Coupon / discount card — landscape (1500×600).
# Warm sunset palette, oversized percent-off, dashed code box, expiry,
# perforated edge (vertical dash stripe), brand top-left, terms micro-print.
meta:
  id: tmpl-coupon-discount-card
  name: Coupon / Discount Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, marketing, coupon, discount, promo, voucher]
  description: "Landscape promo coupon with discount percent, code box, expiry, perforated edge and terms micro-print."

document:
  width: 1500
  height: 600
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 600
    radius: 24
    fill: { type: solid, color: $primary }
  - id: card-inner
    type: rect
    z: 1
    x: 24
    y: 24
    width: 1452
    height: 552
    radius: 18
    fill: { type: solid, color: "transparent" }
    stroke: { color: "rgba(255,255,255,0.35)", width: 2, dasharray: "1 5" }

  # Perforated vertical edge near right side — 17 small dashes
  - id: perf-bg
    type: rect
    z: 2
    x: 1060
    y: 60
    width: 4
    height: 480
    fill: { type: solid, color: "rgba(255,255,255,0.10)" }

  - id: perf-1
    type: rect
    z: 3
    x: 1056
    y: 70
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-2
    type: rect
    z: 4
    x: 1056
    y: 108
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-3
    type: rect
    z: 5
    x: 1056
    y: 146
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

