    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-5
    type: rect
    z: 7
    x: 1056
    y: 222
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-6
    type: rect
    z: 8
    x: 1056
    y: 260
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-7
    type: rect
    z: 9
    x: 1056
    y: 298
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-8
    type: rect
    z: 10
    x: 1056
    y: 336
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-9
    type: rect
    z: 11
    x: 1056
    y: 374
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-10
    type: rect
    z: 12
    x: 1056
    y: 412
    width: 12
    height: 16
    radius: 4
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: perf-11
    type: rect
    z: 13
