_protocol: template/v1

# Pricing comparison table — 1920×1080 landscape, light-clean theme.
# Headline + 3-column pricing (Starter / Pro / Enterprise), most-popular badge on Pro.
meta:
  id: tmpl-pricing-comparison-table
  name: Pricing Comparison Table
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, screen, pricing, saas, landscape, light]
  description: "Three-tier pricing comparison with feature lists and a most-popular highlighted middle plan."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Headline ──────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 70
    width: 1800
    height: 0
    content: { type: plain, value: "PRICING" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.32

  - id: headline
    type: text
    z: 11
    x: 60
    y: 100
    width: 1800
    height: 0
    content: { type: plain, value: "Plans that scale with you" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: $text
      text_align: center
      letter_spacing: -0.02

  - id: subheadline
    type: text
    z: 12
    x: 60
    y: 175
    width: 1800
    height: 0
    content: { type: plain, value: "Start free, upgrade when you outgrow it. Cancel anytime." }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      text_align: center

  # ── Card 1 — Starter ──────────────────────────────────────
  - id: card-1
    type: rect
    z: 20
    x: 100
    y: 270
    width: 540
    height: 720
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: c1-name
    type: text
    z: 21
    x: 140
    y: 310
    width: 460
    height: 0
    content: { type: plain, value: "Starter" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text

  - id: c1-price
    type: text
    z: 22
    x: 140
    y: 360
    width: 460
    height: 0
    content: { type: plain, value: "$0" }
    style:
      font_family: $heading
      font_size: 88
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.02

  - id: c1-period
    type: text
    z: 23
    x: 140
    y: 460
    width: 460
    height: 0
    content: { type: plain, value: "Free forever · no card required" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  - id: c1-feat
    type: text
    z: 24
    x: 140
    y: 530
    width: 460
    height: 0
    content: { type: plain, value: "✓  Up to 3 projects\n✓  1 GB storage\n✓  Community support\n✓  Basic templates\n✓  Email notifications\n✓  Mobile + web access" }
    style:
      font_family: $body
      font_size: 17
      color: $text
      line_height: 1.9

  - id: c1-cta
    type: rect
    z: 25
    x: 140
    y: 880
    width: 460
    height: 64
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: c1-cta-text
    type: text
    z: 26
    x: 140
    y: 900
    width: 460
    height: 0
    content: { type: plain, value: "Get started" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $primary
      text_align: center

  # ── Card 2 — Pro (highlighted) ────────────────────────────
  - id: card-2
    type: rect
    z: 30
    x: 690
    y: 240
    width: 540
    height: 780
    radius: 24
    fill: { type: solid, color: "$text" }
    effects:
      shadow:
        - { dx: 0, dy: 16, blur: 40, color: "rgba(0,0,0,0.18)" }

  - id: c2-badge-bg
    type: rect
    z: 31
    x: 880
    y: 215
    width: 160
    height: 48
    radius: 24
    fill: { type: solid, color: "$primary" }

  - id: c2-badge-text
    type: text
    z: 32
    x: 880
    y: 229
    width: 160
    height: 0
    content: { type: plain, value: "MOST POPULAR" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      letter_spacing: 0.18

  - id: c2-name
    type: text
    z: 33
    x: 730
    y: 300
    width: 460
    height: 0
    content: { type: plain, value: "Pro" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $background

  - id: c2-price
    type: text
    z: 34
    x: 730
    y: 350
    width: 460
    height: 0
    content: { type: plain, value: "$24" }
    style:
      font_family: $heading
      font_size: 88
      font_weight: 800
      color: $background
      line_height: 1
      letter_spacing: -0.02

  - id: c2-period
    type: text
    z: 35
    x: 730
    y: 450
    width: 460
    height: 0
    content: { type: plain, value: "Per user / month · billed annually" }
    style:
      font_family: $body
      font_size: 16
      color: "rgba(255,255,255,0.65)"

  - id: c2-feat
    type: text
    z: 36
    x: 730
    y: 520
    width: 460
    height: 0
    content: { type: plain, value: "✓  Unlimited projects\n✓  100 GB storage\n✓  Priority email support\n✓  All templates + custom branding\n✓  Advanced analytics dashboard\n✓  Team sharing (up to 10)" }
    style:
      font_family: $body
      font_size: 17
      color: $background
      line_height: 1.9

  - id: c2-cta
    type: rect
    z: 37
    x: 730
    y: 900
    width: 460
    height: 80
    radius: 12
    fill: { type: solid, color: "$primary" }

  - id: c2-cta-text
    type: text
    z: 38
    x: 730
    y: 928
    width: 460
    height: 0
    content: { type: plain, value: "Start 14-day trial" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

  # ── Card 3 — Enterprise ───────────────────────────────────
  - id: card-3
    type: rect
    z: 40
    x: 1280
    y: 270
    width: 540
    height: 720
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: c3-name
    type: text
    z: 41
    x: 1320
    y: 310
    width: 460
    height: 0
    content: { type: plain, value: "Enterprise" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text

  - id: c3-price
    type: text
    z: 42
    x: 1320
    y: 360
    width: 460
    height: 0
    content: { type: plain, value: "Custom" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.02

  - id: c3-period
    type: text
    z: 43
    x: 1320
    y: 460
    width: 460
    height: 0
    content: { type: plain, value: "Volume pricing · annual contract" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  - id: c3-feat
    type: text
    z: 44
    x: 1320
    y: 530
    width: 460
    height: 0
    content: { type: plain, value: "✓  Everything in Pro, plus:\n✓  SSO + SCIM provisioning\n✓  Dedicated success manager\n✓  99.99% uptime SLA\n✓  Custom data residency\n✓  Audit logs + SOC 2 reports" }
    style:
      font_family: $body
      font_size: 17
      color: $text
      line_height: 1.9

  - id: c3-cta
    type: rect
    z: 45
    x: 1320
    y: 880
    width: 460
    height: 64
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: c3-cta-text
    type: text
    z: 46
    x: 1320
    y: 900
    width: 460
    height: 0
    content: { type: plain, value: "Talk to sales" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $primary
      text_align: center

  # ── Footer note ───────────────────────────────────────────
  - id: footer
    type: text
    z: 50
    x: 60
    y: 1030
    width: 1800
    height: 0
    content: { type: plain, value: "All plans include SSL, automatic backups, and a 30-day money-back guarantee." }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted
      text_align: center

slots:
  - { id: tier_1_price, path: "layers[6].content.value",  type: text, hint: "Starter price",     default: "$0" }
  - { id: tier_2_price, path: "layers[16].content.value", type: text, hint: "Pro price",         default: "$24" }
  - { id: tier_3_price, path: "layers[24].content.value", type: text, hint: "Enterprise price",  default: "Custom" }
