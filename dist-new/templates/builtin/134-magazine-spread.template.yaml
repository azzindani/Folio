_protocol: template/v1

# 4-page editorial magazine spread — 2480×1754 landscape A4 spread, editorial-cream theme.
# Cover spread → feature opener with pull quote → continuation → back cover ads + credits.
meta:
  id: tmpl-magazine-spread
  name: Magazine Spread · Editorial (4 pages)
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, magazine, editorial, spread, cream, landscape]
  description: "Four-page editorial magazine spread with cover, feature opener with pull quote, continuation, and back cover credits."

document:
  width: 2480
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Cover Spread ───────────────────────────────────
  - id: cover-spread
    label: Cover Spread
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 2480, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: spine, type: rect, z: 1, x: 1240, y: 100, width: 1, height: 1554, fill: { type: solid, color: "$border" }, opacity: 0.6 }
      - { id: photo-block, type: rect, z: 2, x: 100, y: 100, width: 1140, height: 1554, fill: { type: solid, color: $primary }, opacity: 0.85 }
      - { id: photo-grain, type: rect, z: 3, x: 100, y: 100, width: 1140, height: 1554, fill: { type: none } }
      - { id: subject-shadow, type: ellipse, z: 5, cx: 670, cy: 1480, rx: 300, ry: 40, fill: { type: solid, color: "#000000" }, opacity: 0.3 }
      - { id: subject-body, type: rect, z: 6, x: 540, y: 600, width: 260, height: 800, radius: 130, fill: { type: solid, color: "#2D1810" } }
      - { id: subject-head, type: circle, z: 7, cx: 670, cy: 530, rx: 130, ry: 130, fill: { type: solid, color: "#8B6240" } }
      - { id: subject-hair, type: ellipse, z: 8, cx: 670, cy: 460, rx: 140, ry: 90, fill: { type: solid, color: "#1A0F08" } }
      - { id: caption-pill, type: rect, z: 10, x: 130, y: 1600, width: 280, height: 36, radius: 18, fill: { type: solid, color: "rgba(255,255,255,0.85)" } }
      - { id: caption-text, type: text, z: 11, x: 130, y: 1610, width: 280, height: 0, content: { type: plain, value: "PORTRAIT · ASHA BATALA" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: masthead-frame, type: rect, z: 20, x: 1280, y: 100, width: 40, height: 1554, fill: { type: solid, color: "$primary" } }
      - { id: masthead, type: text, z: 21, x: 1380, y: 200, width: 1000, height: 0, content: { type: plain, value: "MERIDIAN" }, style: { font_family: $heading, font_size: 144, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 } }
      - { id: tagline, type: text, z: 22, x: 1380, y: 360, width: 1000, height: 0, content: { type: plain, value: "A quarterly journal of letters & ideas" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $text_muted, line_height: 1.4 } }
      - { id: issue-pill, type: rect, z: 23, x: 1380, y: 440, width: 240, height: 44, radius: 22, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1.5 } }
      - { id: issue-text, type: text, z: 24, x: 1380, y: 454, width: 240, height: 0, content: { type: plain, value: "ISSUE No. 47 · SPRING" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: divider, type: rect, z: 30, x: 1380, y: 580, width: 80, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: ft-kicker, type: text, z: 31, x: 1380, y: 620, width: 1000, height: 0, content: { type: plain, value: "THIS ISSUE" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: ft-title, type: text, z: 32, x: 1380, y: 680, width: 1000, height: 0, content: { type: plain, value: "The Quiet\nReturn of\nthe Long\nForm." }, style: { font_family: $heading, font_size: 144, font_weight: 700, color: $text, line_height: 0.95, letter_spacing: -0.03 } }
      - { id: ft-deck, type: text, z: 33, x: 1380, y: 1280, width: 1000, height: 0, content: { type: plain, value: "On the unhurried craft of reading\nin an age of infinite feeds." }, style: { font_family: $heading, font_size: 32, font_style: italic, color: $text_muted, line_height: 1.4 } }
      - { id: contents-divider, type: rect, z: 40, x: 1380, y: 1400, width: 1000, height: 1, fill: { type: solid, color: "$border" } }
      - { id: also-in-label, type: text, z: 41, x: 1380, y: 1430, width: 1000, height: 0, content: { type: plain, value: "ALSO IN THIS ISSUE" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: also-1, type: text, z: 42, x: 1380, y: 1480, width: 1000, height: 0, content: { type: plain, value: "→ The architect who designs only chapels  ·  p. 14" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: also-2, type: text, z: 42, x: 1380, y: 1530, width: 1000, height: 0, content: { type: plain, value: "→ Letters from a small French press  ·  p. 42" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: also-3, type: text, z: 42, x: 1380, y: 1580, width: 1000, height: 0, content: { type: plain, value: "→ Three poets on revision  ·  p. 78" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: price, type: text, z: 50, x: 1380, y: 1670, width: 600, height: 0, content: { type: plain, value: "£14  ·  $18  ·  €16" }, style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.3 } }
      - { id: barcode-mark, type: rect, z: 51, x: 2280, y: 1620, width: 100, height: 60, fill: { type: solid, color: "$text" } }

  # ── Page 2 · Feature Opener ─────────────────────────────────
  - id: feature-opener
    label: Feature Opener
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 2480, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: spine, type: rect, z: 1, x: 1240, y: 100, width: 1, height: 1554, fill: { type: solid, color: "$border" }, opacity: 0.6 }
      - { id: section-bar, type: rect, z: 10, x: 100, y: 140, width: 200, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: section-label, type: text, z: 11, x: 100, y: 160, width: 1100, height: 0, content: { type: plain, value: "FEATURE  ·  ESSAY  ·  ASHA BATALA" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: kicker, type: text, z: 12, x: 100, y: 240, width: 1100, height: 0, content: { type: plain, value: "ON SLOWNESS" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $text_muted, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 13, x: 100, y: 290, width: 1100, height: 0, content: { type: plain, value: "The Quiet\nReturn of\nthe Long Form." }, style: { font_family: $heading, font_size: 120, font_weight: 700, color: $text, line_height: 0.98, letter_spacing: -0.03 } }
      - { id: byline, type: text, z: 14, x: 100, y: 760, width: 1100, height: 0, content: { type: plain, value: "by Asha Batala  ·  illustrations by Tomo Watanabe" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text_muted, letter_spacing: 0.2 } }
      - { id: rule, type: rect, z: 15, x: 100, y: 820, width: 1100, height: 1, fill: { type: solid, color: "$text" }, opacity: 0.4 }
      - { id: deck, type: text, z: 16, x: 100, y: 860, width: 1100, height: 0, content: { type: plain, value: "After a decade of compressed attention, readers are quietly drifting back toward the patient pleasures of the unhurried book. We asked five novelists, two booksellers, and the editor of a small literary quarterly what they have noticed — and what we may be in for next." }, style: { font_family: $heading, font_size: 26, font_style: italic, color: $text, line_height: 1.55 } }
      - { id: pull-card, type: rect, z: 20, x: 100, y: 1180, width: 1100, height: 480, radius: 0, fill: { type: solid, color: $primary } }
      - { id: pull-mark, type: text, z: 21, x: 140, y: 1200, width: 100, height: 0, content: { type: plain, value: "“" }, style: { font_family: $heading, font_size: 180, font_weight: 800, color: "#FFFFFF", opacity: 0.45, line_height: 1 } }
      - { id: pull-body, type: text, z: 22, x: 140, y: 1380, width: 1020, height: 0, content: { type: plain, value: "Long reading is not a return to the past. It is a small, quiet rebellion of the present." }, style: { font_family: $heading, font_size: 40, font_style: italic, color: "#FFFFFF", line_height: 1.35 } }
      - { id: pull-attrib, type: text, z: 23, x: 140, y: 1590, width: 1020, height: 0, content: { type: plain, value: "— Asha Batala" }, style: { font_family: $body, font_size: 14, font_weight: 600, color: "#FFFFFF", opacity: 0.85, letter_spacing: 0.3 } }
      - { id: r-section-bar, type: rect, z: 30, x: 1380, y: 140, width: 200, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: r-page-pill, type: text, z: 31, x: 2380, y: 160, width: 80, height: 0, content: { type: plain, value: "p. 28" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.3 } }
      - { id: dropcap, type: text, z: 40, x: 1380, y: 280, width: 200, height: 0, content: { type: plain, value: "T" }, style: { font_family: $heading, font_size: 240, font_weight: 800, color: $primary, line_height: 0.85 } }
      - { id: col-1-1, type: text, z: 41, x: 1620, y: 290, width: 360, height: 0, content: { type: plain, value: "here is a small bookshop in the rue Saint-Andre with a wooden door that sticks in winter. It is run, mostly, by a man named Hugues, who orders the books he wants to read and shelves them, sometimes, in the order he means to read them. He does not stock thrillers." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: col-1-2, type: text, z: 41, x: 1620, y: 600, width: 360, height: 0, content: { type: plain, value: "Hugues told me, on a Tuesday in February, that he had sold more long novels in the previous quarter than he had in any quarter since 2014. He said it casually, the way one might mention an unusual stretch of weather, and then he asked whether I would like a coffee." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: col-1-3, type: text, z: 41, x: 1620, y: 910, width: 360, height: 0, content: { type: plain, value: "What was striking was not the data itself — there is no data, only Hugues and his hand-tallied receipts — but the matter-of-factness with which he reported it. As if a small shift had been observed, recorded, and then folded into the daily life of the shop without surprise." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: col-2-1, type: text, z: 42, x: 2020, y: 290, width: 360, height: 0, content: { type: plain, value: "In the months since that February afternoon, I have spoken with five novelists and four other independent booksellers across three countries. None of them keep meaningful sales numbers in any modern sense. All of them, without prompting, said the same thing." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: col-2-2, type: text, z: 42, x: 2020, y: 600, width: 360, height: 0, content: { type: plain, value: "Their customers, they reported, are reading more slowly. They are picking up books they once bought and abandoned. They are returning to titles they own. They are asking, more often than before, for the long ones: the eight-hundred-page novels, the three-volume biographies, the difficult." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: col-2-3, type: text, z: 42, x: 2020, y: 910, width: 360, height: 0, content: { type: plain, value: "It would be too tidy to call this a movement. There are no manifestos, no hashtags, no Substack newsletters dedicated to the cause. There is, instead, what one of the booksellers called a kind of correction. People are not turning against their phones; they are simply, quietly, turning toward something else." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: more-arrow, type: text, z: 50, x: 1380, y: 1660, width: 1000, height: 0, content: { type: plain, value: "Continued on the following spread →" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $primary, letter_spacing: 0.2 } }
      - { id: pg-num, type: text, z: 60, x: 2400, y: 1680, width: 80, height: 0, content: { type: plain, value: "29" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 3 · Feature Continuation ───────────────────────────
  - id: feature-continuation
    label: Feature Continuation
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 2480, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: spine, type: rect, z: 1, x: 1240, y: 100, width: 1, height: 1554, fill: { type: solid, color: "$border" }, opacity: 0.6 }
      - { id: l-hdr, type: text, z: 10, x: 100, y: 130, width: 600, height: 0, content: { type: plain, value: "FEATURE · ON SLOWNESS" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: l-pg, type: text, z: 11, x: 100, y: 130, width: 1140, height: 0, content: { type: plain, value: "30" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.3 } }
      - { id: l-rule, type: rect, z: 12, x: 100, y: 170, width: 1140, height: 1, fill: { type: solid, color: "$text" }, opacity: 0.3 }
      - { id: l-col-1, type: text, z: 20, x: 100, y: 220, width: 510, height: 0, content: { type: plain, value: "It is tempting to interpret this as a reaction. Reaction to what, exactly, depends on whom you ask. The novelist Tilde Westergaard, whose recent book runs to seven hundred and forty pages, told me she suspects readers are reaching for length the way one might reach for a heavy blanket: as a kind of weight. She has been finishing more reader letters with promises to keep writing long." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: l-col-2, type: text, z: 20, x: 100, y: 720, width: 510, height: 0, content: { type: plain, value: "Others are less certain. The poet Mira Okello, who keeps a small shop on the same street as Hugues, suggested that what we are observing may not be a return at all. Perhaps it is the slow, ordinary visibility of habits that were always there. She said this without irony, the way one might note that a forest has been a forest for a long time." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: l-col-3, type: text, z: 20, x: 100, y: 1200, width: 510, height: 0, content: { type: plain, value: "What is harder to dismiss is the change in how readers describe their own attention. They speak, again and again, of patience returning. Of being able to read for an hour without reaching for a phone. Of finishing a chapter and continuing into the next without the small punctuation of a scroll." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: l-col-r1, type: text, z: 21, x: 650, y: 220, width: 510, height: 0, content: { type: plain, value: "The change appears to be private. None of the readers I spoke with described their reading habits as a stance or a politics. They spoke instead about feeling, after years of low-grade exhaustion, suddenly capable of sustained focus again — and surprised by how much pleasure that small recovery contained." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: l-col-r2, type: text, z: 21, x: 650, y: 600, width: 510, height: 0, content: { type: plain, value: "If this is a return, it is a return on the order of small wildlife coming back to a city: not announced, easily missed, and most visible in the places no one is paying attention to. One sees it in libraries on Tuesday afternoons. In secondhand shops in towns one cannot quite remember the name of. In the way a reader, finishing a long book, pauses for a long moment before opening the next." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: l-col-r3, type: text, z: 21, x: 650, y: 1140, width: 510, height: 0, content: { type: plain, value: "What the booksellers seem to suggest, and what their customers seem to confirm, is that there has never been a single, dominant way of reading. There has only been a public conversation about reading, which sometimes drowns out the private experience of it." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: side-img, type: rect, z: 30, x: 1380, y: 220, width: 1000, height: 600, radius: 0, fill: { type: solid, color: $primary }, opacity: 0.45 }
      - { id: book-shadow, type: ellipse, z: 31, cx: 1880, cy: 760, rx: 280, ry: 30, fill: { type: solid, color: "#000000" }, opacity: 0.3 }
      - { id: book-cover, type: rect, z: 32, x: 1700, y: 320, width: 360, height: 460, radius: 4, fill: { type: solid, color: "#3A2418" } }
      - { id: book-spine, type: rect, z: 33, x: 1700, y: 320, width: 40, height: 460, radius: 4, fill: { type: solid, color: "#1A0F08" } }
      - { id: book-title-bar, type: rect, z: 34, x: 1740, y: 400, width: 280, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: book-title, type: text, z: 35, x: 1740, y: 440, width: 280, height: 0, content: { type: plain, value: "ON SLOWNESS" }, style: { font_family: $heading, font_size: 26, font_weight: 700, color: "#FAF4EA", text_align: center, letter_spacing: 0.4 } }
      - { id: book-author, type: text, z: 36, x: 1740, y: 700, width: 280, height: 0, content: { type: plain, value: "A. BATALA" }, style: { font_family: $heading, font_size: 14, font_style: italic, color: "#FAF4EA", text_align: center, opacity: 0.8, letter_spacing: 0.3 } }
      - { id: caption, type: text, z: 40, x: 1380, y: 840, width: 1000, height: 0, content: { type: plain, value: "Above · the author's working notebook, photographed in her studio, Marrakech, March 2026." }, style: { font_family: $body, font_size: 13, font_style: italic, color: $text_muted, line_height: 1.6 } }
      - { id: r-col-1, type: text, z: 50, x: 1380, y: 940, width: 480, height: 0, content: { type: plain, value: "Returning to the bookshop in rue Saint-Andre — because every story about reading eventually returns somewhere — I asked Hugues whether the shift, whatever it was, felt durable. He considered the question for some time. Then he said: I do not know. But I know it is not a panic. It does not feel like that." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: r-col-2, type: text, z: 50, x: 1880, y: 940, width: 500, height: 0, content: { type: plain, value: "And perhaps that is what is most worth noting. Not the return itself, but its temperament. Not louder, not faster, not more — but quieter, slower, less. A small recovery of the kind of attention that, if we are honest, most of us have missed without quite naming what we were missing.\n\n     ◇" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: end-mark, type: text, z: 60, x: 1380, y: 1620, width: 1000, height: 0, content: { type: plain, value: "Asha Batala is a contributing editor to Meridian. Her next book, ON SLOWNESS, is published in October." }, style: { font_family: $body, font_size: 13, font_style: italic, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pg-num, type: text, z: 70, x: 2400, y: 1680, width: 80, height: 0, content: { type: plain, value: "31" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 4 · Back Cover (Ads + Credits) ─────────────────────
  - id: back-cover
    label: Back Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 2480, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: spine, type: rect, z: 1, x: 1240, y: 100, width: 1, height: 1554, fill: { type: solid, color: "$border" }, opacity: 0.6 }
      - { id: l-eyebrow, type: text, z: 10, x: 100, y: 160, width: 1140, height: 0, content: { type: plain, value: "ADVERTISEMENTS" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.5 } }
      - { id: l-rule, type: rect, z: 11, x: 100, y: 200, width: 1140, height: 1, fill: { type: solid, color: "$text" }, opacity: 0.3 }
      - { id: ad-1, type: rect, z: 20, x: 100, y: 240, width: 1140, height: 460, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: ad-1-block, type: rect, z: 21, x: 100, y: 240, width: 1140, height: 60, fill: { type: solid, color: "$primary" } }
      - { id: ad-1-brand, type: text, z: 22, x: 130, y: 256, width: 1080, height: 0, content: { type: plain, value: "WILDFRIENDS PRESS" }, style: { font_family: $heading, font_size: 22, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.4 } }
      - { id: ad-1-head, type: text, z: 23, x: 140, y: 360, width: 1060, height: 0, content: { type: plain, value: "Long\nletters,\nshort runs." }, style: { font_family: $heading, font_size: 80, font_weight: 700, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: ad-1-body, type: text, z: 24, x: 140, y: 600, width: 1060, height: 0, content: { type: plain, value: "Three new titles for spring. Letterpress jackets, hand-numbered editions." }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: ad-1-url, type: text, z: 25, x: 140, y: 660, width: 1060, height: 0, content: { type: plain, value: "wildfriends.press" }, style: { font_family: $mono, font_size: 16, color: $primary, letter_spacing: 0.3 } }
      - { id: ad-2, type: rect, z: 30, x: 100, y: 740, width: 1140, height: 460, radius: 0, fill: { type: solid, color: $primary }, opacity: 0.85 }
      - { id: ad-2-kicker, type: text, z: 31, x: 140, y: 780, width: 1060, height: 0, content: { type: plain, value: "PALMA HOTEL · MENORCA" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.5, opacity: 0.9 } }
      - { id: ad-2-head, type: text, z: 32, x: 140, y: 820, width: 1060, height: 0, content: { type: plain, value: "Reading retreats,\nfourteen guests at a time." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: "#FFFFFF", line_height: 1.15, letter_spacing: -0.02 } }
      - { id: ad-2-body, type: text, z: 33, x: 140, y: 1020, width: 1060, height: 0, content: { type: plain, value: "Library, terrace, sea. October dates open." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "#FFFFFF", line_height: 1.5, opacity: 0.95 } }
