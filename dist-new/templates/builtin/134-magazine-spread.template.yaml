slots:
  - { id: masthead,      path: "pages[0].layers[10].content.value", type: text, hint: "Magazine masthead",     default: "MERIDIAN" }
  - { id: issue_label,   path: "pages[0].layers[13].content.value", type: text, hint: "Issue label",           default: "ISSUE No. 47 · SPRING" }
  - { id: feature_title, path: "pages[0].layers[17].content.value", type: text, hint: "Feature title (cover)", default: "The Quiet\nReturn of\nthe Long\nForm." }
  - { id: feature_deck,  path: "pages[1].layers[7].content.value",  type: text, hint: "Feature deck",          default: "After a decade of compressed attention, readers are quietly drifting back toward the patient pleasures of the unhurried book. We asked five novelists, two booksellers, and the editor of a small literary quarterly what they have noticed — and what we may be in for next." }
  - { id: byline,        path: "pages[1].layers[5].content.value",  type: text, hint: "Byline",                default: "by Asha Batala  ·  illustrations by Tomo Watanabe" }
  - { id: pull_quote,    path: "pages[1].layers[10].content.value", type: text, hint: "Pull quote",            default: "Long reading is not a return to the past. It is a small, quiet rebellion of the present." }
  - { id: editor_name,   path: "pages[3].layers[18].content.value", type: text, hint: "Editor name",           default: "Margaux Devereux" }
