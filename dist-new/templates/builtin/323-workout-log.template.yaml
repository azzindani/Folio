  - id: footer
    type: text
    z: 111
    x: 60
    y: 1560
    width: 960
    height: 0
    content: { type: plain, value: "Log every working set · hydrate · sleep 7+ hours" }
    style:
      font_family: $body
      font_size: 14
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.4

slots:
  - { id: workout_name, path: "layers[3].content.value", type: text, hint: "Workout name (big)", default: "Upper Body · Hypertrophy" }
  - { id: date,         path: "layers[2].content.value", type: text, hint: "Date eyebrow",       default: "WORKOUT LOG · 2026-05-17" }
