_protocol: template/v1

# Daily workout log — 1080×1620 portrait, forest-deep theme.
# Date + workout name header, 8 exercise rows with sets/reps/weight/notes,
# warmup + cooldown notes, RPE-scale legend footer.
meta:
  id: tmpl-workout-log
  name: Daily Workout Log
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [fitness, workout, log, training, tracking, portrait, forest]
  description: "Daily workout log with 8 exercise rows (sets × reps × weight × notes), warmup + cooldown advisory, and RPE scale legend."

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: forest-deep

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill: { type: solid, color: "$background" }

  - id: top-accent
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 10
    fill: { type: solid, color: "$primary" }

  # ── Header: date + workout name ───────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 60
    width: 960
    height: 0
    content: { type: plain, value: "WORKOUT LOG · 2026-05-17" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 800
      color: $primary
      letter_spacing: 0.5
      text_transform: uppercase

  - id: workout-name
    type: text
    z: 11
    x: 60
    y: 100
    width: 960
    height: 0
    content: { type: plain, value: "Upper Body · Hypertrophy" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.02

  # ── Warmup note ───────────────────────────────────────────
  - id: warmup-card
    type: rect
    z: 20
    x: 60
    y: 230
    width: 960
    height: 90
    radius: 14
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: warmup-label
    type: text
    z: 21
    x: 90
    y: 250
    width: 900
    height: 0
    content: { type: plain, value: "WARMUP · 10 MIN" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: warmup-body
    type: text
    z: 22
    x: 90
    y: 275
    width: 900
    height: 0
    content: { type: plain, value: "Row 5 min · band pull-aparts 2×15 · empty bar bench 2×10" }
    style:
      font_family: $body
      font_size: 17
      color: $text
      line_height: 1.4

  # ── Table header row ──────────────────────────────────────
  - id: th-rule-top
    type: rect
    z: 30
    x: 60
    y: 360
    width: 960
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: th-exercise
    type: text
    z: 31
    x: 60
    y: 375
    width: 380
    height: 0
    content: { type: plain, value: "EXERCISE" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: th-sets
    type: text
    z: 32
    x: 460
    y: 375
    width: 100
    height: 0
    content: { type: plain, value: "SETS" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_align: center, text_transform: uppercase }

  - id: th-reps
    type: text
    z: 33
    x: 580
    y: 375
    width: 100
    height: 0
    content: { type: plain, value: "REPS" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_align: center, text_transform: uppercase }

  - id: th-weight
    type: text
    z: 34
    x: 700
    y: 375
    width: 120
    height: 0
    content: { type: plain, value: "WEIGHT" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_align: center, text_transform: uppercase }

  - id: th-notes
    type: text
    z: 35
    x: 840
    y: 375
    width: 180
    height: 0
    content: { type: plain, value: "NOTES" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_align: right, text_transform: uppercase }

  - id: th-rule-bot
    type: rect
    z: 36
    x: 60
    y: 405
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Exercise row 1: Bench Press ───────────────────────────
  - id: r1-name
    type: text
    z: 40
