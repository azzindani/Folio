_protocol: template/v1

# 8-page baby photo album — 1500×1500 square, pastel-dream theme.
# Cover → first month → milestones → family → growth chart → favorites →
# dedications → back cover.
meta:
  id: tmpl-baby-photo-album
  name: Baby Photo Album (8 pages)
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, baby, photo-album, keepsake, pastel, square]
  description: "Eight-page baby keepsake album: cover with name and birth date, first-month grid, milestone moments, family portraits, growth chart, favorite things, dedications, and back cover."

document:
  width: 1500
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: linear, angle: 180, stops: [{ color: "$surface", position: 0 }, { color: "$primary", position: 100 }] } }
      - { id: deco-1, type: circle, z: 1, cx: 220, cy: 240, rx: 110, ry: 110, fill: { type: solid, color: "#FFFFFF" }, opacity: 0.6 }
      - { id: deco-2, type: circle, z: 1, cx: 1280, cy: 320, rx: 90, ry: 90, fill: { type: solid, color: "$secondary" }, opacity: 0.7 }
      - { id: deco-3, type: circle, z: 1, cx: 1340, cy: 180, rx: 50, ry: 50, fill: { type: solid, color: "#FFFFFF" }, opacity: 0.8 }
      - { id: deco-4, type: circle, z: 1, cx: 160, cy: 1320, rx: 70, ry: 70, fill: { type: solid, color: "$secondary" }, opacity: 0.55 }
      - { id: card, type: rect, z: 10, x: 200, y: 380, width: 1100, height: 740, radius: 32, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$primary", width: 4 } }
      - { id: kicker, type: text, z: 20, x: 200, y: 440, width: 1100, height: 0, content: { type: plain, value: "OUR LITTLE ONE" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: divider-top, type: rect, z: 21, x: 700, y: 490, width: 100, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: name, type: text, z: 22, x: 200, y: 530, width: 1100, height: 0, content: { type: plain, value: "Olive Harper" }, style: { font_family: $heading, font_size: 120, font_weight: 800, font_style: italic, color: $text, text_align: center, line_height: 1, letter_spacing: -0.02 } }
      - { id: middle-name, type: text, z: 23, x: 200, y: 680, width: 1100, height: 0, content: { type: plain, value: "Marigold" }, style: { font_family: $heading, font_size: 64, font_style: italic, color: $primary, text_align: center, line_height: 1.1 } }
      - { id: divider-mid, type: rect, z: 24, x: 700, y: 780, width: 100, height: 2, fill: { type: solid, color: "$border" } }
      - { id: born-label, type: text, z: 25, x: 200, y: 820, width: 1100, height: 0, content: { type: plain, value: "BORN" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.6 } }
      - { id: born-date, type: text, z: 26, x: 200, y: 860, width: 1100, height: 0, content: { type: plain, value: "March 14, 2026" }, style: { font_family: $heading, font_size: 36, color: $text, text_align: center, line_height: 1.2 } }
      - { id: born-meta, type: text, z: 27, x: 200, y: 920, width: 1100, height: 0, content: { type: plain, value: "7 lbs 4 oz   ·   20 inches   ·   3:42 a.m." }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text_muted, text_align: center, line_height: 1.4, letter_spacing: 0.1 } }
      - { id: born-place, type: text, z: 28, x: 200, y: 980, width: 1100, height: 0, content: { type: plain, value: "St. Joseph's Hospital, Portland, Oregon" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center } }
      - { id: foot, type: text, z: 30, x: 200, y: 1300, width: 1100, height: 0, content: { type: plain, value: "♡   THE FIRST YEAR   ♡" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.5 } }
      - { id: page-num, type: text, z: 31, x: 200, y: 1430, width: 1100, height: 0, content: { type: plain, value: "1" }, style: { font_family: $body, font_size: 16, color: "#FFFFFF", text_align: center, opacity: 0.85 } }

  # ── Page 2 · First Month ───────────────────────────────────
  - id: first-month
    label: First Month
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: header-rule, type: rect, z: 1, x: 600, y: 100, width: 300, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: header-kicker, type: text, z: 10, x: 0, y: 130, width: 1500, height: 0, content: { type: plain, value: "ONE" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: header-title, type: text, z: 11, x: 0, y: 170, width: 1500, height: 0, content: { type: plain, value: "First month at home" }, style: { font_family: $heading, font_size: 64, font_style: italic, color: $text, text_align: center, line_height: 1.1 } }
      - { id: header-sub, type: text, z: 12, x: 0, y: 260, width: 1500, height: 0, content: { type: plain, value: "tiny socks, longer naps than we expected, and a milk-drunk smile" }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text_muted, text_align: center } }
      - { id: photo-1, type: rect, z: 20, x: 140, y: 360, width: 600, height: 460, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: photo-1-fill, type: rect, z: 21, x: 160, y: 380, width: 560, height: 420, radius: 10, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$surface", position: 100 }] }, opacity: 0.5 }
      - { id: photo-1-ph, type: text, z: 22, x: 140, y: 580, width: 600, height: 0, content: { type: plain, value: "[ coming home from the hospital ]" }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, text_align: center } }
      - { id: photo-1-cap, type: text, z: 23, x: 140, y: 830, width: 600, height: 0, content: { type: plain, value: "Day 3 · the smallest wrinkled hands in the world" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3 } }
      - { id: photo-2, type: rect, z: 20, x: 760, y: 360, width: 600, height: 460, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: photo-2-fill, type: rect, z: 21, x: 780, y: 380, width: 560, height: 420, radius: 10, fill: { type: linear, angle: 135, stops: [{ color: "$secondary", position: 0 }, { color: "$surface", position: 100 }] }, opacity: 0.55 }
      - { id: photo-2-ph, type: text, z: 22, x: 760, y: 580, width: 600, height: 0, content: { type: plain, value: "[ first bath ]" }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, text_align: center } }
      - { id: photo-2-cap, type: text, z: 23, x: 760, y: 830, width: 600, height: 0, content: { type: plain, value: "Day 9 · less crying than we feared" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3 } }
      - { id: photo-3, type: rect, z: 20, x: 140, y: 900, width: 600, height: 460, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: photo-3-fill, type: rect, z: 21, x: 160, y: 920, width: 560, height: 420, radius: 10, fill: { type: linear, angle: 45, stops: [{ color: "$surface", position: 0 }, { color: "$primary", position: 100 }] }, opacity: 0.45 }
      - { id: photo-3-ph, type: text, z: 22, x: 140, y: 1120, width: 600, height: 0, content: { type: plain, value: "[ first nap on dad's chest ]" }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, text_align: center } }
      - { id: photo-3-cap, type: text, z: 23, x: 140, y: 1370, width: 600, height: 0, content: { type: plain, value: "Day 14 · the world's quietest afternoon" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3 } }
      - { id: photo-4, type: rect, z: 20, x: 760, y: 900, width: 600, height: 460, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: photo-4-fill, type: rect, z: 21, x: 780, y: 920, width: 560, height: 420, radius: 10, fill: { type: linear, angle: 90, stops: [{ color: "$secondary", position: 0 }, { color: "$surface", position: 100 }] }, opacity: 0.45 }
      - { id: photo-4-ph, type: text, z: 22, x: 760, y: 1120, width: 600, height: 0, content: { type: plain, value: "[ one-month milestone ]" }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, text_align: center } }
      - { id: photo-4-cap, type: text, z: 23, x: 760, y: 1370, width: 600, height: 0, content: { type: plain, value: "Day 30 · the longest, fastest month of our lives" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3 } }
      - { id: page-num, type: text, z: 30, x: 700, y: 1450, width: 100, height: 0, content: { type: plain, value: "2" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center } }

  # ── Page 3 · Milestone Moments ─────────────────────────────
  - id: milestones
    label: Milestone Moments
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: corner-deco, type: circle, z: 1, cx: 1380, cy: 120, rx: 50, ry: 50, fill: { type: solid, color: "$secondary" }, opacity: 0.4 }
      - { id: header-kicker, type: text, z: 10, x: 0, y: 120, width: 1500, height: 0, content: { type: plain, value: "TWO" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: header-title, type: text, z: 11, x: 0, y: 160, width: 1500, height: 0, content: { type: plain, value: "Milestone moments" }, style: { font_family: $heading, font_size: 64, font_style: italic, color: $text, text_align: center, line_height: 1.1 } }
      - { id: header-sub, type: text, z: 12, x: 0, y: 250, width: 1500, height: 0, content: { type: plain, value: "the firsts we will keep telling stories about" }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text_muted, text_align: center } }
      - { id: m1-circle, type: circle, z: 20, cx: 250, cy: 460, rx: 80, ry: 80, fill: { type: solid, color: "$primary" }, opacity: 0.85 }
      - { id: m1-label, type: text, z: 21, x: 170, y: 444, width: 160, height: 0, content: { type: plain, value: "FIRST\nSMILE" }, style: { font_family: $heading, font_size: 20, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1.1 } }
      - { id: m1-date, type: text, z: 22, x: 380, y: 430, width: 940, height: 0, content: { type: plain, value: "Week 6  ·  April 25" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: m1-text, type: text, z: 23, x: 380, y: 460, width: 940, height: 0, content: { type: plain, value: "On the changing table, looking up at the ceiling fan. Held it for almost a full second. We cried." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.35 } }
      - { id: m1-rule, type: rect, z: 24, x: 380, y: 560, width: 940, height: 1, fill: { type: solid, color: "$border" } }
      - { id: m2-circle, type: circle, z: 20, cx: 250, cy: 700, rx: 80, ry: 80, fill: { type: solid, color: "$secondary" }, opacity: 0.85 }
      - { id: m2-label, type: text, z: 21, x: 170, y: 684, width: 160, height: 0, content: { type: plain, value: "FIRST\nLAUGH" }, style: { font_family: $heading, font_size: 20, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1.1 } }
      - { id: m2-date, type: text, z: 22, x: 380, y: 670, width: 940, height: 0, content: { type: plain, value: "Month 3  ·  June 19" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: m2-text, type: text, z: 23, x: 380, y: 700, width: 940, height: 0, content: { type: plain, value: "Watching the dog chase her own tail. Full belly laugh. We replayed the video that night six times." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.35 } }
      - { id: m2-rule, type: rect, z: 24, x: 380, y: 800, width: 940, height: 1, fill: { type: solid, color: "$border" } }
      - { id: m3-circle, type: circle, z: 20, cx: 250, cy: 940, rx: 80, ry: 80, fill: { type: solid, color: "$primary" }, opacity: 0.85 }
      - { id: m3-label, type: text, z: 21, x: 170, y: 924, width: 160, height: 0, content: { type: plain, value: "FIRST\nWORD" }, style: { font_family: $heading, font_size: 20, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1.1 } }
      - { id: m3-date, type: text, z: 22, x: 380, y: 910, width: 940, height: 0, content: { type: plain, value: "Month 11  ·  February 8" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: m3-text, type: text, z: 23, x: 380, y: 940, width: 940, height: 0, content: { type: plain, value: "\"Dada.\" Repeatedly. Apologies, mama — eight months of nighttime feedings and that is what we got." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.35 } }
      - { id: m3-rule, type: rect, z: 24, x: 380, y: 1040, width: 940, height: 1, fill: { type: solid, color: "$border" } }
      - { id: m4-circle, type: circle, z: 20, cx: 250, cy: 1180, rx: 80, ry: 80, fill: { type: solid, color: "$secondary" }, opacity: 0.85 }
      - { id: m4-label, type: text, z: 21, x: 170, y: 1164, width: 160, height: 0, content: { type: plain, value: "FIRST\nSTEPS" }, style: { font_family: $heading, font_size: 20, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1.1 } }
      - { id: m4-date, type: text, z: 22, x: 380, y: 1150, width: 940, height: 0, content: { type: plain, value: "Month 12  ·  March 11" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: m4-text, type: text, z: 23, x: 380, y: 1180, width: 940, height: 0, content: { type: plain, value: "Four wobbly ones from the couch to the coffee table. Then down with a delighted thud. She wanted to do it again." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.35 } }
      - { id: page-num, type: text, z: 30, x: 700, y: 1450, width: 100, height: 0, content: { type: plain, value: "3" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center } }

  # ── Page 4 · Family Portraits ──────────────────────────────
  - id: family-portraits
    label: Family Portraits
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: corner-deco, type: circle, z: 1, cx: 120, cy: 120, rx: 50, ry: 50, fill: { type: solid, color: "$primary" }, opacity: 0.4 }
      - { id: header-kicker, type: text, z: 10, x: 0, y: 120, width: 1500, height: 0, content: { type: plain, value: "THREE" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
