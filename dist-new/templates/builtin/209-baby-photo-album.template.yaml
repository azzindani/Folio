      - { id: header-sub, type: text, z: 12, x: 0, y: 250, width: 1500, height: 0, content: { type: plain, value: "the people who already love her so completely" }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text_muted, text_align: center } }
      - { id: main-photo, type: rect, z: 20, x: 140, y: 340, width: 1220, height: 600, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
