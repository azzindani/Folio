      - { id: mini-2, type: rect, z: 30, x: 560, y: 1040, width: 380, height: 280, radius: 14, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: mini-2-fill, type: rect, z: 31, x: 576, y: 1056, width: 348, height: 248, radius: 8, fill: { type: solid, color: "$secondary" }, opacity: 0.45 }
      - { id: mini-2-ph, type: text, z: 32, x: 560, y: 1170, width: 380, height: 0, content: { type: plain, value: "[ grandparents · paternal ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, text_align: center } }
      - { id: mini-2-cap, type: text, z: 33, x: 560, y: 1340, width: 380, height: 0, content: { type: plain, value: "Grammy & Pa" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center } }
      - { id: mini-3, type: rect, z: 30, x: 980, y: 1040, width: 380, height: 280, radius: 14, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: mini-3-fill, type: rect, z: 31, x: 996, y: 1056, width: 348, height: 248, radius: 8, fill: { type: linear, angle: 45, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] }, opacity: 0.4 }
      - { id: mini-3-ph, type: text, z: 32, x: 980, y: 1170, width: 380, height: 0, content: { type: plain, value: "[ aunts, uncles, cousins ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, text_align: center } }
      - { id: mini-3-cap, type: text, z: 33, x: 980, y: 1340, width: 380, height: 0, content: { type: plain, value: "The whole crowd" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center } }
      - { id: page-num, type: text, z: 40, x: 700, y: 1450, width: 100, height: 0, content: { type: plain, value: "4" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center } }

  # ── Page 5 · Growth Chart ──────────────────────────────────
  - id: growth-chart
    label: Growth Chart
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: corner-deco, type: circle, z: 1, cx: 1380, cy: 1380, rx: 60, ry: 60, fill: { type: solid, color: "$primary" }, opacity: 0.4 }
      - { id: header-kicker, type: text, z: 10, x: 0, y: 120, width: 1500, height: 0, content: { type: plain, value: "FOUR" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
