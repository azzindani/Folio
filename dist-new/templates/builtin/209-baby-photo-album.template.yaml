      - { id: mini-1, type: rect, z: 30, x: 140, y: 1040, width: 380, height: 280, radius: 14, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 } }
      - { id: mini-1-fill, type: rect, z: 31, x: 156, y: 1056, width: 348, height: 248, radius: 8, fill: { type: solid, color: "$primary" }, opacity: 0.35 }
      - { id: mini-1-ph, type: text, z: 32, x: 140, y: 1170, width: 380, height: 0, content: { type: plain, value: "[ grandparents · maternal ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, text_align: center } }
