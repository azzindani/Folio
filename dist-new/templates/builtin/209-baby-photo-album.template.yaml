      - { id: note-1-from, type: text, z: 21, x: 180, y: 380, width: 1140, height: 0, content: { type: plain, value: "FROM MAMA" }, style: { font_family: $body, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: note-1-text, type: text, z: 22, x: 180, y: 420, width: 1140, height: 0, content: { type: plain, value: "Olive — the moment they put you on my chest I understood every soft song I had ever heard. You were so quiet, looking at me like you knew everything I had not yet said. I will spend the rest of my life trying to be worth that look." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: note-1-sig, type: text, z: 23, x: 1180, y: 550, width: 160, height: 0, content: { type: plain, value: "— Mama" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $primary, text_align: right } }
      - { id: note-2-card, type: rect, z: 30, x: 140, y: 640, width: 1220, height: 260, radius: 20, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$secondary", width: 2 } }
      - { id: note-2-from, type: text, z: 31, x: 180, y: 680, width: 1140, height: 0, content: { type: plain, value: "FROM DAD" }, style: { font_family: $body, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: note-2-text, type: text, z: 32, x: 180, y: 720, width: 1140, height: 0, content: { type: plain, value: "Kiddo — I have built a lot of things and I have not been good at all of them. You are the one I am going to take my time with. Whoever you turn out to be — bookish, brave, loud, quiet, all of it — I am already on your side." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: note-2-sig, type: text, z: 33, x: 1180, y: 850, width: 160, height: 0, content: { type: plain, value: "— Daddy" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $primary, text_align: right } }
      - { id: note-3-card, type: rect, z: 40, x: 140, y: 940, width: 1220, height: 240, radius: 20, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$primary", width: 2 } }
      - { id: note-3-from, type: text, z: 41, x: 180, y: 980, width: 1140, height: 0, content: { type: plain, value: "FROM BIG BROTHER THEO (AGE 4)" }, style: { font_family: $body, font_size: 12, font_weight: 800, color: $primary, letter_spacing: 0.5 } }
      - { id: note-3-text, type: text, z: 42, x: 180, y: 1020, width: 1140, height: 0, content: { type: plain, value: "you can have my green truck but not the blue one. i will share my crackers if you ask nicely. you smell funny but i like you." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
