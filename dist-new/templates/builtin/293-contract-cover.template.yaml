_protocol: template/v1

# Contract cover page — 1240×1754 A4 portrait, editorial-cream theme.
# Formal serif typography: "AGREEMENT" header, contract-type subtitle,
# parties (A/B), effective date, jurisdiction, version + page count,
# corner ornaments.
meta:
  id: tmpl-contract-cover
  name: Contract Cover
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, legal, contract, cover, formal, a4, editorial]
  description: "Formal legal contract cover page with AGREEMENT header, contract type, parties A/B, effective date, jurisdiction, and version stamp."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 — bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
  # 1 — outer formal border
  - { id: outer, type: rect, z: 1, x: 80, y: 80, width: 1080, height: 1594, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 2 — inner thin border
  - { id: inner, type: rect, z: 2, x: 96, y: 96, width: 1048, height: 1562, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 0.5 } }
  # 3 — top corner ornament L
  - { id: corn-tl, type: rect, z: 3, x: 116, y: 116, width: 40, height: 4, fill: { type: solid, color: "$primary" } }
  - { id: corn-tl-v, type: rect, z: 3, x: 116, y: 116, width: 4, height: 40, fill: { type: solid, color: "$primary" } }
  # 5 — top corner ornament R
  - { id: corn-tr, type: rect, z: 4, x: 1084, y: 116, width: 40, height: 4, fill: { type: solid, color: "$primary" } }
  - { id: corn-tr-v, type: rect, z: 4, x: 1120, y: 116, width: 4, height: 40, fill: { type: solid, color: "$primary" } }
  # 7 — eyebrow
  - { id: eyebrow, type: text, z: 10, x: 100, y: 260, width: 1040, height: 0, content: { type: plain, value: "BINDING INSTRUMENT · CONFIDENTIAL" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: "$primary", letter_spacing: 0.8, text_align: center, text_transform: uppercase } }
  # 8 — divider top
  - { id: div-top, type: rect, z: 11, x: 580, y: 300, width: 80, height: 1, fill: { type: solid, color: "$text" } }
  # 9 — AGREEMENT title (serif huge)
  - { id: title, type: text, z: 12, x: 100, y: 360, width: 1040, height: 0, content: { type: plain, value: "AGREEMENT" }, style: { font_family: $heading, font_size: 120, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.04, line_height: 1 } }
  # 10 — contract type subtitle
  - { id: subtitle, type: text, z: 13, x: 100, y: 520, width: 1040, height: 0, content: { type: plain, value: "Master Services Agreement" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: "$text", text_align: center, line_height: 1.3 } }
  # 11 — between
  - { id: between, type: text, z: 20, x: 100, y: 620, width: 1040, height: 0, content: { type: plain, value: "BY AND BETWEEN" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: "$text_muted", letter_spacing: 0.8, text_align: center, text_transform: uppercase } }
  # 12 — Party A
  - { id: party-a, type: text, z: 21, x: 100, y: 670, width: 1040, height: 0, content: { type: plain, value: "Folio Studio Limited" }, style: { font_family: $heading, font_size: 34, font_weight: 700, color: "$text", text_align: center, line_height: 1.3 } }
  # 13 — Party A descriptor
  - { id: party-a-desc, type: text, z: 22, x: 100, y: 716, width: 1040, height: 0, content: { type: plain, value: "a corporation organised under the laws of England & Wales (the \"Service Provider\")" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: "$text_muted", text_align: center, line_height: 1.5 } }
  # 14 — AND
  - { id: and, type: text, z: 23, x: 100, y: 770, width: 1040, height: 0, content: { type: plain, value: "— AND —" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", letter_spacing: 0.6, text_align: center } }
  # 15 — Party B
  - { id: party-b, type: text, z: 24, x: 100, y: 810, width: 1040, height: 0, content: { type: plain, value: "Northwind Retail Group, Inc." }, style: { font_family: $heading, font_size: 34, font_weight: 700, color: "$text", text_align: center, line_height: 1.3 } }
  # 16 — Party B descriptor
  - { id: party-b-desc, type: text, z: 25, x: 100, y: 856, width: 1040, height: 0, content: { type: plain, value: "a Delaware corporation with principal offices in San Francisco, California (the \"Client\")" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: "$text_muted", text_align: center, line_height: 1.5 } }
  # 17 — divider mid
  - { id: div-mid, type: rect, z: 30, x: 480, y: 980, width: 280, height: 1, fill: { type: solid, color: "$text" } }
  # 18 — effective date label
  - { id: eff-label, type: text, z: 31, x: 100, y: 1010, width: 1040, height: 0, content: { type: plain, value: "EFFECTIVE DATE" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: "$text_muted", letter_spacing: 0.8, text_align: center } }
  # 19 — effective date
  - { id: eff-date, type: text, z: 32, x: 100, y: 1040, width: 1040, height: 0, content: { type: plain, value: "the 17th day of May, in the year Two Thousand Twenty-Six" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: "$text", text_align: center, line_height: 1.4 } }
  # 20 — jurisdiction label
  - { id: jur-label, type: text, z: 33, x: 100, y: 1130, width: 1040, height: 0, content: { type: plain, value: "GOVERNED BY THE LAWS OF" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: "$text_muted", letter_spacing: 0.8, text_align: center } }
  # 21 — jurisdiction
  - { id: jurisdiction, type: text, z: 34, x: 100, y: 1160, width: 1040, height: 0, content: { type: plain, value: "The State of New York, United States of America" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text", text_align: center, line_height: 1.4 } }
  # 22 — page count
  - { id: pages, type: text, z: 35, x: 100, y: 1240, width: 1040, height: 0, content: { type: plain, value: "Consisting of 28 pages, 14 schedules, and 3 exhibits annexed hereto." }, style: { font_family: $heading, font_size: 14, font_style: italic, color: "$text_muted", text_align: center, line_height: 1.5 } }
  # 23 — version label
  - { id: ver-label, type: text, z: 40, x: 100, y: 1480, width: 1040, height: 0, content: { type: plain, value: "DOCUMENT VERSION" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.8, text_align: center } }
  # 24 — version value
  - { id: ver-val, type: text, z: 41, x: 100, y: 1502, width: 1040, height: 0, content: { type: plain, value: "v3.2 · Reference MSA-2026-0427" }, style: { font_family: $mono, font_size: 14, color: "$text", text_align: center } }
  # 25 — bottom ornament L
  - { id: corn-bl, type: rect, z: 50, x: 116, y: 1634, width: 40, height: 4, fill: { type: solid, color: "$primary" } }
  - { id: corn-bl-v, type: rect, z: 50, x: 116, y: 1598, width: 4, height: 40, fill: { type: solid, color: "$primary" } }
  # 27 — bottom ornament R
  - { id: corn-br, type: rect, z: 51, x: 1084, y: 1634, width: 40, height: 4, fill: { type: solid, color: "$primary" } }
  - { id: corn-br-v, type: rect, z: 51, x: 1120, y: 1598, width: 4, height: 40, fill: { type: solid, color: "$primary" } }
  # 29 — footer
  - { id: footer, type: text, z: 60, x: 100, y: 1610, width: 1040, height: 0, content: { type: plain, value: "Prepared by Counsel · Confidential & Privileged" }, style: { font_family: $heading, font_size: 11, font_style: italic, color: "$text_muted", text_align: center } }

slots:
  - { id: contract_type,  path: "layers[10].content.value", type: text, hint: "Contract type / subtitle",   default: "Master Services Agreement" }
  - { id: party_a,        path: "layers[12].content.value", type: text, hint: "Party A (legal name)",       default: "Folio Studio Limited" }
  - { id: party_b,        path: "layers[15].content.value", type: text, hint: "Party B (legal name)",       default: "Northwind Retail Group, Inc." }
  - { id: effective_date, path: "layers[19].content.value", type: text, hint: "Effective date (long form)", default: "the 17th day of May, in the year Two Thousand Twenty-Six" }
  - { id: jurisdiction,   path: "layers[21].content.value", type: text, hint: "Governing jurisdiction",     default: "The State of New York, United States of America" }
  - { id: version,        path: "layers[24].content.value", type: text, hint: "Document version & ref",     default: "v3.2 · Reference MSA-2026-0427" }
