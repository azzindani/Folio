_protocol: template/v1

# University dean's dashboard — eyebrow, hero, 5 KPIs (enrollment, retention,
# GPA, graduation, faculty FTE), 5-year enrollment line, department breakdown
# table, diversity stacked bar, research output table.
meta:
  id: tmpl-university-dean-dashboard-report
  name: University · Dean's Dashboard
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, education, university, academic, dean, interactive]
  description: "Dean-level academic dashboard: enrollment, retention, GPA, graduation rate, faculty, department mix, diversity, research output."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

report:
  layout: scroll
  data:
    sources:
      - id: enrollment_trend
        type: inline
        rows:
          - { year: "2021-22", undergrad: 8420, graduate: 2840 }
          - { year: "2022-23", undergrad: 8680, graduate: 2920 }
          - { year: "2023-24", undergrad: 9120, graduate: 3080 }
          - { year: "2024-25", undergrad: 9480, graduate: 3240 }
          - { year: "2025-26", undergrad: 9860, graduate: 3420 }
      - id: department_breakdown
        type: inline
        rows:
          - { department: "Computer Science",      majors: 14, students: 1842, faculty_fte:  86, grants_usd: 18420000 }
          - { department: "Mechanical Engineering", majors:  8, students: 1284, faculty_fte:  72, grants_usd: 14680000 }
          - { department: "Biology",               majors: 12, students: 1648, faculty_fte:  68, grants_usd: 12840000 }
          - { department: "Business Admin",        majors: 16, students: 2284, faculty_fte:  82, grants_usd:  4620000 }
          - { department: "Psychology",            majors:  6, students: 1462, faculty_fte:  48, grants_usd:  3840000 }
          - { department: "Mathematics",           majors:  8, students:  842, faculty_fte:  44, grants_usd:  2680000 }
          - { department: "Economics",             majors:  6, students:  984, faculty_fte:  38, grants_usd:  1840000 }
          - { department: "Chemistry",             majors:  6, students:  728, faculty_fte:  46, grants_usd:  9420000 }
          - { department: "English & Literature",  majors:  8, students:  642, faculty_fte:  42, grants_usd:   840000 }
          - { department: "Physics",               majors:  4, students:  484, faculty_fte:  38, grants_usd:  8240000 }
      - id: diversity_breakdown
        type: inline
        rows:
          - { group: "Asian",                female: 14.2, male: 12.8 }
          - { group: "Black / African Am",   female:  8.6, male:  7.2 }
          - { group: "Hispanic / Latino",    female: 11.4, male: 10.2 }
          - { group: "Native / Pacific",     female:  1.4, male:  1.2 }
          - { group: "Two or More",          female:  4.2, male:  3.8 }
          - { group: "White",                female: 13.2, male: 11.8 }
      - id: research_output
        type: inline
        rows:
          - { department: "Computer Science",       publications: 284, citations: 12420, grants_usd: 18420000 }
          - { department: "Mechanical Engineering", publications: 218, citations:  9840, grants_usd: 14680000 }
          - { department: "Biology",                publications: 246, citations: 11280, grants_usd: 12840000 }
          - { department: "Chemistry",              publications: 184, citations:  8420, grants_usd:  9420000 }
          - { department: "Physics",                publications: 142, citations:  7240, grants_usd:  8240000 }
          - { department: "Psychology",             publications:  98, citations:  4820, grants_usd:  3840000 }
          - { department: "Mathematics",            publications:  76, citations:  3240, grants_usd:  2680000 }
          - { department: "Economics",              publications:  62, citations:  2840, grants_usd:  1840000 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "BERKELEY STATE UNIVERSITY · OFFICE OF THE DEAN · AY 2025-26"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**Dean's Dashboard — Academic Year 2025-26**\n*Enrollment, retention, academic outcomes, departments, diversity, and research.*"

      - id: kpi-enrollment
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Total Enrollment
        value: 13280
        format: number
        delta: 4.2
        delta_format: percent

      - id: kpi-retention
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Retention %
        value: 92.4
        format: percent
        decimals: 1
        delta: 1.6
        delta_format: percent

      - id: kpi-gpa
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Avg GPA
        value: 3.42
        format: number
        decimals: 2
        delta: 1.2
        delta_format: percent

      - id: kpi-grad
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Graduation Rate %
        value: 84.6
        format: percent
        decimals: 1
        delta: 2.4
        delta_format: percent

      - id: kpi-faculty
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Faculty FTE
        value: 564
        format: number
        delta: 2.8
        delta_format: percent

      - id: section-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Enrollment Trend — Past 5 Academic Years**"

      - id: chart-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 380
        chart_type: line
        data_ref: enrollment_trend
        x_field: year
        y_field: undergrad
        title: Undergraduate & Graduate Enrollment (Head Count)
        legend: true
        grid: true
        animate: true

      - id: section-departments
        type: rich_text
        x: 60
        y: 880
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Department Breakdown**"

      - id: tbl-departments
        type: interactive_table
        x: 60
        y: 940
        width: 1160
        height: 540
        data_ref: department_breakdown
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: department,    title: Department,    width: 320, sortable: true, formatter: badge }
          - { field: majors,        title: Majors,        width: 150, sortable: true, formatter: number,   align: right }
          - { field: students,      title: Students,      width: 180, sortable: true, formatter: number,   align: right }
          - { field: faculty_fte,   title: Faculty FTE,   width: 180, sortable: true, formatter: number,   align: right }
          - { field: grants_usd,    title: Research $,    width: 330, sortable: true, formatter: currency, align: right }

      - id: section-diversity
        type: rich_text
        x: 60
        y: 1520
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Demographic Composition — Student Body (%)**"

      - id: chart-diversity
        type: interactive_chart
        x: 60
        y: 1580
        width: 1160
        height: 380
        chart_type: bar
        data_ref: diversity_breakdown
        x_field: group
        y_field: female
        title: Student Body by Race/Ethnicity and Gender (Stacked, %)
        legend: true
        grid: true
        animate: true

      - id: section-research
        type: rich_text
        x: 60
        y: 2000
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Research Output by Department**"

      - id: tbl-research
        type: interactive_table
        x: 60
        y: 2060
        width: 1160
        height: 300
        data_ref: research_output
        pagination: false
        filterable: false
        exportable: true
        columns:
          - { field: department,    title: Department,    width: 380, sortable: true, formatter: badge }
          - { field: publications,  title: Publications,  width: 220, sortable: true, formatter: number,   align: right }
          - { field: citations,     title: Citations,     width: 220, sortable: true, formatter: number,   align: right }
          - { field: grants_usd,    title: Grants ($),    width: 340, sortable: true, formatter: currency, align: right }

slots:
  - { id: report_title,        path: "pages[0].layers[1].content",  type: text, hint: "Report title",         default: "**Dean's Dashboard — Academic Year 2025-26**\n*Enrollment, retention, academic outcomes, departments, diversity, and research.*" }
  - { id: report_eyebrow,      path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",         default: "BERKELEY STATE UNIVERSITY · OFFICE OF THE DEAN · AY 2025-26" }
  - { id: trend_section,       path: "pages[0].layers[7].content",  type: text, hint: "Trend heading",        default: "**Enrollment Trend — Past 5 Academic Years**" }
  - { id: departments_section, path: "pages[0].layers[9].content",  type: text, hint: "Departments heading",  default: "**Department Breakdown**" }
  - { id: diversity_section,   path: "pages[0].layers[11].content", type: text, hint: "Diversity heading",    default: "**Demographic Composition — Student Body (%)**" }
  - { id: research_section,    path: "pages[0].layers[13].content", type: text, hint: "Research heading",     default: "**Research Output by Department**" }
