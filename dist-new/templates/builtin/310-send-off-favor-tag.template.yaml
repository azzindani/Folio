_protocol: template/v1

# Wedding favor tag — 600×800 portrait, pastel-dream theme.
# Small tag with rounded top, hole circle, "With Love" header, monogram, date.
meta:
  id: tmpl-send-off-favor-tag
  name: Wedding Favor Tag
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, wedding, favor, tag, pastel, portrait, small]
  description: "Small wedding favor tag with hole, scalloped border, monogram, and thank-you message."

document:
  width: 600
  height: 800
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # 0 bg (tag-shape) — a rounded rect via path with notched top
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 600, height: 800, fill: { type: solid, color: "$background" } }
  # 1 tag silhouette outline
  - { id: tag-outline, type: path, z: 1, d: "M 60 160 L 240 60 L 360 60 L 540 160 L 540 740 L 60 740 Z", fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1.2 } }
  # 2 hole punch (outer circle)
  - { id: hole-outer, type: circle, z: 2, cx: 300, cy: 130, rx: 18, ry: 18, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 3 hole inner (transparent so background shows)
  - { id: hole-inner, type: circle, z: 3, cx: 300, cy: 130, rx: 12, ry: 12, fill: { type: solid, color: "$background" } }
  # 4 inner thin frame
  - { id: frame-inner, type: path, z: 4, d: "M 80 180 L 250 90 L 350 90 L 520 180 L 520 720 L 80 720 Z", fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
  # 5 small top ornament
  - { id: orn-top, type: text, z: 5, x: 0, y: 220, width: 600, height: 0, content: { type: plain, value: "❀" }, style: { font_family: $heading, font_size: 26, color: "$primary", text_align: center } }
  # 6 header script
  - { id: header, type: text, z: 10, x: 0, y: 270, width: 600, height: 0, content: { type: plain, value: "With Love" }, style: { font_family: $heading, font_size: 56, font_style: italic, font_weight: 400, color: "$text", text_align: center, line_height: 1 } }
  # 7 small ornament
  - { id: orn-mid, type: text, z: 11, x: 0, y: 360, width: 600, height: 0, content: { type: plain, value: "·  ·  ·" }, style: { font_family: $body, font_size: 18, color: "$primary", text_align: center, letter_spacing: 0.6 } }
  # 8 monogram circle
  - { id: mono-ring, type: circle, z: 12, cx: 300, cy: 460, rx: 64, ry: 64, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 9 monogram letters
  - { id: monogram, type: text, z: 13, x: 0, y: 430, width: 600, height: 0, content: { type: plain, value: "A & J" }, style: { font_family: $heading, font_size: 44, font_style: italic, color: "$text", text_align: center } }
  # 10 small rule
  - { id: rule, type: rect, z: 14, x: 250, y: 560, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 11 wedding date
  - { id: wed-date, type: text, z: 15, x: 0, y: 590, width: 600, height: 0, content: { type: plain, value: "24 · 05 · 2026" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$primary", text_align: center, letter_spacing: 0.1 } }
  # 12 message
  - { id: message, type: text, z: 20, x: 60, y: 650, width: 480, height: 0, content: { type: plain, value: "Thank you for celebrating with us" }, style: { font_family: $body, font_size: 14, color: "$text", text_align: center, line_height: 1.5, font_style: italic } }
  # 13 small bottom ornament
  - { id: orn-bot, type: text, z: 21, x: 0, y: 700, width: 600, height: 0, content: { type: plain, value: "❀" }, style: { font_family: $heading, font_size: 18, color: "$primary", text_align: center } }

slots:
  - { id: couple_names, path: "layers[9].content.value",  type: text, hint: "Couple monogram", default: "A & J" }
  - { id: wedding_date, path: "layers[11].content.value", type: text, hint: "Wedding date",    default: "24 · 05 · 2026" }
