_protocol: template/v1

# LinkedIn 6-slide carousel — resume mistakes diagnostic with WRONG/RIGHT comparison cards.
# Portrait 1080×1350. corporate-slate theme.
meta:
  id: tmpl-linkedin-resume-mistakes-6slide
  name: LinkedIn Resume Mistakes (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, career, resume, 4-5]
  description: "6-slide LinkedIn carousel diagnosing resume mistakes with WRONG/RIGHT examples on contrasting cards."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: cv-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: cv-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: cv-eyebrow
        type: text
        z: 10
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "CAREER · RESUME AUDIT" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: cv-title
        type: text
        z: 11
        x: 72
        y: 300
        width: 936
        height: 0
        content: { type: plain, value: "6 Resume Mistakes\nKilling Your Callbacks" }
        style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: cv-tagline
        type: text
        z: 12
        x: 72
        y: 600
        width: 936
        height: 0
        content: { type: plain, value: "Recruiters spend 7 seconds on your resume. Don't waste them." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: cv-rule
        type: rect
        z: 13
        x: 72
        y: 760
        width: 80
        height: 4
        fill: { type: solid, color: "$accent" }
      - id: cv-author
        type: text
        z: 14
        x: 72
        y: 790
        width: 936
        height: 0
        content: { type: plain, value: "A swipe-through from @yourhandle" }
        style: { font_family: $body, font_size: 20, color: $text }
      - id: cv-page
        type: text
        z: 15
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "01 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Intro ────────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: in-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: in-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: in-eyebrow
        type: text
        z: 10
        x: 72
        y: 180
        width: 936
        height: 0
        content: { type: plain, value: "WHY THIS MATTERS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: in-title
        type: text
        z: 11
        x: 72
        y: 240
        width: 936
        height: 0
        content: { type: plain, value: "Most resumes fail the\nfirst 30 seconds." }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: in-body
        type: text
        z: 12
        x: 72
        y: 500
        width: 936
        height: 0
        content: { type: plain, value: "The screener isn't reading. They're scanning for signals.\n\nIf you bury the signal under generic phrasing, vague verbs, or padded duties, your callback rate drops to single digits — no matter how strong your background is." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: in-stat
        type: text
        z: 13
        x: 72
        y: 900
        width: 936
        height: 0
        content: { type: plain, value: "75% are filtered before a human sees them." }
        style: { font_family: $heading, font_size: 32, font_weight: 700, color: $primary, line_height: 1.3 }
      - id: in-page
        type: text
        z: 14
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "02 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Mistake 1 ────────────────────────────────────
  - id: mistake-1
    label: Mistake 1 · Duties
    layers:
      - { id: m1-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m1-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: m1-eyebrow
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "MISTAKE 01" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: m1-glyph
        type: text
        z: 11
        x: 72
        y: 200
        width: 80
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $secondary, line_height: 1 }
      - id: m1-title
        type: text
        z: 12
        x: 160
        y: 220
        width: 848
        height: 0
        content: { type: plain, value: "Listing duties\ninstead of impact." }
        style: { font_family: $heading, font_size: 54, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: m1-card-wrong
        type: rect
        z: 13
        x: 72
        y: 480
        width: 936
        height: 220
        radius: 0
        fill: { type: solid, color: "$surface" }
      - id: m1-wrong-label
        type: text
        z: 14
        x: 104
        y: 510
        width: 872
        height: 0
        content: { type: plain, value: "WRONG" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36 }
      - id: m1-wrong-text
        type: text
        z: 15
        x: 104
        y: 550
        width: 872
        height: 0
        content: { type: plain, value: "\"Responsible for managing the team's onboarding process.\"" }
        style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.5 }
      - id: m1-card-right
        type: rect
        z: 16
        x: 72
        y: 730
        width: 936
        height: 220
        radius: 0
        fill: { type: solid, color: "$primary" }
      - id: m1-right-label
        type: text
        z: 17
        x: 104
        y: 760
        width: 872
        height: 0
        content: { type: plain, value: "RIGHT" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: m1-right-text
        type: text
        z: 18
        x: 104
        y: 800
        width: 872
        height: 0
        content: { type: plain, value: "\"Cut new-hire ramp-up from 8 weeks to 3 by rebuilding the onboarding playbook.\"" }
        style: { font_family: $mono, font_size: 22, color: "#FFFFFF", line_height: 1.5 }
      - id: m1-page
        type: text
        z: 19
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "03 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Mistake 2 ────────────────────────────────────
  - id: mistake-2
    label: Mistake 2 · Objective
    layers:
      - { id: m2-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m2-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: m2-eyebrow
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "MISTAKE 02" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: m2-glyph
        type: text
        z: 11
        x: 72
        y: 200
        width: 80
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $secondary, line_height: 1 }
      - id: m2-title
        type: text
        z: 12
        x: 160
        y: 220
        width: 848
        height: 0
        content: { type: plain, value: "A vague objective\nat the top." }
        style: { font_family: $heading, font_size: 54, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: m2-card-wrong
        type: rect
        z: 13
        x: 72
        y: 480
        width: 936
        height: 220
        radius: 0
        fill: { type: solid, color: "$surface" }
      - id: m2-wrong-label
        type: text
        z: 14
        x: 104
        y: 510
        width: 872
        height: 0
        content: { type: plain, value: "WRONG" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36 }
      - id: m2-wrong-text
        type: text
        z: 15
        x: 104
        y: 550
        width: 872
        height: 0
        content: { type: plain, value: "\"Seeking a challenging role where I can grow and contribute.\"" }
        style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.5 }
      - id: m2-card-right
        type: rect
        z: 16
        x: 72
        y: 730
        width: 936
        height: 220
        radius: 0
        fill: { type: solid, color: "$primary" }
      - id: m2-right-label
        type: text
        z: 17
        x: 104
        y: 760
        width: 872
        height: 0
        content: { type: plain, value: "RIGHT" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: m2-right-text
        type: text
        z: 18
        x: 104
        y: 800
        width: 872
        height: 0
        content: { type: plain, value: "\"Senior PM · shipped 4 zero-to-one B2B products · $12M ARR contribution.\"" }
        style: { font_family: $mono, font_size: 22, color: "#FFFFFF", line_height: 1.5 }
      - id: m2-page
        type: text
        z: 19
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "04 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Mistake 3 ────────────────────────────────────
  - id: mistake-3
    label: Mistake 3 · Verbs
    layers:
      - { id: m3-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m3-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: m3-eyebrow
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "MISTAKE 03" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: m3-glyph
        type: text
        z: 11
        x: 72
        y: 200
        width: 80
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $secondary, line_height: 1 }
      - id: m3-title
        type: text
        z: 12
        x: 160
        y: 220
        width: 848
        height: 0
        content: { type: plain, value: "Soft verbs that\ndilute the work." }
        style: { font_family: $heading, font_size: 54, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: m3-card-wrong
        type: rect
        z: 13
        x: 72
        y: 480
        width: 936
        height: 220
        radius: 0
        fill: { type: solid, color: "$surface" }
      - id: m3-wrong-label
        type: text
        z: 14
        x: 104
        y: 510
        width: 872
        height: 0
        content: { type: plain, value: "WRONG" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36 }
      - id: m3-wrong-text
        type: text
        z: 15
        x: 104
        y: 550
        width: 872
        height: 0
        content: { type: plain, value: "\"Helped with · assisted in · was involved with...\"" }
        style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.5 }
      - id: m3-card-right
        type: rect
        z: 16
        x: 72
        y: 730
        width: 936
        height: 220
        radius: 0
        fill: { type: solid, color: "$primary" }
      - id: m3-right-label
        type: text
        z: 17
        x: 104
        y: 760
        width: 872
        height: 0
        content: { type: plain, value: "RIGHT" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: m3-right-text
        type: text
        z: 18
        x: 104
        y: 800
        width: 872
        height: 0
        content: { type: plain, value: "\"Led · shipped · cut · scaled · negotiated · rebuilt.\"" }
        style: { font_family: $mono, font_size: 22, color: "#FFFFFF", line_height: 1.5 }
      - id: m3-page
        type: text
        z: 19
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "05 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 6 · Mistake 4 + CTA ──────────────────────────────
  - id: mistake-4-cta
    label: Mistake 4 + CTA
    layers:
      - { id: m4-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m4-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: m4-eyebrow
        type: text
        z: 10
        x: 72
        y: 140
        width: 936
        height: 0
        content: { type: plain, value: "MISTAKE 04" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36, text_transform: uppercase }
      - id: m4-glyph
        type: text
        z: 11
        x: 72
        y: 180
        width: 80
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $secondary, line_height: 1 }
      - id: m4-title
        type: text
        z: 12
        x: 160
        y: 200
        width: 848
        height: 0
        content: { type: plain, value: "No numbers anywhere\non the page." }
        style: { font_family: $heading, font_size: 54, font_weight: 800, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02 }
      - id: m4-card-wrong
        type: rect
        z: 13
        x: 72
        y: 460
        width: 936
        height: 180
        radius: 0
        fill: { type: solid, color: "$surface" }
      - id: m4-wrong-text
        type: text
        z: 14
        x: 104
        y: 490
        width: 872
        height: 0
        content: { type: plain, value: "WRONG: \"Improved retention significantly.\"" }
        style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.5 }
      - id: m4-card-right
        type: rect
        z: 15
        x: 72
        y: 660
        width: 936
        height: 180
        radius: 0
        fill: { type: solid, color: "#FFFFFF" }
      - id: m4-right-text
        type: text
        z: 16
        x: 104
        y: 690
        width: 872
        height: 0
        content: { type: plain, value: "RIGHT: \"Improved 90-day retention from 42% → 68%.\"" }
        style: { font_family: $mono, font_size: 22, color: $background, line_height: 1.5 }
      - id: m4-cta-heading
        type: text
        z: 17
        x: 72
        y: 920
        width: 936
        height: 0
        content: { type: plain, value: "Audit yours this week." }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.02 }
      - id: m4-cta-btn
        type: rect
        z: 18
        x: 72
        y: 1080
        width: 360
        height: 64
        radius: 32
        fill: { type: solid, color: "#FFFFFF" }
      - id: m4-cta-text
        type: text
        z: 19
        x: 72
        y: 1098
        width: 360
        height: 0
        content: { type: plain, value: "Follow for more →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: $primary, text_align: center }
      - id: m4-page
        type: text
        z: 20
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "06 / 06" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[3].content.value", type: text, hint: "Cover headline",        default: "6 Resume Mistakes\nKilling Your Callbacks" }
  - { id: cover_tagline,  path: "pages[0].layers[4].content.value", type: text, hint: "Cover tagline",         default: "Recruiters spend 7 seconds on your resume. Don't waste them." }
  - { id: intro_title,    path: "pages[1].layers[3].content.value", type: text, hint: "Intro title",           default: "Most resumes fail the\nfirst 30 seconds." }
  - { id: intro_body,     path: "pages[1].layers[4].content.value", type: text, hint: "Intro body",            default: "The screener isn't reading..." }
  - { id: m1_title,       path: "pages[2].layers[4].content.value", type: text, hint: "Mistake 1 headline",    default: "Listing duties\ninstead of impact." }
  - { id: m1_wrong,       path: "pages[2].layers[7].content.value", type: text, hint: "Mistake 1 WRONG",       default: "\"Responsible for managing the team's onboarding process.\"" }
  - { id: m1_right,       path: "pages[2].layers[10].content.value", type: text, hint: "Mistake 1 RIGHT",      default: "\"Cut new-hire ramp-up from 8 weeks to 3 by rebuilding the onboarding playbook.\"" }
  - { id: m2_title,       path: "pages[3].layers[4].content.value", type: text, hint: "Mistake 2 headline",    default: "A vague objective\nat the top." }
  - { id: m2_wrong,       path: "pages[3].layers[7].content.value", type: text, hint: "Mistake 2 WRONG",       default: "\"Seeking a challenging role where I can grow and contribute.\"" }
  - { id: m2_right,       path: "pages[3].layers[10].content.value", type: text, hint: "Mistake 2 RIGHT",      default: "\"Senior PM · shipped 4 zero-to-one B2B products · $12M ARR contribution.\"" }
  - { id: m3_title,       path: "pages[4].layers[4].content.value", type: text, hint: "Mistake 3 headline",    default: "Soft verbs that\ndilute the work." }
  - { id: m4_title,       path: "pages[5].layers[4].content.value", type: text, hint: "Mistake 4 headline",    default: "No numbers anywhere\non the page." }
  - { id: cta_heading,    path: "pages[5].layers[9].content.value", type: text, hint: "CTA heading",           default: "Audit yours this week." }
