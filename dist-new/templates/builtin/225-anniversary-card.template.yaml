_protocol: template/v1

# Anniversary card — 1080×1500 portrait, editorial-cream theme.
# Script header, BIG year number, couple names, romantic message, signature.
meta:
  id: tmpl-anniversary-card
  name: Anniversary Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, greeting, anniversary, romantic, elegant, portrait]
  description: "Elegant anniversary card with a big year number, couple names, and a romantic congratulatory message."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1 outer frame
  - { id: outer-frame, type: rect, z: 1, x: 60, y: 60, width: 960, height: 1380, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 2 inner frame
  - { id: inner-frame, type: rect, z: 2, x: 78, y: 78, width: 924, height: 1344, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }

  # 3 top ornament
  - { id: orn-top, type: text, z: 5, x: 80, y: 220, width: 920, height: 0, content: { type: plain, value: "❦  ✦  ❦" }, style: { font_family: $heading, font_size: 32, color: "$primary", text_align: center, letter_spacing: 0.4 } }

  # 4 eyebrow
  - { id: eyebrow, type: text, z: 10, x: 80, y: 320, width: 920, height: 0, content: { type: plain, value: "HAPPY ANNIVERSARY" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.8, text_transform: uppercase } }

  # 5 script "celebrating"
  - { id: script, type: text, z: 11, x: 80, y: 380, width: 920, height: 0, content: { type: plain, value: "celebrating" }, style: { font_family: $heading, font_size: 38, font_style: italic, color: "$text_muted", text_align: center, line_height: 1.2 } }

  # 6 BIG year number
  - { id: year-num, type: text, z: 20, x: 80, y: 460, width: 920, height: 0, content: { type: plain, value: "25" }, style: { font_family: $heading, font_size: 340, font_weight: 700, color: "$primary", text_align: center, line_height: 1, letter_spacing: -0.04 } }

  # 7 years label
  - { id: years-label, type: text, z: 21, x: 80, y: 820, width: 920, height: 0, content: { type: plain, value: "YEARS TOGETHER" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$text", text_align: center, letter_spacing: 0.6 } }

  # 8 divider
  - { id: divider, type: rect, z: 22, x: 490, y: 900, width: 100, height: 1, fill: { type: solid, color: "$primary" } }

  # 9 couple names
  - { id: couple, type: text, z: 23, x: 80, y: 950, width: 920, height: 0, content: { type: plain, value: "Margaret & Daniel" }, style: { font_family: $heading, font_size: 56, font_style: italic, color: "$text", text_align: center, line_height: 1.2 } }

  # 10 message
  - { id: message, type: text, z: 30, x: 160, y: 1080, width: 760, height: 0, content: { type: plain, value: "Twenty-five years of late-night talks, quiet mornings, and a love that has weathered every season with grace. Wishing you another lifetime of joy, laughter, and the kind of partnership that makes the rest of us believe." }, style: { font_family: $body, font_size: 19, color: "$text", text_align: center, line_height: 1.7, font_style: italic } }

  # 11 signoff
  - { id: signoff, type: text, z: 31, x: 80, y: 1340, width: 920, height: 0, content: { type: plain, value: "with all our love · The Family" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$primary", text_align: center, letter_spacing: 0.2 } }

slots:
  - { id: couple_names, path: "layers[9].content.value",  type: text, hint: "Couple names",         default: "Margaret & Daniel" }
  - { id: year_count,   path: "layers[6].content.value",  type: text, hint: "Year number",          default: "25" }
  - { id: message,      path: "layers[10].content.value", type: text, hint: "Romantic message",     default: "Twenty-five years of late-night talks, quiet mornings, and a love that has weathered every season with grace. Wishing you another lifetime of joy, laughter, and the kind of partnership that makes the rest of us believe." }
