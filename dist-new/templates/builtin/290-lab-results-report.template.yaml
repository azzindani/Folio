  - { id: t5-rule, type: rect, z: 39, x: 80, y: 674, width: 1080, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.5 }
  # 51 — Row 6: Chloride
  - { id: t6-name, type: text, z: 40, x: 100, y: 688, width: 360, height: 0, content: { type: plain, value: "Chloride" }, style: { font_family: $body, font_size: 13, color: "$text" } }
  - { id: t6-val,  type: text, z: 40, x: 480, y: 688, width: 160, height: 0, content: { type: plain, value: "103" }, style: { font_family: $mono, font_size: 14, color: "$text" } }
  - { id: t6-u,    type: text, z: 40, x: 660, y: 688, width: 120, height: 0, content: { type: plain, value: "mmol/L" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
