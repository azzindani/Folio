  - { id: t4-u,    type: text, z: 36, x: 660, y: 608, width: 120, height: 0, content: { type: plain, value: "mmol/L" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t4-r,    type: text, z: 36, x: 800, y: 608, width: 240, height: 0, content: { type: plain, value: "135 – 145" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t4-f,    type: text, z: 36, x: 1060, y: 608, width: 80, height: 0, content: { type: plain, value: "N" }, style: { font_family: $heading, font_size: 14, font_weight: 700, color: "$text_muted", text_align: right } }
  - { id: t4-rule, type: rect, z: 37, x: 80, y: 634, width: 1080, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.5 }
