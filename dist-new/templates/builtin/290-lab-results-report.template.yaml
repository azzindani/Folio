  - { id: t7-name, type: text, z: 42, x: 100, y: 728, width: 360, height: 0, content: { type: plain, value: "Calcium, total" }, style: { font_family: $body, font_size: 13, color: "$text" } }
  - { id: t7-val,  type: text, z: 42, x: 480, y: 728, width: 160, height: 0, content: { type: plain, value: "9.4" }, style: { font_family: $mono, font_size: 14, color: "$text" } }
