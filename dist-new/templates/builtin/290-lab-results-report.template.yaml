  - { id: t2-val,  type: text, z: 32, x: 480, y: 528, width: 160, height: 0, content: { type: plain, value: "16" }, style: { font_family: $mono, font_size: 14, color: "$text" } }
  - { id: t2-u,    type: text, z: 32, x: 660, y: 528, width: 120, height: 0, content: { type: plain, value: "mg/dL" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t2-r,    type: text, z: 32, x: 800, y: 528, width: 240, height: 0, content: { type: plain, value: "7 – 22" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t2-f,    type: text, z: 32, x: 1060, y: 528, width: 80, height: 0, content: { type: plain, value: "N" }, style: { font_family: $heading, font_size: 14, font_weight: 700, color: "$text_muted", text_align: right } }
  - { id: t2-rule, type: rect, z: 33, x: 80, y: 554, width: 1080, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.5 }
  # 33 — Row 3: Creatinine
  - { id: t3-name, type: text, z: 34, x: 100, y: 568, width: 360, height: 0, content: { type: plain, value: "Creatinine" }, style: { font_family: $body, font_size: 13, color: "$text" } }
  - { id: t3-val,  type: text, z: 34, x: 480, y: 568, width: 160, height: 0, content: { type: plain, value: "0.92" }, style: { font_family: $mono, font_size: 14, color: "$text" } }
  - { id: t3-u,    type: text, z: 34, x: 660, y: 568, width: 120, height: 0, content: { type: plain, value: "mg/dL" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t3-r,    type: text, z: 34, x: 800, y: 568, width: 240, height: 0, content: { type: plain, value: "0.6 – 1.1" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t3-f,    type: text, z: 34, x: 1060, y: 568, width: 80, height: 0, content: { type: plain, value: "N" }, style: { font_family: $heading, font_size: 14, font_weight: 700, color: "$text_muted", text_align: right } }
