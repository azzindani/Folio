_protocol: template/v1

# Lab results report — 1240×1754 A4 portrait, light-clean theme.
# Clinic header, patient info block, 10-row test table with reference
# ranges and H/L/N flags, reviewer signature footer.
meta:
  id: tmpl-lab-results-report
  name: Lab Results Report
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, health, medical, laboratory, results, clinical, a4, report]
  description: "Clinical lab results report with patient info block, 10-test panel, reference ranges, and H/L/N flags."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # 0 — bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
  # 1 — clinic header band
  - { id: header-band, type: rect, z: 1, x: 0, y: 0, width: 1240, height: 140, fill: { type: solid, color: "$primary" } }
  # 2 — clinic name
  - { id: clinic-name, type: text, z: 2, x: 80, y: 36, width: 800, height: 0, content: { type: plain, value: "Linden Crossing Diagnostic Lab" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: "#FFFFFF", line_height: 1.2 } }
  # 3 — clinic addr
  - { id: clinic-addr, type: text, z: 3, x: 80, y: 78, width: 800, height: 0, content: { type: plain, value: "218 Linden Crossing · Albany, NY 12210 · (518) 555-0142 · CLIA #33D1098765" }, style: { font_family: $mono, font_size: 12, color: "#DBEAFE", line_height: 1.4 } }
  # 4 — title right
  - { id: doc-title, type: text, z: 4, x: 80, y: 100, width: 1080, height: 0, content: { type: plain, value: "LABORATORY REPORT" }, style: { font_family: $heading, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.6, text_align: right, text_transform: uppercase } }
  # 5 — patient block bg
  - { id: pinfo-bg, type: rect, z: 5, x: 80, y: 180, width: 1080, height: 160, radius: 8, fill: { type: solid, color: "$surface" } }
  # 6 — patient name label
  - { id: p-name-label, type: text, z: 6, x: 100, y: 200, width: 480, height: 0, content: { type: plain, value: "PATIENT" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 7 — patient name
  - { id: patient-name, type: text, z: 7, x: 100, y: 218, width: 480, height: 0, content: { type: plain, value: "Margaret E. Sullivan" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: "$text", line_height: 1.3 } }
  # 8 — dob label
  - { id: p-dob-label, type: text, z: 8, x: 100, y: 260, width: 480, height: 0, content: { type: plain, value: "DOB · SEX · MRN" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 9 — dob value
  - { id: p-dob, type: text, z: 9, x: 100, y: 278, width: 480, height: 0, content: { type: plain, value: "04/12/1942 · F · MRN 00478291" }, style: { font_family: $mono, font_size: 14, color: "$text", line_height: 1.4 } }
  # 10 — phys label
  - { id: phys-label, type: text, z: 10, x: 640, y: 200, width: 500, height: 0, content: { type: plain, value: "ORDERING PHYSICIAN" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 11 — phys value
  - { id: phys-value, type: text, z: 11, x: 640, y: 218, width: 500, height: 0, content: { type: plain, value: "Dr. Aaron Chen, MD" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: "$text", line_height: 1.3 } }
  # 12 — collected label
  - { id: coll-label, type: text, z: 12, x: 640, y: 260, width: 500, height: 0, content: { type: plain, value: "COLLECTED · REPORTED" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 13 — collected value
  - { id: coll-value, type: text, z: 13, x: 640, y: 278, width: 500, height: 0, content: { type: plain, value: "May 14, 2026 · May 16, 2026" }, style: { font_family: $mono, font_size: 14, color: "$text", line_height: 1.4 } }
  # 14 — panel title
  - { id: panel-title, type: text, z: 20, x: 80, y: 380, width: 1080, height: 0, content: { type: plain, value: "Comprehensive Metabolic Panel (CMP-14)" }, style: { font_family: $heading, font_size: 20, font_weight: 700, color: "$text", line_height: 1.3 } }
  # 15 — table header bg
  - { id: th-bg, type: rect, z: 21, x: 80, y: 430, width: 1080, height: 40, fill: { type: solid, color: "$surface" } }
  # 16 — th test
  - { id: th-test, type: text, z: 22, x: 100, y: 442, width: 360, height: 0, content: { type: plain, value: "TEST" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 17 — th value
  - { id: th-value, type: text, z: 23, x: 480, y: 442, width: 160, height: 0, content: { type: plain, value: "RESULT" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 18 — th units
  - { id: th-units, type: text, z: 24, x: 660, y: 442, width: 120, height: 0, content: { type: plain, value: "UNITS" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 19 — th range
  - { id: th-range, type: text, z: 25, x: 800, y: 442, width: 240, height: 0, content: { type: plain, value: "REFERENCE RANGE" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 20 — th flag
  - { id: th-flag, type: text, z: 26, x: 1060, y: 442, width: 80, height: 0, content: { type: plain, value: "FLAG" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4, text_align: right } }
  # 21 — Row 1: Glucose
  - { id: t1-name, type: text, z: 30, x: 100, y: 488, width: 360, height: 0, content: { type: plain, value: "Glucose, fasting" }, style: { font_family: $body, font_size: 13, color: "$text" } }
  - { id: t1-val,  type: text, z: 30, x: 480, y: 488, width: 160, height: 0, content: { type: plain, value: "112" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: "$text" } }
  - { id: t1-u,    type: text, z: 30, x: 660, y: 488, width: 120, height: 0, content: { type: plain, value: "mg/dL" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t1-r,    type: text, z: 30, x: 800, y: 488, width: 240, height: 0, content: { type: plain, value: "70 – 99" }, style: { font_family: $mono, font_size: 13, color: "$text_muted" } }
  - { id: t1-f,    type: text, z: 30, x: 1060, y: 488, width: 80, height: 0, content: { type: plain, value: "H" }, style: { font_family: $heading, font_size: 14, font_weight: 800, color: "#D97706", text_align: right } }
  - { id: t1-rule, type: rect, z: 31, x: 80, y: 514, width: 1080, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.5 }
  # 27 — Row 2: BUN
