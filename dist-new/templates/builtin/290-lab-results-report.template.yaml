  - { id: t8-name, type: text, z: 44, x: 100, y: 768, width: 360, height: 0, content: { type: plain, value: "AST (SGOT)" }, style: { font_family: $body, font_size: 13, color: "$text" } }
  - { id: t8-val,  type: text, z: 44, x: 480, y: 768, width: 160, height: 0, content: { type: plain, value: "28" }, style: { font_family: $mono, font_size: 14, color: "$text" } }
