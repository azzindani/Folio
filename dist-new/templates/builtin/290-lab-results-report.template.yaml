slots:
  - { id: patient_name,      path: "layers[7].content.value",  type: text, hint: "Patient name",          default: "Margaret E. Sullivan" }
  - { id: dob,               path: "layers[9].content.value",  type: text, hint: "DOB · Sex · MRN line",  default: "04/12/1942 · F · MRN 00478291" }
  - { id: ordering_physician,path: "layers[11].content.value", type: text, hint: "Ordering physician",    default: "Dr. Aaron Chen, MD" }
  - { id: collected_date,    path: "layers[13].content.value", type: text, hint: "Collected · Reported",  default: "May 14, 2026 · May 16, 2026" }
