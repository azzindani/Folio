_protocol: template/v1

# Settings page — 1080×1920 portrait, light-clean theme.
# Header + back arrow, 8 settings rows with icon/label/chevron, sign-out bottom.
meta:
  id: tmpl-settings-page
  name: Settings Page
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [settings, ui, screen, mobile, ios, portrait, light]
  description: "Mobile settings screen with header + back arrow, 8 settings rows, and a red sign-out action."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  # ── Header ────────────────────────────────────────────────
  - id: back-arrow
    type: path
    z: 5
    d: "M 90 130 L 60 100 L 90 70"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 6 }

  - id: header
    type: text
    z: 6
    x: 60
    y: 80
    width: 960
    height: 0
    content: { type: plain, value: "Settings" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: $text
      text_align: center
      letter_spacing: -0.02

  - id: user-email
    type: text
    z: 7
    x: 60
    y: 160
    width: 960
    height: 0
    content: { type: plain, value: "you@company.com" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted
      text_align: center

  # ── Row 1: Profile ────────────────────────────────────────
  - id: row1-bg
    type: rect
    z: 10
    x: 60
    y: 260
    width: 960
    height: 96
    radius: 18
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: row1-icon
    type: circle
    z: 11
    cx: 124
    cy: 308
    rx: 22
    ry: 22
    fill: { type: solid, color: "$primary" }

  - id: row1-label
    type: text
    z: 12
    x: 176
    y: 294
    width: 700
    height: 0
    content: { type: plain, value: "Profile" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text

  - id: row1-chev
    type: path
    z: 13
    d: "M 956 296 L 976 308 L 956 320"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text_muted", width: 3 }

  # ── Row 2: Notifications ──────────────────────────────────
