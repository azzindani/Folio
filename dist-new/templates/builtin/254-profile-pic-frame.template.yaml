_protocol: template/v1

# Profile-pic placeholder + frame — 1000×1000 square, brutalist-mono.
# Centered photo placeholder circle with a thick ring border, harsh
# rectangular corner accents, and a name banner below.
meta:
  id: tmpl-profile-pic-frame
  name: Profile Pic Frame
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, profile, avatar, frame, square, brutalist]
  description: "Profile picture frame — photo placeholder circle, ring border, corner accents, and name banner."

document:
  width: 1000
  height: 1000
  unit: px
  dpi: 96

theme:
  ref: brutalist-mono

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1000
    height: 1000
    fill: { type: solid, color: "$background" }

  # ── Decorative corner accents ─────────────────────────────
  - id: corner-tl
    type: rect
    z: 2
    x: 40
    y: 40
    width: 140
    height: 14
    fill: { type: solid, color: "$text" }

  - id: corner-tl-v
    type: rect
    z: 2
    x: 40
    y: 40
    width: 14
    height: 140
    fill: { type: solid, color: "$text" }

  - id: corner-tr
    type: rect
    z: 2
    x: 820
    y: 40
    width: 140
    height: 14
    fill: { type: solid, color: "$text" }

  - id: corner-tr-v
    type: rect
    z: 2
    x: 946
    y: 40
    width: 14
    height: 140
    fill: { type: solid, color: "$text" }

  - id: corner-bl
    type: rect
    z: 2
    x: 40
    y: 946
    width: 140
    height: 14
    fill: { type: solid, color: "$text" }

  - id: corner-bl-v
    type: rect
    z: 2
    x: 40
    y: 820
    width: 14
    height: 140
    fill: { type: solid, color: "$text" }

  - id: corner-br
    type: rect
    z: 2
    x: 820
    y: 946
    width: 140
    height: 14
    fill: { type: solid, color: "$text" }

  - id: corner-br-v
    type: rect
    z: 2
    x: 946
    y: 820
    width: 14
    height: 140
    fill: { type: solid, color: "$text" }

  # ── Outer ring border ─────────────────────────────────────
  - id: outer-ring
    type: circle
    z: 10
    cx: 500
    cy: 460
    rx: 280
    ry: 280
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 14 }

  # ── Inner photo placeholder ───────────────────────────────
  - id: photo-circle
    type: circle
    z: 11
    cx: 500
    cy: 460
    rx: 256
    ry: 256
    fill: { type: solid, color: $surface }
    stroke: { color: "$accent", width: 4 }

  # ── Photo placeholder glyph ───────────────────────────────
  - id: photo-glyph
    type: text
    z: 12
    x: 0
    y: 380
    width: 1000
    height: 0
    content: { type: plain, value: "PHOTO" }
    style:
      font_family: $mono
      font_size: 36
      font_weight: 800
      color: $text_muted
      text_align: center
      line_height: 1.3
      letter_spacing: 0.18
      text_transform: uppercase
      opacity: 0.3

  - id: photo-sub
    type: text
    z: 13
    x: 0
    y: 460
    width: 1000
    height: 0
    content: { type: plain, value: "Add photo" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 500
      color: $text_muted
      text_align: center
      line_height: 1.3
      opacity: 0.3

  # ── Name banner background ────────────────────────────────
  - id: name-banner
    type: rect
    z: 20
    x: 80
    y: 800
    width: 840
    height: 110
    fill: { type: solid, color: "$text" }

  # ── Banner inner offset shadow line ───────────────────────
  - id: banner-shadow
    type: rect
    z: 19
    x: 96
    y: 816
    width: 840
    height: 110
    fill: { type: solid, color: "$accent" }

  # ── Name text ─────────────────────────────────────────────
  - id: name
    type: text
    z: 21
    x: 80
    y: 822
    width: 840
    height: 0
    content: { type: plain, value: "MARGOT ELLIS" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 900
      color: $background
      text_align: center
      line_height: 1.3
      letter_spacing: 0.06
      text_transform: uppercase

  # ── Tagline ───────────────────────────────────────────────
  - id: tagline
    type: text
    z: 22
    x: 80
    y: 940
    width: 840
    height: 0
    content: { type: plain, value: "TYPE DESIGNER  ·  AMSTERDAM" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text
      text_align: center
      letter_spacing: 0.32
      text_transform: uppercase
      line_height: 1.3

slots:
  - { id: name,    path: "layers[15].content.value", type: text, hint: "Display name",  default: "MARGOT ELLIS" }
  - { id: tagline, path: "layers[16].content.value", type: text, hint: "Tagline / role", default: "TYPE DESIGNER  ·  AMSTERDAM" }
