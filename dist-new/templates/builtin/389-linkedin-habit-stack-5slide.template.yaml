_protocol: template/v1

# LinkedIn 5-slide carousel · "Stack tiny habits, change your life" · cover, intro, 3 stack recipes, CTA collapsed into recipe-3.
meta:
  id: tmpl-linkedin-habit-stack-5slide
  name: LinkedIn Habit Stacking (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, productivity, habits, habit-stacking, sunset-glow, "4-5"]
  description: "5-slide LinkedIn carousel: 3 habit-stack recipes with trigger/habit/example."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: sun-disc, type: circle, z: 3, cx: 540, cy: 280, rx: 200, ry: 200, fill: { type: solid, color: $accent }, opacity: 0.4 }
      - id: eyebrow
        type: text
        z: 10
        x: 72
        y: 580
        width: 936
        height: 0
        content: { type: plain, value: "HABIT STACKING · 5 SLIDES" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 72
        y: 640
        width: 936
        height: 0
        content: { type: plain, value: "Stack tiny habits.\nChange your life." }
        style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 12
        x: 72
        y: 920
        width: 936
        height: 0
        content: { type: plain, value: "Attach a new habit to one you already do." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: swipe-hint
        type: text
        z: 13
        x: 72
        y: 1020
        width: 936
        height: 0
        content: { type: plain, value: "Swipe → for 3 recipes." }
        style: { font_family: $body, font_size: 20, font_weight: 600, color: $primary }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "1 / 5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · What is habit stacking ───────────────────────
  - id: intro
    label: What is habit stacking
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "THE IDEA" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: heading
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "What is\nhabit stacking?" }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: body
        type: text
        z: 12
        x: 72
        y: 580
        width: 936
        height: 0
        content: { type: plain, value: "Pair a new behavior with an existing routine. The old habit triggers the new one — no willpower needed." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - { id: formula-card, type: rect, z: 20, x: 72, y: 880, width: 936, height: 180, radius: 0, fill: { type: solid, color: "$surface" } }
      - id: formula-text
        type: text
        z: 21
        x: 72
        y: 940
        width: 936
        height: 0
        content: { type: plain, value: "After I [trigger],\nI will [new habit]." }
        style: { font_family: $mono, font_size: 30, font_weight: 700, color: $primary, line_height: 1.4, text_align: center }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "2 / 5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Recipe 01 ────────────────────────────────────
  - id: recipe-1
    label: Recipe 01
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 10
        x: 72
        y: 160
        width: 200
        height: 0
        content: { type: plain, value: "RECIPE 01" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32 }
      - id: heading
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "Morning\ncoffee → read." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - { id: template-card, type: rect, z: 20, x: 72, y: 600, width: 936, height: 200, radius: 0, fill: { type: solid, color: "$surface" } }
      - id: template-text
        type: text
        z: 21
        x: 110
        y: 640
        width: 860
        height: 0
        content: { type: plain, value: "After I pour my morning coffee,\nI will read one page of a book." }
        style: { font_family: $mono, font_size: 24, font_weight: 600, color: $text, line_height: 1.5 }
      - id: example-label
        type: text
        z: 30
        x: 72
        y: 860
        width: 936
        height: 0
        content: { type: plain, value: "EXAMPLE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: example-text
        type: text
        z: 31
        x: 72
        y: 900
        width: 936
        height: 0
        content: { type: plain, value: "Sarah finished 14 books in a year — one page at a time, every morning." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "3 / 5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Recipe 02 ────────────────────────────────────
  - id: recipe-2
    label: Recipe 02
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 10
        x: 72
        y: 160
        width: 200
        height: 0
        content: { type: plain, value: "RECIPE 02" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32 }
      - id: heading
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "Lock laptop\n→ pushups." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - { id: template-card, type: rect, z: 20, x: 72, y: 600, width: 936, height: 200, radius: 0, fill: { type: solid, color: "$surface" } }
      - id: template-text
        type: text
        z: 21
        x: 110
        y: 640
        width: 860
        height: 0
        content: { type: plain, value: "After I close my laptop at end of day,\nI will do 10 pushups." }
        style: { font_family: $mono, font_size: 24, font_weight: 600, color: $text, line_height: 1.5 }
      - id: example-label
        type: text
        z: 30
        x: 72
        y: 860
        width: 936
        height: 0
        content: { type: plain, value: "EXAMPLE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: example-text
        type: text
        z: 31
        x: 72
        y: 900
        width: 936
        height: 0
        content: { type: plain, value: "Marcus is up to 60 pushups in 5 sets — without ever “going to the gym”." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "4 / 5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Recipe 03 + CTA ──────────────────────────────
  - id: recipe-3
    label: Recipe 03 + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $primary }, opacity: 0.95 }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "#FFFFFF" } }
      - id: number
        type: text
        z: 10
        x: 72
        y: 160
        width: 200
        height: 0
        content: { type: plain, value: "RECIPE 03" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.32 }
      - id: heading
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "Brush teeth\n→ gratitude." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.03 }
      - { id: template-card, type: rect, z: 20, x: 72, y: 580, width: 936, height: 200, radius: 0, fill: { type: solid, color: "rgba(255,255,255,0.18)" } }
      - id: template-text
        type: text
        z: 21
        x: 110
        y: 620
        width: 860
        height: 0
        content: { type: plain, value: "After I brush my teeth at night,\nI will name 3 things I'm grateful for." }
        style: { font_family: $mono, font_size: 24, font_weight: 600, color: "#FFFFFF", line_height: 1.5 }
      - id: example-text
        type: text
        z: 31
        x: 72
        y: 840
        width: 936
        height: 0
        content: { type: plain, value: "30 seconds. Compounding into a brain that scans for good." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF", line_height: 1.5 }
      - id: cta
        type: text
        z: 40
        x: 72
        y: 1000
        width: 936
        height: 0
        content: { type: plain, value: "Pick one. Stack it.\nReport back in a week." }
        style: { font_family: $heading, font_size: 36, font_weight: 800, color: "#FFFFFF", line_height: 1.2, letter_spacing: -0.01 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "5 / 5" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value",  type: text, hint: "Cover title",          default: "Stack tiny habits.\nChange your life." }
  - { id: cover_tagline,  path: "pages[0].layers[5].content.value",  type: text, hint: "Cover tagline",        default: "Attach a new habit to one you already do." }
  - { id: intro_heading,  path: "pages[1].layers[3].content.value",  type: text, hint: "Intro heading",        default: "What is\nhabit stacking?" }
  - { id: intro_body,     path: "pages[1].layers[4].content.value",  type: text, hint: "Intro body",           default: "Pair a new behavior with an existing routine. The old habit triggers the new one — no willpower needed." }
  - { id: rec_1_heading,  path: "pages[2].layers[3].content.value",  type: text, hint: "Recipe 1 heading",     default: "Morning\ncoffee → read." }
  - { id: rec_1_template, path: "pages[2].layers[5].content.value",  type: text, hint: "Recipe 1 template",    default: "After I pour my morning coffee,\nI will read one page of a book." }
  - { id: rec_1_example,  path: "pages[2].layers[7].content.value",  type: text, hint: "Recipe 1 example",     default: "Sarah finished 14 books in a year — one page at a time, every morning." }
  - { id: rec_2_heading,  path: "pages[3].layers[3].content.value",  type: text, hint: "Recipe 2 heading",     default: "Lock laptop\n→ pushups." }
  - { id: rec_2_template, path: "pages[3].layers[5].content.value",  type: text, hint: "Recipe 2 template",    default: "After I close my laptop at end of day,\nI will do 10 pushups." }
  - { id: rec_2_example,  path: "pages[3].layers[7].content.value",  type: text, hint: "Recipe 2 example",     default: "Marcus is up to 60 pushups in 5 sets — without ever “going to the gym”." }
  - { id: rec_3_heading,  path: "pages[4].layers[3].content.value",  type: text, hint: "Recipe 3 heading",     default: "Brush teeth\n→ gratitude." }
  - { id: rec_3_template, path: "pages[4].layers[5].content.value",  type: text, hint: "Recipe 3 template",    default: "After I brush my teeth at night,\nI will name 3 things I'm grateful for." }
  - { id: rec_3_example,  path: "pages[4].layers[6].content.value",  type: text, hint: "Recipe 3 example",     default: "30 seconds. Compounding into a brain that scans for good." }
  - { id: cta,            path: "pages[4].layers[7].content.value",  type: text, hint: "CTA",                  default: "Pick one. Stack it.\nReport back in a week." }
