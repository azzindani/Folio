_protocol: template/v1

# Signup page — 1920×1080 landscape, light-clean theme.
# Left form (name/email/password + ToS), right social-proof testimonial + stars.
meta:
  id: tmpl-signup-page
  name: Signup Page
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, ui, screen, signup, register, auth, landscape, light]
  description: "Signup page with left form (name/email/password + ToS) and right testimonial + 5-star social proof."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Right testimonial panel ───────────────────────────────
  - id: testimonial-panel
    type: rect
    z: 5
    x: 960
    y: 0
    width: 960
    height: 1080
    fill: { type: solid, color: $surface }
  - id: testimonial-card
    type: rect
    z: 6
    x: 1040
    y: 260
    width: 800
    height: 560
    radius: 28
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 16, blur: 40, color: "rgba(15,23,42,0.08)" }

  - id: quote-glyph
    type: text
    z: 7
    x: 1080
    y: 290
    width: 200
    height: 0
    content: { type: plain, value: "“" }
    style:
      font_family: $heading
      font_size: 140
      font_weight: 800
      color: $primary
      line_height: 1

  - id: testimonial
    type: text
    z: 8
    x: 1080
    y: 380
    width: 720
    height: 0
    content: { type: plain, value: "Folio cut our design handoff time in half. The team just gets it now — semantic YAML, instant exports, zero friction." }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 500
      color: $text
      line_height: 1.45
      letter_spacing: -0.005

  # 5 stars
  - id: star-1
    type: path
    z: 9
    d: "M 1080 700 L 1090 720 L 1112 723 L 1096 738 L 1100 760 L 1080 750 L 1060 760 L 1064 738 L 1048 723 L 1070 720 Z"
    fill: { type: solid, color: "$accent" }
  - id: star-2
    type: path
    z: 10
    d: "M 1140 700 L 1150 720 L 1172 723 L 1156 738 L 1160 760 L 1140 750 L 1120 760 L 1124 738 L 1108 723 L 1130 720 Z"
    fill: { type: solid, color: "$accent" }
  - id: star-3
    type: path
    z: 11
    d: "M 1200 700 L 1210 720 L 1232 723 L 1216 738 L 1220 760 L 1200 750 L 1180 760 L 1184 738 L 1168 723 L 1190 720 Z"
    fill: { type: solid, color: "$accent" }
  - id: star-4
    type: path
    z: 12
    d: "M 1260 700 L 1270 720 L 1292 723 L 1276 738 L 1280 760 L 1260 750 L 1240 760 L 1244 738 L 1228 723 L 1250 720 Z"
    fill: { type: solid, color: "$accent" }
  - id: star-5
    type: path
    z: 13
    d: "M 1320 700 L 1330 720 L 1352 723 L 1336 738 L 1340 760 L 1320 750 L 1300 760 L 1304 738 L 1288 723 L 1310 720 Z"
    fill: { type: solid, color: "$accent" }

  - id: testimonial-author
    type: text
    z: 14
    x: 1080
    y: 780
    width: 720
    height: 0
    content: { type: plain, value: "Jamie Park · Head of Design, Northwind" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text_muted

  # ── Left form ─────────────────────────────────────────────
  - id: brand-mark
    type: text
    z: 20
    x: 120
    y: 100
    width: 400
    height: 0
    content: { type: plain, value: "Folio" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 800
      color: $primary
      letter_spacing: -0.01

  - id: form-heading
    type: text
    z: 21
    x: 120
    y: 220
    width: 720
    height: 0
    content: { type: plain, value: "Create your account" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 800
      color: $text
      letter_spacing: -0.02

  - id: form-sub
    type: text
    z: 22
    x: 120
    y: 290
    width: 720
    height: 0
    content: { type: plain, value: "Free for 30 days. No credit card required." }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  # Name
  - id: name-input
    type: rect
    z: 30
    x: 120
    y: 370
    width: 720
    height: 60
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: name-placeholder
    type: text
    z: 31
    x: 144
    y: 388
    width: 600
    height: 0
    content: { type: plain, value: "Full name" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  # Email
  - id: email-input
    type: rect
    z: 32
    x: 120
    y: 454
    width: 720
    height: 60
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: email-placeholder
    type: text
    z: 33
    x: 144
    y: 472
    width: 600
    height: 0
    content: { type: plain, value: "Email address" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  # Password
  - id: pw-input
    type: rect
    z: 34
    x: 120
    y: 538
    width: 720
    height: 60
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: pw-placeholder
    type: text
    z: 35
    x: 144
    y: 556
    width: 600
    height: 0
    content: { type: plain, value: "Password (min 8 chars)" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  # ToS checkbox
  - id: tos-box
    type: rect
    z: 36
    x: 120
    y: 638
    width: 24
    height: 24
    radius: 6
    fill: { type: solid, color: "$primary" }

  - id: tos-check
    type: path
    z: 37
    d: "M 126 650 L 132 656 L 140 644"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "#FFFFFF", width: 3 }

  - id: tos-text
    type: text
    z: 38
    x: 160
    y: 642
    width: 680
    height: 0
    content: { type: plain, value: "I agree to the Terms of Service and Privacy Policy." }
    style:
      font_family: $body
      font_size: 15
      color: $text_muted

  # CTA
  - id: cta-bg
    type: rect
    z: 40
    x: 120
    y: 712
    width: 720
    height: 68
    radius: 14
    fill: { type: solid, color: "$primary" }
    effects:
      shadow:
        - { dx: 0, dy: 10, blur: 24, color: "rgba(15,23,42,0.18)" }

  - id: cta-text
    type: text
    z: 41
    x: 120
    y: 732
    width: 720
    height: 0
    content: { type: plain, value: "Create account" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

  - id: signin-link
    type: text
    z: 42
    x: 120
    y: 820
    width: 720
    height: 0
    content: { type: plain, value: "Already have an account?  Sign in →" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

slots:
  - { id: brand_name,         path: "layers[14].content.value", type: text, hint: "Brand name (left)",        default: "Folio" }
  - { id: testimonial,        path: "layers[7].content.value",  type: text, hint: "Testimonial quote",        default: "Folio cut our design handoff time in half. The team just gets it now — semantic YAML, instant exports, zero friction." }
  - { id: testimonial_author, path: "layers[13].content.value", type: text, hint: "Testimonial author + role", default: "Jamie Park · Head of Design, Northwind" }
