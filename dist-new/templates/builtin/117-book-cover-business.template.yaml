_protocol: template/v1

# Business / non-fiction book cover — 2:3 portrait (1600×2400).
# Confident corporate palette: bold sans title left-aligned, subtitle below,
# author at bottom, abstract geometric accent block, endorsement strip.
meta:
  id: tmpl-book-cover-business
  name: Book Cover — Business
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, book, cover, business, non-fiction, corporate]
  description: "Modern business / non-fiction book cover with bold sans title and abstract geometric accents."

document:
  width: 1600
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1600
    height: 2400
    fill: { type: solid, color: "$background" }

  - id: top-accent-bar
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1600
    height: 8
    fill: { type: solid, color: "$primary" }

  - id: geo-square-1
    type: rect
    z: 5
    x: 1000
    y: 200
    width: 480
    height: 480
    fill: { type: solid, color: $primary }
  - id: geo-square-2
    type: rect
    z: 6
    x: 880
    y: 320
    width: 320
    height: 320
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 4 }

  - id: geo-circle
    type: circle
    z: 7
    x: 1280
    y: 480
    width: 160
    height: 160
    fill: { type: solid, color: "$secondary" }

  - id: geo-line
    type: rect
    z: 8
    x: 120
    y: 360
    width: 720
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: publisher
    type: text
    z: 10
    x: 120
    y: 200
    width: 800
    height: 0
    content: { type: plain, value: "MERIDIAN BUSINESS PRESS" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 800
      color: "$primary"
      letter_spacing: 0.42
      text_transform: uppercase

  - id: category
    type: text
    z: 11
    x: 120
    y: 250
    width: 800
    height: 0
    content: { type: plain, value: "Leadership · Strategy" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 500
      color: "$text_muted"
      letter_spacing: 0.2

  - id: title-line-1
    type: text
    z: 15
    x: 120
    y: 900
    width: 1360
    height: 0
    content: { type: plain, value: "Compounding" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: "$text"
      line_height: 0.95
      letter_spacing: -0.025

  - id: title-line-2
    type: text
    z: 16
    x: 120
    y: 1080
    width: 1360
    height: 0
    content: { type: plain, value: "Decisions" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: "$primary"
      line_height: 0.95
      letter_spacing: -0.025

  - id: subtitle-rule
    type: rect
    z: 17
    x: 120
    y: 1320
    width: 120
    height: 6
    fill: { type: solid, color: "$primary" }

  - id: subtitle
    type: text
    z: 18
    x: 120
    y: 1380
    width: 1200
    height: 0
    content: { type: plain, value: "How the World's Best Operators Build Lasting Advantage One Small Choice at a Time" }
    style:
      font_family: $body
      font_size: 38
      font_weight: 400
      color: "$text"
      line_height: 1.3

  - id: endorsement-rule
    type: rect
    z: 25
    x: 120
    y: 1980
    width: 1360
    height: 1
    fill: { type: solid, color: "$border" }

  - id: endorsement
    type: text
    z: 26
    x: 120
    y: 2010
    width: 1360
    height: 0
    content: { type: plain, value: "“The most useful business book of the decade.” — HARVARD BUSINESS REVIEW" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 500
      font_style: italic
      color: "$text_muted"
      line_height: 1.35

  - id: author-eyebrow
    type: text
    z: 30
    x: 120
    y: 2200
    width: 1360
    height: 0
    content: { type: plain, value: "FROM THE AUTHOR OF “TIGHT LOOPS”" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text_muted"
      letter_spacing: 0.36
      text_transform: uppercase

  - id: author
    type: text
    z: 31
    x: 120
    y: 2240
    width: 1360
    height: 0
    content: { type: plain, value: "Daniel Whitford" }
    style:
      font_family: $heading
      font_size: 70
      font_weight: 800
      color: "$text"
      letter_spacing: -0.01

  - id: bottom-accent-bar
    type: rect
    z: 35
    x: 0
    y: 2390
    width: 1600
    height: 10
    fill: { type: solid, color: "$primary" }

slots:
  - { id: title,    path: "layers[8].content.value",  type: text, hint: "Title line 1",       default: "Compounding" }
  - { id: title_2,  path: "layers[9].content.value",  type: text, hint: "Title line 2",       default: "Decisions" }
  - { id: subtitle, path: "layers[11].content.value", type: text, hint: "Subtitle / hook",    default: "How the World's Best Operators Build Lasting Advantage One Small Choice at a Time" }
  - { id: author,   path: "layers[15].content.value", type: text, hint: "Author name",        default: "Daniel Whitford" }
