_protocol: template/v1

# 4-slide social carousel — Cover / Problem / Solution / CTA narrative.
# Square 1080×1080, dark with purple accent.
meta:
  id: tmpl-instagram-carousel
  name: Instagram Carousel (4 slides)
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, social, instagram, dark]

document:
  width: 1080
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: dark-tech
  overrides:
    primary: "#7C3AED"
    secondary: "#F97316"
    accent: "#10B981"

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1080, fill: { type: solid, color: "$background" } }
      - id: ring
        type: circle
        z: 5
        cx: 540
        cy: 540
        rx: 380
        ry: 380
        fill: { type: solid, color: "transparent" }
        stroke: { color: "$primary", width: 2 }
        opacity: 0.4
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "1/4" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 360
        width: 960
        height: 0
        content: { type: plain, value: "THE GUIDE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 420
        width: 960
        height: 0
        content: { type: plain, value: "How to launch a product\nin under a week" }
        style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 13
        x: 60
        y: 680
        width: 960
        height: 0
        content: { type: plain, value: "Swipe → for the playbook." }
        style: { font_family: $body, font_size: 24, color: "#AAAAAA" }
      - id: handle
        type: text
        z: 14
        x: 60
        y: 1000
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }

  # ── Slide 2 · Problem ──────────────────────────────────────
  - id: problem
    label: Problem
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1080, fill: { type: solid, color: "$background" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "2/4" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "THE PROBLEM" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Most launches stall before they ship." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15 }
      - id: pain-1-dot
        type: circle
        z: 20
        cx: 100
        cy: 480
        rx: 16
        ry: 16
        fill: { type: solid, color: "$secondary" }
      - id: pain-1-text
        type: text
        z: 21
        x: 140
        y: 460
        width: 880
        height: 0
        content: { type: plain, value: "Scope creep eats the runway." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: pain-2-dot
        type: circle
        z: 20
        cx: 100
        cy: 580
        rx: 16
        ry: 16
        fill: { type: solid, color: "$secondary" }
      - id: pain-2-text
        type: text
        z: 21
        x: 140
        y: 560
        width: 880
        height: 0
        content: { type: plain, value: "Marketing starts the day-of." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: pain-3-dot
        type: circle
        z: 20
        cx: 100
        cy: 680
        rx: 16
        ry: 16
        fill: { type: solid, color: "$secondary" }
      - id: pain-3-text
        type: text
        z: 21
        x: 140
        y: 660
        width: 880
        height: 0
        content: { type: plain, value: "Nobody owns the launch checklist." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }

  # ── Slide 3 · Solution ─────────────────────────────────────
  - id: solution
    label: Solution
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1080, fill: { type: solid, color: "$background" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "3/4" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "THE PLAYBOOK" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "A 5-day path from idea to live." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15 }
      - id: step-1
        type: text
        z: 21
        x: 60
        y: 420
        width: 960
        height: 0
        content: { type: plain, value: "✓ Day 1 · scope the smallest shippable cut" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.6 }
      - id: step-2
        type: text
        z: 22
        x: 60
        y: 490
        width: 960
        height: 0
        content: { type: plain, value: "✓ Day 2 · build the core feature, nothing else" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.6 }
      - id: step-3
        type: text
        z: 23
        x: 60
        y: 560
        width: 960
        height: 0
        content: { type: plain, value: "✓ Day 3 · write the launch post + a demo clip" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.6 }
      - id: step-4
        type: text
        z: 24
        x: 60
        y: 630
        width: 960
        height: 0
        content: { type: plain, value: "✓ Day 4 · soft-launch to 10 people, fix friction" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.6 }
      - id: step-5
        type: text
        z: 25
        x: 60
        y: 700
        width: 960
        height: 0
        content: { type: plain, value: "✓ Day 5 · public launch + watch the metrics" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.6 }

  # ── Slide 4 · CTA ──────────────────────────────────────────
  - id: cta
    label: CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1080, fill: { type: solid, color: "$primary" }, opacity: 0.9 }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1080, fill: { type: solid, color: "rgba(3,0,28,0.5)" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "4/4" }
        style: { font_family: $mono, font_size: 18, color: $text }
      - id: heading
        type: text
        z: 11
        x: 60
        y: 380
        width: 960
        height: 0
        content: { type: plain, value: "Save this." }
        style: { font_family: $heading, font_size: 120, font_weight: 800, color: "#FFFFFF", line_height: 1, letter_spacing: -0.03 }
      - id: sub
        type: text
        z: 12
        x: 60
        y: 540
        width: 960
        height: 0
        content: { type: plain, value: "Follow @yourhandle for one playbook a week." }
        style: { font_family: $body, font_size: 28, color: "#F0F0FF", line_height: 1.4 }
      - id: cta-btn
        type: rect
        z: 13
        x: 60
        y: 660
        width: 280
        height: 64
        radius: 32
        fill: { type: solid, color: "#FFFFFF" }
      - id: cta-text
        type: text
        z: 14
        x: 60
        y: 678
        width: 280
        height: 0
        content: { type: plain, value: "Follow →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#03001C", text_align: center }
      - id: handle
        type: text
        z: 15
        x: 60
        y: 1000
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }

slots:
  - { id: cover_title,    path: "pages[0].layers[3].content.value", type: text, hint: "Cover headline",      default: "How to launch a product\nin under a week" }
  - { id: cover_tagline,  path: "pages[0].layers[4].content.value", type: text, hint: "Cover tagline",       default: "Swipe → for the playbook." }
  - { id: cover_handle,   path: "pages[0].layers[5].content.value", type: text, hint: "Your handle",         default: "@yourhandle" }
  - { id: problem_title,  path: "pages[1].layers[3].content.value", type: text, hint: "Problem statement",   default: "Most launches stall before they ship." }
  - { id: solution_title, path: "pages[2].layers[3].content.value", type: text, hint: "Solution statement",  default: "A 5-day path from idea to live." }
  - { id: cta_heading,    path: "pages[3].layers[3].content.value", type: text, hint: "CTA heading",         default: "Save this." }
  - { id: cta_sub,        path: "pages[3].layers[4].content.value", type: text, hint: "CTA subline",         default: "Follow @yourhandle for one playbook a week." }
  - { id: cta_handle,     path: "pages[3].layers[7].content.value", type: text, hint: "Footer handle",       default: "@yourhandle" }
