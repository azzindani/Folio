      - { id: grid-1, type: rect, z: 22, x: 180, y: 600, width: 920, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
      - { id: grid-2, type: rect, z: 22, x: 180, y: 720, width: 920, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
      - { id: grid-3, type: rect, z: 22, x: 180, y: 840, width: 920, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
      - { id: grid-4, type: rect, z: 22, x: 180, y: 960, width: 920, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
