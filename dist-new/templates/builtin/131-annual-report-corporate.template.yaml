      - { id: bar-25, type: rect, z: 30, x: 900, y: 580, width: 120, height: 500, fill: { type: solid, color: "$primary" } }
      - { id: bar-21-val, type: text, z: 31, x: 260, y: 880, width: 120, height: 0, content: { type: plain, value: "$2.41" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $text, text_align: center } }
      - { id: bar-22-val, type: text, z: 31, x: 420, y: 820, width: 120, height: 0, content: { type: plain, value: "$2.94" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $text, text_align: center } }
      - { id: bar-23-val, type: text, z: 31, x: 580, y: 740, width: 120, height: 0, content: { type: plain, value: "$3.62" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $text, text_align: center } }
      - { id: bar-24-val, type: text, z: 31, x: 740, y: 640, width: 120, height: 0, content: { type: plain, value: "$4.21" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $text, text_align: center } }
      - { id: bar-25-val, type: text, z: 31, x: 900, y: 540, width: 120, height: 0, content: { type: plain, value: "$4.82" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $primary, text_align: center } }
