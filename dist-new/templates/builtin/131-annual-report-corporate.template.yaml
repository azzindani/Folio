      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "03 · REVENUE TRAJECTORY" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Five years of consistent growth." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: chart-card, type: rect, z: 20, x: 100, y: 360, width: 1040, height: 800, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
