_protocol: template/v1

# 12-page corporate annual report — 1240×1754 A4 portrait, corporate-slate theme.
# Cover → CEO letter → financial highlights → revenue chart → P&L → balance
# sheet → segments → strategic priorities → sustainability → governance →
# outlook → contact/colophon.
meta:
  id: tmpl-annual-report-corporate
  name: Annual Report · Corporate (12 pages)
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, annual, corporate, finance, slate, a4]
  description: "Twelve-page corporate annual report covering CEO letter, financial highlights, P&L, balance sheet, segments, strategy, sustainability, governance, and outlook."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Page 1 · Cover ──────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: logo-mark, type: text, z: 10, x: 100, y: 110, width: 800, height: 0, content: { type: plain, value: "◆ MERIDIAN CAPITAL" }, style: { font_family: $heading, font_size: 22, font_weight: 800, color: "$text", letter_spacing: 0.4, text_transform: uppercase } }
      - { id: year-mark, type: text, z: 11, x: 1020, y: 113, width: 120, height: 0, content: { type: plain, value: "2025" }, style: { font_family: $mono, font_size: 20, font_weight: 600, color: "$text_muted", text_align: right, letter_spacing: 0.2 } }
      - { id: rule-top, type: rect, z: 12, x: 100, y: 172, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: rule-tick, type: rect, z: 13, x: 100, y: 169, width: 150, height: 6, fill: { type: solid, color: "$primary" } }
      - { id: kicker, type: text, z: 14, x: 100, y: 540, width: 1040, height: 0, content: { type: plain, value: "ANNUAL REPORT — FISCAL YEAR 2025" }, style: { font_family: $mono, font_size: 18, font_weight: 600, color: "$primary", letter_spacing: 1 } }
      - { id: title, type: text, z: 15, x: 94, y: 600, width: 1060, height: 0, content: { type: plain, value: "Building durable\nreturns." }, style: { font_family: "Playfair Display", font_size: 124, font_weight: 800, color: "$text", line_height: 0.96, letter_spacing: -0.02 } }
      - { id: subtitle, type: text, z: 16, x: 100, y: 902, width: 880, height: 0, content: { type: plain, value: "Fiscal year 2025 results & shareholder review" }, style: { font_family: $body, font_size: 24, color: "$text_muted", line_height: 1.4 } }
      - { id: lower-kicker, type: text, z: 20, x: 100, y: 1090, width: 1040, height: 0, content: { type: plain, value: "AT A GLANCE" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 1 } }
      - { id: divider, type: rect, z: 21, x: 100, y: 1130, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: hl-1-label, type: text, z: 22, x: 100, y: 1170, width: 320, height: 0, content: { type: plain, value: "REVENUE" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.6 } }
      - { id: hl-1-val, type: text, z: 23, x: 100, y: 1200, width: 320, height: 0, content: { type: plain, value: "$4.82B" }, style: { font_family: "Playfair Display", font_size: 56, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.02 } }
      - { id: hl-1-delta, type: text, z: 24, x: 100, y: 1275, width: 320, height: 0, content: { type: plain, value: "↑ 14.6% YoY" }, style: { font_family: $mono, font_size: 15, font_weight: 600, color: $primary } }
      - { id: hl-2-label, type: text, z: 22, x: 460, y: 1170, width: 320, height: 0, content: { type: plain, value: "OPERATING INCOME" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.6 } }
      - { id: hl-2-val, type: text, z: 23, x: 460, y: 1200, width: 320, height: 0, content: { type: plain, value: "$1.14B" }, style: { font_family: "Playfair Display", font_size: 56, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.02 } }
      - { id: hl-2-delta, type: text, z: 24, x: 460, y: 1275, width: 320, height: 0, content: { type: plain, value: "↑ 22.1% YoY" }, style: { font_family: $mono, font_size: 15, font_weight: 600, color: $primary } }
      - { id: hl-3-label, type: text, z: 22, x: 820, y: 1170, width: 320, height: 0, content: { type: plain, value: "EPS (diluted)" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.6 } }
      - { id: hl-3-val, type: text, z: 23, x: 820, y: 1200, width: 320, height: 0, content: { type: plain, value: "$6.74" }, style: { font_family: "Playfair Display", font_size: 56, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.02 } }
      - { id: hl-3-delta, type: text, z: 24, x: 820, y: 1275, width: 320, height: 0, content: { type: plain, value: "↑ 18.9% YoY" }, style: { font_family: $mono, font_size: 15, font_weight: 600, color: $primary } }
      - { id: foot-divider, type: rect, z: 30, x: 100, y: 1600, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: nyse, type: text, z: 31, x: 100, y: 1640, width: 600, height: 0, content: { type: plain, value: "NYSE: MERC · Fiscal year ending December 31, 2025" }, style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pn, type: text, z: 32, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "01 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

  # ── Page 2 · CEO Letter ─────────────────────────────────────
  - id: ceo-letter
    label: CEO Letter
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "01 · LETTER FROM THE CEO" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "To our shareholders," }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 290, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: para-1, type: text, z: 20, x: 100, y: 340, width: 1040, height: 0, content: { type: plain, value: "Fiscal 2025 was a year of disciplined execution. We grew revenue by 14.6% to $4.82B, expanded operating margin by 160 basis points, and returned $612M to shareholders through dividends and buybacks. Each of our four business segments grew double digits, and our enterprise platform business crossed the $1B ARR milestone for the first time." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: para-2, type: text, z: 21, x: 100, y: 560, width: 1040, height: 0, content: { type: plain, value: "Behind these numbers is a deliberate shift toward recurring, software-led revenue. Five years ago, subscription revenue was 31% of our mix. Today it is 58%, with net retention of 119%. Customers buy more from us each year because the platform delivers measurable, compounding value." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: para-3, type: text, z: 22, x: 100, y: 760, width: 1040, height: 0, content: { type: plain, value: "We invested $784M in research and development this year — our largest annual R&D commitment ever — to ship 47 new product capabilities and to migrate the core platform onto our next-generation infrastructure. We expect the benefits of this work to compound through 2026 and beyond." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: para-4, type: text, z: 23, x: 100, y: 940, width: 1040, height: 0, content: { type: plain, value: "We are equally proud of how we operated. We grew headcount by only 4% while revenue grew 14.6%, a direct result of automation and a more focused operating model. Voluntary attrition fell to 7.8%, the lowest in our history, and our engagement scores reached an all-time high of 84%." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: para-5, type: text, z: 24, x: 100, y: 1140, width: 1040, height: 0, content: { type: plain, value: "Looking to 2026, we are guiding to 12-14% revenue growth, 26-28% operating margins, and $1.4-1.5B in free cash flow. We see significant runway in the mid-market, in international expansion, and in our new vertical solutions for healthcare and financial services." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: sign-block, type: rect, z: 30, x: 100, y: 1380, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: sig, type: text, z: 31, x: 100, y: 1420, width: 1040, height: 0, content: { type: plain, value: "Catherine Bauer" }, style: { font_family: $heading, font_size: 32, font_style: italic, color: $text, line_height: 1.1 } }
      - { id: sig-role, type: text, z: 32, x: 100, y: 1480, width: 1040, height: 0, content: { type: plain, value: "Chair & Chief Executive Officer" }, style: { font_family: $body, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: sig-date, type: text, z: 33, x: 100, y: 1510, width: 1040, height: 0, content: { type: plain, value: "February 18, 2026" }, style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pn, type: text, z: 40, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "02 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

  # ── Page 3 · Financial Highlights ───────────────────────────
  - id: highlights
    label: Financial Highlights
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "02 · FINANCIAL HIGHLIGHTS" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "A year of double-digit growth across every line." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: m1-card, type: rect, z: 20, x: 100, y: 380, width: 500, height: 300, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: m1-label, type: text, z: 21, x: 140, y: 420, width: 420, height: 0, content: { type: plain, value: "TOTAL REVENUE" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: m1-val, type: text, z: 22, x: 140, y: 460, width: 420, height: 0, content: { type: plain, value: "$4.82B" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.03 } }
      - { id: m1-delta, type: text, z: 23, x: 140, y: 580, width: 420, height: 0, content: { type: plain, value: "↑ 14.6% YoY ($4.21B in 2024)" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.5 } }
      - { id: m1-sub, type: text, z: 24, x: 140, y: 620, width: 420, height: 0, content: { type: plain, value: "Subscription revenue grew 22% to $2.79B." }, style: { font_family: $body, font_size: 14, color: $text_muted, line_height: 1.5 } }
      - { id: m2-card, type: rect, z: 20, x: 640, y: 380, width: 500, height: 300, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: m2-label, type: text, z: 21, x: 680, y: 420, width: 420, height: 0, content: { type: plain, value: "OPERATING MARGIN" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: m2-val, type: text, z: 22, x: 680, y: 460, width: 420, height: 0, content: { type: plain, value: "23.6%" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 } }
      - { id: m2-delta, type: text, z: 23, x: 680, y: 580, width: 420, height: 0, content: { type: plain, value: "↑ 160 bps YoY (22.0% in 2024)" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.5 } }
      - { id: m2-sub, type: text, z: 24, x: 680, y: 620, width: 420, height: 0, content: { type: plain, value: "Driven by mix shift and platform leverage." }, style: { font_family: $body, font_size: 14, color: $text_muted, line_height: 1.5 } }
      - { id: m3-card, type: rect, z: 20, x: 100, y: 720, width: 500, height: 300, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: m3-label, type: text, z: 21, x: 140, y: 760, width: 420, height: 0, content: { type: plain, value: "FREE CASH FLOW" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: m3-val, type: text, z: 22, x: 140, y: 800, width: 420, height: 0, content: { type: plain, value: "$1.21B" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.03 } }
      - { id: m3-delta, type: text, z: 23, x: 140, y: 920, width: 420, height: 0, content: { type: plain, value: "↑ 19.4% YoY · 25.1% of revenue" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.5 } }
      - { id: m3-sub, type: text, z: 24, x: 140, y: 960, width: 420, height: 0, content: { type: plain, value: "$612M returned to shareholders this year." }, style: { font_family: $body, font_size: 14, color: $text_muted, line_height: 1.5 } }
      - { id: m4-card, type: rect, z: 20, x: 640, y: 720, width: 500, height: 300, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: m4-label, type: text, z: 21, x: 680, y: 760, width: 420, height: 0, content: { type: plain, value: "NET RETENTION" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: m4-val, type: text, z: 22, x: 680, y: 800, width: 420, height: 0, content: { type: plain, value: "119%" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 } }
      - { id: m4-delta, type: text, z: 23, x: 680, y: 920, width: 420, height: 0, content: { type: plain, value: "Best-in-class for enterprise software." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.5 } }
      - { id: m4-sub, type: text, z: 24, x: 680, y: 960, width: 420, height: 0, content: { type: plain, value: "Gross retention held steady at 96%." }, style: { font_family: $body, font_size: 14, color: $text_muted, line_height: 1.5 } }
      - { id: footnote, type: text, z: 30, x: 100, y: 1100, width: 1040, height: 0, content: { type: plain, value: "All figures USD, FY ending Dec 31. Comparable to GAAP unless otherwise noted. See pages 5-6 for full statements." }, style: { font_family: $body, font_size: 13, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: pn, type: text, z: 40, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "03 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

