_protocol: template/v1

# Professional services invoice — 1240×1754 A4 portrait, corporate-slate.
# Header with logo + meta, bill-to / ship-to columns, 8-row line items
# (description | hours | rate | subtotal), subtotal + tax + total stack,
# payment terms + methods.
meta:
  id: tmpl-pro-invoice
  name: Professional Services Invoice
  type: invoice
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [invoice, professional, services, billing, a4, corporate, finance]
  description: "Professional services A4 invoice with logo header, bill-to/ship-to columns, 8-row line items, totals, and payment methods."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  # 0 — bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
  # 1 — top accent band
  - { id: top-accent, type: rect, z: 1, x: 0, y: 0, width: 1240, height: 12, fill: { type: solid, color: "$primary" } }
  # 2 — logo box
  - { id: logo-box, type: rect, z: 2, x: 80, y: 70, width: 64, height: 64, radius: 10, fill: { type: solid, color: "$primary" } }
  # 3 — logo letter
  - { id: logo-letter, type: text, z: 3, x: 80, y: 80, width: 64, height: 0, content: { type: plain, value: "F" }, style: { font_family: $heading, font_size: 36, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1.2 } }
  # 4 — company name
  - { id: company-name, type: text, z: 4, x: 168, y: 78, width: 600, height: 0, content: { type: plain, value: "Folio Strategy Group LLC" }, style: { font_family: $heading, font_size: 26, font_weight: 800, color: "$text", line_height: 1.2 } }
  # 5 — company tagline
  - { id: company-tag, type: text, z: 5, x: 168, y: 112, width: 600, height: 0, content: { type: plain, value: "Management consulting · 488 Mission St, San Francisco" }, style: { font_family: $body, font_size: 13, color: "$text_muted", line_height: 1.4 } }
  # 6 — invoice title
  - { id: inv-title, type: text, z: 10, x: 760, y: 70, width: 400, height: 0, content: { type: plain, value: "INVOICE" }, style: { font_family: $heading, font_size: 44, font_weight: 800, color: "$primary", letter_spacing: 0.4, text_align: right, text_transform: uppercase, line_height: 1 } }
  # 7 — invoice number
  - { id: inv-num, type: text, z: 11, x: 760, y: 130, width: 400, height: 0, content: { type: plain, value: "FSG-2026-1142" }, style: { font_family: $mono, font_size: 18, font_weight: 600, color: "$text", text_align: right, line_height: 1.4 } }
  # 8 — divider
  - { id: top-div, type: rect, z: 12, x: 80, y: 200, width: 1080, height: 1, fill: { type: solid, color: "$border" } }
  # 9 — issued label
  - { id: issued-lab, type: text, z: 20, x: 80, y: 220, width: 200, height: 0, content: { type: plain, value: "ISSUED" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 10 — issued val
  - { id: issued-val, type: text, z: 21, x: 80, y: 240, width: 200, height: 0, content: { type: plain, value: "May 17, 2026" }, style: { font_family: $mono, font_size: 14, color: "$text" } }
  # 11 — due label
  - { id: due-lab, type: text, z: 22, x: 320, y: 220, width: 200, height: 0, content: { type: plain, value: "DUE" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
