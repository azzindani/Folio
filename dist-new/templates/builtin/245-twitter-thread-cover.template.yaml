_protocol: template/v1

# Twitter thread cover — 1200×675 landscape, editorial-cream theme.
# "🧵 THREAD" eyebrow, large headline, 5 numbered teaser bullets,
# and a "Read full thread →" footer cue.
meta:
  id: tmpl-twitter-thread-cover
  name: Twitter Thread Cover
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, twitter, x, thread, editorial, landscape, cream]
  description: "Twitter/X thread cover with eyebrow, headline, five teaser bullets, and read-more footer."

document:
  width: 1200
  height: 675
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 675
    fill: { type: solid, color: "$background" }

  # ── Left rule decoration ──────────────────────────────────
  - id: left-rule
    type: rect
    z: 1
    x: 60
    y: 60
    width: 4
    height: 555
    fill: { type: solid, color: "$primary" }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 5
    x: 90
    y: 60
    width: 600
    height: 0
    content: { type: plain, value: "🧵 THREAD" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  # ── Title ─────────────────────────────────────────────────
  - id: title
    type: text
    z: 10
    x: 90
    y: 100
    width: 1060
    height: 0
    content: { type: plain, value: "5 hard lessons from\nscaling a startup to 1M users" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 700
      color: $text
      line_height: 1.12
      letter_spacing: -0.02

  # ── Body bullets ──────────────────────────────────────────
  - id: bullet-1
    type: text
    z: 20
    x: 90
    y: 290
    width: 1060
    height: 0
    content: { type: plain, value: "1.  Hire generalists before specialists" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  - id: bullet-2
    type: text
    z: 21
    x: 90
    y: 340
    width: 1060
    height: 0
    content: { type: plain, value: "2.  Cache aggressively, invalidate carefully" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  - id: bullet-3
    type: text
    z: 22
    x: 90
    y: 390
    width: 1060
    height: 0
    content: { type: plain, value: "3.  Document decisions, not just code" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  - id: bullet-4
    type: text
    z: 23
    x: 90
    y: 440
    width: 1060
    height: 0
    content: { type: plain, value: "4.  Pricing is product. Iterate on it." }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  - id: bullet-5
    type: text
    z: 24
    x: 90
    y: 490
    width: 1060
    height: 0
    content: { type: plain, value: "5.  Default to async. Meetings are interest payments." }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  # ── Footer divider ────────────────────────────────────────
  - id: footer-divider
    type: rect
    z: 30
    x: 90
    y: 580
    width: 1020
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Footer CTA ────────────────────────────────────────────
  - id: footer-cta
    type: text
    z: 31
    x: 90
    y: 605
    width: 800
    height: 0
    content: { type: plain, value: "Read full thread  →" }
    style:
      font_family: $heading
      font_size: 20
      font_weight: 700
      color: $primary
      line_height: 1.3

  - id: footer-handle
    type: text
    z: 32
    x: 890
    y: 608
    width: 220
    height: 0
    content: { type: plain, value: "@buildbetter" }
    style:
      font_family: $mono
      font_size: 16
      color: $text_muted
      text_align: right
      line_height: 1.3

slots:
  - { id: title,    path: "layers[3].content.value", type: text, hint: "Thread headline",  default: "5 hard lessons from\nscaling a startup to 1M users" }
  - { id: point_1,  path: "layers[4].content.value", type: text, hint: "Teaser point 1",   default: "1.  Hire generalists before specialists" }
  - { id: point_2,  path: "layers[5].content.value", type: text, hint: "Teaser point 2",   default: "2.  Cache aggressively, invalidate carefully" }
  - { id: point_3,  path: "layers[6].content.value", type: text, hint: "Teaser point 3",   default: "3.  Document decisions, not just code" }
  - { id: point_4,  path: "layers[7].content.value", type: text, hint: "Teaser point 4",   default: "4.  Pricing is product. Iterate on it." }
  - { id: point_5,  path: "layers[8].content.value", type: text, hint: "Teaser point 5",   default: "5.  Default to async. Meetings are interest payments." }
