_protocol: template/v1

# Fashion lookbook editorial page — 3:4 portrait (1080×1440).
# Brand mark top, season label, big outfit photo, 3 product callout rows,
# vertical side stripe, page number bottom-corner.
meta:
  id: tmpl-lookbook-page
  name: Lookbook Page
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, lookbook, fashion, editorial, cream, portrait]

document:
  width: 1080
  height: 1440
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 — background
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1440
    fill: { type: solid, color: "$background" }

  # 1 — vertical side stripe (left)
  - id: side-stripe
    type: rect
    z: 1
    x: 0
    y: 0
    width: 12
    height: 1440
    fill: { type: solid, color: "$primary" }

  # 2 — top brand mark (small wordmark)
  - id: brand-mark
    type: text
    z: 5
    x: 60
    y: 60
    width: 480
    height: 0
    content: { type: plain, value: "MAISON FOLIO" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: $text
      letter_spacing: 0.32
      text_transform: uppercase

  # 3 — season label (top-right)
  - id: season
    type: text
    z: 5
    x: 600
    y: 64
    width: 420
    height: 0
    content: { type: plain, value: "FALL 2026" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_transform: uppercase
      text_align: right

  # 4 — thin rule under brand bar
  - id: top-rule
    type: rect
    z: 4
    x: 60
    y: 120
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # 5 — outfit title (just above photo)
  - id: outfit-title
    type: text
    z: 6
    x: 60
    y: 160
    width: 960
    height: 0
    content: { type: plain, value: "Look 04 — Atelier Wool" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 700
      color: $text
      line_height: 1.1
      letter_spacing: -0.018
      font_style: italic

  # 6 — main outfit photo placeholder (3:4 inside)
  - id: outfit-photo
    type: rect
    z: 10
    x: 60
    y: 240
    width: 640
    height: 850
    radius: 8
    fill: { type: solid, color: $surface }
  # 7 — outfit photo glyph
  - id: outfit-glyph
    type: text
    z: 11
    x: 60
    y: 460
    width: 640
    height: 0
    content: { type: plain, value: "👗" }
    style:
      font_family: $heading
      font_size: 320
      color: $text_muted
      text_align: center
      opacity: 0.6

  # ── product callout 1 ──
  # 8 — product 1 photo placeholder
  - id: p1-photo
    type: rect
    z: 15
    x: 740
    y: 240
    width: 100
    height: 130
    radius: 6
    fill: { type: solid, color: "$surface2" }

  # 9 — product 1 name
  - id: p1-name
    type: text
    z: 16
    x: 860
    y: 256
    width: 180
    height: 0
    content: { type: plain, value: "Cashmere coat" }
    style:
      font_family: $heading
      font_size: 18
      font_weight: 600
      color: $text
      line_height: 1.25

  # 10 — product 1 price
  - id: p1-price
    type: text
    z: 17
    x: 860
    y: 318
    width: 180
    height: 0
    content: { type: plain, value: "€ 1,240" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary

  # ── product callout 2 ──
  # 11 — product 2 photo placeholder
  - id: p2-photo
    type: rect
    z: 15
    x: 740
    y: 400
    width: 100
    height: 130
    radius: 6
    fill: { type: solid, color: "$surface2" }

  # 12 — product 2 name
  - id: p2-name
    type: text
    z: 16
    x: 860
    y: 416
    width: 180
    height: 0
    content: { type: plain, value: "Wool trousers" }
    style:
      font_family: $heading
      font_size: 18
      font_weight: 600
      color: $text
      line_height: 1.25

  # 13 — product 2 price
  - id: p2-price
    type: text
    z: 17
    x: 860
    y: 478
    width: 180
    height: 0
    content: { type: plain, value: "€ 480" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary

  # ── product callout 3 ──
  # 14 — product 3 photo placeholder
  - id: p3-photo
    type: rect
    z: 15
    x: 740
    y: 560
    width: 100
    height: 130
    radius: 6
    fill: { type: solid, color: "$surface2" }

  # 15 — product 3 name
  - id: p3-name
    type: text
    z: 16
    x: 860
    y: 576
    width: 180
    height: 0
    content: { type: plain, value: "Leather oxford" }
    style:
      font_family: $heading
      font_size: 18
      font_weight: 600
      color: $text
      line_height: 1.25

  # 16 — product 3 price
  - id: p3-price
    type: text
    z: 17
    x: 860
    y: 638
    width: 180
    height: 0
    content: { type: plain, value: "€ 360" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary

  # 17 — divider rule under callouts
  - id: callout-rule
    type: rect
    z: 18
    x: 740
    y: 720
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  # 18 — total annotation
  - id: callout-meta
    type: text
    z: 19
    x: 740
    y: 740
    width: 280
    height: 0
    content: { type: plain, value: "STYLED BY THE EDITORS" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

  # 19 — pull-quote (italic, under callouts)
  - id: pull-quote
    type: text
    z: 20
    x: 740
    y: 800
    width: 280
    height: 0
    content: { type: plain, value: "A study in restraint — wool the colour of stone, cut close." }
    style:
      font_family: $heading
      font_size: 17
      font_style: italic
      color: $text
      line_height: 1.4

  # 20 — bottom rule
  - id: bottom-rule
    type: rect
    z: 25
    x: 60
    y: 1340
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # 21 — page number (bottom-right corner)
  - id: page-number
    type: text
    z: 26
    x: 60
    y: 1360
    width: 960
    height: 0
    content: { type: plain, value: "04 / 32" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.16
      text_align: right

  # 22 — footer caption (bottom-left)
  - id: footer-caption
    type: text
    z: 26
    x: 60
    y: 1360
    width: 480
    height: 0
    content: { type: plain, value: "MAISON FOLIO · LOOKBOOK" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.28
      text_transform: uppercase

  # 23 — small accent dot (corner detail)
  - id: corner-dot
    type: circle
    z: 27
    cx: 1020
    cy: 1395
    rx: 5
    ry: 5
    fill: { type: solid, color: "$primary" }

  # 24 — subtle section label, vertical, mid-right
  - id: section-vertical
    type: text
    z: 8
    x: 1020
    y: 660
    width: 60
    height: 0
    content: { type: plain, value: "VOL · IV" }
    style:
      font_family: $mono
      font_size: 11
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_align: center

slots:
  - { id: season,         path: "layers[3].content.value",  type: text, hint: "Season label",          default: "FALL 2026" }
  - { id: outfit_title,   path: "layers[5].content.value",  type: text, hint: "Outfit / look title",   default: "Look 04 — Atelier Wool" }
  - { id: product1_name,  path: "layers[9].content.value",  type: text, hint: "Product 1 name",        default: "Cashmere coat" }
  - { id: product1_price, path: "layers[10].content.value", type: text, hint: "Product 1 price",       default: "€ 1,240" }
  - { id: product2_name,  path: "layers[12].content.value", type: text, hint: "Product 2 name",        default: "Wool trousers" }
  - { id: product2_price, path: "layers[13].content.value", type: text, hint: "Product 2 price",       default: "€ 480" }
  - { id: product3_name,  path: "layers[15].content.value", type: text, hint: "Product 3 name",        default: "Leather oxford" }
  - { id: product3_price, path: "layers[16].content.value", type: text, hint: "Product 3 price",       default: "€ 360" }
  - { id: page_number,    path: "layers[21].content.value", type: text, hint: "Page number",           default: "04 / 32" }
