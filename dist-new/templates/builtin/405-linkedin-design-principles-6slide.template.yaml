_protocol: template/v1

# LinkedIn carousel — 6-slide design principles.
# Pastel-dream theme, 1080×1350.
meta:
  id: tmpl-linkedin-design-principles-6slide
  name: LinkedIn Design Principles (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, design, ux, principles, "4-5"]
  description: "Cover + intro + 5 principles (each with good/bad visual) + CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

pages:
  # ── Slide 1 · Cover ─────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "1 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 500, width: 960, height: 0, content: { type: plain, value: "DESIGN · FUNDAMENTALS" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 560, width: 960, height: 0, content: { type: plain, value: "6 Design Principles\nI Wish I'd Learned\nSooner." }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 980, width: 960, height: 0, content: { type: plain, value: "Each one will make your UI sharper. Swipe →" }, style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.4 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 2 · 01 Hierarchy ──────────────────────────────
  - id: hierarchy
    label: 01 Hierarchy
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "2 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: principle, type: text, z: 12, x: 60, y: 290, width: 960, height: 0, content: { type: plain, value: "Hierarchy" }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule, type: text, z: 13, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "If everything is bold, nothing is bold. Pick ONE thing per screen to scream." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 } }
      - { id: bad-label, type: text, z: 20, x: 60, y: 720, width: 480, height: 0, content: { type: plain, value: "✗ DON'T" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: bad-rect-1, type: rect, z: 21, x: 60, y: 760, width: 400, height: 60, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: bad-rect-2, type: rect, z: 22, x: 60, y: 840, width: 400, height: 60, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: bad-rect-3, type: rect, z: 23, x: 60, y: 920, width: 400, height: 60, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: good-label, type: text, z: 30, x: 580, y: 720, width: 480, height: 0, content: { type: plain, value: "✓ DO" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: good-rect-1, type: rect, z: 31, x: 580, y: 760, width: 400, height: 100, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: good-rect-2, type: rect, z: 32, x: 580, y: 880, width: 400, height: 40, radius: 8, fill: { type: solid, color: "$surface" } }
      - { id: good-rect-3, type: rect, z: 33, x: 580, y: 940, width: 400, height: 40, radius: 8, fill: { type: solid, color: "$surface" } }
      - { id: handle, type: text, z: 40, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 3 · 02 Whitespace ─────────────────────────────
  - id: whitespace
    label: 02 Whitespace
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "3 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: principle, type: text, z: 12, x: 60, y: 290, width: 960, height: 0, content: { type: plain, value: "Whitespace" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule, type: text, z: 13, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "Space is not absence — it's structure. Double your padding once and see." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 } }
      - { id: bad-label, type: text, z: 20, x: 60, y: 720, width: 480, height: 0, content: { type: plain, value: "✗ DON'T" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: bad-card, type: rect, z: 21, x: 60, y: 760, width: 400, height: 220, radius: 0, fill: { type: solid, color: "$surface" } }
      - { id: bad-inner-1, type: rect, z: 22, x: 76, y: 776, width: 368, height: 60, radius: 4, fill: { type: solid, color: "$primary" } }
      - { id: bad-inner-2, type: rect, z: 23, x: 76, y: 844, width: 368, height: 60, radius: 4, fill: { type: solid, color: "$primary" } }
      - { id: bad-inner-3, type: rect, z: 24, x: 76, y: 912, width: 368, height: 60, radius: 4, fill: { type: solid, color: "$primary" } }
      - { id: good-label, type: text, z: 30, x: 580, y: 720, width: 480, height: 0, content: { type: plain, value: "✓ DO" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: good-card, type: rect, z: 31, x: 580, y: 760, width: 400, height: 220, radius: 0, fill: { type: solid, color: "$surface" } }
      - { id: good-inner-1, type: rect, z: 32, x: 620, y: 800, width: 320, height: 36, radius: 4, fill: { type: solid, color: "$primary" } }
      - { id: good-inner-2, type: rect, z: 33, x: 620, y: 900, width: 320, height: 36, radius: 4, fill: { type: solid, color: "$primary" } }
      - { id: handle, type: text, z: 40, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 4 · 03 Contrast ───────────────────────────────
  - id: contrast
    label: 03 Contrast
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "4 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: principle, type: text, z: 12, x: 60, y: 290, width: 960, height: 0, content: { type: plain, value: "Contrast" }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule, type: text, z: 13, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "Use color to direct the eye, not to decorate. WCAG AA = 4.5:1 minimum." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 } }
      - { id: bad-label, type: text, z: 20, x: 60, y: 720, width: 480, height: 0, content: { type: plain, value: "✗ DON'T" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: bad-bg, type: rect, z: 21, x: 60, y: 760, width: 400, height: 220, radius: 0, fill: { type: solid, color: "$surface" } }
      - { id: bad-cta, type: rect, z: 22, x: 100, y: 840, width: 320, height: 60, radius: 30, fill: { type: solid, color: "#D0D5DD" } }
      - { id: good-label, type: text, z: 30, x: 580, y: 720, width: 480, height: 0, content: { type: plain, value: "✓ DO" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: good-bg, type: rect, z: 31, x: 580, y: 760, width: 400, height: 220, radius: 0, fill: { type: solid, color: "$surface" } }
      - { id: good-cta, type: rect, z: 32, x: 620, y: 840, width: 320, height: 60, radius: 30, fill: { type: solid, color: "$primary" } }
      - { id: handle, type: text, z: 40, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 5 · 04 Consistency ────────────────────────────
  - id: consistency
    label: 04 Consistency
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "5 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "04" }, style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: principle, type: text, z: 12, x: 60, y: 290, width: 960, height: 0, content: { type: plain, value: "Consistency" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule, type: text, z: 13, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "A token system beats clever exceptions. Same button = same height, same radius, every time." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.45 } }
      - { id: bad-label, type: text, z: 20, x: 60, y: 720, width: 480, height: 0, content: { type: plain, value: "✗ DON'T" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: bad-btn-1, type: rect, z: 21, x: 60, y: 760, width: 180, height: 56, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: bad-btn-2, type: rect, z: 22, x: 260, y: 770, width: 200, height: 44, radius: 22, fill: { type: solid, color: "$primary" } }
      - { id: bad-btn-3, type: rect, z: 23, x: 60, y: 840, width: 220, height: 64, radius: 4, fill: { type: solid, color: "$primary" } }
      - { id: good-label, type: text, z: 30, x: 580, y: 720, width: 480, height: 0, content: { type: plain, value: "✓ DO" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: good-btn-1, type: rect, z: 31, x: 580, y: 760, width: 180, height: 48, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: good-btn-2, type: rect, z: 32, x: 780, y: 760, width: 180, height: 48, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: good-btn-3, type: rect, z: 33, x: 580, y: 830, width: 180, height: 48, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: handle, type: text, z: 40, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 6 · 05 Feedback + CTA ─────────────────────────
  - id: feedback-cta
    label: 05 Feedback + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $primary } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(40,30,60,0.45)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "6 / 6" }, style: { font_family: $mono, font_size: 18, color: "#FFFFFF" } }
      - { id: section-num, type: text, z: 11, x: 60, y: 140, width: 960, height: 0, content: { type: plain, value: "05" }, style: { font_family: $heading, font_size: 88, font_weight: 900, color: "$accent", line_height: 1.0, letter_spacing: -0.05 } }
      - { id: principle, type: text, z: 12, x: 60, y: 250, width: 960, height: 0, content: { type: plain, value: "Feedback" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule, type: text, z: 13, x: 60, y: 390, width: 960, height: 0, content: { type: plain, value: "Every action needs a reaction within 100ms. No feedback = broken software, even when it isn't." }, style: { font_family: $body, font_size: 22, color: "#F0F0FF", line_height: 1.45 } }
      - { id: cta-heading, type: text, z: 30, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "Save → ship\nsharper UI." }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: cta-btn, type: rect, z: 31, x: 60, y: 1090, width: 320, height: 68, radius: 34, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 32, x: 60, y: 1110, width: 320, height: 0, content: { type: plain, value: "Follow →" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$primary", text_align: center } }
      - { id: handle, type: text, z: 33, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF" } }

slots:
  - { id: cover_title,      path: "pages[0].layers[4].content.value",  type: text, hint: "Cover headline",     default: "6 Design Principles\nI Wish I'd Learned\nSooner." }
  - { id: cover_tagline,    path: "pages[0].layers[5].content.value",  type: text, hint: "Cover tagline",      default: "Each one will make your UI sharper. Swipe →" }
  - { id: principle_1_rule, path: "pages[1].layers[5].content.value",  type: text, hint: "Hierarchy rule",     default: "If everything is bold, nothing is bold. Pick ONE thing per screen to scream." }
  - { id: principle_2_rule, path: "pages[2].layers[5].content.value",  type: text, hint: "Whitespace rule",    default: "Space is not absence — it's structure. Double your padding once and see." }
  - { id: principle_3_rule, path: "pages[3].layers[5].content.value",  type: text, hint: "Contrast rule",      default: "Use color to direct the eye, not to decorate. WCAG AA = 4.5:1 minimum." }
  - { id: principle_4_rule, path: "pages[4].layers[5].content.value",  type: text, hint: "Consistency rule",   default: "A token system beats clever exceptions. Same button = same height, same radius, every time." }
  - { id: principle_5_rule, path: "pages[5].layers[6].content.value",  type: text, hint: "Feedback rule",      default: "Every action needs a reaction within 100ms. No feedback = broken software, even when it isn't." }
  - { id: cta_heading,      path: "pages[5].layers[7].content.value",  type: text, hint: "CTA heading",        default: "Save → ship\nsharper UI." }
