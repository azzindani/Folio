_protocol: template/v1

# Dataset release announcement. LinkedIn 4:5 portrait.
# Display name, 2x2 stat cards, schema rows, source paragraph, CTA chip.
meta:
  id: tmpl-dataset-card-poster
  name: Dataset Card Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, ml, ai, dataset-card, data, portrait, 4-5]
  description: "LinkedIn 4:5 dataset release announcement with stat grid, schema rows, and a download CTA."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: forest-deep

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "DATASET · OPEN ACCESS" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: dataset-name
    type: text
    z: 21
    x: 80
    y: 180
    width: 1040
    height: 0
    content: { type: plain, value: "OpenOrca-3M" }
    style:
      font_family: $heading
      font_size: 108
      font_weight: 900
      color: $text
      line_height: 0.95
      letter_spacing: -0.03

  - id: subtitle
    type: text
    z: 22
    x: 80
    y: 320
    width: 1040
    height: 0
    content: { type: plain, value: "Augmented FLAN-style instruction corpus with chain-of-thought traces." }
    style:
      font_family: $body
      font_size: 24
      color: $text_muted
      line_height: 1.45

  - id: stat-1-bg
    type: rect
    z: 30
    x: 80
    y: 410
    width: 510
    height: 170
    radius: 12
    fill: { type: solid, color: "$surface" }

  - id: stat-1-label
    type: text
    z: 31
    x: 108
    y: 432
    width: 460
    height: 0
    content: { type: plain, value: "EXAMPLES" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: stat-1-value
    type: text
    z: 32
    x: 108
    y: 462
    width: 460
    height: 0
    content: { type: plain, value: "3.1M" }
