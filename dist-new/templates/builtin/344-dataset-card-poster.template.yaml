animations:
  dataset-name:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  subtitle:
    enter: { type: fade_up, duration: 600, delay: 250, easing: ease-out }
  stat-1-bg:
    enter: { type: slide_up, duration: 600, delay: 400, easing: ease-out }
  stat-2-bg:
    enter: { type: slide_up, duration: 600, delay: 500, easing: ease-out }
  stat-3-bg:
    enter: { type: slide_up, duration: 600, delay: 600, easing: ease-out }
  stat-4-bg:
    enter: { type: slide_up, duration: 600, delay: 700, easing: ease-out }
  cta-bg:
    loop: { type: breathe, duration: 3000, scale: 1.03 }

slots:
  - { id: eyebrow,        path: "layers[2].content.value",  type: text, hint: "Eyebrow tag",          default: "DATASET · OPEN ACCESS" }
  - { id: dataset_name,   path: "layers[3].content.value",  type: text, hint: "Dataset display name", default: "OpenOrca-3M" }
  - { id: subtitle,       path: "layers[4].content.value",  type: text, hint: "One-line description", default: "Augmented FLAN-style instruction corpus with chain-of-thought traces." }
  - { id: stat_examples,  path: "layers[7].content.value",  type: text, hint: "Stat · examples",      default: "3.1M" }
  - { id: stat_languages, path: "layers[11].content.value", type: text, hint: "Stat · languages",     default: "12" }
  - { id: stat_size,      path: "layers[15].content.value", type: text, hint: "Stat · size",          default: "7.4 GB" }
  - { id: stat_license,   path: "layers[19].content.value", type: text, hint: "Stat · license",       default: "CC-BY 4.0" }
  - { id: schema_field_1, path: "layers[23].content.value", type: text, hint: "Schema field 1 name",  default: "instruction" }
  - { id: schema_field_2, path: "layers[27].content.value", type: text, hint: "Schema field 2 name",  default: "response" }
  - { id: schema_field_3, path: "layers[31].content.value", type: text, hint: "Schema field 3 name",  default: "system_prompt" }
  - { id: schema_field_4, path: "layers[35].content.value", type: text, hint: "Schema field 4 name",  default: "lang" }
  - { id: source_body,    path: "layers[39].content.value", type: text, hint: "Source paragraph",     default: "Distilled from GPT-4 completions over the FLAN collection." }
  - { id: cta_text,       path: "layers[41].content.value", type: text, hint: "CTA button label",     default: "↓  Download on Hugging Face" }
  - { id: author,         path: "layers[42].content.value", type: text, hint: "Author handle + date", default: "@open-orca · Released 17 May 2026" }
