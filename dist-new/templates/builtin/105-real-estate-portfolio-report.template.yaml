pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "MERIDIAN CAPITAL · Q2 FY2026 · US PORTFOLIO"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 80
        format: markdown
        font_family: Playfair Display
        font_size: 44
        font_weight: 700
        line_height: 1.1
        content: "**Portfolio Overview — Quarterly**"

      - id: kpi-properties
        type: kpi_card
        x: 60
        y: 180
        width: 224
        height: 140
        label: Properties
        value: 94
        format: number
        delta: 4
        delta_format: number

      - id: kpi-value
        type: kpi_card
        x: 304
        y: 180
        width: 224
        height: 140
        label: Total Value ($M)
        value: 1488.6
        format: number
        decimals: 1
        delta: 6.8
        delta_format: percent

      - id: kpi-occupancy
        type: kpi_card
        x: 548
        y: 180
        width: 224
        height: 140
        label: Occupancy
        value: 91.8
        format: percent
        delta: 1.4
        delta_format: percent

      - id: kpi-caprate
        type: kpi_card
        x: 792
        y: 180
        width: 224
        height: 140
        label: Cap Rate
        value: 6.4
        format: percent
        delta: -0.2
        delta_format: percent

      - id: kpi-noi
        type: kpi_card
        x: 1036
        y: 180
        width: 184
        height: 140
        label: NOI ($M)
        value: 108.4
        format: number
        decimals: 1
        delta: 12.6
        delta_format: percent

      - id: section-types
        type: rich_text
        x: 60
        y: 360
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Property Type Distribution**"

      - id: chart-types
        type: interactive_chart
        x: 60
        y: 420
        width: 560
        height: 380
        chart_type: donut
        data_ref: property_types
        x_field: type
        y_field: value_m
        title: Portfolio Value by Type ($M)
        legend: true
        animate: true

      - id: chart-cashflow
        type: interactive_chart
        x: 660
        y: 420
        width: 560
        height: 380
        chart_type: line
        data_ref: cash_flow
        x_field: month
        y_field: noi_m
        title: Monthly NOI ($M) — Trailing 12 Months
        legend: false
        grid: true
        animate: true

      - id: section-markets
        type: rich_text
        x: 60
        y: 840
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Geographic Breakdown**"

      - id: tbl-markets
        type: interactive_table
        x: 60
        y: 900
        width: 1160
        height: 480
        data_ref: markets
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: market,         title: Market,         width: 360, sortable: true, formatter: badge }
          - { field: properties,     title: Properties,     width: 240, sortable: true, formatter: number, align: right }
          - { field: valuation_m,    title: Valuation ($M), width: 280, sortable: true, formatter: number, align: right }
          - { field: occupancy_pct,  title: Occupancy %,    width: 240, sortable: true, formatter: percent, align: right }

      - id: section-assets
        type: rich_text
        x: 60
        y: 1420
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top 10 Assets**"

      - id: tbl-assets
        type: interactive_table
        x: 60
        y: 1480
        width: 1160
        height: 500
        data_ref: top_assets
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: asset,         title: Asset,        width: 360, sortable: true }
          - { field: type,          title: Type,         width: 180, sortable: true, formatter: badge }
          - { field: value_m,       title: Value ($M),   width: 200, sortable: true, formatter: number, align: right }
          - { field: occupancy_pct, title: Occupancy %,  width: 200, sortable: true, formatter: percent, align: right }
          - { field: noi_m,         title: NOI ($M),     width: 200, sortable: true, formatter: number, align: right }

      - id: section-maintenance
        type: rich_text
        x: 60
        y: 2020
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Maintenance Spending — YTD ($K)**"

      - id: chart-maintenance
        type: interactive_chart
        x: 60
        y: 2080
        width: 1160
        height: 200
        chart_type: bar
        data_ref: maintenance
        x_field: category
        y_field: spend_k
        title: Maintenance Spend by Category ($K)
        legend: false
        grid: true
        animate: true

slots:
  - { id: report_title,        path: "pages[0].layers[1].content",  type: text, hint: "Report title",         default: "**Portfolio Overview — Quarterly**" }
  - { id: report_eyebrow,      path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",         default: "MERIDIAN CAPITAL · Q2 FY2026 · US PORTFOLIO" }
  - { id: types_section,       path: "pages[0].layers[7].content",  type: text, hint: "Type heading",         default: "**Property Type Distribution**" }
  - { id: markets_section,     path: "pages[0].layers[10].content", type: text, hint: "Markets heading",      default: "**Geographic Breakdown**" }
  - { id: assets_section,      path: "pages[0].layers[12].content", type: text, hint: "Assets heading",       default: "**Top 10 Assets**" }
  - { id: maintenance_section, path: "pages[0].layers[14].content", type: text, hint: "Maintenance heading",  default: "**Maintenance Spending — YTD ($K)**" }
