_protocol: template/v1

# Real estate portfolio overview — 5 KPIs (properties, value, occupancy, cap
# rate, NOI), property-type donut, geographic breakdown table, cash-flow
# trend line, top-10 assets table, maintenance spending bar.
meta:
  id: tmpl-real-estate-portfolio-report
  name: Real Estate · Portfolio Overview
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, real-estate, portfolio, finance, occupancy, interactive]
  description: "Real-estate portfolio review: valuation, occupancy, NOI, geographic mix, top assets, maintenance spend."

document:
  width: 1280
  height: 2300
  unit: px
  dpi: 96

theme:
