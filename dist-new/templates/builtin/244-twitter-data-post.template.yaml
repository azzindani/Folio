_protocol: template/v1

# Twitter data/stat post — 1200×675 landscape, indigo-pro theme.
# Hero number dominates the left half; two secondary stats stack on
# the right; supporting context line beneath the hero.
meta:
  id: tmpl-twitter-data-post
  name: Twitter Data Post
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, twitter, x, data, stats, landscape, indigo]
  description: "Twitter/X data post featuring a hero stat, supporting context, and two secondary metrics."

document:
  width: 1200
  height: 675
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 675
    fill: { type: solid, color: "$background" }

  # ── Right-side panel ──────────────────────────────────────
  - id: right-panel
    type: rect
    z: 1
    x: 720
    y: 0
    width: 480
    height: 675
    fill: { type: solid, color: "$surface" }

  # ── Vertical divider ──────────────────────────────────────
  - id: vdiv
    type: rect
    z: 2
    x: 720
    y: 60
    width: 1
    height: 555
    fill: { type: solid, color: "$border" }

  # ── Top accent strip ──────────────────────────────────────
  - id: accent-strip
    type: rect
    z: 3
    x: 60
    y: 60
    width: 60
    height: 4
    radius: 2
    fill: { type: solid, color: "$accent" }

  # ── Eyebrow label ─────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 90
    width: 600
    height: 0
    content: { type: plain, value: "Q1 2026 REPORT" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  # ── Hero number ───────────────────────────────────────────
  - id: hero-number
    type: text
    z: 11
    x: 60
    y: 150
    width: 660
    height: 0
    content: { type: plain, value: "87%" }
    style:
      font_family: $heading
      font_size: 240
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.04

  # ── Hero label ────────────────────────────────────────────
  - id: hero-label
    type: text
    z: 12
    x: 60
    y: 430
    width: 660
    height: 0
    content: { type: plain, value: "of teams ship faster with async-first standups" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text
      line_height: 1.25

  # ── Context line ──────────────────────────────────────────
  - id: context
    type: text
    z: 13
    x: 60
    y: 530
    width: 660
    height: 0
    content: { type: plain, value: "Based on 1,240 engineering teams surveyed across 32 countries" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.45

  # ── Right column header ───────────────────────────────────
  - id: right-header
    type: text
    z: 14
    x: 760
    y: 90
    width: 400
    height: 0
    content: { type: plain, value: "BREAKDOWN" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  # ── Stat 2 block ──────────────────────────────────────────
  - id: stat2-value
    type: text
    z: 20
    x: 760
    y: 150
    width: 400
    height: 0
    content: { type: plain, value: "2.4×" }
    style:
      font_family: $heading
      font_size: 88
      font_weight: 800
      color: $primary
      line_height: 1
      letter_spacing: -0.03

  - id: stat2-label
    type: text
    z: 21
    x: 760
    y: 260
    width: 400
    height: 0
    content: { type: plain, value: "faster decision cycles" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 500
      color: $text
      line_height: 1.3

  # ── Stat 2/3 divider ──────────────────────────────────────
  - id: stat-divider
    type: rect
    z: 22
    x: 760
    y: 330
    width: 400
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Stat 3 block ──────────────────────────────────────────
  - id: stat3-value
    type: text
    z: 23
    x: 760
    y: 360
    width: 400
    height: 0
    content: { type: plain, value: "$840K" }
    style:
      font_family: $heading
      font_size: 88
      font_weight: 800
      color: $accent
      line_height: 1
      letter_spacing: -0.03

  - id: stat3-label
    type: text
    z: 24
    x: 760
    y: 470
    width: 400
    height: 0
    content: { type: plain, value: "avg savings per team / year" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 500
      color: $text
      line_height: 1.3

  # ── Footer ────────────────────────────────────────────────
  - id: footer
    type: text
    z: 30
    x: 60
    y: 615
    width: 1080
    height: 0
    content: { type: plain, value: "folio.dev/research · @folio_research" }
    style:
      font_family: $mono
      font_size: 13
      color: $text_muted
      line_height: 1.3

slots:
  - { id: hero_number,   path: "layers[5].content.value",  type: text, hint: "Hero stat number",      default: "87%" }
  - { id: hero_label,    path: "layers[6].content.value",  type: text, hint: "Hero stat label",       default: "of teams ship faster with async-first standups" }
  - { id: context,       path: "layers[7].content.value",  type: text, hint: "Supporting context",    default: "Based on 1,240 engineering teams surveyed across 32 countries" }
  - { id: stat_2_value,  path: "layers[9].content.value",  type: text, hint: "Secondary stat 2 value", default: "2.4×" }
  - { id: stat_2_label,  path: "layers[10].content.value", type: text, hint: "Secondary stat 2 label", default: "faster decision cycles" }
  - { id: stat_3_value,  path: "layers[12].content.value", type: text, hint: "Secondary stat 3 value", default: "$840K" }
  - { id: stat_3_label,  path: "layers[13].content.value", type: text, hint: "Secondary stat 3 label", default: "avg savings per team / year" }
