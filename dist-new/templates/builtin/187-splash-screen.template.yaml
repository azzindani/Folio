_protocol: template/v1

# App splash screen — 1920×1080 landscape, indigo-pro theme.
# Centered brand mark, brand name, tagline, animated-dots placeholder, version footer.
meta:
  id: tmpl-splash-screen
  name: Splash Screen
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, app, screen, splash, launch, landscape, indigo]
  description: "App splash screen with centered brand mark, name, tagline, loading dots, and version footer."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # ── Background gradient ───────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill:
      type: linear
      angle: 145
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # ── Ambient glow ──────────────────────────────────────────
  - id: glow
    type: circle
    z: 1
    cx: 960
    cy: 420
    rx: 540
    ry: 540
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.28

  # ── Brand mark plate ──────────────────────────────────────
  - id: mark-plate
    type: rect
    z: 10
    x: 850
    y: 310
    width: 220
    height: 220
    radius: 48
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }
    effects:
      shadow:
        - { dx: 0, dy: 24, blur: 64, color: "rgba(0,0,0,0.35)" }

  - id: mark-letter
    type: text
    z: 11
    x: 850
    y: 350
    width: 220
    height: 0
    content: { type: plain, value: "F" }
    style:
      font_family: $heading
      font_size: 140
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  # ── Brand name ────────────────────────────────────────────
  - id: brand-name
    type: text
    z: 20
    x: 460
    y: 580
    width: 1000
    height: 0
    content: { type: plain, value: "Folio" }
    style:
      font_family: $heading
      font_size: 84
      font_weight: 800
      color: $text
      text_align: center
      letter_spacing: -0.02
      line_height: 1.1

  # ── Tagline ───────────────────────────────────────────────
  - id: tagline
    type: text
    z: 21
    x: 460
    y: 690
    width: 1000
    height: 0
    content: { type: plain, value: "Design at the speed of thought." }
    style:
      font_family: $body
      font_size: 26
      font_weight: 400
      color: $text_muted
      text_align: center
      line_height: 1.4

  # ── Loading dots row ──────────────────────────────────────
  - id: dot-1
    type: circle
    z: 30
    cx: 912
    cy: 820
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }
    opacity: 0.9

  - id: dot-2
    type: circle
    z: 31
    cx: 960
    cy: 820
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }
    opacity: 0.55

  - id: dot-3
    type: circle
    z: 32
    cx: 1008
    cy: 820
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }
    opacity: 0.25

  # ── Version footer ────────────────────────────────────────
  - id: version
    type: text
    z: 40
    x: 60
    y: 1010
    width: 1800
    height: 0
    content: { type: plain, value: "v2.5.0 · build 4821" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: center
      letter_spacing: 0.06

slots:
  - { id: brand_name, path: "layers[4].content.value", type: text, hint: "Brand or app name",       default: "Folio" }
  - { id: tagline,    path: "layers[5].content.value", type: text, hint: "One-line tagline",        default: "Design at the speed of thought." }
  - { id: version,    path: "layers[9].content.value", type: text, hint: "Version / build string",  default: "v2.5.0 · build 4821" }
