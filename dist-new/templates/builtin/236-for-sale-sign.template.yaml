_protocol: template/v1

# Generic FOR SALE yard sign — 1500×1080 landscape, high-contrast.
# Huge "FOR SALE", item + price BIG, condition rating, and
# tear-off strip grid at bottom with rotated phone numbers.
meta:
  id: tmpl-for-sale-sign
  name: For Sale Sign · Tear-Off
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [sign, for-sale, classified, tear-off, high-contrast, landscape]
  description: "Bold for-sale yard sign with huge headline, item + price, condition, and tear-off strip grid with rotated phone numbers at the bottom."

document:
  width: 1500
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: high-contrast

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Border frame ──────────────────────────────────────────
  - id: frame
    type: rect
    z: 1
    x: 40
    y: 40
    width: 1420
    height: 1000
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 12 }

  - id: frame-inner
    type: rect
    z: 2
    x: 70
    y: 70
    width: 1360
    height: 940
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  # ── Huge headline ─────────────────────────────────────────
  - id: headline-bg
    type: rect
    z: 10
    x: 70
    y: 110
    width: 1360
    height: 200
    fill: { type: solid, color: "$primary" }

  - id: headline
    type: text
    z: 11
    x: 70
    y: 150
    width: 1360
    height: 0
    content: { type: plain, value: "FOR SALE" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: "$background"
      text_align: center
      line_height: 1
      letter_spacing: 0.04

  # ── Item ──────────────────────────────────────────────────
  - id: item-label
    type: text
    z: 20
    x: 90
    y: 370
    width: 1320
    height: 0
    content: { type: plain, value: "ITEM" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 800
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: item-value
    type: text
    z: 21
    x: 90
    y: 410
    width: 1320
    height: 0
    content: { type: plain, value: "2018 Trek Domane Road Bike" }
    style:
      font_family: $heading
      font_size: 68
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01

  # ── Price big ─────────────────────────────────────────────
  - id: price-rule-l
    type: rect
    z: 30
    x: 290
    y: 540
    width: 200
    height: 4
    fill: { type: solid, color: "$primary" }

  - id: price-rule-r
    type: rect
    z: 31
    x: 1010
    y: 540
    width: 200
    height: 4
    fill: { type: solid, color: "$primary" }

  - id: price-value
    type: text
    z: 32
    x: 90
    y: 510
    width: 1320
    height: 0
    content: { type: plain, value: "$ 950" }
    style:
      font_family: $heading
      font_size: 140
      font_weight: 900
      color: "$primary"
      text_align: center
      line_height: 1
      letter_spacing: -0.02

  - id: price-sub
    type: text
    z: 33
    x: 90
    y: 690
    width: 1320
    height: 0
    content: { type: plain, value: "obo · cash or venmo" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: "$text_muted"
      text_align: center
      line_height: 1.3

  # ── Condition badge ───────────────────────────────────────
  - id: cond-bg
    type: rect
    z: 40
    x: 540
    y: 750
    width: 420
    height: 70
    radius: 35
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$text", width: 3 }

  - id: cond-text
    type: text
    z: 41
    x: 540
    y: 770
    width: 420
    height: 0
    content: { type: plain, value: "CONDITION · EXCELLENT (9/10)" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 800
      color: "$text"
      text_align: center
      letter_spacing: 0.3
      line_height: 1.3

  # ── Tear-off strips ───────────────────────────────────────
  - id: tear-rule
    type: line
    z: 50
    x1: 90
    y1: 870
    x2: 1410
    y2: 870
    stroke: { color: "$text", width: 2, dash: [4, 6] }

  - id: tear-label
    type: text
    z: 51
    x: 90
    y: 880
    width: 1320
    height: 0
    content: { type: plain, value: "↓  tear off a strip  ↓" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.4

  # tear-off cells row
  - id: tear-cell-1
    type: rect
    z: 52
    x: 90
    y: 910
    width: 165
    height: 100
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$text", width: 1 }

  - id: tear-cell-2
    type: rect
    z: 53
    x: 255
    y: 910
    width: 165
    height: 100
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$text", width: 1 }

  - id: tear-cell-3
