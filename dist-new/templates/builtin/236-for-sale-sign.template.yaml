    z: 56
    x: 750
    y: 910
    width: 165
    height: 100
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$text", width: 1 }

  - id: tear-cell-6
    type: rect
    z: 57
    x: 915
    y: 910
    width: 165
    height: 100
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$text", width: 1 }

  - id: tear-cell-7
    type: rect
    z: 58
    x: 1080
    y: 910
    width: 165
    height: 100
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$text", width: 1 }

  - id: tear-cell-8
