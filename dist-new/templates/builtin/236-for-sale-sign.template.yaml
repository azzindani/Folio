    type: text
    z: 60
    x: 90
    y: 910
    width: 165
    height: 100
    rotation: -90
    content: { type: plain, value: "(415) 555-0199" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: "$text"
      text_align: center
      line_height: 1.3

  - id: tear-phone-2
    type: text
    z: 61
