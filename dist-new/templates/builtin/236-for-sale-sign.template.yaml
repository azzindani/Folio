slots:
  - { id: item,      path: "layers[6].content.value",  type: text, hint: "Item description",     default: "2018 Trek Domane Road Bike" }
  - { id: price,     path: "layers[9].content.value",  type: text, hint: "Price (big)",          default: "$ 950" }
  - { id: condition, path: "layers[13].content.value", type: text, hint: "Condition rating",     default: "CONDITION · EXCELLENT (9/10)" }
  - { id: phone,     path: "layers[24].content.value", type: text, hint: "Phone (tear-off 1)",   default: "(415) 555-0199" }
