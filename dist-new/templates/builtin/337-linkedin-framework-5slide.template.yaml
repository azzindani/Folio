_protocol: template/v1

# 5-slide LinkedIn document carousel — Mental Model / 3-Part Framework.
# Portrait 1080×1350, calm organic palette (forest-deep).
meta:
  id: tmpl-linkedin-framework-5slide
  name: LinkedIn Framework (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, framework, mental-model, 4-5]
  description: "Five-slide LinkedIn document arc for a 3-part mental model: cover → why → component 1 → component 2 → component 3 + CTA. Uses big lettermarks and stat callouts."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: forest-deep

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - { id: badge-rect, type: rect, z: 2, x: 80, y: 320, width: 540, height: 56, radius: 28, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - id: badge-text
        type: text
        z: 3
        x: 80
        y: 336
        width: 540
        height: 0
        content: { type: plain, value: "Perception × Impact × Exposure" }
        style: { font_family: $mono, font_size: 18, font_weight: 600, color: $primary, text_align: center, letter_spacing: 0.08 }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 260
        width: 920
        height: 0
        content: { type: plain, value: "MENTAL MODEL" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "The PIE\nFramework" }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: subtitle
        type: text
        z: 12
        x: 80
        y: 760
        width: 920
        height: 0
        content: { type: plain, value: "Why hard work alone won't get you promoted —\nand the three levers that actually move careers." }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.5 }
      - id: counter
        type: text
        z: 13
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "1/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: handle
        type: text
        z: 14
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 2 · Why it works ─────────────────────────────────
  - id: why
    label: Why
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "2/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 180
        width: 920
        height: 0
        content: { type: plain, value: "WHY" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 240
        width: 920
        height: 0
        content: { type: plain, value: "Hard work is the floor,\nnot the ceiling." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - id: intro
        type: text
        z: 13
        x: 80
        y: 500
        width: 920
        height: 0
        content: { type: plain, value: "Results matter, but only after people notice them. The PIE model says careers move on three independent inputs — and most people quietly over-invest in just one." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - id: quote
        type: text
        z: 14
        x: 80
        y: 880
        width: 920
        height: 0
        content: { type: plain, value: "“Performance is what you do. Image is who people think you are. Exposure is who knows it.”" }
        style: { font_family: $heading, font_size: 26, font_style: italic, color: $primary, line_height: 1.4 }
      - id: handle
        type: text
        z: 15
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 3 · Component 1 · Perception ─────────────────────
  - id: perception
    label: Perception
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "3/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: lettermark
        type: text
        z: 11
        x: 60
        y: 280
        width: 360
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $heading, font_size: 200, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.04 }
      - id: eyebrow
        type: text
        z: 12
        x: 480
        y: 320
        width: 540
        height: 0
        content: { type: plain, value: "COMPONENT ONE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: name
        type: text
        z: 13
        x: 480
        y: 370
        width: 540
        height: 0
        content: { type: plain, value: "Perception" }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: bullet-1
        type: text
        z: 14
        x: 480
        y: 470
        width: 540
        height: 0
        content: { type: plain, value: "→ How leadership describes you when you're not in the room." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: bullet-2
        type: text
        z: 15
        x: 480
        y: 590
        width: 540
        height: 0
        content: { type: plain, value: "→ Built from tone, consistency, and how you handle pressure." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: bullet-3
        type: text
        z: 16
        x: 480
        y: 710
        width: 540
        height: 0
        content: { type: plain, value: "→ Cheapest lever to fix — slowest to rebuild." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: stat-rect
        type: rect
        z: 17
        x: 80
        y: 980
        width: 920
        height: 140
        radius: 0
        fill: { type: solid, color: "$surface" }
        stroke: { color: "$primary", width: 2 }
      - id: stat-label
        type: text
        z: 18
        x: 120
        y: 1010
        width: 840
        height: 0
        content: { type: plain, value: "WEIGHT IN PROMOTION DECISIONS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.16, text_transform: uppercase }
      - id: stat-value
        type: text
        z: 19
        x: 120
        y: 1040
        width: 840
        height: 0
        content: { type: plain, value: "≈ 60% perception · only 10% performance" }
        style: { font_family: $heading, font_size: 28, font_weight: 700, color: $primary, line_height: 1.2 }
      - id: handle
        type: text
        z: 20
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 4 · Component 2 · Impact ─────────────────────────
  - id: impact
    label: Impact
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "4/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: lettermark
        type: text
        z: 11
        x: 60
        y: 280
        width: 360
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $heading, font_size: 200, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.04 }
      - id: eyebrow
        type: text
        z: 12
        x: 480
        y: 320
        width: 540
        height: 0
        content: { type: plain, value: "COMPONENT TWO" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: name
        type: text
        z: 13
        x: 480
        y: 370
        width: 540
        height: 0
        content: { type: plain, value: "Impact" }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: bullet-1
        type: text
        z: 14
        x: 480
        y: 470
        width: 540
        height: 0
        content: { type: plain, value: "→ The measurable dent your work leaves on the business." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: bullet-2
        type: text
        z: 15
        x: 480
        y: 590
        width: 540
        height: 0
        content: { type: plain, value: "→ Numbers > activity. Revenue, retention, saved hours." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: bullet-3
        type: text
        z: 16
        x: 480
        y: 710
        width: 540
        height: 0
        content: { type: plain, value: "→ Easiest to prove, but only if you tracked it from day one." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: stat-rect
        type: rect
        z: 17
        x: 80
        y: 980
        width: 920
        height: 140
        radius: 0
        fill: { type: solid, color: "$surface" }
        stroke: { color: "$primary", width: 2 }
      - id: stat-label
        type: text
        z: 18
        x: 120
        y: 1010
        width: 840
        height: 0
        content: { type: plain, value: "ONE-LINE TEST" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.16, text_transform: uppercase }
      - id: stat-value
        type: text
        z: 19
        x: 120
        y: 1040
        width: 840
        height: 0
        content: { type: plain, value: "Can you finish: \"Because of me, X went from A → B\"?" }
        style: { font_family: $heading, font_size: 24, font_weight: 700, color: $primary, line_height: 1.3 }
      - id: handle
        type: text
        z: 20
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 5 · Component 3 + CTA ────────────────────────────
  - id: exposure-cta
    label: Exposure + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "5/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: lettermark
        type: text
        z: 11
        x: 60
        y: 200
        width: 360
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $heading, font_size: 200, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.04 }
      - id: eyebrow
        type: text
        z: 12
        x: 480
        y: 240
        width: 540
        height: 0
        content: { type: plain, value: "COMPONENT THREE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: name
        type: text
        z: 13
        x: 480
        y: 290
        width: 540
        height: 0
        content: { type: plain, value: "Exposure" }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: desc
        type: text
        z: 14
        x: 480
        y: 390
        width: 540
        height: 0
        content: { type: plain, value: "Who outside your team knows your name — and what they associate with it. Without this, perception and impact never compound." }
        style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 }
      - id: cta-panel
        type: rect
        z: 15
        x: 80
        y: 820
        width: 920
        height: 280
        radius: 0
        fill: { type: solid, color: "$primary" }
      - id: cta-label
        type: text
        z: 16
        x: 120
        y: 870
        width: 840
        height: 0
        content: { type: plain, value: "APPLY IT THIS WEEK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.24, text_transform: uppercase }
      - id: cta-text
        type: text
        z: 17
        x: 120
        y: 920
        width: 840
        height: 0
        content: { type: plain, value: "Pick ONE of the three\nand make a 15-minute move today." }
        style: { font_family: $heading, font_size: 36, font_weight: 700, color: "#FFFFFF", line_height: 1.25, letter_spacing: -0.01 }
      - id: handle
        type: text
        z: 18
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "Follow @yourhandle for one model a week." }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

slots:
  - { id: cover_title,        path: "pages[0].layers[5].content.value",  type: text, hint: "Framework name (cover)",       default: "The PIE\nFramework" }
  - { id: cover_subtitle,     path: "pages[0].layers[6].content.value",  type: text, hint: "What it solves (cover)",       default: "Why hard work alone won't get you promoted —\nand the three levers that actually move careers." }
  - { id: cover_badge,        path: "pages[0].layers[3].content.value",  type: text, hint: "Abbreviation expansion badge", default: "Perception × Impact × Exposure" }
  - { id: why_intro,          path: "pages[1].layers[5].content.value",  type: text, hint: "Why-it-works paragraph",       default: "Results matter, but only after people notice them. The PIE model says careers move on three independent inputs — and most people quietly over-invest in just one." }
  - { id: component_1_name,   path: "pages[2].layers[5].content.value",  type: text, hint: "Component 1 name",             default: "Perception" }
  - { id: component_2_name,   path: "pages[3].layers[5].content.value",  type: text, hint: "Component 2 name",             default: "Impact" }
  - { id: component_3_name,   path: "pages[4].layers[5].content.value",  type: text, hint: "Component 3 name",             default: "Exposure" }
  - { id: cta_text,           path: "pages[4].layers[8].content.value",  type: text, hint: "CTA copy",                     default: "Pick ONE of the three\nand make a 15-minute move today." }
  - { id: cta_handle,         path: "pages[4].layers[9].content.value",  type: text, hint: "Footer / handle",              default: "Follow @yourhandle for one model a week." }
