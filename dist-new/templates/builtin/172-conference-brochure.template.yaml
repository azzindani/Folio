_protocol: template/v1

# 4-page conference brochure — 1240×1754 A4 portrait, indigo-pro theme.
# Cover → schedule overview → speakers → venue/travel/sponsors.
meta:
  id: tmpl-conference-brochure
  name: Conference Brochure · 4 Pages
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, conference, brochure, event, indigo, a4]
  description: "Four-page conference brochure with event cover, three-day schedule overview, speaker highlights, and venue/travel/sponsor information."

document:
