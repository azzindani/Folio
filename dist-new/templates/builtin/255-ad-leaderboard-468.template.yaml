_protocol: template/v1

# IAB Leaderboard 468×60 — single-row ad banner.
# Brand mark + headline + CTA pill, all inline. Indigo-pro theme.
meta:
  id: tmpl-ad-leaderboard-468
  name: Ad Leaderboard 468
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [ad, banner, leaderboard, iab, "468x60", landscape, indigo]
  description: "IAB 468×60 leaderboard ad with brand mark, single-line headline, and inline CTA pill."

document:
  width: 468
  height: 60
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 468
    height: 60
    fill: { type: solid, color: $background }
  - id: accent-bar
    type: rect
    z: 1
    x: 0
    y: 0
    width: 4
    height: 60
    fill: { type: solid, color: "$primary" }

  - id: brand-dot
    type: circle
    z: 2
    cx: 24
    cy: 30
    rx: 9
    ry: 9
    fill: { type: solid, color: "$primary" }

  - id: brand
    type: text
    z: 3
    x: 40
    y: 22
    width: 90
    height: 0
    content: { type: plain, value: "Axiom" }
    style:
      font_family: $heading
      font_size: 16
      font_weight: 800
      color: $text

  - id: divider
    type: rect
    z: 4
    x: 132
    y: 16
    width: 1
    height: 28
    fill: { type: solid, color: "$border" }

  - id: headline
    type: text
    z: 5
    x: 144
    y: 22
    width: 200
    height: 0
    content: { type: plain, value: "Ship 3× faster with AI" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: $text

  - id: cta-bg
    type: rect
    z: 6
    x: 352
    y: 14
    width: 104
    height: 32
    radius: 16
    fill: { type: solid, color: "$primary" }

  - id: cta-text
    type: text
    z: 7
    x: 352
    y: 22
    width: 104
    height: 0
    content: { type: plain, value: "Try free →" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

slots:
  - { id: brand,      path: "layers[3].content.value", type: text, hint: "Brand name",     default: "Axiom" }
  - { id: headline,   path: "layers[5].content.value", type: text, hint: "Ad headline",    default: "Ship 3× faster with AI" }
  - { id: cta_label,  path: "layers[7].content.value", type: text, hint: "CTA button text", default: "Try free →" }
