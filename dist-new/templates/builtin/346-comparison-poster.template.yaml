_protocol: template/v1

# Portrait LinkedIn poster — "A vs B" comparison card.
# Eyebrow + headline question + 2 columns (pros/cons) + verdict bar + author meta.
meta:
  id: tmpl-comparison-poster
  name: Comparison Poster (A vs B)
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, comparison, decision, analysis, portrait, 4-5]
  description: "Portrait 1200x1500 LinkedIn poster for side-by-side technology, framework, or strategy comparisons — two columns of mixed pros & cons with a bottom-line verdict."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 8
    fill: { type: solid, color: $primary }
  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 100
    width: 1040
    height: 0
    content: { type: plain, value: "COMPARISON · DECISION GUIDE" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 600
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: headline
    type: text
    z: 11
    x: 80
    y: 160
    width: 1040
    height: 0
    content: { type: plain, value: "Postgres vs MongoDB\nfor a modern SaaS?" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: subhead
    type: text
    z: 12
    x: 80
    y: 340
    width: 1040
    height: 0
    content: { type: plain, value: "An honest, opinionated breakdown — strengths and trade-offs side by side." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.4

  # ─── LEFT COLUMN (A) ──────────────────────────────────────────────
  - id: col-a-bg
    type: rect
    z: 20
    x: 80
    y: 440
    width: 520
    height: 620
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: col-a-top-edge
    type: rect
    z: 21
    x: 80
    y: 440
    width: 520
    height: 6
    fill: { type: solid, color: "$primary" }

  - id: col-a-header
    type: text
    z: 22
    x: 110
    y: 480
    width: 460
    height: 0
    content: { type: plain, value: "Postgres" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 800
      color: $primary
      letter_spacing: -0.02

  - id: col-a-sub
    type: text
    z: 23
    x: 110
    y: 552
    width: 460
    height: 0
    content: { type: plain, value: "Relational · ACID · battle-tested" }
    style:
      font_family: $mono
      font_size: 15
      color: $text_muted
      letter_spacing: 0.08

  - id: col-a-divider
    type: rect
    z: 24
    x: 110
    y: 590
    width: 460
    height: 1
    fill: { type: solid, color: "$border" }

  - id: col-a-points
    type: text
    z: 25
    x: 110
    y: 612
    width: 460
    height: 0
    content: { type: plain, value: "✓ Strong consistency & ACID by default\n✓ Rich SQL, joins, CTEs, window funcs\n✓ JSONB if you do need flexibility\n✗ Schema migrations require discipline\n✗ Horizontal scaling needs effort" }
    style:
      font_family: $body
      font_size: 20
      color: $text
      line_height: 1.7

  # ─── RIGHT COLUMN (B) ─────────────────────────────────────────────
  - id: col-b-bg
    type: rect
    z: 20
    x: 620
    y: 440
    width: 520
    height: 620
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: col-b-top-edge
    type: rect
    z: 21
    x: 620
    y: 440
    width: 520
    height: 6
    fill: { type: solid, color: "$secondary" }

  - id: col-b-header
    type: text
    z: 22
    x: 650
    y: 480
    width: 460
    height: 0
    content: { type: plain, value: "MongoDB" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 800
      color: $secondary
      letter_spacing: -0.02

  - id: col-b-sub
    type: text
    z: 23
    x: 650
    y: 552
    width: 460
    height: 0
    content: { type: plain, value: "Document · flexible · scale-ready" }
    style:
      font_family: $mono
      font_size: 15
      color: $text_muted
      letter_spacing: 0.08

  - id: col-b-divider
    type: rect
    z: 24
    x: 650
    y: 590
    width: 460
    height: 1
    fill: { type: solid, color: "$border" }

  - id: col-b-points
    type: text
    z: 25
    x: 650
    y: 612
    width: 460
    height: 0
    content: { type: plain, value: "✓ Schema-flex models early product churn\n✓ Sharding & replicas built-in\n✓ Great fit for nested doc payloads\n✗ Cross-document joins remain awkward\n✗ Easy to back yourself into a corner" }
    style:
      font_family: $body
      font_size: 20
      color: $text
      line_height: 1.7

  # ─── VERDICT BAR ─────────────────────────────────────────────────
  - id: verdict-bg
    type: rect
    z: 30
    x: 80
    y: 1110
    width: 1040
    height: 220
    radius: 16
    fill: { type: solid, color: "$surface2" }
    stroke: { color: "$primary", width: 2 }

  - id: verdict-label
    type: text
    z: 31
    x: 120
    y: 1140
    width: 960
    height: 0
    content: { type: plain, value: "BOTTOM LINE" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.32
      text_transform: uppercase

  - id: verdict-text
    type: text
    z: 32
    x: 120
    y: 1180
    width: 960
    height: 0
    content: { type: plain, value: "Start with Postgres. Reach for Mongo only when your data is genuinely document-shaped — most SaaS apps aren't." }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 600
      color: $text
      line_height: 1.4

  # ─── FOOTER ──────────────────────────────────────────────────────
  - id: footer-divider
    type: rect
    z: 40
    x: 80
    y: 1380
    width: 1040
    height: 1
    fill: { type: solid, color: "$border" }

  - id: author
    type: text
    z: 41
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "Jordan Reyes · Staff Engineer" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text

  - id: date-meta
    type: text
    z: 42
    x: 80
    y: 1430
    width: 700
    height: 0
    content: { type: plain, value: "May 2026" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted

  - id: credibility
    type: text
    z: 43
    x: 780
    y: 1410
    width: 340
    height: 0
    content: { type: plain, value: "Based on 12 production SaaS projects" }
    style:
      font_family: $body
      font_size: 14
      font_style: italic
      color: $text_muted
      text_align: right

animations:
  eyebrow:
    enter: { type: fade_in, duration: 400, delay: 0, easing: ease-out }
  headline:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  subhead:
    enter: { type: fade_up, duration: 600, delay: 250, easing: ease-out }
  col-a-bg:
    enter: { type: slide_right, duration: 600, delay: 400, easing: ease-out }
  col-a-header:
    enter: { type: slide_right, duration: 600, delay: 400, easing: ease-out }
  col-a-sub:
    enter: { type: slide_right, duration: 600, delay: 400, easing: ease-out }
  col-a-points:
    enter: { type: slide_right, duration: 600, delay: 400, easing: ease-out }
  col-b-bg:
    enter: { type: slide_left, duration: 600, delay: 550, easing: ease-out }
  col-b-header:
    enter: { type: slide_left, duration: 600, delay: 550, easing: ease-out }
  col-b-sub:
    enter: { type: slide_left, duration: 600, delay: 550, easing: ease-out }
  col-b-points:
    enter: { type: slide_left, duration: 600, delay: 550, easing: ease-out }
  verdict-bg:
    enter: { type: fade_in, duration: 500, delay: 1000, easing: ease-out }
  verdict-label:
    enter: { type: fade_in, duration: 500, delay: 1000, easing: ease-out }
  verdict-text:
    enter: { type: fade_in, duration: 500, delay: 1100, easing: ease-out }

slots:
  - { id: eyebrow,       path: "layers[2].content.value",  type: text, hint: "Eyebrow label",          default: "COMPARISON · DECISION GUIDE" }
  - { id: headline,      path: "layers[3].content.value",  type: text, hint: "Headline question (2 lines)", default: "Postgres vs MongoDB\nfor a modern SaaS?" }
  - { id: subhead,       path: "layers[4].content.value",  type: text, hint: "Subheadline",            default: "An honest, opinionated breakdown — strengths and trade-offs side by side." }
  - { id: col_a_header,  path: "layers[7].content.value",  type: text, hint: "Left column title (A)",  default: "Postgres" }
  - { id: col_a_sub,     path: "layers[8].content.value",  type: text, hint: "Left column subtitle",   default: "Relational · ACID · battle-tested" }
  - { id: col_a_points,  path: "layers[10].content.value", type: text, hint: "Left column bullets (✓/✗ mix)", default: "✓ Strong consistency & ACID by default\n✓ Rich SQL, joins, CTEs, window funcs\n✓ JSONB if you do need flexibility\n✗ Schema migrations require discipline\n✗ Horizontal scaling needs effort" }
  - { id: col_b_header,  path: "layers[13].content.value", type: text, hint: "Right column title (B)", default: "MongoDB" }
  - { id: col_b_sub,     path: "layers[14].content.value", type: text, hint: "Right column subtitle",  default: "Document · flexible · scale-ready" }
  - { id: col_b_points,  path: "layers[16].content.value", type: text, hint: "Right column bullets (✓/✗ mix)", default: "✓ Schema-flex models early product churn\n✓ Sharding & replicas built-in\n✓ Great fit for nested doc payloads\n✗ Cross-document joins remain awkward\n✗ Easy to back yourself into a corner" }
  - { id: verdict,       path: "layers[19].content.value", type: text, hint: "Bottom-line verdict",    default: "Start with Postgres. Reach for Mongo only when your data is genuinely document-shaped — most SaaS apps aren't." }
  - { id: author,        path: "layers[21].content.value", type: text, hint: "Author name + role",     default: "Jordan Reyes · Staff Engineer" }
  - { id: credibility,   path: "layers[23].content.value", type: text, hint: "Credibility caption",    default: "Based on 12 production SaaS projects" }
