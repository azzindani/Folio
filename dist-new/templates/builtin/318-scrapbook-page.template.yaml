_protocol: template/v1

# Scrapbook page — 1500×1500 square, pastel-dream.
# 4 rotated photo placeholders, washi-tape strips, handwritten captions, date stamp, sticker elements.
meta:
  id: tmpl-scrapbook-page
  name: Scrapbook Page
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, scrapbook, memory, craft, pastel, square, photos]
  description: "Scrapbook layout with rotated photo placeholders, washi-tape strips, handwritten captions, date stamp, and decorative sticker elements."

document:
  width: 1500
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 1500
    fill: { type: solid, color: "$background" }

  # Subtle dotted paper background (decorative dots)
  - id: dot-1
    type: circle
    z: 1
    cx: 120
    cy: 120
    rx: 6
    ry: 6
    fill: { type: solid, color: "$accent" }
    opacity: 0.18
  - id: dot-2
    type: circle
    z: 1
    cx: 1380
    cy: 200
    rx: 6
    ry: 6
    fill: { type: solid, color: "$secondary" }
    opacity: 0.18
  - id: dot-3
    type: circle
    z: 1
    cx: 200
    cy: 1380
    rx: 8
    ry: 8
    fill: { type: solid, color: "$primary" }
    opacity: 0.15
  - id: dot-4
    type: circle
    z: 1
    cx: 1320
    cy: 1340
    rx: 7
    ry: 7
    fill: { type: solid, color: "$accent" }
    opacity: 0.2

  # Header banner
  - id: title
    type: text
    z: 5
    x: 60
    y: 80
    width: 1380
    height: 0
    content: { type: plain, value: "Summer at the Cabin" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 700
      font_style: italic
      color: "$primary"
      text_align: center

  - id: date-stamp-bg
    type: rect
    z: 6
    x: 600
    y: 180
    width: 300
    height: 50
    radius: 4
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text_muted", width: 2 }

  - id: date-stamp
    type: text
    z: 7
    x: 600
    y: 195
    width: 300
    height: 0
    content: { type: plain, value: "★ JULY 14–21, 2025 ★" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 800
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3
      text_transform: uppercase

  # Photo 1 — top-left, slight tilt left
  - id: photo-1-shadow
    type: rect
    z: 10
    x: 130
    y: 320
    width: 420
    height: 380
    radius: 4
    fill: { type: solid, color: "$text" }
    opacity: 0.12
    transform:
      rotate: -4
  - id: photo-1
    type: rect
    z: 11
    x: 120
    y: 310
    width: 420
    height: 380
    radius: 4
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$border", width: 1 }
    transform:
      rotate: -4
  - id: photo-1-inner
    type: rect
    z: 12
    x: 140
    y: 330
    width: 380
    height: 300
    fill: { type: solid, color: "$secondary" }
    opacity: 0.35
    transform:
      rotate: -4
  - id: photo-1-hint
    type: text
    z: 13
    x: 140
    y: 460
    width: 380
    height: 0
    content: { type: plain, value: "[ PHOTO ]" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3
    transform:
      rotate: -4
  - id: photo-1-caption
    type: text
    z: 14
    x: 140
    y: 640
    width: 380
    height: 0
    content: { type: plain, value: "morning hike by the lake :)" }
    style:
      font_family: $heading
      font_size: 22
      font_style: italic
      color: "$text"
      text_align: center
    transform:
      rotate: -4

  # Washi tape strip on photo 1
  - id: washi-1
    type: rect
    z: 15
    x: 200
    y: 290
    width: 220
    height: 32
    fill: { type: solid, color: "$primary" }
    opacity: 0.6
    transform:
      rotate: 12

  # Photo 2 — top-right, slight tilt right
  - id: photo-2-shadow
    type: rect
    z: 10
    x: 970
    y: 330
    width: 400
    height: 360
    radius: 4
    fill: { type: solid, color: "$text" }
    opacity: 0.12
    transform:
      rotate: 5
  - id: photo-2
    type: rect
    z: 11
    x: 960
    y: 320
    width: 400
    height: 360
    radius: 4
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$border", width: 1 }
    transform:
      rotate: 5
  - id: photo-2-inner
    type: rect
    z: 12
    x: 980
    y: 340
    width: 360
    height: 280
    fill: { type: solid, color: "$accent" }
    opacity: 0.35
    transform:
      rotate: 5
  - id: photo-2-hint
    type: text
    z: 13
    x: 980
    y: 460
    width: 360
    height: 0
    content: { type: plain, value: "[ PHOTO ]" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3
    transform:
      rotate: 5
  - id: photo-2-caption
    type: text
    z: 14
    x: 980
    y: 640
    width: 360
    height: 0
    content: { type: plain, value: "campfire songs ♪" }
    style:
      font_family: $heading
      font_size: 22
      font_style: italic
      color: "$text"
      text_align: center
    transform:
      rotate: 5

  - id: washi-2
    type: rect
    z: 15
    x: 1040
    y: 300
    width: 220
    height: 32
    fill: { type: solid, color: "$accent" }
    opacity: 0.6
    transform:
      rotate: -8

  # Photo 3 — bottom-left
  - id: photo-3-shadow
    type: rect
    z: 10
    x: 150
    y: 870
    width: 400
    height: 380
    radius: 4
    fill: { type: solid, color: "$text" }
    opacity: 0.12
    transform:
      rotate: 6
  - id: photo-3
    type: rect
    z: 11
    x: 140
    y: 860
    width: 400
    height: 380
    radius: 4
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$border", width: 1 }
    transform:
      rotate: 6
  - id: photo-3-inner
    type: rect
    z: 12
    x: 160
    y: 880
    width: 360
    height: 300
    fill: { type: solid, color: "$primary" }
    opacity: 0.3
    transform:
      rotate: 6
  - id: photo-3-hint
    type: text
    z: 13
    x: 160
    y: 1010
    width: 360
    height: 0
    content: { type: plain, value: "[ PHOTO ]" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3
    transform:
      rotate: 6
  - id: photo-3-caption
    type: text
    z: 14
    x: 160
    y: 1190
    width: 360
    height: 0
    content: { type: plain, value: "berry-picking, day 4" }
    style:
      font_family: $heading
      font_size: 22
      font_style: italic
      color: "$text"
      text_align: center
    transform:
      rotate: 6

  - id: washi-3
    type: rect
    z: 15
    x: 220
    y: 840
    width: 240
    height: 32
    fill: { type: solid, color: "$secondary" }
    opacity: 0.6
    transform:
      rotate: -6

  # Photo 4 — bottom-right
  - id: photo-4-shadow
    type: rect
    z: 10
    x: 960
    y: 870
    width: 420
    height: 380
    radius: 4
    fill: { type: solid, color: "$text" }
    opacity: 0.12
    transform:
      rotate: -3
  - id: photo-4
    type: rect
    z: 11
    x: 950
    y: 860
    width: 420
    height: 380
    radius: 4
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$border", width: 1 }
    transform:
      rotate: -3
  - id: photo-4-inner
    type: rect
    z: 12
    x: 970
    y: 880
    width: 380
    height: 300
    fill: { type: solid, color: "$secondary" }
    opacity: 0.3
    transform:
      rotate: -3
  - id: photo-4-hint
    type: text
    z: 13
    x: 970
    y: 1010
    width: 380
    height: 0
    content: { type: plain, value: "[ PHOTO ]" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3
    transform:
      rotate: -3
  - id: photo-4-caption
    type: text
    z: 14
    x: 970
    y: 1190
    width: 380
    height: 0
    content: { type: plain, value: "last sunset ♥" }
    style:
      font_family: $heading
      font_size: 22
      font_style: italic
      color: "$text"
      text_align: center
    transform:
      rotate: -3

  - id: washi-4
    type: rect
    z: 15
    x: 1040
    y: 840
    width: 240
    height: 32
    fill: { type: solid, color: "$primary" }
    opacity: 0.6
    transform:
      rotate: 9

  # Star sticker (center top)
  - id: sticker-star
    type: polygon
    z: 20
    points: "750,260 762,290 794,290 768,310 778,342 750,322 722,342 732,310 706,290 738,290"
    fill: { type: solid, color: "$primary" }
    opacity: 0.85

  # Heart sticker (center)
  - id: sticker-heart
    type: path
    z: 20
    d: "M 750 800 C 730 770, 690 770, 690 810 C 690 840, 730 870, 750 890 C 770 870, 810 840, 810 810 C 810 770, 770 770, 750 800 Z"
    fill: { type: solid, color: "$secondary" }
    opacity: 0.9

  # Circle sticker
  - id: sticker-circle
    type: circle
    z: 20
    cx: 750
    cy: 1310
    rx: 50
    ry: 50
    fill: { type: solid, color: "$accent" }
    opacity: 0.4
    stroke: { color: "$accent", width: 3 }
  - id: sticker-circle-text
    type: text
    z: 21
    x: 700
    y: 1296
    width: 100
    height: 0
    content: { type: plain, value: "BEST\nWEEK" }
    style:
      font_family: $heading
      font_size: 14
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1.2
      text_transform: uppercase

  # Footer
  - id: footer-line
    type: text
    z: 30
    x: 60
    y: 1430
    width: 1380
    height: 0
    content: { type: plain, value: "memories made · stories kept · a forever summer ✿" }
    style:
      font_family: $heading
      font_size: 24
      font_style: italic
      color: "$primary"
      text_align: center
      line_height: 1.4

slots:
  - { id: page_title, path: "layers[5].content.value", type: text, hint: "Scrapbook page title", default: "Summer at the Cabin" }
  - { id: page_date,  path: "layers[7].content.value", type: text, hint: "Date stamp",           default: "★ JULY 14–21, 2025 ★" }
