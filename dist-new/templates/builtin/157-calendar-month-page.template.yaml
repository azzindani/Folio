_protocol: template/v1

# Single-month wall calendar — 1240×1754 (A4), pastel-dream theme.
# Display-size month name + year, 7-column weekday header (Sun–Sat),
# 6-row × 7-col date grid using rect cells + text numerals, small
# notes section bottom-right, decorative botanical corner accent.
meta:
  id: tmpl-calendar-month-page
  name: Calendar Month Page
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [calendar, month, wall-calendar, a4, pastel, portrait]
  description: "Single-month wall calendar page with month/year header, weekday row, 7×6 date grid, notes, and botanical decoration."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # ── Decorative botanical corner (top-right) ───────────────
  - id: deco-leaf-1
    type: circle
    z: 2
    cx: 1100
    cy: 120
    rx: 70
    ry: 70
    fill: { type: solid, color: "$secondary" }
    opacity: 0.35

  - id: deco-leaf-2
    type: circle
    z: 3
    cx: 1170
    cy: 200
    rx: 40
    ry: 40
    fill: { type: solid, color: "$primary" }
    opacity: 0.45

  - id: deco-stem
    type: path
    z: 4
    d: "M 1080 60 Q 1130 120 1140 230"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 3 }

  - id: deco-leaf-3
    type: path
    z: 5
    d: "M 1140 100 Q 1180 110 1190 80 Q 1175 70 1155 80 Z"
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  # ── Month + year header ───────────────────────────────────
  - id: month-name
    type: text
    z: 10
    x: 80
    y: 80
    width: 900
    height: 0
    content: { type: plain, value: "May" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 700
      color: $text
      line_height: 1
      letter_spacing: -0.04
      font_style: italic

  - id: year
    type: text
    z: 11
    x: 80
    y: 250
    width: 900
    height: 0
    content: { type: plain, value: "2026" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 400
      color: $primary
      line_height: 1.2
      letter_spacing: 0.04

  - id: header-rule
    type: rect
    z: 12
    x: 80
    y: 340
    width: 1080
    height: 2
    fill: { type: solid, color: "$text" }

  # ── Weekday header row (Sun-Sat, 7 cols, 154 wide each) ───
