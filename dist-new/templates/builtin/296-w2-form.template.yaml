_protocol: template/v1

# W-2 informational form — 1700×1100 landscape, mono-print theme.
# IRS W-2-style: 15+ numbered boxes, employer/employee blocks, wages
# and tax fields, "FOR INFORMATIONAL PURPOSES" watermark overlay.
meta:
  id: tmpl-w2-form
  name: W-2 Form (Informational)
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, tax, w2, irs, form, finance, mono, landscape]
  description: "IRS W-2 style informational form template with numbered boxes, employer/employee info, wages and tax fields, watermark overlay."

document:
  width: 1700
  height: 1100
  unit: px
  dpi: 96

theme:
  ref: mono-print

layers:
  # 0 — bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1700, height: 1100, fill: { type: solid, color: "$background" } }
  # 1 — outer form border
  - { id: outer, type: rect, z: 1, x: 40, y: 40, width: 1620, height: 1020, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 2 } }
  # 2 — form id top-right
  - { id: form-id, type: text, z: 2, x: 1300, y: 56, width: 340, height: 0, content: { type: plain, value: "Form W-2 · 22222 · OMB No. 1545-0008" }, style: { font_family: $mono, font_size: 12, color: "$text", text_align: right } }
  # 3 — tax year box bg
  - { id: ty-box, type: rect, z: 3, x: 1300, y: 80, width: 340, height: 84, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1.5 } }
  # 4 — tax year label
  - { id: ty-lab, type: text, z: 4, x: 1316, y: 90, width: 308, height: 0, content: { type: plain, value: "Tax year" }, style: { font_family: $body, font_size: 11, color: "$text_muted" } }
  # 5 — tax year value
  - { id: ty-val, type: text, z: 5, x: 1316, y: 110, width: 308, height: 0, content: { type: plain, value: "2025" }, style: { font_family: $heading, font_size: 44, font_weight: 800, color: "$text", text_align: center, line_height: 1.1 } }
