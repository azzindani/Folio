_protocol: template/v1

# 5-slide LinkedIn carousel — Year in Review reflective narrative.
# Portrait 1080×1350, editorial-cream palette for warm year-end tone.
meta:
  id: tmpl-linkedin-year-review-5slide
  name: LinkedIn Year in Review (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, year-review, reflection, lessons]
  description: "Five-slide LinkedIn year-in-review carousel: big year cover, 2×2 stat grid, three wins, three honest misses, and three priorities for next year with a follow CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "1/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "YEAR IN REVIEW" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: year
        type: text
        z: 12
        x: 80
        y: 320
        width: 920
        height: 0
        content: { type: plain, value: "2025" }
        style: { font_family: $heading, font_size: 300, font_weight: 900, color: $text, line_height: 1, letter_spacing: -0.05 }
      - id: subtitle
        type: text
        z: 13
        x: 80
        y: 760
        width: 920
        height: 0
        content: { type: plain, value: "Lessons from a hard year of building." }
        style: { font_family: $heading, font_size: 44, font_weight: 700, color: $text, line_height: 1.2, letter_spacing: -0.02 }
      - id: tagline
        type: text
        z: 14
        x: 80
        y: 920
        width: 920
        height: 0
        content: { type: plain, value: "The wins, the misses, and what's next. Swipe →" }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.4 }
      - id: handle
        type: text
        z: 15
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 2 · By the Numbers ───────────────────────────────
  - id: numbers
    label: By the Numbers
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "2/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 160
        width: 920
        height: 0
        content: { type: plain, value: "BY THE NUMBERS" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "Twelve months,\nfour numbers." }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      # Quadrant divider lines
      - { id: divider-h, type: rect, z: 5, x: 80, y: 870, width: 920, height: 2, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }
      - { id: divider-v, type: rect, z: 5, x: 539, y: 480, width: 2, height: 760, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }
      # Stat 1 — top left
      - id: stat-1-value
        type: text
        z: 20
        x: 100
        y: 520
        width: 420
        height: 0
        content: { type: plain, value: "$2.4M" }
        style: { font_family: $heading, font_size: 88, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }
      - id: stat-1-caption
        type: text
        z: 21
        x: 100
        y: 660
        width: 420
        height: 0
        content: { type: plain, value: "ARR at year-end" }
        style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.4 }
      # Stat 2 — top right
      - id: stat-2-value
        type: text
        z: 22
        x: 580
        y: 520
        width: 420
        height: 0
        content: { type: plain, value: "12" }
        style: { font_family: $heading, font_size: 88, font_weight: 900, color: $accent, line_height: 1, letter_spacing: -0.03 }
      - id: stat-2-caption
        type: text
        z: 23
        x: 580
        y: 660
        width: 420
        height: 0
        content: { type: plain, value: "new hires onboarded" }
        style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.4 }
      # Stat 3 — bottom left
      - id: stat-3-value
        type: text
        z: 24
        x: 100
        y: 920
        width: 420
        height: 0
        content: { type: plain, value: "47" }
        style: { font_family: $heading, font_size: 88, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }
      - id: stat-3-caption
        type: text
        z: 25
        x: 100
        y: 1060
        width: 420
        height: 0
        content: { type: plain, value: "customer interviews" }
        style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.4 }
      # Stat 4 — bottom right
      - id: stat-4-value
        type: text
        z: 26
        x: 580
        y: 920
        width: 420
        height: 0
        content: { type: plain, value: "1" }
        style: { font_family: $heading, font_size: 88, font_weight: 900, color: $accent, line_height: 1, letter_spacing: -0.03 }
      - id: stat-4-caption
        type: text
        z: 27
        x: 580
        y: 1060
        width: 420
        height: 0
        content: { type: plain, value: "product pivot, no regrets" }
        style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.4 }

  # ── Slide 3 · What Worked ──────────────────────────────────
  - id: worked
    label: What Worked
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "3/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 160
        width: 920
        height: 0
        content: { type: plain, value: "WORKED" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "Three things\nwe got right." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - { id: win-1-mark, type: circle, z: 20, cx: 110, cy: 600, rx: 12, ry: 12, fill: { type: solid, color: "$accent" } }
      - id: win-1-text
        type: text
        z: 21
        x: 160
        y: 580
        width: 860
        height: 0
        content: { type: plain, value: "Talking to customers weekly, not quarterly. Every roadmap call started with their words, not ours." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: win-2-mark, type: circle, z: 22, cx: 110, cy: 820, rx: 12, ry: 12, fill: { type: solid, color: "$accent" } }
      - id: win-2-text
        type: text
        z: 23
        x: 160
        y: 800
        width: 860
        height: 0
        content: { type: plain, value: "Hiring slow. Twelve people in twelve months felt painful but kept the team coherent and the bar high." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: win-3-mark, type: circle, z: 24, cx: 110, cy: 1040, rx: 12, ry: 12, fill: { type: solid, color: "$accent" } }
      - id: win-3-text
        type: text
        z: 25
        x: 160
        y: 1020
        width: 860
        height: 0
        content: { type: plain, value: "Saying no to the obvious-but-wrong feature requests. Focus compounded faster than any single shipment." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }

  # ── Slide 4 · What Didn't ──────────────────────────────────
  - id: didnt-work
    label: What Didn't
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$secondary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "4/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 160
        width: 920
        height: 0
        content: { type: plain, value: "DIDN'T WORK" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "Three things\nwe got wrong." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - { id: miss-1-mark, type: rect, z: 20, x: 98, y: 588, width: 24, height: 24, radius: 4, fill: { type: solid, color: "$secondary" } }
      - id: miss-1-text
        type: text
        z: 21
        x: 160
        y: 580
        width: 860
        height: 0
        content: { type: plain, value: "Shipped a feature for one loud customer. Six months later we ripped it back out. Cost: a full quarter." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: miss-2-mark, type: rect, z: 22, x: 98, y: 808, width: 24, height: 24, radius: 4, fill: { type: solid, color: "$secondary" } }
      - id: miss-2-text
        type: text
        z: 23
        x: 160
        y: 800
        width: 860
        height: 0
        content: { type: plain, value: "Delayed the pivot for two quarters longer than we should have. The data was clear in spring, we acted in fall." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: miss-3-mark, type: rect, z: 24, x: 98, y: 1028, width: 24, height: 24, radius: 4, fill: { type: solid, color: "$secondary" } }
      - id: miss-3-text
        type: text
        z: 25
        x: 160
        y: 1020
        width: 860
        height: 0
        content: { type: plain, value: "Under-invested in onboarding. New hires took twice as long to ramp as they should have." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }

  # ── Slide 5 · What's Next + CTA ────────────────────────────
  - id: whats-next
    label: What's Next
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "5/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 160
        width: 920
        height: 0
        content: { type: plain, value: "WHAT'S NEXT" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: year
        type: text
        z: 12
        x: 80
        y: 230
        width: 920
        height: 0
        content: { type: plain, value: "2026" }
        style: { font_family: $heading, font_size: 220, font_weight: 900, color: $text, line_height: 1, letter_spacing: -0.05 }
      - { id: pri-1-mark, type: rect, z: 20, x: 80, y: 590, width: 56, height: 56, radius: 28, fill: { type: solid, color: "$primary" } }
      - id: pri-1-num
        type: text
        z: 21
        x: 80
        y: 604
        width: 56
        height: 0
        content: { type: plain, value: "1" }
        style: { font_family: $heading, font_size: 26, font_weight: 800, color: $background, text_align: center }
      - id: pri-1-text
        type: text
        z: 22
        x: 170
        y: 602
        width: 830
        height: 0
        content: { type: plain, value: "Reach $10M ARR with the same headcount." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: pri-2-mark, type: rect, z: 23, x: 80, y: 740, width: 56, height: 56, radius: 28, fill: { type: solid, color: "$primary" } }
      - id: pri-2-num
        type: text
        z: 24
        x: 80
        y: 754
        width: 56
        height: 0
        content: { type: plain, value: "2" }
        style: { font_family: $heading, font_size: 26, font_weight: 800, color: $background, text_align: center }
      - id: pri-2-text
        type: text
        z: 25
        x: 170
        y: 752
        width: 830
        height: 0
        content: { type: plain, value: "Ship the platform layer customers keep asking for." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: pri-3-mark, type: rect, z: 26, x: 80, y: 890, width: 56, height: 56, radius: 28, fill: { type: solid, color: "$primary" } }
      - id: pri-3-num
        type: text
        z: 27
        x: 80
        y: 904
        width: 56
        height: 0
        content: { type: plain, value: "3" }
        style: { font_family: $heading, font_size: 26, font_weight: 800, color: $background, text_align: center }
      - id: pri-3-text
        type: text
        z: 28
        x: 170
        y: 902
        width: 830
        height: 0
        content: { type: plain, value: "Write more, in public, with the receipts." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: cta-bg, type: rect, z: 30, x: 80, y: 1060, width: 420, height: 80, radius: 40, fill: { type: solid, color: "$primary" } }
      - id: cta-text
        type: text
        z: 31
        x: 80
        y: 1084
        width: 420
        height: 0
        content: { type: plain, value: "Follow along →" }
        style: { font_family: $body, font_size: 22, font_weight: 700, color: $background, text_align: center }
      - id: handle
        type: text
        z: 32
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

slots:
  - { id: cover_year,      path: "pages[0].layers[4].content.value",  type: text, hint: "Cover year",           default: "2025" }
  - { id: cover_subtitle,  path: "pages[0].layers[5].content.value",  type: text, hint: "Cover subtitle",       default: "Lessons from a hard year of building." }
  - { id: stat_1_value,    path: "pages[1].layers[7].content.value",  type: text, hint: "Stat 1 value",         default: "$2.4M" }
  - { id: stat_2_value,    path: "pages[1].layers[9].content.value",  type: text, hint: "Stat 2 value",         default: "12" }
  - { id: stat_3_value,    path: "pages[1].layers[11].content.value", type: text, hint: "Stat 3 value",         default: "47" }
  - { id: stat_4_value,    path: "pages[1].layers[13].content.value", type: text, hint: "Stat 4 value",         default: "1" }
  - { id: next_year,       path: "pages[4].layers[4].content.value",  type: text, hint: "Next year headline",   default: "2026" }
  - { id: handle,          path: "pages[4].layers[16].content.value", type: text, hint: "Your LinkedIn handle", default: "@yourhandle" }
