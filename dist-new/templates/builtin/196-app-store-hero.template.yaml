_protocol: template/v1

# App store feature hero — 1080×1920 portrait, sunset-glow theme.
# App icon, name, 5-star row, tagline, GET IT NOW CTA, downloads social proof.
meta:
  id: tmpl-app-store-hero
  name: App Store Hero
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [app, screen, app-store, marketing, portrait, sunset]
  description: "App-store feature card with app icon, rating, tagline, install CTA, and social-proof line."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  # ── Background gradient ───────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: $background }
  - id: glow
    type: circle
    z: 1
    cx: 540
    cy: 1100
    rx: 700
    ry: 700
    fill: { type: none }
    opacity: 0.4

  # ── App icon ──────────────────────────────────────────────
  - id: icon-shadow
    type: rect
    z: 9
    x: 340
    y: 280
    width: 400
    height: 400
    radius: 88
    fill: { type: solid, color: "rgba(0,0,0,0.25)" }
    opacity: 0.6

  - id: icon-bg
    type: rect
    z: 10
    x: 340
    y: 260
    width: 400
    height: 400
    radius: 88
    fill: { type: solid, color: $primary }
    effects:
      shadow:
        - { dx: 0, dy: 32, blur: 64, color: "rgba(0,0,0,0.35)" }

  - id: icon-letter
    type: text
    z: 11
    x: 340
    y: 340
    width: 400
    height: 0
    content: { type: plain, value: "L" }
    style:
      font_family: $heading
      font_size: 240
      font_weight: 900
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  # ── App name ──────────────────────────────────────────────
  - id: app-name
    type: text
    z: 20
    x: 60
    y: 740
    width: 960
    height: 0
    content: { type: plain, value: "Lumen Notes" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 800
      color: $text
      text_align: center
      letter_spacing: -0.02

  - id: category
    type: text
    z: 21
    x: 60
    y: 830
    width: 960
    height: 0
    content: { type: plain, value: "Productivity · Editor's Choice" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      text_align: center

  # ── 5-star row ────────────────────────────────────────────
  - id: star-1
    type: path
    z: 30
    d: "M 360 920 L 372 950 L 404 952 L 380 974 L 388 1006 L 360 988 L 332 1006 L 340 974 L 316 952 L 348 950 Z"
    fill: { type: solid, color: "$accent" }

  - id: star-2
    type: path
    z: 31
    d: "M 440 920 L 452 950 L 484 952 L 460 974 L 468 1006 L 440 988 L 412 1006 L 420 974 L 396 952 L 428 950 Z"
    fill: { type: solid, color: "$accent" }

  - id: star-3
    type: path
    z: 32
    d: "M 520 920 L 532 950 L 564 952 L 540 974 L 548 1006 L 520 988 L 492 1006 L 500 974 L 476 952 L 508 950 Z"
    fill: { type: solid, color: "$accent" }

  - id: star-4
    type: path
    z: 33
    d: "M 600 920 L 612 950 L 644 952 L 620 974 L 628 1006 L 600 988 L 572 1006 L 580 974 L 556 952 L 588 950 Z"
    fill: { type: solid, color: "$accent" }

  - id: star-5
    type: path
    z: 34
    d: "M 680 920 L 692 950 L 724 952 L 700 974 L 708 1006 L 680 988 L 652 1006 L 660 974 L 636 952 L 668 950 Z"
    fill: { type: solid, color: "$accent" }

  - id: rating
    type: text
    z: 35
    x: 60
    y: 1030
    width: 960
    height: 0
    content: { type: plain, value: "4.9  ·  12,847 ratings" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted
      text_align: center

  # ── Tagline ───────────────────────────────────────────────
  - id: tagline
    type: text
    z: 40
    x: 80
    y: 1140
    width: 920
    height: 0
    content: { type: plain, value: "Capture, organize, and rediscover\neverything that matters." }
    style:
      font_family: $heading
      font_size: 38
      font_weight: 700
      color: $text
      text_align: center
      line_height: 1.25
      letter_spacing: -0.01

  # ── Get it CTA ────────────────────────────────────────────
  - id: cta-bg
    type: rect
    z: 50
    x: 140
    y: 1400
    width: 800
    height: 120
    radius: 60
    fill: { type: solid, color: "$text" }
    effects:
      shadow:
        - { dx: 0, dy: 16, blur: 32, color: "rgba(0,0,0,0.32)" }

  - id: cta-text
    type: text
    z: 51
    x: 140
    y: 1432
    width: 800
    height: 0
    content: { type: plain, value: "GET IT NOW" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 800
      color: $background
      text_align: center
      letter_spacing: 0.05

  # ── Social proof ──────────────────────────────────────────
  - id: social-proof
    type: text
    z: 60
    x: 60
    y: 1620
    width: 960
    height: 0
    content: { type: plain, value: "Loved by 1M+ creators in 142 countries" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      text_align: center

  - id: footer
    type: text
    z: 61
    x: 60
    y: 1830
    width: 960
    height: 0
    content: { type: plain, value: "Free · in-app purchases available" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: center
      letter_spacing: 0.08

slots:
  - { id: app_name, path: "layers[5].content.value",  type: text, hint: "App name",       default: "Lumen Notes" }
  - { id: tagline,  path: "layers[13].content.value", type: text, hint: "Tagline (2 lines)", default: "Capture, organize, and rediscover\neverything that matters." }
