_protocol: template/v1

# Sudoku puzzle — 1080×1500 portrait, light-clean.
# 9x9 grid divided into 3x3 sub-grids with thick borders, sample numbers, difficulty stars, puzzle metadata.
meta:
  id: tmpl-sudoku-grid
  name: Sudoku Grid
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, sudoku, puzzle, game, logic, light, printable]
  description: "Sudoku puzzle grid with 9x9 cells divided into 3x3 sub-grids, sample pre-filled numbers, difficulty stars, and puzzle metadata."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1500
    fill: { type: solid, color: "$background" }

  # Header
  - id: title
    type: text
    z: 1
    x: 60
    y: 80
    width: 960
    height: 0
    content: { type: plain, value: "SUDOKU" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: "$text"
      text_align: center
      letter_spacing: 0.18
      text_transform: uppercase

  - id: subtitle
    type: text
    z: 2
    x: 60
    y: 156
    width: 960
    height: 0
    content: { type: plain, value: "Fill each row, column, and 3×3 box with digits 1–9" }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: "$text_muted"
      text_align: center

  - id: meta-bar
    type: rect
    z: 3
    x: 60
    y: 200
    width: 960
    height: 60
    radius: 6
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: puzzle-id
    type: text
    z: 4
    x: 80
    y: 220
    width: 400
    height: 0
    content: { type: plain, value: "PUZZLE #1247  ·  2026-05-17" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: "$text"
      letter_spacing: 0.3

  - id: difficulty
    type: text
    z: 5
    x: 600
    y: 220
    width: 400
    height: 0
    content: { type: plain, value: "DIFFICULTY  ★ ★ ★ ★ ☆" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$primary"
      text_align: right
      letter_spacing: 0.3
      text_transform: uppercase

  # Grid background — 720×720 starting at (180, 320), cells 80×80
