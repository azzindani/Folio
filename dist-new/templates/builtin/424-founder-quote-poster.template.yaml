_protocol: template/v1

# Single-page founder quote poster. LinkedIn 4:5 portrait.
# Eyebrow + big quotation glyph + display serif italic quote + attribution. Editorial-cream theme.
meta:
  id: tmpl-founder-quote-poster
  name: Founder Quote Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, startup, founder, quote, editorial, 4-5, editorial-cream]
  description: "LinkedIn 4:5 founder quote poster: large quotation glyph, display serif italic quote, and attribution."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 10, fill: { type: solid, color: "$primary" } }

  - { id: accent-band-bottom, type: rect, z: 2, x: 0, y: 1490, width: 1200, height: 10, fill: { type: solid, color: "$primary" } }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 100
    width: 1040
    height: 0
    content: { type: plain, value: "FROM THE FOUNDER" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: glyph
    type: text
    z: 21
    x: 80
    y: 200
    width: 400
    height: 0
    content: { type: plain, value: "“" }
    style:
      font_family: $heading
      font_size: 360
      font_weight: 900
      color: $primary
      line_height: 0.9
      letter_spacing: -0.04

  - id: quote
    type: text
    z: 22
    x: 80
    y: 540
    width: 1040
    height: 0
    content: { type: plain, value: "Ideas are easy.\nExecution is\neverything." }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 600
      font_style: italic
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - { id: divider, type: rect, z: 10, x: 80, y: 1140, width: 240, height: 3, fill: { type: solid, color: "$primary" } }

  - id: author-name
    type: text
    z: 30
    x: 80
    y: 1180
    width: 1040
    height: 0
    content: { type: plain, value: "— John Doerr" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 700
      color: $text
      line_height: 1.3
      letter_spacing: -0.01

  - id: author-title
    type: text
    z: 31
    x: 80
    y: 1230
    width: 1040
    height: 0
    content: { type: plain, value: "Chairman, Kleiner Perkins · author, Measure What Matters" }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.4

  - id: source
    type: text
    z: 40
    x: 80
    y: 1410
    width: 700
    height: 0
    content: { type: plain, value: "folio.studio · @folio" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      line_height: 1.4

  - id: page-mark
    type: text
    z: 41
    x: 880
    y: 1410
    width: 240
    height: 0
    content: { type: plain, value: "QUOTE · 2026" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: right
      text_transform: uppercase

animations:
  glyph:
    loop: { type: breathe, duration: 3200, scale: 1.05 }
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  author-name:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }
  author-title:
    enter: { type: fade_up, duration: 500, delay: 1000, easing: ease-out }

slots:
  - { id: eyebrow,      path: "layers[3].content.value", type: text, hint: "Eyebrow tag",      default: "FROM THE FOUNDER" }
  - { id: glyph,        path: "layers[4].content.value", type: text, hint: "Quote glyph",      default: "“" }
  - { id: quote,        path: "layers[5].content.value", type: text, hint: "Quote text",       default: "Ideas are easy.\nExecution is\neverything." }
  - { id: author_name,  path: "layers[7].content.value", type: text, hint: "Author name",      default: "— John Doerr" }
  - { id: author_title, path: "layers[8].content.value", type: text, hint: "Author title",     default: "Chairman, Kleiner Perkins · author, Measure What Matters" }
  - { id: source,       path: "layers[9].content.value", type: text, hint: "Source/handle",    default: "folio.studio · @folio" }
