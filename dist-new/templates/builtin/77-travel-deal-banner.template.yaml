_protocol: template/v1

# Travel deal wide banner — 1500×750 (2:1). Pastel-dream theme.
# Big "FROM $XXX" price left, destination + simple plane-icon shapes, duration, inclusions row, validity + deadline.
meta:
  id: tmpl-travel-deal-banner
  name: Travel Deal Banner
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, banner, travel, deal, sale, wide, pastel]

document:
  width: 1500
  height: 750
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # --- background ---
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 750
    fill: { type: solid, color: $background }
  # --- decorative pastel splash circle right ---
  - id: splash
    type: circle
    z: 5
    cx: 1380
    cy: 120
    rx: 220
    ry: 220
    fill: { type: none }
    opacity: 0.5

  # --- LEFT: big price ---
  - id: from-label
    type: text
    z: 10
    x: 80
    y: 130
    width: 600
    height: 0
    content: { type: plain, value: "FROM" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: from-price
    type: text
    z: 11
    x: 80
    y: 170
    width: 600
    height: 0
    content: { type: plain, value: "$499" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 800
      color: $text
      line_height: 1.0
      letter_spacing: -0.04

  # --- RIGHT TOP: destination + plane icon ---
  - id: plane-body
    type: text
    z: 20
    x: 760
    y: 80
    width: 80
    height: 0
    content: { type: plain, value: "✈" }
    style:
      font_family: $body
      font_size: 72
      color: $accent
      text_align: center

  - id: plane-wing
    type: rect
    z: 21
    x: 0
    y: 0
    width: 0
    height: 0
    fill: { type: solid, color: "$accent" }

  - id: plane-tail
    type: rect
    z: 22
    x: 0
    y: 0
    width: 0
    height: 0
    fill: { type: solid, color: "$accent" }

  - id: destination
    type: text
    z: 25
    x: 840
    y: 130
    width: 600
    height: 0
    content: { type: plain, value: "Bali, Indonesia" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.015

  - id: duration
    type: text
    z: 26
    x: 760
    y: 200
    width: 680
    height: 0
    content: { type: plain, value: "5 nights · 6 days" }
    style:
      font_family: $body
      font_size: 26
      font_weight: 500
      color: $text_muted

  # --- inclusions row (3 small icon dots + words) ---
  - id: inc1-dot
    type: circle
    z: 30
    cx: 780
    cy: 320
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: inc1-text
    type: text
    z: 31
    x: 800
    y: 308
    width: 220
    height: 0
    content: { type: plain, value: "Flight" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  - id: inc2-dot
    type: circle
    z: 32
    cx: 980
    cy: 320
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: inc2-text
    type: text
    z: 33
    x: 1000
    y: 308
    width: 220
    height: 0
    content: { type: plain, value: "Hotel" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  - id: inc3-dot
    type: circle
    z: 34
    cx: 1180
    cy: 320
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: inc3-text
    type: text
    z: 35
    x: 1200
    y: 308
    width: 240
    height: 0
    content: { type: plain, value: "Meals" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  # --- validity + deadline footer ---
  - id: foot-rule
    type: rect
    z: 40
    x: 80
    y: 600
    width: 1340
    height: 1
    fill: { type: solid, color: "$border" }

  - id: validity
    type: text
    z: 41
    x: 80
    y: 625
    width: 700
    height: 0
    content: { type: plain, value: "Valid travel: Jul 1 – Sep 30, 2026" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text

  - id: deadline
    type: text
    z: 42
    x: 720
    y: 625
    width: 700
    height: 0
    content: { type: plain, value: "Book by June 15 · Limited seats" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $primary
      text_align: right

slots:
  - { id: from_price,    path: "layers[3].content.value",  type: text, hint: "Headline price (incl. $)",   default: "$499" }
  - { id: destination,   path: "layers[7].content.value",  type: text, hint: "Destination",                 default: "Bali, Indonesia" }
  - { id: duration_text, path: "layers[8].content.value",  type: text, hint: "Trip duration",               default: "5 nights · 6 days" }
  - { id: inclusion_1,   path: "layers[10].content.value", type: text, hint: "Inclusion 1",                 default: "Flight" }
  - { id: inclusion_2,   path: "layers[12].content.value", type: text, hint: "Inclusion 2",                 default: "Hotel" }
  - { id: inclusion_3,   path: "layers[14].content.value", type: text, hint: "Inclusion 3",                 default: "Meals" }
  - { id: validity_dates,path: "layers[16].content.value", type: text, hint: "Validity dates",              default: "Valid travel: Jul 1 – Sep 30, 2026" }
  - { id: deadline,      path: "layers[17].content.value", type: text, hint: "Booking deadline message",    default: "Book by June 15 · Limited seats" }
