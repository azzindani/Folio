    rx: 14
    ry: 14
    fill: { type: solid, color: "#FFFFFF" }

  # ── Energy usage chart ────────────────────────────────────
  - id: chart-bg
    type: rect
    z: 80
    x: 860
    y: 460
    width: 1000
    height: 560
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: chart-title
    type: text
    z: 81
    x: 894
    y: 500
    width: 600
    height: 0
    content: { type: plain, value: "Energy Usage · This Week" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text

  - id: chart-sub
    type: text
    z: 82
    x: 894
    y: 540
    width: 600
    height: 0
    content: { type: plain, value: "Total: 142 kWh · ↓ 8% vs last week" }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted

  # Bars
  - id: bar-mon
    type: rect
    z: 83
    x: 920
    y: 720
    width: 100
    height: 240
    radius: 8
