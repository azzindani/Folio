    width: 940
    height: 0
    content: { type: plain, value: "M     T     W     T     F     S     S" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: left
      letter_spacing: 0.4

slots:
  - { id: home_name,    path: "layers[1].content.value", type: text, hint: "Home name",     default: "Maple Street Home" }
  - { id: current_temp, path: "layers[5].content.value", type: text, hint: "Current temperature",  default: "72°F" }
