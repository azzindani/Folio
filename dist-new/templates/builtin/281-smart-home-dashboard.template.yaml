    y: 388
    width: 80
    height: 36
    radius: 18
    fill: { type: solid, color: "$primary" }

  - id: tile-music-knob
    type: circle
    z: 55
    cx: 1596
    cy: 406
    rx: 14
    ry: 14
    fill: { type: solid, color: "#FFFFFF" }

  # ── Device tile: Camera ───────────────────────────────────
  - id: tile-cam-bg
    type: rect
    z: 60
    x: 60
    y: 460
    width: 380
    height: 220
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: tile-cam-icon
    type: rect
    z: 61
    x: 88
    y: 502
    width: 44
    height: 32
    radius: 6
    fill: { type: solid, color: "$primary" }

  - id: tile-cam-name
    type: text
    z: 62
    x: 84
    y: 572
    width: 320
    height: 0
    content: { type: plain, value: "Driveway Cam" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text

  - id: tile-cam-status
    type: text
    z: 63
    x: 84
    y: 606
    width: 200
    height: 0
    content: { type: plain, value: "Recording" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  - id: tile-cam-toggle
    type: rect
    z: 64
    x: 332
    y: 628
    width: 80
    height: 36
    radius: 18
    fill: { type: solid, color: "$primary" }

  - id: tile-cam-knob
    type: circle
    z: 65
    cx: 396
    cy: 646
    rx: 14
    ry: 14
    fill: { type: solid, color: "#FFFFFF" }

  # ── Device tile: Vacuum ───────────────────────────────────
  - id: tile-vac-bg
    type: rect
    z: 70
    x: 460
    y: 460
    width: 380
    height: 220
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: tile-vac-icon
    type: circle
    z: 71
    cx: 510
    cy: 520
    rx: 22
    ry: 22
    fill: { type: solid, color: "$accent" }

  - id: tile-vac-name
    type: text
    z: 72
    x: 484
    y: 572
    width: 320
    height: 0
    content: { type: plain, value: "Robot Vacuum" }
    style:
      font_family: $heading
      font_size: 22
