_protocol: template/v1

# Smart-home dashboard — 1920×1080 landscape, light-clean theme.
# 6 device tiles, room temperature widget, energy-usage bar chart.
meta:
  id: tmpl-smart-home-dashboard
  name: Smart Home Dashboard
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [dashboard, smart-home, iot, controls, landscape, light]
  description: "Smart-home control panel with 6 device tile cards, temperature widget, and an energy-usage bar chart."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Header ────────────────────────────────────────────────
  - id: home-name
    type: text
    z: 10
    x: 60
    y: 56
    width: 1000
    height: 0
    content: { type: plain, value: "Maple Street Home" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: $text
      letter_spacing: -0.02

  - id: home-sub
    type: text
    z: 11
    x: 60
    y: 110
    width: 1000
    height: 0
    content: { type: plain, value: "Good evening · 7 devices online" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  # ── Temperature widget (right side header) ────────────────
  - id: temp-bg
    type: rect
    z: 12
    x: 1500
    y: 40
    width: 360
    height: 120
    radius: 20
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: temp-label
    type: text
    z: 13
    x: 1524
    y: 64
    width: 200
    height: 0
    content: { type: plain, value: "LIVING ROOM" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.2

  - id: current-temp
    type: text
    z: 14
    x: 1524
    y: 88
    width: 320
    height: 0
    content: { type: plain, value: "72°F" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 800
      color: $primary
      letter_spacing: -0.02

  # ── Device tile: Light ────────────────────────────────────
  - id: tile-light-bg
    type: rect
    z: 20
    x: 60
    y: 220
    width: 380
    height: 220
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: tile-light-icon
    type: circle
    z: 21
    cx: 110
    cy: 280
    rx: 24
    ry: 24
    fill: { type: solid, color: "$accent" }

  - id: tile-light-name
    type: text
    z: 22
    x: 84
    y: 332
    width: 320
    height: 0
    content: { type: plain, value: "Living Room Light" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text

  - id: tile-light-status
    type: text
    z: 23
    x: 84
    y: 366
    width: 200
    height: 0
    content: { type: plain, value: "On · 80%" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  - id: tile-light-toggle
    type: rect
    z: 24
    x: 332
    y: 388
    width: 80
    height: 36
    radius: 18
    fill: { type: solid, color: "$primary" }

  - id: tile-light-knob
    type: circle
    z: 25
    cx: 396
    cy: 406
    rx: 14
    ry: 14
    fill: { type: solid, color: "#FFFFFF" }

  # ── Device tile: Thermostat ───────────────────────────────
  - id: tile-therm-bg
    type: rect
    z: 30
    x: 460
    y: 220
    width: 380
    height: 220
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: tile-therm-icon
    type: circle
    z: 31
    cx: 510
    cy: 280
    rx: 24
    ry: 24
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 4 }

  - id: tile-therm-name
    type: text
    z: 32
    x: 484
    y: 332
    width: 320
    height: 0
    content: { type: plain, value: "Thermostat" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text

  - id: tile-therm-status
    type: text
    z: 33
    x: 484
    y: 366
    width: 200
    height: 0
    content: { type: plain, value: "Auto · 72°F" }
    style:
