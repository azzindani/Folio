      font_size: 16
      color: $text_muted

  - id: tile-therm-toggle
    type: rect
    z: 34
    x: 732
    y: 388
    width: 80
    height: 36
    radius: 18
    fill: { type: solid, color: "$primary" }

  - id: tile-therm-knob
    type: circle
    z: 35
    cx: 796
    cy: 406
    rx: 14
    ry: 14
    fill: { type: solid, color: "#FFFFFF" }

  # ── Device tile: Lock ─────────────────────────────────────
  - id: tile-lock-bg
    type: rect
    z: 40
    x: 860
    y: 220
    width: 380
    height: 220
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: tile-lock-icon
    type: rect
    z: 41
    x: 894
    y: 264
    width: 32
    height: 28
    radius: 4
    fill: { type: solid, color: "$primary" }

  - id: tile-lock-name
    type: text
    z: 42
    x: 884
    y: 332
    width: 320
    height: 0
    content: { type: plain, value: "Front Door" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text

  - id: tile-lock-status
    type: text
    z: 43
    x: 884
    y: 366
    width: 200
    height: 0
    content: { type: plain, value: "Locked" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  - id: tile-lock-toggle
    type: rect
    z: 44
    x: 1132
    y: 388
    width: 80
    height: 36
    radius: 18
    fill: { type: solid, color: "$border" }

  - id: tile-lock-knob
    type: circle
    z: 45
    cx: 1150
    cy: 406
    rx: 14
    ry: 14
    fill: { type: solid, color: "#FFFFFF" }

  # ── Device tile: Music ────────────────────────────────────
  - id: tile-music-bg
    type: rect
    z: 50
    x: 1260
    y: 220
    width: 380
    height: 220
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 16, color: "rgba(0,0,0,0.06)" }

  - id: tile-music-icon
    type: circle
    z: 51
    cx: 1310
    cy: 280
    rx: 22
    ry: 22
    fill: { type: solid, color: "$secondary" }

  - id: tile-music-name
    type: text
    z: 52
    x: 1284
    y: 332
    width: 320
    height: 0
    content: { type: plain, value: "Kitchen Speaker" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text

  - id: tile-music-status
    type: text
    z: 53
    x: 1284
    y: 366
    width: 280
    height: 0
    content: { type: plain, value: "Playing · Lo-Fi" }
    style:
      font_family: $body
      font_size: 16
