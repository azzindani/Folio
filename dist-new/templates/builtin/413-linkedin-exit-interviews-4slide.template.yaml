_protocol: template/v1

# 4-slide LinkedIn carousel — The 4 questions that make exit interviews useful. High contrast.
# Cover → Why most are theater → 2 question slides (display question + 1 paragraph why) → CTA.
meta:
  id: tmpl-linkedin-exit-interviews-4slide
  name: LinkedIn Exit Interviews (4 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, hr, exit-interview, retention, 4-5]
  description: "4-slide LinkedIn carousel: questions that make exit interviews useful."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: high-contrast

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "1/4" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 440
        width: 960
        height: 0
        content: { type: plain, value: "RETENTION · DIAGNOSTICS" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 500
        width: 960
        height: 0
        content: { type: plain, value: "The 4 questions\nthat make exit\ninterviews useful." }
        style: { font_family: $heading, font_size: 76, font_weight: 900, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 13
        x: 60
        y: 920
        width: 960
        height: 0
        content: { type: plain, value: "Stop running a checkbox. Start running a diagnostic. Swipe →" }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: handle
        type: text
        z: 14
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }

  # ── Slide 2 · Why most are theater ─────────────────────────
  - id: theater
    label: Why theater
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "2/4" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "THE PROBLEM" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Why most exit interviews are theater." }
        style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body-1
        type: text
        z: 13
        x: 60
        y: 480
        width: 960
        height: 0
        content: { type: plain, value: "Departing employees soften their feedback. They want the reference. They want the bridge intact." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.55 }
      - id: body-2
        type: text
        z: 14
        x: 60
        y: 720
        width: 960
        height: 0
        content: { type: plain, value: "Generic questions get generic answers — \"better opportunity, more growth.\" You learn nothing." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.55 }
      - id: body-3
        type: text
        z: 15
        x: 60
        y: 960
        width: 960
        height: 0
        content: { type: plain, value: "Ask these four instead. Names below." }
        style: { font_family: $body, font_size: 26, font_weight: 600, color: $primary, line_height: 1.4 }

  # ── Slide 3 · Question 01 ──────────────────────────────────
  - id: q1
    label: Question 01
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "3/4" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: number
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "QUESTION 01" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: question
        type: text
        z: 12
        x: 60
        y: 230
        width: 960
        height: 0
        content: { type: plain, value: "What happened\non the day you\nstarted looking?" }
        style: { font_family: $heading, font_size: 84, font_weight: 900, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: divider
        type: rect
        z: 15
        x: 60
        y: 880
        width: 960
        height: 1
        fill: { type: solid, color: "$text_muted" }
        opacity: 0.3
      - id: why-label
        type: text
        z: 30
        x: 60
        y: 920
        width: 960
        height: 0
        content: { type: plain, value: "WHY IT WORKS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36 }
      - id: why-text
        type: text
        z: 31
        x: 60
        y: 960
        width: 960
        height: 0
        content: { type: plain, value: "\"Why are you leaving\" gets a rehearsed answer. \"What happened that day\" gets a story — and stories carry the real reason underneath." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.55 }

  # ── Slide 4 · Question 02 + CTA ────────────────────────────
  - id: q2
    label: Question 02 + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$primary" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "4/4" }
        style: { font_family: $mono, font_size: 18, color: "#FFFFFF" }
      - id: number
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "QUESTION 02" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: question
        type: text
        z: 12
        x: 60
        y: 230
        width: 960
        height: 0
        content: { type: plain, value: "What would have\nkept you?" }
        style: { font_family: $heading, font_size: 96, font_weight: 900, color: "#FFFFFF", line_height: 1, letter_spacing: -0.03 }
      - id: why-label
        type: text
        z: 30
        x: 60
        y: 700
        width: 960
        height: 0
        content: { type: plain, value: "WHY IT WORKS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: why-text
        type: text
        z: 31
        x: 60
        y: 740
        width: 960
        height: 0
        content: { type: plain, value: "Specific. Counterfactual. Forces the person to name the lever you didn't pull. Notice the patterns across exits — that is your retention roadmap." }
        style: { font_family: $body, font_size: 24, color: "#F0F0FF", line_height: 1.55 }
      - id: cta-heading
        type: text
        z: 40
        x: 60
        y: 1000
        width: 960
        height: 0
        content: { type: plain, value: "Run the next one\nlike a diagnostic." }
        style: { font_family: $heading, font_size: 52, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.02 }
      - id: cta-btn
        type: rect
        z: 41
        x: 60
        y: 1170
        width: 280
        height: 60
        radius: 30
        fill: { type: solid, color: "#FFFFFF" }
      - id: cta-text
        type: text
        z: 42
        x: 60
        y: 1186
        width: 280
        height: 0
        content: { type: plain, value: "Follow →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#0F172A", text_align: center }
      - id: handle
        type: text
        z: 50
        x: 60
        y: 1280
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }

slots:
  - { id: cover_title,        path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",      default: "The 4 questions\nthat make exit\ninterviews useful." }
  - { id: cover_tagline,      path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",       default: "Stop running a checkbox. Start running a diagnostic. Swipe →" }
  - { id: theater_title,      path: "pages[1].layers[4].content.value", type: text, hint: "Theater title",       default: "Why most exit interviews are theater." }
  - { id: theater_body_1,     path: "pages[1].layers[5].content.value", type: text, hint: "Theater body 1",      default: "Departing employees soften their feedback." }
  - { id: theater_body_2,     path: "pages[1].layers[6].content.value", type: text, hint: "Theater body 2",      default: "Generic questions get generic answers." }
  - { id: q1_question,        path: "pages[2].layers[4].content.value", type: text, hint: "Question 1 display",  default: "What happened\non the day you\nstarted looking?" }
  - { id: q1_why,             path: "pages[2].layers[7].content.value", type: text, hint: "Question 1 why",      default: "\"Why are you leaving\" gets a rehearsed answer. \"What happened that day\" gets a story." }
  - { id: q2_question,        path: "pages[3].layers[4].content.value", type: text, hint: "Question 2 display",  default: "What would have\nkept you?" }
  - { id: q2_why,             path: "pages[3].layers[6].content.value", type: text, hint: "Question 2 why",      default: "Specific. Counterfactual. Forces the person to name the lever you didn't pull." }
  - { id: cta_heading,        path: "pages[3].layers[7].content.value", type: text, hint: "CTA heading",         default: "Run the next one\nlike a diagnostic." }
