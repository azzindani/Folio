_protocol: template/v1

# Electronic album cover (1400×1400 square).
# Neon-bloom: layered radial circles, artist name top, album title huge center,
# track-count + duration label bottom.
meta:
  id: tmpl-album-cover-electronic
  name: Album Cover — Electronic
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, album, music, electronic, neon, square]
  description: "Neon-bloom electronic album cover with gradient circles and bold centered title."

document:
  width: 1400
  height: 1400
  unit: px
  dpi: 96

theme:
  ref: neon-bloom

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1400
    height: 1400
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  - id: bloom-center
    type: circle
    z: 1
    cx: 700
    cy: 700
    rx: 600
    ry: 600
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 80 }
    opacity: 0.6

  - id: bloom-tl
    type: circle
    z: 2
    cx: 240
    cy: 240
    rx: 360
    ry: 360
    fill:
      type: radial
      stops:
        - { color: "$secondary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.5

  - id: bloom-br
    type: circle
    z: 3
    cx: 1160
    cy: 1160
    rx: 400
    ry: 400
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.45

  - id: ring-1
    type: circle
    z: 4
    cx: 700
    cy: 700
    rx: 540
    ry: 540
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }
    opacity: 0.4

  - id: ring-2
    type: circle
    z: 5
    cx: 700
    cy: 700
    rx: 460
    ry: 460
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$secondary", width: 1 }
    opacity: 0.6

  - id: ring-3
    type: circle
    z: 6
    cx: 700
    cy: 700
    rx: 380
    ry: 380
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 1 }
    opacity: 0.35

  - id: top-rule
    type: rect
    z: 10
    x: 100
    y: 130
    width: 1200
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: artist-name
    type: text
    z: 11
    x: 100
    y: 160
    width: 1200
    height: 0
    content: { type: plain, value: "ÆON COLLECTIVE" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 900
      color: $text
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: an-album-by
    type: text
    z: 12
    x: 100
    y: 220
    width: 1200
    height: 0
    content: { type: plain, value: "AN ALBUM IN ELEVEN MOVEMENTS" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: album-title-line-1
    type: text
    z: 20
    x: 100
    y: 580
    width: 1200
    height: 0
    content: { type: plain, value: "AFTER" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: $text
      line_height: 0.88
      letter_spacing: -0.03
      text_align: center
      text_transform: uppercase

  - id: album-title-line-2
    type: text
    z: 21
    x: 100
    y: 720
    width: 1200
    height: 0
    content: { type: plain, value: "HOURS" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 900
      color: $primary
      line_height: 0.88
      letter_spacing: -0.04
      text_align: center
      text_transform: uppercase

  - id: bottom-rule
    type: rect
    z: 30
    x: 100
    y: 1180
    width: 1200
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: track-info
    type: text
    z: 31
    x: 100
    y: 1210
    width: 1200
    height: 0
    content: { type: plain, value: "11 TRACKS · 58 MIN · MASTERED IN DOLBY ATMOS" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $text
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: catalog
    type: text
    z: 32
    x: 100
    y: 1250
    width: 1200
    height: 0
    content: { type: plain, value: "PRISM RECORDS · CAT. PR-0182" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: bottom-stamp
    type: text
    z: 33
    x: 100
    y: 1300
    width: 1200
    height: 0
    content: { type: plain, value: "© 2026" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $secondary
      letter_spacing: 0.42
      text_align: center

slots:
  - { id: artist_name, path: "layers[8].content.value",  type: text, hint: "Artist / band name",            default: "ÆON COLLECTIVE" }
  - { id: album_title, path: "layers[10].content.value", type: text, hint: "Album title line 1",            default: "AFTER" }
  - { id: album_title_line_2, path: "layers[11].content.value", type: text, hint: "Album title line 2",     default: "HOURS" }
  - { id: track_count, path: "layers[13].content.value", type: text, hint: "Track count + duration line",   default: "11 TRACKS · 58 MIN · MASTERED IN DOLBY ATMOS" }
  - { id: duration,    path: "layers[14].content.value", type: text, hint: "Label / catalog footer",        default: "PRISM RECORDS · CAT. PR-0182" }
