_protocol: template/v1

# 8-page wedding album — 1500×1500 square, editorial-cream theme.
# Cover → ceremony spread → reception → family portraits → candid spread →
# vows & readings → gratitude/thank-you → back cover.
meta:
  id: tmpl-wedding-album
  name: Wedding Album · 8 Pages
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, wedding, album, photography, editorial, square]
  description: "Elegant eight-page wedding album. Cover, ceremony and reception photo spreads, family portraits, candid moments, vows and readings, gratitude page, and photographer credits."

document:
  width: 1500
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: outer-frame, type: rect, z: 1, x: 100, y: 100, width: 1300, height: 1300, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
      - { id: inner-frame, type: rect, z: 2, x: 130, y: 130, width: 1240, height: 1240, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 }, opacity: 0.4 }
      - { id: ornament-top, type: text, z: 10, x: 100, y: 240, width: 1300, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 56, color: $primary, text_align: center } }
      - { id: kicker, type: text, z: 11, x: 100, y: 340, width: 1300, height: 0, content: { type: plain, value: "THE WEDDING OF" }, style: { font_family: $body, font_size: 22, color: $text_muted, text_align: center, letter_spacing: 0.6 } }
      - { id: name-1, type: text, z: 20, x: 100, y: 520, width: 1300, height: 0, content: { type: plain, value: "Eleanor" }, style: { font_family: $heading, font_size: 140, font_weight: 700, color: $text, font_style: italic, text_align: center, line_height: 1, letter_spacing: -0.02 } }
      - { id: amp, type: text, z: 21, x: 100, y: 700, width: 1300, height: 0, content: { type: plain, value: "&" }, style: { font_family: $heading, font_size: 88, color: $primary, text_align: center, font_style: italic } }
      - { id: name-2, type: text, z: 22, x: 100, y: 820, width: 1300, height: 0, content: { type: plain, value: "Theodore" }, style: { font_family: $heading, font_size: 140, font_weight: 700, color: $text, font_style: italic, text_align: center, line_height: 1, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 30, x: 700, y: 1020, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: date, type: text, z: 31, x: 100, y: 1080, width: 1300, height: 0, content: { type: plain, value: "the twenty-third of september" }, style: { font_family: $body, font_size: 22, font_style: italic, color: $text_muted, text_align: center, letter_spacing: 0.3 } }
      - { id: year, type: text, z: 32, x: 100, y: 1140, width: 1300, height: 0, content: { type: plain, value: "TWO THOUSAND TWENTY-SIX" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: $text, text_align: center, letter_spacing: 0.6 } }
      - { id: location, type: text, z: 33, x: 100, y: 1220, width: 1300, height: 0, content: { type: plain, value: "Hadley Manor · Cotswolds, England" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center, font_style: italic } }
      - { id: ornament-bot, type: text, z: 40, x: 100, y: 1320, width: 1300, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 40, color: $primary, text_align: center } }

  # ── Page 2 · Ceremony Spread ──────────────────────────────
  - id: ceremony
    label: Ceremony
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: chapter, type: text, z: 10, x: 100, y: 100, width: 1300, height: 0, content: { type: plain, value: "ONE · THE CEREMONY" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: rule-top, type: rect, z: 11, x: 700, y: 150, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: photo-1, type: rect, z: 20, x: 100, y: 200, width: 660, height: 500, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p1-text, type: text, z: 21, x: 100, y: 440, width: 660, height: 0, content: { type: plain, value: "[ aisle walk ]" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-2, type: rect, z: 20, x: 780, y: 200, width: 620, height: 240, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p2-text, z: 21, type: text, x: 780, y: 308, width: 620, height: 0, content: { type: plain, value: "[ rings exchanged ]" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-3, type: rect, z: 20, x: 780, y: 460, width: 620, height: 240, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p3-text, type: text, z: 21, x: 780, y: 568, width: 620, height: 0, content: { type: plain, value: "[ first kiss ]" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-4, type: rect, z: 20, x: 100, y: 720, width: 1300, height: 500, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p4-text, type: text, z: 21, x: 100, y: 960, width: 1300, height: 0, content: { type: plain, value: "[ recessional — wide shot ]" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center, font_style: italic } }
      - { id: caption, type: text, z: 30, x: 200, y: 1260, width: 1100, height: 0, content: { type: plain, value: "Vows exchanged beneath the oak at the south lawn, three o'clock on the dot — exactly as Theo's grandmother insisted." }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $text, text_align: center, line_height: 1.5 } }
      - { id: page-num, type: text, z: 40, x: 700, y: 1430, width: 100, height: 0, content: { type: plain, value: "·  2  ·" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 3 · Reception Spread ─────────────────────────────
  - id: reception
    label: Reception
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: chapter, type: text, z: 10, x: 100, y: 100, width: 1300, height: 0, content: { type: plain, value: "TWO · THE RECEPTION" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: rule-top, type: rect, z: 11, x: 700, y: 150, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: hero-photo, type: rect, z: 20, x: 100, y: 200, width: 1300, height: 540, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: hero-text, type: text, z: 21, x: 100, y: 460, width: 1300, height: 0, content: { type: plain, value: "[ the marquee at golden hour ]" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-2, type: rect, z: 30, x: 100, y: 760, width: 420, height: 380, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p2-text, type: text, z: 31, x: 100, y: 940, width: 420, height: 0, content: { type: plain, value: "[ first dance ]" }, style: { font_family: $body, font_size: 15, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-3, type: rect, z: 30, x: 540, y: 760, width: 420, height: 380, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p3-text, type: text, z: 31, x: 540, y: 940, width: 420, height: 0, content: { type: plain, value: "[ speeches ]" }, style: { font_family: $body, font_size: 15, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-4, type: rect, z: 30, x: 980, y: 760, width: 420, height: 380, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p4-text, type: text, z: 31, x: 980, y: 940, width: 420, height: 0, content: { type: plain, value: "[ cake cutting ]" }, style: { font_family: $body, font_size: 15, color: $text_muted, text_align: center, font_style: italic } }
      - { id: caption, type: text, z: 40, x: 200, y: 1200, width: 1100, height: 0, content: { type: plain, value: "Dinner under the linen marquee. Toasts from Eleanor's father at sunset. Dancing well past midnight." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, text_align: center, line_height: 1.5 } }
      - { id: ornament, type: text, z: 50, x: 700, y: 1340, width: 100, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 24, color: $primary, text_align: center } }
      - { id: page-num, type: text, z: 60, x: 700, y: 1430, width: 100, height: 0, content: { type: plain, value: "·  3  ·" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 4 · Family Portraits ─────────────────────────────
  - id: family
    label: Family Portraits
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: chapter, type: text, z: 10, x: 100, y: 100, width: 1300, height: 0, content: { type: plain, value: "THREE · FAMILY" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: rule-top, type: rect, z: 11, x: 700, y: 150, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: photo-main, type: rect, z: 20, x: 250, y: 200, width: 1000, height: 600, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: main-text, type: text, z: 21, x: 250, y: 488, width: 1000, height: 0, content: { type: plain, value: "[ both families together — south lawn ]" }, style: { font_family: $body, font_size: 18, color: $text_muted, text_align: center, font_style: italic } }
      - { id: main-cap, type: text, z: 22, x: 250, y: 820, width: 1000, height: 0, content: { type: plain, value: "Holloway & Marsh families, 4:15 pm" }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, text_align: center } }
      - { id: photo-1, type: rect, z: 30, x: 100, y: 900, width: 320, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p1-text, type: text, z: 31, x: 100, y: 1052, width: 320, height: 0, content: { type: plain, value: "[ parents of bride ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-2, type: rect, z: 30, x: 440, y: 900, width: 320, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p2-text, type: text, z: 31, x: 440, y: 1052, width: 320, height: 0, content: { type: plain, value: "[ parents of groom ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-3, type: rect, z: 30, x: 780, y: 900, width: 320, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p3-text, type: text, z: 31, x: 780, y: 1052, width: 320, height: 0, content: { type: plain, value: "[ siblings ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-4, type: rect, z: 30, x: 1120, y: 900, width: 280, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p4-text, type: text, z: 31, x: 1120, y: 1052, width: 280, height: 0, content: { type: plain, value: "[ grandparents ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: caption, type: text, z: 40, x: 200, y: 1280, width: 1100, height: 0, content: { type: plain, value: "Four generations gathered for the first time on either side." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, text_align: center } }
      - { id: page-num, type: text, z: 50, x: 700, y: 1430, width: 100, height: 0, content: { type: plain, value: "·  4  ·" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 5 · Candid Spread ────────────────────────────────
  - id: candid
    label: Candid Moments
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: chapter, type: text, z: 10, x: 100, y: 100, width: 1300, height: 0, content: { type: plain, value: "FOUR · IN BETWEEN" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: rule-top, type: rect, z: 11, x: 700, y: 150, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: p1, type: rect, z: 20, x: 100, y: 200, width: 380, height: 480, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p1-t, type: text, z: 21, x: 100, y: 432, width: 380, height: 0, content: { type: plain, value: "[ flower girl peeking ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: p2, type: rect, z: 20, x: 500, y: 200, width: 460, height: 230, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p2-t, type: text, z: 21, x: 500, y: 308, width: 460, height: 0, content: { type: plain, value: "[ shoes & hem ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: p3, type: rect, z: 20, x: 500, y: 450, width: 460, height: 230, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p3-t, type: text, z: 21, x: 500, y: 558, width: 460, height: 0, content: { type: plain, value: "[ champagne pour ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: p4, type: rect, z: 20, x: 980, y: 200, width: 420, height: 480, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p4-t, type: text, z: 21, x: 980, y: 432, width: 420, height: 0, content: { type: plain, value: "[ stolen laugh ]" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: p5, type: rect, z: 30, x: 100, y: 720, width: 600, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p5-t, type: text, z: 31, x: 100, y: 872, width: 600, height: 0, content: { type: plain, value: "[ dance floor blur ]" }, style: { font_family: $body, font_size: 15, color: $text_muted, text_align: center, font_style: italic } }
      - { id: p6, type: rect, z: 30, x: 720, y: 720, width: 680, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p6-t, type: text, z: 31, x: 720, y: 872, width: 680, height: 0, content: { type: plain, value: "[ sparklers send-off ]" }, style: { font_family: $body, font_size: 15, color: $text_muted, text_align: center, font_style: italic } }
      - { id: p7, type: rect, z: 40, x: 100, y: 1060, width: 1300, height: 200, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: p7-t, type: text, z: 41, x: 100, y: 1152, width: 1300, height: 0, content: { type: plain, value: "[ panoramic — last guests at midnight ]" }, style: { font_family: $body, font_size: 15, color: $text_muted, text_align: center, font_style: italic } }
      - { id: caption, type: text, z: 50, x: 200, y: 1300, width: 1100, height: 0, content: { type: plain, value: "The small, easy-to-miss moments that made the day." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, text_align: center } }
      - { id: page-num, type: text, z: 60, x: 700, y: 1430, width: 100, height: 0, content: { type: plain, value: "·  5  ·" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 6 · Vows & Readings ──────────────────────────────
  - id: vows
    label: Vows & Readings
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: chapter, type: text, z: 10, x: 100, y: 100, width: 1300, height: 0, content: { type: plain, value: "FIVE · VOWS & READINGS" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: rule-top, type: rect, z: 11, x: 700, y: 150, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: ornament, type: text, z: 12, x: 100, y: 200, width: 1300, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 32, color: $primary, text_align: center } }
      - { id: vow-1-label, type: text, z: 20, x: 100, y: 300, width: 600, height: 0, content: { type: plain, value: "ELEANOR'S VOWS" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.5 } }
      - { id: vow-1-rule, type: rect, z: 21, x: 100, y: 340, width: 600, height: 1, fill: { type: solid, color: "$border" } }
      - { id: vow-1, type: text, z: 22, x: 100, y: 370, width: 600, height: 0, content: { type: plain, value: "Theo — I promise to be your steady ground and your soft place to land. I will love your terrible jokes, your worst mornings, your loud opinions on Sundays. I will choose us, again and again, until the choosing is the easiest thing I do." }, style: { font_family: $body, font_size: 17, font_style: italic, color: $text, line_height: 1.8 } }
      - { id: vow-2-label, type: text, z: 30, x: 800, y: 300, width: 600, height: 0, content: { type: plain, value: "THEODORE'S VOWS" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.5 } }
      - { id: vow-2-rule, type: rect, z: 31, x: 800, y: 340, width: 600, height: 1, fill: { type: solid, color: "$border" } }
      - { id: vow-2, type: text, z: 32, x: 800, y: 370, width: 600, height: 0, content: { type: plain, value: "Elle — every day with you has felt like the first warm morning of the year. I promise patience, presence, kindness when it counts and silliness when it doesn't. I will keep finding new ways to say what I cannot stop feeling." }, style: { font_family: $body, font_size: 17, font_style: italic, color: $text, line_height: 1.8 } }
      - { id: div, type: rect, z: 40, x: 700, y: 760, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: read-label, type: text, z: 41, x: 100, y: 820, width: 1300, height: 0, content: { type: plain, value: "READING · CAPTAIN CORELLI'S MANDOLIN" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: read-body, type: text, z: 42, x: 200, y: 880, width: 1100, height: 0, content: { type: plain, value: "Love is a temporary madness, it erupts like volcanoes and then subsides. And when it subsides you have to make a decision. You have to work out whether your roots have so entwined together that it is inconceivable that you should ever part." }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $text, text_align: center, line_height: 1.6 } }
      - { id: read-attr, type: text, z: 43, x: 100, y: 1200, width: 1300, height: 0, content: { type: plain, value: "— Louis de Bernières · read by Iris, sister of the bride" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center, font_style: italic } }
      - { id: ornament-bot, type: text, z: 50, x: 100, y: 1320, width: 1300, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 24, color: $primary, text_align: center } }
      - { id: page-num, type: text, z: 60, x: 700, y: 1430, width: 100, height: 0, content: { type: plain, value: "·  6  ·" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 7 · Thank You ────────────────────────────────────
  - id: thank-you
    label: Thank You
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: linear, angle: 180, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: outer-frame, type: rect, z: 1, x: 200, y: 200, width: 1100, height: 1100, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
      - { id: ornament-top, type: text, z: 10, x: 200, y: 320, width: 1100, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 48, color: $primary, text_align: center } }
      - { id: title, type: text, z: 20, x: 200, y: 440, width: 1100, height: 0, content: { type: plain, value: "Thank you." }, style: { font_family: $heading, font_size: 120, font_weight: 700, color: $text, font_style: italic, text_align: center, line_height: 1 } }
      - { id: rule, type: rect, z: 21, x: 700, y: 620, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: body-1, type: text, z: 30, x: 280, y: 680, width: 940, height: 0, content: { type: plain, value: "To the parents who gave us everything, to the friends who flew in from four countries, to the strangers who became family at midnight — thank you." }, style: { font_family: $body, font_size: 22, color: $text, text_align: center, line_height: 1.7 } }
