_protocol: template/v1

# Spa services menu — 1240×1754 (A4 portrait), editorial-cream theme.
# Elegant spa header, 4 service categories × 3 services each
# (name + duration + price). Gratuity footer.
meta:
  id: tmpl-spa-service-menu
  name: Spa Service Menu
  type: menu
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [spa, menu, wellness, services, a4, editorial, portrait]
  description: "Elegant spa service menu with 4 categories (Massage, Facial, Body, Nails), 3 services per category, durations and prices, gratuity footer."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # ── Ornamental top border ─────────────────────────────────
  - id: top-rule
    type: rect
    z: 1
    x: 120
    y: 110
    width: 1000
    height: 1
    fill: { type: solid, color: "$accent" }

  - id: top-rule-2
    type: rect
    z: 2
    x: 120
    y: 116
    width: 1000
    height: 1
    fill: { type: solid, color: "$accent" }

  # ── Masthead ──────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 120
    y: 150
    width: 1000
    height: 0
    content: { type: plain, value: "TREATMENTS & RITUALS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.6
      text_transform: uppercase

  - id: spa-name
    type: text
    z: 11
    x: 120
    y: 200
    width: 1000
    height: 0
    content: { type: plain, value: "Aurelia Spa & Wellness" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 400
      font_style: italic
      color: $primary
      text_align: center
      line_height: 1
      letter_spacing: -0.01

  - id: spa-tagline
