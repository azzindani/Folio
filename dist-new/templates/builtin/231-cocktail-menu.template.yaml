    stroke: { color: "#B8924D", width: 1 }

  - id: frame-inner
    type: rect
    z: 2
    x: 72
    y: 72
    width: 936
    height: 1476
    fill: { type: solid, color: "transparent" }
    stroke: { color: "#B8924D", width: 1 }
    opacity: 0.4

  # ── Masthead ──────────────────────────────────────────────
  - id: bar-eyebrow
    type: text
    z: 10
    x: 100
    y: 130
    width: 880
    height: 0
    content: { type: plain, value: "— BAR & APOTHECARY —" }
