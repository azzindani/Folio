_protocol: template/v1

# Cocktail menu — 1080×1620 portrait, editorial-cream + gold accents.
# Two sections: 6 Signatures + 5 Classics. Dotted leaders between
# cocktail name and price. Gold accent color.
meta:
  id: tmpl-cocktail-menu
  name: Cocktail Menu · Noir Gold
  type: menu
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [menu, cocktail, bar, drinks, noir, gold, editorial, portrait]
  description: "Cocktail bar menu with 6 signature cocktails and 5 classics, ingredients lines, dotted leaders, gold accent ornaments."

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

