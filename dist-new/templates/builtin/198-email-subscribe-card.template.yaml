_protocol: template/v1

# Email subscribe block — 1920×1080 landscape, editorial-cream theme.
# Headline, value-prop subtitle, email input mockup with button, social proof, privacy note.
meta:
  id: tmpl-email-subscribe-card
  name: Email Subscribe Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, screen, newsletter, subscribe, marketing, landscape, editorial]
  description: "Newsletter-signup block with headline, subtitle, email input mockup, subscriber social-proof, and privacy note."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Decorative envelope mark (centred top) ────────────────
  - id: env-bg
    type: rect
    z: 9
    x: 880
    y: 120
    width: 160
    height: 120
    radius: 16
    fill: { type: solid, color: "$text" }

  - id: env-flap
    type: path
    z: 10
    d: "M 880 120 L 960 200 L 1040 120 Z"
    fill: { type: solid, color: "$primary" }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 11
    x: 60
    y: 290
    width: 1800
    height: 0
    content: { type: plain, value: "NEWSLETTER" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      text_align: center
      letter_spacing: 0.4

  # ── Headline ──────────────────────────────────────────────
  - id: headline
    type: text
    z: 12
    x: 60
    y: 330
    width: 1800
    height: 0
    content: { type: plain, value: "Join the Newsletter" }
    style:
      font_family: $heading
      font_size: 84
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1.05
      letter_spacing: -0.03

  # ── Subtitle / value prop ─────────────────────────────────
  - id: subtitle
    type: text
    z: 13
    x: 280
    y: 460
    width: 1360
    height: 0
    content: { type: plain, value: "One thoughtful email each Friday — design systems, product craft, and what we shipped this week. No spam, no fluff." }
    style:
      font_family: $body
      font_size: 24
      color: $text_muted
      text_align: center
      line_height: 1.55

  # ── Email input + button row ──────────────────────────────
  - id: input-bg
    type: rect
    z: 20
    x: 380
    y: 620
    width: 880
    height: 88
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 2 }

  - id: input-icon
    type: text
    z: 21
    x: 410
    y: 644
    width: 40
    height: 0
    content: { type: plain, value: "✉" }
    style:
      font_family: $body
      font_size: 28
      color: $text_muted

  - id: input-placeholder
    type: text
    z: 22
    x: 460
    y: 648
    width: 780
    height: 0
    content: { type: plain, value: "you@company.com" }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted

  - id: btn-bg
    type: rect
    z: 23
    x: 1280
    y: 620
    width: 260
    height: 88
    radius: 12
    fill: { type: solid, color: "$primary" }

  - id: btn-text
    type: text
    z: 24
    x: 1280
    y: 648
    width: 260
    height: 0
    content: { type: plain, value: "Subscribe" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

  # ── Social proof row ──────────────────────────────────────
  - id: sp-av-1
    type: circle
    z: 30
    cx: 820
    cy: 800
    rx: 22
    ry: 22
    fill: { type: solid, color: "$primary" }
    stroke: { color: "$background", width: 3 }

  - id: sp-av-2
    type: circle
    z: 31
    cx: 858
    cy: 800
    rx: 22
    ry: 22
    fill: { type: solid, color: "$secondary" }
    stroke: { color: "$background", width: 3 }

  - id: sp-av-3
    type: circle
    z: 32
    cx: 896
    cy: 800
    rx: 22
    ry: 22
    fill: { type: solid, color: "$accent" }
    stroke: { color: "$background", width: 3 }

  - id: sp-av-4
    type: circle
    z: 33
    cx: 934
    cy: 800
    rx: 22
    ry: 22
    fill: { type: solid, color: "$text" }
    stroke: { color: "$background", width: 3 }

  - id: sp-text
    type: text
    z: 34
    x: 970
    y: 790
    width: 260
    height: 0
    content: { type: plain, value: "Joined by 50,000+ readers" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text

  # ── Privacy note ──────────────────────────────────────────
  - id: privacy
    type: text
    z: 40
    x: 60
    y: 900
    width: 1800
    height: 0
    content: { type: plain, value: "We respect your inbox. Unsubscribe anytime in one click. Read our privacy policy." }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted
      text_align: center

  - id: rule
    type: rect
    z: 50
    x: 760
    y: 1000
    width: 400
    height: 1
    fill: { type: solid, color: "$border" }

  - id: footer
    type: text
    z: 51
    x: 60
    y: 1020
    width: 1800
    height: 0
    content: { type: plain, value: "FOLIO · est. 2026" }
    style:
      font_family: $mono
      font_size: 12
      color: $text_muted
      text_align: center
      letter_spacing: 0.3

slots:
  - { id: headline,         path: "layers[3].content.value",  type: text, hint: "Headline",                default: "Join the Newsletter" }
  - { id: subtitle,         path: "layers[4].content.value",  type: text, hint: "Value-prop subtitle",     default: "One thoughtful email each Friday — design systems, product craft, and what we shipped this week. No spam, no fluff." }
  - { id: subscriber_count, path: "layers[15].content.value", type: text, hint: "Social-proof line",      default: "Joined by 50,000+ readers" }
