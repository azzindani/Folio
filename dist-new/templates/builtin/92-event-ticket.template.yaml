      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: center
      text_transform: uppercase

  # ── Stub: code ─────────────────────────────────────────────
  - id: stub-code-label
    type: text
    z: 45
    x: 1260
    y: 400
    width: 280
    height: 0
    content: { type: plain, value: "CODE" }
    style:
      font_family: $body
      font_size: 11
