_protocol: template/v1

# Event ticket — 1600×600 landscape, neon-bloom theme.
# Two-panel layout: main panel (left, 1200px) with event details +
# perforation strip (vertical dashes) + stub panel (right, 400px)
# with seat + code. Vertical neon accent bar on far left.
meta:
  id: tmpl-event-ticket-neon
  name: Event Ticket · Neon
  type: ticket
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [ticket, event, concert, admission, perforated, neon]
  description: "Event admission ticket with main panel (event name, date, venue) and perforated stub (seat, code)."

document:
  width: 1600
  height: 600
  unit: px
  dpi: 96

theme:
  ref: neon-bloom

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1600
    height: 600
    fill: { type: solid, color: "$background" }

  # ── Main panel surface ────────────────────────────────────
  - id: main-panel
    type: rect
    z: 1
    x: 40
    y: 40
    width: 1160
    height: 520
    radius: 12
    fill: { type: solid, color: "$surface" }

  # ── Neon accent bar (far left of main panel) ──────────────
  - id: accent-bar
    type: rect
    z: 2
    x: 40
    y: 40
    width: 14
    height: 520
    fill: { type: solid, color: $primary }
  # ── Stub panel surface ────────────────────────────────────
  - id: stub-panel
    type: rect
    z: 3
    x: 1240
    y: 40
    width: 320
    height: 520
    radius: 12
    fill: { type: solid, color: "$surface" }

  # ── Perforation (vertical dashed line between panels) ─────
  - id: perf-line
    type: line
    z: 4
    x1: 1220
    y1: 60
    x2: 1220
    y2: 540
    stroke:
      color: "$text_muted"
      width: 2
      dash: [8, 8]

  # ── Tear circles (top + bottom of perforation) ────────────
  - id: perf-top-cutout
    type: circle
    z: 5
    cx: 1220
    cy: 40
    rx: 18
    ry: 18
    fill: { type: solid, color: "$background" }

  - id: perf-bottom-cutout
    type: circle
    z: 6
    cx: 1220
    cy: 560
    rx: 18
    ry: 18
    fill: { type: solid, color: "$background" }

  # ── Main panel: eyebrow ───────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 100
    y: 80
    width: 1080
    height: 0
    content: { type: plain, value: "★ ADMIT ONE ★ LIVE EVENT" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.6
      text_transform: uppercase

  # ── Main panel: event name ────────────────────────────────
  - id: event-name
    type: text
    z: 11
    x: 100
    y: 130
    width: 1080
    height: 0
    content: { type: plain, value: "Midnight Synth Festival" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.02

  # ── Event subtitle ────────────────────────────────────────
  - id: event-sub
    type: text
    z: 12
    x: 100
    y: 240
    width: 1080
    height: 0
    content: { type: plain, value: "with Lumen Wave · Aurora Drift · Solar Pulse" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted
      font_style: italic
      line_height: 1.3

  # ── Divider ───────────────────────────────────────────────
  - id: divider
    type: rect
    z: 13
    x: 100
    y: 320
    width: 100
    height: 2
    fill: { type: solid, color: "$primary" }

  # ── Date column ───────────────────────────────────────────
  - id: date-label
    type: text
    z: 20
    x: 100
    y: 360
    width: 280
    height: 0
    content: { type: plain, value: "DATE" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: date-value
    type: text
    z: 21
    x: 100
    y: 386
    width: 280
    height: 0
    content: { type: plain, value: "Sat · Jun 20, 2026" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.2

  # ── Time column ───────────────────────────────────────────
  - id: time-label
    type: text
    z: 22
    x: 420
    y: 360
    width: 200
    height: 0
    content: { type: plain, value: "DOORS" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: time-value
    type: text
    z: 23
    x: 420
    y: 386
    width: 200
    height: 0
    content: { type: plain, value: "8:00 PM" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.2

  # ── Venue column ──────────────────────────────────────────
  - id: venue-label
    type: text
    z: 24
    x: 660
    y: 360
    width: 520
    height: 0
    content: { type: plain, value: "VENUE" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: venue-value
    type: text
    z: 25
    x: 660
    y: 386
    width: 520
    height: 0
    content: { type: plain, value: "The Orpheum, Los Angeles" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.2

  # ── Bottom bar with code ──────────────────────────────────
  - id: code-bar
    type: rect
    z: 30
    x: 100
    y: 480
    width: 1080
    height: 40
    radius: 4
    fill: { type: solid, color: "$background" }

  - id: code-bar-label
    type: text
    z: 31
    x: 120
    y: 491
    width: 200
    height: 0
    content: { type: plain, value: "TICKET CODE" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.3
      text_transform: uppercase

  - id: ticket-code
    type: text
    z: 32
    x: 340
    y: 488
    width: 820
    height: 0
    content: { type: plain, value: "MSF-2026-A7K9-X23P" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 600
      color: $primary
      letter_spacing: 0.3
      line_height: 1.2

  # ── Stub: heading ─────────────────────────────────────────
  - id: stub-eyebrow
    type: text
    z: 40
    x: 1260
    y: 80
    width: 280
    height: 0
    content: { type: plain, value: "ADMIT ONE" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $primary
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: stub-rule
    type: rect
    z: 41
    x: 1340
    y: 110
    width: 120
    height: 2
    fill: { type: solid, color: "$primary" }

  # ── Stub: seat ────────────────────────────────────────────
  - id: stub-seat-label
    type: text
    z: 42
    x: 1260
    y: 160
    width: 280
    height: 0
    content: { type: plain, value: "SEAT" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_align: center
      text_transform: uppercase

  - id: stub-seat-value
    type: text
    z: 43
    x: 1260
    y: 200
    width: 280
    height: 0
    content: { type: plain, value: "C-14" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1
      letter_spacing: -0.02

  # ── Stub: section/row ─────────────────────────────────────
  - id: stub-section
    type: text
    z: 44
    x: 1260
    y: 320
    width: 280
    height: 0
