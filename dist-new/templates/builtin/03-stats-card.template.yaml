_protocol: template/v1

# Big-number stat card with delta, label, sublabel — KPI/dashboard tile.
meta:
  id: tmpl-stats-card
  name: Stats Card
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, stats, kpi, dashboard, dark]

document:
  width: 1080
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: dark-tech
  overrides:
    primary: "#00D4FF"
    accent: "#10B981"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1080
    fill: { type: solid, color: $background }
  - id: card
    type: rect
    z: 10
    x: 80
    y: 200
    width: 920
    height: 680
    radius: 32
    fill: { type: solid, color: "$surface2" }
    stroke: { color: "$border", width: 1 }
    effects:
      shadow:
        - { dx: 0, dy: 16, blur: 48, color: "rgba(0,0,0,0.45)" }

  - id: glow
    type: circle
    z: 11
    cx: 940
    cy: 240
    rx: 200
    ry: 200
    fill: { type: none }
    opacity: 0.35

  - id: label
    type: text
    z: 20
    x: 140
    y: 260
    width: 800
    height: 0
    content: { type: plain, value: "Monthly Active Users" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 500
      color: $text_muted
      letter_spacing: 0.04
      text_transform: uppercase

  - id: value
    type: text
    z: 21
    x: 140
    y: 340
    width: 800
    height: 0
    content: { type: plain, value: "142,580" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 700
      color: $text
      line_height: 1
      letter_spacing: -0.03

  - id: delta-pill
    type: rect
    z: 30
    x: 140
    y: 620
    width: 200
    height: 56
    radius: 28
    fill: { type: solid, color: "rgba(16,185,129,0.15)" }
    stroke: { color: "$accent", width: 1 }

  - id: delta-text
    type: text
    z: 31
    x: 168
    y: 638
    width: 160
    height: 0
    content: { type: plain, value: "↑ 12.4%" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $accent

  - id: sublabel
    type: text
    z: 32
    x: 360
    y: 640
    width: 600
    height: 0
    content: { type: plain, value: "vs last month" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  - id: footnote
    type: text
    z: 40
    x: 140
    y: 800
    width: 800
    height: 0
    content: { type: plain, value: "Q2 2026 · auto-refresh hourly" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted

slots:
  - { id: label,    path: "layers[3].content.value", type: text, hint: "Metric label (e.g. \"MAU\")",  default: "Monthly Active Users" }
  - { id: value,    path: "layers[4].content.value", type: text, hint: "Big number",                  default: "142,580" }
  - { id: delta,    path: "layers[6].content.value", type: text, hint: "Change indicator",            default: "↑ 12.4%" }
  - { id: sublabel, path: "layers[7].content.value", type: text, hint: "Delta context",               default: "vs last month" }
  - { id: footnote, path: "layers[8].content.value", type: text, hint: "Footer / period",             default: "Q2 2026 · auto-refresh hourly" }
