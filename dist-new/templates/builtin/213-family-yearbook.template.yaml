      - { id: page-num, type: text, z: 50, x: 0, y: 1450, width: 1500, height: 0, content: { type: plain, value: "2 / 8" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

