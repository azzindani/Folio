_protocol: template/v1

# 8-page family yearbook — 1500×1500 square, pastel-dream theme.
# Cover → year in numbers → Spring → Summer → Fall → Winter → milestones → back cover.
meta:
  id: tmpl-family-yearbook
  name: Family Yearbook (8 pages)
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, family, yearbook, keepsake, square, pastel]
  description: "Eight-page family yearbook: cover, year-in-numbers spread, four quarterly highlight spreads (Spring, Summer, Fall, Winter), a milestones list, and a back cover note for next year."

document:
  width: 1500
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: $primary } }
      - { id: glow, type: circle, z: 1, cx: 750, cy: 750, rx: 600, ry: 600, fill: { type: none }, opacity: 0.35 }
      - { id: deco-1, type: circle, z: 2, cx: 220, cy: 240, rx: 90, ry: 90, fill: { type: solid, color: "#FFFFFF" }, opacity: 0.6 }
      - { id: deco-2, type: circle, z: 2, cx: 1280, cy: 280, rx: 70, ry: 70, fill: { type: solid, color: "$secondary" }, opacity: 0.7 }
      - { id: deco-3, type: circle, z: 2, cx: 180, cy: 1300, rx: 70, ry: 70, fill: { type: solid, color: "$secondary" }, opacity: 0.6 }
      - { id: deco-4, type: circle, z: 2, cx: 1320, cy: 1260, rx: 90, ry: 90, fill: { type: solid, color: "#FFFFFF" }, opacity: 0.55 }
      - { id: card, type: rect, z: 10, x: 200, y: 320, width: 1100, height: 860, radius: 32, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$primary", width: 4 } }
      - { id: year-kicker, type: text, z: 20, x: 200, y: 400, width: 1100, height: 0, content: { type: plain, value: "THE OKONKWO FAMILY" }, style: { font_family: $body, font_size: 18, font_weight: 800, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: divider-1, type: rect, z: 21, x: 700, y: 450, width: 100, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: year-label, type: text, z: 22, x: 200, y: 490, width: 1100, height: 0, content: { type: plain, value: "OUR YEAR" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $text, text_align: center } }
      - { id: year, type: text, z: 23, x: 200, y: 560, width: 1100, height: 0, content: { type: plain, value: "2026" }, style: { font_family: $heading, font_size: 240, font_weight: 800, color: $primary, text_align: center, line_height: 1, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 24, x: 200, y: 860, width: 1100, height: 0, content: { type: plain, value: "twelve months · four kids · one very patient dog" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: $text_muted, text_align: center, line_height: 1.3 } }
      - { id: divider-2, type: rect, z: 25, x: 700, y: 960, width: 100, height: 2, fill: { type: solid, color: "$border" } }
      - { id: compiled, type: text, z: 26, x: 200, y: 990, width: 1100, height: 0, content: { type: plain, value: "COMPILED ON THE KITCHEN TABLE" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: compiled-date, type: text, z: 27, x: 200, y: 1030, width: 1100, height: 0, content: { type: plain, value: "DECEMBER 27, 2026" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: heart, type: text, z: 28, x: 200, y: 1090, width: 1100, height: 0, content: { type: plain, value: "♡" }, style: { font_family: $heading, font_size: 40, color: $primary, text_align: center } }
      - { id: foot, type: text, z: 30, x: 200, y: 1300, width: 1100, height: 0, content: { type: plain, value: "VOLUME VII" }, style: { font_family: $mono, font_size: 16, font_weight: 800, color: "#FFFFFF", text_align: center, letter_spacing: 0.7 } }
      - { id: page-num, type: text, z: 31, x: 0, y: 1450, width: 1500, height: 0, content: { type: plain, value: "1 / 8" }, style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: center, opacity: 0.85, letter_spacing: 0.4 } }

