      - { id: stat-1-label, type: text, z: 22, x: 140, y: 600, width: 400, height: 0, content: { type: plain, value: "FAMILY DINNERS" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $text, text_align: center, letter_spacing: 0.5 } }
      - { id: stat-1-note, type: text, z: 23, x: 160, y: 650, width: 360, height: 0, content: { type: plain, value: "around the same wobbly oak table" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: $text_muted, text_align: center, line_height: 1.4 } }
      - { id: stat-2-card, type: rect, z: 20, x: 560, y: 340, width: 380, height: 420, radius: 24, fill: { type: solid, color: "$surface" }, stroke: { color: "$secondary", width: 3 } }
      - { id: stat-2-val, type: text, z: 21, x: 560, y: 410, width: 380, height: 0, content: { type: plain, value: "12" }, style: { font_family: $heading, font_size: 160, font_weight: 800, color: $secondary, text_align: center, line_height: 1, letter_spacing: -0.04 } }
