      - { id: stat-3-val, type: text, z: 21, x: 960, y: 410, width: 400, height: 0, content: { type: plain, value: "184" }, style: { font_family: $heading, font_size: 150, font_weight: 800, color: $primary, text_align: center, line_height: 1, letter_spacing: -0.04 } }
      - { id: stat-3-label, type: text, z: 22, x: 960, y: 600, width: 400, height: 0, content: { type: plain, value: "BOOKS READ TOGETHER" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $text, text_align: center, letter_spacing: 0.5 } }
      - { id: stat-3-note, type: text, z: 23, x: 980, y: 650, width: 360, height: 0, content: { type: plain, value: "Goodnight Moon, 38 times, still" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: $text_muted, text_align: center, line_height: 1.4 } }
      - { id: stat-4-card, type: rect, z: 30, x: 240, y: 800, width: 480, height: 420, radius: 24, fill: { type: solid, color: "$surface" }, stroke: { color: "$secondary", width: 3 } }
      - { id: stat-4-val, type: text, z: 31, x: 240, y: 870, width: 480, height: 0, content: { type: plain, value: "3,121" }, style: { font_family: $heading, font_size: 140, font_weight: 800, color: $secondary, text_align: center, line_height: 1, letter_spacing: -0.04 } }
      - { id: stat-4-label, type: text, z: 32, x: 240, y: 1050, width: 480, height: 0, content: { type: plain, value: "MILES DRIVEN" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $text, text_align: center, letter_spacing: 0.5 } }
      - { id: stat-4-note, type: text, z: 33, x: 280, y: 1100, width: 400, height: 0, content: { type: plain, value: "everything from the school run to the Pacific" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: $text_muted, text_align: center, line_height: 1.4 } }
      - { id: stat-5-card, type: rect, z: 30, x: 760, y: 800, width: 500, height: 420, radius: 24, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 3 } }
