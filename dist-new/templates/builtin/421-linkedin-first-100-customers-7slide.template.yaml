      - { id: dot-2, type: circle, z: 30, cx: 90, cy: 780, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
      - { id: tactic-2, type: text, z: 32, x: 130, y: 760, width: 890, height: 0, content: { type: plain, value: "Ask a question, don't pitch. The pitch comes in reply 3." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: dot-3, type: circle, z: 30, cx: 90, cy: 900, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
      - { id: tactic-3, type: text, z: 33, x: 130, y: 880, width: 890, height: 0, content: { type: plain, value: "20 sends per day, max. Quality beats blast." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 5 · 03 Content ───────────────────────────────────
