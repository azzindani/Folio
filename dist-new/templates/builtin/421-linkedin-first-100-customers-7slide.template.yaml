      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "3 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "CHANNEL 01" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: number, type: text, z: 20, x: 60, y: 220, width: 200, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: title, type: text, z: 21, x: 60, y: 420, width: 960, height: 0, content: { type: plain, value: "Communities." }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: dot-1, type: circle, z: 30, cx: 90, cy: 660, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
      - { id: tactic-1, type: text, z: 31, x: 130, y: 640, width: 890, height: 0, content: { type: plain, value: "Pick 3 communities where the pain shows up daily." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: dot-2, type: circle, z: 30, cx: 90, cy: 780, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
      - { id: tactic-2, type: text, z: 32, x: 130, y: 760, width: 890, height: 0, content: { type: plain, value: "Give for 30 days before you mention the product." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: dot-3, type: circle, z: 30, cx: 90, cy: 900, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
      - { id: tactic-3, type: text, z: 33, x: 130, y: 880, width: 890, height: 0, content: { type: plain, value: "Reply to questions, then DM with a free fix." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 4 · 02 Cold DMs ──────────────────────────────────
  - id: cold-dms
