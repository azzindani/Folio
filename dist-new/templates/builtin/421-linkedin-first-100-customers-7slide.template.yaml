      - { id: tactic-2, type: text, z: 32, x: 130, y: 760, width: 890, height: 0, content: { type: plain, value: "Build one integration. Co-write the launch post." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: dot-3, type: circle, z: 30, cx: 90, cy: 900, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
