_protocol: template/v1

# 7-slide LinkedIn carousel — getting first 100 customers without ads.
# Portrait 1080×1350. Forest-deep theme. Top accent band + pagination.
meta:
  id: tmpl-linkedin-first-100-customers-7slide
  name: LinkedIn · First 100 Customers (7 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, startup, founder, gtm, growth, 4-5, forest-deep]
  description: "7-slide LinkedIn carousel: 5 organic channels that delivered the first 100 customers."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: forest-deep

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "1 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 440, width: 960, height: 0, content: { type: plain, value: "GROWTH PLAYBOOK" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 510, width: 960, height: 0, content: { type: plain, value: "How I got\nthe first 100\ncustomers\n(without ads)." }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: $text, line_height: 1.02, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 1140, width: 960, height: 0, content: { type: plain, value: "Swipe → 5 channels, in order." }, style: { font_family: $body, font_size: 24, color: $text_muted } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 2 · Where I started ──────────────────────────────
  - id: where-started
    label: Where I started
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "2 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "WHERE I STARTED" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 220, width: 960, height: 0, content: { type: plain, value: "Zero followers. Zero budget." }, style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: body, type: text, z: 13, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "I had a working product, $0 in ad spend, and a list of 12 people who said 'sounds interesting.' I gave myself 90 days to reach 100 paid customers. These are the 5 channels that actually moved the needle — ranked by where I spent my time, not by where the leads came from." }, style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 3 · 01 Communities ───────────────────────────────
