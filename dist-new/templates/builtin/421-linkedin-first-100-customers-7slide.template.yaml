      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "CHANNEL 02" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: number, type: text, z: 20, x: 60, y: 220, width: 200, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: title, type: text, z: 21, x: 60, y: 420, width: 960, height: 0, content: { type: plain, value: "Cold DMs." }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: dot-1, type: circle, z: 30, cx: 90, cy: 660, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
