      - { id: cta-btn, type: rect, z: 42, x: 60, y: 920, width: 320, height: 72, radius: 36, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 43, x: 60, y: 942, width: 320, height: 0, content: { type: plain, value: "Follow →" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "#0F2418", text_align: center } }
      - { id: handle, type: text, z: 15, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF" } }

slots:
  - { id: cover_title,        path: "pages[0].layers[4].content.value",  type: text, hint: "Cover headline",         default: "How I got\nthe first 100\ncustomers\n(without ads)." }
  - { id: started_body,       path: "pages[1].layers[5].content.value",  type: text, hint: "Where started body",     default: "I had a working product, $0 in ad spend, and a list of 12 people who said 'sounds interesting.'" }
  - { id: communities_tactic_1, path: "pages[2].layers[7].content.value", type: text, hint: "Communities tactic 1", default: "Pick 3 communities where the pain shows up daily." }
  - { id: cold_dm_tactic_1,   path: "pages[3].layers[7].content.value",  type: text, hint: "Cold DM tactic 1",       default: "Reference one specific thing they shipped this month." }
  - { id: content_tactic_1,   path: "pages[4].layers[7].content.value",  type: text, hint: "Content tactic 1",       default: "Write one tactical post per week. Just one." }
  - { id: partner_tactic_1,   path: "pages[5].layers[7].content.value",  type: text, hint: "Partnerships tactic 1",  default: "Find tools your customers already pay for." }
  - { id: wom_tactic,         path: "pages[6].layers[7].content.value",  type: text, hint: "Word-of-mouth tactic",   default: "Make it embarrassingly easy to share — credit referrers loudly." }
  - { id: cta_heading,        path: "pages[6].layers[9].content.value",  type: text, hint: "CTA heading",            default: "Save this. Run it. DM me your channel #1." }
  - { id: handle,             path: "pages[0].layers[6].content.value",  type: text, hint: "Footer handle",          default: "@yourhandle" }
