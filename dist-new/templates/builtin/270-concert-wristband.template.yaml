_protocol: template/v1

# Concert wristband (1800×200 landscape — wristband proportions).
# Neon-bloom: event name repeated 3×, date, venue, vertical-bar security barcode.
meta:
  id: tmpl-concert-wristband
  name: Concert Wristband
  type: ticket
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [ticket, wristband, concert, music, event, neon, landscape]
  description: "Single-use concert wristband with repeated event name, date, venue, and barcode."

document:
