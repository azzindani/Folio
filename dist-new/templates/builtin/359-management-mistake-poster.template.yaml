_protocol: template/v1

# Single-page poster — Contrarian management claim + explanation + 3 cards.
# High-contrast, punchy, debate-starter format.
meta:
  id: tmpl-management-mistake-poster
  name: Management Mistake Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, leadership, management, contrarian, 4-5]
  description: "High-contrast poster pairing a bold contrarian management claim with three numbered do-this-instead cards."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: high-contrast

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1120
    cy: 140
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 130
    width: 1040
    height: 0
    content: { type: plain, value: "UNPOPULAR OPINION" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: claim
    type: text
    z: 20
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "Your weekly 1:1\nis a waste\nof time." }
    style:
      font_family: $heading
      font_size: 124
      font_weight: 900
      color: $text
      line_height: 0.98
      letter_spacing: -0.04

  - id: divider
    type: rect
    z: 15
    x: 80
    y: 700
    width: 200
    height: 6
    fill: { type: solid, color: "$primary" }

  - id: explanation
    type: text
    z: 21
    x: 80
    y: 740
    width: 1040
    height: 0
    content: { type: plain, value: "Status updates belong in a doc. The thing your report actually needs from you — career, blockers, hard conversations — gets squeezed into the last four minutes. Stop running a stand-up at a desk." }
    style:
      font_family: $body
      font_size: 26
      color: $text
      line_height: 1.5

  - id: cards-header
    type: text
    z: 22
    x: 80
    y: 970
    width: 1040
    height: 0
    content: { type: plain, value: "DO THIS INSTEAD" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $accent
      letter_spacing: 0.4
      text_transform: uppercase

  - id: card-1-bg
    type: rect
    z: 30
    x: 80
    y: 1010
    width: 1040
    height: 120
    radius: 8
    fill: { type: solid, color: "$surface" }

  - id: card-1-num
    type: text
    z: 31
    x: 112
    y: 1035
    width: 80
    height: 0
    content: { type: plain, value: "01" }
    style:
      font_family: $mono
      font_size: 28
      font_weight: 800
      color: $primary
      letter_spacing: 0.05

  - id: card-1-text
    type: text
    z: 32
    x: 220
    y: 1045
    width: 868
    height: 0
    content: { type: plain, value: "Async-first status. Sync only when the doc has a question mark." }
    style:
      font_family: $body
      font_size: 24
      font_weight: 700
      color: $text
      line_height: 1.4

  - id: card-2-bg
    type: rect
    z: 30
    x: 80
    y: 1150
    width: 1040
    height: 120
    radius: 8
    fill: { type: solid, color: "$surface" }

  - id: card-2-num
    type: text
    z: 31
    x: 112
    y: 1175
    width: 80
    height: 0
    content: { type: plain, value: "02" }
    style:
      font_family: $mono
      font_size: 28
      font_weight: 800
      color: $primary
      letter_spacing: 0.05

  - id: card-2-text
    type: text
    z: 32
    x: 220
    y: 1185
    width: 868
    height: 0
    content: { type: plain, value: "Monthly career 1:1. Their agenda, not yours. No laptops." }
    style:
      font_family: $body
      font_size: 24
      font_weight: 700
      color: $text
      line_height: 1.4

  - id: card-3-bg
    type: rect
    z: 30
    x: 80
    y: 1290
    width: 1040
    height: 120
    radius: 8
    fill: { type: solid, color: "$surface" }

  - id: card-3-num
    type: text
    z: 31
    x: 112
    y: 1315
    width: 80
    height: 0
    content: { type: plain, value: "03" }
    style:
      font_family: $mono
      font_size: 28
      font_weight: 800
      color: $primary
      letter_spacing: 0.05

  - id: card-3-text
    type: text
    z: 32
    x: 220
    y: 1325
    width: 868
    height: 0
    content: { type: plain, value: "Same-day check-ins when something feels off. Don't wait for Tuesday." }
    style:
      font_family: $body
      font_size: 24
      font_weight: 700
      color: $text
      line_height: 1.4

  - id: footer-mark
    type: text
    z: 40
    x: 80
    y: 1450
    width: 1040
    height: 0
    content: { type: plain, value: "FOLIO · MANAGEMENT SERIES" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

animations:
  accent-dot:
    loop: { type: pulse, duration: 2000, scale: 1.4 }
  claim:
    enter: { type: scale_in, duration: 700, delay: 100, easing: ease-out }
  explanation:
    enter: { type: fade_up, duration: 600, delay: 350, easing: ease-out }
  card-1-bg:
    enter: { type: fade_up, duration: 600, delay: 400, easing: ease-out }
  card-2-bg:
    enter: { type: fade_up, duration: 600, delay: 550, easing: ease-out }
  card-3-bg:
    enter: { type: fade_up, duration: 600, delay: 700, easing: ease-out }

slots:
  - { id: eyebrow,     path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",       default: "UNPOPULAR OPINION" }
  - { id: claim,       path: "layers[4].content.value",  type: text, hint: "Contrarian claim",  default: "Your weekly 1:1\nis a waste\nof time." }
  - { id: explanation, path: "layers[6].content.value",  type: text, hint: "Explanation body",  default: "Status updates belong in a doc. The thing your report actually needs from you — career, blockers, hard conversations — gets squeezed into the last four minutes. Stop running a stand-up at a desk." }
  - { id: card_1_text, path: "layers[10].content.value", type: text, hint: "Card 01 text",      default: "Async-first status. Sync only when the doc has a question mark." }
  - { id: card_2_text, path: "layers[13].content.value", type: text, hint: "Card 02 text",      default: "Monthly career 1:1. Their agenda, not yours. No laptops." }
  - { id: card_3_text, path: "layers[16].content.value", type: text, hint: "Card 03 text",      default: "Same-day check-ins when something feels off. Don't wait for Tuesday." }
  - { id: footer_mark, path: "layers[17].content.value", type: text, hint: "Footer mark",       default: "FOLIO · MANAGEMENT SERIES" }
