_protocol: template/v1

# Single-page poster — Leadership quote on editorial cream.
# Display-serif italic hero, attribution, decorative " glyphs, eyebrow tag.
meta:
  id: tmpl-leadership-quote-poster
  name: Leadership Quote Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, leadership, quote, editorial, 4-5]
  description: "Editorial-cream poster featuring a display-serif leadership quote with attribution and decorative quotation glyphs."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1200
    height: 10
    fill: { type: solid, color: "$primary" }

  - id: glyph-open
    type: text
    z: 5
    x: 80
    y: 240
    width: 220
    height: 0
    content: { type: plain, value: "“" }
    style:
      font_family: $heading
      font_size: 320
      font_weight: 900
      color: $primary
      line_height: 1
      letter_spacing: -0.05

  - id: glyph-close
    type: text
    z: 5
    x: 900
    y: 1160
    width: 220
    height: 0
    content: { type: plain, value: "”" }
    style:
      font_family: $heading
      font_size: 320
      font_weight: 900
      color: $primary
      line_height: 1
      text_align: right
      letter_spacing: -0.05

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 180
    width: 1040
    height: 0
    content: { type: plain, value: "ON LEADERSHIP" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: quote
    type: text
    z: 20
    x: 120
    y: 480
    width: 960
    height: 0
    content: { type: plain, value: "The function of leadership\nis to produce more leaders,\nnot more followers." }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 500
      font_style: italic
      color: $text
      line_height: 1.25
      letter_spacing: -0.01

  - id: accent-rule
    type: rect
    z: 25
    x: 120
    y: 1080
    width: 120
    height: 4
    fill: { type: solid, color: "$primary" }

  - id: author
    type: text
    z: 30
    x: 120
    y: 1120
    width: 960
    height: 0
    content: { type: plain, value: "— Ralph Nader" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: author-role
    type: text
    z: 31
    x: 120
    y: 1170
    width: 960
    height: 0
    content: { type: plain, value: "Consumer advocate · Author" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      line_height: 1.4

  - id: footer-mark
    type: text
    z: 40
    x: 80
    y: 1420
    width: 1040
    height: 0
    content: { type: plain, value: "FOLIO · LEADERSHIP SERIES" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

animations:
  glyph-open:
    enter: { type: fade_in, duration: 800, delay: 0, easing: ease-out }
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  author:
    enter: { type: fade_up, duration: 600, delay: 600, easing: ease-out }
  author-role:
    enter: { type: fade_up, duration: 600, delay: 750, easing: ease-out }
  accent-rule:
    loop: { type: breathe, duration: 2400, scale: 1.05 }

slots:
  - { id: eyebrow,     path: "layers[4].content.value", type: text, hint: "Eyebrow tag",          default: "ON LEADERSHIP" }
  - { id: quote,       path: "layers[5].content.value", type: text, hint: "Hero quote",           default: "The function of leadership\nis to produce more leaders,\nnot more followers." }
  - { id: author,      path: "layers[7].content.value", type: text, hint: "Author attribution",   default: "— Ralph Nader" }
  - { id: author_role, path: "layers[8].content.value", type: text, hint: "Author role/company",  default: "Consumer advocate · Author" }
  - { id: footer_mark, path: "layers[9].content.value", type: text, hint: "Footer mark",         default: "FOLIO · LEADERSHIP SERIES" }
