_protocol: template/v1

# LinkedIn document post slide — 1200×1200 square, corporate-slate.
# Single slide from a multi-slide LinkedIn document: section eyebrow,
# big slide title, 3-bullet body, slide-number footer.
meta:
  id: tmpl-linkedin-document-post
  name: LinkedIn Document Post
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, linkedin, document, carousel, square, corporate]
  description: "LinkedIn document/carousel slide with section eyebrow, title, three bullets, and pagination footer."

document:
  width: 1200
  height: 1200
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1200
    fill: { type: solid, color: "$background" }

  # ── Top accent band ───────────────────────────────────────
  - id: top-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  # ── Section eyebrow ───────────────────────────────────────
  - id: section
    type: text
    z: 5
    x: 90
    y: 110
    width: 1020
    height: 0
    content: { type: plain, value: "PART 02 · STRATEGY" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  # ── Eyebrow underline ─────────────────────────────────────
  - id: eyebrow-rule
    type: rect
    z: 6
    x: 90
    y: 150
    width: 60
    height: 3
    radius: 2
    fill: { type: solid, color: "$accent" }

  # ── Big slide title ───────────────────────────────────────
  - id: title
    type: text
    z: 10
    x: 90
    y: 200
    width: 1020
    height: 0
    content: { type: plain, value: "Building durable\nadvantages in B2B SaaS" }
    style:
      font_family: $heading
      font_size: 84
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.025

  # ── Divider between title and bullets ─────────────────────
  - id: mid-divider
    type: rect
    z: 15
    x: 90
    y: 490
    width: 1020
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Bullet 1 marker + text ────────────────────────────────
  - id: b1-dot
    type: circle
    z: 20
    cx: 110
    cy: 568
    rx: 8
    ry: 8
    fill: { type: solid, color: "$primary" }

  - id: bullet-1
    type: text
    z: 21
    x: 150
    y: 545
    width: 960
    height: 0
    content: { type: plain, value: "Distribution beats product. Build channels before features." }
    style:
      font_family: $body
      font_size: 30
      font_weight: 500
      color: $text
      line_height: 1.4

  # ── Bullet 2 marker + text ────────────────────────────────
  - id: b2-dot
    type: circle
    z: 22
    cx: 110
    cy: 708
    rx: 8
    ry: 8
    fill: { type: solid, color: "$primary" }

  - id: bullet-2
    type: text
    z: 23
    x: 150
    y: 685
    width: 960
    height: 0
    content: { type: plain, value: "Pricing power compounds. Anchor on value, not on cost." }
    style:
      font_family: $body
      font_size: 30
      font_weight: 500
      color: $text
      line_height: 1.4

  # ── Bullet 3 marker + text ────────────────────────────────
  - id: b3-dot
    type: circle
    z: 24
    cx: 110
    cy: 848
    rx: 8
    ry: 8
    fill: { type: solid, color: "$primary" }

  - id: bullet-3
    type: text
    z: 25
    x: 150
    y: 825
    width: 960
    height: 0
    content: { type: plain, value: "Switching cost is a moat. Earn it through workflow integration." }
    style:
      font_family: $body
      font_size: 30
      font_weight: 500
      color: $text
      line_height: 1.4

  # ── Footer divider ────────────────────────────────────────
  - id: footer-divider
    type: rect
    z: 30
    x: 90
    y: 1060
    width: 1020
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Footer brand ──────────────────────────────────────────
  - id: footer-brand
    type: text
    z: 31
    x: 90
    y: 1095
    width: 600
    height: 0
    content: { type: plain, value: "Vantage Insights" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.3

  # ── Footer slide number ───────────────────────────────────
  - id: slide-number
    type: text
    z: 32
    x: 500
    y: 1100
    width: 610
    height: 0
    content: { type: plain, value: "04  /  12" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 600
      color: $text_muted
      text_align: right
      line_height: 1.3

slots:
  - { id: section,      path: "layers[2].content.value",  type: text, hint: "Section eyebrow",   default: "PART 02 · STRATEGY" }
  - { id: title,        path: "layers[4].content.value",  type: text, hint: "Slide title",       default: "Building durable\nadvantages in B2B SaaS" }
  - { id: bullet_1,     path: "layers[7].content.value",  type: text, hint: "Bullet 1",          default: "Distribution beats product. Build channels before features." }
  - { id: bullet_2,     path: "layers[9].content.value",  type: text, hint: "Bullet 2",          default: "Pricing power compounds. Anchor on value, not on cost." }
  - { id: bullet_3,     path: "layers[11].content.value", type: text, hint: "Bullet 3",          default: "Switching cost is a moat. Earn it through workflow integration." }
  - { id: slide_number, path: "layers[14].content.value", type: text, hint: "Slide number",      default: "04  /  12" }
