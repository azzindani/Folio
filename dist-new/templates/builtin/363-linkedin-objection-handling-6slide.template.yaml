_protocol: template/v1

# 6-slide LinkedIn carousel — sales objection handling. 1080×1350 portrait.
meta:
  id: tmpl-linkedin-objection-handling-6slide
  name: LinkedIn Objection Handling (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, sales, objections, scripts, 4-5]
  description: "6-slide LinkedIn carousel decoding the 4 most common B2B sales objections and how to respond."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: dark-tech

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "SALES SCRIPTS · 2026" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "4 sales objections,\ndecoded." }
        style: { font_family: $heading, font_size: 100, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: subtitle
        type: text
        z: 12
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "What buyers really mean — and the line that gets the deal back on track." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "1/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Intro ────────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "THE RULE" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "An objection is a question in disguise." }
        style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 12
        x: 80
        y: 480
        width: 920
        height: 0
        content: { type: plain, value: "Buyers don't say what they mean. \"It's too expensive\" usually means \"I don't see the value yet.\" \"Send me info\" means \"I'm not the buyer.\"\n\nThese 4 lines reframe the conversation without arguing." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "2/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Objection 1 ──────────────────────────────────
  - id: obj1
    label: It's too expensive
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: obj-label
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "OBJECTION 01" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: objection
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "\"It's too expensive.\"" }
        style: { font_family: $heading, font_size: 64, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02, font_style: italic }
      - id: response-label
        type: text
        z: 12
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "RESPONSE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: response
        type: text
        z: 13
        x: 80
        y: 660
        width: 920
        height: 0
        content: { type: plain, value: "\"Compared to what — your current tool, doing nothing, or building it in-house? Each one has a different price. Which are you weighing it against?\"" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "3/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Objection 2 ──────────────────────────────────
  - id: obj2
    label: Send me info
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: obj-label
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "OBJECTION 02" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: objection
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "\"Send me some info and I'll look.\"" }
        style: { font_family: $heading, font_size: 60, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02, font_style: italic }
      - id: response-label
        type: text
        z: 12
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "RESPONSE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: response
        type: text
        z: 13
        x: 80
        y: 660
        width: 920
        height: 0
        content: { type: plain, value: "\"Happy to. So I send the right thing — what's the one outcome you'd need this to deliver to be worth a serious look?\"" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "4/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Objection 3 ──────────────────────────────────
  - id: obj3
    label: Not the right time
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: obj-label
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "OBJECTION 03" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: objection
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "\"It's not the right time.\"" }
        style: { font_family: $heading, font_size: 64, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02, font_style: italic }
      - id: response-label
        type: text
        z: 12
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "RESPONSE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: response
        type: text
        z: 13
        x: 80
        y: 660
        width: 920
        height: 0
        content: { type: plain, value: "\"Fair. What would have to change between now and Q3 for this to move up the list? If we can't name it, the timing argument is just budget in a costume.\"" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "5/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 6 · Objection 4 + CTA ────────────────────────────
  - id: obj4
    label: Need to think + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$surface" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$accent" } }
      - id: obj-label
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "OBJECTION 04" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36, text_transform: uppercase }
      - id: objection
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "\"I need to think about it.\"" }
        style: { font_family: $heading, font_size: 60, font_weight: 700, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02, font_style: italic }
      - id: response-label
        type: text
        z: 12
        x: 80
        y: 540
        width: 920
        height: 0
        content: { type: plain, value: "RESPONSE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36, text_transform: uppercase }
      - id: response
        type: text
        z: 13
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "\"Of course. What part are you the least sure about — the fit, the price, or the lift to roll it out? I'd rather answer the real question than send another follow-up.\"" }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF", line_height: 1.55 }
      - { id: cta-btn, type: rect, z: 14, x: 80, y: 980, width: 360, height: 72, radius: 36, fill: { type: solid, color: "$primary" } }
      - id: cta-text
        type: text
        z: 15
        x: 80
        y: 1002
        width: 360
        height: 0
        content: { type: plain, value: "Save for later →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#FFFFFF", text_align: center }
      - id: handle
        type: text
        z: 16
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,  path: "pages[0].layers[3].content.value", type: text, hint: "Cover title",    default: "4 sales objections,\ndecoded." }
  - { id: intro_body,   path: "pages[1].layers[4].content.value", type: text, hint: "Intro body",     default: "Buyers don't say what they mean." }
  - { id: obj1_text,    path: "pages[2].layers[3].content.value", type: text, hint: "Objection 1",    default: "\"It's too expensive.\"" }
  - { id: obj1_reply,   path: "pages[2].layers[5].content.value", type: text, hint: "Response 1",     default: "\"Compared to what?\"" }
  - { id: obj2_text,    path: "pages[3].layers[3].content.value", type: text, hint: "Objection 2",    default: "\"Send me some info.\"" }
  - { id: obj2_reply,   path: "pages[3].layers[5].content.value", type: text, hint: "Response 2",     default: "\"So I send the right thing — what outcome matters?\"" }
  - { id: obj3_text,    path: "pages[4].layers[3].content.value", type: text, hint: "Objection 3",    default: "\"It's not the right time.\"" }
  - { id: obj3_reply,   path: "pages[4].layers[5].content.value", type: text, hint: "Response 3",     default: "\"What would have to change?\"" }
  - { id: obj4_text,    path: "pages[5].layers[3].content.value", type: text, hint: "Objection 4",    default: "\"I need to think about it.\"" }
  - { id: obj4_reply,   path: "pages[5].layers[5].content.value", type: text, hint: "Response 4",     default: "\"What part are you least sure about?\"" }
  - { id: handle,       path: "pages[5].layers[8].content.value", type: text, hint: "Handle",         default: "@yourhandle" }
