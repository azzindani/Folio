# Crossword puzzle — 1240×1754 A4 portrait, light-clean.
# 15x15 grid with black-cell rects, numbered cells, ACROSS/DOWN clue lists, header.
meta:
  id: tmpl-crossword-puzzle
  name: Crossword Puzzle
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, crossword, puzzle, game, a4, printable, light]
  description: "Crossword puzzle with 15x15 grid, black-filled empty cells, numbered clues, ACROSS and DOWN clue lists, and puzzle metadata."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

