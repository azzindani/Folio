    type: text
    z: 1
    x: 60
    y: 70
    width: 1120
    height: 0
    content: { type: plain, value: "MORNING CROSSWORD" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: "$text"
      text_align: center
      letter_spacing: 0.08
      text_transform: uppercase

