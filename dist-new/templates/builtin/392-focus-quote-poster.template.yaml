_protocol: template/v1

# Single-page focus quote poster · Thoreau quote · editorial-cream · display serif italic.
meta:
  id: tmpl-focus-quote-poster
  name: Focus Quote Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, productivity, quote, focus, editorial-cream, "4-5"]
  description: "Single-page editorial poster with a Thoreau quote on focus, breathing quote glyph, and serif italic display."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: top-rule
    type: rect
    z: 3
    x: 80
    y: 220
    width: 120
    height: 4
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 160
    width: 1040
    height: 0
    content: { type: plain, value: "ON FOCUS" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: quote-glyph
    type: text
    z: 20
    x: 80
    y: 280
    width: 200
    height: 0
    content: { type: plain, value: "“" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 800
      color: $accent
      line_height: 1.0

  - id: quote
    type: text
    z: 21
    x: 80
    y: 540
    width: 1040
    height: 0
    content: { type: plain, value: "It's not enough to be busy,\nso are the ants.\nThe question is —\nwhat are we busy about?" }
    style:
      font_family: $heading
      font_size: 56
      font_style: italic
      font_weight: 500
      color: $text
      line_height: 1.25
      letter_spacing: -0.01

  - id: divider
    type: rect
    z: 22
    x: 80
    y: 1180
    width: 80
    height: 2
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.5

  - id: author
    type: text
    z: 23
    x: 80
    y: 1220
    width: 1040
    height: 0
    content: { type: plain, value: "— Henry David Thoreau" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 600
      color: $primary
      letter_spacing: 0.02

  - id: author-meta
    type: text
    z: 24
    x: 80
    y: 1270
    width: 1040
    height: 0
    content: { type: plain, value: "Letter to Harrison Blake · 1857" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      letter_spacing: 0.16

  - id: page-mark
    type: text
    z: 30
    x: 80
    y: 1420
    width: 1040
    height: 0
    content: { type: plain, value: "FOLIO · ON FOCUS" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: right
      text_transform: uppercase

animations:
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  author:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }
  author-meta:
    enter: { type: fade_up, duration: 500, delay: 1100, easing: ease-out }
  quote-glyph:
    loop: { type: breathe, duration: 4000, scale: 1.08 }

slots:
  - { id: eyebrow,     path: "layers[3].content.value", type: text, hint: "Eyebrow tag",          default: "ON FOCUS" }
  - { id: quote,       path: "layers[5].content.value", type: text, hint: "Quote body",           default: "It's not enough to be busy,\nso are the ants.\nThe question is —\nwhat are we busy about?" }
  - { id: author,      path: "layers[7].content.value", type: text, hint: "Author attribution",   default: "— Henry David Thoreau" }
  - { id: author_meta, path: "layers[8].content.value", type: text, hint: "Author meta",          default: "Letter to Harrison Blake · 1857" }
  - { id: page_mark,   path: "layers[9].content.value", type: text, hint: "Page mark",            default: "FOLIO · ON FOCUS" }
