<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Folio">
  <!-- Rounded dark tile (matches Dark Tech editor chrome) -->
  <rect width="32" height="32" rx="7" fill="#15151f"/>
  <!-- Back sheet (offset up-left, dimmer) -->
  <rect x="8.5" y="6.5" width="13" height="17" rx="2"
        fill="#2a2a3d" stroke="#6c5ce7" stroke-width="1.1" stroke-opacity="0.55"/>
  <!-- Front sheet (offset down-right, brand indigo) -->
  <g>
    <rect x="11.5" y="9.5" width="13" height="17" rx="2" fill="#6c5ce7"/>
    <!-- Text lines on the front sheet -->
    <rect x="14"   y="13"   width="8"   height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="14"   y="16"   width="8"   height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="14"   y="19"   width="5.5" height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="14"   y="22"   width="8"   height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
