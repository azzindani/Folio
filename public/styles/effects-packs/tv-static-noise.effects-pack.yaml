_protocol: effects-pack/v1
id: tv-static-noise
name: TV Static Noise
version: "1.0.0"
tags: [tv, crt, static, noise, scanline, analog, glitch, vhs, chromatic]
description: "Analog CRT scanline and static noise — cyan rim glow with red/cyan chromatic split text."
effects:
  shadow_card:   "0 0 8px rgba(180,255,255,0.4), inset 0 0 32px rgba(0,255,255,0.06)"
  shadow_glow:   "0 0 6px rgba(0,255,255,0.5), 0 0 14px rgba(180,255,255,0.3)"
  shadow_inset:  "inset 0 0 24px rgba(0,255,255,0.08), inset 0 0 4px rgba(255,255,255,0.15)"
  shadow_text:   "1px 0 0 rgba(255,0,0,0.5), -1px 0 0 rgba(0,255,255,0.5)"
  blur_glass:    3
  blur_backdrop: 1
