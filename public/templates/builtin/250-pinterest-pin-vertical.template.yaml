_protocol: template/v1

# Pinterest pin — 1000×1500 portrait (2:3), pastel-dream theme.
# Top: image placeholder hero. Bottom: bold overlay headline on a
# pastel band with brand badge.
meta:
  id: tmpl-pinterest-pin-vertical
  name: Pinterest Pin Vertical
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, pinterest, pin, lifestyle, portrait, pastel]
  description: "Pinterest 2:3 pin with lifestyle image placeholder, bold overlay headline, and brand badge."

document:
  width: 1000
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1000
    height: 1500
    fill: { type: solid, color: "$background" }

  # ── Image placeholder hero ────────────────────────────────
  - id: image-frame
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1000
    height: 900
    fill:
      type: linear
      angle: 165
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 60 }
        - { color: "$accent", position: 100 }

  # ── Decorative leaf shapes ────────────────────────────────
  - id: leaf-1
    type: circle
    z: 2
    cx: 160
    cy: 220
    rx: 140
    ry: 140
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.18

  - id: leaf-2
    type: circle
    z: 2
    cx: 820
    cy: 720
    rx: 200
    ry: 200
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.16

  - id: leaf-3
    type: circle
    z: 2
    cx: 540
    cy: 460
    rx: 80
    ry: 80
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.22

  # ── Image label center ────────────────────────────────────
  - id: photo-tag
    type: text
    z: 3
    x: 0
    y: 430
    width: 1000
    height: 0
    content: { type: plain, value: "[ Lifestyle photo here ]" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 500
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3
      letter_spacing: 0.08
      text_transform: uppercase

  # ── Bottom band ───────────────────────────────────────────
  - id: bottom-band
    type: rect
    z: 10
    x: 0
    y: 900
    width: 1000
    height: 600
    fill: { type: solid, color: "$surface" }

  # ── Pin category tag ──────────────────────────────────────
  - id: tag-pill
    type: rect
    z: 11
    x: 60
    y: 950
    width: 240
    height: 56
    radius: 28
    fill: { type: solid, color: "$primary" }

  - id: tag-text
    type: text
    z: 12
    x: 60
    y: 967
    width: 240
    height: 0
    content: { type: plain, value: "COZY HOME" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: "#FFFFFF"
      text_align: center
      letter_spacing: 0.18
      text_transform: uppercase
      line_height: 1.3

  # ── Headline ──────────────────────────────────────────────
  - id: headline
    type: text
    z: 20
    x: 60
    y: 1060
    width: 880
    height: 0
    content: { type: plain, value: "12 budget-friendly\nways to refresh\nyour reading nook" }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 800
      color: $text
      line_height: 1.04
      letter_spacing: -0.025

  # ── Bottom divider ────────────────────────────────────────
  - id: bottom-divider
    type: rect
    z: 30
    x: 60
    y: 1370
    width: 880
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Brand badge / name ────────────────────────────────────
  - id: brand-dot
    type: circle
    z: 31
    cx: 90
    cy: 1422
    rx: 18
    ry: 18
    fill: { type: solid, color: "$accent" }

  - id: brand-name
    type: text
    z: 32
    x: 130
    y: 1408
    width: 600
    height: 0
    content: { type: plain, value: "thequietnest.co" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.3

  - id: brand-handle
    type: text
    z: 33
    x: 600
    y: 1414
    width: 340
    height: 0
    content: { type: plain, value: "PIN · SAVE · TRY" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $text_muted
      text_align: right
      letter_spacing: 0.32
      text_transform: uppercase
      line_height: 1.3

slots:
  - { id: headline,   path: "layers[9].content.value",  type: text, hint: "Pin headline",        default: "12 budget-friendly\nways to refresh\nyour reading nook" }
  - { id: brand_name, path: "layers[12].content.value", type: text, hint: "Brand / site name",   default: "thequietnest.co" }
