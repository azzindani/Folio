_protocol: template/v1

# Single-origin chocolate bar wrap — 1500×600 landscape, editorial-cream theme.
# Bean-to-bar specialty aesthetic: chocolatier name top, "SINGLE ORIGIN"
# eyebrow, % cacao HUGE display, origin region beneath, tasting notes
# row, weight + cocoa source footer, decorative cocoa pod silhouette.
meta:
  id: tmpl-chocolate-bar-wrap
  name: Chocolate Bar Wrap
  type: label
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [packaging, label, chocolate, food, single-origin, editorial, landscape]
  description: "Single-origin chocolate bar wrap with chocolatier, cacao %, origin, tasting notes, and weight."

document:
  width: 1500
  height: 600
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 600
    fill: { type: solid, color: "$background" }

  # ── Side panels (cocoa color blocks) ──────────────────────
  - id: panel-left
    type: rect
    z: 1
    x: 0
    y: 0
    width: 60
    height: 600
    fill: { type: solid, color: "$primary" }

  - id: panel-right
    type: rect
    z: 2
    x: 1440
    y: 0
    width: 60
    height: 600
    fill: { type: solid, color: "$primary" }

  # ── Cocoa pod silhouette (left side) ──────────────────────
  - id: pod-shape
    type: path
    z: 5
    d: "M 180 240 Q 130 300 180 360 Q 220 380 240 360 Q 280 300 240 240 Q 220 220 180 240 Z"
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: pod-line-1
    type: path
    z: 6
    d: "M 200 240 Q 200 300 200 360"
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: pod-line-2
    type: path
    z: 7
    d: "M 220 240 Q 220 300 220 360"
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  # ── Cocoa pod silhouette (right side) ─────────────────────
  - id: pod-shape-r
    type: path
    z: 8
    d: "M 1320 240 Q 1270 300 1320 360 Q 1360 380 1380 360 Q 1420 300 1380 240 Q 1360 220 1320 240 Z"
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: pod-line-r1
    type: path
    z: 9
    d: "M 1340 240 Q 1340 300 1340 360"
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: pod-line-r2
    type: path
    z: 10
    d: "M 1360 240 Q 1360 300 1360 360"
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  # ── Chocolatier name top ──────────────────────────────────
  - id: chocolatier
    type: text
    z: 15
    x: 300
    y: 80
    width: 900
    height: 0
    content: { type: plain, value: "DUSK & GRAIN" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text
      text_align: center
      letter_spacing: 0.6
      text_transform: uppercase

  - id: eyebrow
    type: text
    z: 16
    x: 300
    y: 116
    width: 900
    height: 0
    content: { type: plain, value: "SINGLE ORIGIN · BEAN TO BAR" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.5

  # ── Top divider ───────────────────────────────────────────
  - id: div-top
    type: rect
    z: 17
    x: 600
    y: 150
    width: 300
    height: 1
    fill: { type: solid, color: "$primary" }

  # ── % Cacao HUGE ──────────────────────────────────────────
  - id: cacao-pct
    type: text
    z: 20
    x: 300
    y: 180
    width: 900
    height: 0
    content: { type: plain, value: "72%" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 900
      color: $primary
      text_align: center
      line_height: 1
      letter_spacing: -0.04

  - id: cacao-label
    type: text
    z: 21
    x: 300
    y: 350
    width: 900
    height: 0
    content: { type: plain, value: "CACAO · DARK CHOCOLATE" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text
      text_align: center
      letter_spacing: 0.5

  # ── Origin ────────────────────────────────────────────────
  - id: origin-label
    type: text
    z: 25
    x: 300
    y: 388
    width: 900
    height: 0
    content: { type: plain, value: "ORIGIN" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text_muted
      text_align: center
      letter_spacing: 0.42

  - id: origin
    type: text
    z: 26
    x: 300
    y: 412
    width: 900
    height: 0
    content: { type: plain, value: "Chuncho · Cusco · Peru" }
    style:
      font_family: $heading
      font_size: 22
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.2

  # ── Mid divider ───────────────────────────────────────────
  - id: div-mid-l
    type: line
    z: 30
    x1: 540
    y1: 460
    x2: 700
    y2: 460
    stroke: { color: "$border", width: 1 }

  - id: div-mid-diamond
    type: rect
    z: 31
    x: 744
    y: 454
    width: 12
    height: 12
    rotation: 45
    fill: { type: solid, color: "$primary" }

  - id: div-mid-r
    type: line
    z: 32
    x1: 800
    y1: 460
    x2: 960
    y2: 460
    stroke: { color: "$border", width: 1 }

  # ── Tasting notes ─────────────────────────────────────────
  - id: notes-eyebrow
    type: text
    z: 35
    x: 300
    y: 480
    width: 900
    height: 0
    content: { type: plain, value: "NOTES" }
    style:
      font_family: $body
      font_size: 10
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.42

  - id: tasting-notes
    type: text
    z: 36
    x: 300
    y: 504
    width: 900
    height: 0
    content: { type: plain, value: "Red fruit · molasses · roasted hazelnut · whisper of cherry" }
    style:
      font_family: $body
      font_size: 14
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.4

  # ── Footer rule ───────────────────────────────────────────
  - id: footer-rule
    type: rect
    z: 50
    x: 300
    y: 552
    width: 900
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Weight + sourcing footer ──────────────────────────────
  - id: weight
    type: text
    z: 51
    x: 300
    y: 572
    width: 600
    height: 0
    content: { type: plain, value: "NET WT 70 g / 2.5 oz" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text
      text_align: left
      letter_spacing: 0.32

  - id: sourcing
    type: text
    z: 52
    x: 600
    y: 572
    width: 600
    height: 0
    content: { type: plain, value: "DIRECT-TRADE COCOA  ·  craftedinportland.co" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 600
      color: $text_muted
      text_align: right
      letter_spacing: 0.24

slots:
  - { id: chocolatier,    path: "layers[9].content.value",  type: text, hint: "Chocolatier name",      default: "DUSK & GRAIN" }
  - { id: cacao_pct,      path: "layers[12].content.value", type: text, hint: "Cacao percentage",      default: "72%" }
  - { id: origin,         path: "layers[15].content.value", type: text, hint: "Origin region",         default: "Chuncho · Cusco · Peru" }
  - { id: tasting_notes,  path: "layers[20].content.value", type: text, hint: "Tasting notes",         default: "Red fruit · molasses · roasted hazelnut · whisper of cherry" }
  - { id: weight_g,       path: "layers[22].content.value", type: text, hint: "Net weight",            default: "NET WT 70 g / 2.5 oz" }
