      - { id: mn1, type: text, z: 42, x: 100, y: 1060, width: 1040, height: 0, content: { type: plain, value: "✗  Store client data on personal devices, USB drives, or unapproved cloud services." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: mn2, type: text, z: 43, x: 100, y: 1120, width: 1040, height: 0, content: { type: plain, value: "✗  Send confidential information over unencrypted email or consumer messaging apps." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: mn3, type: text, z: 44, x: 100, y: 1180, width: 1040, height: 0, content: { type: plain, value: "✗  Discuss client matters in public — cafés, planes, ride-shares, or social media." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: mn4, type: text, z: 45, x: 100, y: 1240, width: 1040, height: 0, content: { type: plain, value: "✗  Install software outside of our Approved Software list without written IT approval." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: mn5, type: text, z: 46, x: 100, y: 1300, width: 1040, height: 0, content: { type: plain, value: "✗  Click links in unexpected emails — forward suspicious messages to phishing@meridian.co." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
