      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: intro, type: text, z: 20, x: 100, y: 380, width: 1040, height: 0, content: { type: plain, value: "Our clients trust us with confidential information. Every employee is responsible for safeguarding it. Negligence around these basics is grounds for discipline up to and including termination." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: must-title, type: text, z: 30, x: 100, y: 540, width: 1040, height: 0, content: { type: plain, value: "MUST DO" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
