      - { id: intro, type: text, z: 20, x: 100, y: 380, width: 1040, height: 0, content: { type: plain, value: "Most Meridian roles are hybrid by default. Some are fully office-based; a few are fully remote. The expectations below apply to anyone who works from somewhere other than a Meridian office for some or all of their week." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: r1-title, type: text, z: 30, x: 100, y: 580, width: 1040, height: 0, content: { type: plain, value: "1.  Core hours" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text } }
      - { id: r1-body, type: text, z: 31, x: 100, y: 620, width: 1040, height: 0, content: { type: plain, value: "10:00 — 15:00 local time, Monday to Friday. Be reachable on Slack and available for meetings during this window. Outside core hours, you choose when to work." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.7 } }
      - { id: r2-title, type: text, z: 40, x: 100, y: 760, width: 1040, height: 0, content: { type: plain, value: "2.  Office days" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text } }
      - { id: r2-body, type: text, z: 41, x: 100, y: 800, width: 1040, height: 0, content: { type: plain, value: "Hybrid employees come into the office at least 2 days per week. Tuesdays are an all-hands day for most teams; the other day is your choice. Book a desk in Robin before 9am." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.7 } }
      - { id: r3-title, type: text, z: 50, x: 100, y: 940, width: 1040, height: 0, content: { type: plain, value: "3.  Working from another country" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text } }
      - { id: r3-body, type: text, z: 51, x: 100, y: 980, width: 1040, height: 0, content: { type: plain, value: "You may work from any country for up to 30 calendar days per year, provided you notify People Ops at least 14 days in advance. Longer stays trigger tax and employment-law obligations and require written pre-approval." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.7 } }
      - { id: r4-title, type: text, z: 60, x: 100, y: 1140, width: 1040, height: 0, content: { type: plain, value: "4.  Your home setup" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text } }
      - { id: r4-body, type: text, z: 61, x: 100, y: 1180, width: 1040, height: 0, content: { type: plain, value: "You are responsible for a reliable internet connection (≥ 50 Mbps), a quiet space for calls, and a workspace that meets basic ergonomic and safety standards. The home-office stipend exists to help you build this." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.7 } }
      - { id: r5-title, type: text, z: 70, x: 100, y: 1340, width: 1040, height: 0, content: { type: plain, value: "5.  Etiquette on video calls" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text } }
      - { id: r5-body, type: text, z: 71, x: 100, y: 1380, width: 1040, height: 0, content: { type: plain, value: "Camera on by default for internal meetings of 6 or fewer; optional for larger meetings. Mute by default. Use the chat for clarifying questions to avoid talking over each other." }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.7 } }
