_protocol: template/v1

# 12-page employee handbook — 1240×1754 A4 portrait, corporate-slate theme.
# Cover → welcome → values → conduct → time-off → benefits → expenses →
# remote → security → harassment → contacts → signature.
meta:
  id: tmpl-employee-handbook
  name: Employee Handbook · 12 Pages
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, handbook, hr, policy, corporate, a4]
  description: "Twelve-page employee handbook covering welcome, values, code of conduct, time off, benefits, expenses, remote work, security, harassment, contacts, and signature acknowledgement."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: accent-block, type: rect, z: 1, x: 0, y: 0, width: 1240, height: 880, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: logo, type: text, z: 10, x: 100, y: 120, width: 600, height: 0, content: { type: plain, value: "◆ MERIDIAN CAPITAL" }, style: { font_family: $heading, font_size: 22, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.4 } }
      - { id: year, type: text, z: 11, x: 1040, y: 120, width: 120, height: 0, content: { type: plain, value: "2026" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: "#FFFFFF", text_align: right, letter_spacing: 0.2 } }
      - { id: kicker, type: text, z: 20, x: 100, y: 440, width: 1040, height: 0, content: { type: plain, value: "EMPLOYEE HANDBOOK" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.6 } }
      - { id: title, type: text, z: 21, x: 100, y: 500, width: 1040, height: 0, content: { type: plain, value: "How we\nwork together." }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.03 } }
      - { id: subtitle, type: text, z: 22, x: 100, y: 760, width: 1040, height: 0, content: { type: plain, value: "Policies, benefits and expectations · Effective January 1, 2026" }, style: { font_family: $body, font_size: 20, color: "#FFFFFF", opacity: 0.9, line_height: 1.4 } }
      - { id: toc-label, type: text, z: 30, x: 100, y: 1000, width: 1040, height: 0, content: { type: plain, value: "WHAT'S INSIDE" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: toc-rule, type: rect, z: 31, x: 100, y: 1040, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: toc-1, type: text, z: 32, x: 100, y: 1080, width: 1040, height: 0, content: { type: plain, value: "01 · Welcome from our CEO" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-2, type: text, z: 32, x: 100, y: 1120, width: 1040, height: 0, content: { type: plain, value: "02 · Our values" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-3, type: text, z: 32, x: 100, y: 1160, width: 1040, height: 0, content: { type: plain, value: "03 · Code of conduct" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-4, type: text, z: 32, x: 100, y: 1200, width: 1040, height: 0, content: { type: plain, value: "04 · Time off" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-5, type: text, z: 32, x: 100, y: 1240, width: 1040, height: 0, content: { type: plain, value: "05 · Benefits" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-6, type: text, z: 32, x: 100, y: 1280, width: 1040, height: 0, content: { type: plain, value: "06 · Expenses & travel" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-7, type: text, z: 32, x: 100, y: 1320, width: 1040, height: 0, content: { type: plain, value: "07 · Remote & flexible work" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-8, type: text, z: 32, x: 100, y: 1360, width: 1040, height: 0, content: { type: plain, value: "08 · Security & data" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-9, type: text, z: 32, x: 100, y: 1400, width: 1040, height: 0, content: { type: plain, value: "09 · Anti-harassment policy" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-10, type: text, z: 32, x: 100, y: 1440, width: 1040, height: 0, content: { type: plain, value: "10 · Contacts" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: toc-11, type: text, z: 32, x: 100, y: 1480, width: 1040, height: 0, content: { type: plain, value: "11 · Acknowledgement & signature" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: foot-rule, type: rect, z: 40, x: 100, y: 1600, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: confidential, type: text, z: 41, x: 100, y: 1640, width: 600, height: 0, content: { type: plain, value: "CONFIDENTIAL · FOR INTERNAL USE" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.3 } }
      - { id: pn, type: text, z: 42, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "01 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

  # ── Page 2 · Welcome Letter ───────────────────────────────
  - id: welcome
    label: Welcome
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "01 · A WELCOME" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Glad you're here." }, style: { font_family: $heading, font_size: 64, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 290, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: p1, type: text, z: 20, x: 100, y: 340, width: 1040, height: 0, content: { type: plain, value: "Whether this is your first week or your fifth year, thank you for being part of Meridian. This handbook is not a contract and it is not meant to cover every situation you will encounter. It is a map of how we have agreed to work together — the policies that hold us accountable to each other, and the benefits and expectations that go with employment here." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: p2, type: text, z: 21, x: 100, y: 560, width: 1040, height: 0, content: { type: plain, value: "We try to write our policies the way we wish other companies wrote theirs: plainly, with judgement built in, and with the assumption that you are a capable adult. We will not always get it right. When you find something that is unclear, contradictory or out of date, please tell People Ops. We update this handbook quarterly." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: p3, type: text, z: 22, x: 100, y: 800, width: 1040, height: 0, content: { type: plain, value: "Three short ideas to keep in mind as you read on. First, default to trust and verify only when there is a real reason. Second, ask for help early and often — small problems are cheap to fix, big ones are expensive. Third, do the kind, careful thing even when nobody is watching, because someone always is, and because it is the right thing." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: p4, type: text, z: 23, x: 100, y: 1040, width: 1040, height: 0, content: { type: plain, value: "If you ever feel uncertain about whether something is permitted, the answer is usually to ask. Our doors and inboxes are open. We are a better company because of every person who joins it. Welcome aboard." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: sig-rule, type: rect, z: 30, x: 100, y: 1280, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: sig, type: text, z: 31, x: 100, y: 1320, width: 1040, height: 0, content: { type: plain, value: "Catherine Bauer" }, style: { font_family: $heading, font_size: 32, font_style: italic, color: $text } }
      - { id: sig-role, type: text, z: 32, x: 100, y: 1380, width: 1040, height: 0, content: { type: plain, value: "Chair & Chief Executive Officer" }, style: { font_family: $body, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: sig-date, type: text, z: 33, x: 100, y: 1410, width: 1040, height: 0, content: { type: plain, value: "January 2, 2026" }, style: { font_family: $mono, font_size: 14, color: $text_muted } }
      - { id: pn, type: text, z: 40, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "02 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Page 3 · Values ───────────────────────────────────────
  - id: values
    label: Our Values
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "02 · OUR VALUES" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Five ideas we keep coming back to." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: v1-num, type: text, z: 20, x: 100, y: 390, width: 100, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: v1-title, type: text, z: 21, x: 240, y: 400, width: 900, height: 0, content: { type: plain, value: "Clients first, always." }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: v1-body, type: text, z: 22, x: 240, y: 446, width: 900, height: 0, content: { type: plain, value: "When in doubt, take the option that serves the client better, even when it costs us something in the short term. The trust we build pays back many times over." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.7 } }
      - { id: v2-num, type: text, z: 20, x: 100, y: 600, width: 100, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: v2-title, type: text, z: 21, x: 240, y: 610, width: 900, height: 0, content: { type: plain, value: "Plain words, plain numbers." }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: v2-body, type: text, z: 22, x: 240, y: 656, width: 900, height: 0, content: { type: plain, value: "Say what you mean. Show your assumptions. Round your numbers honestly. Jargon is a tax on the reader; we try not to charge it." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.7 } }
      - { id: v3-num, type: text, z: 20, x: 100, y: 810, width: 100, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: v3-title, type: text, z: 21, x: 240, y: 820, width: 900, height: 0, content: { type: plain, value: "Disagree, decide, commit." }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: v3-body, type: text, z: 22, x: 240, y: 866, width: 900, height: 0, content: { type: plain, value: "Air your strongest objections in the meeting, not in the hallway after it. Once a decision is made, give it your full effort — even the one you argued against." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.7 } }
      - { id: v4-num, type: text, z: 20, x: 100, y: 1020, width: 100, height: 0, content: { type: plain, value: "04" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: v4-title, type: text, z: 21, x: 240, y: 1030, width: 900, height: 0, content: { type: plain, value: "Care for the craft." }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: v4-body, type: text, z: 22, x: 240, y: 1076, width: 900, height: 0, content: { type: plain, value: "Polish your work. Read it again. Check the numbers once more. The small last passes are what make the difference between competent and excellent." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.7 } }
      - { id: v5-num, type: text, z: 20, x: 100, y: 1230, width: 100, height: 0, content: { type: plain, value: "05" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: v5-title, type: text, z: 21, x: 240, y: 1240, width: 900, height: 0, content: { type: plain, value: "Leave it better than you found it." }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: v5-body, type: text, z: 22, x: 240, y: 1286, width: 900, height: 0, content: { type: plain, value: "The doc, the codebase, the conference room, the company. Small acts of stewardship compound. So do small acts of neglect." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.7 } }
      - { id: callout, type: rect, z: 30, x: 100, y: 1480, width: 1040, height: 130, radius: 8, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: callout-text, type: text, z: 31, x: 140, y: 1510, width: 960, height: 0, content: { type: plain, value: "These are aspirations, not slogans. We measure ourselves against them in performance reviews and in the choices we make every day." }, style: { font_family: $body, font_size: 15, font_style: italic, color: $text, line_height: 1.6 } }
      - { id: pn, type: text, z: 40, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "03 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Page 4 · Code of Conduct ──────────────────────────────
  - id: conduct
    label: Code of Conduct
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "03 · CODE OF CONDUCT" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "How we treat each other." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: intro, type: text, z: 20, x: 100, y: 380, width: 1040, height: 0, content: { type: plain, value: "Meridian is committed to a working environment that is respectful, inclusive and professional. The expectations below apply to every employee, contractor and visitor — in the office, on remote calls, at company-sponsored events and on every channel we use to communicate." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: rule-1, type: rect, z: 30, x: 100, y: 580, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: do-title, type: text, z: 31, x: 100, y: 610, width: 460, height: 0, content: { type: plain, value: "WE DO" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: do-1, type: text, z: 32, x: 100, y: 660, width: 460, height: 0, content: { type: plain, value: "✓  Treat colleagues with respect, regardless of role or tenure." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: do-2, type: text, z: 32, x: 100, y: 720, width: 460, height: 0, content: { type: plain, value: "✓  Disagree about ideas, never about people." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: do-3, type: text, z: 32, x: 100, y: 780, width: 460, height: 0, content: { type: plain, value: "✓  Give feedback specifically, kindly and promptly." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: do-4, type: text, z: 32, x: 100, y: 840, width: 460, height: 0, content: { type: plain, value: "✓  Honour confidentiality — yours, our clients', and each other's." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: do-5, type: text, z: 32, x: 100, y: 900, width: 460, height: 0, content: { type: plain, value: "✓  Report concerns through the channels described on page 11." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: do-6, type: text, z: 32, x: 100, y: 960, width: 460, height: 0, content: { type: plain, value: "✓  Acknowledge mistakes and work to repair them." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: dont-title, type: text, z: 40, x: 620, y: 610, width: 520, height: 0, content: { type: plain, value: "WE DON'T" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "#B5421A", letter_spacing: 0.5 } }
      - { id: dont-1, type: text, z: 41, x: 620, y: 660, width: 520, height: 0, content: { type: plain, value: "✗  Discriminate or harass on the basis of any protected class." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: dont-2, type: text, z: 41, x: 620, y: 720, width: 520, height: 0, content: { type: plain, value: "✗  Speak about colleagues in ways we would not say to their face." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: dont-3, type: text, z: 41, x: 620, y: 780, width: 520, height: 0, content: { type: plain, value: "✗  Share client data outside the engagement scope." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: dont-4, type: text, z: 41, x: 620, y: 840, width: 520, height: 0, content: { type: plain, value: "✗  Accept gifts above $100 without disclosure." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: dont-5, type: text, z: 41, x: 620, y: 900, width: 520, height: 0, content: { type: plain, value: "✗  Hold side roles that conflict with Meridian's interests." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: dont-6, type: text, z: 41, x: 620, y: 960, width: 520, height: 0, content: { type: plain, value: "✗  Retaliate against anyone who raises a concern in good faith." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: closing-rule, type: rect, z: 50, x: 100, y: 1100, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: closing, type: text, z: 51, x: 100, y: 1140, width: 1040, height: 0, content: { type: plain, value: "Violations of this Code may result in disciplinary action up to and including termination of employment. Serious breaches may also be reported to relevant authorities. If you witness or experience a violation, contact your manager, People Ops or use the anonymous Ethics Hotline described on page 11." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.7 } }
      - { id: pn, type: text, z: 60, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "04 / 12" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Page 5 · Time Off ─────────────────────────────────────
  - id: time-off
    label: Time Off
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "04 · TIME OFF" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Rest is part of the job." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: c1, type: rect, z: 20, x: 100, y: 380, width: 500, height: 260, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: c1-l, type: text, z: 21, x: 140, y: 420, width: 420, height: 0, content: { type: plain, value: "ANNUAL LEAVE" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: c1-v, type: text, z: 22, x: 140, y: 460, width: 420, height: 0, content: { type: plain, value: "25 days" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: c1-s, type: text, z: 23, x: 140, y: 560, width: 420, height: 0, content: { type: plain, value: "Per calendar year, accrued monthly. Carry up to 5 unused days into the next year." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.5 } }
      - { id: c2, type: rect, z: 20, x: 640, y: 380, width: 500, height: 260, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
