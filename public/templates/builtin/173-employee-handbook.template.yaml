      - { id: m1, type: text, z: 32, x: 100, y: 620, width: 1040, height: 0, content: { type: plain, value: "✓  Enable two-factor authentication on every Meridian account, without exception." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: m2, type: text, z: 33, x: 100, y: 680, width: 1040, height: 0, content: { type: plain, value: "✓  Use 1Password (provided) for every credential. No reused passwords, no shared logins." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: m3, type: text, z: 34, x: 100, y: 740, width: 1040, height: 0, content: { type: plain, value: "✓  Encrypt your laptop with FileVault or BitLocker. IT will check on first day." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: m4, type: text, z: 35, x: 100, y: 800, width: 1040, height: 0, content: { type: plain, value: "✓  Report a lost device or suspected breach to security@meridian.co within 1 hour." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: m5, type: text, z: 36, x: 100, y: 860, width: 1040, height: 0, content: { type: plain, value: "✓  Complete the annual security training within 30 days of your hire anniversary." }, style: { font_family: $body, font_size: 15, color: $text, line_height: 1.8 } }
      - { id: must-not, type: text, z: 40, x: 100, y: 980, width: 1040, height: 0, content: { type: plain, value: "MUST NOT" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "#B5421A", letter_spacing: 0.5 } }
