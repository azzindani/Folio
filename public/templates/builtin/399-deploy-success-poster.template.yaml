_protocol: template/v1

# Single-page poster · Deploy/release announcement for engineering teams.
# Version number hero, 3 changelog highlights, kubectl command snippet.
meta:
  id: tmpl-deploy-success-poster
  name: Deploy Success Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, engineering, devops, release, deploy, dark, 4-5]
  description: "LinkedIn 4:5 release announcement · version hero, changelog highlights, deploy command."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }
  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }
  - { id: accent-dot, type: circle, z: 5, cx: 1130, cy: 130, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "SHIPPED · 17 MAY 2026" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.4, text_transform: uppercase }

  - id: version-prefix
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "RELEASE" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text_muted, letter_spacing: 0.3, text_transform: uppercase }

  - id: version
    type: text
    z: 22
    x: 80
    y: 260
    width: 1040
    height: 0
    content: { type: plain, value: "v3.2.0" }
    style: { font_family: $heading, font_size: 110, font_weight: 900, color: $primary, line_height: 0.95, letter_spacing: -0.04 }

  - id: subtitle
    type: text
    z: 23
    x: 80
    y: 410
    width: 1040
    height: 0
    content: { type: plain, value: "Performance optimizations & DX improvements." }
    style: { font_family: $body, font_size: 30, color: $text, line_height: 1.4 }

  - id: divider-1
    type: rect
    z: 10
    x: 80
    y: 530
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.25

  - id: highlights-header
    type: text
    z: 30
    x: 80
    y: 560
    width: 1040
    height: 0
    content: { type: plain, value: "HIGHLIGHTS" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }

  # ── Card 1
  - { id: card-1-bg, type: rect, z: 31, x: 80, y: 620, width: 1040, height: 110, radius: 12, fill: { type: solid, color: "$surface" } }
  - { id: card-1-num, type: text, z: 32, x: 110, y: 655, width: 60, height: 0, content: { type: plain, value: "01" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $primary, letter_spacing: 0.2 } }
  - { id: card-1-text, type: text, z: 33, x: 200, y: 656, width: 880, height: 0, content: { type: plain, value: "Cold-start latency down 38% — lazy-loaded the editor bundle." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.4 } }

  # ── Card 2
  - { id: card-2-bg, type: rect, z: 31, x: 80, y: 750, width: 1040, height: 110, radius: 12, fill: { type: solid, color: "$surface" } }
  - { id: card-2-num, type: text, z: 32, x: 110, y: 785, width: 60, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $primary, letter_spacing: 0.2 } }
  - { id: card-2-text, type: text, z: 33, x: 200, y: 786, width: 880, height: 0, content: { type: plain, value: "New CLI: folio dev, folio build, folio export — one binary, zero config." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.4 } }

  # ── Card 3
  - { id: card-3-bg, type: rect, z: 31, x: 80, y: 880, width: 1040, height: 110, radius: 12, fill: { type: solid, color: "$surface" } }
  - { id: card-3-num, type: text, z: 32, x: 110, y: 915, width: 60, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $primary, letter_spacing: 0.2 } }
  - { id: card-3-text, type: text, z: 33, x: 200, y: 916, width: 880, height: 0, content: { type: plain, value: "Type-safe template schema — autocompletes every slot from your IDE." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.4 } }

  # ── Deploy command card
  - { id: deploy-card, type: rect, z: 40, x: 80, y: 1050, width: 1040, height: 240, radius: 12, fill: { type: solid, color: "$surface" } }
  - { id: deploy-label, type: text, z: 41, x: 112, y: 1080, width: 980, height: 0, content: { type: plain, value: "DEPLOY" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase } }
  - { id: deploy-command, type: text, z: 42, x: 112, y: 1120, width: 980, height: 0, content: { type: plain, value: "$ kubectl rollout restart deployment/folio-web -n prod\n$ kubectl rollout status deployment/folio-web -n prod\ndeployment \"folio-web\" successfully rolled out  ✓" }, style: { font_family: $mono, font_size: 18, color: $text, line_height: 1.6 } }

  - id: author
    type: text
    z: 70
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "@yourhandle · github.com/yourorg/folio" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 }

  - id: footer-mark
    type: text
    z: 71
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "RELEASE · STABLE" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  accent-band:
    loop: { type: breathe, duration: 3000 }
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.3 }
  version:
    enter: { type: scale_in, duration: 700, delay: 100, easing: ease-out }
  subtitle:
    enter: { type: fade_up, duration: 600, delay: 300, easing: ease-out }
  card-1-bg:
    enter: { type: fade_up, duration: 600, delay: 400, easing: ease-out }
  card-2-bg:
    enter: { type: fade_up, duration: 600, delay: 600, easing: ease-out }
  card-3-bg:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }
  deploy-card:
    enter: { type: fade_up, duration: 700, delay: 1000, easing: ease-out }

slots:
  - { id: eyebrow,         path: "layers[3].content.value",  type: text, hint: "Eyebrow + date",     default: "SHIPPED · 17 MAY 2026" }
  - { id: version,         path: "layers[5].content.value",  type: text, hint: "Version label",      default: "v3.2.0" }
  - { id: subtitle,        path: "layers[6].content.value",  type: text, hint: "Release subtitle",   default: "Performance optimizations & DX improvements." }
  - { id: card_1_text,     path: "layers[11].content.value", type: text, hint: "Highlight 1",        default: "Cold-start latency down 38% — lazy-loaded the editor bundle." }
  - { id: card_2_text,     path: "layers[14].content.value", type: text, hint: "Highlight 2",        default: "New CLI: folio dev, folio build, folio export — one binary, zero config." }
  - { id: card_3_text,     path: "layers[17].content.value", type: text, hint: "Highlight 3",        default: "Type-safe template schema — autocompletes every slot from your IDE." }
  - { id: deploy_command,  path: "layers[20].content.value", type: text, hint: "Deploy command",     default: "$ kubectl rollout restart deployment/folio-web -n prod\n$ kubectl rollout status deployment/folio-web -n prod\ndeployment \"folio-web\" successfully rolled out  ✓" }
  - { id: author,          path: "layers[21].content.value", type: text, hint: "Author / repo",      default: "@yourhandle · github.com/yourorg/folio" }
