_protocol: template/v1

# Single-page poster · Engineering quote pull-quote with editorial layout.
# Display serif italic quote, attribution, subtle decorative glyph.
meta:
  id: tmpl-engineering-quote-poster
  name: Engineering Quote Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, engineering, quote, editorial, mono, 4-5]
  description: "LinkedIn 4:5 quote poster · serif italic pull-quote, attribution, decorative glyph. Mono print."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: mono-print

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }
  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 10, fill: { type: solid, color: "$text" } }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "ENGINEERING" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $text, letter_spacing: 0.5, text_transform: uppercase }

  - id: eyebrow-rule
    type: rect
    z: 21
    x: 80
    y: 160
    width: 80
    height: 2
    fill: { type: solid, color: "$text" }

  - id: glyph
    type: text
    z: 30
    x: 80
    y: 240
    width: 1040
    height: 0
    content: { type: plain, value: "“" }
    style: { font_family: $heading, font_size: 360, font_weight: 400, color: $text, line_height: 0.9, font_style: italic }
    opacity: 0.18

  - id: quote
    type: text
    z: 40
    x: 80
    y: 540
    width: 1040
    height: 0
    content: { type: plain, value: "Premature optimization\nis the root of all evil." }
    style: { font_family: $heading, font_size: 56, font_weight: 500, color: $text, line_height: 1.2, letter_spacing: -0.01, font_style: italic }

  - id: quote-dash
    type: rect
    z: 41
    x: 80
    y: 880
    width: 60
    height: 2
    fill: { type: solid, color: "$text" }

  - id: author
    type: text
    z: 42
    x: 160
    y: 870
    width: 900
    height: 0
    content: { type: plain, value: "Donald Knuth" }
    style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text, line_height: 1.3, letter_spacing: 0.01 }

  - id: author-meta
    type: text
    z: 43
    x: 160
    y: 920
    width: 900
    height: 0
    content: { type: plain, value: "Structured Programming with go to Statements · 1974" }
    style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.4, font_style: italic }

  - id: divider
    type: rect
    z: 10
    x: 80
    y: 1320
    width: 1040
    height: 1
    fill: { type: solid, color: "$text" }
    opacity: 0.2

  - id: footer-tag
    type: text
    z: 70
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "@yourhandle · a weekly engineering quote" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 }

  - id: footer-mark
    type: text
    z: 71
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "№ 01 · 2026" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $text, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  glyph:
    loop: { type: breathe, duration: 4000 }
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  author:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }
  author-meta:
    enter: { type: fade_up, duration: 600, delay: 1000, easing: ease-out }

slots:
  - { id: eyebrow,      path: "layers[2].content.value",  type: text, hint: "Eyebrow tag",      default: "ENGINEERING" }
  - { id: quote,        path: "layers[5].content.value",  type: text, hint: "Quote body",       default: "Premature optimization\nis the root of all evil." }
  - { id: author,       path: "layers[7].content.value",  type: text, hint: "Author name",      default: "Donald Knuth" }
  - { id: author_meta,  path: "layers[8].content.value",  type: text, hint: "Source + year",    default: "Structured Programming with go to Statements · 1974" }
  - { id: footer_tag,   path: "layers[10].content.value", type: text, hint: "Footer tag",       default: "@yourhandle · a weekly engineering quote" }
  - { id: footer_mark,  path: "layers[11].content.value", type: text, hint: "Issue number",     default: "№ 01 · 2026" }
