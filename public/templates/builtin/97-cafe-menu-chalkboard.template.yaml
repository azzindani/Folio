    y: 130
    width: 880
    height: 0
    content: { type: plain, value: "— THE DAILY MENU —" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: "#F2EAD3"
      letter_spacing: 0.6
      text_align: center
      text_transform: uppercase
      opacity: 0.7

  - id: cafe-name
    type: text
    z: 11
    x: 100
    y: 160
    width: 880
    height: 0
    content: { type: plain, value: "Birch & Bramble" }
