_protocol: template/v1

# Chalkboard cafe menu — 1080×1350 portrait, forest-deep theme.
# Distinct: handwritten feel via italic heading, dotted leader rows,
# two sections (Espresso, Pastries), chalk-textured ornaments (stars,
# scribble lines), price column right-aligned.
meta:
  id: tmpl-cafe-menu-chalkboard
  name: Cafe Menu · Chalkboard
  type: menu
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [menu, cafe, chalkboard, coffee, casual, portrait]
  description: "Chalkboard-style cafe menu with espresso drinks and pastries, handwriting-style typography, and chalk-texture ornaments."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: forest-deep

layers:
  # ── Chalkboard background ─────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1350
    fill: { type: solid, color: "$background" }

  - id: bg-noise
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 1350
    fill:
      type: noise
      opacity: 0.06
      frequency: 0.9
      octaves: 3

  # ── Outer chalk frame ─────────────────────────────────────
  - id: frame
    type: rect
    z: 2
    x: 50
    y: 50
    width: 980
    height: 1250
    fill: { type: solid, color: "transparent" }
    stroke:
      color: "#F2EAD3"
      width: 2
      dash: [6, 8]

  # ── Chalk stars (top decorations) ─────────────────────────
  - id: star-tl
    type: text
    z: 5
    x: 80
    y: 90
    width: 60
    height: 0
    content: { type: plain, value: "✦" }
    style:
      font_family: $heading
      font_size: 28
      color: "#F2EAD3"
      opacity: 0.7

  - id: star-tr
    type: text
    z: 6
    x: 940
    y: 90
    width: 60
    height: 0
    content: { type: plain, value: "✦" }
