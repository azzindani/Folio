        width: 960
        height: 0
        content: { type: plain, value: "PHASE 04 · COMPOUND" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: phase-number
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "1 year" }
        style: { font_family: $heading, font_size: 120, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 }
      - id: m1-num
        type: text
        z: 20
        x: 60
        y: 480
        width: 80
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m1-text
        type: text
        z: 21
        x: 140
        y: 478
        width: 880
        height: 0
        content: { type: plain, value: "You own a function nobody else covers." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m2-num
