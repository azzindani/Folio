        y: 600
        width: 80
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m2-text
        type: text
        z: 23
        x: 140
        y: 598
        width: 880
        height: 0
        content: { type: plain, value: "You mentor the next new hire." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m3-num
        type: text
        z: 24
        x: 60
        y: 720
        width: 80
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m3-text
        type: text
        z: 25
        x: 140
        y: 718
        width: 880
        height: 0
        content: { type: plain, value: "You changed how the team works." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 7 · CTA ──────────────────────────────────────────
  - id: cta
    label: CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $primary } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(0,0,0,0.35)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$secondary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
