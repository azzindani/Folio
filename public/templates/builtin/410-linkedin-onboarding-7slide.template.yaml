_protocol: template/v1

# 7-slide LinkedIn carousel — Onboard new hires in 30/60/90 days + 1-year arc.
# Cover → Why onboarding fails → 30 / 60 / 90 / 1-year (3 milestones each) → CTA. Forest deep.
meta:
  id: tmpl-linkedin-onboarding-7slide
  name: LinkedIn Onboarding 30/60/90 (7 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, hr, onboarding, 30-60-90, 4-5]
  description: "7-slide LinkedIn carousel: onboard new hires through 30, 60, 90 days and one year."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: forest-deep

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "1/7" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 440
        width: 960
        height: 0
        content: { type: plain, value: "PEOPLE OPS · PLAYBOOK" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 500
        width: 960
        height: 0
        content: { type: plain, value: "Onboard new hires\nin 30 / 60 / 90 days" }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 13
        x: 60
        y: 820
        width: 960
        height: 0
        content: { type: plain, value: "Plus the 1-year arc most teams miss. Swipe →" }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: handle
        type: text
        z: 14
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }

  # ── Slide 2 · Why fails ────────────────────────────────────
  - id: why-fails
    label: Why onboarding fails
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "2/7" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "THE PROBLEM" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Why most onboarding fails" }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15 }
      - id: pain-1-dot
        type: circle
        z: 20
        cx: 100
        cy: 460
        rx: 14
        ry: 14
        fill: { type: solid, color: "$secondary" }
      - id: pain-1-text
        type: text
        z: 21
        x: 140
        y: 440
        width: 880
        height: 0
        content: { type: plain, value: "Day 1 = laptop + Slack invite + silence." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: pain-2-dot
        type: circle
        z: 20
        cx: 100
        cy: 560
        rx: 14
        ry: 14
        fill: { type: solid, color: "$secondary" }
      - id: pain-2-text
        type: text
        z: 22
        x: 140
        y: 540
        width: 880
        height: 0
        content: { type: plain, value: "No first-week deliverable to point at." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: pain-3-dot
        type: circle
        z: 20
        cx: 100
        cy: 660
        rx: 14
        ry: 14
        fill: { type: solid, color: "$secondary" }
      - id: pain-3-text
        type: text
        z: 23
        x: 140
        y: 640
        width: 880
        height: 0
        content: { type: plain, value: "Manager is too busy by week three." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: pain-4-dot
        type: circle
        z: 20
        cx: 100
        cy: 760
        rx: 14
        ry: 14
        fill: { type: solid, color: "$secondary" }
      - id: pain-4-text
        type: text
        z: 24
        x: 140
        y: 740
        width: 880
        height: 0
        content: { type: plain, value: "Nobody checks in at the 90-day mark." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 3 · 30 days ──────────────────────────────────────
  - id: day-30
    label: 30 days
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "3/7" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: phase-label
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "PHASE 01 · ABSORB" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: phase-number
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "30 days" }
        style: { font_family: $heading, font_size: 120, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 }
      - id: m1-num
        type: text
        z: 20
        x: 60
        y: 480
        width: 80
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m1-text
        type: text
        z: 21
        x: 140
        y: 478
        width: 880
        height: 0
        content: { type: plain, value: "Meet every teammate 1:1." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m2-num
        type: text
        z: 22
        x: 60
        y: 600
        width: 80
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m2-text
        type: text
        z: 23
        x: 140
        y: 598
        width: 880
        height: 0
        content: { type: plain, value: "Ship one tiny PR or doc edit." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m3-num
        type: text
        z: 24
        x: 60
        y: 720
        width: 80
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m3-text
        type: text
        z: 25
        x: 140
        y: 718
        width: 880
        height: 0
        content: { type: plain, value: "Write a fresh-eyes feedback note." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 4 · 60 days ──────────────────────────────────────
  - id: day-60
    label: 60 days
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "4/7" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: phase-label
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "PHASE 02 · CONTRIBUTE" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: phase-number
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "60 days" }
        style: { font_family: $heading, font_size: 120, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 }
      - id: m1-num
        type: text
        z: 20
        x: 60
        y: 480
        width: 80
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m1-text
        type: text
        z: 21
        x: 140
        y: 478
        width: 880
        height: 0
        content: { type: plain, value: "Own one project end-to-end." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m2-num
        type: text
        z: 22
        x: 60
        y: 600
        width: 80
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m2-text
        type: text
        z: 23
        x: 140
        y: 598
        width: 880
        height: 0
        content: { type: plain, value: "Lead a meeting or stand-up." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m3-num
        type: text
        z: 24
        x: 60
        y: 720
        width: 80
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m3-text
        type: text
        z: 25
        x: 140
        y: 718
        width: 880
        height: 0
        content: { type: plain, value: "Document one process you owned." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 5 · 90 days ──────────────────────────────────────
  - id: day-90
    label: 90 days
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "5/7" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: phase-label
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "PHASE 03 · OWN" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: phase-number
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "90 days" }
        style: { font_family: $heading, font_size: 120, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 }
      - id: m1-num
        type: text
        z: 20
        x: 60
        y: 480
        width: 80
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m1-text
        type: text
        z: 21
        x: 140
        y: 478
        width: 880
        height: 0
        content: { type: plain, value: "Define your role's success metric." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m2-num
        type: text
        z: 22
        x: 60
        y: 600
        width: 80
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m2-text
        type: text
        z: 23
        x: 140
        y: 598
        width: 880
        height: 0
        content: { type: plain, value: "Run a 360 with manager + peers." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: m3-num
        type: text
        z: 24
        x: 60
        y: 720
        width: 80
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: m3-text
        type: text
        z: 25
        x: 140
        y: 718
        width: 880
        height: 0
        content: { type: plain, value: "Propose one bigger bet for the year." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 6 · 1 year ───────────────────────────────────────
  - id: year-1
    label: 1 year
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
