        z: 12
        x: 60
        y: 660
        width: 960
        height: 0
        content: { type: plain, value: "Drop it in your next hiring-manager kickoff. Save it for the next hire." }
        style: { font_family: $body, font_size: 28, color: "#F0F0FF", line_height: 1.4 }
      - id: cta-btn
        type: rect
        z: 13
        x: 60
        y: 860
        width: 300
        height: 64
        radius: 32
        fill: { type: solid, color: "#FFFFFF" }
      - id: cta-text
        type: text
        z: 14
        x: 60
        y: 878
        width: 300
        height: 0
        content: { type: plain, value: "Follow →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#052E16", text_align: center }
      - id: handle
        type: text
        z: 15
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",        default: "Onboard new hires\nin 30 / 60 / 90 days" }
  - { id: cover_tagline,  path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",         default: "Plus the 1-year arc most teams miss. Swipe →" }
  - { id: why_title,      path: "pages[1].layers[4].content.value", type: text, hint: "Why-fails title",       default: "Why most onboarding fails" }
  - { id: d30_m1,         path: "pages[2].layers[6].content.value", type: text, hint: "30-day milestone 1",    default: "Meet every teammate 1:1." }
  - { id: d30_m2,         path: "pages[2].layers[8].content.value", type: text, hint: "30-day milestone 2",    default: "Ship one tiny PR or doc edit." }
  - { id: d30_m3,         path: "pages[2].layers[10].content.value", type: text, hint: "30-day milestone 3",   default: "Write a fresh-eyes feedback note." }
  - { id: d60_m1,         path: "pages[3].layers[6].content.value", type: text, hint: "60-day milestone 1",    default: "Own one project end-to-end." }
  - { id: d60_m2,         path: "pages[3].layers[8].content.value", type: text, hint: "60-day milestone 2",    default: "Lead a meeting or stand-up." }
  - { id: d60_m3,         path: "pages[3].layers[10].content.value", type: text, hint: "60-day milestone 3",   default: "Document one process you owned." }
  - { id: d90_m1,         path: "pages[4].layers[6].content.value", type: text, hint: "90-day milestone 1",    default: "Define your role's success metric." }
  - { id: d90_m2,         path: "pages[4].layers[8].content.value", type: text, hint: "90-day milestone 2",    default: "Run a 360 with manager + peers." }
  - { id: d90_m3,         path: "pages[4].layers[10].content.value", type: text, hint: "90-day milestone 3",   default: "Propose one bigger bet for the year." }
  - { id: y1_m1,          path: "pages[5].layers[6].content.value", type: text, hint: "1-year milestone 1",    default: "You own a function nobody else covers." }
  - { id: cta_heading,    path: "pages[6].layers[4].content.value", type: text, hint: "CTA heading",           default: "Steal this plan." }
  - { id: cta_sub,        path: "pages[6].layers[5].content.value", type: text, hint: "CTA subline",           default: "Drop it in your next hiring-manager kickoff. Save it for the next hire." }
