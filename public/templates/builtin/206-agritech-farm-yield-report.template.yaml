_protocol: template/v1

# Agritech farm yield — eyebrow, hero, 5 KPIs (acres, yield, revenue, cost,
# margin), yield trend by crop, field-level table, weather impact table,
# soil nutrient bar.
meta:
  id: tmpl-agritech-farm-yield-report
  name: Agritech · Farm Yield Analytics
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, agritech, agriculture, farm, yield, interactive]
  description: "Farm yield analytics: acres, yield, revenue, cost, profit margin, crop trend, field-level performance, weather impact, soil health."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: forest-deep

report:
  layout: scroll
  data:
    sources:
      - id: yield_trend
        type: inline
        rows:
          - { week: "W01", corn: 142, soybean:  48, wheat: 62 }
          - { week: "W02", corn: 148, soybean:  50, wheat: 64 }
          - { week: "W03", corn: 152, soybean:  51, wheat: 65 }
          - { week: "W04", corn: 156, soybean:  52, wheat: 66 }
          - { week: "W05", corn: 158, soybean:  54, wheat: 67 }
          - { week: "W06", corn: 162, soybean:  55, wheat: 68 }
          - { week: "W07", corn: 166, soybean:  56, wheat: 68 }
          - { week: "W08", corn: 168, soybean:  57, wheat: 69 }
          - { week: "W09", corn: 172, soybean:  58, wheat: 70 }
          - { week: "W10", corn: 174, soybean:  58, wheat: 70 }
          - { week: "W11", corn: 176, soybean:  59, wheat: 71 }
          - { week: "W12", corn: 178, soybean:  60, wheat: 72 }
      - id: field_performance
        type: inline
        rows:
          - { field: "North 40",      acres:  40, crop: Corn,      yield_bu: 184, moisture_pct: 14.6, notes: "Peak performance · drip irrigation" }
          - { field: "South Ridge",   acres:  62, crop: Soybean,   yield_bu:  62, moisture_pct: 13.2, notes: "On target" }
          - { field: "East Bottoms",  acres:  48, crop: Corn,      yield_bu: 168, moisture_pct: 15.8, notes: "Slight lodging in NE corner" }
          - { field: "West Plain",    acres:  84, crop: Wheat,     yield_bu:  74, moisture_pct: 12.4, notes: "Excellent test weight" }
          - { field: "Hill Section",  acres:  32, crop: Soybean,   yield_bu:  54, moisture_pct: 13.8, notes: "Drought stress mid-season" }
          - { field: "Creek Side",    acres:  28, crop: Corn,      yield_bu: 172, moisture_pct: 14.8, notes: "Above county avg" }
          - { field: "Center Pivot",  acres:  72, crop: Corn,      yield_bu: 192, moisture_pct: 14.2, notes: "Best yield · variable rate N" }
          - { field: "Highway Strip", acres:  18, crop: Wheat,     yield_bu:  68, moisture_pct: 12.8, notes: "Late planting impact" }
          - { field: "Pond Field",    acres:  24, crop: Soybean,   yield_bu:  58, moisture_pct: 13.4, notes: "Iron deficiency chlorosis" }
          - { field: "Far Acres",     acres:  56, crop: Corn,      yield_bu: 156, moisture_pct: 15.4, notes: "Replant in NW · cool soil" }
      - id: weather_impact
        type: inline
        rows:
          - { week: "Week 1", rainfall_in: 1.8, gdd: 168, heat_stress_days: 0, frost_risk: Low,    storm_events: 1 }
          - { week: "Week 2", rainfall_in: 0.4, gdd: 184, heat_stress_days: 2, frost_risk: None,   storm_events: 0 }
          - { week: "Week 3", rainfall_in: 2.6, gdd: 196, heat_stress_days: 0, frost_risk: None,   storm_events: 2 }
          - { week: "Week 4", rainfall_in: 0.8, gdd: 212, heat_stress_days: 4, frost_risk: None,   storm_events: 1 }
      - id: soil_health
        type: inline
        rows:
          - { nutrient: "Nitrogen (N)",     zone_a: 142, zone_b: 128, zone_c: 156 }
          - { nutrient: "Phosphorus (P)",   zone_a:  42, zone_b:  38, zone_c:  46 }
          - { nutrient: "Potassium (K)",    zone_a: 184, zone_b: 162, zone_c: 198 }
          - { nutrient: "Organic Matter %", zone_a:   3.8, zone_b:   3.2, zone_c:   4.2 }
          - { nutrient: "pH",               zone_a:   6.4, zone_b:   6.2, zone_c:   6.8 }
          - { nutrient: "CEC (meq/100g)",   zone_a:  18.2, zone_b:  16.4, zone_c:  21.6 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "PRAIRIE RUN FARMS · IOWA OPS · 2025 SEASON · WEEK 12"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**Farm Yield Analytics — 2025 Season**\n*Acres, yields, revenue, cost, profitability, weather impact, and soil health.*"

      - id: kpi-acres
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Acres Planted
        value: 464
        format: number
        delta: 3.2
        delta_format: percent

      - id: kpi-yield
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Yield (bu/acre)
        value: 172.4
        format: number
        decimals: 1
        delta: 6.8
        delta_format: percent

      - id: kpi-revenue
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Revenue ($)
        value: 1864000
        format: currency
        currency: USD
        delta: 12.4
        delta_format: percent

      - id: kpi-cost
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Cost / Acre ($)
        value: 842
        format: currency
        currency: USD
        delta: -2.4
        delta_format: percent

      - id: kpi-margin
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Profit Margin %
        value: 28.6
        format: percent
        decimals: 1
        delta: 4.2
        delta_format: percent

      - id: section-yield-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Yield Trend by Crop — Past 12 Weeks**"

      - id: chart-yield-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 400
        chart_type: line
        data_ref: yield_trend
        x_field: week
        y_field: corn
        title: Projected Yield (bu/acre) — Corn, Soybean, Wheat
        legend: true
        grid: true
        animate: true

      - id: section-fields
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Field-Level Performance**"

      - id: tbl-fields
        type: interactive_table
        x: 60
        y: 960
        width: 1160
        height: 540
        data_ref: field_performance
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: field,         title: Field,         width: 200, sortable: true, formatter: badge }
          - { field: acres,         title: Acres,         width: 110, sortable: true, formatter: number,  align: right }
          - { field: crop,          title: Crop,          width: 140, sortable: true, formatter: badge }
          - { field: yield_bu,      title: Yield (bu),    width: 140, sortable: true, formatter: number,  align: right }
          - { field: moisture_pct,  title: Moisture %,    width: 140, sortable: true, formatter: percent, align: right }
          - { field: notes,         title: Notes,         width: 430, sortable: false }

      - id: section-weather
        type: rich_text
        x: 60
        y: 1540
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Weather Impact — Past 4 Weeks**"

      - id: tbl-weather
        type: interactive_table
        x: 60
        y: 1600
        width: 1160
        height: 320
        data_ref: weather_impact
        pagination: false
        filterable: false
        exportable: true
        columns:
          - { field: week,             title: Week,            width: 200, sortable: true, formatter: badge }
          - { field: rainfall_in,      title: Rainfall (in),   width: 200, sortable: true, formatter: number,  align: right }
          - { field: gdd,              title: GDD,             width: 180, sortable: true, formatter: number,  align: right }
          - { field: heat_stress_days, title: Heat Days,       width: 180, sortable: true, formatter: number,  align: right }
          - { field: frost_risk,       title: Frost Risk,      width: 200, sortable: true, formatter: badge }
          - { field: storm_events,     title: Storms,          width: 200, sortable: true, formatter: number,  align: right }

      - id: section-soil
        type: rich_text
        x: 60
        y: 1960
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Soil Health by Management Zone**"

      - id: chart-soil
        type: interactive_chart
        x: 60
        y: 2020
        width: 1160
        height: 340
        chart_type: bar
        data_ref: soil_health
        x_field: nutrient
        y_field: zone_a
        title: Soil Nutrient Levels by Zone (A · B · C)
        legend: true
        grid: true
        animate: true

slots:
  - { id: report_title,      path: "pages[0].layers[1].content",  type: text, hint: "Report title",      default: "**Farm Yield Analytics — 2025 Season**\n*Acres, yields, revenue, cost, profitability, weather impact, and soil health.*" }
  - { id: report_eyebrow,    path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",      default: "PRAIRIE RUN FARMS · IOWA OPS · 2025 SEASON · WEEK 12" }
  - { id: yield_section,     path: "pages[0].layers[7].content",  type: text, hint: "Yield heading",     default: "**Yield Trend by Crop — Past 12 Weeks**" }
  - { id: fields_section,    path: "pages[0].layers[9].content",  type: text, hint: "Fields heading",    default: "**Field-Level Performance**" }
  - { id: weather_section,   path: "pages[0].layers[11].content", type: text, hint: "Weather heading",   default: "**Weather Impact — Past 4 Weeks**" }
  - { id: soil_section,      path: "pages[0].layers[13].content", type: text, hint: "Soil heading",      default: "**Soil Health by Management Zone**" }
