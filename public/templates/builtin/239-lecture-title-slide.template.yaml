_protocol: template/v1

# Lecture title slide — 1920×1080 landscape, indigo-pro theme.
# Course code + week eyebrow, lecture title BIG, lecturer + date,
# university logo placeholder bottom right.
meta:
  id: tmpl-lecture-title-slide
  name: Lecture Title Slide
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [slide, lecture, academic, presentation, indigo, landscape]
  description: "Academic lecture / presentation title slide with course code, week eyebrow, big lecture title, lecturer and date, plus university logo placeholder."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  - id: bg-gradient
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # ── Decorative left rail ──────────────────────────────────
  - id: rail
    type: rect
    z: 2
    x: 0
    y: 0
    width: 12
    height: 1080
    fill: { type: solid, color: "$primary" }

  - id: rail-accent
    type: rect
    z: 3
    x: 12
    y: 300
    width: 4
    height: 480
    fill: { type: solid, color: "$accent" }

  # ── Decorative dots cluster (right) ──────────────────────
  - id: dot-1
    type: circle
    z: 4
    cx: 1740
    cy: 180
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.4

  - id: dot-2
    type: circle
    z: 5
    cx: 1780
    cy: 220
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: dot-3
    type: circle
    z: 6
    cx: 1820
    cy: 180
    rx: 6
    ry: 6
    fill: { type: solid, color: "$accent" }

  - id: dot-4
    type: circle
    z: 7
    cx: 1780
    cy: 140
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }
    opacity: 0.3

  # ── Eyebrow: course code + week ──────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 120
    y: 200
    width: 1680
    height: 0
    content: { type: plain, value: "CS 161  ·  WEEK 09  ·  LECTURE 17" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 700
      color: "$accent"
      letter_spacing: 0.5
      text_transform: uppercase

  - id: eyebrow-rule
    type: rect
    z: 11
    x: 120
    y: 245
    width: 120
    height: 4
    fill: { type: solid, color: "$accent" }

  # ── Lecture title (BIG) ──────────────────────────────────
  - id: title
    type: text
    z: 20
    x: 120
    y: 290
    width: 1680
    height: 0
    content: { type: plain, value: "Dynamic Programming" }
    style:
      font_family: $heading
      font_size: 128
      font_weight: 800
      color: "$text"
      line_height: 1.05
      letter_spacing: -0.03

  - id: subtitle
    type: text
    z: 21
    x: 120
    y: 460
    width: 1680
    height: 0
    content: { type: plain, value: "Memoization, optimal substructure, and the art of subproblems" }
    style:
      font_family: $body
      font_size: 36
      font_weight: 400
      color: "$text_muted"
      line_height: 1.3
      letter_spacing: -0.01

  # ── Lecture meta box (bottom-left) ───────────────────────
  - id: meta-rule
    type: rect
    z: 30
    x: 120
    y: 700
    width: 1100
    height: 1
    fill: { type: solid, color: "$border" }

  - id: lecturer-label
    type: text
    z: 31
    x: 120
    y: 740
    width: 540
    height: 0
    content: { type: plain, value: "LECTURER" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$text_muted"
      letter_spacing: 0.5
      text_transform: uppercase

  - id: lecturer-name
    type: text
    z: 32
    x: 120
    y: 770
    width: 540
    height: 0
    content: { type: plain, value: "Prof. Aisha Rahman" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 700
      color: "$text"
      line_height: 1.2

  - id: lecturer-affil
    type: text
    z: 33
    x: 120
    y: 820
    width: 540
    height: 0
    content: { type: plain, value: "Department of Computer Science" }
    style:
      font_family: $body
      font_size: 18
      color: "$text_muted"
      line_height: 1.3

  - id: date-label
    type: text
    z: 34
    x: 700
    y: 740
    width: 520
    height: 0
    content: { type: plain, value: "DATE" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$text_muted"
      letter_spacing: 0.5
      text_transform: uppercase

  - id: date-value
    type: text
    z: 35
    x: 700
    y: 770
    width: 520
    height: 0
    content: { type: plain, value: "May 19, 2026" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 700
      color: "$text"
      line_height: 1.2

  - id: date-time
    type: text
    z: 36
    x: 700
    y: 820
    width: 520
    height: 0
    content: { type: plain, value: "10:30 AM · Gates B12" }
    style:
      font_family: $body
      font_size: 18
      color: "$text_muted"
      line_height: 1.3

  # ── University logo placeholder (bottom-right) ───────────
  - id: logo-bg
    type: rect
    z: 40
    x: 1620
    y: 720
    width: 200
    height: 200
    radius: 24
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$accent", position: 100 }

  - id: logo-mark
    type: text
    z: 41
    x: 1620
    y: 765
    width: 200
    height: 0
    content: { type: plain, value: "U" }
    style:
      font_family: $heading
      font_size: 90
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  - id: logo-name
    type: text
    z: 42
    x: 1620
    y: 940
    width: 200
    height: 0
    content: { type: plain, value: "STANFORD UNIVERSITY" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.4

  # ── Page indicator ────────────────────────────────────────
  - id: page-num
    type: text
    z: 50
    x: 1620
    y: 1010
    width: 200
    height: 0
    content: { type: plain, value: "01 / 32" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: "$text_muted"
      text_align: right
      letter_spacing: 0.3

slots:
  - { id: course_code,    path: "layers[10].content.value", type: text, hint: "Course + week eyebrow",  default: "CS 161  ·  WEEK 09  ·  LECTURE 17" }
  - { id: lecture_title,  path: "layers[12].content.value", type: text, hint: "Lecture title (big)",     default: "Dynamic Programming" }
  - { id: lecturer_name,  path: "layers[16].content.value", type: text, hint: "Lecturer name",           default: "Prof. Aisha Rahman" }
  - { id: lecture_date,   path: "layers[20].content.value", type: text, hint: "Lecture date",            default: "May 19, 2026" }
