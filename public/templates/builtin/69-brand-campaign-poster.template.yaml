_protocol: template/v1

# Big-statement brand campaign — 5:7.5 portrait (1080×1620).
# Massive 2-line headline top, abstract photo mid-page, 3 product callout circles,
# brand mark, tagline, URL, social handles, campaign code.
meta:
  id: tmpl-brand-campaign
  name: Brand Campaign Poster
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, campaign, brand, brutalist, mono, portrait]

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: brutalist-mono

layers:
  # 0 — background
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill: { type: solid, color: "$background" }

  # 1 — top heavy bar (brutalist anchor)
  - id: top-bar
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 16
    fill: { type: solid, color: "$text" }

  # 2 — campaign code (top-left, mono)
  - id: campaign-code
    type: text
    z: 5
    x: 60
    y: 50
    width: 500
    height: 0
    content: { type: plain, value: "CMP — 2026 / VOL.IV / ED.07" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $text
      letter_spacing: 0.32
      text_transform: uppercase

  # 3 — date stamp (top-right, mono)
  - id: date-stamp
    type: text
    z: 5
    x: 580
    y: 50
    width: 440
    height: 0
    content: { type: plain, value: "EFFECTIVE 05 / 16 / 2026" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase
      text_align: right

  # 4 — rule under top meta
  - id: meta-rule
    type: rect
    z: 4
    x: 60
    y: 80
    width: 960
    height: 2
    fill: { type: solid, color: "$text" }

  # 5 — eyebrow tag block
  - id: eyebrow-block
    type: rect
    z: 6
    x: 60
    y: 110
    width: 220
    height: 36
    fill: { type: solid, color: "$text" }

  # 6 — eyebrow text
  - id: eyebrow
    type: text
    z: 7
    x: 60
    y: 118
    width: 220
    height: 0
    content: { type: plain, value: "MANIFESTO 04" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 800
      color: "$background"
      letter_spacing: 0.28
      text_transform: uppercase
      text_align: center

  # 7 — headline line 1 (massive)
  - id: headline-line1
    type: text
    z: 10
    x: 60
    y: 200
    width: 960
    height: 0
    content: { type: plain, value: "MAKE" }
    style:
      font_family: $heading
      font_size: 280
      font_weight: 900
      color: $text
      line_height: 0.85
      letter_spacing: -0.04
      text_transform: uppercase

  # 8 — headline line 2 (massive, contrast color)
  - id: headline-line2
    type: text
    z: 11
    x: 60
    y: 460
    width: 960
    height: 0
    content: { type: plain, value: "NOISE." }
    style:
      font_family: $heading
      font_size: 280
      font_weight: 900
      color: $primary
      line_height: 0.85
      letter_spacing: -0.04
      text_transform: uppercase

  # 9 — abstract photo placeholder rect (large, mid-page)
  - id: abstract-photo
    type: rect
    z: 15
    x: 60
    y: 800
    width: 960
    height: 540
    fill: { type: solid, color: $surface }
    stroke: { color: "$text", width: 3 }

  # 10 — heavy diagonal slash across photo
  - id: photo-slash
    type: line
    z: 16
    x1: 60
    y1: 1340
    x2: 1020
    y2: 800
    stroke: { color: "$text", width: 3 }

  # 11 — photo caption tag (bottom-left of photo)
  - id: photo-cap-bg
    type: rect
    z: 17
    x: 80
    y: 1280
    width: 240
    height: 38
    fill: { type: solid, color: "$text" }

  # 12 — photo caption text
  - id: photo-caption
    type: text
    z: 18
    x: 80
    y: 1290
    width: 240
    height: 0
    content: { type: plain, value: "FIG.01 — STATIC" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: "$background"
      letter_spacing: 0.24
      text_align: center

  # 13 — product callout circle 1 (top-right, primary tint)
  - id: callout-1
    type: circle
    z: 20
    cx: 920
    cy: 200
    rx: 56
    ry: 56
    fill: { type: solid, color: "$primary" }
    stroke: { color: "$text", width: 3 }

  # 14 — callout 1 label
  - id: callout-1-label
    type: text
    z: 21
    x: 850
    y: 188
    width: 140
    height: 0
    content: { type: plain, value: "01" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 900
      color: "$background"
      text_align: center

  # 15 — callout 2 (top-right, secondary tint)
  - id: callout-2
    type: circle
    z: 20
    cx: 920
    cy: 340
    rx: 56
    ry: 56
    fill: { type: solid, color: "$secondary" }
    stroke: { color: "$text", width: 3 }

  # 16 — callout 2 label
  - id: callout-2-label
    type: text
    z: 21
    x: 850
    y: 328
    width: 140
    height: 0
    content: { type: plain, value: "02" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 900
      color: "$background"
      text_align: center

  # 17 — callout 3 (top-right, accent tint)
  - id: callout-3
    type: circle
    z: 20
    cx: 920
    cy: 480
    rx: 56
    ry: 56
    fill: { type: solid, color: "$accent" }
    stroke: { color: "$text", width: 3 }

  # 18 — callout 3 label
  - id: callout-3-label
    type: text
    z: 21
    x: 850
    y: 468
    width: 140
    height: 0
    content: { type: plain, value: "03" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 900
      color: "$background"
      text_align: center

  # 19 — tagline block bg (left of footer)
  - id: tagline-bg
    type: rect
    z: 25
    x: 60
    y: 1380
    width: 600
    height: 8
    fill: { type: solid, color: "$primary" }

  # 20 — tagline text
  - id: tagline
    type: text
    z: 26
    x: 60
    y: 1400
    width: 600
    height: 0
    content: { type: plain, value: "We don't whisper. We declare." }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 800
      color: $text
      line_height: 1.15
      letter_spacing: -0.01

  # 21 — brand mark logo placeholder (corner block)
  - id: brand-logo-bg
    type: rect
    z: 27
    x: 740
    y: 1380
    width: 280
    height: 100
    fill: { type: solid, color: "$text" }

  # 22 — brand name (logo placeholder text)
  - id: brand-name
    type: text
    z: 28
    x: 740
    y: 1408
    width: 280
    height: 0
    content: { type: plain, value: "STUDIO/FOLIO" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 900
      color: "$background"
      letter_spacing: 0.04
      text_transform: uppercase
      text_align: center

  # 23 — brand sub-mark
  - id: brand-sub
    type: text
    z: 29
    x: 740
    y: 1450
    width: 280
    height: 0
    content: { type: plain, value: "EST. 2024" }
    style:
      font_family: $mono
      font_size: 11
      font_weight: 700
      color: "$background"
      letter_spacing: 0.32
      text_align: center
      opacity: 0.8

  # 24 — heavy footer rule
  - id: footer-rule
    type: rect
    z: 30
    x: 60
    y: 1510
    width: 960
    height: 2
    fill: { type: solid, color: "$text" }

  # 25 — URL (footer-left)
  - id: url
    type: text
    z: 31
    x: 60
    y: 1530
    width: 480
    height: 0
    content: { type: plain, value: "studiofolio.co / campaign-04" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text
      letter_spacing: 0.1

  # 26 — social handles strip (footer-right)
  - id: social-handles
    type: text
    z: 32
    x: 560
    y: 1530
    width: 460
    height: 0
    content: { type: plain, value: "@studiofolio  /  IG · TW · BE" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text
      letter_spacing: 0.1
      text_align: right

  # 27 — sub-footer line
  - id: sub-footer
    type: text
    z: 33
    x: 60
    y: 1568
    width: 960
    height: 0
    content: { type: plain, value: "PRINTED IN MONOCHROME · LIMITED RUN OF 500 · ALL RIGHTS RESERVED 2026" }
    style:
      font_family: $mono
      font_size: 10
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase
      text_align: center

  # 28 — corner tick (top-right detail)
  - id: tick-tr
    type: line
    z: 35
    x1: 1040
    y1: 30
    x2: 1060
    y2: 30
    stroke: { color: "$text", width: 2 }

  # 29 — corner tick (top-right vertical)
  - id: tick-tr-v
    type: line
    z: 35
    x1: 1050
    y1: 30
    x2: 1050
    y2: 50
    stroke: { color: "$text", width: 2 }

  # 30 — corner tick (bottom-left)
  - id: tick-bl
    type: line
    z: 35
    x1: 20
    y1: 1590
    x2: 40
    y2: 1590
    stroke: { color: "$text", width: 2 }

  # 31 — corner tick (bottom-left vertical)
  - id: tick-bl-v
    type: line
    z: 35
    x1: 30
    y1: 1570
    x2: 30
    y2: 1590
    stroke: { color: "$text", width: 2 }

  # 32 — small index dot (between callouts and headline)
  - id: index-dot
    type: circle
    z: 12
    cx: 80
    cy: 760
    rx: 5
    ry: 5
    fill: { type: solid, color: "$primary" }

  # 33 — section label vertical (small)
  - id: section-label
    type: text
    z: 13
    x: 100
    y: 750
    width: 400
    height: 0
    content: { type: plain, value: "SECTION B — VISUAL EVIDENCE" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $text
      letter_spacing: 0.36
      text_transform: uppercase

  # 34 — bottom heavy bar (footer anchor)
  - id: bottom-bar
    type: rect
    z: 36
    x: 0
    y: 1604
    width: 1080
    height: 16
    fill: { type: solid, color: "$text" }

slots:
  - { id: headline_line1,  path: "layers[7].content.value",  type: text, hint: "Headline line 1 (massive)",   default: "MAKE" }
  - { id: headline_line2,  path: "layers[8].content.value",  type: text, hint: "Headline line 2 (massive)",   default: "NOISE." }
  - { id: tagline,         path: "layers[20].content.value", type: text, hint: "Tagline below headline",      default: "We don't whisper. We declare." }
  - { id: brand_name,      path: "layers[22].content.value", type: text, hint: "Brand name / logo text",      default: "STUDIO/FOLIO" }
  - { id: url,             path: "layers[25].content.value", type: text, hint: "Campaign URL",                default: "studiofolio.co / campaign-04" }
  - { id: social_handles,  path: "layers[26].content.value", type: text, hint: "Social handles strip",        default: "@studiofolio  /  IG · TW · BE" }
  - { id: campaign_code,   path: "layers[2].content.value",  type: text, hint: "Campaign reference code",     default: "CMP — 2026 / VOL.IV / ED.07" }
