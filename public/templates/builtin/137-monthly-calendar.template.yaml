# 12-page monthly calendar — 1240×1754 A4 portrait, pastel-dream theme.
# One page per month (Jan-Dec), each with a 7-col × 6-row date grid, month
# name display, year footer, and placeholder holiday markers.
meta:
  id: tmpl-monthly-calendar
  name: Monthly Calendar · 12 Months
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, calendar, monthly, year, pastel, a4]
  description: "Twelve-page monthly calendar with one page per month, each featuring a seven-column six-row date grid, month name, year, and holiday markers."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

