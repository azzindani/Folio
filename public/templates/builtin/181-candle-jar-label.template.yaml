_protocol: template/v1

# Soy candle jar wrap — 1000×700 landscape, editorial-cream theme.
# Sophisticated home-fragrance aesthetic: brand top in small caps, scent
# name HUGE centered, three scent notes (top/middle/base) as columns,
# burn time + weight footer, decorative monogram circle corner.
meta:
  id: tmpl-candle-jar-label
  name: Candle Jar Label
  type: label
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [packaging, label, candle, home, fragrance, editorial, landscape]
  description: "Soy candle jar wrap with brand, scent name, top/middle/base notes, burn hours, and weight."

document:
  width: 1000
  height: 700
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1000
    height: 700
    fill: { type: solid, color: "$background" }

  # ── Inner frame ───────────────────────────────────────────
  - id: frame
    type: rect
    z: 1
    x: 40
    y: 40
    width: 920
    height: 620
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  # ── Monogram corner (top-left) ────────────────────────────
  - id: mono-circle
    type: circle
    z: 5
    cx: 100
    cy: 100
    r: 32
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: mono-text
    type: text
    z: 6
    x: 68
    y: 80
    width: 64
    height: 0
    content: { type: plain, value: "MV" }
    style:
      font_family: $heading
      font_size: 20
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.08

  # ── Monogram corner (bottom-right) ────────────────────────
  - id: mono-circle-br
    type: circle
    z: 7
    cx: 900
    cy: 600
    r: 32
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: mono-text-br
    type: text
    z: 8
    x: 868
    y: 580
    width: 64
    height: 0
    content: { type: plain, value: "✦" }
    style:
      font_family: $heading
      font_size: 22
      color: $primary
      text_align: center

  # ── Brand ─────────────────────────────────────────────────
  - id: brand
    type: text
    z: 15
    x: 80
    y: 90
    width: 840
    height: 0
    content: { type: plain, value: "MAISON VERTE" }
    style:
      font_family: $heading
      font_size: 18
      font_weight: 700
      color: $text
      text_align: center
      letter_spacing: 0.6
      text_transform: uppercase

  - id: brand-sub
    type: text
    z: 16
    x: 80
    y: 120
    width: 840
    height: 0
    content: { type: plain, value: "hand-poured soy candles"
    }
    style:
      font_family: $body
      font_size: 11
      font_style: italic
      color: $text_muted
      text_align: center
      letter_spacing: 0.18

  # ── Top divider ───────────────────────────────────────────
  - id: div-top-l
    type: line
    z: 17
    x1: 380
    y1: 168
    x2: 460
    y2: 168
    stroke: { color: "$primary", width: 1 }

  - id: div-top-dot
    type: circle
    z: 18
    cx: 480
    cy: 168
    r: 3
    fill: { type: solid, color: "$primary" }

  - id: div-top-r
    type: line
    z: 19
    x1: 500
    y1: 168
    x2: 580
    y2: 168
    stroke: { color: "$primary", width: 1 }

  # ── Scent name HUGE ───────────────────────────────────────
  - id: scent-name
    type: text
    z: 25
    x: 80
    y: 210
    width: 840
    height: 0
    content: { type: plain, value: "Fig & Cardamom" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 600
      color: $text
      text_align: center
      line_height: 1.05
      letter_spacing: -0.02

  - id: scent-sub
    type: text
    z: 26
    x: 80
    y: 308
    width: 840
    height: 0
    content: { type: plain, value: "no. 17" }
    style:
      font_family: $heading
      font_size: 18
      font_style: italic
      color: $primary
      text_align: center

  # ── Three notes columns ───────────────────────────────────
  - id: note-top-label
    type: text
    z: 30
    x: 80
    y: 380
    width: 280
    height: 0
    content: { type: plain, value: "TOP" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.42

  - id: note-top-text
    type: text
    z: 31
    x: 80
    y: 410
    width: 280
    height: 0
    content: { type: plain, value: "Bergamot · Black Pepper" }
    style:
      font_family: $heading
      font_size: 16
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.4

  - id: note-mid-label
    type: text
    z: 32
    x: 360
    y: 380
    width: 280
    height: 0
    content: { type: plain, value: "MIDDLE" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.42

  - id: note-mid-text
    type: text
    z: 33
    x: 360
    y: 410
    width: 280
    height: 0
    content: { type: plain, value: "Fig · Cardamom · Cedar" }
    style:
      font_family: $heading
      font_size: 16
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.4

  - id: note-base-label
    type: text
    z: 34
    x: 640
    y: 380
    width: 280
    height: 0
    content: { type: plain, value: "BASE" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $primary
      text_align: center
      letter_spacing: 0.42

  - id: note-base-text
    type: text
    z: 35
    x: 640
    y: 410
    width: 280
    height: 0
    content: { type: plain, value: "Amber · Sandalwood" }
    style:
      font_family: $heading
      font_size: 16
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.4

  # ── Column dividers ───────────────────────────────────────
  - id: col-div-1
    type: rect
    z: 36
    x: 358
    y: 378
    width: 1
    height: 80
    fill: { type: solid, color: "$border" }

  - id: col-div-2
    type: rect
    z: 37
    x: 638
    y: 378
    width: 1
    height: 80
    fill: { type: solid, color: "$border" }

  # ── Footer rule ───────────────────────────────────────────
  - id: footer-rule
    type: rect
    z: 50
    x: 80
    y: 520
    width: 840
    height: 1
    fill: { type: solid, color: "$primary" }

  # ── Burn hours + weight ───────────────────────────────────
  - id: burn-label
    type: text
    z: 51
    x: 80
    y: 540
    width: 380
    height: 0
    content: { type: plain, value: "BURN TIME" }
    style: { font_family: $body, font_size: 10, font_weight: 700, color: $text_muted, letter_spacing: 0.42, text_align: left }

  - id: burn-value
    type: text
    z: 52
    x: 80
    y: 562
    width: 380
    height: 0
    content: { type: plain, value: "50–60 hours" }
    style: { font_family: $heading, font_size: 20, font_weight: 600, color: $text, text_align: left }

  - id: weight-label
    type: text
    z: 53
    x: 540
    y: 540
    width: 380
    height: 0
    content: { type: plain, value: "NET WEIGHT" }
    style: { font_family: $body, font_size: 10, font_weight: 700, color: $text_muted, letter_spacing: 0.42, text_align: right }

  - id: weight-value
    type: text
    z: 54
    x: 540
    y: 562
    width: 380
    height: 0
    content: { type: plain, value: "8 oz / 227 g" }
    style: { font_family: $heading, font_size: 20, font_weight: 600, color: $text, text_align: right }

  - id: footer-text
    type: text
    z: 55
    x: 80
    y: 620
    width: 840
    height: 0
    content: { type: plain, value: "100% SOY WAX  ·  COTTON WICK  ·  HAND-POURED IN BROOKLYN, NY" }
    style:
      font_family: $body
      font_size: 10
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.42

slots:
  - { id: brand,       path: "layers[6].content.value",  type: text, hint: "Brand name",            default: "MAISON VERTE" }
  - { id: scent_name,  path: "layers[11].content.value", type: text, hint: "Scent name",            default: "Fig & Cardamom" }
  - { id: top_note,    path: "layers[14].content.value", type: text, hint: "Top note",              default: "Bergamot · Black Pepper" }
  - { id: middle_note, path: "layers[16].content.value", type: text, hint: "Middle note",           default: "Fig · Cardamom · Cedar" }
  - { id: base_note,   path: "layers[18].content.value", type: text, hint: "Base note",             default: "Amber · Sandalwood" }
  - { id: burn_hours,  path: "layers[23].content.value", type: text, hint: "Burn hours",            default: "50–60 hours" }
  - { id: weight_oz,   path: "layers[25].content.value", type: text, hint: "Net weight",            default: "8 oz / 227 g" }
