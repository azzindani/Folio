_protocol: template/v1

# Pet adoption flyer — 1080×1620 portrait, sunset-glow theme.
# Pet photo placeholder large, pet name + species + breed, ADOPT ME
# badge, 4 personality traits, age + gender + vaccinated badges,
# adoption fee + shelter contact.
meta:
  id: tmpl-pet-adoption-flyer
  name: Pet Adoption Flyer
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [pet, adoption, dog, shelter, flyer, sunset, portrait]
  description: "Pet adoption flyer with large photo placeholder, pet name + breed, ADOPT ME badge, personality traits, age/gender/vaccinated badges, fee + shelter contact."

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # ── Top decorative shape ──────────────────────────────────
  - id: top-blob
    type: circle
    z: 1
    x: -120
    y: -120
    width: 380
    height: 380
    fill: { type: solid, color: "$primary", opacity: 0.20 }

  - id: top-blob-2
    type: circle
    z: 2
    x: 900
    y: -60
    width: 260
    height: 260
    fill: { type: solid, color: "$secondary", opacity: 0.20 }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 70
    width: 960
    height: 0
    content: { type: plain, value: "♥  RESCUE & ADOPT  ♥" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 800
      color: $primary
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  # ── Photo placeholder ─────────────────────────────────────
  - id: photo-frame
    type: rect
    z: 20
    x: 90
    y: 120
    width: 900
    height: 700
    radius: 32
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 6 }

  - id: photo-cross-1
    type: line
    z: 21
    x1: 90
    y1: 120
    x2: 990
    y2: 820
    stroke: { color: "$border", width: 1, dash: [10, 10] }

  - id: photo-cross-2
    type: line
    z: 22
    x1: 990
    y1: 120
    x2: 90
    y2: 820
    stroke: { color: "$border", width: 1, dash: [10, 10] }

  - id: photo-label
    type: text
    z: 23
    x: 90
    y: 450
    width: 900
    height: 0
    content: { type: plain, value: "Pet photo here" }
    style:
      font_family: $body
      font_size: 24
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.2
      text_transform: uppercase
      opacity: 0.3

  # ── ADOPT ME badge (overlapping top-right of photo) ───────
  - id: adopt-badge-bg
    type: circle
    z: 30
    x: 820
    y: 90
    width: 200
    height: 200
    fill: { type: solid, color: "$primary" }

  - id: adopt-badge-text-1
    type: text
    z: 31
    x: 820
    y: 150
    width: 200
    height: 0
    content: { type: plain, value: "ADOPT" }
    style: { font_family: $heading, font_size: 32, font_weight: 900, color: "#FFFFFF", text_align: center, line_height: 1, letter_spacing: 0.04 }

  - id: adopt-badge-text-2
    type: text
    z: 32
    x: 820
    y: 195
    width: 200
    height: 0
    content: { type: plain, value: "ME!" }
    style: { font_family: $heading, font_size: 38, font_weight: 900, color: "#FFFFFF", text_align: center, line_height: 1, letter_spacing: 0.04 }

  # ── Pet name + breed ──────────────────────────────────────
  - id: pet-name
    type: text
    z: 40
    x: 60
    y: 860
    width: 960
    height: 0
    content: { type: plain, value: "BISCUIT" }
    style:
      font_family: $heading
      font_size: 90
      font_weight: 900
      color: $text
      text_align: center
      line_height: 1
      letter_spacing: 0.02

  - id: pet-breed
    type: text
    z: 41
    x: 60
    y: 960
    width: 960
    height: 0
    content: { type: plain, value: "Dog · Golden Retriever Mix" }
    style: { font_family: $body, font_size: 22, font_weight: 600, color: $text, text_align: center, line_height: 1.3 }

  # ── Info badges row: age / gender / vaccinated ────────────
  - id: bd-age
    type: rect
    z: 50
    x: 120
    y: 1020
    width: 260
    height: 64
    radius: 32
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: bd-age-text
    type: text
    z: 51
    x: 120
    y: 1039
    width: 260
    height: 0
    content: { type: plain, value: "AGE  ·  3 YRS" }
    style: { font_family: $body, font_size: 16, font_weight: 800, color: $text, text_align: center, letter_spacing: 0.3 }

  - id: bd-gender
    type: rect
    z: 52
    x: 410
    y: 1020
    width: 260
    height: 64
    radius: 32
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$secondary", width: 2 }

  - id: bd-gender-text
    type: text
    z: 53
    x: 410
    y: 1039
    width: 260
    height: 0
    content: { type: plain, value: "GENDER  ·  MALE" }
    style: { font_family: $body, font_size: 16, font_weight: 800, color: $text, text_align: center, letter_spacing: 0.3 }

  - id: bd-vax
    type: rect
    z: 54
    x: 700
    y: 1020
    width: 260
    height: 64
    radius: 32
    fill: { type: solid, color: "$primary" }

  - id: bd-vax-text
    type: text
    z: 55
    x: 700
    y: 1039
    width: 260
    height: 0
    content: { type: plain, value: "✓ VACCINATED" }
    style: { font_family: $body, font_size: 16, font_weight: 800, color: "#FFFFFF", text_align: center, letter_spacing: 0.3 }

  # ── Personality traits (4 tags) ───────────────────────────
  - id: traits-label
    type: text
    z: 60
    x: 60
    y: 1120
    width: 960
    height: 0
    content: { type: plain, value: "PERSONALITY" }
    style: { font_family: $body, font_size: 13, font_weight: 800, color: $primary, text_align: center, letter_spacing: 0.5, text_transform: uppercase }

  - id: traits-line
    type: text
    z: 61
    x: 60
    y: 1155
    width: 960
    height: 0
    content: { type: plain, value: "Playful  ·  Gentle  ·  Good with kids  ·  House-trained" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text
      text_align: center
      line_height: 1.4

  # ── Adoption fee + contact ────────────────────────────────
  - id: cta-card
    type: rect
    z: 70
    x: 60
    y: 1230
    width: 960
    height: 240
    radius: 24
    fill: { type: solid, color: "$primary" }

  - id: cta-fee-label
    type: text
    z: 71
    x: 60
    y: 1255
    width: 960
    height: 0
    content: { type: plain, value: "ADOPTION FEE" }
    style: { font_family: $body, font_size: 14, font_weight: 800, color: "#FFFFFF", opacity: 0.85, text_align: center, letter_spacing: 0.5 }

  - id: cta-fee
    type: text
    z: 72
    x: 60
    y: 1285
    width: 960
    height: 0
    content: { type: plain, value: "$250" }
    style: { font_family: $heading, font_size: 72, font_weight: 900, color: "#FFFFFF", text_align: center, line_height: 1 }

  - id: cta-fee-incl
    type: text
    z: 73
    x: 60
    y: 1375
    width: 960
    height: 0
    content: { type: plain, value: "Includes spay/neuter · microchip · vaccines · vet exam" }
    style: { font_family: $body, font_size: 15, font_style: italic, color: "#FFFFFF", opacity: 0.9, text_align: center, line_height: 1.3 }

  - id: cta-contact
    type: text
    z: 74
    x: 60
    y: 1420
    width: 960
    height: 0
    content: { type: plain, value: "Happy Tails Shelter  ·  (415) 555-0142  ·  happytails.org/adopt" }
    style: { font_family: $body, font_size: 17, font_weight: 700, color: "#FFFFFF", text_align: center, line_height: 1.3 }

  # ── Bottom footer ─────────────────────────────────────────
  - id: foot-text
    type: text
    z: 80
    x: 60
    y: 1520
    width: 960
    height: 0
    content: { type: plain, value: "Open Tues–Sun · 10am–6pm · 2418 Mission St, San Francisco" }
    style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, line_height: 1.4 }

  - id: foot-paw
    type: text
    z: 81
    x: 60
    y: 1560
    width: 960
    height: 0
    content: { type: plain, value: "🐾 every dog deserves a forever home 🐾" }
    style: { font_family: $body, font_size: 16, font_style: italic, color: $primary, text_align: center, line_height: 1.4 }

slots:
  - { id: pet_name,           path: "layers[11].content.value", type: text, hint: "Pet name (huge)",      default: "BISCUIT" }
  - { id: breed,              path: "layers[12].content.value", type: text, hint: "Species + breed",      default: "Dog · Golden Retriever Mix" }
  - { id: age,                path: "layers[14].content.value", type: text, hint: "Age badge",            default: "AGE  ·  3 YRS" }
  - { id: gender,             path: "layers[16].content.value", type: text, hint: "Gender badge",         default: "GENDER  ·  MALE" }
  - { id: personality_traits, path: "layers[20].content.value", type: text, hint: "Personality traits",   default: "Playful  ·  Gentle  ·  Good with kids  ·  House-trained" }
  - { id: shelter_contact,    path: "layers[25].content.value", type: text, hint: "Shelter contact line", default: "Happy Tails Shelter  ·  (415) 555-0142  ·  happytails.org/adopt" }
