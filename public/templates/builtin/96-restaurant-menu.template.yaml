_protocol: template/v1

# Two-column restaurant menu — A4 portrait 1240×1754, editorial-cream theme.
# Distinct from 35-restaurant-menu: 4 categories × 3 items in a 2×2 grid,
# elegant serif typography, dotted leader lines between dish + price.
meta:
  id: tmpl-restaurant-menu-two-column
  name: Restaurant Menu · Two-Column
  type: menu
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [menu, restaurant, fine-dining, two-column, a4]
  description: "Elegant two-column restaurant menu with four categories (Starters, Mains, Desserts, Drinks), realistic dishes, descriptions, and prices."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # ── Header rule top ──────────────────────────────────────
  - id: top-rule
    type: rect
    z: 1
    x: 100
    y: 100
    width: 1040
    height: 2
    fill: { type: solid, color: "$primary" }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 5
    x: 100
    y: 130
    width: 1040
    height: 0
    content: { type: plain, value: "★ ESTABLISHED 2012 · SEASONAL EUROPEAN ★" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  # ── Restaurant name (hero) ───────────────────────────────
  - id: restaurant-name
    type: text
    z: 6
    x: 100
    y: 170
    width: 1040
    height: 0
    content: { type: plain, value: "Maison Verdier" }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 700
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.05
      letter_spacing: -0.01

  - id: tagline
