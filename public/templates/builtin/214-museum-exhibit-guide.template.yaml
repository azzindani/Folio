  # ── Page 2 · Curator's Note ────────────────────────────────
  - id: curator-note
    label: Curator's Note
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: pagehead, type: text, z: 1, x: 80, y: 100, width: 1080, height: 0, content: { type: plain, value: "CURATOR'S NOTE  ·  PAGE 02" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: pagehead-rule, type: rect, z: 2, x: 80, y: 130, width: 1080, height: 2, fill: { type: solid, color: "$text" } }
      - { id: kicker, type: text, z: 10, x: 80, y: 180, width: 1080, height: 0, content: { type: plain, value: "WORDS FROM THE GALLERY" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 80, y: 220, width: 1080, height: 0, content: { type: plain, value: "What the rooms are holding." }, style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 80, y: 360, width: 80, height: 4, fill: { type: solid, color: "$text" } }
      - { id: body-1, type: text, z: 20, x: 80, y: 400, width: 720, height: 0, content: { type: plain, value: "Quiet Geometries gathers eight years of Yara Ionescu's painting practice into two adjacent galleries, and asks them to share a single argument. The argument, simply put, is that geometry is not the cold thing modernism made of it — that a square, given the right room, can be tender; that a circle can grieve.\n\nThe twenty-six paintings here are arranged not by date but by the time of day each one feels like. Gallery 3 opens with morning works (cool whites, soft blues, the long horizontal of 'Slow Window I'), passes through afternoon (the dense ochre rooms of the central wall), and gives way, by the back room, to a deep, attentive evening. Gallery 4, smaller and quieter, is given over to the works on paper and to the two installations — including the long-awaited reinstallation of 'Distance Held in Both Hands' (2019).\n\nIonescu is a painter who has always preferred to be slow in public. She has refused dozens of commissions, declined every biennial since 2018, and works in a converted bakery north of the city with no studio assistants. This is the first solo museum exhibition of her work in eleven years. We are honored to host it." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.65, text_align: justify } }
      - { id: body-2, type: text, z: 21, x: 80, y: 1140, width: 720, height: 0, content: { type: plain, value: "Walk slowly. Sit when there are benches. The artist asked us, in conversation, to please not whisper — \"normal voices, please. A room with paintings is not a library.\" We have taken her advice to heart, and pass it on." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: sig, type: text, z: 30, x: 80, y: 1320, width: 720, height: 0, content: { type: plain, value: "— Reina Ferrazzano" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: $text } }
      - { id: sig-role, type: text, z: 31, x: 80, y: 1360, width: 720, height: 0, content: { type: plain, value: "CHIEF CURATOR  ·  EAST RIVER MUSEUM" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.5 } }
      - { id: side-rule, type: rect, z: 40, x: 840, y: 400, width: 2, height: 1150, fill: { type: solid, color: "$text" } }
      - { id: side-kicker, type: text, z: 41, x: 870, y: 400, width: 290, height: 0, content: { type: plain, value: "AT A GLANCE" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: side-fact-1-label, type: text, z: 42, x: 870, y: 460, width: 290, height: 0, content: { type: plain, value: "WORKS" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.5 } }
      - { id: side-fact-1-val, type: text, z: 43, x: 870, y: 490, width: 290, height: 0, content: { type: plain, value: "40" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $text, line_height: 1 } }
      - { id: side-fact-1-note, type: text, z: 44, x: 870, y: 560, width: 290, height: 0, content: { type: plain, value: "26 paintings, 12 works on paper, 2 installations" }, style: { font_family: $body, font_size: 13, color: $text_muted, line_height: 1.5 } }
      - { id: side-fact-2-label, type: text, z: 42, x: 870, y: 640, width: 290, height: 0, content: { type: plain, value: "SPAN" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.5 } }
      - { id: side-fact-2-val, type: text, z: 43, x: 870, y: 670, width: 290, height: 0, content: { type: plain, value: "2018 → 2026" }, style: { font_family: $heading, font_size: 30, font_weight: 800, color: $text, line_height: 1.1 } }
      - { id: side-fact-2-note, type: text, z: 44, x: 870, y: 730, width: 290, height: 0, content: { type: plain, value: "eight years of practice in two rooms" }, style: { font_family: $body, font_size: 13, color: $text_muted, line_height: 1.5 } }
      - { id: side-fact-3-label, type: text, z: 42, x: 870, y: 820, width: 290, height: 0, content: { type: plain, value: "DURATION" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.5 } }
      - { id: side-fact-3-val, type: text, z: 43, x: 870, y: 850, width: 290, height: 0, content: { type: plain, value: "16 WEEKS" }, style: { font_family: $heading, font_size: 40, font_weight: 800, color: $text, line_height: 1 } }
      - { id: side-fact-3-note, type: text, z: 44, x: 870, y: 910, width: 290, height: 0, content: { type: plain, value: "17 May → 9 September 2026" }, style: { font_family: $body, font_size: 13, color: $text_muted, line_height: 1.5 } }
      - { id: side-rule-bot, type: rect, z: 45, x: 870, y: 1000, width: 290, height: 1, fill: { type: solid, color: "$border" } }
      - { id: side-pull-kicker, type: text, z: 46, x: 870, y: 1020, width: 290, height: 0, content: { type: plain, value: "DO NOT MISS" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: side-pull, type: text, z: 47, x: 870, y: 1060, width: 290, height: 0, content: { type: plain, value: "The reinstallation of 'Distance Held in Both Hands' (2019) in the back room of Gallery 4. Allow ten minutes." }, style: { font_family: $heading, font_size: 17, font_style: italic, color: $text, line_height: 1.5 } }
