      - { id: foot, type: text, z: 61, x: 80, y: 1710, width: 1080, height: 0, content: { type: plain, value: "EAST RIVER MUSEUM  ·  QUIET GEOMETRIES  ·  02" }, style: { font_family: $mono, font_size: 11, color: $text_muted, text_align: center, letter_spacing: 0.5 } }

