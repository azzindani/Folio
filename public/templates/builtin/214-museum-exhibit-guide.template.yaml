      - { id: hero-block, type: rect, z: 20, x: 80, y: 280, width: 1080, height: 920, fill: { type: solid, color: "$text" } }
      - { id: hero-block-inner, type: rect, z: 21, x: 120, y: 320, width: 1000, height: 840, fill: { type: solid, color: "transparent" }, stroke: { color: "$background", width: 2 } }
      - { id: kicker, type: text, z: 22, x: 120, y: 380, width: 1000, height: 0, content: { type: plain, value: "A SOLO EXHIBITION" }, style: { font_family: $mono, font_size: 16, font_weight: 800, color: "$background", text_align: center, letter_spacing: 0.7 } }
      - { id: rule-mid, type: rect, z: 23, x: 580, y: 430, width: 80, height: 3, fill: { type: solid, color: "$background" } }
      - { id: artist, type: text, z: 24, x: 120, y: 480, width: 1000, height: 0, content: { type: plain, value: "Yara\nIonescu" }, style: { font_family: $heading, font_size: 156, font_weight: 800, color: "$background", text_align: center, line_height: 0.95, letter_spacing: -0.04 } }
      - { id: title, type: text, z: 25, x: 120, y: 820, width: 1000, height: 0, content: { type: plain, value: "—  Quiet Geometries  —" }, style: { font_family: $heading, font_size: 38, font_style: italic, color: "$background", text_align: center, opacity: 0.95 } }
      - { id: dates, type: text, z: 26, x: 120, y: 900, width: 1000, height: 0, content: { type: plain, value: "17 MAY  →  09 SEPTEMBER 2026" }, style: { font_family: $mono, font_size: 22, font_weight: 800, color: "$background", text_align: center, letter_spacing: 0.6 } }
      - { id: years, type: text, z: 27, x: 120, y: 960, width: 1000, height: 0, content: { type: plain, value: "twenty-six paintings · twelve works on paper · two installations" }, style: { font_family: $body, font_size: 18, font_style: italic, color: "$background", opacity: 0.85, text_align: center } }
      - { id: hero-cite, type: text, z: 28, x: 120, y: 1080, width: 1000, height: 0, content: { type: plain, value: "\"I do not paint the silence. I paint the space the silence sits in.\"" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$background", text_align: center, opacity: 0.9, line_height: 1.4 } }
      - { id: hero-cite-attr, type: text, z: 29, x: 120, y: 1140, width: 1000, height: 0, content: { type: plain, value: "— YARA IONESCU, IN CONVERSATION, 2024" }, style: { font_family: $mono, font_size: 12, color: "$background", text_align: center, opacity: 0.75, letter_spacing: 0.5 } }
