      - { id: ticket-prices, type: text, z: 43, x: 620, y: 1450, width: 500, height: 0, content: { type: plain, value: "ADULT          $18\nSTUDENT / SR.  $12\nUNDER 12       FREE" }, style: { font_family: $mono, font_size: 16, color: $text, line_height: 1.6, letter_spacing: 0.3 } }
