_protocol: template/v1

# 6-page museum exhibit guide — 1240×1754 A4 portrait, mono-print theme.
# Cover → curator's note → gallery map → featured works → programs → museum info.
meta:
  id: tmpl-museum-exhibit-guide
  name: Museum Exhibit Guide (6 pages)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, museum, exhibit, guide, mono, a4, brochure]
  description: "Six-page museum exhibit guide: cover with exhibit title and dates, curator's note, gallery map with floorplan grid, featured works spread with four artwork cards, program schedule, and museum info with sponsor wall."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: mono-print

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
