      - { id: foot-url, type: text, z: 32, x: 700, y: 1310, width: 460, height: 0, content: { type: plain, value: "EASTRIVER.MUSEUM" }, style: { font_family: $mono, font_size: 12, color: $text, text_align: right, letter_spacing: 0.5 } }
      - { id: ticket-box, type: rect, z: 40, x: 80, y: 1380, width: 1080, height: 240, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 3 } }
