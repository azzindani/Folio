_protocol: template/v1

# Daily schedule signage — 1080×1920 portrait, light-clean theme.
# Top header with date + day-of-week, then a 12-row hourly grid
# (07:00 → 19:00) showing realistic office events for digital signage.
meta:
  id: tmpl-daily-schedule-display
  name: Daily Schedule Display
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [schedule, signage, calendar, office, portrait, daily]
  description: "Daily schedule display for digital signage with date header and hourly event grid from 7am to 7pm."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  # ── Header band ───────────────────────────────────────────
  - id: header-bg
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 280
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 60
    width: 960
    height: 0
    content: { type: plain, value: "TODAY'S SCHEDULE" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: "#FFFFFFCC"
      letter_spacing: 0.4
      text_transform: uppercase

  - id: dow
    type: text
    z: 11
    x: 60
    y: 100
    width: 960
    height: 0
    content: { type: plain, value: "Saturday" }
    style:
      font_family: $heading
      font_size: 88
      font_weight: 800
      color: "#FFFFFF"
      line_height: 1
      letter_spacing: -0.02

  - id: date
    type: text
    z: 12
    x: 60
    y: 200
    width: 960
    height: 0
    content: { type: plain, value: "May 16, 2026" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 400
      color: "#FFFFFFE0"
      line_height: 1.2

  # ── Column header ─────────────────────────────────────────
  - id: col-time
    type: text
    z: 20
    x: 60
    y: 320
    width: 200
    height: 0
    content: { type: plain, value: "TIME" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.4

  - id: col-event
    type: text
    z: 21
    x: 280
    y: 320
    width: 740
    height: 0
    content: { type: plain, value: "EVENT" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.4

  - id: header-rule
    type: rect
    z: 22
    x: 60
    y: 360
    width: 960
    height: 2
    fill: { type: solid, color: "$text" }

  # ── Row 1: 07:00 ──────────────────────────────────────────
  - id: r1-time
    type: text
    z: 30
    x: 60
    y: 390
    width: 200
    height: 0
    content: { type: plain, value: "07:00" }
    style: { font_family: $mono, font_size: 32, font_weight: 700, color: $text, line_height: 1.3 }

  - id: r1-event
    type: text
    z: 31
    x: 280
    y: 395
    width: 740
    height: 0
    content: { type: plain, value: "Building open  ·  Coffee in atrium" }
    style: { font_family: $body, font_size: 26, color: $text, line_height: 1.3 }

  - id: r1-rule
