_protocol: template/v1

# 7-page workout + meal plan — 1080×1920 portrait, forest-deep theme.
# Cover (week + goal) → Mon-Fri (workout + meals) → weekend rest + grocery list.
meta:
  id: tmpl-workout-meal-plan
  name: Workout & Meal Plan · Week (7 pages)
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, fitness, workout, meal-plan, forest, portrait]
  description: "Seven-page weekly workout and meal plan with cover, five daily training and meal cards Mon-Fri, and weekend rest with grocery list."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: forest-deep

pages:
  # ── Page 1 · Cover ──────────────────────────────────────────
  - id: cover
    label: Cover · Week 01
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1920, fill: { type: linear, angle: 180, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: hero-block, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1100, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: glow, type: circle, z: 2, cx: 920, cy: 280, rx: 280, ry: 280, fill: { type: radial, stops: [{ color: "#FFFFFF", position: 0 }, { color: "transparent", position: 100 }] }, opacity: 0.25 }
      - { id: brand-mark, type: text, z: 10, x: 80, y: 120, width: 920, height: 0, content: { type: plain, value: "◆ FORGE STRENGTH" }, style: { font_family: $heading, font_size: 20, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.4, text_transform: uppercase } }
      - { id: week-pill, type: rect, z: 11, x: 80, y: 200, width: 200, height: 40, radius: 20, fill: { type: solid, color: "rgba(255,255,255,0.2)" } }
      - { id: week-text, type: text, z: 12, x: 80, y: 212, width: 200, height: 0, content: { type: plain, value: "WEEK 01 OF 12" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.5, text_align: center } }
