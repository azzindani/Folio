slots:
  - { id: week_number,   path: "pages[0].layers[5].content.value",  type: text, hint: "Week label",    default: "WEEK 01 OF 12" }
  - { id: goal_title,    path: "pages[0].layers[8].content.value",  type: text, hint: "Goal headline", default: "Build the\nfoundation." }
  - { id: goal_deck,     path: "pages[0].layers[9].content.value",  type: text, hint: "Goal deck",     default: "Five-day push/pull/legs split with high-protein meals. Two rest days for full recovery." }
  - { id: athlete_name,  path: "pages[0].layers[21].content.value", type: text, hint: "Athlete info",  default: "Alex Park · 165 lbs · intermediate lifter\nProgram designed by FORGE Coaching · forge.fit" }
  - { id: protein_target, path: "pages[0].layers[15].content.value", type: text, hint: "Protein target", default: "180g" }
  - { id: calorie_target, path: "pages[0].layers[18].content.value", type: text, hint: "Calorie target", default: "2,800" }
