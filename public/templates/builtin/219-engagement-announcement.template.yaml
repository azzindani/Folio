_protocol: template/v1

# Engagement announcement — 1080×1500 portrait, editorial-cream theme.
# Romantic ornament, "we're engaged!" script, couple names, date, save-the-date hint.
meta:
  id: tmpl-engagement-announcement
  name: Engagement Announcement
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, announcement, engagement, romantic, elegant, portrait]
  description: "Elegant engagement announcement with we're-engaged script, couple names, and a save-the-date hint."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1, 2 — outer + inner thin frame
  - { id: outer-frame, type: rect, z: 1, x: 60, y: 60, width: 960, height: 1380, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  - { id: inner-frame, type: rect, z: 2, x: 78, y: 78, width: 924, height: 1344, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
  # 3 — ornament
  - { id: orn-top, type: text, z: 5, x: 80, y: 240, width: 920, height: 0, content: { type: plain, value: "❀  ·  ❦  ·  ❀" }, style: { font_family: $heading, font_size: 32, color: "$primary", text_align: center, letter_spacing: 0.4 } }
  # 4 — eyebrow
  - { id: eyebrow, type: text, z: 10, x: 80, y: 360, width: 920, height: 0, content: { type: plain, value: "WE'RE ENGAGED" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.7, text_transform: uppercase } }
  # 5 — script line (alt)
  - { id: script, type: text, z: 11, x: 80, y: 430, width: 920, height: 0, content: { type: plain, value: "she said yes" }, style: { font_family: $heading, font_size: 56, font_style: italic, color: "$primary", text_align: center, line_height: 1.1 } }
  # 6 — couple names
  - { id: couple, type: text, z: 12, x: 80, y: 560, width: 920, height: 0, content: { type: plain, value: "Isabella Romero\n&\nNathaniel Cross" }, style: { font_family: $heading, font_size: 72, font_weight: 400, color: "$text", text_align: center, line_height: 1.15, letter_spacing: -0.01 } }
  # 7 — divider
  - { id: divider, type: rect, z: 13, x: 490, y: 950, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 8 — engaged-on label
  - { id: eng-lbl, type: text, z: 14, x: 80, y: 990, width: 920, height: 0, content: { type: plain, value: "ENGAGED" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.6 } }
  # 9 — engaged-on date
  - { id: eng-date, type: text, z: 15, x: 80, y: 1030, width: 920, height: 0, content: { type: plain, value: "the third of June, twenty twenty-six" }, style: { font_family: $heading, font_size: 30, font_style: italic, color: "$text", text_align: center, line_height: 1.4 } }
  # 10 — divider 2
  - { id: divider-2, type: rect, z: 16, x: 490, y: 1110, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 11 — std hint label
  - { id: std-lbl, type: text, z: 17, x: 80, y: 1160, width: 920, height: 0, content: { type: plain, value: "SAVE THE DATE FOR THE WEDDING" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.5 } }
  # 12 — wedding date hint
  - { id: wed-hint, type: text, z: 18, x: 80, y: 1200, width: 920, height: 0, content: { type: plain, value: "Spring 2027 · formal invitation to follow" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", text_align: center } }
  # 13 — orn bot
  - { id: orn-bot, type: text, z: 19, x: 80, y: 1340, width: 920, height: 0, content: { type: plain, value: "❀" }, style: { font_family: $heading, font_size: 28, color: "$primary", text_align: center } }

slots:
  - { id: couple_names,      path: "layers[6].content.value",  type: text, hint: "Couple names",            default: "Isabella Romero\n&\nNathaniel Cross" }
  - { id: engaged_on,        path: "layers[9].content.value",  type: text, hint: "Date of engagement",      default: "the third of June, twenty twenty-six" }
  - { id: wedding_date_hint, path: "layers[12].content.value", type: text, hint: "Wedding save-the-date",   default: "Spring 2027 · formal invitation to follow" }
