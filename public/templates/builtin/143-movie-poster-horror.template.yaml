_protocol: template/v1

# Horror movie poster (1280×1920 portrait).
# High-contrast black/red: blood-drip serif title, eerie italic tagline,
# FROM THE DIRECTOR OF eyebrow, deep red release date.
meta:
  id: tmpl-movie-poster-horror
  name: Movie Poster — Horror
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, movie, film, horror, dark, blood]
  description: "Blood-red horror movie poster with serif title, drip accents and eerie tagline."

document:
  width: 1280
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: high-contrast
  overrides:
    background: "#050505"
    surface: "#0C0606"
    primary: "#A30D14"
    secondary: "#D9D5CE"
    text: "#EAE6DE"
    text_muted: "#7A6F6A"
    border: "#1F1010"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1280
    height: 1920
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "#000000", position: 0 }
        - { color: "$background", position: 50 }
        - { color: "#100404", position: 100 }

  - id: vignette
    type: circle
    z: 1
    cx: 640
    cy: 960
    rx: 1100
    ry: 1280
    fill:
      type: radial
      stops:
        - { color: "transparent", position: 30 }
        - { color: "#000000", position: 100 }
    opacity: 0.95

  - id: smear
    type: rect
    z: 2
    x: 80
    y: 200
    width: 1120
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: director-eyebrow
    type: text
    z: 10
    x: 120
    y: 220
    width: 1040
    height: 0
    content: { type: plain, value: "FROM THE DIRECTOR OF" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: director-credit
    type: text
    z: 11
    x: 120
    y: 270
    width: 1040
    height: 0
    content: { type: plain, value: "“THE QUIET ROOM” & “HEMLOCK”" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 400
      font_style: italic
      color: $text
      letter_spacing: 0.04
      text_align: center

  - id: tagline-rule-top
    type: rect
    z: 20
    x: 380
    y: 380
    width: 520
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.8

  - id: tagline
    type: text
    z: 21
    x: 120
    y: 420
    width: 1040
    height: 0
    content:
      type: plain
      value: "Don't sleep.\nDon't look back.\nDon't open the door."
    style:
      font_family: $heading
      font_size: 32
      font_weight: 400
      font_style: italic
      color: $secondary
      line_height: 1.45
      letter_spacing: 0.02
      text_align: center

  - id: tagline-rule-bottom
    type: rect
    z: 22
    x: 380
    y: 620
    width: 520
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.8

  - id: title-line-1
    type: text
    z: 30
    x: 80
    y: 980
    width: 1120
    height: 0
    content: { type: plain, value: "THE" }
    style:
      font_family: $heading
      font_size: 140
      font_weight: 800
      color: $text
      line_height: 0.92
      letter_spacing: 0.04
      text_align: center
      text_transform: uppercase

  - id: title-line-2
    type: text
    z: 31
    x: 80
    y: 1110
    width: 1120
    height: 0
    content: { type: plain, value: "HOLLOWING" }
    style:
      font_family: $heading
      font_size: 240
      font_weight: 900
      color: $primary
      line_height: 0.92
      letter_spacing: -0.02
      text_align: center
      text_transform: uppercase

  - id: blood-drip-1
    type: rect
    z: 32
    x: 320
    y: 1300
    width: 8
    height: 80
    fill: { type: solid, color: "$primary" }

  - id: blood-drip-2
    type: rect
    z: 33
    x: 640
    y: 1300
    width: 10
    height: 130
    fill: { type: solid, color: "$primary" }

  - id: blood-drip-3
    type: rect
    z: 34
    x: 960
    y: 1300
    width: 6
    height: 60
    fill: { type: solid, color: "$primary" }

  - id: blood-drop-1
    type: circle
    z: 35
    cx: 644
    cy: 1440
    rx: 8
    ry: 12
    fill: { type: solid, color: "$primary" }

  - id: cast-rule
    type: rect
    z: 40
    x: 440
    y: 1620
    width: 400
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: release-eyebrow
    type: text
    z: 41
    x: 120
    y: 1660
    width: 1040
    height: 0
    content: { type: plain, value: "ONLY IN THEATERS" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: release-date
    type: text
    z: 42
    x: 120
    y: 1700
    width: 1040
    height: 0
    content: { type: plain, value: "OCTOBER 31" }
    style:
      font_family: $heading
      font_size: 80
      font_weight: 900
      color: $primary
      letter_spacing: 0.04
      text_align: center
      text_transform: uppercase

  - id: footer
    type: text
    z: 50
    x: 120
    y: 1840
    width: 1040
    height: 0
    content: { type: plain, value: "RATED R · A LANTERN HOUSE PICTURES RELEASE" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

slots:
  - { id: director_credit, path: "layers[4].content.value",  type: text, hint: "Director credit line",   default: "“THE QUIET ROOM” & “HEMLOCK”" }
  - { id: tagline,         path: "layers[6].content.value",  type: text, hint: "Tagline (multi-line)",   default: "Don't sleep.\nDon't look back.\nDon't open the door." }
  - { id: title,           path: "layers[9].content.value",  type: text, hint: "Title main word",        default: "HOLLOWING" }
  - { id: release_date,    path: "layers[16].content.value", type: text, hint: "Release date",           default: "OCTOBER 31" }
