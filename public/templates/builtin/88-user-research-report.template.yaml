_protocol: template/v1

# User research findings — hero w/ study metadata, 4 KPIs, 3 quote callouts,
# theme breakdown table, persona usage chart, recommendations list.
meta:
  id: tmpl-user-research-report
  name: User Research Findings
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, research, ux, qualitative, interviews, interactive]
  description: "Qualitative + quantitative research synthesis: NPS, themes, persona breakdown, verbatim quotes, recommendations."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: mono-print

report:
  layout: scroll
  data:
    sources:
      - id: themes
        type: inline
        rows:
          - { theme: Onboarding friction,        mentions: 42, sentiment: -0.62, severity: High }
          - { theme: Search relevance,           mentions: 36, sentiment: -0.41, severity: High }
          - { theme: Reporting flexibility,      mentions: 31, sentiment: -0.28, severity: Medium }
          - { theme: Mobile experience,          mentions: 28, sentiment: -0.54, severity: High }
          - { theme: Collaboration & sharing,    mentions: 24, sentiment:  0.18, severity: Low }
          - { theme: Pricing clarity,            mentions: 21, sentiment: -0.46, severity: Medium }
          - { theme: Customer support response,  mentions: 19, sentiment:  0.34, severity: Low }
          - { theme: Integration coverage,       mentions: 17, sentiment: -0.12, severity: Medium }
          - { theme: Documentation quality,      mentions: 14, sentiment: -0.21, severity: Medium }
          - { theme: Performance & speed,        mentions: 12, sentiment: -0.38, severity: Medium }
      - id: personas
        type: inline
        rows:
          - { persona: Power Analyst,        participants: 14, satisfaction: 7.8, task_success: 86.4 }
          - { persona: Team Manager,         participants: 12, satisfaction: 6.4, task_success: 72.8 }
          - { persona: Casual Viewer,        participants: 18, satisfaction: 5.8, task_success: 61.2 }
          - { persona: New Onboarder,        participants:  9, satisfaction: 4.6, task_success: 48.4 }
          - { persona: External Stakeholder, participants:  7, satisfaction: 6.2, task_success: 68.6 }

pages:
  - id: findings
    label: Findings
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "RESEARCH STUDY · MAR 4 – APR 18, 2026 · N = 60"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**Reporting Module — Discovery Research**\n*Generative interviews and unmoderated task studies with current customers and prospects.*"

      - id: kpi-participants
        type: kpi_card
        x: 60
        y: 220
        width: 280
        height: 140
        label: Participants
        value: 60
        format: number

      - id: kpi-nps
        type: kpi_card
        x: 360
        y: 220
        width: 280
        height: 140
        label: NPS
        value: 28
        format: number
        delta: 6
        delta_format: number

      - id: kpi-session
        type: kpi_card
        x: 660
        y: 220
        width: 280
        height: 140
        label: Avg Session (min)
        value: 42.4
        format: number
        decimals: 1

      - id: kpi-success
        type: kpi_card
        x: 960
        y: 220
        width: 260
        height: 140
        label: Task Success Rate
        value: 68.2
        format: percent
        delta: -4.6
        delta_format: percent

      - id: section-quotes
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**In Their Own Words**"

      - id: quote-1
        type: rich_text
        x: 60
        y: 460
        width: 1160
        height: 160
        format: markdown
        font_family: Playfair Display
        font_size: 22
        line_height: 1.5
        content: |
          > *"The first time I opened the reports tab I had no idea where to start.
          > Eventually I just exported everything to a spreadsheet and built it the
          > way I needed in Excel."*
          >
          > — Maria L., Senior Analyst · Mid-Market customer (18 months)

      - id: quote-2
        type: rich_text
        x: 60
        y: 640
        width: 1160
        height: 160
        format: markdown
        font_family: Playfair Display
        font_size: 22
        line_height: 1.5
        content: |
          > *"Search feels broken — I type the exact name of a dashboard I made
          > yesterday and it returns three unrelated things first. So I gave up
          > searching and just bookmark URLs."*
          >
          > — David K., Operations Manager · Enterprise customer (3 years)

      - id: quote-3
        type: rich_text
        x: 60
        y: 820
        width: 1160
        height: 160
        format: markdown
        font_family: Playfair Display
        font_size: 22
        line_height: 1.5
        content: |
          > *"On mobile it works, technically — but the charts are too small to
          > read and I can't filter without the page jumping around. I only use
          > it from my laptop now."*
          >
          > — Priya S., Team Lead · Mid-Market customer (8 months)

      - id: section-themes
        type: rich_text
        x: 60
        y: 1020
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Theme Breakdown**"

      - id: tbl-themes
        type: interactive_table
        x: 60
        y: 1080
        width: 1160
        height: 500
        data_ref: themes
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: theme,     title: Theme,        width: 420, sortable: true }
          - { field: mentions,  title: Mentions,     width: 200, sortable: true, formatter: number, align: right }
          - { field: sentiment, title: Sentiment,    width: 220, sortable: true, formatter: delta,  align: right }
          - { field: severity,  title: Severity,     width: 220, sortable: true, formatter: badge }

      - id: section-personas
        type: rich_text
        x: 60
        y: 1620
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Usage by Persona**"

      - id: chart-personas
        type: interactive_chart
        x: 60
        y: 1680
        width: 1160
        height: 380
        chart_type: bar
        data_ref: personas
        x_field: persona
        y_field: task_success
        title: Task Success Rate by Persona
        legend: false
        grid: true
        animate: true

      - id: section-recommendations
        type: rich_text
        x: 60
        y: 2100
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Recommendations**"

      - id: recommendations
        type: rich_text
        x: 60
        y: 2160
        width: 1160
        height: 220
        format: markdown
        font_family: Inter
        font_size: 16
        line_height: 1.7
        content: |
          1. **Redesign reporting onboarding.** Replace the empty-state with a
             three-step guided tour anchored on the most common first task
             (build a dashboard from a template). Targets the 39.6% drop in the
             onboarding flow.
          2. **Rebuild search.** Move from keyword-match to a recency-weighted
             scoring model with personal-content boosted. Add a "Recently
             viewed" panel above results. Highest-mentioned theme (36).
          3. **Mobile chart legibility.** Ship a responsive chart variant that
             prioritises a single series with swipe-to-cycle, plus a sticky
             filter bar that does not reflow the page.
          4. **Pricing surface.** Move the pricing-tier comparison out of a
             modal and into a permanent settings page so admins can self-serve
             upgrade decisions.
          5. **Re-test in 90 days.** Re-run the task battery with the same five
             personas after shipping items 1–3 and target a **+10pt** lift in
             overall task success.

slots:
  - { id: report_title,        path: "pages[0].layers[1].content",  type: text, hint: "Research title",        default: "**Reporting Module — Discovery Research**\n*Generative interviews and unmoderated task studies with current customers and prospects.*" }
  - { id: report_eyebrow,      path: "pages[0].layers[0].content",  type: text, hint: "Study metadata",        default: "RESEARCH STUDY · MAR 4 – APR 18, 2026 · N = 60" }
  - { id: quotes_section,      path: "pages[0].layers[6].content",  type: text, hint: "Quotes heading",        default: "**In Their Own Words**" }
  - { id: themes_section,      path: "pages[0].layers[10].content", type: text, hint: "Themes heading",        default: "**Theme Breakdown**" }
  - { id: personas_section,    path: "pages[0].layers[12].content", type: text, hint: "Personas heading",      default: "**Usage by Persona**" }
  - { id: recommendations_md,  path: "pages[0].layers[15].content", type: text, hint: "Recommendations body",  default: "1. **Redesign reporting onboarding.**" }
