_protocol: template/v1

# Instagram Story Highlight cover — 1080×1920 portrait, pastel-dream.
# Centered icon glyph inside a ringed circular bubble; script label
# below the bubble; outer color border indicates highlight collection.
meta:
  id: tmpl-instagram-story-highlight
  name: Instagram Story Highlight
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, instagram, highlight, story, portrait, pastel]
  description: "Instagram Story Highlight cover — centered glyph in a ringed bubble with script label and brand color hint."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: $background }
  # ── Soft top-left blob ────────────────────────────────────
  - id: blob-1
    type: circle
    z: 1
    cx: 80
    cy: 220
    rx: 240
    ry: 240
    fill: { type: none }
    opacity: 0.32

  # ── Soft bottom-right blob ────────────────────────────────
  - id: blob-2
    type: circle
    z: 1
    cx: 1020
    cy: 1700
    rx: 320
    ry: 320
    fill: { type: none }
    opacity: 0.3

  # ── Outer color border ring ───────────────────────────────
  - id: outer-ring
    type: circle
    z: 5
    cx: 540
    cy: 880
    rx: 360
    ry: 360
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 14 }

  # ── Inner spacer ring ─────────────────────────────────────
  - id: spacer-ring
    type: circle
    z: 6
    cx: 540
    cy: 880
    rx: 330
    ry: 330
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$background", width: 8 }

  # ── Inner bubble ──────────────────────────────────────────
  - id: bubble
    type: circle
    z: 7
    cx: 540
    cy: 880
    rx: 308
    ry: 308
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$accent", width: 4 }

  # ── Decorative tiny circles around ring ───────────────────
  - id: dot-tl
    type: circle
    z: 8
    cx: 320
    cy: 600
    rx: 16
    ry: 16
    fill: { type: solid, color: "$secondary" }

  - id: dot-tr
    type: circle
    z: 8
    cx: 760
    cy: 600
    rx: 12
    ry: 12
    fill: { type: solid, color: "$accent" }

  - id: dot-br
    type: circle
    z: 8
    cx: 800
    cy: 1180
    rx: 20
    ry: 20
    fill: { type: solid, color: "$primary" }

  # ── Centered icon glyph ───────────────────────────────────
  - id: icon-glyph
    type: text
    z: 10
    x: 60
    y: 745
    width: 960
    height: 0
    content: { type: plain, value: "✶" }
    style:
      font_family: $heading
      font_size: 280
      font_weight: 900
      color: $primary
      text_align: center
      line_height: 1

  # ── Label dot ─────────────────────────────────────────────
  - id: label-dot
    type: circle
    z: 19
    cx: 540
    cy: 1370
    rx: 6
    ry: 6
    fill: { type: solid, color: "$accent" }

  # ── Script label below bubble ─────────────────────────────
  - id: icon-label
    type: text
    z: 20
    x: 60
    y: 1430
    width: 960
    height: 0
    content: { type: plain, value: "favorites" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 500
      color: $text
      font_style: italic
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01

  # ── Brand color hint label ────────────────────────────────
  - id: color-hint
    type: text
    z: 21
    x: 60
    y: 1580
    width: 960
    height: 0
    content: { type: plain, value: "BLUSH · No. 04" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.32
      text_transform: uppercase
      line_height: 1.3

  # ── Brand handle footer ───────────────────────────────────
  - id: handle
    type: text
    z: 22
    x: 60
    y: 1810
    width: 960
    height: 0
    content: { type: plain, value: "@studio.bloom" }
    style:
      font_family: $mono
      font_size: 26
      font_weight: 600
      color: $text_muted
      text_align: center
      line_height: 1.3

slots:
  - { id: icon_label,       path: "layers[11].content.value", type: text, hint: "Highlight label (script)",  default: "favorites" }
  - { id: brand_color_hint, path: "layers[12].content.value", type: text, hint: "Brand color hint label",    default: "BLUSH · No. 04" }
