_protocol: template/v1

# Statistics showcase slide — 16:9 widescreen.
# Title at top, 4 stat columns (big number + suffix + label + context),
# vertical divider lines between each column, footer with data source.
meta:
  id: tmpl-slide-statistics
  name: Slide — Statistics
  type: presentation
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [slide, presentation, statistics, kpi, metrics, 16x9]

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  - id: top-bar
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1920
    height: 6
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 120
    y: 100
    width: 1680
    height: 0
    content: { type: plain, value: "BY THE NUMBERS" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: title
    type: text
    z: 11
    x: 120
    y: 150
    width: 1680
    height: 0
    content: { type: plain, value: "2026 platform impact" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 700
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: stat1_value
    type: text
    z: 20
    x: 120
    y: 420
    width: 400
    height: 0
    content: { type: plain, value: "847" }
    style:
      font_family: $heading
      font_size: 144
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.04

  - id: stat1-suffix
    type: text
    z: 21
    x: 360
    y: 380
    width: 100
    height: 0
    content: { type: plain, value: "K" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 700
      color: $primary
      line_height: 1

  - id: stat1_label
    type: text
    z: 22
    x: 120
    y: 600
    width: 400
    height: 0
    content: { type: plain, value: "Active designs rendered" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      line_height: 1.3

  - id: stat1_context
    type: text
    z: 23
    x: 120
    y: 650
    width: 400
    height: 0
    content: { type: plain, value: "across 12 supported file formats" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.4

  - id: divider1
    type: rect
    z: 5
    x: 555
    y: 400
    width: 2
    height: 320
    fill: { type: solid, color: "$border" }
    opacity: 0.5

  - id: stat2_value
    type: text
    z: 24
    x: 605
    y: 420
    width: 400
    height: 0
    content: { type: plain, value: "99.4" }
    style:
      font_family: $heading
      font_size: 144
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.04

  - id: stat2-suffix
    type: text
    z: 25
    x: 925
    y: 380
    width: 100
    height: 0
    content: { type: plain, value: "%" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 700
      color: $primary
      line_height: 1

  - id: stat2_label
    type: text
    z: 26
    x: 605
    y: 600
    width: 400
    height: 0
    content: { type: plain, value: "Render success rate" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      line_height: 1.3

  - id: stat2_context
    type: text
    z: 27
    x: 605
    y: 650
    width: 400
    height: 0
    content: { type: plain, value: "up from 96.1% in Q4 2025" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.4

  - id: divider2
    type: rect
    z: 6
    x: 1040
    y: 400
    width: 2
    height: 320
    fill: { type: solid, color: "$border" }
    opacity: 0.5

  - id: stat3_value
    type: text
    z: 28
    x: 1090
    y: 420
    width: 400
    height: 0
    content: { type: plain, value: "62" }
    style:
      font_family: $heading
      font_size: 144
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.04

  - id: stat3-suffix
    type: text
    z: 29
    x: 1270
    y: 380
    width: 120
    height: 0
    content: { type: plain, value: "ms" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 700
      color: $primary
      line_height: 1

  - id: stat3_label
    type: text
    z: 30
    x: 1090
    y: 600
    width: 400
    height: 0
    content: { type: plain, value: "Median first render" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      line_height: 1.3

  - id: stat3_context
    type: text
    z: 31
    x: 1090
    y: 650
    width: 400
    height: 0
    content: { type: plain, value: "for decks up to 50 layers" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.4

  - id: divider3
    type: rect
    z: 7
    x: 1525
    y: 400
    width: 2
    height: 320
    fill: { type: solid, color: "$border" }
    opacity: 0.5

  - id: stat4_value
    type: text
    z: 32
    x: 1575
    y: 420
    width: 300
    height: 0
    content: { type: plain, value: "3.2" }
    style:
      font_family: $heading
      font_size: 144
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.04

  - id: stat4-suffix
    type: text
    z: 33
    x: 1825
    y: 380
    width: 80
    height: 0
    content: { type: plain, value: "×" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 700
      color: $accent
      line_height: 1

  - id: stat4_label
    type: text
    z: 34
    x: 1575
    y: 600
    width: 300
    height: 0
    content: { type: plain, value: "Iteration speedup" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      line_height: 1.3

  - id: stat4_context
    type: text
    z: 35
    x: 1575
    y: 650
    width: 300
    height: 0
    content: { type: plain, value: "with LLM-assisted authoring" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.4

  - id: footer_source
    type: text
    z: 60
    x: 120
    y: 1020
    width: 1680
    height: 0
    content: { type: plain, value: "Source: Folio Telemetry · Q1 2026 (n=12,400 sessions)" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted

slots:
  - { id: title,          path: "layers[3].content.value",  type: text, hint: "Slide title",          default: "2026 platform impact" }
  - { id: stat1_value,    path: "layers[4].content.value",  type: text, hint: "Stat 1 big number",    default: "847" }
  - { id: stat1_label,    path: "layers[6].content.value",  type: text, hint: "Stat 1 label",         default: "Active designs rendered" }
  - { id: stat1_context,  path: "layers[7].content.value",  type: text, hint: "Stat 1 context",       default: "across 12 supported file formats" }
  - { id: stat2_value,    path: "layers[9].content.value",  type: text, hint: "Stat 2 big number",    default: "99.4" }
  - { id: stat2_label,    path: "layers[11].content.value", type: text, hint: "Stat 2 label",         default: "Render success rate" }
  - { id: stat2_context,  path: "layers[12].content.value", type: text, hint: "Stat 2 context",       default: "up from 96.1% in Q4 2025" }
  - { id: stat3_value,    path: "layers[14].content.value", type: text, hint: "Stat 3 big number",    default: "62" }
  - { id: stat3_label,    path: "layers[16].content.value", type: text, hint: "Stat 3 label",         default: "Median first render" }
  - { id: stat3_context,  path: "layers[17].content.value", type: text, hint: "Stat 3 context",       default: "for decks up to 50 layers" }
  - { id: stat4_value,    path: "layers[19].content.value", type: text, hint: "Stat 4 big number",    default: "3.2" }
  - { id: stat4_label,    path: "layers[21].content.value", type: text, hint: "Stat 4 label",         default: "Iteration speedup" }
  - { id: stat4_context,  path: "layers[22].content.value", type: text, hint: "Stat 4 context",       default: "with LLM-assisted authoring" }
  - { id: footer_source,  path: "layers[23].content.value", type: text, hint: "Footer data source",   default: "Source: Folio Telemetry · Q1 2026 (n=12,400 sessions)" }
