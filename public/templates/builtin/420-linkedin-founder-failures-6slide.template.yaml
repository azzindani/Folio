_protocol: template/v1

# 6-slide LinkedIn carousel — 3 startup failures + lessons.
# Portrait 1080×1350. Sunset-glow theme. Top accent band + pagination.
meta:
  id: tmpl-linkedin-founder-failures-6slide
  name: LinkedIn · Founder Failures (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, startup, founder, failures, lessons, 4-5, sunset-glow]
  description: "6-slide LinkedIn carousel: 3 failed startups, what each one taught, and what you'd tell your past self."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 165, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "1 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "FOUNDER STORIES" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 530, width: 960, height: 0, content: { type: plain, value: "3 startups\nI killed.\nHere's what\nthey taught me." }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1.02, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 1140, width: 960, height: 0, content: { type: plain, value: "Swipe → the wins were small. The lessons were huge." }, style: { font_family: $body, font_size: 24, color: $text_muted } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 2 · Startup 1 ────────────────────────────────────
  - id: startup-1
    label: Startup 1
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "2 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "STARTUP 01 · 2018 — 2019" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: name, type: text, z: 12, x: 60, y: 220, width: 960, height: 0, content: { type: plain, value: "Loopdeck" }, style: { font_family: $heading, font_size: 92, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 360, width: 960, height: 0, content: { type: plain, value: "A music collab tool nobody asked for." }, style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 } }
      - { id: divider, type: rect, z: 14, x: 60, y: 480, width: 960, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }
      - { id: lesson-label, type: text, z: 15, x: 60, y: 520, width: 960, height: 0, content: { type: plain, value: "WHAT IT TAUGHT ME" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: lesson, type: text, z: 16, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "If you can't find 10 angry users, you don't have a market — you have a hobby. Stop building, go talk." }, style: { font_family: $body, font_size: 32, color: $text, line_height: 1.45 } }
      - { id: handle, type: text, z: 17, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 3 · Startup 2 ────────────────────────────────────
  - id: startup-2
    label: Startup 2
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "3 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "STARTUP 02 · 2020 — 2021" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: name, type: text, z: 12, x: 60, y: 220, width: 960, height: 0, content: { type: plain, value: "Inkstride" }, style: { font_family: $heading, font_size: 92, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 360, width: 960, height: 0, content: { type: plain, value: "A writing tool that drowned in features." }, style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 } }
      - { id: divider, type: rect, z: 14, x: 60, y: 480, width: 960, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }
      - { id: lesson-label, type: text, z: 15, x: 60, y: 520, width: 960, height: 0, content: { type: plain, value: "WHAT IT TAUGHT ME" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: lesson, type: text, z: 16, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "Pricing is product. Charging $5 attracts a $5 audience — and a $5 support burden you can't survive." }, style: { font_family: $body, font_size: 32, color: $text, line_height: 1.45 } }
      - { id: handle, type: text, z: 17, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 4 · Startup 3 ────────────────────────────────────
  - id: startup-3
    label: Startup 3
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "4 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "STARTUP 03 · 2022 — 2023" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: name, type: text, z: 12, x: 60, y: 220, width: 960, height: 0, content: { type: plain, value: "Caribou" }, style: { font_family: $heading, font_size: 92, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 360, width: 960, height: 0, content: { type: plain, value: "A team analytics product, killed by the wrong co-founder fit." }, style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 } }
      - { id: divider, type: rect, z: 14, x: 60, y: 500, width: 960, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }
      - { id: lesson-label, type: text, z: 15, x: 60, y: 540, width: 960, height: 0, content: { type: plain, value: "WHAT IT TAUGHT ME" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: lesson, type: text, z: 16, x: 60, y: 600, width: 960, height: 0, content: { type: plain, value: "Talent isn't enough. If you can't have a hard conversation in week one, you won't make it to month twelve." }, style: { font_family: $body, font_size: 32, color: $text, line_height: 1.45 } }
      - { id: handle, type: text, z: 17, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 5 · What I'd tell past me ────────────────────────
  - id: past-me
    label: Past me
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "5 / 6" }, style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.18 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "WHAT I'D TELL PAST ME" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 220, width: 960, height: 0, content: { type: plain, value: "Three sentences." }, style: { font_family: $heading, font_size: 68, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: line-1, type: text, z: 20, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "01 · Validate the buyer before the builder." }, style: { font_family: $body, font_size: 30, color: $text, line_height: 1.5 } }
      - { id: line-2, type: text, z: 21, x: 60, y: 660, width: 960, height: 0, content: { type: plain, value: "02 · Price for the customer you want, not the one you have." }, style: { font_family: $body, font_size: 30, color: $text, line_height: 1.5 } }
      - { id: line-3, type: text, z: 22, x: 60, y: 860, width: 960, height: 0, content: { type: plain, value: "03 · Pick your co-founder like you'd pick a spouse." }, style: { font_family: $body, font_size: 30, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 17, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 6 · CTA ──────────────────────────────────────────
  - id: cta
    label: CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 180, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(20,5,10,0.3)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "6 / 6" }, style: { font_family: $mono, font_size: 18, color: "#FFEFE8", letter_spacing: 0.18 } }
      - { id: heading, type: text, z: 11, x: 60, y: 480, width: 960, height: 0, content: { type: plain, value: "Save this." }, style: { font_family: $heading, font_size: 128, font_weight: 800, color: "#FFFFFF", line_height: 1, letter_spacing: -0.03 } }
      - { id: sub, type: text, z: 12, x: 60, y: 660, width: 960, height: 0, content: { type: plain, value: "Failure compounds — if you're willing to publish it." }, style: { font_family: $body, font_size: 28, color: "#FFEFE8", line_height: 1.4 } }
      - { id: cta-btn, type: rect, z: 13, x: 60, y: 820, width: 320, height: 72, radius: 36, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 14, x: 60, y: 842, width: 320, height: 0, content: { type: plain, value: "Follow →" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "#33150A", text_align: center } }
      - { id: handle, type: text, z: 15, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF" } }

slots:
  - { id: cover_title,     path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",      default: "3 startups\nI killed.\nHere's what\nthey taught me." }
  - { id: startup_1_name,  path: "pages[1].layers[4].content.value", type: text, hint: "Startup 1 name",      default: "Loopdeck" }
  - { id: startup_1_tag,   path: "pages[1].layers[5].content.value", type: text, hint: "Startup 1 tagline",   default: "A music collab tool nobody asked for." }
  - { id: startup_1_lesson,path: "pages[1].layers[8].content.value", type: text, hint: "Startup 1 lesson",    default: "If you can't find 10 angry users, you don't have a market." }
  - { id: startup_2_name,  path: "pages[2].layers[4].content.value", type: text, hint: "Startup 2 name",      default: "Inkstride" }
  - { id: startup_2_tag,   path: "pages[2].layers[5].content.value", type: text, hint: "Startup 2 tagline",   default: "A writing tool that drowned in features." }
  - { id: startup_2_lesson,path: "pages[2].layers[8].content.value", type: text, hint: "Startup 2 lesson",    default: "Pricing is product." }
  - { id: startup_3_name,  path: "pages[3].layers[4].content.value", type: text, hint: "Startup 3 name",      default: "Caribou" }
  - { id: startup_3_tag,   path: "pages[3].layers[5].content.value", type: text, hint: "Startup 3 tagline",   default: "A team analytics product, killed by the wrong co-founder fit." }
  - { id: startup_3_lesson,path: "pages[3].layers[8].content.value", type: text, hint: "Startup 3 lesson",    default: "Talent isn't enough." }
  - { id: past_me_title,   path: "pages[4].layers[4].content.value", type: text, hint: "Past-me title",       default: "Three sentences." }
  - { id: cta_heading,     path: "pages[5].layers[4].content.value", type: text, hint: "CTA heading",         default: "Save this." }
