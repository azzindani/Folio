_protocol: template/v1

# 5-slide LinkedIn carousel — How-To narrative.
# Cover / Why / Step 1 / Step 2 / CTA. Portrait 1080×1350 (4:5).
meta:
  id: tmpl-linkedin-howto-5slide
  name: LinkedIn How-To (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, howto, listicle, 4-5]
  description: "Five-slide LinkedIn carousel walking through a 2-step how-to with a why slide and a save-this CTA. 1080×1350 portrait. Indigo-Pro theme."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1290
        width: 140
        height: 0
        content: { type: plain, value: "1/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "THE GUIDE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "How to Run a\nUseful 1-on-1" }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: subhead
        type: text
        z: 13
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "A two-step playbook for managers who want to stop wasting the meeting." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.45 }
      - id: swipe
        type: text
        z: 14
        x: 80
        y: 1100
        width: 920
        height: 0
        content: { type: plain, value: "Swipe →" }
        style: { font_family: $body, font_size: 22, font_weight: 700, color: $primary }
      - id: handle
        type: text
        z: 15
        x: 80
        y: 1290
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 2 · Why ──────────────────────────────────────────
  - id: why
    label: Why this matters
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1290
        width: 140
        height: 0
        content: { type: plain, value: "2/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 160
        width: 920
        height: 0
        content: { type: plain, value: "WHY" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "Most 1-on-1s become status updates." }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.15 }
      - id: body
        type: text
        z: 13
        x: 80
        y: 440
        width: 920
        height: 0
        content: { type: plain, value: "The meeting drifts into project check-ins, real friction goes unsaid, and both sides leave wondering what it was for. A useful 1-on-1 is about the human, not the ticket queue." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: stat
        type: text
        z: 14
        x: 80
        y: 820
        width: 920
        height: 0
        content: { type: plain, value: "73%" }
        style: { font_family: $heading, font_size: 200, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.04 }
      - id: caption
        type: text
        z: 15
        x: 80
        y: 1080
        width: 920
        height: 0
        content: { type: plain, value: "of employees say their 1-on-1 is mostly a status update — Gallup, 2023." }
        style: { font_family: $body, font_size: 20, color: $text_muted, line_height: 1.4 }

  # ── Slide 3 · Step 1 ───────────────────────────────────────
  - id: step-1
    label: Step 1
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: icon, type: rect, z: 2, x: 80, y: 160, width: 56, height: 56, radius: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1290
        width: 140
        height: 0
        content: { type: plain, value: "3/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 160
        y: 178
        width: 800
        height: 0
        content: { type: plain, value: "STEP 1 · OPEN" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 320
        width: 920
        height: 0
        content: { type: plain, value: "Start with the human,\nnot the work." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.12, letter_spacing: -0.02 }
      - id: bullet-1
        type: text
        z: 20
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "→ Ask one open question about life outside work." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: bullet-2
        type: text
        z: 21
        x: 80
        y: 740
        width: 920
        height: 0
        content: { type: plain, value: "→ Listen for 60 seconds without interrupting." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: bullet-3
        type: text
        z: 22
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "→ Mirror back what you heard before pivoting." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 4 · Step 2 ───────────────────────────────────────
  - id: step-2
    label: Step 2
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: icon, type: circle, z: 2, cx: 108, cy: 188, rx: 28, ry: 28, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1290
        width: 140
        height: 0
        content: { type: plain, value: "4/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 160
        y: 178
        width: 800
        height: 0
        content: { type: plain, value: "STEP 2 · UNBLOCK" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 320
        width: 920
        height: 0
        content: { type: plain, value: "Ask what's in\ntheir way." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.12, letter_spacing: -0.02 }
      - id: bullet-1
        type: text
        z: 20
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "→ \"What's the most frustrating thing this week?\"" }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: bullet-2
        type: text
        z: 21
        x: 80
        y: 740
        width: 920
        height: 0
        content: { type: plain, value: "→ Name one blocker you can remove this week." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: bullet-3
        type: text
        z: 22
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "→ Write the action down in front of them." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }

  # ── Slide 5 · CTA ──────────────────────────────────────────
  - id: cta
    label: CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1290
        width: 140
        height: 0
        content: { type: plain, value: "5/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: thanks
        type: text
        z: 11
        x: 80
        y: 420
        width: 920
        height: 0
        content: { type: plain, value: "Thanks for reading." }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: cta-rect
        type: rect
        z: 12
        x: 80
        y: 620
        width: 920
        height: 140
        radius: 20
        fill: { type: solid, color: "$primary" }
      - id: cta-text
        type: text
        z: 13
        x: 80
        y: 668
        width: 920
        height: 0
        content: { type: plain, value: "Save this for your next 1:1." }
        style: { font_family: $body, font_size: 28, font_weight: 700, color: "#FFFFFF", text_align: center, line_height: 1.4 }
      - id: handle
        type: text
        z: 14
        x: 80
        y: 1290
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",        default: "How to Run a\nUseful 1-on-1" }
  - { id: cover_subhead,  path: "pages[0].layers[5].content.value", type: text, hint: "Cover subheading",      default: "A two-step playbook for managers who want to stop wasting the meeting." }
  - { id: why_title,      path: "pages[1].layers[4].content.value", type: text, hint: "Why headline",          default: "Most 1-on-1s become status updates." }
  - { id: why_body,       path: "pages[1].layers[5].content.value", type: text, hint: "Why body paragraph",    default: "The meeting drifts into project check-ins, real friction goes unsaid, and both sides leave wondering what it was for. A useful 1-on-1 is about the human, not the ticket queue." }
  - { id: why_stat,       path: "pages[1].layers[6].content.value", type: text, hint: "Big stat",              default: "73%" }
  - { id: why_caption,    path: "pages[1].layers[7].content.value", type: text, hint: "Stat attribution",      default: "of employees say their 1-on-1 is mostly a status update — Gallup, 2023." }
  - { id: step_1_title,   path: "pages[2].layers[5].content.value", type: text, hint: "Step 1 headline",       default: "Start with the human,\nnot the work." }
  - { id: step_1_b1,      path: "pages[2].layers[6].content.value", type: text, hint: "Step 1 bullet 1",       default: "→ Ask one open question about life outside work." }
  - { id: step_2_title,   path: "pages[3].layers[5].content.value", type: text, hint: "Step 2 headline",       default: "Ask what's in\ntheir way." }
  - { id: step_2_b1,      path: "pages[3].layers[6].content.value", type: text, hint: "Step 2 bullet 1",       default: "→ \"What's the most frustrating thing this week?\"" }
  - { id: cta_thanks,     path: "pages[4].layers[3].content.value", type: text, hint: "CTA closing line",      default: "Thanks for reading." }
  - { id: cta_action,     path: "pages[4].layers[5].content.value", type: text, hint: "CTA action callout",    default: "Save this for your next 1:1." }
  - { id: cta_handle,     path: "pages[4].layers[6].content.value", type: text, hint: "Footer handle",         default: "@yourhandle" }
