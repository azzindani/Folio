_protocol: template/v1

# 6-slide LinkedIn carousel — Common Mistakes & The Fix narrative.
# Portrait 1080×1350, high-contrast tonal palette for sharp punchy reads.
meta:
  id: tmpl-linkedin-mistakes-6slide
  name: LinkedIn Mistakes to Avoid (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, mistakes, lessons, 4-5]
  description: "Six-slide LinkedIn carousel calling out four common roadmap mistakes and offering a better approach. Each mistake gets its own slide with a numbered mark, headline, rationale, and corrective callout."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: high-contrast

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "1/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "DON'T DO THIS" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 540
        width: 920
        height: 0
        content: { type: plain, value: "4 mistakes killing\nyour roadmap" }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: subtitle
        type: text
        z: 13
        x: 80
        y: 880
        width: 920
        height: 0
        content: { type: plain, value: "And what to do instead. Swipe →" }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: handle
        type: text
        z: 14
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 2 · Mistake 01 ───────────────────────────────────
  - id: mistake-1
    label: Mistake 01
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "2/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: mark
        type: text
        z: 11
        x: 80
        y: 160
        width: 400
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $heading, font_size: 220, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.05 }
      - id: eyebrow
        type: text
        z: 12
        x: 80
        y: 470
        width: 920
        height: 0
        content: { type: plain, value: "MISTAKE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $text_muted, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 13
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "Shipping features\nno one asked for" }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 14
        x: 80
        y: 800
        width: 920
        height: 0
        content: { type: plain, value: "Backlogs built from internal opinion always grow. Without a clear pull signal from real customers, every shipped feature adds maintenance cost and dilutes the product story." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1140, width: 540, height: 70, radius: 35, fill: { type: solid, color: "$surface" } }
      - id: callout
        type: text
        z: 16
        x: 80
        y: 1160
        width: 540
        height: 0
        content: { type: plain, value: "DO THIS INSTEAD →" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.16, text_transform: uppercase, text_align: center }

  # ── Slide 3 · Mistake 02 ───────────────────────────────────
  - id: mistake-2
    label: Mistake 02
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "3/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: mark
        type: text
        z: 11
        x: 80
        y: 160
        width: 400
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $heading, font_size: 220, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.05 }
      - id: eyebrow
        type: text
        z: 12
        x: 80
        y: 470
        width: 920
        height: 0
        content: { type: plain, value: "MISTAKE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $text_muted, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 13
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "Quarterly plans\nset in stone" }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 14
        x: 80
        y: 800
        width: 920
        height: 0
        content: { type: plain, value: "If your roadmap can't survive a single customer call, it isn't a plan, it's a wish. Locking 13 weeks of work in week one ignores everything you'll learn in weeks two through twelve." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1140, width: 540, height: 70, radius: 35, fill: { type: solid, color: "$surface" } }
      - id: callout
        type: text
        z: 16
        x: 80
        y: 1160
        width: 540
        height: 0
        content: { type: plain, value: "DO THIS INSTEAD →" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.16, text_transform: uppercase, text_align: center }

  # ── Slide 4 · Mistake 03 ───────────────────────────────────
  - id: mistake-3
    label: Mistake 03
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "4/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: mark
        type: text
        z: 11
        x: 80
        y: 160
        width: 400
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $heading, font_size: 220, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.05 }
      - id: eyebrow
        type: text
        z: 12
        x: 80
        y: 470
        width: 920
        height: 0
        content: { type: plain, value: "MISTAKE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $text_muted, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 13
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "Treating every\nrequest as urgent" }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 14
        x: 80
        y: 800
        width: 920
        height: 0
        content: { type: plain, value: "When everything is priority one, nothing is. Constant interruption breaks deep work, kills momentum, and trains stakeholders that the loudest voice wins instead of the strongest evidence." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1140, width: 540, height: 70, radius: 35, fill: { type: solid, color: "$surface" } }
      - id: callout
        type: text
        z: 16
        x: 80
        y: 1160
        width: 540
        height: 0
        content: { type: plain, value: "DO THIS INSTEAD →" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.16, text_transform: uppercase, text_align: center }

  # ── Slide 5 · Mistake 04 ───────────────────────────────────
  - id: mistake-4
    label: Mistake 04
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "5/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: mark
        type: text
        z: 11
        x: 80
        y: 160
        width: 400
        height: 0
        content: { type: plain, value: "04" }
        style: { font_family: $heading, font_size: 220, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.05 }
      - id: eyebrow
        type: text
        z: 12
        x: 80
        y: 470
        width: 920
        height: 0
        content: { type: plain, value: "MISTAKE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $text_muted, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 13
        x: 80
        y: 520
        width: 920
        height: 0
        content: { type: plain, value: "No metric\nfor success" }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 14
        x: 80
        y: 800
        width: 920
        height: 0
        content: { type: plain, value: "If you can't define what 'done well' looks like before you ship, you can't tell whether the feature worked. Shipping volume becomes the metric by default, and that's a trap." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1140, width: 540, height: 70, radius: 35, fill: { type: solid, color: "$surface" } }
      - id: callout
        type: text
        z: 16
        x: 80
        y: 1160
        width: 540
        height: 0
        content: { type: plain, value: "DO THIS INSTEAD →" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.16, text_transform: uppercase, text_align: center }

  # ── Slide 6 · The Fix + CTA ────────────────────────────────
  - id: fix-cta
    label: The Fix + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: top-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "6/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 160
        width: 920
        height: 0
        content: { type: plain, value: "BETTER APPROACH" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "A roadmap that\nactually ships" }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - { id: step-1-mark, type: rect, z: 20, x: 80, y: 510, width: 56, height: 56, radius: 28, fill: { type: solid, color: "$accent" } }
      - id: step-1-num
        type: text
        z: 21
        x: 80
        y: 524
        width: 56
        height: 0
        content: { type: plain, value: "1" }
        style: { font_family: $heading, font_size: 26, font_weight: 800, color: $background, text_align: center }
      - id: step-1-text
        type: text
        z: 22
        x: 170
        y: 522
        width: 830
        height: 0
        content: { type: plain, value: "Pull from customer signal, not internal opinion." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: step-2-mark, type: rect, z: 23, x: 80, y: 660, width: 56, height: 56, radius: 28, fill: { type: solid, color: "$accent" } }
      - id: step-2-num
        type: text
        z: 24
        x: 80
        y: 674
        width: 56
        height: 0
        content: { type: plain, value: "2" }
        style: { font_family: $heading, font_size: 26, font_weight: 800, color: $background, text_align: center }
      - id: step-2-text
        type: text
        z: 25
        x: 170
        y: 672
        width: 830
        height: 0
        content: { type: plain, value: "Plan in fortnights, not quarters. Re-plan often." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: step-3-mark, type: rect, z: 26, x: 80, y: 810, width: 56, height: 56, radius: 28, fill: { type: solid, color: "$accent" } }
      - id: step-3-num
        type: text
        z: 27
        x: 80
        y: 824
        width: 56
        height: 0
        content: { type: plain, value: "3" }
        style: { font_family: $heading, font_size: 26, font_weight: 800, color: $background, text_align: center }
      - id: step-3-text
        type: text
        z: 28
        x: 170
        y: 822
        width: 830
        height: 0
        content: { type: plain, value: "Define the success metric before you write code." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: cta-bg, type: rect, z: 30, x: 80, y: 1000, width: 700, height: 80, radius: 40, fill: { type: solid, color: "$primary" } }
      - id: cta-text
        type: text
        z: 31
        x: 80
        y: 1024
        width: 700
        height: 0
        content: { type: plain, value: "Save → audit your roadmap this week" }
        style: { font_family: $body, font_size: 22, font_weight: 700, color: $background, text_align: center }
      - id: handle
        type: text
        z: 32
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value",  type: text, hint: "Cover headline",        default: "4 mistakes killing\nyour roadmap" }
  - { id: cover_subtitle, path: "pages[0].layers[5].content.value",  type: text, hint: "Cover subtitle",        default: "And what to do instead. Swipe →" }
  - { id: mistake_1_title, path: "pages[1].layers[5].content.value", type: text, hint: "Mistake 1 headline",    default: "Shipping features\nno one asked for" }
  - { id: mistake_2_title, path: "pages[2].layers[5].content.value", type: text, hint: "Mistake 2 headline",    default: "Quarterly plans\nset in stone" }
  - { id: mistake_3_title, path: "pages[3].layers[5].content.value", type: text, hint: "Mistake 3 headline",    default: "Treating every\nrequest as urgent" }
  - { id: mistake_4_title, path: "pages[4].layers[5].content.value", type: text, hint: "Mistake 4 headline",    default: "No metric\nfor success" }
  - { id: cta_text,       path: "pages[5].layers[15].content.value", type: text, hint: "CTA chip text",         default: "Save → audit your roadmap this week" }
  - { id: handle,         path: "pages[5].layers[16].content.value", type: text, hint: "Your LinkedIn handle",  default: "@yourhandle" }
