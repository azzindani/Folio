_protocol: template/v1

# Onboarding card 1/3 — 1080×1920 portrait, pastel-dream theme.
# Illustration area top, feature title, subtitle, progress dots, Next CTA.
meta:
  id: tmpl-onboarding-card-1
  name: Onboarding Card 1 of 3
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [app, screen, onboarding, mobile, portrait, pastel]
  description: "First-screen mobile onboarding card with illustration area, feature title, subtitle, progress dots, and Next CTA."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  # ── Skip top-right ────────────────────────────────────────
  - id: skip
    type: text
    z: 5
    x: 800
    y: 80
    width: 220
    height: 0
    content: { type: plain, value: "Skip  ›" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text_muted
      text_align: right

  # ── Illustration backdrop ─────────────────────────────────
  - id: illo-bg
    type: rect
    z: 10
    x: 80
    y: 200
    width: 920
    height: 920
    radius: 64
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }

  # ── Decorative shapes inside illustration ─────────────────
  - id: illo-circle-1
    type: circle
    z: 11
    cx: 540
    cy: 600
    rx: 200
    ry: 200
    fill: { type: solid, color: "rgba(255,255,255,0.45)" }

  - id: illo-circle-2
    type: circle
    z: 12
    cx: 720
    cy: 480
    rx: 100
    ry: 100
    fill: { type: solid, color: "rgba(255,255,255,0.3)" }

  - id: illo-circle-3
    type: circle
    z: 13
    cx: 360
    cy: 800
    rx: 70
    ry: 70
    fill: { type: solid, color: "rgba(255,255,255,0.55)" }

  - id: illo-spark
    type: path
    z: 14
    d: "M 540 540 L 560 600 L 620 620 L 560 640 L 540 700 L 520 640 L 460 620 L 520 600 Z"
    fill: { type: solid, color: "#FFFFFF" }

  # ── Feature title ─────────────────────────────────────────
  - id: title
    type: text
    z: 20
    x: 80
    y: 1220
    width: 920
    height: 0
    content: { type: plain, value: "Capture your\nbest ideas." }
    style:
      font_family: $heading
      font_size: 80
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1.1
      letter_spacing: -0.025

  # ── Subtitle ──────────────────────────────────────────────
  - id: subtitle
    type: text
    z: 21
    x: 120
    y: 1440
    width: 840
    height: 0
    content: { type: plain, value: "Jot, sketch, or record anything — anywhere. Your notes stay synced across every device, beautifully." }
    style:
      font_family: $body
      font_size: 24
      color: $text_muted
      text_align: center
      line_height: 1.5

  # ── Progress dots ─────────────────────────────────────────
  - id: dot-1
    type: rect
    z: 30
    x: 470
    y: 1640
    width: 40
    height: 14
    radius: 7
    fill: { type: solid, color: "$primary" }

  - id: dot-2
    type: circle
    z: 31
    cx: 540
    cy: 1647
    rx: 7
    ry: 7
    fill: { type: solid, color: "$border" }

  - id: dot-3
    type: circle
    z: 32
    cx: 580
    cy: 1647
    rx: 7
    ry: 7
    fill: { type: solid, color: "$border" }

  # ── Next CTA ──────────────────────────────────────────────
  - id: cta-bg
    type: rect
    z: 40
    x: 80
    y: 1720
    width: 920
    height: 96
    radius: 48
    fill: { type: solid, color: "$primary" }
    effects:
      shadow:
        - { dx: 0, dy: 12, blur: 24, color: "rgba(0,0,0,0.18)" }

  - id: cta-text
    type: text
    z: 41
    x: 80
    y: 1750
    width: 920
    height: 0
    content: { type: plain, value: "Next  →" }
    style:
      font_family: $body
      font_size: 26
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

slots:
  - { id: feature_title, path: "layers[7].content.value", type: text, hint: "Feature title (2 lines)", default: "Capture your\nbest ideas." }
  - { id: subtitle,      path: "layers[8].content.value", type: text, hint: "Subtitle paragraph",      default: "Jot, sketch, or record anything — anywhere. Your notes stay synced across every device, beautifully." }
