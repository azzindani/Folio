_protocol: template/v1

# 3-slide LinkedIn document carousel — Bold Quote arc.
# Portrait 1080×1350, literary warm palette (editorial-cream).
meta:
  id: tmpl-linkedin-bold-quote-3slide
  name: LinkedIn Bold Quote (3 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, quote, editorial, 4-5]
  description: "Three-slide LinkedIn document arc built around one bold quote: hook → quote (display italic with quote-mark glyphs) → takeaway + CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Slide 1 · Cover / Hook ─────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "1/3" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 280
        width: 920
        height: 0
        content: { type: plain, value: "QUOTE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: hook
        type: text
        z: 12
        x: 80
        y: 480
        width: 920
        height: 0
        content: { type: plain, value: "This changed how I think\nabout feedback." }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.03 }
      - id: handle
        type: text
        z: 13
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 2 · The Quote ────────────────────────────────────
  - id: quote
    label: Quote
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "2/3" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: quote-mark-open
        type: text
        z: 2
        x: 80
        y: 240
        width: 300
        height: 0
        content: { type: plain, value: "“" }
        style: { font_family: $heading, font_size: 280, font_weight: 800, color: $accent, line_height: 1, opacity: 0.18 }
      - id: quote-mark-close
        type: text
        z: 3
        x: 720
        y: 880
        width: 300
        height: 0
        content: { type: plain, value: "”" }
        style: { font_family: $heading, font_size: 280, font_weight: 800, color: $accent, line_height: 1, opacity: 0.18, text_align: right }
      - id: quote-text
        type: text
        z: 11
        x: 90
        y: 440
        width: 900
        height: 0
        content: { type: plain, value: "Feedback is a gift. The shape\nit arrives in is rarely\nthe shape it should leave in." }
        style: { font_family: $heading, font_size: 48, font_style: italic, font_weight: 700, color: $text, line_height: 1.2, text_align: center, letter_spacing: -0.01 }
      - id: attribution
        type: text
        z: 12
        x: 80
        y: 980
        width: 920
        height: 0
        content: { type: plain, value: "— SHEILA HEEN" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $text_muted, letter_spacing: 0.24, text_transform: uppercase, text_align: center }
      - id: handle
        type: text
        z: 13
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

  # ── Slide 3 · Takeaway + CTA ───────────────────────────────
  - id: takeaway
    label: Takeaway
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 0
        y: 1260
        width: 1000
        height: 0
        content: { type: plain, value: "3/3" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "THE TAKEAWAY" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: lesson
        type: text
        z: 12
        x: 80
        y: 280
        width: 920
        height: 0
        content: { type: plain, value: "Most feedback arrives blunt, badly timed, or wrapped in someone else's bad day. That's not a reason to reject it. The signal is almost always in there — your job is to do the unpacking the giver couldn't." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: cta-chip-rect
        type: rect
        z: 13
        x: 80
        y: 880
        width: 920
        height: 96
        radius: 48
        fill: { type: solid, color: "$primary" }
      - id: cta-chip-text
        type: text
        z: 14
        x: 80
        y: 906
        width: 920
        height: 0
        content: { type: plain, value: "Save → re-read on a tough day" }
        style: { font_family: $body, font_size: 24, font_weight: 700, color: "#FFFFFF", text_align: center }
      - id: handle
        type: text
        z: 15
        x: 80
        y: 1260
        width: 920
        height: 0
        content: { type: plain, value: "Follow @yourhandle for one quote a week." }
        style: { font_family: $mono, font_size: 14, color: $text_muted }

slots:
  - { id: cover_hook,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover hook line",                default: "This changed how I think\nabout feedback." }
  - { id: quote_text,    path: "pages[1].layers[5].content.value", type: text, hint: "The quote (display italic)",     default: "Feedback is a gift. The shape\nit arrives in is rarely\nthe shape it should leave in." }
  - { id: attribution,   path: "pages[1].layers[6].content.value", type: text, hint: "Attribution (small caps)",       default: "— SHEILA HEEN" }
  - { id: lesson,        path: "pages[2].layers[4].content.value", type: text, hint: "Takeaway paragraph",             default: "Most feedback arrives blunt, badly timed, or wrapped in someone else's bad day. That's not a reason to reject it. The signal is almost always in there — your job is to do the unpacking the giver couldn't." }
  - { id: cta_chip,      path: "pages[2].layers[6].content.value", type: text, hint: "CTA chip copy",                  default: "Save → re-read on a tough day" }
  - { id: cta_handle,    path: "pages[2].layers[7].content.value", type: text, hint: "Footer / handle",                default: "Follow @yourhandle for one quote a week." }
