_protocol: template/v1

# Dark cinematic thriller book cover — 2:3 portrait (1600×2400).
# Heavy noir mood: shadow-block photo placeholder, blood-red slash, oversized
# serif title bottom-left, author top-right, award strip footer.
meta:
  id: tmpl-book-cover-thriller
  name: Book Cover — Thriller
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, book, cover, thriller, cinematic, dark]
  description: "Dark cinematic thriller book cover with bold serif title and red blood-slash accent."

document:
  width: 1600
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: dark-tech
  overrides:
    primary: "#C8102E"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1600
    height: 2400
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "#05070C", position: 0 }
        - { color: "$background", position: 60 }
        - { color: "#000000", position: 100 }

  - id: shadow-block
    type: rect
    z: 5
    x: 120
    y: 320
    width: 1360
    height: 1480
    radius: 4
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "#1A1F2A", position: 0 }
        - { color: "#0A0D14", position: 100 }

  - id: shadow-block-inner
    type: rect
    z: 6
    x: 160
    y: 360
    width: 1280
    height: 1400
    radius: 2
    fill: { type: solid, color: "#06080E" }
    stroke: { color: "$border", width: 1 }

  - id: image-hint
    type: text
    z: 7
    x: 160
    y: 1020
    width: 1280
    height: 0
    content: { type: plain, value: "[ COVER IMAGE ]" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: "#22293A"
      letter_spacing: 0.4
      text_align: center
      text_transform: uppercase

  - id: author
    type: text
    z: 10
    x: 120
    y: 180
    width: 1360
    height: 0
    content: { type: plain, value: "M. R. KOVACS" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: $text
      letter_spacing: 0.32
      text_align: right
      text_transform: uppercase

  - id: author-rule
    type: rect
    z: 11
    x: 1200
    y: 260
    width: 280
    height: 3
    fill: { type: solid, color: "$primary" }

  - id: blood-slash
    type: rect
    z: 20
    x: 80
    y: 1840
    width: 980
    height: 18
    fill:
      type: linear
      angle: 90
      stops:
        - { color: "$primary", position: 0 }
        - { color: "#6B0517", position: 100 }

  - id: blood-drip
    type: rect
    z: 21
    x: 320
    y: 1858
    width: 14
    height: 60
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 25
    x: 120
    y: 1940
    width: 1360
    height: 0
    content: { type: plain, value: "A NOVEL" }
    style:
      font_family: $body
      font_size: 26
      font_weight: 700
      color: "$primary"
      letter_spacing: 0.5
      text_transform: uppercase

  - id: title-line-1
    type: text
    z: 30
    x: 120
    y: 2000
    width: 1360
    height: 0
    content: { type: plain, value: "THE LAST" }
    style:
      font_family: $heading
      font_size: 200
      font_weight: 900
      color: $text
      line_height: 0.92
      letter_spacing: -0.03
      text_transform: uppercase

  - id: title-line-2
    type: text
    z: 31
    x: 120
    y: 2180
    width: 1360
    height: 0
    content: { type: plain, value: "WITNESS" }
    style:
      font_family: $heading
      font_size: 200
      font_weight: 900
      color: "$primary"
      line_height: 0.92
      letter_spacing: -0.03
      text_transform: uppercase

  - id: footer-rule
    type: rect
    z: 40
    x: 0
    y: 2360
    width: 1600
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: tagline
    type: text
    z: 41
    x: 120
    y: 2375
    width: 1360
    height: 0
    content: { type: plain, value: "NO ONE WALKS AWAY CLEAN." }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

slots:
  - { id: author, path: "layers[4].content.value",  type: text, hint: "Author name",        default: "M. R. KOVACS" }
  - { id: title,  path: "layers[9].content.value",  type: text, hint: "Title line 1 (top)", default: "THE LAST" }
  - { id: title2, path: "layers[10].content.value", type: text, hint: "Title line 2 (bottom accent)", default: "WITNESS" }
