_protocol: template/v1

# Real estate listing flyer — A4 portrait (1240×1754).
# Hero photo top 50%, price banner, address, 4 stat cards
# (beds, baths, sqft, year), description, agent contact footer.
meta:
  id: tmpl-real-estate-listing-flyer
  name: Real Estate Listing Flyer
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, real-estate, listing, flyer, property, a4]
  description: "Editorial A4 real estate listing flyer with hero photo, price banner, key stats and agent contact."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  - id: hero-photo
    type: rect
    z: 5
    x: 0
    y: 0
    width: 1240
    height: 880
    fill:
      type: linear
      angle: 145
      stops:
        - { color: "$secondary", position: 0 }
        - { color: "#5C7A66", position: 50 }
        - { color: "#2E3D33", position: 100 }

  - id: hero-photo-hint
    type: text
    z: 6
    x: 60
    y: 430
    width: 1120
    height: 0
    content: { type: plain, value: "[ PROPERTY PHOTO ]" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 700
      color: "rgba(255,255,255,0.55)"
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: agency-eyebrow
    type: text
    z: 10
    x: 60
    y: 50
    width: 1120
    height: 0
    content: { type: plain, value: "WESTBROOK & CO · LICENSED REAL ESTATE" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: "rgba(255,255,255,0.92)"
      letter_spacing: 0.42
      text_transform: uppercase

  - id: listing-status-pill
    type: rect
    z: 11
    x: 60
    y: 100
    width: 200
    height: 44
    radius: 22
    fill: { type: solid, color: "$primary" }

  - id: listing-status
    type: text
    z: 12
    x: 60
    y: 113
    width: 200
    height: 0
    content: { type: plain, value: "FOR SALE" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: price-banner
    type: rect
    z: 20
    x: 0
    y: 880
    width: 1240
    height: 140
    fill: { type: solid, color: "$text" }

  - id: price-label
    type: text
    z: 21
    x: 60
    y: 910
    width: 600
    height: 0
    content: { type: plain, value: "LISTED AT" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: "$primary"
      letter_spacing: 0.42
      text_transform: uppercase

  - id: price
    type: text
    z: 22
    x: 60
    y: 940
    width: 600
    height: 0
    content: { type: plain, value: "$1,250,000" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: -0.02

  - id: address-label
    type: text
    z: 23
    x: 680
    y: 910
    width: 500
    height: 0
    content: { type: plain, value: "PROPERTY ADDRESS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: "$primary"
      letter_spacing: 0.42
      text_align: right
      text_transform: uppercase

  - id: address
    type: text
    z: 24
    x: 680
    y: 940
    width: 500
    height: 0
    content: { type: plain, value: "2384 Lakeshore Avenue, Burlington" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 600
      color: "#FFFFFF"
      text_align: right
      line_height: 1.25

  # Stat row
  - id: stat-card-1
    type: rect
    z: 30
    x: 60
    y: 1070
    width: 265
    height: 130
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: stat-1-value
    type: text
    z: 31
    x: 60
    y: 1095
    width: 265
    height: 0
    content: { type: plain, value: "4" }
    style:
      font_family: $heading
      font_size: 60
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1.0

  - id: stat-1-label
    type: text
    z: 32
    x: 60
    y: 1170
    width: 265
    height: 0
    content: { type: plain, value: "BEDROOMS" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "$text_muted"
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: stat-card-2
    type: rect
    z: 33
    x: 345
    y: 1070
    width: 265
    height: 130
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: stat-2-value
    type: text
    z: 34
    x: 345
    y: 1095
    width: 265
    height: 0
    content: { type: plain, value: "3" }
    style:
      font_family: $heading
      font_size: 60
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1.0

  - id: stat-2-label
    type: text
    z: 35
    x: 345
    y: 1170
    width: 265
    height: 0
    content: { type: plain, value: "BATHROOMS" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "$text_muted"
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: stat-card-3
    type: rect
    z: 36
    x: 630
    y: 1070
    width: 265
    height: 130
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: stat-3-value
    type: text
    z: 37
    x: 630
    y: 1095
    width: 265
    height: 0
    content: { type: plain, value: "2,840" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1.1

  - id: stat-3-label
    type: text
    z: 38
    x: 630
    y: 1170
    width: 265
    height: 0
    content: { type: plain, value: "SQ FT" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "$text_muted"
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: stat-card-4
    type: rect
    z: 39
    x: 915
    y: 1070
    width: 265
    height: 130
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: stat-4-value
    type: text
    z: 40
    x: 915
    y: 1095
    width: 265
    height: 0
    content: { type: plain, value: "1998" }
    style:
      font_family: $heading
      font_size: 60
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1.0

  - id: stat-4-label
    type: text
    z: 41
    x: 915
    y: 1170
    width: 265
    height: 0
    content: { type: plain, value: "YEAR BUILT" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "$text_muted"
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: description-header
    type: text
    z: 50
    x: 60
    y: 1250
    width: 1120
    height: 0
    content: { type: plain, value: "ABOUT THIS PROPERTY" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$primary"
      letter_spacing: 0.42
      text_transform: uppercase

  - id: description-rule
    type: rect
    z: 51
    x: 60
    y: 1290
    width: 80
    height: 4
    fill: { type: solid, color: "$primary" }

  - id: description
    type: text
    z: 52
    x: 60
    y: 1320
    width: 1120
    height: 0
    content: { type: plain, value: "Lakefront craftsman set on a quiet wooded lot with mature maples and a private dock. Recently updated chef's kitchen, vaulted great-room with stone fireplace, primary suite with spa bath and lake views, finished walk-out lower level, and a detached two-car garage. A rare four-season retreat fifteen minutes from downtown." }
    style:
      font_family: $body
      font_size: 19
      color: "$text"
      line_height: 1.55

  - id: agent-divider
    type: rect
    z: 60
    x: 60
    y: 1580
    width: 1120
    height: 1
    fill: { type: solid, color: "$border" }

  - id: agent-label
    type: text
    z: 61
    x: 60
    y: 1610
    width: 560
    height: 0
    content: { type: plain, value: "LISTED BY" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: "$text_muted"
      letter_spacing: 0.42
      text_transform: uppercase

  - id: agent-name
    type: text
    z: 62
    x: 60
    y: 1640
    width: 560
    height: 0
    content: { type: plain, value: "Caroline Westbrook" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 700
      color: "$text"

  - id: agent-title
    type: text
    z: 63
    x: 60
    y: 1690
    width: 560
    height: 0
    content: { type: plain, value: "Senior Listing Agent · Westbrook & Co" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"

  - id: agent-phone-label
    type: text
    z: 64
    x: 620
    y: 1610
    width: 560
    height: 0
    content: { type: plain, value: "CONTACT" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: "$text_muted"
      letter_spacing: 0.42
      text_align: right
      text_transform: uppercase

  - id: agent-phone
    type: text
    z: 65
    x: 620
    y: 1640
    width: 560
    height: 0
    content: { type: plain, value: "(802) 555-0184" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 700
      color: "$primary"
      text_align: right

  - id: agent-email
    type: text
    z: 66
    x: 620
    y: 1690
    width: 560
    height: 0
    content: { type: plain, value: "caroline@westbrookco.com" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      text_align: right

slots:
  - { id: price,        path: "layers[8].content.value",  type: text, hint: "Listing price",        default: "$1,250,000" }
  - { id: address,      path: "layers[10].content.value", type: text, hint: "Property address",     default: "2384 Lakeshore Avenue, Burlington" }
  - { id: beds,         path: "layers[12].content.value", type: text, hint: "Bedrooms count",       default: "4" }
  - { id: baths,        path: "layers[15].content.value", type: text, hint: "Bathrooms count",      default: "3" }
  - { id: sqft,         path: "layers[18].content.value", type: text, hint: "Square footage",       default: "2,840" }
  - { id: year_built,   path: "layers[21].content.value", type: text, hint: "Year built",           default: "1998" }
  - { id: description,  path: "layers[25].content.value", type: text, hint: "Listing description",  default: "Lakefront craftsman set on a quiet wooded lot with mature maples and a private dock. Recently updated chef's kitchen, vaulted great-room with stone fireplace, primary suite with spa bath and lake views, finished walk-out lower level, and a detached two-car garage. A rare four-season retreat fifteen minutes from downtown." }
  - { id: agent_name,   path: "layers[28].content.value", type: text, hint: "Agent name",           default: "Caroline Westbrook" }
  - { id: agent_phone,  path: "layers[31].content.value", type: text, hint: "Agent phone",          default: "(802) 555-0184" }
