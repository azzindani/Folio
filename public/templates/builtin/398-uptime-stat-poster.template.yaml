_protocol: template/v1

# Single-page poster · Uptime hero stat for SRE/Ops social posts.
# Big "99.99%" with 3 supporting stat cards. Synthwave aesthetic.
meta:
  id: tmpl-uptime-stat-poster
  name: Uptime Stat Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, engineering, devops, sre, uptime, cyber, 4-5]
  description: "LinkedIn 4:5 hero stat poster · uptime % + supporting metrics. Cyber synthwave."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: cyber-synthwave

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: linear, angle: 170, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }
  - { id: accent-dot, type: circle, z: 5, cx: 1130, cy: 130, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
  - { id: grid-line-1, type: rect, z: 3, x: 0, y: 1380, width: 1200, height: 1, fill: { type: solid, color: "$accent" }, opacity: 0.2 }
  - { id: grid-line-2, type: rect, z: 3, x: 0, y: 1410, width: 1200, height: 1, fill: { type: solid, color: "$accent" }, opacity: 0.14 }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "UPTIME" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase }

  - id: stat
    type: text
    z: 21
    x: 80
    y: 280
    width: 1040
    height: 0
    content: { type: plain, value: "99.99%" }
    style: { font_family: $heading, font_size: 200, font_weight: 900, color: $primary, line_height: 0.95, letter_spacing: -0.05 }

  - id: caption
    type: text
    z: 22
    x: 80
    y: 600
    width: 1040
    height: 0
    content: { type: plain, value: "Q1 2026 · 0 minutes of unplanned downtime." }
    style: { font_family: $body, font_size: 30, color: $text, line_height: 1.45 }

  - id: caption-sub
    type: text
    z: 23
    x: 80
    y: 660
    width: 1040
    height: 0
    content: { type: plain, value: "Three months. Every region. Every release." }
    style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.45 }

  - id: divider
    type: rect
    z: 10
    x: 80
    y: 800
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.25

  # ── Card 1 · Requests/sec
  - { id: card-1-bg, type: rect, z: 30, x: 80, y: 860, width: 320, height: 280, radius: 14, fill: { type: solid, color: "$surface" } }
  - { id: card-1-label, type: text, z: 31, x: 110, y: 890, width: 260, height: 0, content: { type: plain, value: "PEAK REQ/SEC" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
  - { id: card-1-value, type: text, z: 32, x: 110, y: 940, width: 260, height: 0, content: { type: plain, value: "84K" }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
  - { id: card-1-caption, type: text, z: 33, x: 110, y: 1070, width: 260, height: 0, content: { type: plain, value: "Peak sustained, 5-min window" }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.45 } }

  # ── Card 2 · Regions
  - { id: card-2-bg, type: rect, z: 30, x: 440, y: 860, width: 320, height: 280, radius: 14, fill: { type: solid, color: "$surface" } }
  - { id: card-2-label, type: text, z: 31, x: 470, y: 890, width: 260, height: 0, content: { type: plain, value: "REGIONS" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
  - { id: card-2-value, type: text, z: 32, x: 470, y: 940, width: 260, height: 0, content: { type: plain, value: "12" }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
  - { id: card-2-caption, type: text, z: 33, x: 470, y: 1070, width: 260, height: 0, content: { type: plain, value: "Active across 4 continents" }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.45 } }

  # ── Card 3 · P99 Latency
  - { id: card-3-bg, type: rect, z: 30, x: 800, y: 860, width: 320, height: 280, radius: 14, fill: { type: solid, color: "$surface" } }
  - { id: card-3-label, type: text, z: 31, x: 830, y: 890, width: 260, height: 0, content: { type: plain, value: "P99 LATENCY" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
  - { id: card-3-value, type: text, z: 32, x: 830, y: 940, width: 260, height: 0, content: { type: plain, value: "84ms" }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
  - { id: card-3-caption, type: text, z: 33, x: 830, y: 1070, width: 260, height: 0, content: { type: plain, value: "Global edge median" }, style: { font_family: $body, font_size: 15, color: $text_muted, line_height: 1.45 } }

  - id: footer-tag
    type: text
    z: 70
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "@yourhandle · #sre · #devops" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 }

  - id: footer-mark
    type: text
    z: 71
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "STATUS · LIVE" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  accent-band:
    loop: { type: pulse, duration: 2200, scale: 1.0 }
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.3 }
  stat:
    enter: { type: scale_in, duration: 900, delay: 200, easing: ease-out }
  card-1-bg:
    enter: { type: fade_up, duration: 600, delay: 400, easing: ease-out }
  card-2-bg:
    enter: { type: fade_up, duration: 600, delay: 600, easing: ease-out }
  card-3-bg:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }

slots:
  - { id: eyebrow,        path: "layers[5].content.value",  type: text, hint: "Eyebrow tag",       default: "UPTIME" }
  - { id: stat_value,     path: "layers[6].content.value",  type: text, hint: "Hero stat",         default: "99.99%" }
  - { id: caption,        path: "layers[7].content.value",  type: text, hint: "Caption line",      default: "Q1 2026 · 0 minutes of unplanned downtime." }
  - { id: caption_sub,    path: "layers[8].content.value",  type: text, hint: "Caption sub",       default: "Three months. Every region. Every release." }
  - { id: card_1_value,   path: "layers[12].content.value", type: text, hint: "Card 1 value",      default: "84K" }
  - { id: card_2_value,   path: "layers[16].content.value", type: text, hint: "Card 2 value",      default: "12" }
  - { id: card_3_value,   path: "layers[20].content.value", type: text, hint: "Card 3 value",      default: "84ms" }
  - { id: footer_tag,     path: "layers[22].content.value", type: text, hint: "Handle / hashtags", default: "@yourhandle · #sre · #devops" }
