_protocol: template/v1

# Single-page LinkedIn poster — arXiv / ML paper TLDR summary.
# Editorial layout with display serif title, TLDR callout, numbered findings.
meta:
  id: tmpl-paper-summary-poster
  name: Paper Summary Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, paper, arxiv, research, summary, portrait, 4-5]
  description: "Single-page LinkedIn poster summarizing an arXiv / ML paper — TLDR callout, 3 numbered findings, method, why-it-matters."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 14
    fill: { type: solid, color: "$primary" }

  - id: accent-rule
    type: rect
    z: 3
    x: 80
    y: 360
    width: 96
    height: 4
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 90
    width: 1040
    height: 0
    content: { type: plain, value: "PAPER · arXiv:2403.12345" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.28
      text_transform: uppercase

  - id: paper-title
    type: text
    z: 11
    x: 80
    y: 150
    width: 1040
    height: 0
    content: { type: plain, value: "Sparse Mixture Routing\nat Trillion-Parameter Scale" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 800
      color: $text
      line_height: 1.02
      letter_spacing: -0.025

  - id: authors
    type: text
    z: 12
    x: 80
    y: 400
    width: 1040
    height: 0
    content: { type: plain, value: "Smith, Patel, Tanaka · MIT, Anthropic" }
    style:
      font_family: $heading
      font_size: 24
      font_style: italic
      color: $text
      line_height: 1.3

  - id: venue
    type: text
    z: 13
    x: 80
    y: 440
    width: 1040
    height: 0
    content: { type: plain, value: "ICLR 2026 · Spotlight" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.24
      text_transform: uppercase

  - id: tldr-card
    type: rect
    z: 9
    x: 80
    y: 500
    width: 1040
    height: 200
    fill: { type: solid, color: "$surface" }
    radius: 12

  - id: tldr-eyebrow
    type: text
    z: 14
    x: 116
    y: 528
    width: 968
    height: 0
    content: { type: plain, value: "TLDR" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: tldr-text
    type: text
    z: 15
    x: 116
    y: 568
    width: 968
    height: 0
    content: { type: plain, value: "A routing trick lets sparse MoE models match dense\nquality using 38% fewer active parameters." }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 700
      font_style: italic
      color: $text
      line_height: 1.2

  - id: findings-label
    type: text
    z: 16
    x: 80
    y: 740
    width: 1040
    height: 0
    content: { type: plain, value: "KEY FINDINGS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.32
      text_transform: uppercase

  - id: find-1-num
    type: text
    z: 17
    x: 80
    y: 790
    width: 80
    height: 0
    content: { type: plain, value: "01" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: $primary
      line_height: 1.0

  - id: find-1-text
    type: text
    z: 18
    x: 170
    y: 798
    width: 950
    height: 0
    content: { type: plain, value: "Top-k routing with k=2 outperforms k=4 once experts exceed 64." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.4

  - id: find-2-num
    type: text
    z: 19
    x: 80
    y: 858
    width: 80
    height: 0
    content: { type: plain, value: "02" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: $primary
      line_height: 1.0

  - id: find-2-text
    type: text
    z: 20
    x: 170
    y: 866
    width: 950
    height: 0
    content: { type: plain, value: "Load-balance loss is unnecessary if routing temperature is tuned." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.4

  - id: find-3-num
    type: text
    z: 21
    x: 80
    y: 926
    width: 80
    height: 0
    content: { type: plain, value: "03" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: $primary
      line_height: 1.0

  - id: find-3-text
    type: text
    z: 22
    x: 170
    y: 934
    width: 950
    height: 0
    content: { type: plain, value: "Inference throughput improves 2.3× on H100 vs dense baseline." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.4

  - id: method-card
    type: rect
    z: 9
    x: 80
    y: 1010
    width: 500
    height: 200
    fill: { type: solid, color: "$surface" }
    radius: 10

  - id: method-label
    type: text
    z: 23
    x: 108
    y: 1034
    width: 444
    height: 0
    content: { type: plain, value: "METHOD" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: method-text
    type: text
    z: 24
    x: 108
    y: 1066
    width: 444
    height: 0
    content: { type: plain, value: "softmax_router(top_k=2)\ntemperature = 0.7\nexperts = 128 × 4B params" }
    style:
      font_family: $mono
      font_size: 18
      color: $text
      line_height: 1.5

  - id: matters-label
    type: text
    z: 25
    x: 620
    y: 1034
    width: 500
    height: 0
    content: { type: plain, value: "WHY IT MATTERS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.32
      text_transform: uppercase

  - id: matters-text
    type: text
    z: 26
    x: 620
    y: 1066
    width: 500
    height: 0
    content: { type: plain, value: "Practical recipe for shipping trillion-parameter models on existing hardware budgets — no new ASIC required." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.4

  - id: footer-rule
    type: rect
    z: 4
    x: 80
    y: 1340
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.4

  - id: pdf-link
    type: text
    z: 27
    x: 80
    y: 1370
    width: 500
    height: 0
    content: { type: plain, value: "arxiv.org/abs/2403.12345" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary

  - id: repo-link
    type: text
    z: 28
    x: 80
    y: 1410
    width: 500
    height: 0
    content: { type: plain, value: "github.com/sparse-moe/router" }
    style:
      font_family: $mono
      font_size: 16
      color: $text_muted

  - id: handle
    type: text
    z: 29
    x: 620
    y: 1410
    width: 500
    height: 0
    content: { type: plain, value: "@paper.notes · folio.design" }
    style:
      font_family: $mono
      font_size: 16
      color: $text_muted
      text_align: right

animations:
  paper-title:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  authors:
    enter: { type: fade_up, duration: 500, delay: 350, easing: ease-out }
  venue:
    enter: { type: fade_up, duration: 500, delay: 400, easing: ease-out }
  tldr-card:
    enter: { type: scale_in, duration: 700, delay: 600, easing: ease-out }
  tldr-text:
    enter: { type: fade_in, duration: 600, delay: 750, easing: ease-out }
  find-1-num:
    enter: { type: fade_up, duration: 500, delay: 900, easing: ease-out }
  find-1-text:
    enter: { type: fade_up, duration: 500, delay: 900, easing: ease-out }
  find-2-num:
    enter: { type: fade_up, duration: 500, delay: 1050, easing: ease-out }
  find-2-text:
    enter: { type: fade_up, duration: 500, delay: 1050, easing: ease-out }
  find-3-num:
    enter: { type: fade_up, duration: 500, delay: 1200, easing: ease-out }
  find-3-text:
    enter: { type: fade_up, duration: 500, delay: 1200, easing: ease-out }
  accent-rule:
    loop: { type: breathe, duration: 3000, scale: 1.06 }

slots:
  - { id: eyebrow,      path: "layers[3].content.value",  type: text, hint: "Paper ID eyebrow",       default: "PAPER · arXiv:2403.12345" }
  - { id: paper_title,  path: "layers[4].content.value",  type: text, hint: "Paper title (2 lines)",  default: "Sparse Mixture Routing\nat Trillion-Parameter Scale" }
  - { id: authors,      path: "layers[5].content.value",  type: text, hint: "Authors + affiliations", default: "Smith, Patel, Tanaka · MIT, Anthropic" }
  - { id: venue,        path: "layers[6].content.value",  type: text, hint: "Conference / venue",     default: "ICLR 2026 · Spotlight" }
  - { id: tldr,         path: "layers[9].content.value",  type: text, hint: "TLDR — 1 sentence",      default: "A routing trick lets sparse MoE models match dense\nquality using 38% fewer active parameters." }
  - { id: finding_1,    path: "layers[12].content.value", type: text, hint: "Finding 1",              default: "Top-k routing with k=2 outperforms k=4 once experts exceed 64." }
  - { id: finding_2,    path: "layers[14].content.value", type: text, hint: "Finding 2",              default: "Load-balance loss is unnecessary if routing temperature is tuned." }
  - { id: finding_3,    path: "layers[16].content.value", type: text, hint: "Finding 3",              default: "Inference throughput improves 2.3× on H100 vs dense baseline." }
  - { id: method,       path: "layers[19].content.value", type: text, hint: "Method (mono, 2-3 lines)", default: "softmax_router(top_k=2)\ntemperature = 0.7\nexperts = 128 × 4B params" }
  - { id: why_matters,  path: "layers[21].content.value", type: text, hint: "Why it matters",         default: "Practical recipe for shipping trillion-parameter models on existing hardware budgets — no new ASIC required." }
  - { id: pdf_link,     path: "layers[23].content.value", type: text, hint: "PDF / arXiv link",       default: "arxiv.org/abs/2403.12345" }
  - { id: repo_link,    path: "layers[24].content.value", type: text, hint: "GitHub repo",            default: "github.com/sparse-moe/router" }
  - { id: handle,       path: "layers[25].content.value", type: text, hint: "Author handle",          default: "@paper.notes · folio.design" }
