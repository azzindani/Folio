_protocol: template/v1

# Podcast channel analytics — show eyebrow, hero, 5 KPIs (downloads, subs,
# avg listens, completion %, sponsor CPM), weekly downloads trend, top
# episodes table, listener demographics bars, sponsor performance table.
meta:
  id: tmpl-podcast-metrics-report
  name: Podcast · Channel Analytics
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, podcast, audio, analytics, sponsorship, interactive]
  description: "Podcast channel report: downloads, subscriber base, episode performance, demographics, sponsor CPM."

document:
  width: 1280
  height: 2300
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

report:
  layout: scroll
  data:
    sources:
      - id: downloads_trend
        type: inline
        rows:
          - { week: W01, downloads: 184200, unique_listeners: 96400 }
          - { week: W02, downloads: 198400, unique_listeners: 102800 }
          - { week: W03, downloads: 212600, unique_listeners: 108200 }
          - { week: W04, downloads: 224800, unique_listeners: 114600 }
          - { week: W05, downloads: 238400, unique_listeners: 121400 }
          - { week: W06, downloads: 256200, unique_listeners: 128600 }
          - { week: W07, downloads: 268400, unique_listeners: 134200 }
          - { week: W08, downloads: 284600, unique_listeners: 142800 }
          - { week: W09, downloads: 296800, unique_listeners: 148600 }
          - { week: W10, downloads: 312400, unique_listeners: 156200 }
          - { week: W11, downloads: 328600, unique_listeners: 162800 }
          - { week: W12, downloads: 346200, unique_listeners: 172400 }
      - id: top_episodes
        type: inline
        rows:
          - { episode: "Ep 142: The Future of AI Coding Agents",        downloads: 284600, completion_pct: 78, rating: 4.8, release_date: "2026-03-04" }
          - { episode: "Ep 138: Interview with Patrick Collison",       downloads: 268400, completion_pct: 84, rating: 4.9, release_date: "2026-02-18" }
          - { episode: "Ep 145: How Notion Scaled to 100M Users",       downloads: 246200, completion_pct: 72, rating: 4.6, release_date: "2026-03-25" }
          - { episode: "Ep 140: The State of Open Source 2026",         downloads: 234800, completion_pct: 68, rating: 4.5, release_date: "2026-02-25" }
          - { episode: "Ep 147: Founder Stories — Anthropic",           downloads: 312400, completion_pct: 82, rating: 4.9, release_date: "2026-04-08" }
          - { episode: "Ep 136: WebAssembly Goes Mainstream",           downloads: 198400, completion_pct: 64, rating: 4.3, release_date: "2026-02-11" }
          - { episode: "Ep 144: Inside Vercel's Edge Network",          downloads: 224600, completion_pct: 74, rating: 4.7, release_date: "2026-03-18" }
          - { episode: "Ep 141: Why TypeScript Won",                    downloads: 256800, completion_pct: 76, rating: 4.7, release_date: "2026-03-01" }
          - { episode: "Ep 143: The Rise of Local-First Apps",          downloads: 218400, completion_pct: 70, rating: 4.5, release_date: "2026-03-11" }
          - { episode: "Ep 146: Building Linear — A Conversation",      downloads: 278200, completion_pct: 80, rating: 4.8, release_date: "2026-04-01" }
      - id: demographics
        type: inline
        rows:
          - { segment: "18-24",         share_pct: 14, primary_region: "North America" }
          - { segment: "25-34",         share_pct: 38, primary_region: "North America" }
          - { segment: "35-44",         share_pct: 28, primary_region: "Europe"        }
          - { segment: "45-54",         share_pct: 14, primary_region: "North America" }
          - { segment: "55+",           share_pct:  6, primary_region: "Europe"        }
