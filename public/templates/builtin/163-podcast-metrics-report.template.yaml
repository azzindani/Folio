        type: inline
        rows:
          - { sponsor: "Linear",           episodes: 8, cpm: 42, clicks:  8420, conversion_pct: 3.2 }
          - { sponsor: "Vercel",           episodes: 6, cpm: 48, clicks:  6840, conversion_pct: 4.1 }
          - { sponsor: "Stripe",           episodes: 4, cpm: 52, clicks:  5260, conversion_pct: 5.6 }
          - { sponsor: "Raycast",          episodes: 5, cpm: 38, clicks:  4180, conversion_pct: 2.8 }
          - { sponsor: "Sentry",           episodes: 7, cpm: 36, clicks:  5840, conversion_pct: 3.4 }
          - { sponsor: "Cloudflare",       episodes: 3, cpm: 44, clicks:  3240, conversion_pct: 3.8 }

pages:
  - id: analytics
    label: Analytics
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "THE CHANGELOG · Q1 2026 · CHANNEL ANALYTICS"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 32
        font_weight: 700
        line_height: 1.15
        content: "**Channel Analytics — Q1 2026**\n*Downloads, subscriber growth, episode performance, and listener demographics.*"

      - id: kpi-downloads
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Total Downloads
        value: 3284600
        format: number
        delta: 24.8
        delta_format: percent
        sparkline_data: downloads_trend
        sparkline_field: downloads
        sparkline_color: "$primary"

      - id: kpi-subs
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Subscribers
        value: 482400
        format: number
        delta: 18.2
        delta_format: percent

      - id: kpi-listens
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Avg Episode Listens
        value: 142800
        format: number
        delta: 12.6
        delta_format: percent

      - id: kpi-completion
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Listen-Through %
        value: 74.2
        format: percent
        delta: 3.8
        delta_format: percent

      - id: kpi-cpm
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Sponsor CPM
        value: 42
        format: currency
        currency: USD
        delta: 14.2
        delta_format: percent

      - id: section-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Weekly Downloads — Last 12 Weeks**"

      - id: chart-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 380
        chart_type: line
        data_ref: downloads_trend
        x_field: week
        y_field: downloads
        title: Total Downloads vs Unique Listeners
        legend: true
        grid: true
        animate: true

      - id: section-episodes
        type: rich_text
        x: 60
        y: 880
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top 10 Episodes — Quarterly**"

      - id: tbl-episodes
        type: interactive_table
        x: 60
        y: 940
        width: 1160
        height: 540
        data_ref: top_episodes
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: episode,         title: Episode,         width: 460, sortable: true }
          - { field: downloads,       title: Downloads,       width: 180, sortable: true, formatter: number,  align: right }
          - { field: completion_pct,  title: Completion %,    width: 180, sortable: true, formatter: percent, align: right }
          - { field: rating,          title: Rating,          width: 140, sortable: true, formatter: number,  align: right }
          - { field: release_date,    title: Released,        width: 200, sortable: true }

      - id: section-demographics
        type: rich_text
        x: 60
        y: 1520
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Listener Demographics — Age Group**"

      - id: chart-demographics
        type: interactive_chart
        x: 60
        y: 1580
        width: 1160
        height: 320
        chart_type: bar
        data_ref: demographics
        x_field: segment
        y_field: share_pct
        title: Audience Share by Age Bracket (%)
        legend: false
        grid: true
        animate: true

      - id: section-sponsors
        type: rich_text
        x: 60
        y: 1940
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Sponsor Performance — Active Partners**"

      - id: tbl-sponsors
        type: interactive_table
        x: 60
        y: 2000
        width: 1160
        height: 280
        data_ref: sponsors
        pagination: false
        filterable: false
        exportable: true
        columns:
          - { field: sponsor,         title: Sponsor,         width: 280, sortable: true, formatter: badge }
          - { field: episodes,        title: Episodes,        width: 180, sortable: true, formatter: number,  align: right }
          - { field: cpm,             title: CPM USD,         width: 180, sortable: true, formatter: currency, align: right }
          - { field: clicks,          title: Clicks,          width: 200, sortable: true, formatter: number,  align: right }
          - { field: conversion_pct,  title: Conversion %,    width: 240, sortable: true, formatter: percent, align: right }

slots:
  - { id: report_title,           path: "pages[0].layers[1].content",  type: text, hint: "Report title",          default: "**Channel Analytics — Q1 2026**\n*Downloads, subscriber growth, episode performance, listener mix, and sponsor results.*" }
  - { id: report_eyebrow,         path: "pages[0].layers[0].content",  type: text, hint: "Show eyebrow",          default: "THE CHANGELOG · Q1 2026 · CHANNEL ANALYTICS" }
  - { id: trend_section,          path: "pages[0].layers[7].content",  type: text, hint: "Trend heading",         default: "**Weekly Downloads — Last 12 Weeks**" }
  - { id: episodes_section,       path: "pages[0].layers[9].content",  type: text, hint: "Episodes heading",      default: "**Top 10 Episodes — Quarterly**" }
  - { id: demographics_section,   path: "pages[0].layers[11].content", type: text, hint: "Demographics heading",  default: "**Listener Demographics — Age Group**" }
  - { id: sponsors_section,       path: "pages[0].layers[13].content", type: text, hint: "Sponsors heading",      default: "**Sponsor Performance — Active Partners**" }
