_protocol: template/v1

# Meditation session card — 1080×1350 portrait, pastel-dream theme.
# Practice name top, duration huge, 4-phase breakdown row,
# concentric breath-cycle icon, affirmation quote bottom.
meta:
  id: tmpl-meditation-timer-card
  name: Meditation Timer Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [meditation, mindfulness, wellness, timer, card, pastel]
  description: "Meditation session card with practice name, duration, 4-phase split, breath-cycle icon, and affirmation."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1350
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # ── Soft halo at top ──────────────────────────────────────
  - id: halo
    type: circle
    z: 2
    cx: 540
    cy: 80
    rx: 480
    ry: 280
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.35

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 80
    width: 920
    height: 0
    content: { type: plain, value: "GUIDED PRACTICE" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.48
      text_align: center
      text_transform: uppercase

  # ── Practice name ─────────────────────────────────────────
  - id: practice-name
    type: text
    z: 11
    x: 80
    y: 120
    width: 920
    height: 0
    content: { type: plain, value: "Mindful Breathing" }
    style:
      font_family: $heading
      font_size: 60
      font_weight: 700
      color: $text
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01
      font_style: italic

  # ── Breath-cycle concentric circles ───────────────────────
  - id: breath-c1
    type: circle
    z: 20
    cx: 540
    cy: 470
    rx: 220
    ry: 220
    fill: { type: solid, color: "$primary" }
    opacity: 0.08

  - id: breath-c2
    type: circle
    z: 21
    cx: 540
    cy: 470
    rx: 170
    ry: 170
    fill: { type: solid, color: "$primary" }
    opacity: 0.14

  - id: breath-c3
    type: circle
    z: 22
    cx: 540
    cy: 470
    rx: 120
    ry: 120
    fill: { type: solid, color: "$primary" }
    opacity: 0.24

  - id: breath-c4
    type: circle
    z: 23
    cx: 540
    cy: 470
    rx: 70
    ry: 70
    fill: { type: solid, color: "$primary" }
    opacity: 0.45

  # ── Duration (huge) ───────────────────────────────────────
  - id: duration-value
    type: text
    z: 30
    x: 80
    y: 425
    width: 920
    height: 0
    content: { type: plain, value: "20" }
    style:
      font_family: $heading
      font_size: 160
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1
      letter_spacing: -0.04

  - id: duration-unit
    type: text
    z: 31
    x: 80
    y: 585
    width: 920
    height: 0
    content: { type: plain, value: "MIN" }
    style:
      font_family: $body
      font_size: 24
      font_weight: 700
      color: $primary
      letter_spacing: 0.48
      text_align: center
      text_transform: uppercase

  # ── 4-phase breakdown ─────────────────────────────────────
  - id: phases-header
    type: text
    z: 40
    x: 80
    y: 720
    width: 920
    height: 0
    content: { type: plain, value: "SESSION FLOW" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.4
      text_align: center
      text_transform: uppercase

  - id: phases-rule
    type: rect
    z: 41
    x: 280
    y: 760
    width: 520
    height: 1
    fill: { type: solid, color: "$border" }

  # Phase 1
  - id: p1-dot
    type: circle
    z: 42
    cx: 130
    cy: 810
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: p1-name
    type: text
    z: 43
    x: 170
    y: 798
    width: 540
    height: 0
    content: { type: plain, value: "Settle  ·  arrive in the body" }
    style: { font_family: $body, font_size: 22, font_weight: 600, color: $text, line_height: 1.3 }

  - id: p1-time
    type: text
    z: 44
    x: 80
    y: 800
    width: 920
    height: 0
    content: { type: plain, value: "2 min" }
    style: { font_family: $mono, font_size: 20, color: $text_muted, text_align: right, line_height: 1.3 }

  # Phase 2
  - id: p2-dot
    type: circle
    z: 45
    cx: 130
    cy: 870
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: p2-name
    type: text
    z: 46
    x: 170
    y: 858
    width: 540
    height: 0
    content: { type: plain, value: "Breathe  ·  4–7–8 cycles" }
    style: { font_family: $body, font_size: 22, font_weight: 600, color: $text, line_height: 1.3 }

  - id: p2-time
    type: text
    z: 47
    x: 80
    y: 860
    width: 920
    height: 0
    content: { type: plain, value: "8 min" }
    style: { font_family: $mono, font_size: 20, color: $text_muted, text_align: right, line_height: 1.3 }

  # Phase 3
  - id: p3-dot
    type: circle
    z: 48
    cx: 130
    cy: 930
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: p3-name
    type: text
    z: 49
    x: 170
    y: 918
    width: 540
    height: 0
    content: { type: plain, value: "Observe  ·  notice without judgment" }
    style: { font_family: $body, font_size: 22, font_weight: 600, color: $text, line_height: 1.3 }

  - id: p3-time
    type: text
    z: 50
    x: 80
    y: 920
    width: 920
    height: 0
    content: { type: plain, value: "8 min" }
    style: { font_family: $mono, font_size: 20, color: $text_muted, text_align: right, line_height: 1.3 }

  # Phase 4
  - id: p4-dot
    type: circle
    z: 51
    cx: 130
    cy: 990
    rx: 10
    ry: 10
    fill: { type: solid, color: "$primary" }

  - id: p4-name
    type: text
    z: 52
    x: 170
    y: 978
    width: 540
    height: 0
    content: { type: plain, value: "Close  ·  intention for the day" }
    style: { font_family: $body, font_size: 22, font_weight: 600, color: $text, line_height: 1.3 }

  - id: p4-time
    type: text
    z: 53
    x: 80
    y: 980
    width: 920
    height: 0
    content: { type: plain, value: "2 min" }
    style: { font_family: $mono, font_size: 20, color: $text_muted, text_align: right, line_height: 1.3 }

  # ── Affirmation block ─────────────────────────────────────
  - id: aff-rule
    type: rect
    z: 60
    x: 280
    y: 1080
    width: 520
    height: 1
    fill: { type: solid, color: "$border" }

  - id: aff-eyebrow
    type: text
    z: 61
    x: 80
    y: 1110
    width: 920
    height: 0
    content: { type: plain, value: "AFFIRMATION" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 800
      color: $primary
      letter_spacing: 0.4
      text_align: center
      text_transform: uppercase

  - id: affirmation
    type: text
    z: 62
    x: 80
    y: 1150
    width: 920
    height: 0
    content: { type: plain, value: "I meet this moment with breath, not resistance." }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 500
      color: $text
      text_align: center
      font_style: italic
      line_height: 1.4

  # ── Footer ────────────────────────────────────────────────
  - id: footer
    type: text
    z: 70
    x: 80
    y: 1280
    width: 920
    height: 0
    content: { type: plain, value: "still.app  ·  guided by Naoko Yamamoto" }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted
      text_align: center
      line_height: 1.3

slots:
  - { id: practice_name,     path: "layers[3].content.value",  type: text, hint: "Practice name",            default: "Mindful Breathing" }
  - { id: duration_minutes,  path: "layers[8].content.value",  type: text, hint: "Duration (minutes)",       default: "20" }
  - { id: affirmation,       path: "layers[26].content.value", type: text, hint: "Affirmation quote",        default: "I meet this moment with breath, not resistance." }
