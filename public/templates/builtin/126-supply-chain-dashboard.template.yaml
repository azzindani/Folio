_protocol: template/v1

# Supply chain operations — eyebrow, hero, 5 KPIs (orders fulfilled, on-time %,
# inventory turns, lead time, stockouts), 12-month shipment line, supplier-perf
# table, warehouse utilization bar, inventory aging table.
meta:
  id: tmpl-supply-chain-dashboard-report
  name: Supply Chain · Operations
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, supply-chain, logistics, operations, suppliers, warehouse, interactive]
  description: "Supply chain operations dashboard: order fulfillment, supplier performance, warehouse utilization, inventory aging."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

report:
  layout: scroll
  data:
    sources:
      - id: shipment_trend
        type: inline
        rows:
          - { month: Jun, shipments: 18420, target: 18000 }
          - { month: Jul, shipments: 19280, target: 18500 }
          - { month: Aug, shipments: 20140, target: 19000 }
          - { month: Sep, shipments: 21480, target: 19500 }
          - { month: Oct, shipments: 23620, target: 20000 }
          - { month: Nov, shipments: 28840, target: 24000 }
          - { month: Dec, shipments: 31260, target: 26000 }
          - { month: Jan, shipments: 19840, target: 19000 }
          - { month: Feb, shipments: 20640, target: 19500 }
          - { month: Mar, shipments: 22480, target: 20000 }
          - { month: Apr, shipments: 23280, target: 20500 }
          - { month: May, shipments: 24180, target: 21000 }
      - id: suppliers
        type: inline
        rows:
          - { supplier: Foxconn Components,        orders: 1842, on_time_pct: 96.4, quality_pct: 98.2, cost_variance: -2.4 }
          - { supplier: Bosch Industrial,          orders: 1284, on_time_pct: 94.2, quality_pct: 97.6, cost_variance:  1.8 }
          - { supplier: Maersk Logistics,          orders:  864, on_time_pct: 88.6, quality_pct: 95.4, cost_variance:  4.2 }
          - { supplier: 3M Materials,              orders:  742, on_time_pct: 92.8, quality_pct: 98.8, cost_variance: -1.2 }
          - { supplier: Schneider Electric,        orders:  618, on_time_pct: 91.4, quality_pct: 96.2, cost_variance:  2.6 }
          - { supplier: Honeywell Sensors,         orders:  486, on_time_pct: 89.2, quality_pct: 94.8, cost_variance:  6.4 }
          - { supplier: Siemens Drives,            orders:  442, on_time_pct: 95.6, quality_pct: 97.4, cost_variance: -0.8 }
          - { supplier: Flex Manufacturing,        orders:  398, on_time_pct: 86.4, quality_pct: 93.2, cost_variance:  8.2 }
          - { supplier: TE Connectivity,           orders:  324, on_time_pct: 93.8, quality_pct: 96.8, cost_variance:  1.4 }
          - { supplier: Jabil Circuit,             orders:  286, on_time_pct: 84.2, quality_pct: 92.4, cost_variance:  9.6 }
      - id: warehouses
        type: inline
        rows:
          - { warehouse: Memphis DC,        utilization_pct: 88.4 }
          - { warehouse: Reno DC,           utilization_pct: 76.2 }
          - { warehouse: Allentown DC,      utilization_pct: 92.6 }
          - { warehouse: Dallas DC,         utilization_pct: 84.8 }
          - { warehouse: Atlanta DC,        utilization_pct: 81.2 }
          - { warehouse: Columbus DC,       utilization_pct: 78.6 }
          - { warehouse: Phoenix DC,        utilization_pct: 72.4 }
          - { warehouse: Newark DC,         utilization_pct: 94.8 }
      - id: inventory_aging
        type: inline
        rows:
          - { bucket: 0-30 days,    units: 142800, value: 4280000, turns: 12.4 }
          - { bucket: 31-60 days,   units:  86400, value: 2680000, turns:  6.2 }
          - { bucket: 61-90 days,   units:  42600, value: 1480000, turns:  3.8 }
          - { bucket: 91-180 days,  units:  18400, value:  742000, turns:  1.6 }
          - { bucket: 180+ days,    units:   6200, value:  286000, turns:  0.4 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "GLOBAL LOGISTICS · NORTH AMERICA REGION · MAY 2026"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 100
        format: markdown
        font_family: Playfair Display
        font_size: 44
        font_weight: 700
        line_height: 1.15
        content: "**Supply Chain Operations — Monthly Review**\n*Fulfillment, supplier health, warehouse capacity, and inventory aging.*"

      - id: kpi-orders
        type: kpi_card
        x: 60
        y: 210
        width: 224
        height: 140
        label: Orders Fulfilled
        value: 24180
        format: number
        delta: 8.4
        delta_format: percent
        sparkline_data: shipment_trend
        sparkline_field: shipments
        sparkline_color: "$primary"

      - id: kpi-ontime
        type: kpi_card
        x: 304
        y: 210
        width: 224
        height: 140
        label: On-Time Delivery %
        value: 92.4
        format: percent
        delta: 1.6
        delta_format: percent

      - id: kpi-turns
        type: kpi_card
        x: 548
        y: 210
        width: 224
        height: 140
        label: Inventory Turns
        value: 8.6
        format: number
        decimals: 1
        delta: 0.4
        delta_format: number

      - id: kpi-leadtime
        type: kpi_card
        x: 792
        y: 210
        width: 224
        height: 140
        label: Lead Time (days)
        value: 18.4
        format: number
        decimals: 1
        delta: -1.2
        delta_format: percent

      - id: kpi-stockouts
        type: kpi_card
        x: 1036
        y: 210
        width: 184
        height: 140
        label: Stockouts
        value: 142
        format: number
        delta: -24
        delta_format: number

      - id: section-shipments
        type: rich_text
        x: 60
        y: 390
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Shipment Volume — Last 12 Months**"

      - id: chart-shipments
        type: interactive_chart
        x: 60
        y: 450
        width: 1160
        height: 380
        chart_type: line
        data_ref: shipment_trend
        x_field: month
        y_field: shipments
        title: Monthly Shipments vs Target
        legend: true
        grid: true
        animate: true

      - id: section-suppliers
        type: rich_text
        x: 60
        y: 870
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Supplier Performance**"

      - id: tbl-suppliers
        type: interactive_table
        x: 60
        y: 930
        width: 1160
        height: 480
        data_ref: suppliers
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: supplier,        title: Supplier,        width: 320, sortable: true, formatter: badge }
          - { field: orders,          title: Orders,          width: 180, sortable: true, formatter: number,  align: right }
          - { field: on_time_pct,     title: On-Time %,       width: 200, sortable: true, formatter: percent, align: right }
          - { field: quality_pct,     title: Quality %,       width: 200, sortable: true, formatter: percent, align: right }
          - { field: cost_variance,   title: Cost Variance %, width: 260, sortable: true, formatter: delta,   align: right }

      - id: section-warehouses
        type: rich_text
        x: 60
        y: 1450
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Warehouse Utilization**"

      - id: chart-warehouses
        type: interactive_chart
        x: 60
        y: 1510
        width: 1160
        height: 360
        chart_type: bar
        data_ref: warehouses
        x_field: warehouse
        y_field: utilization_pct
        title: Capacity Utilization % by Distribution Center
        legend: false
        grid: true
        animate: true

      - id: section-aging
        type: rich_text
        x: 60
        y: 1910
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Inventory Aging**"

      - id: tbl-aging
        type: interactive_table
        x: 60
        y: 1970
        width: 1160
        height: 320
        data_ref: inventory_aging
        pagination: false
        filterable: false
        exportable: true
        columns:
          - { field: bucket,  title: Age Bucket,    width: 340, sortable: true, formatter: badge }
          - { field: units,   title: Units,         width: 260, sortable: true, formatter: number,   align: right }
          - { field: value,   title: Value (USD),   width: 280, sortable: true, formatter: currency, align: right }
          - { field: turns,   title: Turns / yr,    width: 280, sortable: true, formatter: number,   align: right }

slots:
  - { id: report_title,       path: "pages[0].layers[1].content",  type: text, hint: "Report title",        default: "**Supply Chain Operations — Monthly Review**\n*Fulfillment, supplier health, warehouse capacity, and inventory aging.*" }
  - { id: report_eyebrow,     path: "pages[0].layers[0].content",  type: text, hint: "Region eyebrow",      default: "GLOBAL LOGISTICS · NORTH AMERICA REGION · MAY 2026" }
  - { id: shipments_section,  path: "pages[0].layers[7].content",  type: text, hint: "Shipments heading",   default: "**Shipment Volume — Last 12 Months**" }
  - { id: suppliers_section,  path: "pages[0].layers[9].content",  type: text, hint: "Suppliers heading",   default: "**Supplier Performance**" }
  - { id: warehouses_section, path: "pages[0].layers[11].content", type: text, hint: "Warehouses heading",  default: "**Warehouse Utilization**" }
  - { id: aging_section,      path: "pages[0].layers[13].content", type: text, hint: "Aging heading",       default: "**Inventory Aging**" }
