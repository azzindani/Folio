_protocol: template/v1

# Airline boarding pass — 1800×700 landscape, corporate-slate theme.
# Main body left ~75% with airline name + flight number top, passenger
# name big, big FROM → TO airport codes with arrow, gate/seat/boarding
# blocks beneath. Perforated stub right ~25% with rotated label,
# seat repeat, and barcode placeholder.
meta:
  id: tmpl-boarding-pass
  name: Boarding Pass
  type: ticket
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [ticket, boarding-pass, airline, travel, landscape]
  description: "Airline boarding pass with flight, passenger, from/to airport codes, gate, seat, and barcode stub."

document:
  width: 1800
  height: 700
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1800
    height: 700
    fill: { type: solid, color: "$background" }

  - id: main-card
    type: rect
    z: 1
