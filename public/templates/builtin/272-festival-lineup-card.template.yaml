    content: { type: plain, value: "EAST TENT" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 800
      color: $text
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: stage-west
    type: rect
    z: 66
    x: 740
    y: 1540
    width: 200
    height: 80
    fill: { type: solid, color: "$secondary" }
    opacity: 0.4

  - id: stage-west-label
    type: text
    z: 67
    x: 740
    y: 1568
    width: 200
    height: 0
    content: { type: plain, value: "WEST DOCK" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 800
      color: $text
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: footer-rule
    type: rect
    z: 70
    x: 80
    y: 1800
    width: 920
    height: 1
    fill: { type: solid, color: "$text" }
    opacity: 0.5

  - id: footer
    type: text
    z: 71
    x: 80
    y: 1830
    width: 920
    height: 0
    content: { type: plain, value: "TICKETS · MIDNIGHTBLOOM.FEST · 3-DAY PASSES FROM €189" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $text
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

slots:
  - { id: festival_name, path: "layers[4].content.value",  type: text, hint: "Festival name",       default: "MIDNIGHT BLOOM FEST" }
  - { id: dates,         path: "layers[5].content.value",  type: text, hint: "Date range + city",   default: "JULY 12–14 · 2026 · LISBON" }
  - { id: headliner_1,   path: "layers[8].content.value",  type: text, hint: "Headliner 1",         default: "AURORA KIN" }
  - { id: headliner_2,   path: "layers[9].content.value",  type: text, hint: "Headliner 2",         default: "SONORA ECHO" }
  - { id: headliner_3,   path: "layers[10].content.value", type: text, hint: "Headliner 3",         default: "FÉLIX SAINT-CLAIR" }
