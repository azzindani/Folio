_protocol: template/v1

# Festival lineup announcement (1080×1920 portrait, IG-Story scale).
# Sunset-glow: festival name + dates eyebrow, LINEUP headline,
# 3-tier artists (headliners HUGE, mid medium, support small), stage map, footer.
meta:
  id: tmpl-festival-lineup-card
  name: Festival Lineup Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, festival, lineup, music, concert, story, portrait]
  description: "Tiered festival lineup announcement with headliners, mid-tier, and support."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$background", position: 50 }
        - { color: "$secondary", position: 100 }

  - id: bg-overlay
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }
    opacity: 0.55

  - id: sun-glow
    type: circle
    z: 2
    cx: 540
    cy: 280
    rx: 360
    ry: 360
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.7

  - id: top-rule
    type: rect
    z: 5
    x: 80
    y: 140
    width: 920
    height: 1
    fill: { type: solid, color: "$text" }
    opacity: 0.5

  - id: festival-name
    type: text
    z: 10
    x: 80
    y: 100
    width: 920
    height: 0
    content: { type: plain, value: "MIDNIGHT BLOOM FEST" }
    style:
      font_family: $mono
      font_size: 20
      font_weight: 800
      color: $text
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: dates
    type: text
    z: 11
    x: 80
    y: 160
    width: 920
    height: 0
    content: { type: plain, value: "JULY 12–14 · 2026 · LISBON" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: lineup-headline
    type: text
    z: 20
    x: 80
    y: 280
    width: 920
    height: 0
    content: { type: plain, value: "LINEUP" }
    style:
      font_family: $heading
      font_size: 200
      font_weight: 900
      color: $text
      line_height: 0.92
      letter_spacing: -0.04
      text_align: center
      text_transform: uppercase

  - id: tier-1-rule
    type: rect
    z: 25
    x: 280
    y: 500
    width: 520
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: headliner-1
    type: text
    z: 30
    x: 80
    y: 540
    width: 920
    height: 0
    content: { type: plain, value: "AURORA KIN" }
    style:
      font_family: $heading
      font_size: 92
      font_weight: 900
      color: $text
      line_height: 1.0
      letter_spacing: -0.02
      text_align: center
      text_transform: uppercase

  - id: headliner-2
    type: text
    z: 31
    x: 80
    y: 640
    width: 920
    height: 0
    content: { type: plain, value: "SONORA ECHO" }
    style:
      font_family: $heading
      font_size: 92
      font_weight: 900
      color: $primary
      line_height: 1.0
      letter_spacing: -0.02
      text_align: center
      text_transform: uppercase

  - id: headliner-3
    type: text
    z: 32
    x: 80
    y: 740
    width: 920
    height: 0
    content: { type: plain, value: "FÉLIX SAINT-CLAIR" }
    style:
      font_family: $heading
      font_size: 92
      font_weight: 900
      color: $text
      line_height: 1.0
      letter_spacing: -0.02
      text_align: center
      text_transform: uppercase

  - id: tier-2-rule
    type: rect
    z: 35
    x: 340
    y: 880
    width: 400
    height: 1
    fill: { type: solid, color: "$text" }
    opacity: 0.5

  - id: midtier
    type: text
    z: 40
    x: 80
    y: 920
    width: 920
    height: 0
    content: { type: plain, value: "RIVER COBALT · OLAYA RIOS · NORTHWAY · KOPI LUWAK" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $text
      line_height: 1.25
      letter_spacing: 0.01
      text_align: center
      text_transform: uppercase

  - id: midtier-2
    type: text
    z: 41
    x: 80
    y: 970
    width: 920
    height: 0
    content: { type: plain, value: "BLOND APE · DEEP MERIDIAN · LANTERN BOY · MERA" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $text
      line_height: 1.25
      letter_spacing: 0.01
      text_align: center
      text_transform: uppercase

  - id: tier-3-rule
    type: rect
    z: 45
    x: 380
    y: 1110
    width: 320
    height: 1
    fill: { type: solid, color: "$text" }
    opacity: 0.4

  - id: support
    type: text
    z: 50
    x: 80
    y: 1140
    width: 920
    height: 0
    content: { type: plain, value: "CIRCA · TIDAL FERRY · KIN UP NORTH · OWL EYE · COTTON FOG · GLINT" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text_muted
      line_height: 1.6
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: support-2
    type: text
    z: 51
    x: 80
    y: 1180
    width: 920
    height: 0
    content: { type: plain, value: "PORTRAIT MODE · IRIS FALL · HALF MOON HIGH · NUEVO PARQUE · ZÉ MARI" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text_muted
      line_height: 1.6
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: stage-map-frame
    type: rect
    z: 60
    x: 80
    y: 1300
    width: 920
    height: 420
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }

  - id: stage-map-eyebrow
    type: text
    z: 61
    x: 80
    y: 1330
    width: 920
    height: 0
    content: { type: plain, value: "STAGE MAP" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: stage-main
    type: rect
    z: 62
    x: 380
    y: 1380
    width: 320
    height: 100
    fill: { type: solid, color: "$primary" }
