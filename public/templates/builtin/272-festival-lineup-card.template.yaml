      font_weight: 800
      color: $text
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: stage-east
    type: rect
    z: 64
    x: 140
    y: 1540
    width: 200
    height: 80
    fill: { type: solid, color: "$secondary" }
    opacity: 0.4

  - id: stage-east-label
    type: text
    z: 65
    x: 140
    y: 1568
