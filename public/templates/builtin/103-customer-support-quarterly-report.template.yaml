_protocol: template/v1

# Customer support quarterly — 5 KPIs (tickets, CSAT, FRT, resolution, backlog),
# ticket-volume trend line, category donut, top-issues table, channel bar,
# agent leaderboard. Single-page scroll.
meta:
  id: tmpl-customer-support-report
  name: Customer Support · Quarterly
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, support, csat, tickets, agents, interactive]
  description: "Quarterly support review: volume, CSAT, response & resolution times, channels, top issues, agent leaderboard."

document:
  width: 1280
  height: 2300
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

report:
  layout: scroll
  data:
    sources:
      - id: volume_trend
        type: inline
        rows:
          - { week: W1,  tickets: 4280, resolved: 4128 }
          - { week: W2,  tickets: 4420, resolved: 4302 }
          - { week: W3,  tickets: 4180, resolved: 4044 }
          - { week: W4,  tickets: 4640, resolved: 4486 }
          - { week: W5,  tickets: 4820, resolved: 4612 }
          - { week: W6,  tickets: 5120, resolved: 4848 }
          - { week: W7,  tickets: 4980, resolved: 4762 }
          - { week: W8,  tickets: 5240, resolved: 5044 }
          - { week: W9,  tickets: 5480, resolved: 5286 }
          - { week: W10, tickets: 5320, resolved: 5128 }
          - { week: W11, tickets: 5680, resolved: 5402 }
          - { week: W12, tickets: 5840, resolved: 5612 }
          - { week: W13, tickets: 5620, resolved: 5468 }
      - id: categories
        type: inline
        rows:
          - { category: Billing & Payments,    tickets: 14820, share_pct: 22.4 }
          - { category: Account & Access,      tickets: 12840, share_pct: 19.4 }
          - { category: Product Bug Reports,   tickets: 11240, share_pct: 17.0 }
          - { category: How-To & Onboarding,   tickets:  9620, share_pct: 14.5 }
          - { category: Integrations,          tickets:  8240, share_pct: 12.5 }
          - { category: Feature Requests,      tickets:  9420, share_pct: 14.2 }
      - id: top_issues
        type: inline
        rows:
          - { issue: "Two-factor reset loop",           tickets: 1842, avg_resolution_h:  4.2, csat: 78 }
          - { issue: "Stripe webhook timing out",       tickets: 1486, avg_resolution_h:  8.6, csat: 64 }
          - { issue: "Export to PDF blank pages",       tickets: 1284, avg_resolution_h: 12.4, csat: 58 }
          - { issue: "Slack integration disconnects",   tickets: 1124, avg_resolution_h:  6.2, csat: 71 }
          - { issue: "SSO with Okta provisioning",      tickets:  982, avg_resolution_h: 14.8, csat: 62 }
          - { issue: "Mobile app crash on launch",      tickets:  864, avg_resolution_h:  3.6, csat: 81 }
          - { issue: "Duplicate charge dispute",        tickets:  742, avg_resolution_h: 18.4, csat: 54 }
          - { issue: "API rate-limit confusion",        tickets:  684, avg_resolution_h:  2.8, csat: 84 }
          - { issue: "Cannot delete archived workspace", tickets: 612, avg_resolution_h:  5.4, csat: 72 }
          - { issue: "Email digests not arriving",      tickets:  548, avg_resolution_h:  9.2, csat: 67 }
      - id: channels
        type: inline
        rows:
          - { channel: Email,        tickets: 38420, csat: 84.2, frt_min:  58 }
          - { channel: Live Chat,    tickets: 18240, csat: 91.4, frt_min:   4 }
          - { channel: Phone,        tickets:  6820, csat: 88.6, frt_min:   2 }
          - { channel: Community,    tickets:  2480, csat: 78.4, frt_min: 184 }
      - id: agents
        type: inline
        rows:
          - { agent: Aisha Okonkwo,      tickets: 1842, csat: 94.6, avg_resolution_h:  3.8 }
          - { agent: Diego Hernández,    tickets: 1728, csat: 93.2, avg_resolution_h:  4.2 }
          - { agent: Hana Müller,        tickets: 1684, csat: 91.8, avg_resolution_h:  4.4 }
          - { agent: Liam O'Connor,      tickets: 1562, csat: 92.4, avg_resolution_h:  4.6 }
          - { agent: Priya Raghavan,     tickets: 1486, csat: 90.6, avg_resolution_h:  5.1 }
          - { agent: Yuki Tanaka,        tickets: 1428, csat: 89.8, avg_resolution_h:  5.4 }
          - { agent: Sofia Costa,        tickets: 1342, csat: 88.4, avg_resolution_h:  5.8 }
          - { agent: Noah Bergström,     tickets: 1284, csat: 87.2, avg_resolution_h:  6.2 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: $mono
        font_size: 12
        font_weight: 600
        color: "$primary"
        letter_spacing: 1
        content: "SUPPORT OPS · Q2 FY2026 · GLOBAL"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 88
        format: markdown
        font_family: Playfair Display
        font_size: 66
        font_weight: 800
        line_height: 1.0
        letter_spacing: -0.02
        content: "**Customer Support — Quarterly Review**"

      - id: kpi-tickets
        type: kpi_card
        x: 60
        y: 180
        width: 224
        height: 140
        label: Total Tickets
        value: 66180
        format: number
        delta: 12.4
        delta_format: percent
        sparkline_data: volume_trend
        sparkline_field: tickets
        sparkline_color: "$primary"

      - id: kpi-csat
        type: kpi_card
        x: 304
        y: 180
        width: 224
        height: 140
        label: CSAT
        value: 86.4
        format: percent
        delta: 2.1
        delta_format: percent

      - id: kpi-frt
        type: kpi_card
        x: 548
        y: 180
        width: 224
        height: 140
        label: Avg First Response
        value: 38
        format: number
        decimals: 0
        delta: -14.2
        delta_format: percent

      - id: kpi-resolution
        type: kpi_card
        x: 792
        y: 180
        width: 224
        height: 140
        label: Avg Resolution (h)
        value: 8.6
        format: number
        decimals: 1
        delta: -8.4
        delta_format: percent

      - id: kpi-backlog
        type: kpi_card
        x: 1036
        y: 180
        width: 184
        height: 140
        label: Open Backlog
        value: 642
        format: number
        delta: -18.2
        delta_format: percent

      - id: section-volume
        type: rich_text
        x: 60
        y: 360
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        line_height: 1.06
        letter_spacing: -0.02
        content: "**Ticket Volume — Last 13 Weeks**"

      - id: chart-volume
        type: interactive_chart
        x: 60
        y: 420
        width: 760
        height: 360
        chart_type: line
        data_ref: volume_trend
        x_field: week
        y_field: tickets
        title: Tickets Created vs Resolved
        legend: true
        grid: true
        animate: true

      - id: chart-categories
        type: interactive_chart
        x: 840
        y: 420
        width: 380
        height: 360
        chart_type: donut
        data_ref: categories
        x_field: category
        y_field: share_pct
        title: Tickets by Category
        legend: true
        animate: true

      - id: section-issues
        type: rich_text
        x: 60
        y: 820
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        line_height: 1.06
        letter_spacing: -0.02
        content: "**Top Issues**"

      - id: tbl-issues
        type: interactive_table
        x: 60
        y: 880
        width: 1160
        height: 500
        data_ref: top_issues
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: issue,            title: Issue,               width: 480, sortable: true }
          - { field: tickets,          title: Tickets,             width: 220, sortable: true, formatter: number,  align: right }
          - { field: avg_resolution_h, title: Avg Resolution (h),  width: 240, sortable: true, formatter: number,  align: right }
          - { field: csat,             title: CSAT,                width: 220, sortable: true, formatter: percent, align: right }

      - id: section-channels
        type: rich_text
        x: 60
        y: 1420
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        line_height: 1.06
        letter_spacing: -0.02
        content: "**Channel Performance**"

      - id: chart-channels
        type: interactive_chart
        x: 60
        y: 1480
        width: 1160
        height: 360
        chart_type: bar
        data_ref: channels
        x_field: channel
        y_field: tickets
        title: Tickets by Channel
        legend: true
        grid: true
        animate: true

      - id: section-agents
        type: rich_text
        x: 60
        y: 1880
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        line_height: 1.06
        letter_spacing: -0.02
        content: "**Agent Leaderboard**"

      - id: tbl-agents
        type: interactive_table
        x: 60
        y: 1940
        width: 1160
        height: 320
        data_ref: agents
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: agent,             title: Agent,              width: 360, sortable: true, formatter: badge }
          - { field: tickets,           title: Tickets,            width: 240, sortable: true, formatter: number,  align: right }
          - { field: csat,              title: CSAT,               width: 260, sortable: true, formatter: percent, align: right }
          - { field: avg_resolution_h,  title: Avg Resolution (h), width: 300, sortable: true, formatter: number,  align: right }

      - { id: rule-top,  type: rect, z: 12, x: 60, y: 164, width: 1160, height: 1, fill: { type: solid, color: "$border" } }
      - { id: rule-tick, type: rect, z: 13, x: 60, y: 161, width: 150, height: 6, fill: { type: solid, color: "$primary" } }

slots:
  - { id: report_title,      path: "pages[0].layers[1].content",  type: text, hint: "Report title",      default: "**Customer Support — Quarterly Review**" }
  - { id: report_eyebrow,    path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",      default: "SUPPORT OPS · Q2 FY2026 · GLOBAL" }
  - { id: volume_section,    path: "pages[0].layers[7].content",  type: text, hint: "Volume heading",    default: "**Ticket Volume — Last 13 Weeks**" }
  - { id: issues_section,    path: "pages[0].layers[10].content", type: text, hint: "Issues heading",    default: "**Top Issues**" }
  - { id: channels_section,  path: "pages[0].layers[12].content", type: text, hint: "Channels heading",  default: "**Channel Performance**" }
  - { id: agents_section,    path: "pages[0].layers[14].content", type: text, hint: "Agents heading",    default: "**Agent Leaderboard**" }
