_protocol: template/v1

# Court summons (educational/fictional) — 1240×1754 A4 portrait, mono-print.
# Court name + case caption, "SUMMONS" header, plaintiff vs defendant,
# defendant block, "You are hereby summoned" boilerplate, response
# deadline + court address.
meta:
  id: tmpl-court-summons-stylized
  name: Court Summons (Educational)
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, legal, court, summons, civil, template, educational, mono, a4]
  description: "Educational court summons template (fictional) with court caption, SUMMONS header, plaintiff vs defendant, boilerplate, and response deadline."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: mono-print

layers:
  # 0 — bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
  # 1 — frame
  - { id: frame, type: rect, z: 1, x: 100, y: 100, width: 1040, height: 1554, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1.5 } }
  # 2 — caption divider top
  - { id: cap-div-top, type: rect, z: 2, x: 100, y: 250, width: 1040, height: 1, fill: { type: solid, color: "$text" } }
  # 3 — court name
  - { id: court-name, type: text, z: 3, x: 100, y: 150, width: 1040, height: 0, content: { type: plain, value: "SUPERIOR COURT OF THE STATE OF NEW YORK" }, style: { font_family: $heading, font_size: 24, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.4, line_height: 1.3 } }
  # 4 — county
  - { id: county, type: text, z: 4, x: 100, y: 190, width: 1040, height: 0, content: { type: plain, value: "COUNTY OF ALBANY · CIVIL DIVISION" }, style: { font_family: $heading, font_size: 16, color: "$text", text_align: center, letter_spacing: 0.4, line_height: 1.3 } }
  # 5 — vline left of caption (court caption v-line)
  - { id: vline, type: rect, z: 10, x: 700, y: 280, width: 1, height: 280, fill: { type: solid, color: "$text" } }
  # 6 — caption header
  - { id: cap-h, type: text, z: 11, x: 130, y: 280, width: 540, height: 0, content: { type: plain, value: "CAPTION" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 7 — plaintiff
  - { id: plaintiff, type: text, z: 12, x: 130, y: 320, width: 540, height: 0, content: { type: plain, value: "FOLIO STUDIO LIMITED," }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: "$text", line_height: 1.3 } }
  # 8 — plaintiff role
  - { id: plaintiff-role, type: text, z: 13, x: 200, y: 350, width: 470, height: 0, content: { type: plain, value: "Plaintiff," }, style: { font_family: $heading, font_size: 18, font_style: italic, color: "$text", line_height: 1.4 } }
  # 9 — vs
  - { id: vs, type: text, z: 14, x: 130, y: 400, width: 540, height: 0, content: { type: plain, value: "— against —" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: "$text_muted", line_height: 1.4 } }
  # 10 — defendant
  - { id: defendant, type: text, z: 15, x: 130, y: 446, width: 540, height: 0, content: { type: plain, value: "ACME WIDGET CORPORATION, et al.," }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: "$text", line_height: 1.3 } }
  # 11 — defendant role
  - { id: def-role, type: text, z: 16, x: 200, y: 476, width: 470, height: 0, content: { type: plain, value: "Defendant(s)." }, style: { font_family: $heading, font_size: 18, font_style: italic, color: "$text", line_height: 1.4 } }
  # 12 — case info header
  - { id: case-h, type: text, z: 20, x: 730, y: 280, width: 380, height: 0, content: { type: plain, value: "CASE INFORMATION" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 13 — case number label
  - { id: cn-lab, type: text, z: 21, x: 730, y: 320, width: 380, height: 0, content: { type: plain, value: "Index No." }, style: { font_family: $body, font_size: 12, color: "$text_muted" } }
  # 14 — case number value
  - { id: cn-val, type: text, z: 22, x: 730, y: 340, width: 380, height: 0, content: { type: plain, value: "603127 / 2026" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: "$text", line_height: 1.3 } }
  # 15 — filed lab
  - { id: filed-lab, type: text, z: 23, x: 730, y: 390, width: 380, height: 0, content: { type: plain, value: "Filed" }, style: { font_family: $body, font_size: 12, color: "$text_muted" } }
  # 16 — filed val
  - { id: filed-val, type: text, z: 24, x: 730, y: 410, width: 380, height: 0, content: { type: plain, value: "May 17, 2026" }, style: { font_family: $mono, font_size: 16, color: "$text", line_height: 1.3 } }
  # 17 — judge lab
  - { id: judge-lab, type: text, z: 25, x: 730, y: 450, width: 380, height: 0, content: { type: plain, value: "Assigned Justice" }, style: { font_family: $body, font_size: 12, color: "$text_muted" } }
  # 18 — judge val
  - { id: judge-val, type: text, z: 26, x: 730, y: 470, width: 380, height: 0, content: { type: plain, value: "Hon. Eleanor R. Whitmore, J.S.C." }, style: { font_family: $heading, font_size: 16, color: "$text", line_height: 1.4 } }
  # 19 — caption divider bottom
  - { id: cap-div-bot, type: rect, z: 30, x: 100, y: 580, width: 1040, height: 2, fill: { type: solid, color: "$text" } }
  # 20 — SUMMONS huge
  - { id: summons, type: text, z: 31, x: 100, y: 630, width: 1040, height: 0, content: { type: plain, value: "S U M M O N S" }, style: { font_family: $heading, font_size: 64, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.4, line_height: 1.1 } }
  # 21 — summons divider
  - { id: sum-div, type: rect, z: 32, x: 520, y: 720, width: 200, height: 1, fill: { type: solid, color: "$text" } }
  # 22 — TO heading
  - { id: to-h, type: text, z: 40, x: 100, y: 770, width: 1040, height: 0, content: { type: plain, value: "TO THE ABOVE-NAMED DEFENDANT(S):" }, style: { font_family: $heading, font_size: 16, font_weight: 700, color: "$text", text_align: center, letter_spacing: 0.4, line_height: 1.4 } }
  # 23 — defendant block bg
  - { id: def-bg, type: rect, z: 41, x: 180, y: 820, width: 880, height: 120, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 1 } }
  # 24 — defendant block content
  - { id: def-block, type: text, z: 42, x: 200, y: 836, width: 840, height: 0, content: { type: plain, value: "ACME WIDGET CORPORATION\nc/o Registered Agent CT Corporation System\n111 Eighth Avenue, 13th Floor\nNew York, NY 10011" }, style: { font_family: $mono, font_size: 15, color: "$text", line_height: 1.6 } }
  # 25 — boilerplate paragraph
  - { id: boiler, type: text, z: 50, x: 140, y: 980, width: 960, height: 0, content: { type: plain, value: "YOU ARE HEREBY SUMMONED to answer the complaint in this action and to serve a copy of your answer, or, if the complaint is not served with this summons, to serve a notice of appearance on the Plaintiff's attorney within TWENTY (20) days after the service of this summons, exclusive of the day of service (or within thirty (30) days after the service is complete if this summons is not personally delivered to you within the State of New York)." }, style: { font_family: $body, font_size: 14, color: "$text", line_height: 1.8 } }
  # 26 — second paragraph
  - { id: boiler-2, type: text, z: 51, x: 140, y: 1220, width: 960, height: 0, content: { type: plain, value: "In case of your failure to appear or answer, judgment will be taken against you by default for the relief demanded in the complaint, together with the costs of this action." }, style: { font_family: $body, font_size: 14, color: "$text", line_height: 1.8 } }
  # 27 — deadline banner bg
  - { id: dead-bg, type: rect, z: 60, x: 140, y: 1330, width: 960, height: 90, fill: { type: solid, color: "$text" } }
  # 28 — deadline label
  - { id: dead-lab, type: text, z: 61, x: 140, y: 1346, width: 960, height: 0, content: { type: plain, value: "RESPONSE DEADLINE" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.6, text_align: center } }
  # 29 — deadline value
  - { id: dead-val, type: text, z: 62, x: 140, y: 1368, width: 960, height: 0, content: { type: plain, value: "On or before June 6, 2026" }, style: { font_family: $heading, font_size: 30, font_weight: 800, color: "$background", text_align: center, line_height: 1.2 } }
  # 30 — court addr label
  - { id: addr-lab, type: text, z: 70, x: 140, y: 1460, width: 460, height: 0, content: { type: plain, value: "COURT ADDRESS" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 31 — court addr value
  - { id: addr-val, type: text, z: 71, x: 140, y: 1482, width: 460, height: 0, content: { type: plain, value: "Albany County Courthouse\n16 Eagle Street\nAlbany, NY 12207" }, style: { font_family: $body, font_size: 14, color: "$text", line_height: 1.6 } }
  # 32 — clerk sig label
  - { id: clerk-lab, type: text, z: 72, x: 640, y: 1460, width: 460, height: 0, content: { type: plain, value: "CLERK OF THE COURT" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 33 — clerk sig line
  - { id: clerk-line, type: rect, z: 73, x: 640, y: 1530, width: 460, height: 1, fill: { type: solid, color: "$text" } }
  # 34 — clerk name
  - { id: clerk-name, type: text, z: 74, x: 640, y: 1540, width: 460, height: 0, content: { type: plain, value: "Patricia M. Holloway, Court Clerk" }, style: { font_family: $body, font_size: 12, font_style: italic, color: "$text_muted", line_height: 1.4 } }
  # 35 — disclaimer footer
  - { id: footer, type: text, z: 80, x: 100, y: 1630, width: 1040, height: 0, content: { type: plain, value: "TEMPLATE FOR EDUCATIONAL USE — fictional caption · names · case number" }, style: { font_family: $mono, font_size: 11, color: "$text_muted", text_align: center, letter_spacing: 0.4 } }

slots:
  - { id: court_name,        path: "layers[3].content.value",  type: text, hint: "Court name (top caption)",     default: "SUPERIOR COURT OF THE STATE OF NEW YORK" }
  - { id: case_number,       path: "layers[14].content.value", type: text, hint: "Index / case number",          default: "603127 / 2026" }
  - { id: plaintiff,         path: "layers[7].content.value",  type: text, hint: "Plaintiff",                    default: "FOLIO STUDIO LIMITED," }
  - { id: defendant,         path: "layers[10].content.value", type: text, hint: "Defendant",                    default: "ACME WIDGET CORPORATION, et al.," }
  - { id: response_deadline, path: "layers[29].content.value", type: text, hint: "Response deadline (long form)",default: "On or before June 6, 2026" }
