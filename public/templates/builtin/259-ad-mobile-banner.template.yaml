_protocol: template/v1

# IAB Mobile Leaderboard 320×100 — mobile banner ad.
# Brand icon · headline · arrow CTA. High-contrast theme.
meta:
  id: tmpl-ad-mobile-banner
  name: Ad Mobile Banner
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [ad, banner, mobile, iab, "320x100", landscape, "high-contrast"]
  description: "IAB 320×100 mobile leaderboard banner with brand icon, headline, and arrow CTA."

document:
  width: 320
  height: 100
  unit: px
  dpi: 96

theme:
  ref: high-contrast

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 320
    height: 100
    fill: { type: solid, color: "$background" }

  - id: bg-block
    type: rect
    z: 1
    x: 0
    y: 0
    width: 96
    height: 100
    fill: { type: solid, color: "$primary" }

  - id: brand-icon
    type: rect
    z: 2
    x: 24
    y: 28
    width: 48
    height: 48
    radius: 10
    fill: { type: solid, color: "$background" }

  - id: brand-icon-mark
    type: text
    z: 3
    x: 24
    y: 40
    width: 48
    height: 0
    content: { type: plain, value: "◉" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 800
      color: $primary
      text_align: center

  - id: brand
    type: text
    z: 4
    x: 112
    y: 22
    width: 192
    height: 0
    content: { type: plain, value: "MERIDIAN" }
    style:
      font_family: $heading
      font_size: 12
      font_weight: 800
      color: $primary
      letter_spacing: 0.18

  - id: headline
    type: text
    z: 5
    x: 112
    y: 42
    width: 168
    height: 0
    content: { type: plain, value: "Bank smarter,\nfee-free." }
    style:
      font_family: $heading
      font_size: 17
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.01

  - id: cta-arrow-bg
    type: circle
    z: 6
    cx: 290
    cy: 50
    rx: 18
    ry: 18
    fill: { type: solid, color: "$text" }

  - id: cta-arrow
    type: text
    z: 7
    x: 272
    y: 42
    width: 36
    height: 0
    content: { type: plain, value: "→" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 800
      color: $background
      text_align: center

slots:
  - { id: brand,    path: "layers[4].content.value", type: text, hint: "Brand name",   default: "MERIDIAN" }
  - { id: headline, path: "layers[5].content.value", type: text, hint: "Headline (2 lines)", default: "Bank smarter,\nfee-free." }
