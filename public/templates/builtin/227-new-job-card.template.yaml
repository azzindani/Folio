_protocol: template/v1

# New job congratulations — 1080×1500 portrait, indigo-pro theme.
# Modern bold headline, recipient + role, gift-card placeholder, signed by team.
meta:
  id: tmpl-new-job-card
  name: New Job Congratulations
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, greeting, congratulations, new-job, career, indigo, portrait]
  description: "Modern new-job congratulations card with recipient name, role, gift card placeholder, and team signature."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }

  # ── Decorative accent: stripe + dots top ────────────────
  # 1 — accent bar
  - { id: accent-bar, type: rect, z: 2, x: 80, y: 160, width: 60, height: 8, fill: { type: solid, color: "$accent" } }
  # 2 — accent bar long
  - { id: accent-bar-2, type: rect, z: 2, x: 160, y: 160, width: 240, height: 8, fill: { type: solid, color: "$primary" } }
  # 3 — bullet dot
  - { id: bullet, type: circle, z: 2, cx: 440, cy: 164, rx: 8, ry: 8, fill: { type: solid, color: "$accent" } }

  # 4 — eyebrow
  - { id: eyebrow, type: text, z: 10, x: 80, y: 220, width: 920, height: 0, content: { type: plain, value: "CONGRATS ON THE NEW GIG" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$accent", text_align: left, letter_spacing: 0.6, text_transform: uppercase } }

  # 5 — main headline
  - { id: headline, type: text, z: 11, x: 80, y: 300, width: 920, height: 0, content: { type: plain, value: "You absolutely\ncrushed it." }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: "$text", text_align: left, line_height: 1.05, letter_spacing: -0.02 } }

  # 6 — recipient
  - { id: recipient, type: text, z: 20, x: 80, y: 560, width: 920, height: 0, content: { type: plain, value: "To: Priya Sharma" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: "$primary", text_align: left, line_height: 1.3 } }
  # 7 — role
  - { id: role, type: text, z: 21, x: 80, y: 620, width: 920, height: 0, content: { type: plain, value: "Senior Product Manager · Vela Health" }, style: { font_family: $body, font_size: 22, color: "$text_muted", text_align: left, line_height: 1.4 } }

  # 8 — divider
  - { id: divider, type: rect, z: 22, x: 80, y: 700, width: 920, height: 1, fill: { type: solid, color: "$border" } }

  # 9 — message
  - { id: message, type: text, z: 23, x: 80, y: 740, width: 920, height: 0, content: { type: plain, value: "From bootcamp Slack channels to running your own roadmap — what a ride. Wishing you smart teammates, a coffee budget, and a manager who actually reads your one-pagers. Now go ship the good stuff." }, style: { font_family: $body, font_size: 22, color: "$text", text_align: left, line_height: 1.6 } }

  # ── Gift card placeholder ───────────────────────────────
  # 10 — gc shadow
  - { id: gc-shadow, type: rect, z: 30, x: 92, y: 1042, width: 896, height: 200, fill: { type: solid, color: "$primary" }, opacity: 0.25, radius: 16 }
  # 11 — gc body
  - { id: gc-body, type: rect, z: 31, x: 80, y: 1030, width: 920, height: 200, fill: { type: solid, color: "$primary" }, radius: 16 }
  # 12 — gc label
  - { id: gc-lbl, type: text, z: 32, x: 120, y: 1060, width: 840, height: 0, content: { type: plain, value: "TREAT YOURSELF" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$accent", letter_spacing: 0.6 } }
  # 13 — gc amount
  - { id: gc-amount, type: text, z: 33, x: 120, y: 1100, width: 840, height: 0, content: { type: plain, value: "$200 · Blue Bottle Coffee" }, style: { font_family: $heading, font_size: 44, font_weight: 700, color: "$background", line_height: 1.1 } }
  # 14 — gc code line
  - { id: gc-code, type: text, z: 34, x: 120, y: 1170, width: 840, height: 0, content: { type: plain, value: "code · NEW-GIG-2026" }, style: { font_family: $mono, font_size: 18, color: "$background", letter_spacing: 0.05, opacity: 0.85 } }

  # 15 — signed-by
  - { id: signed, type: text, z: 40, x: 80, y: 1300, width: 920, height: 0, content: { type: plain, value: "with cheers · the old Stratum crew" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: "$text_muted", text_align: left } }

  # 16 — small footer ornament
  - { id: footer-dot, type: circle, z: 41, cx: 90, cy: 1400, rx: 6, ry: 6, fill: { type: solid, color: "$accent" } }
  # 17 — footer bar
  - { id: footer-bar, type: rect, z: 41, x: 110, y: 1396, width: 60, height: 8, fill: { type: solid, color: "$accent" } }

slots:
  - { id: recipient, path: "layers[6].content.value",  type: text, hint: "Recipient (To: name)",   default: "To: Priya Sharma" }
  - { id: new_role,  path: "layers[7].content.value",  type: text, hint: "New role and company",   default: "Senior Product Manager · Vela Health" }
  - { id: signed_by, path: "layers[15].content.value", type: text, hint: "Signed by",              default: "with cheers · the old Stratum crew" }
