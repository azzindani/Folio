_protocol: template/v1

# Twitter quote post — 1200×675 landscape, dark-tech theme.
# Huge centered quote with leading typographic glyph, attribution
# block beneath, and brand handle anchored bottom-right.
meta:
  id: tmpl-twitter-quote-post
  name: Twitter Quote Post
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, twitter, x, quote, landscape, dark]
  description: "Twitter/X quote post with oversized quote text, attribution, and brand handle."

document:
  width: 1200
  height: 675
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 675
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # ── Decorative radial glow ────────────────────────────────
  - id: glow
    type: circle
    z: 1
    cx: 200
    cy: 100
    rx: 360
    ry: 360
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.18

  # ── Accent bar top ────────────────────────────────────────
  - id: accent-bar
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 4
    fill:
      type: linear
      angle: 90
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$accent", position: 100 }

  # ── Giant opening quote glyph ─────────────────────────────
  - id: quote-glyph
    type: text
    z: 5
    x: 60
    y: 60
    width: 200
    height: 0
    content: { type: plain, value: "“" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 800
      color: $primary
      line_height: 1

  # ── Main quote text ───────────────────────────────────────
  - id: quote
    type: text
    z: 10
    x: 90
    y: 200
    width: 1020
    height: 0
    content: { type: plain, value: "The best code is the code\nyou never had to write." }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 700
      color: $text
      line_height: 1.18
      letter_spacing: -0.02

  # ── Attribution divider ───────────────────────────────────
  - id: attr-rule
    type: rect
    z: 15
    x: 90
    y: 470
    width: 48
    height: 3
    radius: 2
    fill: { type: solid, color: "$accent" }

  # ── Attribution name ──────────────────────────────────────
  - id: attribution
    type: text
    z: 16
    x: 90
    y: 495
    width: 800
    height: 0
    content: { type: plain, value: "— Mira Tanaka, Principal Engineer at Stripe" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text_muted
      line_height: 1.4

  # ── Bottom-right brand handle pill ────────────────────────
  - id: handle-pill
    type: rect
    z: 20
    x: 940
    y: 595
    width: 200
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface2" }
    stroke: { color: "$border", width: 1 }

  - id: brand-handle
    type: text
    z: 21
    x: 940
    y: 606
    width: 200
    height: 0
    content: { type: plain, value: "@folio.dev" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 600
      color: $accent
      text_align: center
      line_height: 1.3

  # ── Footer divider ────────────────────────────────────────
  - id: footer-divider
    type: rect
    z: 22
    x: 60
    y: 610
    width: 840
    height: 1
    fill: { type: solid, color: "$border" }
    opacity: 0.6

slots:
  - { id: quote,         path: "layers[4].content.value", type: text, hint: "Quote body (2 lines)",  default: "The best code is the code\nyou never had to write." }
  - { id: attribution,   path: "layers[6].content.value", type: text, hint: "Attribution / source",  default: "— Mira Tanaka, Principal Engineer at Stripe" }
  - { id: brand_handle,  path: "layers[8].content.value", type: text, hint: "Brand handle",          default: "@folio.dev" }
