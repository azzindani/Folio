_protocol: template/v1

# 10-slide startup pitch deck — 1920×1080 landscape, indigo-pro theme.
# Story arc: cover → problem → solution → market → product → traction
# → business-model → competition → team → ask.
meta:
  id: tmpl-pitch-deck-startup
  name: Pitch Deck · Startup (10 slides)
  type: deck
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [deck, pitch, startup, presentation, indigo, landscape]
  description: "Ten-slide startup pitch deck spanning cover, problem, solution, market, product, traction, business model, competition, team, and ask."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

pages:
  # ── Slide 1 · Cover ─────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: accent-blob, type: circle, z: 1, cx: 1720, cy: 200, rx: 280, ry: 280, fill: { type: solid, color: "$primary" }, opacity: 0.35 }
      - { id: accent-line, type: rect, z: 2, x: 120, y: 540, width: 80, height: 4, fill: { type: solid, color: "$primary" } }
      - id: logo-mark
        type: text
        z: 10
        x: 120
        y: 120
        width: 600
        height: 0
        content: { type: plain, value: "◆ NORTHWIND" }
        style: { font_family: $heading, font_size: 28, font_weight: 800, color: $primary, letter_spacing: 0.4, text_transform: uppercase }
      - id: company-name
        type: text
        z: 11
        x: 120
        y: 580
        width: 1680
        height: 0
        content: { type: plain, value: "Northwind" }
        style: { font_family: $heading, font_size: 144, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 12
        x: 120
        y: 760
        width: 1400
        height: 0
        content: { type: plain, value: "Logistics automation for the modern warehouse." }
        style: { font_family: $body, font_size: 36, color: $text_muted, line_height: 1.3 }
      - id: deck-label
        type: text
        z: 13
        x: 120
        y: 960
        width: 600
        height: 0
        content: { type: plain, value: "Series A · May 2026" }
        style: { font_family: $mono, font_size: 18, color: $text_muted, letter_spacing: 0.2 }
      - id: counter
        type: text
        z: 14
        x: 1740
        y: 960
        width: 100
        height: 0
        content: { type: plain, value: "01 / 10" }
        style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: right }

  # ── Slide 2 · Problem ───────────────────────────────────────
  - id: problem
    label: Problem
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "01 · THE PROBLEM" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "Warehouses still run on spreadsheets." }, style: { font_family: $heading, font_size: 80, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 120, y: 360, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: pain-1-num, type: text, z: 20, x: 120, y: 440, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pain-1, type: text, z: 21, x: 200, y: 430, width: 1500, height: 0, content: { type: plain, value: "73% of mid-market warehouses still reconcile inventory by hand each night." }, style: { font_family: $heading, font_size: 32, color: $text, line_height: 1.4 } }
      - { id: pain-2-num, type: text, z: 22, x: 120, y: 600, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pain-2, type: text, z: 23, x: 200, y: 590, width: 1500, height: 0, content: { type: plain, value: "Picker error rates climb to 4.2% during peak season — a $1.4M leak for a 50-person crew." }, style: { font_family: $heading, font_size: 32, color: $text, line_height: 1.4 } }
      - { id: pain-3-num, type: text, z: 24, x: 120, y: 800, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pain-3, type: text, z: 25, x: 200, y: 790, width: 1500, height: 0, content: { type: plain, value: "Existing WMS deployments take 9-14 months and require IT teams these ops shops don't have." }, style: { font_family: $heading, font_size: 32, color: $text, line_height: 1.4 } }
      - { id: counter, type: text, z: 30, x: 1740, y: 960, width: 100, height: 0, content: { type: plain, value: "02 / 10" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: right } }

  # ── Slide 3 · Solution ──────────────────────────────────────
  - id: solution
    label: Solution
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "02 · THE SOLUTION" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "Plug-in computer vision. Deploys in 48 hours." }, style: { font_family: $heading, font_size: 72, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: card-1, type: rect, z: 20, x: 120, y: 400, width: 540, height: 520, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: card-1-icon, type: text, z: 21, x: 160, y: 440, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: card-1-title, type: text, z: 22, x: 160, y: 540, width: 460, height: 0, content: { type: plain, value: "Mount any camera" }, style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: card-1-body, type: text, z: 23, x: 160, y: 600, width: 460, height: 0, content: { type: plain, value: "Off-the-shelf IP cameras. No proprietary hardware, no rewiring, no rip-and-replace." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.6 } }
      - { id: card-2, type: rect, z: 20, x: 690, y: 400, width: 540, height: 520, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: card-2-icon, type: text, z: 21, x: 730, y: 440, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: card-2-title, type: text, z: 22, x: 730, y: 540, width: 460, height: 0, content: { type: plain, value: "Vision model auto-tracks" }, style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: card-2-body, type: text, z: 23, x: 730, y: 600, width: 460, height: 0, content: { type: plain, value: "Pre-trained on 8M warehouse hours. Identifies SKUs, pickers, and pallets with 99.1% accuracy." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.6 } }
      - { id: card-3, type: rect, z: 20, x: 1260, y: 400, width: 540, height: 520, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: card-3-icon, type: text, z: 21, x: 1300, y: 440, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: card-3-title, type: text, z: 22, x: 1300, y: 540, width: 460, height: 0, content: { type: plain, value: "Reconcile in real-time" }, style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: card-3-body, type: text, z: 23, x: 1300, y: 600, width: 460, height: 0, content: { type: plain, value: "Pushes events to your existing ERP. SAP, NetSuite, Odoo, or webhook. End-of-day count obsolete." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.6 } }
      - { id: counter, type: text, z: 30, x: 1740, y: 960, width: 100, height: 0, content: { type: plain, value: "03 / 10" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: right } }

  # ── Slide 4 · Market Size ───────────────────────────────────
  - id: market
    label: Market Size
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "03 · MARKET SIZE" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "A $58B inventory-software market, only 12% modernized." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: metric-1-card, type: rect, z: 20, x: 120, y: 420, width: 540, height: 460, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: metric-1-label, type: text, z: 21, x: 160, y: 460, width: 460, height: 0, content: { type: plain, value: "TAM" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: metric-1-value, type: text, z: 22, x: 160, y: 540, width: 460, height: 0, content: { type: plain, value: "$58B" }, style: { font_family: $heading, font_size: 128, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.04 } }
      - { id: metric-1-sub, type: text, z: 23, x: 160, y: 730, width: 460, height: 0, content: { type: plain, value: "Global WMS + inventory software, 2026 (Gartner)." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: metric-2-card, type: rect, z: 20, x: 690, y: 420, width: 540, height: 460, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: metric-2-label, type: text, z: 21, x: 730, y: 460, width: 460, height: 0, content: { type: plain, value: "SAM" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: metric-2-value, type: text, z: 22, x: 730, y: 540, width: 460, height: 0, content: { type: plain, value: "$11B" }, style: { font_family: $heading, font_size: 128, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.04 } }
      - { id: metric-2-sub, type: text, z: 23, x: 730, y: 730, width: 460, height: 0, content: { type: plain, value: "Mid-market warehouses, 50-500 staff, N. America + EU." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: metric-3-card, type: rect, z: 20, x: 1260, y: 420, width: 540, height: 460, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: metric-3-label, type: text, z: 21, x: 1300, y: 460, width: 460, height: 0, content: { type: plain, value: "SOM (3yr)" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: metric-3-value, type: text, z: 22, x: 1300, y: 540, width: 460, height: 0, content: { type: plain, value: "$420M" }, style: { font_family: $heading, font_size: 128, font_weight: 800, color: $secondary, line_height: 1, letter_spacing: -0.04 } }
      - { id: metric-3-sub, type: text, z: 23, x: 1300, y: 730, width: 460, height: 0, content: { type: plain, value: "Reachable ARR with current GTM, capturing 3.8% of SAM." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: counter, type: text, z: 30, x: 1740, y: 960, width: 100, height: 0, content: { type: plain, value: "04 / 10" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: right } }

  # ── Slide 5 · Product ───────────────────────────────────────
  - id: product
    label: Product
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "04 · PRODUCT" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1100, height: 0, content: { type: plain, value: "One dashboard. Every pallet, every picker, every minute." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: mockup-frame, type: rect, z: 20, x: 120, y: 400, width: 1080, height: 540, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: mockup-bar, type: rect, z: 21, x: 120, y: 400, width: 1080, height: 48, radius: 16, fill: { type: solid, color: "$surface" } }
      - { id: mockup-dot-1, type: circle, z: 22, cx: 150, cy: 424, rx: 6, ry: 6, fill: { type: solid, color: "#FF5F57" } }
      - { id: mockup-dot-2, type: circle, z: 22, cx: 174, cy: 424, rx: 6, ry: 6, fill: { type: solid, color: "#FEBC2E" } }
      - { id: mockup-dot-3, type: circle, z: 22, cx: 198, cy: 424, rx: 6, ry: 6, fill: { type: solid, color: "#28C840" } }
      - { id: mockup-tile-1, type: rect, z: 23, x: 160, y: 480, width: 300, height: 200, radius: 12, fill: { type: solid, color: "$primary" }, opacity: 0.85 }
      - { id: mockup-tile-1-text, type: text, z: 24, x: 180, y: 500, width: 260, height: 0, content: { type: plain, value: "LIVE OCCUPANCY\n\n82%" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: "#FFFFFF", line_height: 1.3 } }
      - { id: mockup-tile-2, type: rect, z: 23, x: 480, y: 480, width: 300, height: 200, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: mockup-tile-2-text, type: text, z: 24, x: 500, y: 500, width: 260, height: 0, content: { type: plain, value: "PICKS / HR\n\n1,284" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: $text, line_height: 1.3 } }
      - { id: mockup-tile-3, type: rect, z: 23, x: 800, y: 480, width: 380, height: 200, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: mockup-tile-3-text, type: text, z: 24, x: 820, y: 500, width: 340, height: 0, content: { type: plain, value: "ERROR RATE\n\n0.4% ↓ from 4.2%" }, style: { font_family: $heading, font_size: 26, font_weight: 800, color: $secondary, line_height: 1.4 } }
      - { id: mockup-strip, type: rect, z: 23, x: 160, y: 700, width: 1020, height: 200, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: mockup-strip-text, type: text, z: 24, x: 180, y: 720, width: 980, height: 0, content: { type: plain, value: "Aisle heatmap · 14 zones · last 24h" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted } }
      - { id: feature-1, type: text, z: 30, x: 1260, y: 420, width: 540, height: 0, content: { type: plain, value: "→ Real-time tracking under 200ms" }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.6 } }
      - { id: feature-2, type: text, z: 30, x: 1260, y: 510, width: 540, height: 0, content: { type: plain, value: "→ Shift-by-shift heatmap replay" }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.6 } }
      - { id: feature-3, type: text, z: 30, x: 1260, y: 600, width: 540, height: 0, content: { type: plain, value: "→ Anomaly alerts via Slack + SMS" }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.6 } }
      - { id: feature-4, type: text, z: 30, x: 1260, y: 690, width: 540, height: 0, content: { type: plain, value: "→ Pre-built ERP connectors" }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.6 } }
      - { id: counter, type: text, z: 40, x: 1740, y: 960, width: 100, height: 0, content: { type: plain, value: "05 / 10" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: right } }

  # ── Slide 6 · Traction ──────────────────────────────────────
  - id: traction
    label: Traction
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "05 · TRACTION" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "$3.4M ARR · 142% YoY net retention." }, style: { font_family: $heading, font_size: 64, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: chart-card, type: rect, z: 20, x: 120, y: 360, width: 1180, height: 560, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: chart-label, type: text, z: 21, x: 160, y: 400, width: 600, height: 0, content: { type: plain, value: "MRR · Q1-2025 → Q1-2026" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.3, text_transform: uppercase } }
      - { id: chart-axis-y, type: rect, z: 22, x: 200, y: 460, width: 1, height: 380, fill: { type: solid, color: "$border" } }
      - { id: chart-axis-x, type: rect, z: 22, x: 200, y: 840, width: 1060, height: 1, fill: { type: solid, color: "$border" } }
      - { id: chart-grid-1, type: rect, z: 22, x: 200, y: 560, width: 1060, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
      - { id: chart-grid-2, type: rect, z: 22, x: 200, y: 660, width: 1060, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
      - { id: chart-grid-3, type: rect, z: 22, x: 200, y: 760, width: 1060, height: 1, fill: { type: solid, color: "$border" }, opacity: 0.4 }
      - { id: chart-line, type: polyline, z: 30, points: "240,820 360,790 480,750 600,700 720,640 840,580 960,510 1080,440 1200,360", stroke: { color: "$primary", width: 4 }, fill: { type: solid, color: "transparent" } }
      - { id: chart-dot-1, type: circle, z: 31, cx: 240, cy: 820, rx: 6, ry: 6, fill: { type: solid, color: "$primary" } }
      - { id: chart-dot-2, type: circle, z: 31, cx: 480, cy: 750, rx: 6, ry: 6, fill: { type: solid, color: "$primary" } }
      - { id: chart-dot-3, type: circle, z: 31, cx: 720, cy: 640, rx: 6, ry: 6, fill: { type: solid, color: "$primary" } }
      - { id: chart-dot-4, type: circle, z: 31, cx: 960, cy: 510, rx: 6, ry: 6, fill: { type: solid, color: "$primary" } }
      - { id: chart-dot-5, type: circle, z: 31, cx: 1200, cy: 360, rx: 8, ry: 8, fill: { type: solid, color: "$secondary" } }
      - { id: chart-label-end, type: text, z: 32, x: 1140, y: 320, width: 200, height: 0, content: { type: plain, value: "$284K MRR" }, style: { font_family: $heading, font_size: 20, font_weight: 800, color: $secondary } }
      - { id: stat-1-label, type: text, z: 40, x: 1360, y: 400, width: 460, height: 0, content: { type: plain, value: "PAID CUSTOMERS" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 0.3, text_transform: uppercase } }
      - { id: stat-1-value, type: text, z: 41, x: 1360, y: 430, width: 460, height: 0, content: { type: plain, value: "47" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1 } }
      - { id: stat-2-label, type: text, z: 40, x: 1360, y: 580, width: 460, height: 0, content: { type: plain, value: "NET RETENTION" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 0.3, text_transform: uppercase } }
      - { id: stat-2-value, type: text, z: 41, x: 1360, y: 610, width: 460, height: 0, content: { type: plain, value: "142%" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $primary, line_height: 1 } }
