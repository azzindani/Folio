# University class schedule — 1240×1754 A4 portrait, light-clean.
# Student name + semester, 5 weekday × 6 timeslot grid with
# course code + room in each cell.
meta:
  id: tmpl-class-schedule-display
  name: Class Schedule Display
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [schedule, university, student, timetable, a4, light, portrait]
  description: "University class schedule display with student name, semester, and 5-day x 6-timeslot grid of course codes and rooms."

