_protocol: template/v1

# LinkedIn 6-slide carousel · "How I Deep Work for 4 Hours Straight" · cover, distractors, setup, protocol, summary, CTA.
meta:
  id: tmpl-linkedin-deep-work-6slide
  name: LinkedIn Deep Work (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, productivity, deep-work, focus, forest-deep, "4-5"]
  description: "6-slide LinkedIn carousel: distractors, setup, protocol, and CTA for sustained deep work."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: forest-deep

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 170, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: leaf-orb, type: circle, z: 3, cx: 880, cy: 220, rx: 180, ry: 180, fill: { type: solid, color: "$accent" }, opacity: 0.22 }
      - id: eyebrow
        type: text
        z: 10
        x: 72
        y: 360
        width: 936
        height: 0
        content: { type: plain, value: "DEEP WORK · 6 SLIDES" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 72
        y: 420
        width: 936
        height: 0
        content: { type: plain, value: "How I Deep Work\nfor 4 Hours\nStraight." }
        style: { font_family: $heading, font_size: 92, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 12
        x: 72
        y: 880
        width: 936
        height: 0
        content: { type: plain, value: "The setup. The rules. The cost." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: swipe-hint
        type: text
        z: 13
        x: 72
        y: 980
        width: 936
        height: 0
        content: { type: plain, value: "Swipe → for the full protocol." }
        style: { font_family: $body, font_size: 20, font_weight: 600, color: $primary }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "1 / 6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

