slots:
  - { id: cover_title,     path: "pages[0].layers[4].content.value",  type: text, hint: "Cover title",         default: "How I Deep Work\nfor 4 Hours\nStraight." }
  - { id: cover_tagline,   path: "pages[0].layers[5].content.value",  type: text, hint: "Cover tagline",       default: "The setup. The rules. The cost." }
  - { id: dist_heading,    path: "pages[1].layers[3].content.value",  type: text, hint: "Distractor heading",  default: "Three thieves." }
  - { id: dist_1,          path: "pages[1].layers[5].content.value",  type: text, hint: "Distractor 1",        default: "Notifications — every ping costs 23 minutes." }
  - { id: dist_2,          path: "pages[1].layers[7].content.value",  type: text, hint: "Distractor 2",        default: "Open tabs — visible work is unfinished work." }
  - { id: dist_3,          path: "pages[1].layers[9].content.value",  type: text, hint: "Distractor 3",        default: "Ambient chat — Slack is a meeting that never ends." }
  - { id: setup_rule_1,    path: "pages[2].layers[5].content.value",  type: text, hint: "Setup rule 1",        default: "Same desk. Same chair. Same hour, every day." }
  - { id: setup_rule_2,    path: "pages[2].layers[7].content.value",  type: text, hint: "Setup rule 2",        default: "Phone in a drawer. Laptop on airplane mode." }
  - { id: setup_rule_3,    path: "pages[2].layers[9].content.value",  type: text, hint: "Setup rule 3",        default: "One open document. Nothing else on screen." }
  - { id: proto_rule_1,    path: "pages[3].layers[5].content.value",  type: text, hint: "Protocol rule 1",     default: "Define the deliverable before you start." }
  - { id: proto_rule_2,    path: "pages[3].layers[7].content.value",  type: text, hint: "Protocol rule 2",     default: "Park every new idea in a notepad — never chase it." }
  - { id: proto_rule_3,    path: "pages[3].layers[9].content.value",  type: text, hint: "Protocol rule 3",     default: "Take 5-min breaks every 90 — no screens during them." }
  - { id: summary_heading, path: "pages[4].layers[3].content.value",  type: text, hint: "Summary heading",     default: "Focus is a\nritual — not\nwillpower." }
  - { id: cta_heading,     path: "pages[5].layers[2].content.value",  type: text, hint: "CTA heading",         default: "Save this.\nBuild your\nritual." }
  - { id: cta_sub,         path: "pages[5].layers[3].content.value",  type: text, hint: "CTA subline",         default: "Follow @yourhandle for one focus playbook a week." }
