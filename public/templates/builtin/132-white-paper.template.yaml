  # ── Page 2 · Executive Summary ──────────────────────────────
  - id: exec-summary
    label: Executive Summary
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "§1 · EXECUTIVE SUMMARY" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "The headline." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 290, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: p1, type: text, z: 20, x: 100, y: 340, width: 1040, height: 0, content: { type: plain, value: "Vector search underpins modern retrieval-augmented generation, semantic search, and recommendation. As corpora grow past one billion embeddings, the cost-latency tradeoffs of existing approximate nearest-neighbor (ANN) algorithms have become a binding constraint on production deployments." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: p2, type: text, z: 21, x: 100, y: 520, width: 1040, height: 0, content: { type: plain, value: "We report results from a six-month study comparing HNSW, IVF-PQ, and a proposed hybrid index across three corpus scales (100M, 500M, 2B vectors) under representative workloads. Our key findings:" }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: f1-dot, type: circle, z: 30, cx: 120, cy: 720, rx: 5, ry: 5, fill: { type: solid, color: "$primary" } }
      - { id: f1, type: text, z: 31, x: 150, y: 706, width: 990, height: 0, content: { type: plain, value: "HNSW alone scales poorly past 500M vectors — p99 latency exceeds 80ms at 2B." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: f2-dot, type: circle, z: 30, cx: 120, cy: 780, rx: 5, ry: 5, fill: { type: solid, color: "$primary" } }
      - { id: f2, type: text, z: 31, x: 150, y: 766, width: 990, height: 0, content: { type: plain, value: "IVF-PQ trades 4 points of recall for 6× lower memory, but suffers tail latency spikes." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: f3-dot, type: circle, z: 30, cx: 120, cy: 840, rx: 5, ry: 5, fill: { type: solid, color: "$primary" } }
      - { id: f3, type: text, z: 31, x: 150, y: 826, width: 990, height: 0, content: { type: plain, value: "Our hybrid IVF→HNSW yields p99 = 18ms at recall@10 = 0.97, 1B-vector scale." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: f4-dot, type: circle, z: 30, cx: 120, cy: 900, rx: 5, ry: 5, fill: { type: solid, color: "$primary" } }
      - { id: f4, type: text, z: 31, x: 150, y: 886, width: 990, height: 0, content: { type: plain, value: "Total cost per million queries falls 41% vs. tuned HNSW on identical hardware." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: p3, type: text, z: 40, x: 100, y: 1000, width: 1040, height: 0, content: { type: plain, value: "We have open-sourced the index implementation and benchmark harness. Sections 3 through 6 of this paper detail the algorithmic choices, infrastructure layout, and one production deployment that validated the approach at customer scale." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: tldr-card, type: rect, z: 50, x: 100, y: 1240, width: 1040, height: 280, radius: 0, fill: { type: solid, color: "$primary" } }
      - { id: tldr-label, type: text, z: 51, x: 140, y: 1280, width: 960, height: 0, content: { type: plain, value: "TL;DR" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.5, opacity: 0.85 } }
      - { id: tldr-body, type: text, z: 52, x: 140, y: 1320, width: 960, height: 0, content: { type: plain, value: "Use HNSW alone if your corpus is under 500M and memory is cheap. Use IVF-PQ if you can absorb 3-4 points of recall loss. Otherwise, our hybrid IVF→HNSW gives you the best of both — sub-20ms p99 at billion-vector scale, with 41% cost savings." }, style: { font_family: $heading, font_size: 22, color: "#FFFFFF", line_height: 1.6 } }
      - { id: pn, type: text, z: 60, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "02 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

  # ── Page 3 · Problem Statement ──────────────────────────────
  - id: problem
    label: Problem Statement
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "§2 · PROBLEM STATEMENT" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Why current approaches fall short." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: sect-1, type: text, z: 20, x: 100, y: 360, width: 1040, height: 0, content: { type: plain, value: "2.1 The scale problem" }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $primary, line_height: 1.3 } }
      - { id: p1, type: text, z: 21, x: 100, y: 420, width: 1040, height: 0, content: { type: plain, value: "A single embedding model produces 768-dimensional vectors at roughly 3KB per record. At 1B vectors, the raw index requires 2.9TB of memory before any auxiliary structures. Production systems typically need to serve queries with p99 latencies under 50ms while maintaining recall@10 above 0.95. Current open-source implementations struggle past the 500M mark on commodity 384GB-memory hosts." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: sect-2, type: text, z: 30, x: 100, y: 680, width: 1040, height: 0, content: { type: plain, value: "2.2 The cost problem" }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $primary, line_height: 1.3 } }
      - { id: p2, type: text, z: 31, x: 100, y: 740, width: 1040, height: 0, content: { type: plain, value: "Operating a 2B-vector HNSW index in AWS today requires roughly $14,400/month per replica (m6id.32xlarge with NVMe). With recommended N+2 redundancy in two regions, the bill exceeds $86K/month. For startups, this is often the single largest line item in infrastructure spend after model inference." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: sect-3, type: text, z: 40, x: 100, y: 940, width: 1040, height: 0, content: { type: plain, value: "2.3 The tail-latency problem" }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $primary, line_height: 1.3 } }
      - { id: p3, type: text, z: 41, x: 100, y: 1000, width: 1040, height: 0, content: { type: plain, value: "Even when median latency is acceptable, tail latencies (p99, p99.9) determine user experience for downstream applications, particularly LLM-augmented search where each retrieved chunk feeds a chained inference. We have repeatedly observed pathological p99 spikes of 200-500ms in IVF-based systems when query vectors land near cluster boundaries." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: callout, type: rect, z: 50, x: 100, y: 1260, width: 1040, height: 240, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: callout-label, type: text, z: 51, x: 140, y: 1290, width: 960, height: 0, content: { type: plain, value: "RESEARCH QUESTION" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: callout-q, type: text, z: 52, x: 140, y: 1330, width: 960, height: 0, content: { type: plain, value: "Can we achieve p99 < 25ms and recall@10 > 0.95 at billion-vector scale, on commodity hardware, at less than half the cost of single-algorithm baselines?" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: pn, type: text, z: 60, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "03 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

  # ── Page 4 · Proposed Solution ──────────────────────────────
  - id: solution
    label: Proposed Solution
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "§3 · PROPOSED SOLUTION" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Hybrid IVF→HNSW retrieval." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: lead, type: text, z: 20, x: 100, y: 360, width: 1040, height: 0, content: { type: plain, value: "Our approach is a two-stage hybrid that combines the strengths of inverted-file indexing with hierarchical navigable small world graphs. Coarse filtering, then precise traversal." }, style: { font_family: $body, font_size: 20, color: $text_muted, line_height: 1.6 } }
      - { id: arch-card, type: rect, z: 30, x: 100, y: 540, width: 1040, height: 460, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: arch-label, type: text, z: 31, x: 140, y: 580, width: 960, height: 0, content: { type: plain, value: "FIG 1 · ARCHITECTURE OVERVIEW" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: a-q, type: rect, z: 32, x: 180, y: 700, width: 200, height: 80, radius: 8, fill: { type: solid, color: "$background" }, stroke: { color: "$primary", width: 2 } }
      - { id: a-q-t, type: text, z: 33, x: 180, y: 728, width: 200, height: 0, content: { type: plain, value: "QUERY" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $primary, text_align: center } }
      - { id: a-arrow-1, type: text, z: 34, x: 380, y: 728, width: 80, height: 0, content: { type: plain, value: "→" }, style: { font_family: $heading, font_size: 32, color: $primary, text_align: center } }
      - { id: a-ivf, type: rect, z: 32, x: 460, y: 700, width: 240, height: 80, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: a-ivf-t, type: text, z: 33, x: 460, y: 720, width: 240, height: 0, content: { type: plain, value: "IVF COARSE\n(k=4096 clusters)" }, style: { font_family: $heading, font_size: 14, font_weight: 700, color: "#FFFFFF", text_align: center, line_height: 1.4 } }
      - { id: a-arrow-2, type: text, z: 34, x: 700, y: 728, width: 80, height: 0, content: { type: plain, value: "→" }, style: { font_family: $heading, font_size: 32, color: $primary, text_align: center } }
      - { id: a-hnsw, type: rect, z: 32, x: 780, y: 700, width: 240, height: 80, radius: 8, fill: { type: solid, color: "$primary" } }
      - { id: a-hnsw-t, type: text, z: 33, x: 780, y: 720, width: 240, height: 0, content: { type: plain, value: "HNSW FINE\n(per cluster)" }, style: { font_family: $heading, font_size: 14, font_weight: 700, color: "#FFFFFF", text_align: center, line_height: 1.4 } }
      - { id: a-out, type: rect, z: 32, x: 460, y: 850, width: 240, height: 80, radius: 8, fill: { type: solid, color: "$background" }, stroke: { color: "$primary", width: 2 } }
      - { id: a-out-t, type: text, z: 33, x: 460, y: 878, width: 240, height: 0, content: { type: plain, value: "TOP-K RESULTS" }, style: { font_family: $heading, font_size: 16, font_weight: 700, color: $primary, text_align: center } }
      - { id: a-arrow-3, type: text, z: 34, x: 560, y: 800, width: 40, height: 0, content: { type: plain, value: "↓" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center } }
      - { id: note, type: text, z: 40, x: 100, y: 1040, width: 1040, height: 0, content: { type: plain, value: "The IVF stage routes queries to roughly 16 of 4,096 clusters (probing factor 0.39%). Each cluster contains a fully-built HNSW graph of approximately 245K vectors, sized to fit comfortably in L3 cache during traversal." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: bullet-1, type: text, z: 50, x: 100, y: 1240, width: 1040, height: 0, content: { type: plain, value: "→ IVF clusters are trained via k-means once, refreshed weekly." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: bullet-2, type: text, z: 50, x: 100, y: 1290, width: 1040, height: 0, content: { type: plain, value: "→ HNSW shards are built incrementally on streaming inserts." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: bullet-3, type: text, z: 50, x: 100, y: 1340, width: 1040, height: 0, content: { type: plain, value: "→ Hot clusters pin to RAM; cold clusters lazy-load from NVMe in 4-8ms." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: bullet-4, type: text, z: 50, x: 100, y: 1390, width: 1040, height: 0, content: { type: plain, value: "→ Distance computations use AVX-512 vectorization with float16 storage." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: pn, type: text, z: 60, x: 1040, y: 1640, width: 120, height: 0, content: { type: plain, value: "04 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

  # ── Page 5 · Technical Deep-Dive ────────────────────────────
  - id: technical
    label: Technical Deep-Dive
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "§4 · TECHNICAL DEEP-DIVE" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Inside the hybrid query path." }, style: { font_family: $heading, font_size: 44, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: sect-1, type: text, z: 20, x: 100, y: 360, width: 1040, height: 0, content: { type: plain, value: "4.1 Query routing algorithm" }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $primary, line_height: 1.3 } }
      - { id: p1, type: text, z: 21, x: 100, y: 410, width: 1040, height: 0, content: { type: plain, value: "Each incoming query vector q is first scored against the 4,096 cluster centroids. We retain the top-nprobe clusters (default nprobe=16), where the choice of nprobe directly modulates the recall-latency tradeoff. Selected clusters are queried in parallel, and the union of their results is reranked." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: code-card, type: rect, z: 30, x: 100, y: 620, width: 1040, height: 360, radius: 0, fill: { type: solid, color: "$text" } }
      - { id: code-bar, type: rect, z: 31, x: 100, y: 620, width: 1040, height: 36, radius: 0, fill: { type: solid, color: "$primary" } }
      - { id: code-lang, type: text, z: 32, x: 130, y: 628, width: 200, height: 0, content: { type: plain, value: "linthorne/search.py" }, style: { font_family: $mono, font_size: 13, font_weight: 600, color: "#FFFFFF", letter_spacing: 0.2 } }
      - { id: code-body, type: text, z: 33, x: 140, y: 690, width: 960, height: 0, content: { type: plain, value: "def hybrid_search(q, nprobe=16, k=10):\n    centroids = ivf.centroids\n    probe_ids = topk(score(q, centroids), nprobe)\n    candidates = []\n    for cid in probe_ids:\n        shard = hnsw_shards[cid]\n        results = shard.search(q, ef=64, k=k*2)\n        candidates.extend(results)\n    return topk_dedup(candidates, k)" }, style: { font_family: $mono, font_size: 15, color: "#E0F2FE", line_height: 1.7 } }
      - { id: sect-2, type: text, z: 40, x: 100, y: 1020, width: 1040, height: 0, content: { type: plain, value: "4.2 Recall-latency tuning surface" }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $primary, line_height: 1.3 } }
      - { id: p2, type: text, z: 41, x: 100, y: 1070, width: 1040, height: 0, content: { type: plain, value: "Three knobs jointly determine performance: nprobe (number of clusters touched), ef (HNSW search depth), and k_oversample (overrequest factor in each shard). Empirically, nprobe=16, ef=64, oversample=2 produces our headline results at 1B-vector scale on c7a.metal hosts." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: tbl, type: rect, z: 50, x: 100, y: 1280, width: 1040, height: 240, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
