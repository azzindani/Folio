      - { id: f1, type: text, z: 32, x: 100, y: 1020, width: 1040, height: 0, content: { type: plain, value: "→ Learned cluster routing — replace k-means with a small neural router trained on query traffic." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: f2, type: text, z: 32, x: 100, y: 1080, width: 1040, height: 0, content: { type: plain, value: "→ Cross-cluster pruning via reciprocal rank fusion to further suppress tail spikes." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: f3, type: text, z: 32, x: 100, y: 1140, width: 1040, height: 0, content: { type: plain, value: "→ Disk-resident shards for archival corpora, with predictive prefetch from query embeddings." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: oss-card, type: rect, z: 50, x: 100, y: 1300, width: 1040, height: 200, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
