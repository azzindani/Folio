      - { id: m-date-l, type: text, z: 31, x: 140, y: 1400, width: 480, height: 0, content: { type: plain, value: "PUBLISHED" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: m-date-v, type: text, z: 32, x: 140, y: 1430, width: 480, height: 0, content: { type: plain, value: "May 16, 2026" }, style: { font_family: $mono, font_size: 16, color: $primary, letter_spacing: 0.2 } }
