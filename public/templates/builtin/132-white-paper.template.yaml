      - { id: ab-divider, type: rect, z: 20, x: 100, y: 900, width: 80, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: ab-label, type: text, z: 21, x: 100, y: 940, width: 1040, height: 0, content: { type: plain, value: "ABSTRACT" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: ab-body, type: text, z: 22, x: 100, y: 980, width: 1040, height: 0, content: { type: plain, value: "We benchmark three production-grade approximate nearest-neighbor (ANN) algorithms across corpora of 100M to 2B 768-dimensional vectors, measuring query latency, recall@10, index build time, and memory footprint. We propose a hybrid retrieval architecture that combines a coarse IVF stage with a fine HNSW stage, achieving p99 latency of 18ms with 0.97 recall@10 at 1B-vector scale." }, style: { font_family: $body, font_size: 18, color: $text, line_height: 1.7 } }
      - { id: meta-card, type: rect, z: 30, x: 100, y: 1240, width: 1040, height: 240, radius: 0, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: m-authors-l, type: text, z: 31, x: 140, y: 1270, width: 480, height: 0, content: { type: plain, value: "AUTHORS" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: m-authors-v, type: text, z: 32, x: 140, y: 1300, width: 480, height: 0, content: { type: plain, value: "Dr. Yuki Tanaka\nMarcus Webber\nDr. Priya Iyer" }, style: { font_family: $heading, font_size: 18, color: $text, line_height: 1.6 } }
