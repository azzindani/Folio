      - { id: t-h-3, type: text, z: 51, x: 660, y: 1310, width: 200, height: 0, content: { type: plain, value: "P50 (ms)" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
