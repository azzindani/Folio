    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "§6 · CONCLUSION" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "What we learned." }, style: { font_family: $heading, font_size: 64, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: divider, type: rect, z: 12, x: 100, y: 320, width: 80, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: p1, type: text, z: 20, x: 100, y: 380, width: 1040, height: 0, content: { type: plain, value: "Hybrid retrieval is not a fundamentally new idea, but the engineering details determine whether it works in production. Our contribution is the specific recipe — IVF coarse routing, per-cluster HNSW shards sized to L3 cache, float16 storage, and AVX-512 distance kernels — that holds together at billion-vector scale on commodity hardware." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.75 } }
      - { id: p2, type: text, z: 21, x: 100, y: 580, width: 1040, height: 0, content: { type: plain, value: "Three engineering lessons stood out during the work. First, tail latencies, not medians, dictate user experience; design for p99.9 from day one. Second, cluster boundary effects can dominate behavior if you do not oversample, so probing factors of 0.3-0.5% and 2× oversampling are reasonable defaults. Third, memory pressure is the silent killer — float16 storage and per-cluster sharding gave us roughly 4× more usable index per dollar of RAM." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.75 } }
      - { id: future-label, type: text, z: 30, x: 100, y: 940, width: 1040, height: 0, content: { type: plain, value: "WHAT'S NEXT" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
