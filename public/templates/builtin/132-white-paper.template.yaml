_protocol: template/v1

# 8-page technical white paper — 1240×1754 A4 portrait, light-clean theme.
# Cover → exec summary → problem → solution overview → technical deep-dive
# → case study → conclusion → references/about.
meta:
  id: tmpl-white-paper
  name: White Paper · Technical (8 pages)
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, white-paper, technical, research, clean, a4]
  description: "Eight-page technical white paper with cover, executive summary, problem statement, solution overview, technical deep-dive, case study, conclusion, and references."

