_protocol: template/v1

# 5-page App Store screenshot set — 1242×2688 portrait (iPhone Pro Max),
# light-clean theme. Feature 1/2/3 → social proof → download CTA + QR.
meta:
  id: tmpl-app-store-screenshots
  name: App Store Screenshots · 5-Set
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, app-store, marketing, mobile, portrait, screenshots]
  description: "Five App Store screenshot pages: three feature highlights, social proof with reviews, and download CTA with QR code."

document:
  width: 1242
  height: 2688
  unit: px
  dpi: 96

theme:
  ref: light-clean

