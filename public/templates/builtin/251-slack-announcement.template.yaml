_protocol: template/v1

# Slack announcement share preview — 1200×630 landscape, indigo-pro.
# Megaphone icon top-left, title, summary, channel + author footer.
meta:
  id: tmpl-slack-announcement
  name: Slack Announcement
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, social, slack, announcement, internal, indigo, landscape]
  description: "Slack share-preview card with megaphone icon, announcement title, summary, and channel/author footer."

document:
  width: 1200
  height: 630
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 630
    fill: { type: solid, color: "$background" }

  # ── Left accent rail ──────────────────────────────────────
  - id: left-rail
    type: rect
    z: 1
    x: 0
    y: 0
    width: 8
    height: 630
    fill: { type: solid, color: "$primary" }

  # ── Icon background tile ──────────────────────────────────
  - id: icon-tile
    type: rect
    z: 5
    x: 70
    y: 70
    width: 96
    height: 96
    radius: 24
    fill: { type: solid, color: $primary }
  # ── Megaphone glyph ───────────────────────────────────────
  - id: icon-glyph
    type: text
    z: 6
    x: 70
    y: 88
    width: 96
    height: 0
    content: { type: plain, value: "📢" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 700
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 200
    y: 80
    width: 920
    height: 0
    content: { type: plain, value: "ANNOUNCEMENT · #general" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  # ── Title ─────────────────────────────────────────────────
  - id: title
    type: text
    z: 11
    x: 200
    y: 110
    width: 920
    height: 0
    content: { type: plain, value: "All-hands moves to Thursdays\nstarting next week" }
    style:
      font_family: $heading
      font_size: 46
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  # ── Summary ───────────────────────────────────────────────
  - id: summary
    type: text
    z: 12
    x: 200
    y: 260
    width: 920
    height: 0
    content: { type: plain, value: "We're shifting the weekly all-hands from Mondays at 9:00 to Thursdays at 16:00 CET so EMEA and APAC teammates can join without skipping family time. Recording will still be posted in #all-hands-archive." }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  # ── Decorative right shape ────────────────────────────────
  - id: deco-circle
    type: circle
    z: 2
    cx: 1130
    cy: 560
    rx: 200
    ry: 200
    fill: { type: none }
    opacity: 0.18

  # ── Footer divider ────────────────────────────────────────
  - id: footer-divider
    type: rect
    z: 20
    x: 70
    y: 520
    width: 1060
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Channel pill ──────────────────────────────────────────
  - id: channel-pill
    type: rect
    z: 21
    x: 70
    y: 550
    width: 220
    height: 50
    radius: 25
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: channel-text
    type: text
    z: 22
    x: 70
    y: 564
    width: 220
    height: 0
    content: { type: plain, value: "#all-hands" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text
      text_align: center
      line_height: 1.3

  # ── Author avatar ─────────────────────────────────────────
  - id: avatar
    type: circle
    z: 23
    cx: 330
    cy: 575
    rx: 24
    ry: 24
    fill: { type: solid, color: "$primary" }

  - id: avatar-initial
    type: text
    z: 24
    x: 306
    y: 562
    width: 48
    height: 0
    content: { type: plain, value: "K" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3

  # ── Author name ───────────────────────────────────────────
  - id: author
    type: text
    z: 25
    x: 370
    y: 565
    width: 760
    height: 0
    content: { type: plain, value: "Posted by Karim Haddad · Chief of Staff · 5 min ago" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 500
      color: $text_muted
      line_height: 1.3

slots:
  - { id: title,   path: "layers[5].content.value",  type: text, hint: "Announcement title",    default: "All-hands moves to Thursdays\nstarting next week" }
  - { id: summary, path: "layers[6].content.value",  type: text, hint: "Announcement summary",  default: "We're shifting the weekly all-hands from Mondays at 9:00 to Thursdays at 16:00 CET so EMEA and APAC teammates can join without skipping family time. Recording will still be posted in #all-hands-archive." }
  - { id: channel, path: "layers[10].content.value", type: text, hint: "Channel name",          default: "#all-hands" }
  - { id: author,  path: "layers[13].content.value", type: text, hint: "Author byline",         default: "Posted by Karim Haddad · Chief of Staff · 5 min ago" }
