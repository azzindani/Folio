_protocol: template/v1

# Hotel keycard — 1500×950 landscape (CR80 ratio), dark-tech theme.
# Hotel name top-left, small monogram, large room number bottom-right,
# guest name + valid-through dates, magnetic strip across the bottom,
# fine-print property notice.
meta:
  id: tmpl-hotel-keycard
  name: Hotel Keycard
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [keycard, hotel, hospitality, card, dark, landscape]
  description: "Hotel room keycard with hotel name, room number, guest, valid-through dates, and magnetic stripe band."

document:
  width: 1500
  height: 950
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 950
    fill: { type: solid, color: $background }
  # ── Soft glow accent ──────────────────────────────────────
  - id: glow
    type: circle
    z: 2
    cx: 1300
    cy: 200
    rx: 360
    ry: 360
    fill: { type: none }
    opacity: 0.22

  # ── Top monogram circle ───────────────────────────────────
  - id: monogram-circle
    type: circle
    z: 5
    cx: 130
    cy: 130
    rx: 48
    ry: 48
    fill: { type: solid, color: "$primary" }

  - id: monogram-letter
    type: text
    z: 6
    x: 82
    y: 98
    width: 96
    height: 0
    content: { type: plain, value: "M" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3

  # ── Hotel name ────────────────────────────────────────────
  - id: hotel-name
    type: text
    z: 10
    x: 200
    y: 100
    width: 900
    height: 0
    content: { type: plain, value: "MERIDIAN GRAND" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 700
      color: $text
      letter_spacing: 0.16
      line_height: 1.2

  - id: hotel-sub
    type: text
    z: 11
    x: 200
    y: 152
    width: 900
    height: 0
    content: { type: plain, value: "Hotel & Residences  ·  Kuala Lumpur" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted
      letter_spacing: 0.08
      line_height: 1.3

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 280
    width: 700
    height: 0
    content: { type: plain, value: "GUEST KEY" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $secondary
      letter_spacing: 0.4
      text_transform: uppercase

  # ── Guest name ────────────────────────────────────────────
  - id: guest-label
    type: text
    z: 21
    x: 80
    y: 320
    width: 700
    height: 0
    content: { type: plain, value: "GUEST" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

  - id: guest-name
    type: text
    z: 22
    x: 80
    y: 348
    width: 700
    height: 0
    content: { type: plain, value: "Ms. Amara Okafor" }
    style:
      font_family: $heading
      font_size: 38
      font_weight: 600
      color: $text
      line_height: 1.2

  # ── Valid-through ─────────────────────────────────────────
  - id: valid-label
    type: text
    z: 23
    x: 80
    y: 430
    width: 350
    height: 0
    content: { type: plain, value: "VALID THROUGH" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

  - id: valid-value
    type: text
    z: 24
    x: 80
    y: 458
    width: 700
    height: 0
    content: { type: plain, value: "May 16  →  May 19, 2026" }
    style:
      font_family: $mono
      font_size: 24
      font_weight: 600
      color: $text
      line_height: 1.2

  # ── Big room number bottom-right ──────────────────────────
  - id: room-label
    type: text
    z: 30
    x: 800
    y: 280
    width: 620
    height: 0
    content: { type: plain, value: "ROOM" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $secondary
      letter_spacing: 0.4
      text_align: right
      text_transform: uppercase

  - id: room-number
    type: text
    z: 31
    x: 800
    y: 320
    width: 620
    height: 0
    content: { type: plain, value: "1842" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 800
      color: $primary
      text_align: right
      line_height: 1
      letter_spacing: -0.04

  - id: floor-line
    type: text
    z: 32
    x: 800
    y: 540
    width: 620
    height: 0
    content: { type: plain, value: "18th floor  ·  king suite" }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted
      text_align: right
      line_height: 1.3

  # ── Magnetic strip band ───────────────────────────────────
  - id: mag-strip
    type: rect
    z: 40
    x: 0
    y: 720
    width: 1500
    height: 100
    fill: { type: solid, color: "#0A0A14" }

  - id: mag-band-1
    type: rect
    z: 41
    x: 0
    y: 720
    width: 1500
    height: 3
    fill: { type: solid, color: "$border" }

  - id: mag-band-2
    type: rect
    z: 42
    x: 0
    y: 817
    width: 1500
    height: 3
    fill: { type: solid, color: "$border" }

  # ── Footer fine print ─────────────────────────────────────
  - id: fine-print
    type: text
    z: 50
    x: 80
    y: 870
    width: 1340
    height: 0
    content: { type: plain, value: "PROPERTY OF MERIDIAN GRAND  ·  IF FOUND, PLEASE RETURN TO FRONT DESK  ·  +60 3 5555 0102" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.32
      text_align: center
      line_height: 1.3

slots:
  - { id: hotel_name,    path: "layers[4].content.value",  type: text, hint: "Hotel brand name",     default: "MERIDIAN GRAND" }
  - { id: guest_name,    path: "layers[8].content.value",  type: text, hint: "Guest full name",      default: "Ms. Amara Okafor" }
  - { id: valid_through, path: "layers[10].content.value", type: text, hint: "Valid through range",  default: "May 16  →  May 19, 2026" }
  - { id: room_number,   path: "layers[12].content.value", type: text, hint: "Room number (big)",    default: "1842" }
