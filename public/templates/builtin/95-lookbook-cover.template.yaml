_protocol: template/v1

# Editorial lookbook cover — 1240×1600 portrait, editorial-cream theme.
# Distinct from existing lookbook-page: high-fashion magazine-cover layout
# with split image-block, massive serif title, season eyebrow, designer
# credit at base, vertical fold line as visual ruler.
meta:
  id: tmpl-lookbook-cover
  name: Lookbook Cover · Editorial
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [lookbook, cover, editorial, fashion, magazine, portrait]
  description: "Editorial lookbook cover with split image-block, huge serif title, season eyebrow, and designer credit."

document:
  width: 1240
  height: 1600
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1600
    fill: { type: solid, color: "$background" }

  # ── Image placeholder block (lower 60%) ───────────────────
  - id: image-block
    type: rect
    z: 5
    x: 80
    y: 560
    width: 1080
    height: 880
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 60 }
        - { color: "#3D2C1F", position: 100 }

  - id: image-noise-overlay
    type: rect
    z: 6
    x: 80
    y: 560
    width: 1080
    height: 880
    fill:
      type: noise
      opacity: 0.08
      frequency: 0.9
      octaves: 2

  # Decorative figure silhouette (two circles + rect = abstract pose)
  - id: figure-head
    type: circle
    z: 10
    cx: 620
    cy: 780
    rx: 90
    ry: 90
    fill: { type: solid, color: "$background" }
    opacity: 0.18

  - id: figure-body
    type: rect
    z: 11
    x: 540
    y: 880
    width: 160
    height: 400
    radius: 80
    fill: { type: solid, color: "$background" }
    opacity: 0.18

  # ── Top frame line ────────────────────────────────────────
  - id: top-rule
    type: rect
    z: 15
    x: 80
    y: 80
    width: 1080
    height: 1
    fill: { type: solid, color: "$text" }

  # ── Season eyebrow (top-left) ─────────────────────────────
  - id: season
    type: text
    z: 20
    x: 80
    y: 110
    width: 600
    height: 0
    content: { type: plain, value: "AUTUMN 2026" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $text
      letter_spacing: 0.6
      text_transform: uppercase

  # ── Issue meta (top-right) ────────────────────────────────
  - id: issue
    type: text
    z: 21
    x: 540
    y: 110
    width: 620
    height: 0
    content: { type: plain, value: "ISSUE NO. 014 · VOL. III" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.6
      text_align: right
      text_transform: uppercase

  # ── Title (huge serif, hero) ──────────────────────────────
  - id: title-line-1
    type: text
    z: 30
    x: 80
    y: 200
    width: 1080
    height: 0
    content: { type: plain, value: "Quiet" }
    style:
      font_family: $heading
      font_size: 240
      font_weight: 700
      font_style: italic
      color: $text
      line_height: 0.92
      letter_spacing: -0.04

  - id: title-line-2
    type: text
    z: 31
    x: 80
    y: 380
    width: 1080
    height: 0
    content: { type: plain, value: "Linen" }
    style:
      font_family: $heading
      font_size: 240
      font_weight: 700
      font_style: italic
      color: $primary
      line_height: 0.92
      letter_spacing: -0.04
      text_align: right

  # ── Subtitle ─────────────────────────────────────────────
  - id: subtitle
    type: text
    z: 32
    x: 80
    y: 510
    width: 1080
    height: 0
    content: { type: plain, value: "A study in soft structure, warm shadow, and unhurried hands." }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: $text_muted
      line_height: 1.4

  # ── Vertical fold-line ruler (decorative) ─────────────────
  - id: fold-line
    type: rect
    z: 40
    x: 80
    y: 80
    width: 1
    height: 1440
    fill: { type: solid, color: "$text" }
    opacity: 0.3

  # ── Image label ribbon (lower-left of image) ──────────────
  - id: ribbon-bg
    type: rect
    z: 50
    x: 80
    y: 1380
    width: 380
    height: 60
    fill: { type: solid, color: "$background" }

  - id: ribbon-label
    type: text
    z: 51
    x: 100
    y: 1398
    width: 340
    height: 0
    content: { type: plain, value: "LOOK 01 · NATURAL FIBRE" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $text
      letter_spacing: 0.4
      text_transform: uppercase

  # ── Footer rule ──────────────────────────────────────────
  - id: footer-rule
    type: rect
    z: 60
    x: 80
    y: 1480
    width: 1080
    height: 1
    fill: { type: solid, color: "$text" }

  # ── Designer credit + collection ─────────────────────────
  - id: designer
    type: text
    z: 61
    x: 80
    y: 1510
    width: 600
    height: 0
    content: { type: plain, value: "By Mireille Aoyama" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 600
      font_style: italic
      color: $text
      line_height: 1.2

  - id: collection
    type: text
    z: 62
    x: 540
    y: 1518
    width: 620
    height: 0
    content: { type: plain, value: "THE LINEN ESSAY · 18 LOOKS" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.4
      text_align: right
      text_transform: uppercase

slots:
  - { id: title,    path: "layers[8].content.value",  type: text, hint: "Title line 1 (display word)",    default: "Quiet" }
  - { id: season,   path: "layers[6].content.value",  type: text, hint: "Season label (eyebrow)",         default: "AUTUMN 2026" }
  - { id: designer, path: "layers[15].content.value", type: text, hint: "Designer credit",                default: "By Mireille Aoyama" }
