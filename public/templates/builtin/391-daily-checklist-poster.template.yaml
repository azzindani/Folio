animations:
  title:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  card-1-bg:
    enter: { type: slide_right, duration: 500, delay: 300, easing: ease-out }
  card-2-bg:
    enter: { type: slide_right, duration: 500, delay: 400, easing: ease-out }
  card-3-bg:
    enter: { type: slide_right, duration: 500, delay: 500, easing: ease-out }
  card-4-bg:
    enter: { type: slide_right, duration: 500, delay: 600, easing: ease-out }
  card-5-bg:
    enter: { type: slide_right, duration: 500, delay: 700, easing: ease-out }

slots:
  - { id: title,        path: "layers[3].content.value",  type: text, hint: "Poster title",       default: "Today's 5\npriorities." }
  - { id: task_1,       path: "layers[7].content.value",  type: text, hint: "Task 01",            default: "Lorem ipsum dolor sit amet task." }
  - { id: task_1_time,  path: "layers[8].content.value",  type: text, hint: "Task 01 time",       default: "~45 min · 09:00" }
  - { id: task_2,       path: "layers[12].content.value", type: text, hint: "Task 02",            default: "Lorem ipsum dolor sit amet task." }
  - { id: task_2_time,  path: "layers[13].content.value", type: text, hint: "Task 02 time",       default: "~30 min · 10:30" }
  - { id: task_3,       path: "layers[17].content.value", type: text, hint: "Task 03",            default: "Lorem ipsum dolor sit amet task." }
  - { id: task_3_time,  path: "layers[18].content.value", type: text, hint: "Task 03 time",       default: "~60 min · 13:00" }
  - { id: task_4,       path: "layers[22].content.value", type: text, hint: "Task 04",            default: "Lorem ipsum dolor sit amet task." }
  - { id: task_4_time,  path: "layers[23].content.value", type: text, hint: "Task 04 time",       default: "~20 min · 15:00" }
  - { id: task_5,       path: "layers[27].content.value", type: text, hint: "Task 05",            default: "Lorem ipsum dolor sit amet task." }
  - { id: task_5_time,  path: "layers[28].content.value", type: text, hint: "Task 05 time",       default: "~15 min · 17:00" }
  - { id: footer,       path: "layers[29].content.value", type: text, hint: "Closing line",       default: "Cross them off. Win the day." }
