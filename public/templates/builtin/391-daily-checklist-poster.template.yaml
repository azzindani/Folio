_protocol: template/v1

# Single-page daily checklist poster · 5 priority cards · pastel-dream.
meta:
  id: tmpl-daily-checklist-poster
  name: Daily Checklist Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, productivity, checklist, daily-planner, pastel-dream, "4-5"]
  description: "Single-page daily planner poster with 5 numbered priority cards, time estimates, and a closer line."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: $background }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "DAILY" }
    style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }

  - id: title
    type: text
    z: 11
    x: 80
    y: 170
    width: 1040
    height: 0
    content: { type: plain, value: "Today's 5\npriorities." }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 800
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  # ── Card 01 ─────────────────────────────────────────────
  - { id: card-1-bg, type: rect, z: 20, x: 80, y: 420, width: 1040, height: 150, radius: 16, fill: { type: solid, color: "$surface" } }
  - { id: card-1-check, type: rect, z: 21, x: 110, y: 458, width: 44, height: 44, radius: 8, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 3 } }
  - id: card-1-number
    type: text
    z: 22
    x: 180
    y: 458
    width: 80
    height: 0
    content: { type: plain, value: "01" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, letter_spacing: 0.16 }
  - id: card-1-task
    type: text
    z: 23
    x: 260
    y: 452
    width: 720
    height: 0
    content: { type: plain, value: "Lorem ipsum dolor sit amet task." }
    style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text, line_height: 1.3, letter_spacing: -0.01 }
  - id: card-1-time
    type: text
    z: 24
    x: 260
    y: 504
    width: 720
    height: 0
    content: { type: plain, value: "~45 min · 09:00" }
    style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.16 }

  # ── Card 02 ─────────────────────────────────────────────
