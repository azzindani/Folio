_protocol: template/v1

# Save the date — 1080×1080 square. Light-clean elegant.
# Couple names flanking script ampersand, huge day number, formal footnote.
meta:
  id: tmpl-save-the-date
  name: Save the Date
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, wedding, save-the-date, social, square, elegant]

document:
  width: 1080
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1080
    fill: { type: solid, color: "$background" }

  - id: corner-tl
    type: circle
    z: 3
    cx: -60
    cy: -40
    rx: 240
    ry: 240
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.18

  - id: corner-br
    type: circle
    z: 3
    cx: 1140
    cy: 1120
    rx: 280
    ry: 280
    fill:
      type: radial
      stops:
        - { color: "$accent", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.18

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 180
    width: 920
    height: 0
    content: { type: plain, value: "S A V E   T H E   D A T E" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $primary
      text_align: center
      letter_spacing: 0.6
      text_transform: uppercase

  - id: name-a
    type: text
    z: 20
    x: 80
    y: 280
    width: 920
    height: 0
    content: { type: plain, value: "Mira Halverson" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 500
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01

  - id: ampersand
    type: text
    z: 21
    x: 80
    y: 380
    width: 920
    height: 0
    content: { type: plain, value: "&" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 400
      font_style: italic
      color: $accent
      text_align: center
      line_height: 1.1

  - id: name-b
    type: text
    z: 22
    x: 80
    y: 500
    width: 920
    height: 0
    content: { type: plain, value: "Rohan Patel" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 500
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01

  - id: divider
    type: rect
    z: 30
    x: 490
    y: 620
    width: 100
    height: 2
    fill: { type: solid, color: "$accent" }

  - id: day-number
    type: text
    z: 31
    x: 80
    y: 660
    width: 920
    height: 0
    content: { type: plain, value: "18" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 700
      color: $primary
      text_align: center
      line_height: 1
      letter_spacing: -0.03

  - id: month-year
    type: text
    z: 32
    x: 80
    y: 870
    width: 920
    height: 0
    content: { type: plain, value: "JULY · 2026" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.4
      text_transform: uppercase
      line_height: 1.2

  - id: venue-city
    type: text
    z: 33
    x: 80
    y: 920
    width: 920
    height: 0
    content: { type: plain, value: "Brooklyn, New York" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      text_align: center
      line_height: 1.4

  - id: footnote
    type: text
    z: 40
    x: 80
    y: 1000
    width: 920
    height: 0
    content: { type: plain, value: "FORMAL INVITATION TO FOLLOW" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.4
      text_transform: uppercase

slots:
  - { id: name_a,      path: "layers[4].content.value",  type: text, hint: "First person name",      default: "Mira Halverson" }
  - { id: name_b,      path: "layers[6].content.value",  type: text, hint: "Second person name",     default: "Rohan Patel" }
  - { id: day_number,  path: "layers[8].content.value",  type: text, hint: "Day of month (digits)",  default: "18" }
  - { id: month_year,  path: "layers[9].content.value",  type: text, hint: "Month + year stacked",   default: "JULY · 2026" }
  - { id: venue_city,  path: "layers[10].content.value", type: text, hint: "Venue / city",           default: "Brooklyn, New York" }
