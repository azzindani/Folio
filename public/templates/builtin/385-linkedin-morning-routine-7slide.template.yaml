        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "7 / 7" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover title",           default: "My 5am\nMorning Routine" }
  - { id: cover_tagline,  path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",         default: "5 habits that changed my mornings — and my output." }
  - { id: why_heading,    path: "pages[1].layers[3].content.value", type: text, hint: "Why heading",           default: "Mornings set the\ntone for the day." }
  - { id: why_body,       path: "pages[1].layers[4].content.value", type: text, hint: "Why body",              default: "Decisions made before 9am compound through the rest of the day. Win the first 90 minutes and you've already banked momentum." }
  - { id: habit_1_title,  path: "pages[2].layers[5].content.value", type: text, hint: "Habit 1 title",         default: "Wake without\nthe phone." }
  - { id: habit_1_why,    path: "pages[2].layers[6].content.value", type: text, hint: "Habit 1 why",           default: "First 15 minutes belong to you — not the inbox." }
  - { id: habit_2_title,  path: "pages[3].layers[5].content.value", type: text, hint: "Habit 2 title",         default: "Water +\nsunlight." }
  - { id: habit_2_why,    path: "pages[3].layers[6].content.value", type: text, hint: "Habit 2 why",           default: "Hydration wakes the body, light syncs the brain clock." }
  - { id: habit_3_title,  path: "pages[4].layers[5].content.value", type: text, hint: "Habit 3 title",         default: "Move for\n20 minutes." }
  - { id: habit_3_why,    path: "pages[4].layers[6].content.value", type: text, hint: "Habit 3 why",           default: "Movement before screens — body first, work second." }
  - { id: habit_4_title,  path: "pages[5].layers[5].content.value", type: text, hint: "Habit 4 title",         default: "Plan your\ntop 3." }
  - { id: habit_4_why,    path: "pages[5].layers[6].content.value", type: text, hint: "Habit 4 why",           default: "Three priorities beat a list of twenty every time." }
  - { id: cta_heading,    path: "pages[6].layers[6].content.value", type: text, hint: "CTA heading",           default: "Pick one to try\ntomorrow." }
  - { id: cta_sub,        path: "pages[6].layers[7].content.value", type: text, hint: "CTA subline",           default: "Save this · Follow for one routine a week." }
