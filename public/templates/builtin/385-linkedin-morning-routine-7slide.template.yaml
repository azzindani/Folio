_protocol: template/v1

# LinkedIn 7-slide carousel · "My 5am Morning Routine" · 5 habit cards + cover + CTA.
meta:
  id: tmpl-linkedin-morning-routine-7slide
  name: LinkedIn Morning Routine (7 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, productivity, habits, morning-routine, pastel-dream, "4-5"]
  description: "7-slide LinkedIn carousel walking through a 5am routine: cover, why, 5 timestamped habits, CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 160, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: glow-circle, type: circle, z: 3, cx: 880, cy: 280, rx: 220, ry: 220, fill: { type: solid, color: "$accent" }, opacity: 0.18 }
      - id: eyebrow
        type: text
        z: 10
        x: 72
        y: 420
        width: 936
        height: 0
        content: { type: plain, value: "PRODUCTIVITY · 7 SLIDES" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 72
        y: 480
        width: 936
        height: 0
        content: { type: plain, value: "My 5am\nMorning Routine" }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 12
        x: 72
        y: 780
        width: 936
        height: 0
        content: { type: plain, value: "5 habits that changed my mornings — and my output." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: swipe-hint
        type: text
        z: 13
        x: 72
        y: 900
        width: 936
        height: 0
        content: { type: plain, value: "Swipe → for the full routine" }
        style: { font_family: $body, font_size: 20, font_weight: 600, color: $accent }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "1 / 7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Why mornings matter ──────────────────────────
  - id: why
    label: Why mornings matter
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 72
        y: 140
        width: 936
        height: 0
        content: { type: plain, value: "WHY" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: heading
        type: text
        z: 11
        x: 72
        y: 200
        width: 936
        height: 0
        content: { type: plain, value: "Mornings set the\ntone for the day." }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 12
        x: 72
        y: 540
        width: 936
        height: 0
        content: { type: plain, value: "Decisions made before 9am compound through the rest of the day. Win the first 90 minutes and you've already banked momentum." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: pull-stat
        type: text
        z: 13
        x: 72
        y: 880
        width: 936
        height: 0
        content: { type: plain, value: "“Energy and focus peak in the morning — protect that window.”" }
        style: { font_family: $heading, font_size: 32, font_weight: 600, color: $primary, line_height: 1.4, letter_spacing: -0.01 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "2 / 7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · 01 Wake without phone ────────────────────────
  - id: habit-1
    label: 01 Wake without phone
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: number-chip, type: rect, z: 5, x: 72, y: 140, width: 100, height: 44, radius: 22, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 6
        x: 72
        y: 152
        width: 100
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.16 }
      - id: timestamp
        type: text
        z: 10
        x: 200
        y: 152
        width: 600
        height: 0
        content: { type: plain, value: "05:00 — 05:15" }
        style: { font_family: $mono, font_size: 18, font_weight: 600, color: $accent, letter_spacing: 0.24 }
      - id: habit-title
        type: text
        z: 11
        x: 72
        y: 260
        width: 936
        height: 0
        content: { type: plain, value: "Wake without\nthe phone." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: habit-why
        type: text
        z: 12
        x: 72
        y: 760
        width: 936
        height: 0
        content: { type: plain, value: "First 15 minutes belong to you — not the inbox." }
        style: { font_family: $body, font_size: 30, color: $text, line_height: 1.4 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "3 / 7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · 02 Water + sun ───────────────────────────────
  - id: habit-2
    label: 02 Water + sun
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: number-chip, type: rect, z: 5, x: 72, y: 140, width: 100, height: 44, radius: 22, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 6
        x: 72
        y: 152
        width: 100
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.16 }
      - id: timestamp
        type: text
        z: 10
        x: 200
        y: 152
        width: 600
        height: 0
        content: { type: plain, value: "05:15 — 05:30" }
        style: { font_family: $mono, font_size: 18, font_weight: 600, color: $accent, letter_spacing: 0.24 }
      - id: habit-title
        type: text
        z: 11
        x: 72
        y: 260
        width: 936
        height: 0
        content: { type: plain, value: "Water +\nsunlight." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: habit-why
        type: text
        z: 12
        x: 72
        y: 760
        width: 936
        height: 0
        content: { type: plain, value: "Hydration wakes the body, light syncs the brain clock." }
        style: { font_family: $body, font_size: 30, color: $text, line_height: 1.4 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "4 / 7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · 03 Move 20 min ───────────────────────────────
  - id: habit-3
    label: 03 Move 20 min
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: number-chip, type: rect, z: 5, x: 72, y: 140, width: 100, height: 44, radius: 22, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 6
        x: 72
        y: 152
        width: 100
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.16 }
      - id: timestamp
        type: text
        z: 10
        x: 200
        y: 152
        width: 600
        height: 0
        content: { type: plain, value: "05:30 — 05:50" }
        style: { font_family: $mono, font_size: 18, font_weight: 600, color: $accent, letter_spacing: 0.24 }
      - id: habit-title
        type: text
        z: 11
        x: 72
        y: 260
        width: 936
        height: 0
        content: { type: plain, value: "Move for\n20 minutes." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: habit-why
        type: text
        z: 12
        x: 72
        y: 760
        width: 936
        height: 0
        content: { type: plain, value: "Movement before screens — body first, work second." }
        style: { font_family: $body, font_size: 30, color: $text, line_height: 1.4 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "5 / 7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 6 · 04 Plan top 3 ────────────────────────────────
  - id: habit-4
    label: 04 Plan top 3
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: number-chip, type: rect, z: 5, x: 72, y: 140, width: 100, height: 44, radius: 22, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 6
        x: 72
        y: 152
        width: 100
        height: 0
        content: { type: plain, value: "04" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.16 }
      - id: timestamp
        type: text
        z: 10
        x: 200
        y: 152
        width: 600
        height: 0
        content: { type: plain, value: "05:50 — 06:00" }
        style: { font_family: $mono, font_size: 18, font_weight: 600, color: $accent, letter_spacing: 0.24 }
      - id: habit-title
        type: text
        z: 11
        x: 72
        y: 260
        width: 936
        height: 0
        content: { type: plain, value: "Plan your\ntop 3." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: habit-why
        type: text
        z: 12
        x: 72
        y: 760
        width: 936
        height: 0
        content: { type: plain, value: "Three priorities beat a list of twenty every time." }
        style: { font_family: $body, font_size: 30, color: $text, line_height: 1.4 }
      - id: pagination
        type: text
        z: 50
        x: 72
        y: 1280
        width: 936
        height: 0
        content: { type: plain, value: "6 / 7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 7 · 05 Deep work + CTA ───────────────────────────
  - id: cta
    label: 05 Deep work + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 200, stops: [{ color: "$primary", position: 0 }, { color: "$accent", position: 100 }] }, opacity: 0.92 }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "#FFFFFF" } }
      - id: number-chip
        type: rect
        z: 5
        x: 72
        y: 140
        width: 100
        height: 44
        radius: 22
        fill: { type: solid, color: "rgba(255,255,255,0.3)" }
      - id: number
        type: text
        z: 6
        x: 72
        y: 152
        width: 100
        height: 0
        content: { type: plain, value: "05" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.16 }
