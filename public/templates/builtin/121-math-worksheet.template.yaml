_protocol: template/v1

# Math worksheet — A4 portrait (1240×1754).
# Title bar, name + date input fields, 4 sections (addition, subtraction,
# multiplication, division — 5 problems each in 2-col grid), footer.
meta:
  id: tmpl-math-worksheet
  name: Math Worksheet
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, education, worksheet, math, printable, a4]
  description: "Printable A4 math practice worksheet with four operations and twenty problems."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  - id: title-bar
    type: rect
    z: 1
    x: 60
    y: 60
    width: 1120
    height: 110
    radius: 12
    fill: { type: solid, color: "$primary" }

  - id: title
    type: text
    z: 2
    x: 90
    y: 86
    width: 1060
    height: 0
    content: { type: plain, value: "MATH PRACTICE" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.12
      text_transform: uppercase

  - id: title-sub
    type: text
    z: 3
    x: 90
    y: 138
    width: 1060
    height: 0
    content: { type: plain, value: "Grade 3 · Four Operations · 20 Problems" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 500
      color: "#FFFFFF"

  - id: name-label
    type: text
    z: 5
    x: 60
    y: 200
    width: 80
    height: 0
    content: { type: plain, value: "NAME" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: "$text_muted"
      letter_spacing: 0.32
      text_transform: uppercase

  - id: name-line
    type: rect
    z: 6
    x: 150
    y: 230
    width: 500
    height: 2
    fill: { type: solid, color: "$text" }

  - id: date-label
    type: text
    z: 7
    x: 720
    y: 200
    width: 80
    height: 0
    content: { type: plain, value: "DATE" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: "$text_muted"
      letter_spacing: 0.32
      text_transform: uppercase

  - id: date-line
    type: rect
    z: 8
    x: 810
    y: 230
    width: 370
    height: 2
    fill: { type: solid, color: "$text" }

  # Section 1: Addition
  - id: sec-1-header
    type: rect
    z: 10
    x: 60
    y: 280
    width: 1120
    height: 50
    radius: 6
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 1 }

  - id: sec-1-title
    type: text
    z: 11
    x: 80
    y: 295
    width: 1080
    height: 0
    content: { type: plain, value: "① ADDITION — Solve each problem." }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: "$text"

  - id: sec-1-problems-l
    type: text
    z: 12
    x: 120
    y: 360
    width: 480
    height: 0
    content:
      type: plain
      value: "1)   247  +  136  =  ______\n\n2)   389  +  205  =  ______\n\n3)   428  +  357  =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  - id: sec-1-problems-r
    type: text
    z: 13
    x: 640
    y: 360
    width: 480
    height: 0
    content:
      type: plain
      value: "4)   516  +  274  =  ______\n\n5)   683  +  148  =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  # Section 2: Subtraction
  - id: sec-2-header
    type: rect
    z: 15
    x: 60
    y: 600
    width: 1120
    height: 50
    radius: 6
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 1 }

  - id: sec-2-title
    type: text
    z: 16
    x: 80
    y: 615
    width: 1080
    height: 0
    content: { type: plain, value: "② SUBTRACTION — Show your work." }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: "$text"

  - id: sec-2-problems-l
    type: text
    z: 17
    x: 120
    y: 680
    width: 480
    height: 0
    content:
      type: plain
      value: "1)   852  −  319  =  ______\n\n2)   724  −  286  =  ______\n\n3)   916  −  457  =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  - id: sec-2-problems-r
    type: text
    z: 18
    x: 640
    y: 680
    width: 480
    height: 0
    content:
      type: plain
      value: "4)   605  −  238  =  ______\n\n5)   430  −  175  =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  # Section 3: Multiplication
  - id: sec-3-header
    type: rect
    z: 20
    x: 60
    y: 920
    width: 1120
    height: 50
    radius: 6
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 1 }

  - id: sec-3-title
    type: text
    z: 21
    x: 80
    y: 935
    width: 1080
    height: 0
    content: { type: plain, value: "③ MULTIPLICATION — Find each product." }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: "$text"

  - id: sec-3-problems-l
    type: text
    z: 22
    x: 120
    y: 1000
    width: 480
    height: 0
    content:
      type: plain
      value: "1)    24  ×  6   =  ______\n\n2)    37  ×  4   =  ______\n\n3)    58  ×  7   =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  - id: sec-3-problems-r
    type: text
    z: 23
    x: 640
    y: 1000
    width: 480
    height: 0
    content:
      type: plain
      value: "4)    46  ×  9   =  ______\n\n5)    72  ×  8   =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  # Section 4: Division
  - id: sec-4-header
    type: rect
    z: 25
    x: 60
    y: 1240
    width: 1120
    height: 50
    radius: 6
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 1 }

  - id: sec-4-title
    type: text
    z: 26
    x: 80
    y: 1255
    width: 1080
    height: 0
    content: { type: plain, value: "④ DIVISION — Solve. Show remainders if any." }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: "$text"

  - id: sec-4-problems-l
    type: text
    z: 27
    x: 120
    y: 1320
    width: 480
    height: 0
    content:
      type: plain
      value: "1)    96  ÷  4   =  ______\n\n2)   144  ÷  6   =  ______\n\n3)   175  ÷  5   =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  - id: sec-4-problems-r
    type: text
    z: 28
    x: 640
    y: 1320
    width: 480
    height: 0
    content:
      type: plain
      value: "4)   234  ÷  9   =  ______\n\n5)   312  ÷  8   =  ______"
    style:
      font_family: $mono
      font_size: 22
      color: "$text"
      line_height: 2.0
      letter_spacing: 0.05

  - id: footer-rule
    type: rect
    z: 35
    x: 60
    y: 1620
    width: 1120
    height: 1
    fill: { type: solid, color: "$border" }

  - id: footer-left
    type: text
    z: 36
    x: 60
    y: 1650
    width: 560
    height: 0
    content: { type: plain, value: "★ Remember: check your work before turning in!" }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: "$text_muted"

  - id: footer-right
    type: text
    z: 37
    x: 620
    y: 1650
    width: 560
    height: 0
    content: { type: plain, value: "Score: ___ / 20      Answer key on reverse." }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: "$text_muted"
      text_align: right

slots:
  - { id: title,    path: "layers[2].content.value",  type: text, hint: "Worksheet title",   default: "MATH PRACTICE" }
  - { id: subtitle, path: "layers[3].content.value",  type: text, hint: "Grade / subtitle",  default: "Grade 3 · Four Operations · 20 Problems" }
