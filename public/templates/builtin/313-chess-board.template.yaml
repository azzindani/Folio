    z: 1
    x: 80
    y: 80
    width: 1040
    height: 2
    fill: { type: solid, color: "$text" }

  - id: tournament-eyebrow
    type: text
    z: 2
    x: 80
    y: 100
    width: 1040
    height: 0
    content: { type: plain, value: "ROUND 7 · CLASSICAL TIME CONTROL" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: tournament-title
    type: text
    z: 3
    x: 80
    y: 130
    width: 1040
    height: 0
    content: { type: plain, value: "THE LONDON OPEN 2026" }
