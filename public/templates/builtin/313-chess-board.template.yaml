# Tournament chess board — 1200×1200 square, editorial-cream.
# 8×8 alternating squares, file labels A-H, rank labels 1-8, decorative border, tournament header.
meta:
  id: tmpl-chess-board
  name: Chess Board — Tournament
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, chess, board, game, tournament, editorial, square]
  description: "Tournament chess board diagram with 8x8 alternating squares, file and rank labels, decorative border, and tournament header."

document:
  width: 1200
  height: 1200
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

