_protocol: template/v1

# Feature launch announcement poster. LinkedIn 4:5 portrait.
# Eyebrow + huge feature name + subtitle + 3 highlight cards + CTA.
meta:
  id: tmpl-feature-launch-poster
  name: Feature Launch Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, product, launch, announcement, "4-5"]
  description: "LinkedIn 4:5 product launch with feature name, highlight cards, and CTA chip."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: neon-bloom

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: linear, angle: 160, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }

  - { id: accent-dot, type: circle, z: 5, cx: 1110, cy: 130, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "LAUNCHED" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.4, text_transform: uppercase }

  - id: feature-name
    type: text
    z: 21
    x: 80
    y: 180
    width: 1040
    height: 0
    content: { type: plain, value: "Dark Mode 2.0" }
    style: { font_family: $heading, font_size: 104, font_weight: 900, color: $text, line_height: 0.95, letter_spacing: -0.04 }

  - id: subtitle
    type: text
    z: 22
    x: 80
    y: 340
    width: 1040
    height: 0
    content: { type: plain, value: "Now with system sync, 3 accent palettes, and per-tab override." }
    style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 }

  - id: divider
    type: rect
    z: 10
    x: 80
    y: 500
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.25

  - id: highlights-label
    type: text
    z: 30
    x: 80
    y: 530
    width: 1040
    height: 0
    content: { type: plain, value: "WHAT'S NEW" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }

  - { id: card-1, type: rect, z: 40, x: 80, y: 590, width: 333, height: 320, radius: 16, fill: { type: solid, color: "$surface" } }
  - id: card-1-num
    type: text
    z: 41
    x: 112
    y: 620
    width: 280
    height: 0
    content: { type: plain, value: "01" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36 }
  - id: card-1-title
    type: text
    z: 42
    x: 112
    y: 670
    width: 280
    height: 0
    content: { type: plain, value: "System sync" }
    style: { font_family: $heading, font_size: 30, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.01 }
  - id: card-1-body
    type: text
    z: 43
    x: 112
    y: 740
    width: 280
    height: 0
    content: { type: plain, value: "Match OS theme instantly. Switches at sunset, wakes light." }
    style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.55 }

  - { id: card-2, type: rect, z: 40, x: 433, y: 590, width: 333, height: 320, radius: 16, fill: { type: solid, color: "$surface" } }
  - id: card-2-num
    type: text
    z: 41
    x: 465
    y: 620
    width: 280
    height: 0
    content: { type: plain, value: "02" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36 }
  - id: card-2-title
    type: text
    z: 42
    x: 465
    y: 670
    width: 280
    height: 0
    content: { type: plain, value: "3 accent palettes" }
    style: { font_family: $heading, font_size: 30, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.01 }
  - id: card-2-body
    type: text
    z: 43
    x: 465
    y: 740
    width: 280
    height: 0
    content: { type: plain, value: "Pick neon, ember, or steel. WCAG-AA across every state." }
    style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.55 }

  - { id: card-3, type: rect, z: 40, x: 786, y: 590, width: 333, height: 320, radius: 16, fill: { type: solid, color: "$surface" } }
  - id: card-3-num
    type: text
    z: 41
    x: 818
    y: 620
    width: 280
    height: 0
    content: { type: plain, value: "03" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36 }
  - id: card-3-title
    type: text
    z: 42
    x: 818
    y: 670
    width: 280
    height: 0
    content: { type: plain, value: "Per-tab override" }
    style: { font_family: $heading, font_size: 30, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.01 }
  - id: card-3-body
    type: text
    z: 43
    x: 818
    y: 740
    width: 280
    height: 0
    content: { type: plain, value: "Read docs in light. Code in dark. Same window, no conflict." }
    style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.55 }

  - id: details-label
    type: text
    z: 50
    x: 80
    y: 980
    width: 1040
    height: 0
    content: { type: plain, value: "AVAILABLE NOW" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }

  - id: details-body
    type: text
    z: 51
    x: 80
    y: 1020
    width: 1040
    height: 0
    content: { type: plain, value: "Rolling out to all Pro accounts today. Free plan in 2 weeks." }
    style: { font_family: $body, font_size: 22, color: $text, line_height: 1.45 }

  - { id: cta-chip, type: rect, z: 60, x: 80, y: 1180, width: 240, height: 72, radius: 36, fill: { type: solid, color: "$primary" } }

  - id: cta-chip-text
    type: text
    z: 61
    x: 80
    y: 1202
    width: 240
    height: 0
    content: { type: plain, value: "Try it →" }
    style: { font_family: $body, font_size: 24, font_weight: 700, color: "#FFFFFF", text_align: center, letter_spacing: 0.02 }

  - id: author
    type: text
    z: 70
    x: 80
    y: 1370
    width: 700
    height: 0
    content: { type: plain, value: "@product · Released 17 May 2026" }
    style: { font_family: $body, font_size: 16, font_weight: 600, color: $text, line_height: 1.4 }

  - id: author-sub
    type: text
    z: 71
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "yourproduct.com/whats-new" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, line_height: 1.4 }

  - id: page-mark
    type: text
    z: 72
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "01 / FOLIO" }
    style: { font_family: $mono, font_size: 13, font_weight: 600, color: $text_muted, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  feature-name:
    enter: { type: scale_in, duration: 700, delay: 100, easing: ease-out }
  subtitle:
    enter: { type: fade_up, duration: 500, delay: 400, easing: ease-out }
  card-1:
    enter: { type: fade_up, duration: 600, delay: 600, easing: ease-out }
  card-2:
    enter: { type: fade_up, duration: 600, delay: 750, easing: ease-out }
  card-3:
    enter: { type: fade_up, duration: 600, delay: 900, easing: ease-out }
  cta-chip:
    loop: { type: breathe, duration: 2400, scale: 1.04 }

slots:
  - { id: eyebrow,        path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",          default: "LAUNCHED" }
  - { id: feature_name,   path: "layers[4].content.value",  type: text, hint: "Feature name",        default: "Dark Mode 2.0" }
  - { id: subtitle,       path: "layers[5].content.value",  type: text, hint: "Subtitle",            default: "Now with system sync, 3 accent palettes, and per-tab override." }
  - { id: card_1_title,   path: "layers[10].content.value", type: text, hint: "Card 1 title",        default: "System sync" }
  - { id: card_1_body,    path: "layers[11].content.value", type: text, hint: "Card 1 body",         default: "Match OS theme instantly. Switches at sunset, wakes light." }
  - { id: card_2_title,   path: "layers[14].content.value", type: text, hint: "Card 2 title",        default: "3 accent palettes" }
  - { id: card_2_body,    path: "layers[15].content.value", type: text, hint: "Card 2 body",         default: "Pick neon, ember, or steel. WCAG-AA across every state." }
  - { id: card_3_title,   path: "layers[18].content.value", type: text, hint: "Card 3 title",        default: "Per-tab override" }
  - { id: card_3_body,    path: "layers[19].content.value", type: text, hint: "Card 3 body",         default: "Read docs in light. Code in dark. Same window, no conflict." }
  - { id: details_body,   path: "layers[21].content.value", type: text, hint: "Availability line",   default: "Rolling out to all Pro accounts today. Free plan in 2 weeks." }
  - { id: cta_text,       path: "layers[23].content.value", type: text, hint: "CTA text",            default: "Try it →" }
  - { id: author,         path: "layers[24].content.value", type: text, hint: "Author line",         default: "@product · Released 17 May 2026" }
