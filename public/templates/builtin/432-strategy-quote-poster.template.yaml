_protocol: template/v1

# Single-page strategy quote poster. LinkedIn 4:5 portrait.
# Display serif italic quote with oversized glyph, attribution.
meta:
  id: tmpl-strategy-quote-poster
  name: Strategy Quote Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, strategy, quote, editorial, 4-5]
  description: "LinkedIn 4:5 strategy quote poster with display serif italic quote and oversized glyph."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 14
    fill: { type: solid, color: "$primary" }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1110
    cy: 130
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "ON STRATEGY" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: glyph
    type: text
    z: 10
    x: 60
    y: 220
    width: 600
    height: 0
    content: { type: plain, value: "“" }
    style:
      font_family: $heading
      font_size: 560
      font_weight: 900
      color: $primary
      line_height: 1
      opacity: 1.0

  - id: quote
    type: text
    z: 30
    x: 80
    y: 540
    width: 1040
    height: 0
    content: { type: plain, value: "Strategy is\nchoosing what\nnot to do." }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 700
      font_style: italic
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: divider
    type: rect
    z: 25
    x: 80
    y: 1080
    width: 120
    height: 3
    fill: { type: solid, color: "$primary" }

  - id: author
    type: text
    z: 31
    x: 80
    y: 1110
    width: 1040
    height: 0
    content: { type: plain, value: "Michael Porter" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 700
      color: $text
      line_height: 1.2
      letter_spacing: -0.01

  - id: author-sub
    type: text
    z: 32
    x: 80
    y: 1180
    width: 1040
    height: 0
    content: { type: plain, value: "Harvard Business School · author of Competitive Strategy" }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.4

  - id: footer
    type: text
    z: 50
    x: 80
    y: 1400
    width: 800
    height: 0
    content: { type: plain, value: "@yourhandle · weekly notes on strategy" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      line_height: 1.4

  - id: page-mark
    type: text
    z: 51
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "17 MAY 2026" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: right
      text_transform: uppercase

animations:
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.25 }
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  author:
    enter: { type: fade_up, duration: 600, delay: 800, easing: ease-out }
  glyph:
    loop: { type: breathe, duration: 3200, scale: 1.04 }

slots:
  - { id: eyebrow,    path: "layers[3].content.value", type: text, hint: "Eyebrow tag",       default: "ON STRATEGY" }
  - { id: quote,      path: "layers[5].content.value", type: text, hint: "Quote text",        default: "Strategy is\nchoosing what\nnot to do." }
  - { id: author,     path: "layers[7].content.value", type: text, hint: "Author name",       default: "Michael Porter" }
  - { id: author_sub, path: "layers[8].content.value", type: text, hint: "Author affiliation", default: "Harvard Business School · author of Competitive Strategy" }
  - { id: footer,     path: "layers[9].content.value", type: text, hint: "Footer handle",     default: "@yourhandle · weekly notes on strategy" }
