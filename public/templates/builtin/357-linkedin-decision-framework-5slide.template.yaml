_protocol: template/v1

# 5-slide LinkedIn carousel — Hard decision framework.
# Cover → 3 questions intro → 3 question slides → CTA with pull-quote.
meta:
  id: tmpl-linkedin-decision-framework
  name: LinkedIn · Hard Decision Framework (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, leadership, management, decisions, framework, 4-5]
  description: "5-slide LinkedIn carousel framework of three questions for making hard decisions, with a closing pull-quote."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

pages:
  # ── Slide 1 · Cover ──────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "FOR THE DECISION YOU'RE AVOIDING" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 280
        width: 920
        height: 0
        content: { type: plain, value: "How to Make\nHard Decisions" }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.02, letter_spacing: -0.03 }
      - id: subtitle
        type: text
        z: 12
        x: 80
        y: 600
        width: 920
        height: 0
        content: { type: plain, value: "Three questions. Twenty minutes. One answer." }
        style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "1/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · The 3 questions intro ──────────────────────
  - id: intro
    label: The 3 questions
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "THE 3 QUESTIONS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: headline
        type: text
        z: 11
        x: 80
        y: 260
        width: 920
        height: 0
        content: { type: plain, value: "Most hard calls\naren't actually hard.\n\nThey're just unasked." }
        style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 12
        x: 80
        y: 840
        width: 920
        height: 0
        content: { type: plain, value: "Answer these three in order. The decision usually answers itself by the third one." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "2/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Q1 ─────────────────────────────────────────
  - id: q1
    label: Question 01
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: numeric-mark
        type: text
        z: 10
        x: 80
        y: 180
        width: 400
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 28, font_weight: 700, color: $primary, letter_spacing: 0.2 }
      - id: question
        type: text
        z: 11
        x: 80
        y: 260
        width: 920
        height: 0
        content: { type: plain, value: "What would I\ndo if I had\nno fear?" }
        style: { font_family: $heading, font_size: 84, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 760
        width: 920
        height: 0
        content: { type: plain, value: "Strip out the politics, the reputation hit, the awkward conversation. What does the situation actually demand? You usually know — you just don't want to say it out loud yet." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "3/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Q2 ─────────────────────────────────────────
  - id: q2
    label: Question 02
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: numeric-mark
        type: text
        z: 10
        x: 80
        y: 180
        width: 400
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 28, font_weight: 700, color: $primary, letter_spacing: 0.2 }
      - id: question
        type: text
        z: 11
        x: 80
        y: 260
        width: 920
        height: 0
        content: { type: plain, value: "What's the cost\nof being wrong\non each side?" }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 820
        width: 920
        height: 0
        content: { type: plain, value: "Most decisions are asymmetric. If one bad outcome costs a week and the other costs a year, pick the cheap-to-reverse option even if it feels worse today. Risk math beats vibe math." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "4/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Q3 + pull-quote + CTA ──────────────────────
  - id: q3
    label: Question 03
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: numeric-mark
        type: text
        z: 10
        x: 80
        y: 180
        width: 400
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 28, font_weight: 700, color: $primary, letter_spacing: 0.2 }
      - id: question
        type: text
        z: 11
        x: 80
        y: 260
        width: 920
        height: 0
        content: { type: plain, value: "Who do I trust\nto disagree with me?" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 600
        width: 920
        height: 0
        content: { type: plain, value: "Pick one person who'll tell you the truth and one who's seen this before. Call them. Then decide." }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.55 }
      - { id: quote-rule, type: rect, z: 15, x: 80, y: 880, width: 8, height: 200, fill: { type: solid, color: "$accent" } }
      - id: pull-quote
        type: text
        z: 16
        x: 120
        y: 880
        width: 880
        height: 0
        content: { type: plain, value: "\"Indecision is a decision.\nIt just isn't yours anymore.\"" }
        style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text, font_style: italic, line_height: 1.35, letter_spacing: -0.01 }
      - id: cta
        type: text
        z: 17
        x: 80
        y: 1180
        width: 920
        height: 0
        content: { type: plain, value: "Save this for the next hard call. Follow for more." }
        style: { font_family: $body, font_size: 22, font_weight: 600, color: $primary, line_height: 1.4 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "5/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

slots:
  - { id: cover_title,     path: "pages[0].layers[3].content.value", type: text, hint: "Cover title",       default: "How to Make\nHard Decisions" }
  - { id: cover_subtitle,  path: "pages[0].layers[4].content.value", type: text, hint: "Cover subtitle",    default: "Three questions. Twenty minutes. One answer." }
  - { id: intro_headline,  path: "pages[1].layers[3].content.value", type: text, hint: "Intro headline",    default: "Most hard calls\naren't actually hard.\n\nThey're just unasked." }
  - { id: intro_body,      path: "pages[1].layers[4].content.value", type: text, hint: "Intro body",        default: "Answer these three in order. The decision usually answers itself by the third one." }
  - { id: q1_question,     path: "pages[2].layers[3].content.value", type: text, hint: "Question 01",       default: "What would I\ndo if I had\nno fear?" }
  - { id: q1_explanation,  path: "pages[2].layers[4].content.value", type: text, hint: "Q1 explanation",    default: "Strip out the politics, the reputation hit, the awkward conversation. What does the situation actually demand? You usually know — you just don't want to say it out loud yet." }
  - { id: q2_question,     path: "pages[3].layers[3].content.value", type: text, hint: "Question 02",       default: "What's the cost\nof being wrong\non each side?" }
  - { id: q2_explanation,  path: "pages[3].layers[4].content.value", type: text, hint: "Q2 explanation",    default: "Most decisions are asymmetric. If one bad outcome costs a week and the other costs a year, pick the cheap-to-reverse option even if it feels worse today. Risk math beats vibe math." }
  - { id: q3_question,     path: "pages[4].layers[3].content.value", type: text, hint: "Question 03",       default: "Who do I trust\nto disagree with me?" }
  - { id: q3_explanation,  path: "pages[4].layers[4].content.value", type: text, hint: "Q3 explanation",    default: "Pick one person who'll tell you the truth and one who's seen this before. Call them. Then decide." }
  - { id: pull_quote,      path: "pages[4].layers[6].content.value", type: text, hint: "Pull quote",        default: "\"Indecision is a decision.\nIt just isn't yours anymore.\"" }
  - { id: cta_line,        path: "pages[4].layers[7].content.value", type: text, hint: "CTA line",          default: "Save this for the next hard call. Follow for more." }
