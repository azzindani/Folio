_protocol: template/v1

# 6-slide LinkedIn carousel — pricing strategy playbook.
# 1080×1350 portrait, corporate-slate theme.
meta:
  id: tmpl-linkedin-pricing-strategy-6slide
  name: LinkedIn Pricing Strategy (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, finance, pricing, strategy, 4-5]
  description: "6-slide pricing playbook — cover, intro, four strategies (value/anchor/per-seat/usage), CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "1 / 6" }
        style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 420
        width: 960
        height: 0
        content: { type: plain, value: "PRICING PLAYBOOK" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 480
        width: 960
        height: 0
        content: { type: plain, value: "Stop pricing\nlike everyone else." }
        style: { font_family: $heading, font_size: 92, font_weight: 800, color: $text, line_height: 1.02, letter_spacing: -0.03 }
      - id: subline
        type: text
        z: 13
        x: 60
        y: 820
        width: 960
        height: 0
        content: { type: plain, value: "4 pricing strategies most founders never test." }
        style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 }
      - id: swipe
        type: text
        z: 14
        x: 60
        y: 1240
        width: 960
        height: 0
        content: { type: plain, value: "Swipe →" }
        style: { font_family: $body, font_size: 22, font_weight: 700, color: $primary }

  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "2 / 6" }
        style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "WHY THIS MATTERS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Price is the fastest growth lever you own." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 13
        x: 60
        y: 540
        width: 960
        height: 0
        content: { type: plain, value: "A 1% price lift drives 7-10x more profit than a 1% volume lift. Most teams default to copying competitors or guessing.\n\nThese 4 frameworks give you a structured way to choose." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }

  - id: strategy-1
    label: Strategy 01
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "3 / 6" }
        style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 }
      - id: number
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: name
        type: text
        z: 12
        x: 60
        y: 210
        width: 960
        height: 0
        content: { type: plain, value: "Value-based pricing" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: when-label
        type: text
        z: 13
        x: 60
        y: 480
        width: 960
        height: 0
        content: { type: plain, value: "WHEN TO USE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: when-body
        type: text
        z: 14
        x: 60
        y: 520
        width: 960
        height: 0
        content: { type: plain, value: "You can quantify the buyer's outcome in dollars (revenue won, time saved, headcount avoided)." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: formula-card
        type: rect
        z: 20
        x: 60
        y: 820
        width: 960
        height: 200
        radius: 16
        fill: { type: solid, color: "$surface" }
      - id: formula-label
        type: text
        z: 21
        x: 92
        y: 850
        width: 900
        height: 0
        content: { type: plain, value: "FORMULA" }
        style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: formula-value
        type: text
        z: 22
        x: 92
        y: 900
        width: 900
        height: 0
        content: { type: plain, value: "Price = Quantified value × 10-25% capture rate" }
        style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, line_height: 1.4 }

  - id: strategy-2
    label: Strategy 02
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "4 / 6" }
        style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 }
      - id: number
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: name
        type: text
        z: 12
        x: 60
        y: 210
        width: 960
        height: 0
        content: { type: plain, value: "Anchor + tier" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: when-label
        type: text
        z: 13
        x: 60
        y: 480
        width: 960
        height: 0
        content: { type: plain, value: "WHEN TO USE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: when-body
        type: text
        z: 14
        x: 60
        y: 520
        width: 960
        height: 0
        content: { type: plain, value: "You sell to a buying committee. A premium anchor reframes the middle tier as the obvious choice." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: formula-card
        type: rect
        z: 20
        x: 60
        y: 820
        width: 960
        height: 200
        radius: 16
        fill: { type: solid, color: "$surface" }
      - id: formula-label
        type: text
        z: 21
        x: 92
        y: 850
        width: 900
        height: 0
        content: { type: plain, value: "FORMULA" }
        style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: formula-value
        type: text
        z: 22
        x: 92
        y: 900
        width: 900
        height: 0
        content: { type: plain, value: "Tier 3 = Tier 2 × 2.5  ·  Tier 1 = Tier 2 × 0.4" }
        style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, line_height: 1.4 }

  - id: strategy-3
    label: Strategy 03
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "5 / 6" }
        style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 }
      - id: number
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: name
        type: text
        z: 12
        x: 60
        y: 210
        width: 960
        height: 0
        content: { type: plain, value: "Per-seat (the trap)" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: when-label
        type: text
        z: 13
        x: 60
        y: 480
        width: 960
        height: 0
        content: { type: plain, value: "WHEN TO USE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: when-body
        type: text
        z: 14
        x: 60
        y: 520
        width: 960
        height: 0
        content: { type: plain, value: "Only when every active user creates marginal value. AI tools that replace headcount break this model fast." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: formula-card
        type: rect
        z: 20
        x: 60
        y: 820
        width: 960
        height: 200
        radius: 16
        fill: { type: solid, color: "$surface" }
      - id: formula-label
        type: text
        z: 21
        x: 92
        y: 850
        width: 900
        height: 0
        content: { type: plain, value: "FORMULA" }
        style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: formula-value
        type: text
        z: 22
        x: 92
        y: 900
        width: 900
        height: 0
        content: { type: plain, value: "Revenue = Active seats × Price/seat/month" }
        style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, line_height: 1.4 }

  - id: strategy-4-cta
    label: Strategy 04 + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$primary" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "6 / 6" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }
      - id: number
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "04" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: name
        type: text
        z: 12
        x: 60
        y: 210
        width: 960
        height: 0
        content: { type: plain, value: "Usage-based" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.02 }
      - id: when-body
        type: text
        z: 14
        x: 60
        y: 380
        width: 960
        height: 0
        content: { type: plain, value: "Use when value scales with consumption. Aligns revenue with the customer's success — the modern default for infra and AI." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF", line_height: 1.5 }
      - id: formula-value
        type: text
        z: 22
        x: 60
        y: 620
        width: 960
        height: 0
        content: { type: plain, value: "Revenue = Units consumed × Price/unit" }
        style: { font_family: $mono, font_size: 24, font_weight: 700, color: "#FFFFFF", line_height: 1.4 }
      - id: cta-heading
        type: text
        z: 30
        x: 60
        y: 880
        width: 960
        height: 0
        content: { type: plain, value: "Audit your pricing this quarter." }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02 }
      - id: cta-sub
        type: text
        z: 31
        x: 60
        y: 1060
        width: 960
        height: 0
        content: { type: plain, value: "Follow for more finance + strategy playbooks." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF" }
      - id: handle
        type: text
        z: 32
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }

slots:
  - { id: cover_title,     path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",      default: "Stop pricing\nlike everyone else." }
  - { id: cover_subline,   path: "pages[0].layers[5].content.value", type: text, hint: "Cover subline",       default: "4 pricing strategies most founders never test." }
  - { id: intro_title,     path: "pages[1].layers[4].content.value", type: text, hint: "Intro headline",      default: "Price is the fastest growth lever you own." }
  - { id: strategy_1_name, path: "pages[2].layers[4].content.value", type: text, hint: "Strategy 01 name",    default: "Value-based pricing" }
  - { id: strategy_1_when, path: "pages[2].layers[6].content.value", type: text, hint: "Strategy 01 when",    default: "You can quantify the buyer's outcome in dollars (revenue won, time saved, headcount avoided)." }
  - { id: strategy_1_fmla, path: "pages[2].layers[9].content.value", type: text, hint: "Strategy 01 formula", default: "Price = Quantified value × 10-25% capture rate" }
  - { id: strategy_2_name, path: "pages[3].layers[4].content.value", type: text, hint: "Strategy 02 name",    default: "Anchor + tier" }
  - { id: strategy_2_fmla, path: "pages[3].layers[9].content.value", type: text, hint: "Strategy 02 formula", default: "Tier 3 = Tier 2 × 2.5  ·  Tier 1 = Tier 2 × 0.4" }
  - { id: strategy_3_name, path: "pages[4].layers[4].content.value", type: text, hint: "Strategy 03 name",    default: "Per-seat (the trap)" }
  - { id: strategy_3_fmla, path: "pages[4].layers[9].content.value", type: text, hint: "Strategy 03 formula", default: "Revenue = Active seats × Price/seat/month" }
  - { id: strategy_4_name, path: "pages[5].layers[4].content.value", type: text, hint: "Strategy 04 name",    default: "Usage-based" }
  - { id: cta_heading,     path: "pages[5].layers[7].content.value", type: text, hint: "CTA heading",         default: "Audit your pricing this quarter." }
  - { id: cta_handle,      path: "pages[5].layers[9].content.value", type: text, hint: "Footer handle",       default: "@yourhandle" }
