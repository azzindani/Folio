_protocol: template/v1

# Job posting card — 1200×1500 portrait, indigo-pro theme.
# Hiring announcement for a single role: company tag, "WE'RE HIRING"
# eyebrow, big role title, location/type badges, salary range, 5
# requirements bullets, and an apply CTA pill at the bottom.
meta:
  id: tmpl-job-posting-card
  name: Job Posting Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [job, hiring, recruitment, careers, card, portrait, indigo]
  description: "Job posting card with company name, role title, location and type badges, salary range, requirements list, and apply CTA."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  # ── Decorative top band ───────────────────────────────────
  - id: top-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1200
    height: 8
    fill: { type: solid, color: "$primary" }

  # ── Company logo placeholder (square top-left) ────────────
  - id: logo-box
    type: rect
    z: 5
    x: 80
    y: 90
    width: 96
    height: 96
    radius: 20
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }

  - id: logo-mark
    type: text
    z: 6
    x: 80
    y: 110
    width: 96
    height: 0
    content: { type: plain, value: "N" }
    style:
      font_family: $heading
      font_size: 60
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  # ── Company name + posted date ────────────────────────────
  - id: company-name
    type: text
    z: 10
    x: 200
    y: 100
    width: 920
    height: 0
    content: { type: plain, value: "Northwind Labs" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text
      line_height: 1.2

  - id: posted
    type: text
    z: 11
    x: 200
    y: 142
    width: 920
    height: 0
    content: { type: plain, value: "Posted May 16, 2026 · Apply by Jun 15" }
    style:
      font_family: $body
      font_size: 15
      color: $text_muted
      line_height: 1.4

  # ── Eyebrow "WE'RE HIRING" ────────────────────────────────
  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 260
    width: 1040
    height: 0
    content: { type: plain, value: "WE'RE HIRING" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  # ── Role title ────────────────────────────────────────────
  - id: role-title
    type: text
    z: 21
    x: 80
    y: 310
    width: 1040
    height: 0
    content: { type: plain, value: "Senior Backend Engineer" }
    style:
      font_family: $heading
      font_size: 78
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.02

  # ── Location + type badges row ────────────────────────────
  - id: badge-loc
    type: rect
    z: 30
    x: 80
    y: 470
    width: 220
    height: 56
    radius: 28
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: badge-loc-text
    type: text
    z: 31
    x: 80
    y: 485
    width: 220
    height: 0
    content: { type: plain, value: "Remote · EU" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text
      text_align: center
      line_height: 1.3

  - id: badge-type
    type: rect
    z: 32
    x: 320
    y: 470
    width: 200
    height: 56
    radius: 28
    fill: { type: solid, color: "$primary" }

  - id: badge-type-text
    type: text
    z: 33
    x: 320
    y: 485
    width: 200
    height: 0
    content: { type: plain, value: "Full-time" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3

  - id: badge-level
    type: rect
    z: 34
    x: 540
    y: 470
    width: 180
    height: 56
    radius: 28
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: badge-level-text
    type: text
    z: 35
    x: 540
    y: 485
    width: 180
    height: 0
    content: { type: plain, value: "Senior" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text
      text_align: center
      line_height: 1.3

  # ── Salary block ──────────────────────────────────────────
  - id: salary-label
    type: text
    z: 40
    x: 80
    y: 580
    width: 1040
    height: 0
    content: { type: plain, value: "SALARY RANGE" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

  - id: salary-value
    type: text
    z: 41
    x: 80
    y: 615
    width: 1040
    height: 0
    content: { type: plain, value: "€85,000 – €115,000 / year" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 700
      color: $text
      line_height: 1.2
      letter_spacing: -0.01

  # ── Requirements section ──────────────────────────────────
  - id: req-divider
    type: rect
    z: 50
    x: 80
    y: 720
    width: 1040
    height: 1
    fill: { type: solid, color: "$border" }

  - id: req-header
    type: text
    z: 51
    x: 80
    y: 750
    width: 1040
    height: 0
    content: { type: plain, value: "WHAT YOU'LL BRING" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: req-1
    type: text
    z: 52
    x: 80
    y: 800
    width: 1040
    height: 0
    content: { type: plain, value: "·  6+ years building production Go or Rust services at scale" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  - id: req-2
    type: text
    z: 53
    x: 80
    y: 850
    width: 1040
    height: 0
    content: { type: plain, value: "·  Deep experience with Postgres, Kafka, and distributed tracing" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  - id: req-3
    type: text
    z: 54
    x: 80
    y: 900
    width: 1040
    height: 0
    content: { type: plain, value: "·  Comfort owning systems end-to-end (design → on-call)" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  - id: req-4
    type: text
    z: 55
    x: 80
    y: 950
    width: 1040
    height: 0
    content: { type: plain, value: "·  Track record of mentoring engineers and reviewing PRs thoughtfully" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  - id: req-5
    type: text
    z: 56
    x: 80
    y: 1000
    width: 1040
    height: 0
    content: { type: plain, value: "·  Excellent written communication; async-first by default" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  # ── Apply CTA ─────────────────────────────────────────────
  - id: cta-pill
    type: rect
    z: 60
    x: 80
    y: 1180
    width: 1040
    height: 100
    radius: 50
    fill: { type: solid, color: "$primary" }

  - id: cta-text
    type: text
    z: 61
    x: 80
    y: 1210
    width: 1040
    height: 0
    content: { type: plain, value: "Apply now → northwind.careers/eng" }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 700
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3
      letter_spacing: -0.01

  # ── Footer ────────────────────────────────────────────────
  - id: footer
    type: text
    z: 70
    x: 80
    y: 1380
    width: 1040
    height: 0
    content: { type: plain, value: "Equal opportunity employer · Visa sponsorship available for EU residency" }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted
      text_align: center
      line_height: 1.4

slots:
  - { id: company_name,     path: "layers[4].content.value",  type: text, hint: "Company name",              default: "Northwind Labs" }
  - { id: role_title,       path: "layers[7].content.value",  type: text, hint: "Role title (big)",          default: "Senior Backend Engineer" }
  - { id: location,         path: "layers[9].content.value",  type: text, hint: "Location badge text",       default: "Remote · EU" }
  - { id: salary_range,     path: "layers[15].content.value", type: text, hint: "Salary range",              default: "€85,000 – €115,000 / year" }
  - { id: requirement_1,    path: "layers[18].content.value", type: text, hint: "Requirement 1",             default: "·  6+ years building production Go or Rust services at scale" }
  - { id: requirement_2,    path: "layers[19].content.value", type: text, hint: "Requirement 2",             default: "·  Deep experience with Postgres, Kafka, and distributed tracing" }
  - { id: requirement_3,    path: "layers[20].content.value", type: text, hint: "Requirement 3",             default: "·  Comfort owning systems end-to-end (design → on-call)" }
  - { id: requirement_4,    path: "layers[21].content.value", type: text, hint: "Requirement 4",             default: "·  Track record of mentoring engineers and reviewing PRs thoughtfully" }
  - { id: requirement_5,    path: "layers[22].content.value", type: text, hint: "Requirement 5",             default: "·  Excellent written communication; async-first by default" }
