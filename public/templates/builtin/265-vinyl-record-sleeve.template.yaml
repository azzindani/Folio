_protocol: template/v1

# Vinyl 12" LP front sleeve (1500×1500 square).
# Editorial-cream noir-gold styling: artist top, HUGE serif album title,
# side-A track listing with timings, label logo bottom corner.
meta:
  id: tmpl-vinyl-record-sleeve
  name: Vinyl Record Sleeve
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, vinyl, lp, music, sleeve, album, square, editorial]
  description: "12-inch LP sleeve front: artist, album title, side-A tracklist, label."

document:
  width: 1500
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1500
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: border-frame
    type: rect
    z: 1
    x: 60
    y: 60
    width: 1380
    height: 1380
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 2 }

  - id: top-rule
    type: rect
    z: 2
    x: 100
    y: 180
    width: 1300
    height: 1
    fill: { type: solid, color: "$text" }
    opacity: 0.4

  - id: artist
    type: text
    z: 10
    x: 100
    y: 120
    width: 1300
    height: 0
    content: { type: plain, value: "OSCAR HAVERFORD QUARTET" }
    style:
      font_family: $mono
      font_size: 20
      font_weight: 700
      color: $text
      letter_spacing: 0.42
      text_transform: uppercase

  - id: side-marker
    type: text
    z: 11
    x: 100
    y: 120
    width: 1300
    height: 0
    content: { type: plain, value: "SIDE A · 33⅓ RPM" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary
      letter_spacing: 0.4
      text_align: right
      text_transform: uppercase

  - id: album-title-line-1
    type: text
    z: 20
    x: 100
    y: 360
    width: 1300
    height: 0
    content: { type: plain, value: "Letters" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 400
      font_style: italic
      color: $text
      line_height: 0.92
      letter_spacing: -0.02

  - id: album-title-line-2
    type: text
    z: 21
    x: 100
    y: 580
    width: 1300
    height: 0
    content: { type: plain, value: "from the Coast" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 400
      font_style: italic
      color: $primary
      line_height: 0.92
      letter_spacing: -0.02

  - id: divider-mid
    type: rect
    z: 25
    x: 100
    y: 880
    width: 240
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: tracklist-eyebrow
    type: text
    z: 30
    x: 100
    y: 910
    width: 1300
    height: 0
    content: { type: plain, value: "SIDE A" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_transform: uppercase

  - id: track-1
    type: text
    z: 31
    x: 100
    y: 970
    width: 1300
    height: 0
    content: { type: plain, value: "1.  Harbor Lights .................................................. 4:12" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 500
      color: $text
      letter_spacing: 0.04

  - id: track-2
    type: text
    z: 32
    x: 100
    y: 1014
    width: 1300
    height: 0
    content: { type: plain, value: "2.  Postcards Unsent ............................................ 3:48" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 500
      color: $text
      letter_spacing: 0.04

  - id: track-3
    type: text
    z: 33
    x: 100
    y: 1058
    width: 1300
    height: 0
    content: { type: plain, value: "3.  Tide Was High Above the Pier ........................ 6:24" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 500
      color: $text
      letter_spacing: 0.04

  - id: track-4
    type: text
    z: 34
    x: 100
    y: 1102
    width: 1300
    height: 0
    content: { type: plain, value: "4.  Slow Train to Halifax ..................................... 5:02" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 500
      color: $text
      letter_spacing: 0.04

  - id: track-5
    type: text
    z: 35
    x: 100
    y: 1146
    width: 1300
    height: 0
    content: { type: plain, value: "5.  Two Stamps and a Goodbye ......................... 4:38" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 500
      color: $text
      letter_spacing: 0.04

  - id: vinyl-center-outer
    type: circle
    z: 40
    cx: 1280
    cy: 1340
    rx: 80
    ry: 80
    fill: { type: solid, color: "$text" }

  - id: vinyl-center-inner
    type: circle
    z: 41
    cx: 1280
    cy: 1340
    rx: 12
    ry: 12
    fill: { type: solid, color: "$background" }

  - id: label-logo
    type: text
    z: 50
    x: 100
    y: 1380
    width: 800
    height: 0
    content: { type: plain, value: "BLUE FERRY RECORDS · CAT. BFR-1142" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_transform: uppercase

slots:
  - { id: artist,  path: "layers[3].content.value",  type: text, hint: "Artist / band name",      default: "OSCAR HAVERFORD QUARTET" }
  - { id: album,   path: "layers[5].content.value",  type: text, hint: "Album title line 1",      default: "Letters" }
  - { id: track_1, path: "layers[10].content.value", type: text, hint: "Track 1 (with dots + timing)", default: "1.  Harbor Lights .................................................. 4:12" }
  - { id: track_2, path: "layers[11].content.value", type: text, hint: "Track 2", default: "2.  Postcards Unsent ............................................ 3:48" }
  - { id: track_3, path: "layers[12].content.value", type: text, hint: "Track 3", default: "3.  Tide Was High Above the Pier ........................ 6:24" }
  - { id: track_4, path: "layers[13].content.value", type: text, hint: "Track 4", default: "4.  Slow Train to Halifax ..................................... 5:02" }
  - { id: track_5, path: "layers[14].content.value", type: text, hint: "Track 5", default: "5.  Two Stamps and a Goodbye ......................... 4:38" }
