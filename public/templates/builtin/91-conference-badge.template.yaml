_protocol: template/v1

# Conference attendee badge — 1050×1500 portrait, indigo-pro theme.
# Lanyard hole at top, conference eyebrow band, big name, role badge,
# company tag, QR-code placeholder, role-color band at the bottom.
meta:
  id: tmpl-conference-badge
  name: Conference Badge
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [badge, conference, lanyard, event, attendee, portrait]
  description: "Conference attendee badge with name, role, company, QR placeholder, and role-color band."

document:
  width: 1050
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1050
    height: 1500
    fill: { type: solid, color: "$background" }

  # ── Lanyard hole + slit ───────────────────────────────────
  - id: lanyard-slot
    type: rect
    z: 5
    x: 475
    y: 50
    width: 100
    height: 20
    radius: 10
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  # ── Top eyebrow band ──────────────────────────────────────
  - id: top-band
    type: rect
    z: 10
    x: 0
    y: 120
    width: 1050
    height: 110
    fill:
      type: linear
      angle: 90
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }

  - id: conference-name
    type: text
    z: 11
    x: 60
    y: 148
    width: 930
    height: 0
    content: { type: plain, value: "DESIGNCONF 2026" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: conference-sub
    type: text
    z: 12
    x: 60
    y: 192
    width: 930
    height: 0
    content: { type: plain, value: "OCT 14–16 · SAN FRANCISCO" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 600
      color: "#FFFFFF"
      letter_spacing: 0.6
      text_align: center
      opacity: 0.85

  # ── Name block (big) ──────────────────────────────────────
  - id: name-label
    type: text
    z: 20
    x: 60
    y: 320
    width: 930
    height: 0
    content: { type: plain, value: "HELLO, MY NAME IS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.6
      text_align: center
      text_transform: uppercase

  - id: name-divider
    type: rect
    z: 21
    x: 475
    y: 360
    width: 100
    height: 3
    fill: { type: solid, color: "$primary" }

  - id: name
    type: text
    z: 22
    x: 60
    y: 400
    width: 930
    height: 0
    content: { type: plain, value: "Avery Castellanos" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: $text
      text_align: center
      line_height: 1.05
      letter_spacing: -0.02

  # ── Role badge (pill) ─────────────────────────────────────
  - id: role-pill
    type: rect
    z: 30
    x: 325
    y: 530
    width: 400
    height: 56
    radius: 28
    fill: { type: solid, color: "$primary" }

  - id: role
    type: text
    z: 31
    x: 325
    y: 547
    width: 400
    height: 0
    content: { type: plain, value: "Senior Product Designer" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: "#FFFFFF"
      text_align: center
      line_height: 1.2

  # ── Company ───────────────────────────────────────────────
  - id: company-at
    type: text
    z: 40
    x: 60
    y: 630
    width: 930
    height: 0
    content: { type: plain, value: "@" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $secondary
      text_align: center
      line_height: 1

  - id: company
    type: text
    z: 41
    x: 60
    y: 670
    width: 930
    height: 0
    content: { type: plain, value: "Northwind Studio" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 600
      color: $text
      text_align: center
      line_height: 1.2
      letter_spacing: -0.01

  # ── QR placeholder block ──────────────────────────────────
  - id: qr-frame
    type: rect
    z: 50
    x: 325
    y: 820
    width: 400
    height: 400
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 2 }

  # QR-like grid blocks (decorative placeholder)
  - id: qr-a
    type: rect
    z: 51
    x: 365
    y: 860
    width: 80
    height: 80
    fill: { type: solid, color: "$text" }

  - id: qr-b
    type: rect
    z: 52
    x: 605
    y: 860
    width: 80
    height: 80
    fill: { type: solid, color: "$text" }

  - id: qr-c
    type: rect
    z: 53
    x: 365
    y: 1100
    width: 80
    height: 80
    fill: { type: solid, color: "$text" }

  - id: qr-grid-1
    type: rect
    z: 54
    x: 480
    y: 880
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-2
    type: rect
    z: 55
    x: 530
    y: 880
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-3
    type: rect
    z: 56
    x: 480
    y: 930
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-4
    type: rect
    z: 57
    x: 460
    y: 1020
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-5
    type: rect
    z: 58
    x: 510
    y: 1050
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-6
    type: rect
    z: 59
    x: 560
    y: 1020
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-7
    type: rect
    z: 60
    x: 480
    y: 1130
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-8
    type: rect
    z: 61
    x: 530
    y: 1100
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-grid-9
    type: rect
    z: 62
    x: 620
    y: 1140
    width: 30
    height: 30
    fill: { type: solid, color: "$text" }

  - id: qr-caption
    type: text
    z: 70
    x: 60
    y: 1250
    width: 930
    height: 0
    content: { type: plain, value: "Scan to connect" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: center
      text_transform: uppercase

  # ── Role-color band at bottom ─────────────────────────────
  - id: role-band
    type: rect
    z: 80
    x: 0
    y: 1380
    width: 1050
    height: 120
    fill: { type: solid, color: "$primary" }

  - id: role-band-text
    type: text
    z: 81
    x: 60
    y: 1420
    width: 930
    height: 0
    content: { type: plain, value: "★  SPEAKER  ★" }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.5
      text_align: center

slots:
  - { id: name,            path: "layers[7].content.value",  type: text, hint: "Attendee full name",         default: "Avery Castellanos" }
  - { id: role,            path: "layers[9].content.value",  type: text, hint: "Job role / title",           default: "Senior Product Designer" }
  - { id: company,         path: "layers[11].content.value", type: text, hint: "Company / organization",    default: "Northwind Studio" }
  - { id: conference_name, path: "layers[3].content.value",  type: text, hint: "Conference / event name",   default: "DESIGNCONF 2026" }
