_protocol: template/v1

# 3-page newspaper — 1240×1754 A4 portrait, mono-print theme.
# Front page (masthead + 3-col lead + sidebar + photo) →
# interior spread (2 articles + ads) → editorial page (op-ed + letters + cartoon).
meta:
  id: tmpl-newspaper-frontpage
  name: Newspaper · Front Page (3 pages)
  type: newspaper
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [newspaper, print, journalism, mono, front-page, a4]
  description: "Three-page broadsheet-style newspaper with masthead front page, interior article spread with ads, and editorial page featuring op-ed, letters, and a cartoon placeholder."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: mono-print

pages:
  # ── Page 1 · Front Page ────────────────────────────────────
  - id: front-page
    label: Front Page
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: masthead-rule-top, type: rect, z: 1, x: 60, y: 70, width: 1120, height: 4, fill: { type: solid, color: "$text" } }
      - { id: masthead, type: text, z: 10, x: 60, y: 90, width: 1120, height: 0, content: { type: plain, value: "THE MERIDIAN TIMES" }, style: { font_family: $heading, font_size: 92, font_weight: 800, color: $text, text_align: center, letter_spacing: -0.02, line_height: 1 } }
      - { id: masthead-tagline, type: text, z: 11, x: 60, y: 200, width: 1120, height: 0, content: { type: plain, value: "FOUNDED 1898  ·  TRUTH IN PRINT" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: masthead-rule-bot, type: rect, z: 12, x: 60, y: 240, width: 1120, height: 2, fill: { type: solid, color: "$text" } }
      - { id: meta-bar, type: text, z: 13, x: 60, y: 256, width: 1120, height: 0, content: { type: plain, value: "VOL. CXXVIII · NO. 137                SUNDAY, MAY 17, 2026                $3.50 · CITY EDITION" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: center, letter_spacing: 0.3 } }
      - { id: meta-rule, type: rect, z: 14, x: 60, y: 286, width: 1120, height: 1, fill: { type: solid, color: "$border" } }
      - { id: lead-kicker, type: text, z: 20, x: 60, y: 320, width: 820, height: 0, content: { type: plain, value: "BREAKING · METRO" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: lead-headline, type: text, z: 21, x: 60, y: 350, width: 820, height: 0, content: { type: plain, value: "City Approves Sweeping Transit Overhaul After Decade of Delays" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: lead-deck, type: text, z: 22, x: 60, y: 540, width: 820, height: 0, content: { type: plain, value: "Council vote ends years of gridlock; new light-rail lines to break ground by autumn, mayor pledges fares will stay frozen." }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: lead-byline, type: text, z: 23, x: 60, y: 630, width: 820, height: 0, content: { type: plain, value: "BY ELIANA MARSH  ·  STAFF REPORTER" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: photo, type: rect, z: 24, x: 60, y: 670, width: 820, height: 380, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 1 } }
      - { id: photo-placeholder, type: text, z: 25, x: 60, y: 850, width: 820, height: 0, opacity: 0.3, content: { type: plain, value: "Photo" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: center, font_style: italic } }
      - { id: photo-caption, type: text, z: 26, x: 60, y: 1060, width: 820, height: 0, content: { type: plain, value: "Mayor Voss signed the transit bill Friday flanked by council members and union leaders. The package commits $4.2B over six years.   AP / J. CARRINGTON" }, style: { font_family: $body, font_size: 13, color: $text_muted, line_height: 1.4 } }
      - { id: col-1, type: text, z: 30, x: 60, y: 1130, width: 250, height: 0, content: { type: plain, value: "After more than a decade of stalled planning sessions and three failed ballot measures, the city council voted 11–2 late Friday to approve the most ambitious transit overhaul in the region's history. Officials called the move a turning point for a city long defined by its traffic." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: col-2, type: text, z: 30, x: 345, y: 1130, width: 250, height: 0, content: { type: plain, value: "The plan creates three new light-rail corridors, doubles the bus fleet, and dedicates 18 miles of new protected bike lanes. Construction is set to begin in October, with the first line opening to riders by mid-2029. Federal matching funds are expected to cover roughly forty percent." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: col-3, type: text, z: 30, x: 630, y: 1130, width: 250, height: 0, content: { type: plain, value: "Critics noted the plan still leaves several outer districts underserved. The mayor pledged a second-phase study within the year. \"This is the start, not the finish,\" she told reporters. Riders gathered outside cheered as the gavel fell on a measure many had given up on." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: jump, type: text, z: 31, x: 60, y: 1620, width: 820, height: 0, content: { type: plain, value: "Continued on Page A4  ›" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted } }
      - { id: side-rule, type: rect, z: 40, x: 920, y: 320, width: 2, height: 1330, fill: { type: solid, color: "$border" } }
      - { id: side-kicker, type: text, z: 41, x: 940, y: 320, width: 240, height: 0, content: { type: plain, value: "INSIDE TODAY" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: side-1, type: text, z: 42, x: 940, y: 360, width: 240, height: 0, content: { type: plain, value: "Bond markets steady\nafter rate hold .....  B1" }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.5 } }
      - { id: side-2, type: text, z: 42, x: 940, y: 440, width: 240, height: 0, content: { type: plain, value: "Storm system to\ngraze coast Tuesday .. C2" }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.5 } }
      - { id: side-3, type: text, z: 42, x: 940, y: 520, width: 240, height: 0, content: { type: plain, value: "Riverhawks edge\nWolves in overtime ... D1" }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.5 } }
      - { id: side-4, type: text, z: 42, x: 940, y: 600, width: 240, height: 0, content: { type: plain, value: "Spring gallery walk\nopens downtown .... E1" }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.5 } }
      - { id: side-rule-2, type: rect, z: 43, x: 940, y: 700, width: 240, height: 1, fill: { type: solid, color: "$border" } }
      - { id: side-weather, type: text, z: 44, x: 940, y: 720, width: 240, height: 0, content: { type: plain, value: "WEATHER" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: side-weather-temp, type: text, z: 45, x: 940, y: 760, width: 240, height: 0, content: { type: plain, value: "72°" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1 } }
      - { id: side-weather-desc, type: text, z: 46, x: 940, y: 850, width: 240, height: 0, content: { type: plain, value: "Sunny intervals,\nlight afternoon breeze.\nLow 58°." }, style: { font_family: $body, font_size: 14, color: $text_muted, line_height: 1.5 } }
      - { id: side-rule-3, type: rect, z: 47, x: 940, y: 970, width: 240, height: 1, fill: { type: solid, color: "$border" } }
      - { id: side-quote, type: text, z: 48, x: 940, y: 990, width: 240, height: 0, content: { type: plain, value: "QUOTE OF THE DAY" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: side-quote-text, type: text, z: 49, x: 940, y: 1030, width: 240, height: 0, content: { type: plain, value: "\"We came to vote, and to keep voting until somebody listened.\"" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: side-quote-attr, type: text, z: 50, x: 940, y: 1180, width: 240, height: 0, content: { type: plain, value: "— Renata Owens, transit advocate" }, style: { font_family: $body, font_size: 12, color: $text_muted, line_height: 1.4 } }
      - { id: foot-rule, type: rect, z: 60, x: 60, y: 1690, width: 1120, height: 2, fill: { type: solid, color: "$text" } }
      - { id: foot, type: text, z: 61, x: 60, y: 1710, width: 1120, height: 0, content: { type: plain, value: "© 2026 THE MERIDIAN TIMES  ·  meridiantimes.co  ·  A1" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 2 · Interior Spread ───────────────────────────────
  - id: interior-spread
    label: Interior Spread
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: section-bar, type: text, z: 1, x: 60, y: 80, width: 1120, height: 0, content: { type: plain, value: "BUSINESS & ECONOMY  ·  SUNDAY, MAY 17, 2026" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: section-rule, type: rect, z: 2, x: 60, y: 110, width: 1120, height: 2, fill: { type: solid, color: "$text" } }
      - { id: art-1-kicker, type: text, z: 10, x: 60, y: 140, width: 720, height: 0, content: { type: plain, value: "MARKETS" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.5 } }
      - { id: art-1-headline, type: text, z: 11, x: 60, y: 170, width: 720, height: 0, content: { type: plain, value: "Chipmakers Rally as Demand Forecasts Brighten for Second Half" }, style: { font_family: $heading, font_size: 44, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: art-1-deck, type: text, z: 12, x: 60, y: 320, width: 720, height: 0, content: { type: plain, value: "Inventory drawdowns and new AI orders push the sector to its best week of the year." }, style: { font_family: $body, font_size: 18, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: art-1-byline, type: text, z: 13, x: 60, y: 390, width: 720, height: 0, content: { type: plain, value: "BY DESHAUN PARK  ·  MARKETS DESK" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: art-1-photo, type: rect, z: 14, x: 60, y: 420, width: 720, height: 280, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 1 } }
      - { id: art-1-photo-ph, type: text, z: 15, x: 60, y: 550, width: 720, height: 0, content: { type: plain, value: "[ trading floor at closing bell ]" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: center, font_style: italic } }
      - { id: art-1-col-1, type: text, z: 16, x: 60, y: 720, width: 340, height: 0, content: { type: plain, value: "Shares of major semiconductor firms surged Friday as analysts revised second-half demand forecasts upward, citing a clear bottom in memory pricing and a fresh wave of AI infrastructure orders. The sector ended the week up 7.4 percent, its strongest five-day stretch since November." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: art-1-col-2, type: text, z: 16, x: 440, y: 720, width: 340, height: 0, content: { type: plain, value: "Three companies raised revenue guidance during after-hours calls, and traders pointed to easing inventories at hyperscalers as a catalyst. \"The cycle has turned,\" one fund manager said. Bond yields slipped slightly on the news. Earnings season picks up again Tuesday with two more chip suppliers reporting." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: art-1-rule, type: rect, z: 17, x: 60, y: 990, width: 720, height: 1, fill: { type: solid, color: "$border" } }
      - { id: art-2-kicker, type: text, z: 20, x: 60, y: 1020, width: 720, height: 0, content: { type: plain, value: "HOUSING" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.5 } }
      - { id: art-2-headline, type: text, z: 21, x: 60, y: 1050, width: 720, height: 0, content: { type: plain, value: "Mortgage Rates Slip Below 6% For the First Time This Spring" }, style: { font_family: $heading, font_size: 36, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: art-2-deck, type: text, z: 22, x: 60, y: 1170, width: 720, height: 0, content: { type: plain, value: "Refinance applications jumped 22% as borrowers move to lock in lower fixed terms." }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: art-2-byline, type: text, z: 23, x: 60, y: 1220, width: 720, height: 0, content: { type: plain, value: "BY MIA LERMAN  ·  REAL ESTATE" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: art-2-col-1, type: text, z: 24, x: 60, y: 1260, width: 340, height: 0, content: { type: plain, value: "Average 30-year fixed mortgage rates fell to 5.94 percent this week, the first sub-six print since February. Lenders pointed to softening yields and a more dovish reading of recent inflation data. Buyers, who have been on the sidelines for months, returned to open houses in noticeable numbers across the region." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: art-2-col-2, type: text, z: 24, x: 440, y: 1260, width: 340, height: 0, content: { type: plain, value: "Realtor groups cautioned that supply remains tight, with new listings still trailing pre-pandemic norms. Even so, mortgage application volume jumped 18 percent week-over-week. \"It's the first real green shoot we've seen all spring,\" said one broker. Analysts expect rates to drift further if jobs data softens." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.55, text_align: justify } }
      - { id: ads-rule, type: rect, z: 30, x: 820, y: 140, width: 2, height: 1370, fill: { type: solid, color: "$border" } }
      - { id: ads-header, type: text, z: 31, x: 840, y: 140, width: 340, height: 0, content: { type: plain, value: "MARKETPLACE" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: ad-1, type: rect, z: 32, x: 840, y: 180, width: 340, height: 220, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 2 } }
      - { id: ad-1-text, type: text, z: 33, x: 840, y: 240, width: 340, height: 0, content: { type: plain, value: "MARSH & HALE\nLAW OFFICES" }, style: { font_family: $heading, font_size: 26, font_weight: 800, color: $text, text_align: center, line_height: 1.2, letter_spacing: 0.02 } }
      - { id: ad-1-tag, type: text, z: 34, x: 840, y: 320, width: 340, height: 0, content: { type: plain, value: "Estate planning since 1962.\n(555) 014-7720" }, style: { font_family: $body, font_size: 13, color: $text_muted, text_align: center, line_height: 1.5 } }
      - { id: ad-2, type: rect, z: 32, x: 840, y: 420, width: 340, height: 200, fill: { type: solid, color: "$background" }, stroke: { color: "$text", width: 1 } }
      - { id: ad-2-head, type: text, z: 33, x: 840, y: 440, width: 340, height: 0, content: { type: plain, value: "CLASSIFIEDS" }, style: { font_family: $mono, font_size: 11, font_weight: 800, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: ad-2-body, type: text, z: 34, x: 860, y: 470, width: 300, height: 0, content: { type: plain, value: "FOR RENT · 2BR loft, downtown. River views.\n\nGARAGE SALE · Sat 9-2, 4180 Linden Court.\n\nLOST · Tabby cat, blue collar. Westside. Reward." }, style: { font_family: $body, font_size: 11, color: $text, line_height: 1.5 } }
      - { id: ad-3, type: rect, z: 32, x: 840, y: 640, width: 340, height: 280, fill: { type: solid, color: "$text" } }
      - { id: ad-3-head, type: text, z: 33, x: 840, y: 720, width: 340, height: 0, content: { type: plain, value: "SUMMER SALE" }, style: { font_family: $heading, font_size: 28, font_weight: 800, color: "$background", text_align: center, letter_spacing: 0.05 } }
      - { id: ad-3-mid, type: text, z: 34, x: 840, y: 770, width: 340, height: 0, content: { type: plain, value: "40% OFF" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: "$background", text_align: center, line_height: 1 } }
      - { id: ad-3-tag, type: text, z: 35, x: 840, y: 850, width: 340, height: 0, content: { type: plain, value: "Bridgepoint Outfitters · downtown" }, style: { font_family: $body, font_size: 13, color: "$background", text_align: center, opacity: 0.85 } }
      - { id: ad-4, type: rect, z: 32, x: 840, y: 940, width: 340, height: 220, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 1 } }
      - { id: ad-4-head, type: text, z: 33, x: 840, y: 970, width: 340, height: 0, content: { type: plain, value: "ELMHURST CONSERVATORY" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text, text_align: center, letter_spacing: 0.5 } }
      - { id: ad-4-mid, type: text, z: 34, x: 840, y: 1010, width: 340, height: 0, content: { type: plain, value: "Spring Recital" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: $text, text_align: center } }
      - { id: ad-4-tag, type: text, z: 35, x: 840, y: 1060, width: 340, height: 0, content: { type: plain, value: "Friday, May 22 · 7:30pm\nTickets $18 / $12 students" }, style: { font_family: $body, font_size: 13, color: $text_muted, text_align: center, line_height: 1.5 } }
      - { id: ad-5, type: rect, z: 32, x: 840, y: 1180, width: 340, height: 320, fill: { type: solid, color: "$background" }, stroke: { color: "$text", width: 1 } }
      - { id: ad-5-text, type: text, z: 33, x: 840, y: 1280, width: 340, height: 0, content: { type: plain, value: "[ display ad ]" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }
      - { id: foot-rule, type: rect, z: 60, x: 60, y: 1690, width: 1120, height: 2, fill: { type: solid, color: "$text" } }
      - { id: foot, type: text, z: 61, x: 60, y: 1710, width: 1120, height: 0, content: { type: plain, value: "THE MERIDIAN TIMES  ·  BUSINESS  ·  B2 / B3" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 3 · Editorial Page ────────────────────────────────
  - id: editorial-page
    label: Editorial
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: section-bar, type: text, z: 1, x: 60, y: 80, width: 1120, height: 0, content: { type: plain, value: "OPINION & EDITORIAL  ·  SUNDAY, MAY 17, 2026" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: section-rule, type: rect, z: 2, x: 60, y: 110, width: 1120, height: 2, fill: { type: solid, color: "$text" } }
      - { id: editorial-kicker, type: text, z: 10, x: 60, y: 140, width: 720, height: 0, content: { type: plain, value: "EDITORIAL BOARD" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text_muted, letter_spacing: 0.5 } }
      - { id: editorial-headline, type: text, z: 11, x: 60, y: 170, width: 720, height: 0, content: { type: plain, value: "After Decades, A City Bets on Itself Again" }, style: { font_family: $heading, font_size: 50, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: editorial-deck, type: text, z: 12, x: 60, y: 310, width: 720, height: 0, content: { type: plain, value: "The transit vote is not the end of the story — it is the moment we have permission to write a better one." }, style: { font_family: $body, font_size: 18, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: editorial-rule, type: rect, z: 13, x: 60, y: 400, width: 60, height: 3, fill: { type: solid, color: "$text" } }
      - { id: editorial-body, type: text, z: 14, x: 60, y: 430, width: 720, height: 0, content: { type: plain, value: "It would be tempting to treat Friday's vote as a finish line. After ten years of studies, three failed ballots, and a generation of riders who learned to plan their lives around late buses, the temptation to celebrate is understandable. The pages of this newspaper have argued for transit investment since long before the current council was elected; we are glad of the outcome.\n\nBut the outcome is also a beginning. The hard work — easements, environmental review, the long, unglamorous business of building anything in a dense city — starts now. The neighborhoods left out of the first phase deserve more than promises in a press conference. Riders who have endured the status quo deserve a clear timeline, not aspirational dates.\n\nThis page will keep watch. We will measure progress in stations opened, not announcements made. We will ask, every quarter, whether the buses run on time and whether the lines reach the people who need them most. The city has given itself permission to do something hard. Now we have to actually do it." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.6, text_align: justify } }
      - { id: editorial-sig, type: text, z: 15, x: 60, y: 1120, width: 720, height: 0, content: { type: plain, value: "— THE EDITORIAL BOARD" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: letters-rule, type: rect, z: 20, x: 60, y: 1180, width: 720, height: 1, fill: { type: solid, color: "$border" } }
      - { id: letters-header, type: text, z: 21, x: 60, y: 1200, width: 720, height: 0, content: { type: plain, value: "LETTERS TO THE EDITOR" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: letter-1, type: text, z: 22, x: 60, y: 1240, width: 340, height: 0, content: { type: plain, value: "\"I have ridden the 7 bus to work for twenty-two years. It is, generously, a coin flip whether I arrive on time. If a single train means I see my grandchildren more often, you can call that whatever you like — to me it is freedom.\"\n\nDOLORES KIM,\nWESTSIDE" }, style: { font_family: $body, font_size: 13, font_style: italic, color: $text, line_height: 1.55 } }
      - { id: letter-2, type: text, z: 22, x: 440, y: 1240, width: 340, height: 0, content: { type: plain, value: "\"I support the plan but worry the suburbs were an afterthought. Phase two cannot be a footnote. We pay the same taxes — we deserve the same buses, the same trains, the same trust.\"\n\nMARCUS OBI,\nFARNHAM HEIGHTS\n\nLETTERS may be sent to: letters@meridiantimes.co" }, style: { font_family: $body, font_size: 13, font_style: italic, color: $text, line_height: 1.55 } }
      - { id: cartoon-rule, type: rect, z: 30, x: 820, y: 140, width: 2, height: 1370, fill: { type: solid, color: "$border" } }
      - { id: cartoon-header, type: text, z: 31, x: 840, y: 140, width: 340, height: 0, content: { type: plain, value: "EDITORIAL CARTOON" }, style: { font_family: $mono, font_size: 13, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: cartoon-frame, type: rect, z: 32, x: 840, y: 180, width: 340, height: 360, fill: { type: solid, color: "$surface" }, stroke: { color: "$text", width: 2 } }
      - { id: cartoon-placeholder, type: text, z: 33, x: 840, y: 340, width: 340, height: 0, content: { type: plain, value: "[ cartoon ]" }, style: { font_family: $mono, font_size: 16, color: $text_muted, text_align: center, font_style: italic } }
      - { id: cartoon-caption, type: text, z: 34, x: 840, y: 560, width: 340, height: 0, content: { type: plain, value: "\"Hold my coffee — we just voted for something.\"" }, style: { font_family: $body, font_size: 13, font_style: italic, color: $text, text_align: center, line_height: 1.4 } }
      - { id: cartoon-credit, type: text, z: 35, x: 840, y: 620, width: 340, height: 0, content: { type: plain, value: "BY R. HAWLEY, MERIDIAN TIMES" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.4 } }
      - { id: column-rule, type: rect, z: 40, x: 840, y: 680, width: 340, height: 1, fill: { type: solid, color: "$border" } }
      - { id: column-header, type: text, z: 41, x: 840, y: 700, width: 340, height: 0, content: { type: plain, value: "COLUMN · JAMAL ROURKE" }, style: { font_family: $mono, font_size: 12, font_weight: 800, color: $text, letter_spacing: 0.5 } }
      - { id: column-title, type: text, z: 42, x: 840, y: 730, width: 340, height: 0, content: { type: plain, value: "The slow art of trusting each other again." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.25 } }
      - { id: column-body, type: text, z: 43, x: 840, y: 830, width: 340, height: 0, content: { type: plain, value: "Cynicism is cheap and it never built anything. The years when we could not pass a transit measure were not really about transit; they were about a city that had stopped believing it could finish what it started.\n\nIt is unfashionable to call a council vote inspiring. I am going to call it that anyway. We are, in a small and unglamorous way, learning to keep promises to one another again. May we have the patience to keep doing it." }, style: { font_family: $body, font_size: 13, color: $text, line_height: 1.6, text_align: justify } }
      - { id: foot-rule, type: rect, z: 60, x: 60, y: 1690, width: 1120, height: 2, fill: { type: solid, color: "$text" } }
      - { id: foot, type: text, z: 61, x: 60, y: 1710, width: 1120, height: 0, content: { type: plain, value: "THE MERIDIAN TIMES  ·  EDITORIAL  ·  A14" }, style: { font_family: $mono, font_size: 12, color: $text_muted, text_align: center, letter_spacing: 0.4 } }
