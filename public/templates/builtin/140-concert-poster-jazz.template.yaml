_protocol: template/v1

# Jazz club poster (1200×1800 portrait).
# Editorial cream, art-deco gold rules, elegant serif band name with PRESENTS
# eyebrow, venue + date and three signature pieces listed.
meta:
  id: tmpl-concert-poster-jazz
  name: Concert Poster — Jazz
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, concert, music, jazz, club, art-deco, elegant]
  description: "Elegant jazz club poster with art-deco gold rules, serif band name and signature pieces."

document:
  width: 1200
  height: 1800
  unit: px
  dpi: 96

theme:
  ref: editorial-cream
  overrides:
    primary: "#B7892C"
    secondary: "#1A1A1A"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1800
    fill: { type: solid, color: "$background" }

  - id: frame-outer
    type: rect
    z: 1
    x: 60
    y: 60
    width: 1080
    height: 1680
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }

  - id: frame-inner
    type: rect
    z: 2
    x: 80
    y: 80
    width: 1040
    height: 1640
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 1 }
    opacity: 0.55

  - id: deco-rule-top-left
    type: rect
    z: 3
    x: 140
    y: 220
    width: 280
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: deco-rule-top-right
    type: rect
    z: 4
    x: 780
    y: 220
    width: 280
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: deco-diamond-top
    type: rect
    z: 5
    x: 588
    y: 206
    width: 24
    height: 24
    rotation: 45
    fill: { type: solid, color: "$primary" }

  - id: presents
    type: text
    z: 10
    x: 80
    y: 260
    width: 1040
    height: 0
    content: { type: plain, value: "THE BLUE LANTERN PRESENTS" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $primary
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: an-evening
    type: text
    z: 11
    x: 80
    y: 340
    width: 1040
    height: 0
    content: { type: plain, value: "An Evening with" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 400
      font_style: italic
      color: $secondary
      letter_spacing: 0.02
      text_align: center

  - id: band-name
    type: text
    z: 12
    x: 80
    y: 410
    width: 1040
    height: 0
    content:
      type: plain
      value: "Marcel Devereaux\n& His Quintet"
    style:
      font_family: $heading
      font_size: 90
      font_weight: 700
      color: $secondary
      line_height: 1.05
      letter_spacing: -0.01
      text_align: center

  - id: deco-rule-mid-left
    type: rect
    z: 20
    x: 240
    y: 720
    width: 220
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: deco-rule-mid-right
    type: rect
    z: 21
    x: 740
    y: 720
    width: 220
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: deco-circle-mid
    type: circle
    z: 22
    cx: 600
    cy: 720
    rx: 8
    ry: 8
    fill: { type: solid, color: "$primary" }

  - id: program-label
    type: text
    z: 23
    x: 80
    y: 760
    width: 1040
    height: 0
    content: { type: plain, value: "PROGRAMME" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: piece-1
    type: text
    z: 24
    x: 80
    y: 820
    width: 1040
    height: 0
    content: { type: plain, value: "Round Midnight" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 400
      font_style: italic
      color: $secondary
      letter_spacing: 0.01
      text_align: center

  - id: piece-2
    type: text
    z: 25
    x: 80
    y: 890
    width: 1040
    height: 0
    content: { type: plain, value: "Autumn Leaves" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 400
      font_style: italic
      color: $secondary
      letter_spacing: 0.01
      text_align: center

  - id: piece-3
    type: text
    z: 26
    x: 80
    y: 960
    width: 1040
    height: 0
    content: { type: plain, value: "So What" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 400
      font_style: italic
      color: $secondary
      letter_spacing: 0.01
      text_align: center

  - id: deco-rule-bottom-left
    type: rect
    z: 30
    x: 140
    y: 1280
    width: 280
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: deco-rule-bottom-right
    type: rect
    z: 31
    x: 780
    y: 1280
    width: 280
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: deco-diamond-bottom
    type: rect
    z: 32
    x: 588
    y: 1266
    width: 24
    height: 24
    rotation: 45
    fill: { type: solid, color: "$primary" }

  - id: venue
    type: text
    z: 40
    x: 80
    y: 1340
    width: 1040
    height: 0
    content: { type: plain, value: "THE BLUE LANTERN JAZZ CLUB" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 700
      color: $secondary
      letter_spacing: 0.18
      text_align: center
      text_transform: uppercase

  - id: date
    type: text
    z: 41
    x: 80
    y: 1400
    width: 1040
    height: 0
    content: { type: plain, value: "Friday, the 9th of October 2026" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 400
      font_style: italic
      color: $secondary
      letter_spacing: 0.02
      text_align: center

  - id: time
    type: text
    z: 42
    x: 80
    y: 1450
    width: 1040
    height: 0
    content: { type: plain, value: "TWO SETS · 20:30 & 22:30" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: footer-rule
    type: rect
    z: 50
    x: 360
    y: 1620
    width: 480
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: footer
    type: text
    z: 51
    x: 80
    y: 1650
    width: 1040
    height: 0
    content: { type: plain, value: "RESERVATIONS · BLUELANTERN.JAZZ · TICKETS FROM €28" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 600
      color: $primary
      letter_spacing: 0.38
      text_align: center
      text_transform: uppercase

slots:
  - { id: band_name, path: "layers[8].content.value",  type: text, hint: "Band / artist name (2 lines)", default: "Marcel Devereaux\n& His Quintet" }
  - { id: venue,     path: "layers[19].content.value", type: text, hint: "Venue name",                   default: "THE BLUE LANTERN JAZZ CLUB" }
  - { id: date,      path: "layers[20].content.value", type: text, hint: "Show date",                    default: "Friday, the 9th of October 2026" }
  - { id: time,      path: "layers[21].content.value", type: text, hint: "Set times",                    default: "TWO SETS · 20:30 & 22:30" }
  - { id: piece_1,   path: "layers[13].content.value", type: text, hint: "Programme piece 1",            default: "Round Midnight" }
  - { id: piece_2,   path: "layers[14].content.value", type: text, hint: "Programme piece 2",            default: "Autumn Leaves" }
  - { id: piece_3,   path: "layers[15].content.value", type: text, hint: "Programme piece 3",            default: "So What" }
