_protocol: template/v1

# Wedding program insert — 1080×1500 portrait, editorial-cream theme.
# Couple header → ORDER OF SERVICE 8-item list → officiant footer.
meta:
  id: tmpl-wedding-program-insert
  name: Wedding Program Insert
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, wedding, program, ceremony, order-of-service, editorial, portrait]
  description: "Ceremony program insert with order of service in eight movements and officiant footer."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1 outer frame
  - { id: outer-frame, type: rect, z: 1, x: 60, y: 60, width: 960, height: 1380, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 2 inner frame
  - { id: inner-frame, type: rect, z: 2, x: 78, y: 78, width: 924, height: 1344, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
  # 3 top ornament
  - { id: orn-top, type: text, z: 5, x: 80, y: 170, width: 920, height: 0, content: { type: plain, value: "❦  ·  ✦  ·  ❦" }, style: { font_family: $heading, font_size: 24, color: "$primary", text_align: center, letter_spacing: 0.4 } }
  # 4 couple names
  - { id: couple, type: text, z: 10, x: 80, y: 220, width: 920, height: 0, content: { type: plain, value: "Amelia & Jonathan" }, style: { font_family: $heading, font_size: 72, font_style: italic, font_weight: 400, color: "$text", text_align: center, line_height: 1.1 } }
  # 5 wedding date
  - { id: wed-date, type: text, z: 11, x: 80, y: 320, width: 920, height: 0, content: { type: plain, value: "the twenty-fourth of May · twenty twenty-six" }, style: { font_family: $body, font_size: 18, color: "$text_muted", text_align: center, letter_spacing: 0.3 } }
  # 6 short rule
  - { id: rule-top, type: rect, z: 12, x: 490, y: 380, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 7 eyebrow
  - { id: eyebrow, type: text, z: 13, x: 80, y: 410, width: 920, height: 0, content: { type: plain, value: "ORDER OF SERVICE" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.8, text_transform: uppercase } }
  # 8–15 service items (each is one line, label + dash + title)
  - { id: s1, type: text, z: 20, x: 140, y: 490, width: 800, height: 0, content: { type: plain, value: "I.   Processional" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s1-desc, type: text, z: 21, x: 140, y: 528, width: 800, height: 0, content: { type: plain, value: "Canon in D · Pachelbel" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s2, type: text, z: 20, x: 140, y: 580, width: 800, height: 0, content: { type: plain, value: "II.  Welcome & Opening Words" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s2-desc, type: text, z: 21, x: 140, y: 618, width: 800, height: 0, content: { type: plain, value: "Officiant greets family and friends" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s3, type: text, z: 20, x: 140, y: 670, width: 800, height: 0, content: { type: plain, value: "III. Readings" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s3-desc, type: text, z: 21, x: 140, y: 708, width: 800, height: 0, content: { type: plain, value: "Sonnet 116 · read by Margaret Hale" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s4, type: text, z: 20, x: 140, y: 760, width: 800, height: 0, content: { type: plain, value: "IV.  Exchange of Vows" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s4-desc, type: text, z: 21, x: 140, y: 798, width: 800, height: 0, content: { type: plain, value: "Written by the couple" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s5, type: text, z: 20, x: 140, y: 850, width: 800, height: 0, content: { type: plain, value: "V.   Exchange of Rings" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s5-desc, type: text, z: 21, x: 140, y: 888, width: 800, height: 0, content: { type: plain, value: "Presented by the ring bearer" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s6, type: text, z: 20, x: 140, y: 940, width: 800, height: 0, content: { type: plain, value: "VI.  Declaration of Marriage" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s6-desc, type: text, z: 21, x: 140, y: 978, width: 800, height: 0, content: { type: plain, value: "Pronouncement & first kiss" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s7, type: text, z: 20, x: 140, y: 1030, width: 800, height: 0, content: { type: plain, value: "VII. Signing of the Register" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s7-desc, type: text, z: 21, x: 140, y: 1068, width: 800, height: 0, content: { type: plain, value: "Witnessed by parents of the couple" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  - { id: s8, type: text, z: 20, x: 140, y: 1120, width: 800, height: 0, content: { type: plain, value: "VIII. Recessional" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$text", line_height: 1.4 } }
  - { id: s8-desc, type: text, z: 21, x: 140, y: 1158, width: 800, height: 0, content: { type: plain, value: "Spring · Vivaldi · please follow us to the garden" }, style: { font_family: $body, font_size: 15, color: "$text_muted" } }
  # 24 short rule
  - { id: rule-bot, type: rect, z: 30, x: 490, y: 1260, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 25 officiant label
  - { id: off-lbl, type: text, z: 31, x: 80, y: 1290, width: 920, height: 0, content: { type: plain, value: "OFFICIATED BY" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.6 } }
  # 26 officiant name
  - { id: off-name, type: text, z: 32, x: 80, y: 1320, width: 920, height: 0, content: { type: plain, value: "Reverend Clara Whitfield" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: "$text", text_align: center } }
  # 27 bottom ornament
  - { id: orn-bot, type: text, z: 33, x: 80, y: 1390, width: 920, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 22, color: "$primary", text_align: center } }

slots:
  - { id: couple_names, path: "layers[4].content.value",  type: text, hint: "Couple names",   default: "Amelia & Jonathan" }
  - { id: wedding_date, path: "layers[5].content.value",  type: text, hint: "Wedding date",   default: "the twenty-fourth of May · twenty twenty-six" }
  - { id: officiant,    path: "layers[26].content.value", type: text, hint: "Officiant name", default: "Reverend Clara Whitfield" }
