_protocol: template/v1

# LinkedIn carousel — 5-slide prioritization frameworks.
# Corporate-slate theme, 1080×1350.
meta:
  id: tmpl-linkedin-prioritization-5slide
  name: LinkedIn Prioritization (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, product, prioritization, framework, "4-5"]
  description: "Cover + intro + 3 frameworks (RICE, ICE, MoSCoW) + CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Slide 1 · Cover ─────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 165, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "1 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 520, width: 960, height: 0, content: { type: plain, value: "PM FRAMEWORKS" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "Stop saying yes\nto everything." }, style: { font_family: $heading, font_size: 100, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "3 prioritization frameworks. Swipe →" }, style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 2 · Intro ─────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "2 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "THE REAL JOB" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 240, width: 960, height: 0, content: { type: plain, value: "PM is the\nart of saying no." }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: body, type: text, z: 13, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "Every yes is a no to something else. The question is never \"is this valuable?\" — everything is. The question is \"is this MOST valuable, right now?\"" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: callout, type: text, z: 14, x: 60, y: 940, width: 960, height: 0, content: { type: plain, value: "→ Pick one framework. Use it every sprint." }, style: { font_family: $body, font_size: 24, font_weight: 600, color: $primary, line_height: 1.4 } }
      - { id: handle, type: text, z: 15, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 3 · 01 RICE ───────────────────────────────────
  - id: rice
    label: 01 RICE
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "3 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "RICE" }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: how-label, type: text, z: 20, x: 60, y: 520, width: 960, height: 0, content: { type: plain, value: "HOW TO" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: how-body, type: text, z: 21, x: 60, y: 560, width: 960, height: 0, content: { type: plain, value: "Score = (Reach × Impact × Confidence) / Effort.\nReach = users/qtr · Impact 0.25–3 · Confidence 0–100% · Effort in person-months." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 } }
      - { id: when-label, type: text, z: 22, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "WHEN TO USE" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: when-body, type: text, z: 23, x: 60, y: 860, width: 960, height: 0, content: { type: plain, value: "Big backlog · need defensible scoring across teams · stakes are real." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 30, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 4 · 02 ICE ────────────────────────────────────
  - id: ice
    label: 02 ICE
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "4 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "ICE" }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: how-label, type: text, z: 20, x: 60, y: 520, width: 960, height: 0, content: { type: plain, value: "HOW TO" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: how-body, type: text, z: 21, x: 60, y: 560, width: 960, height: 0, content: { type: plain, value: "Score = Impact × Confidence × Ease (each 1–10).\nFast, vibes-based, repeatable in a 30-min meeting." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 } }
      - { id: when-label, type: text, z: 22, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "WHEN TO USE" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: when-body, type: text, z: 23, x: 60, y: 860, width: 960, height: 0, content: { type: plain, value: "Growth experiments · weekly hackathons · small team · need speed > rigor." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 30, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 5 · 03 MoSCoW + CTA ───────────────────────────
  - id: moscow-cta
    label: 03 MoSCoW + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 200, stops: [{ color: "$primary", position: 0 }, { color: "$background", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(10,15,30,0.55)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "5 / 5" }, style: { font_family: $mono, font_size: 18, color: "#FFFFFF" } }
      - { id: section-num, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 100, font_weight: 900, color: "$accent", line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 290, width: 960, height: 0, content: { type: plain, value: "MoSCoW" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: how-body, type: text, z: 20, x: 60, y: 430, width: 960, height: 0, content: { type: plain, value: "Must · Should · Could · Won't (this round).\nForce ≤60% of capacity into Must — the rest is buffer." }, style: { font_family: $body, font_size: 22, color: "#F0F0FF", line_height: 1.5 } }
      - { id: when-body, type: text, z: 21, x: 60, y: 620, width: 960, height: 0, content: { type: plain, value: "When · scoping a release with stakeholders who hate trade-offs." }, style: { font_family: $body, font_size: 22, color: "#F0F0FF", line_height: 1.5 } }
      - { id: cta-heading, type: text, z: 30, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "Save → say no\nwith data." }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: cta-btn, type: rect, z: 31, x: 60, y: 1090, width: 320, height: 68, radius: 34, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 32, x: 60, y: 1110, width: 320, height: 0, content: { type: plain, value: "Follow →" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$primary", text_align: center } }
      - { id: handle, type: text, z: 33, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF" } }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",      default: "Stop saying yes\nto everything." }
  - { id: cover_tagline,  path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",       default: "3 prioritization frameworks. Swipe →" }
  - { id: intro_title,    path: "pages[1].layers[4].content.value", type: text, hint: "Intro title",         default: "PM is the\nart of saying no." }
  - { id: intro_body,     path: "pages[1].layers[5].content.value", type: text, hint: "Intro body",          default: "Every yes is a no to something else. The question is never \"is this valuable?\" — everything is. The question is \"is this MOST valuable, right now?\"" }
  - { id: rice_how,       path: "pages[2].layers[6].content.value", type: text, hint: "RICE how-to",         default: "Score = (Reach × Impact × Confidence) / Effort.\nReach = users/qtr · Impact 0.25–3 · Confidence 0–100% · Effort in person-months." }
  - { id: rice_when,      path: "pages[2].layers[8].content.value", type: text, hint: "RICE when",           default: "Big backlog · need defensible scoring across teams · stakes are real." }
  - { id: ice_how,        path: "pages[3].layers[6].content.value", type: text, hint: "ICE how-to",          default: "Score = Impact × Confidence × Ease (each 1–10).\nFast, vibes-based, repeatable in a 30-min meeting." }
  - { id: moscow_how,     path: "pages[4].layers[6].content.value", type: text, hint: "MoSCoW how",          default: "Must · Should · Could · Won't (this round).\nForce ≤60% of capacity into Must — the rest is buffer." }
  - { id: cta_heading,    path: "pages[4].layers[8].content.value", type: text, hint: "CTA heading",         default: "Save → say no\nwith data." }
