# Thermal-printer receipt — 600×1400 narrow portrait, mono-print theme.
# Monospace throughout. Store name centered, address, item rows with
# dotted leader feel via right-aligned price column, totals, barcode
# placeholder, thank-you footer. Tear-edge top + bottom decoration.
meta:
  id: tmpl-receipt-thermal
  name: Receipt · Thermal Print
  type: invoice
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [receipt, thermal, retail, transaction, mono, narrow]
  description: "Thermal-printer receipt with store name, items, totals, transaction ID, barcode placeholder, and thank-you footer."

