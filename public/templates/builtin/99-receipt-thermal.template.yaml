    fill: { type: solid, color: "$background" }
    stroke: { color: "$text", width: 1 }

  - id: tear-top-2
    type: polygon
    z: 2
    points: "40,0 100,0 70,20"
    fill: { type: solid, color: "$background" }
    stroke: { color: "$text", width: 1 }
    opacity: 0.4

  - id: tear-top-rule
    type: line
    z: 3
    x1: 0
    y1: 22
    x2: 600
    y2: 22
    stroke:
      color: "$text"
      width: 1
