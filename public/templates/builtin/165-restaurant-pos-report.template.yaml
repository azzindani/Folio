_protocol: template/v1

# Restaurant POS daily — eyebrow, hero, 5 KPIs (sales, covers, avg check,
# labor %, food %), hourly sales line 12pm-11pm, top menu items table,
# server leaderboard table, dining section utilization bar.
meta:
  id: tmpl-restaurant-pos-report
  name: Restaurant POS · Daily Performance
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, restaurant, pos, hospitality, daily, interactive]
  description: "Daily restaurant operations report: sales, labor, food cost, hourly sales curve, menu mix, server leaderboard."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: forest-deep

report:
  layout: scroll
  data:
    sources:
      - id: hourly_sales
        type: inline
        rows:
          - { hour: "12 PM", sales:  486, covers: 18 }
          - { hour: "1 PM",  sales:  812, covers: 28 }
          - { hour: "2 PM",  sales:  642, covers: 22 }
          - { hour: "3 PM",  sales:  324, covers: 12 }
          - { hour: "4 PM",  sales:  286, covers: 10 }
          - { hour: "5 PM",  sales:  724, covers: 24 }
          - { hour: "6 PM",  sales: 1284, covers: 42 }
          - { hour: "7 PM",  sales: 1846, covers: 58 }
          - { hour: "8 PM",  sales: 1968, covers: 62 }
          - { hour: "9 PM",  sales: 1542, covers: 48 }
          - { hour: "10 PM", sales:  962, covers: 32 }
          - { hour: "11 PM", sales:  486, covers: 16 }
      - id: top_menu
        type: inline
        rows:
          - { dish: "Truffle Risotto",            sold:  62, revenue: 1736, food_cost: 422, margin_pct: 76 }
          - { dish: "Pan-Seared Salmon",          sold:  58, revenue: 1682, food_cost: 528, margin_pct: 69 }
          - { dish: "Wagyu Burger",               sold:  84, revenue: 2268, food_cost: 824, margin_pct: 64 }
          - { dish: "Margherita Pizza",           sold:  92, revenue: 1564, food_cost: 392, margin_pct: 75 }
          - { dish: "Caesar Salad",               sold:  76, revenue:  988, food_cost: 198, margin_pct: 80 }
          - { dish: "Filet Mignon 8oz",           sold:  42, revenue: 2184, food_cost: 798, margin_pct: 63 }
          - { dish: "Lobster Mac & Cheese",       sold:  38, revenue: 1216, food_cost: 384, margin_pct: 68 }
          - { dish: "Tuna Tartare",               sold:  34, revenue:  748, food_cost: 218, margin_pct: 71 }
          - { dish: "Crème Brûlée",               sold:  68, revenue:  748, food_cost: 142, margin_pct: 81 }
          - { dish: "House Old Fashioned",        sold: 102, revenue: 1632, food_cost: 286, margin_pct: 82 }
      - id: server_leaderboard
        type: inline
        rows:
          - { server: "Marcus Reed",        covers: 58, sales: 2842, avg_check: 49, tips_pct: 22.4 }
          - { server: "Isabella Ortiz",     covers: 64, sales: 3186, avg_check: 50, tips_pct: 24.6 }
          - { server: "Jamal Carter",       covers: 52, sales: 2624, avg_check: 50, tips_pct: 20.8 }
          - { server: "Sophia Nakamura",    covers: 48, sales: 2486, avg_check: 52, tips_pct: 23.2 }
          - { server: "Liam O'Brien",       covers: 42, sales: 1968, avg_check: 47, tips_pct: 18.4 }
          - { server: "Aria Patel",         covers: 56, sales: 2842, avg_check: 51, tips_pct: 21.8 }
          - { server: "Diego Rivera",       covers: 38, sales: 1742, avg_check: 46, tips_pct: 19.2 }
          - { server: "Chloe Bergman",      covers: 44, sales: 2186, avg_check: 50, tips_pct: 22.6 }
