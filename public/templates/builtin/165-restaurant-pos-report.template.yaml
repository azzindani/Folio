          - { section: "Booth Section",     turn_rate: 3.4, occupancy_pct: 88 }

pages:
  - id: daily
    label: Daily
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "OAK & EMBER · 2026-05-17 SATURDAY · DAILY OPS REPORT"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**Daily Performance — Service Report**\n*Sales, covers, hourly curve, menu mix, server leaderboard, and section utilization.*"

      - id: kpi-sales
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Sales
        value: 11362
        format: currency
        currency: USD
        delta: 14.6
        delta_format: percent
        sparkline_data: hourly_sales
        sparkline_field: sales
        sparkline_color: "$primary"

      - id: kpi-covers
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Covers
        value: 372
        format: number
        delta: 8.4
        delta_format: percent

      - id: kpi-check
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Avg Check
        value: 49
        format: currency
        currency: USD
        delta: 5.8
        delta_format: percent

      - id: kpi-labor
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Labor Cost %
        value: 26.4
        format: percent
        delta: -1.2
        delta_format: percent

      - id: kpi-food
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Food Cost %
        value: 29.8
        format: percent
        delta: -0.8
        delta_format: percent

      - id: section-hours
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Hourly Sales — Lunch through Late Night**"

      - id: chart-hours
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 400
        chart_type: line
        data_ref: hourly_sales
        x_field: hour
        y_field: sales
        title: Sales and Covers by Hour
        legend: true
        grid: true
        animate: true

      - id: section-menu
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top 10 Menu Items — Today**"

      - id: tbl-menu
        type: interactive_table
        x: 60
        y: 960
        width: 1160
        height: 540
        data_ref: top_menu
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: dish,         title: Dish,           width: 360, sortable: true }
          - { field: sold,         title: Sold,           width: 160, sortable: true, formatter: number,   align: right }
          - { field: revenue,      title: Revenue USD,    width: 200, sortable: true, formatter: currency, align: right }
          - { field: food_cost,    title: Food Cost USD,  width: 200, sortable: true, formatter: currency, align: right }
          - { field: margin_pct,   title: Margin %,       width: 240, sortable: true, formatter: percent,  align: right }

      - id: section-servers
        type: rich_text
        x: 60
        y: 1540
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Server Leaderboard — Tonight's Shift**"

      - id: tbl-servers
        type: interactive_table
        x: 60
        y: 1600
        width: 1160
        height: 440
        data_ref: server_leaderboard
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: server,      title: Server,         width: 300, sortable: true }
          - { field: covers,      title: Covers,         width: 180, sortable: true, formatter: number,   align: right }
          - { field: sales,       title: Sales USD,      width: 200, sortable: true, formatter: currency, align: right }
          - { field: avg_check,   title: Avg Check USD,  width: 220, sortable: true, formatter: currency, align: right }
          - { field: tips_pct,    title: Tips %,         width: 260, sortable: true, formatter: percent,  align: right }

      - id: section-sections
        type: rich_text
        x: 60
        y: 2080
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Section Utilization — Floor Plan**"

      - id: chart-sections
        type: interactive_chart
        x: 60
        y: 2140
        width: 1160
        height: 240
        chart_type: bar
        data_ref: section_utilization
        x_field: section
        y_field: occupancy_pct
        title: Occupancy % by Dining Section
        legend: false
        grid: true
        animate: true

slots:
  - { id: report_title,       path: "pages[0].layers[1].content",  type: text, hint: "Report title",     default: "**Daily Performance — Service Report**\n*Sales, covers, hourly curve, menu mix, server leaderboard, and section utilization.*" }
  - { id: report_eyebrow,     path: "pages[0].layers[0].content",  type: text, hint: "Date eyebrow",     default: "OAK & EMBER · 2026-05-17 SATURDAY · DAILY OPS REPORT" }
  - { id: hours_section,      path: "pages[0].layers[7].content",  type: text, hint: "Hours heading",    default: "**Hourly Sales — Lunch through Late Night**" }
  - { id: menu_section,       path: "pages[0].layers[9].content",  type: text, hint: "Menu heading",     default: "**Top 10 Menu Items — Today**" }
  - { id: servers_section,    path: "pages[0].layers[11].content", type: text, hint: "Servers heading",  default: "**Server Leaderboard — Tonight's Shift**" }
  - { id: sections_section,   path: "pages[0].layers[13].content", type: text, hint: "Sections heading", default: "**Section Utilization — Floor Plan**" }
