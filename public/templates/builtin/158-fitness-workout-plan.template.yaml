    width: 60
    height: 0
    content: { type: plain, value: "05" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, line_height: 1.4 }

  - id: ex5-name
    type: text
    z: 57
    x: 140
    y: 770
    width: 660
    height: 0
    content: { type: plain, value: "Pull-Ups (weighted)" }
    style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.3 }

  - id: ex5-sets
    type: text
    z: 58
    x: 60
    y: 772
    width: 960
    height: 0
    content: { type: plain, value: "4 × 8  @ RPE 8" }
    style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, text_align: right, line_height: 1.3 }

  - id: ex5-rule
    type: rect
    z: 59
    x: 60
    y: 830
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Exercise 6: Romanian deadlift ─────────────────────────
  - id: ex6-num
    type: text
    z: 60
    x: 60
    y: 850
    width: 60
    height: 0
    content: { type: plain, value: "06" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, line_height: 1.4 }

