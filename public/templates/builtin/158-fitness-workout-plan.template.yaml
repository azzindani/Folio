    stroke: { color: "$primary", width: 2 }

  - id: rest-header
    type: text
    z: 81
    x: 100
    y: 1160
    width: 880
    height: 0
    content: { type: plain, value: "REST BETWEEN SETS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      letter_spacing: 0.4
