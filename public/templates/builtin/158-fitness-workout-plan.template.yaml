_protocol: template/v1

# Fitness workout plan — 1080×1920 portrait, forest-deep theme.
# Program name top, week/day eyebrow, 8 exercises listed as
# name + sets×reps rows, rest-time advisory, RPE legend.
meta:
  id: tmpl-fitness-workout-plan
  name: Fitness Workout Plan
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [fitness, workout, training, plan, portrait, forest]
  description: "Strength workout plan with 8 exercises, sets and reps, rest advisory, and RPE legend."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: forest-deep

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  - id: top-accent
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 12
    fill: { type: solid, color: "$primary" }

  # ── Eyebrow ───────────────────────────────────────────────
  - id: program-eyebrow
    type: text
    z: 10
    x: 60
    y: 80
    width: 960
    height: 0
    content: { type: plain, value: "STRENGTH PROGRAM" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 800
      color: $primary
      letter_spacing: 0.48
      text_transform: uppercase

  # ── Program name (big) ────────────────────────────────────
  - id: program-name
    type: text
    z: 11
    x: 60
    y: 120
    width: 960
    height: 0
    content: { type: plain, value: "Foundation 5×5" }
    style:
      font_family: $heading
      font_size: 100
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.03

  # ── Week / Day labels ─────────────────────────────────────
  - id: week-pill
    type: rect
    z: 20
    x: 60
    y: 270
    width: 200
    height: 56
    radius: 28
    fill: { type: solid, color: "$primary" }

  - id: week-label
    type: text
    z: 21
    x: 60
    y: 286
    width: 200
    height: 0
    content: { type: plain, value: "WEEK 01" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.4
      text_align: center

  - id: day-pill
    type: rect
    z: 22
    x: 280
    y: 270
    width: 220
    height: 56
    radius: 28
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: day-label
    type: text
    z: 23
    x: 280
    y: 286
    width: 220
    height: 0
    content: { type: plain, value: "DAY 1 · PUSH" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 800
      color: $text
      letter_spacing: 0.4
      text_align: center

  # ── Section header ────────────────────────────────────────
  - id: section-header
    type: text
    z: 30
    x: 60
    y: 380
    width: 960
    height: 0
    content: { type: plain, value: "MAIN LIFTS · 8 EXERCISES" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: section-rule
    type: rect
    z: 31
    x: 60
    y: 410
    width: 960
    height: 2
    fill: { type: solid, color: "$primary" }

  # ── Exercise 1: Back squat ────────────────────────────────
  - id: ex1-num
    type: text
    z: 40
    x: 60
    y: 450
    width: 60
    height: 0
    content: { type: plain, value: "01" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, line_height: 1.4 }

  - id: ex1-name
    type: text
    z: 41
    x: 140
    y: 450
    width: 660
    height: 0
    content: { type: plain, value: "Back Squat" }
    style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.3 }

  - id: ex1-sets
    type: text
    z: 42
    x: 60
    y: 452
    width: 960
    height: 0
    content: { type: plain, value: "5 × 5  @ RPE 8" }
    style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, text_align: right, line_height: 1.3 }

  - id: ex1-rule
    type: rect
    z: 43
    x: 60
    y: 510
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Exercise 2: Bench press ───────────────────────────────
  - id: ex2-num
    type: text
    z: 44
    x: 60
    y: 530
    width: 60
    height: 0
