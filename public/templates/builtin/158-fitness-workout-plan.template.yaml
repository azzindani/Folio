    width: 960
    height: 0
    content: { type: plain, value: "4 × 6  @ RPE 7" }
    style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, text_align: right, line_height: 1.3 }

  - id: ex4-rule
    type: rect
    z: 55
    x: 60
    y: 750
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Exercise 5: Pull-ups ──────────────────────────────────
  - id: ex5-num
    type: text
    z: 56
    x: 60
