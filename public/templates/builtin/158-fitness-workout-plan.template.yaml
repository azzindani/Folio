    z: 46
    x: 60
    y: 532
    width: 960
    height: 0
    content: { type: plain, value: "5 × 5  @ RPE 8" }
    style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, text_align: right, line_height: 1.3 }

  - id: ex2-rule
    type: rect
    z: 47
    x: 60
    y: 590
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Exercise 3: Deadlift ──────────────────────────────────
  - id: ex3-num
    type: text
    z: 48
    x: 60
    y: 610
    width: 60
    height: 0
    content: { type: plain, value: "03" }
    style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, line_height: 1.4 }

  - id: ex3-name
    type: text
    z: 49
    x: 140
    y: 610
    width: 660
    height: 0
    content: { type: plain, value: "Conventional Deadlift" }
    style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.3 }

  - id: ex3-sets
    type: text
    z: 50
    x: 60
    y: 612
    width: 960
    height: 0
    content: { type: plain, value: "1 × 5  @ RPE 9" }
    style: { font_family: $mono, font_size: 26, font_weight: 700, color: $text, text_align: right, line_height: 1.3 }

  - id: ex3-rule
    type: rect
    z: 51
    x: 60
    y: 670
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Exercise 4: Overhead press ────────────────────────────
  - id: ex4-num
    type: text
    z: 52
    x: 60
    y: 690
    width: 60
