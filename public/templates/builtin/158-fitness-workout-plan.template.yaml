    x: 60
    y: 1400
    width: 960
    height: 1
    fill: { type: solid, color: "$border" }

  - id: rpe-6
    type: text
    z: 92
    x: 60
    y: 1430
    width: 960
    height: 0
    content: { type: plain, value: "RPE 6  —  4 reps left in the tank · warm-up pace" }
    style: { font_family: $body, font_size: 20, color: $text, line_height: 1.6 }

  - id: rpe-7
    type: text
    z: 93
    x: 60
    y: 1480
    width: 960
    height: 0
    content: { type: plain, value: "RPE 7  —  3 reps left · moving smoothly" }
    style: { font_family: $body, font_size: 20, color: $text, line_height: 1.6 }

  - id: rpe-8
    type: text
    z: 94
    x: 60
    y: 1530
    width: 960
    height: 0
    content: { type: plain, value: "RPE 8  —  2 reps left · controlled but hard" }
    style: { font_family: $body, font_size: 20, color: $text, line_height: 1.6 }

  - id: rpe-9
    type: text
    z: 95
    x: 60
    y: 1580
    width: 960
    height: 0
    content: { type: plain, value: "RPE 9  —  1 rep left · maximum focus" }
    style: { font_family: $body, font_size: 20, color: $text, line_height: 1.6 }

  - id: rpe-10
    type: text
    z: 96
    x: 60
    y: 1630
    width: 960
    height: 0
    content: { type: plain, value: "RPE 10 —  no reps left · true max effort" }
    style: { font_family: $body, font_size: 20, color: $text, line_height: 1.6 }

  # ── Bottom accent + footer ────────────────────────────────
  - id: bottom-accent
    type: rect
    z: 100
    x: 0
    y: 1820
    width: 1080
    height: 4
    fill: { type: solid, color: "$primary" }

  - id: footer
    type: text
    z: 101
    x: 60
    y: 1860
    width: 960
    height: 0
    content: { type: plain, value: "Warm up 10 min  ·  Hydrate every set  ·  Sleep 7+ h tonight" }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.4

slots:
  - { id: program_name, path: "layers[3].content.value", type: text, hint: "Program name (big)",  default: "Foundation 5×5" }
  - { id: week_label,   path: "layers[5].content.value", type: text, hint: "Week label",          default: "WEEK 01" }
  - { id: day_label,    path: "layers[7].content.value", type: text, hint: "Day / split label",   default: "DAY 1 · PUSH" }
