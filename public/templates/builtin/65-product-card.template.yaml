_protocol: template/v1

# Single-product spotlight card — 4:5 portrait (1080×1350) for Instagram/social commerce.
# Photo placeholder on top 55%, rating stars, price + strike, color/size pills, CTA.
meta:
  id: tmpl-product-card
  name: Product Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, product, ecommerce, instagram, pastel, portrait]

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # 0 — background
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1350
    fill: { type: solid, color: "$background" }

  # 1 — product photo placeholder (top 55%)
  - id: photo
    type: rect
    z: 5
    x: 60
    y: 60
    width: 960
    height: 740
    radius: 32
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$surface2", position: 0 }
        - { color: "$secondary", position: 100 }

  # 2 — photo glyph (placeholder emoji)
  - id: photo-glyph
    type: text
    z: 6
    x: 60
    y: 380
    width: 960
    height: 0
    content: { type: plain, value: "🛍️" }
    style:
      font_family: $heading
      font_size: 140
      color: "#FFFFFF"
      text_align: center

  # 3 — eyebrow (category/badge)
  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 860
    width: 920
    height: 0
    content: { type: plain, value: "NEW · SUMMER 2026" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  # 4 — product name (display)
  - id: product-name
    type: text
    z: 11
    x: 80
    y: 895
    width: 920
    height: 0
    content: { type: plain, value: "Linen Field Tote" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 700
      color: $text
      line_height: 1.05
      letter_spacing: -0.02

  # 5 — rating row (label text)
  - id: rating
    type: text
    z: 12
    x: 80
    y: 985
    width: 920
    height: 0
    content: { type: plain, value: "4.8 / 5  ·  214 reviews" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted

  # 6–10 — five rating stars (small filled circles)
  - id: star-1
    type: circle
    z: 13
    cx: 92
    cy: 970
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }

  - id: star-2
    type: circle
    z: 13
    cx: 112
    cy: 970
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }

  - id: star-3
    type: circle
    z: 13
    cx: 132
    cy: 970
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }

  - id: star-4
    type: circle
    z: 13
    cx: 152
    cy: 970
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }

  - id: star-5
    type: circle
    z: 13
    cx: 172
    cy: 970
    rx: 6
    ry: 6
    fill: { type: solid, color: "$border" }

  # 11 — price (big)
  - id: price
    type: text
    z: 14
    x: 80
    y: 1030
    width: 480
    height: 0
    content: { type: plain, value: "$48" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 800
      color: $text
      line_height: 1

  # 12 — original price (strikethrough)
  - id: original-price
    type: text
    z: 15
    x: 200
    y: 1048
    width: 220
    height: 0
    content: { type: plain, value: "$72" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 500
      color: $text_muted
      text_decoration: line-through

  # 13 — description (2 lines)
  - id: description
    type: text
    z: 16
    x: 80
    y: 1110
    width: 920
    height: 0
    content: { type: plain, value: "Garment-washed Belgian linen with reinforced base.\nFolds flat, carries everything." }
    style:
      font_family: $body
      font_size: 17
      color: $text_muted
      line_height: 1.5

  # 14–16 — three color/size pills
  - id: pill-1
    type: rect
    z: 20
    x: 80
    y: 1210
    width: 100
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: pill-2
    type: rect
    z: 20
    x: 195
    y: 1210
    width: 100
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: pill-3
    type: rect
    z: 20
    x: 310
    y: 1210
    width: 100
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  # 17 — CTA button background
  - id: cta-bg
    type: rect
    z: 25
    x: 540
    y: 1200
    width: 460
    height: 90
    radius: 45
    fill: { type: solid, color: "$primary" }
    effects:
      shadow:
        - { dx: 0, dy: 10, blur: 28, color: "rgba(0,0,0,0.18)" }

  # 18 — CTA text
  - id: cta-text
    type: text
    z: 26
    x: 540
    y: 1224
    width: 460
    height: 0
    content: { type: plain, value: "ADD TO CART  →" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.12
      text_align: center

slots:
  - { id: eyebrow,        path: "layers[3].content.value",  type: text, hint: "Category / badge text",        default: "NEW · SUMMER 2026" }
  - { id: product_name,   path: "layers[4].content.value",  type: text, hint: "Product display name",          default: "Linen Field Tote" }
  - { id: rating,         path: "layers[5].content.value",  type: text, hint: "Rating + review count",         default: "4.8 / 5  ·  214 reviews" }
  - { id: price,          path: "layers[11].content.value", type: text, hint: "Current price",                 default: "$48" }
  - { id: original_price, path: "layers[12].content.value", type: text, hint: "Original (strikethrough) price", default: "$72" }
  - { id: description,    path: "layers[13].content.value", type: text, hint: "Short product description",     default: "Garment-washed Belgian linen with reinforced base.\nFolds flat, carries everything." }
  - { id: cta_text,       path: "layers[18].content.value", type: text, hint: "CTA button label",              default: "ADD TO CART  →" }
