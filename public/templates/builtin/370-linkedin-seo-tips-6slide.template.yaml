_protocol: template/v1

# 6-slide LinkedIn carousel — SEO mistakes & quick fixes.
# 1080×1350 portrait, ocean-blue theme.
meta:
  id: tmpl-linkedin-seo-tips-6slide
  name: LinkedIn SEO Tips (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, marketing, seo, ocean-blue, 4-5]
  description: "6-slide LinkedIn carousel listing common SEO mistakes with one-line fixes."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: cover-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: cover-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - { id: cover-ring, type: circle, z: 4, cx: 540, cy: 540, rx: 340, ry: 340, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 2 }, opacity: 0.25 }
      - id: cover-eyebrow
        type: text
        z: 11
        x: 80
        y: 440
        width: 920
        height: 0
        content: { type: plain, value: "SEO · QUICK FIXES" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.34, text_transform: uppercase }
      - id: cover-title
        type: text
        z: 12
        x: 80
        y: 500
        width: 920
        height: 0
        content: { type: plain, value: "6 SEO Mistakes\nKilling Your Rankings" }
        style: { font_family: $heading, font_size: 82, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: cover-tagline
        type: text
        z: 13
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "Swipe → 4 quick fixes inside." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: cover-handle
        type: text
        z: 14
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: cover-counter
        type: text
        z: 15
        x: 880
        y: 1280
        width: 120
        height: 0
        content: { type: plain, value: "1 / 6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Intro ────────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: intro-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: intro-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: intro-eyebrow
        type: text
        z: 11
        x: 80
        y: 180
        width: 920
        height: 0
        content: { type: plain, value: "WHY THIS MATTERS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.34, text_transform: uppercase }
      - id: intro-title
        type: text
        z: 12
        x: 80
        y: 240
        width: 920
        height: 0
        content: { type: plain, value: "Most SEO 'tips'\nare 2018 advice." }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: intro-body
        type: text
        z: 13
        x: 80
        y: 540
        width: 920
        height: 0
        content: { type: plain, value: "Google's ranking model changed. Audit-tool checklists didn't. Here are 4 mistakes I see weekly — and the one-line fix for each." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.55 }
      - id: intro-handle
        type: text
        z: 14
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: intro-counter
        type: text
        z: 15
        x: 880
        y: 1280
        width: 120
        height: 0
        content: { type: plain, value: "2 / 6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Mistake 01 ───────────────────────────────────
  - id: mistake-1
    label: Keyword stuffing
    layers:
      - { id: m1-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m1-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: m1-number
        type: text
        z: 11
        x: 80
        y: 180
        width: 200
        height: 0
        content: { type: plain, value: "MISTAKE 01" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $secondary, letter_spacing: 0.32 }
      - id: m1-glyph
        type: text
        z: 12
        x: 80
        y: 260
        width: 120
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 160, font_weight: 800, color: $secondary, line_height: 1.0 }
      - id: m1-headline
        type: text
        z: 13
        x: 240
        y: 300
        width: 760
        height: 0
        content: { type: plain, value: "Keyword stuffing in H1s." }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: m1-desc
        type: text
        z: 14
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "Forcing 'best [keyword] 2026 for small businesses' into every heading. Google sees the pattern. Users bounce." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.5 }
      - id: m1-fix-label
        type: text
        z: 15
        x: 80
        y: 880
        width: 920
        height: 0
        content: { type: plain, value: "THE FIX" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.34 }
      - id: m1-fix
        type: text
        z: 16
        x: 80
        y: 920
        width: 920
        height: 0
        content: { type: plain, value: "Write the H1 for a human. Use the keyword once, naturally." }
        style: { font_family: $body, font_size: 30, font_weight: 600, color: $text, line_height: 1.4 }
      - id: m1-handle
        type: text
        z: 17
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: m1-counter
        type: text
        z: 18
        x: 880
        y: 1280
        width: 120
        height: 0
        content: { type: plain, value: "3 / 6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Mistake 02 ───────────────────────────────────
  - id: mistake-2
    label: Thin content
    layers:
      - { id: m2-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m2-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: m2-number
        type: text
        z: 11
        x: 80
        y: 180
        width: 200
        height: 0
        content: { type: plain, value: "MISTAKE 02" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $secondary, letter_spacing: 0.32 }
      - id: m2-glyph
        type: text
        z: 12
        x: 80
        y: 260
        width: 120
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 160, font_weight: 800, color: $secondary, line_height: 1.0 }
      - id: m2-headline
        type: text
        z: 13
        x: 240
        y: 300
        width: 760
        height: 0
        content: { type: plain, value: "Thin content at scale." }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: m2-desc
        type: text
        z: 14
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "Publishing 800-word posts that repeat what 30 other sites already said. No firsthand data, no opinion, no risk." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.5 }
      - id: m2-fix-label
        type: text
        z: 15
        x: 80
        y: 880
        width: 920
        height: 0
        content: { type: plain, value: "THE FIX" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.34 }
      - id: m2-fix
        type: text
        z: 16
        x: 80
        y: 920
        width: 920
        height: 0
        content: { type: plain, value: "Publish less. Add original data, screenshots, and a point of view." }
        style: { font_family: $body, font_size: 30, font_weight: 600, color: $text, line_height: 1.4 }
      - id: m2-handle
        type: text
        z: 17
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: m2-counter
        type: text
        z: 18
        x: 880
        y: 1280
        width: 120
        height: 0
        content: { type: plain, value: "4 / 6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Mistake 03 ───────────────────────────────────
  - id: mistake-3
    label: Slow pages
    layers:
      - { id: m3-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: m3-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: m3-number
        type: text
        z: 11
        x: 80
        y: 180
        width: 200
        height: 0
        content: { type: plain, value: "MISTAKE 03" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $secondary, letter_spacing: 0.32 }
      - id: m3-glyph
        type: text
        z: 12
        x: 80
        y: 260
        width: 120
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 160, font_weight: 800, color: $secondary, line_height: 1.0 }
      - id: m3-headline
        type: text
        z: 13
        x: 240
        y: 300
        width: 760
        height: 0
        content: { type: plain, value: "Ignoring Core Web Vitals." }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: m3-desc
        type: text
        z: 14
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "LCP over 4s, CLS over 0.25. Mobile users leave before content renders. Crawl budget wastes on slow pages." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.5 }
      - id: m3-fix-label
        type: text
        z: 15
        x: 80
        y: 880
        width: 920
        height: 0
        content: { type: plain, value: "THE FIX" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.34 }
      - id: m3-fix
        type: text
        z: 16
        x: 80
        y: 920
        width: 920
        height: 0
        content: { type: plain, value: "Lazy-load images, preload fonts, ship LCP under 2.5s." }
        style: { font_family: $body, font_size: 30, font_weight: 600, color: $text, line_height: 1.4 }
      - id: m3-handle
        type: text
        z: 17
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: m3-counter
        type: text
        z: 18
        x: 880
        y: 1280
        width: 120
        height: 0
        content: { type: plain, value: "5 / 6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 6 · Mistake 04 + CTA ─────────────────────────────
  - id: cta
    label: CTA
    layers:
      - { id: cta-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$primary" }, opacity: 0.95 }
      - { id: cta-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(0,0,0,0.35)" } }
      - { id: cta-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$secondary" } }
      - id: cta-number
        type: text
        z: 11
        x: 80
        y: 180
        width: 320
        height: 0
        content: { type: plain, value: "MISTAKE 04" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.32 }
      - id: cta-glyph
        type: text
        z: 12
        x: 80
        y: 260
        width: 120
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 140, font_weight: 800, color: "#FFFFFF", line_height: 1.0 }
      - id: cta-headline
        type: text
        z: 13
        x: 240
        y: 300
        width: 760
        height: 0
        content: { type: plain, value: "No internal linking strategy." }
        style: { font_family: $heading, font_size: 50, font_weight: 800, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02 }
      - id: cta-desc
        type: text
        z: 14
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "Orphan pages, broken anchors, no topical clusters. Authority leaks." }
        style: { font_family: $body, font_size: 26, color: "#EAF6FF", line_height: 1.5 }
      - id: cta-fix
        type: text
        z: 15
        x: 80
        y: 760
        width: 920
        height: 0
        content: { type: plain, value: "Fix: Build topic clusters. Link 3-5 related posts per page." }
        style: { font_family: $body, font_size: 26, font_weight: 600, color: "#FFFFFF", line_height: 1.5 }
      - id: cta-headline-big
        type: text
        z: 16
        x: 80
        y: 920
        width: 920
        height: 0
        content: { type: plain, value: "Audit yours\nthis week." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.03 }
      - id: cta-btn
        type: rect
        z: 17
        x: 80
        y: 1140
        width: 320
        height: 72
        radius: 36
        fill: { type: solid, color: "$primary" }
      - id: cta-btn-text
        type: text
        z: 18
        x: 80
        y: 1161
        width: 320
        height: 0
        content: { type: plain, value: "Follow for more →" }
        style: { font_family: $body, font_size: 22, font_weight: 700, color: "#FFFFFF", text_align: center }
      - id: cta-handle
        type: text
        z: 19
        x: 80
        y: 1280
        width: 600
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#EAF6FF" }
      - id: cta-counter
        type: text
        z: 20
        x: 880
        y: 1280
        width: 120
        height: 0
        content: { type: plain, value: "6 / 6" }
        style: { font_family: $mono, font_size: 14, color: "#EAF6FF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",        default: "6 SEO Mistakes\nKilling Your Rankings" }
  - { id: intro_body,     path: "pages[1].layers[4].content.value", type: text, hint: "Intro paragraph",       default: "Google's ranking model changed. Audit-tool checklists didn't. Here are 4 mistakes I see weekly — and the one-line fix for each." }
  - { id: m1_headline,    path: "pages[2].layers[4].content.value", type: text, hint: "Mistake 1 headline",    default: "Keyword stuffing in H1s." }
  - { id: m1_fix,         path: "pages[2].layers[7].content.value", type: text, hint: "Mistake 1 fix",         default: "Write the H1 for a human. Use the keyword once, naturally." }
  - { id: m2_headline,    path: "pages[3].layers[4].content.value", type: text, hint: "Mistake 2 headline",    default: "Thin content at scale." }
  - { id: m2_fix,         path: "pages[3].layers[7].content.value", type: text, hint: "Mistake 2 fix",         default: "Publish less. Add original data, screenshots, and a point of view." }
  - { id: m3_headline,    path: "pages[4].layers[4].content.value", type: text, hint: "Mistake 3 headline",    default: "Ignoring Core Web Vitals." }
  - { id: m3_fix,         path: "pages[4].layers[7].content.value", type: text, hint: "Mistake 3 fix",         default: "Lazy-load images, preload fonts, ship LCP under 2.5s." }
  - { id: cta_headline,   path: "pages[5].layers[8].content.value", type: text, hint: "CTA headline",          default: "Audit yours\nthis week." }
