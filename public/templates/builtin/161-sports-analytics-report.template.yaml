_protocol: template/v1

# Sports team performance — franchise eyebrow, hero, 5 KPIs (W/L/Win%/PF/PA),
# game-by-game point differential trend, player stats table, opponent record
# stacked bar, win-by-quarter heat across game types.
meta:
  id: tmpl-sports-analytics-report
  name: Sports · Team Performance
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, sports, basketball, analytics, team, interactive]
  description: "Team performance report: win/loss, scoring, player box-score, opponent records, win-rate by quarter and game type."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: dark-tech

report:
  layout: scroll
  data:
    sources:
      - id: point_diff_trend
        type: inline
        rows:
          - { game: G01, differential:   8, opponent: "vs LAL" }
          - { game: G02, differential:  14, opponent: "@ GSW"  }
          - { game: G03, differential:  -6, opponent: "vs MIA" }
          - { game: G04, differential:  18, opponent: "@ PHX"  }
          - { game: G05, differential:  -3, opponent: "vs DEN" }
          - { game: G06, differential:  22, opponent: "@ SAC"  }
          - { game: G07, differential:   4, opponent: "vs BOS" }
          - { game: G08, differential: -12, opponent: "@ MIL"  }
          - { game: G09, differential:  16, opponent: "vs CHI" }
          - { game: G10, differential:   9, opponent: "@ NYK"  }
          - { game: G11, differential:  -2, opponent: "vs PHI" }
          - { game: G12, differential:  11, opponent: "@ ATL"  }
          - { game: G13, differential:  24, opponent: "vs CHA" }
          - { game: G14, differential:  -8, opponent: "@ MIA"  }
          - { game: G15, differential:   6, opponent: "vs DAL" }
          - { game: G16, differential:  17, opponent: "@ MEM"  }
          - { game: G17, differential:  -4, opponent: "vs HOU" }
          - { game: G18, differential:  19, opponent: "@ POR"  }
      - id: player_stats
        type: inline
        rows:
          - { player: "Jayson Tatum",      games: 62, ppg: 28.4, rpg:  8.6, apg: 4.8, plus_minus:  9.2 }
          - { player: "Jaylen Brown",      games: 60, ppg: 24.6, rpg:  6.2, apg: 3.4, plus_minus:  6.8 }
          - { player: "Kristaps Porzingis", games: 48, ppg: 19.8, rpg:  7.4, apg: 2.1, plus_minus:  5.4 }
          - { player: "Derrick White",     games: 64, ppg: 14.2, rpg:  4.1, apg: 5.6, plus_minus:  4.2 }
          - { player: "Jrue Holiday",      games: 58, ppg: 12.4, rpg:  5.4, apg: 4.9, plus_minus:  3.8 }
          - { player: "Al Horford",        games: 52, ppg:  8.6, rpg:  6.2, apg: 2.4, plus_minus:  2.6 }
          - { player: "Sam Hauser",        games: 56, ppg:  9.4, rpg:  3.2, apg: 1.1, plus_minus:  1.8 }
          - { player: "Payton Pritchard",  games: 62, ppg: 11.8, rpg:  3.6, apg: 3.8, plus_minus:  2.2 }
          - { player: "Luke Kornet",       games: 44, ppg:  4.2, rpg:  4.8, apg: 1.0, plus_minus:  0.6 }
          - { player: "Neemias Queta",     games: 38, ppg:  3.8, rpg:  4.2, apg: 0.6, plus_minus: -0.4 }
      - id: opponent_record
        type: inline
        rows:
          - { opponent: "Lakers",      wins: 3, losses: 1 }
          - { opponent: "Warriors",    wins: 2, losses: 2 }
          - { opponent: "Heat",        wins: 1, losses: 3 }
          - { opponent: "Suns",        wins: 3, losses: 1 }
          - { opponent: "Nuggets",     wins: 2, losses: 2 }
          - { opponent: "Bucks",       wins: 1, losses: 3 }
          - { opponent: "76ers",       wins: 3, losses: 1 }
          - { opponent: "Knicks",      wins: 4, losses: 0 }
          - { opponent: "Mavericks",   wins: 2, losses: 2 }
          - { opponent: "Grizzlies",   wins: 3, losses: 1 }
      - id: quarter_winrate
        type: inline
        rows:
          - { game_type: "vs East",       q1_win_pct: 62, q2_win_pct: 58, q3_win_pct: 71, q4_win_pct: 68 }
          - { game_type: "vs West",       q1_win_pct: 54, q2_win_pct: 60, q3_win_pct: 66, q4_win_pct: 62 }
          - { game_type: "Home",          q1_win_pct: 72, q2_win_pct: 68, q3_win_pct: 78, q4_win_pct: 74 }
          - { game_type: "Away",          q1_win_pct: 48, q2_win_pct: 52, q3_win_pct: 58, q4_win_pct: 56 }
          - { game_type: "Back-to-Back",  q1_win_pct: 42, q2_win_pct: 46, q3_win_pct: 54, q4_win_pct: 48 }

pages:
  - id: performance
    label: Performance
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "BOSTON CELTICS · 2025-26 REGULAR SEASON · GAMES 1-64"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**Team Performance — Mid-Season Review**\n*Win-loss record, scoring trends, player box-score, and opponent breakdown.*"

      - id: kpi-wins
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Wins
        value: 42
        format: number
        delta: 8
        delta_format: number

      - id: kpi-losses
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Losses
        value: 22
        format: number
        delta: -4
        delta_format: number

      - id: kpi-winpct
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Win %
        value: 65.6
        format: percent
        delta: 6.2
        delta_format: percent

      - id: kpi-pf
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Avg Points For
        value: 118.4
        format: number
        decimals: 1
        delta: 2.8
        delta_format: percent

      - id: kpi-pa
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Avg Points Against
        value: 110.2
        format: number
        decimals: 1
        delta: -1.4
        delta_format: percent

      - id: section-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Point Differential — Last 18 Games**"

      - id: chart-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 400
        chart_type: line
        data_ref: point_diff_trend
        x_field: game
        y_field: differential
        title: Game-by-Game Point Differential (Positive = Win Margin)
        legend: true
        grid: true
        animate: true

      - id: section-players
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Player Box Score — Season to Date**"

      - id: tbl-players
        type: interactive_table
        x: 60
        y: 960
        width: 1160
        height: 540
        data_ref: player_stats
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: player,      title: Player,       width: 280, sortable: true }
          - { field: games,       title: GP,           width: 130, sortable: true, formatter: number,  align: right }
          - { field: ppg,         title: PPG,          width: 160, sortable: true, formatter: number,  align: right }
          - { field: rpg,         title: RPG,          width: 160, sortable: true, formatter: number,  align: right }
          - { field: apg,         title: APG,          width: 160, sortable: true, formatter: number,  align: right }
          - { field: plus_minus,  title: +/-,          width: 170, sortable: true, formatter: delta,   align: right }

      - id: section-opponents
        type: rich_text
        x: 60
        y: 1540
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Record vs Top 10 Opponents**"

      - id: chart-opponents
        type: interactive_chart
        x: 60
        y: 1600
        width: 1160
        height: 360
        chart_type: bar
        data_ref: opponent_record
        x_field: opponent
        y_field: wins
        title: Wins / Losses by Opponent (Stacked)
        legend: true
        grid: true
        animate: true

      - id: section-quarters
        type: rich_text
        x: 60
        y: 2000
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Win Rate by Quarter and Game Type**"

      - id: tbl-quarters
        type: interactive_table
        x: 60
        y: 2060
        width: 1160
        height: 300
        data_ref: quarter_winrate
        pagination: false
        filterable: false
        exportable: true
        columns:
          - { field: game_type,    title: Game Type,  width: 280, sortable: true, formatter: badge }
          - { field: q1_win_pct,   title: Q1 Win %,   width: 220, sortable: true, formatter: percent, align: right }
          - { field: q2_win_pct,   title: Q2 Win %,   width: 220, sortable: true, formatter: percent, align: right }
          - { field: q3_win_pct,   title: Q3 Win %,   width: 220, sortable: true, formatter: percent, align: right }
          - { field: q4_win_pct,   title: Q4 Win %,   width: 220, sortable: true, formatter: percent, align: right }

slots:
  - { id: report_title,       path: "pages[0].layers[1].content",  type: text, hint: "Report title",      default: "**Team Performance — Mid-Season Review**\n*Win-loss record, scoring trends, player box-score, and opponent breakdown.*" }
  - { id: report_eyebrow,     path: "pages[0].layers[0].content",  type: text, hint: "Team eyebrow",      default: "BOSTON CELTICS · 2025-26 REGULAR SEASON · GAMES 1-64" }
  - { id: trend_section,      path: "pages[0].layers[7].content",  type: text, hint: "Trend heading",     default: "**Point Differential — Last 18 Games**" }
  - { id: players_section,    path: "pages[0].layers[9].content",  type: text, hint: "Players heading",   default: "**Player Box Score — Season to Date**" }
  - { id: opponents_section,  path: "pages[0].layers[11].content", type: text, hint: "Opponents heading", default: "**Record vs Top 10 Opponents**" }
  - { id: quarters_section,   path: "pages[0].layers[13].content", type: text, hint: "Quarters heading",  default: "**Win Rate by Quarter and Game Type**" }
