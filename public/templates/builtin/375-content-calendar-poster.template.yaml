_protocol: template/v1

# Single-page weekly content calendar poster — 7-day strip with post-type + topic.
# LinkedIn 4:5 portrait, pastel-dream theme.
meta:
  id: tmpl-content-calendar-poster
  name: Content Calendar Poster (Weekly)
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, marketing, content-calendar, schedule, pastel-dream, 4-5]
  description: "Single-page weekly content calendar: 7-day strip showing post type + topic for each day."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1110
    cy: 140
    rx: 10
    ry: 10
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 140
    width: 1040
    height: 0
    content: { type: plain, value: "JUNE 2026 · CONTENT" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: title
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "Posting calendar" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 900
      color: $text
      line_height: 0.98
      letter_spacing: -0.03

  - id: subtitle
    type: text
    z: 22
    x: 80
    y: 320
    width: 1040
    height: 0
    content: { type: plain, value: "One week. Seven posts. Built around three pillars." }
    style:
      font_family: $body
      font_size: 24
      color: $text_muted
      line_height: 1.4

  # ── 7-Day Strip (Mon → Sun) ────────────────────────────────
  # Day 1 · Mon
  - id: day-1-card
    type: rect
    z: 30
    x: 80
    y: 430
    width: 1040
    height: 100
    radius: 12
    fill: { type: solid, color: "$surface" }

  - id: day-1-name
    type: text
    z: 31
    x: 110
    y: 458
    width: 120
    height: 0
    content: { type: plain, value: "M" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 900
      color: $primary
      line_height: 1.0
      letter_spacing: -0.02

  - id: day-1-type
    type: text
    z: 32
    x: 240
    y: 450
    width: 200
    height: 0
    content: { type: plain, value: "TIP" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: day-1-topic
    type: text
    z: 33
    x: 240
    y: 478
    width: 850
    height: 0
    content: { type: plain, value: "One-paragraph onboarding fix for SaaS PMs" }
