animations:
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.3 }
  title:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  day-1-card:
    enter: { type: slide_right, duration: 500, delay: 400, easing: ease-out }
  day-2-card:
    enter: { type: slide_right, duration: 500, delay: 600, easing: ease-out }
  day-3-card:
    enter: { type: slide_right, duration: 500, delay: 800, easing: ease-out }
  day-4-card:
    enter: { type: slide_right, duration: 500, delay: 1000, easing: ease-out }
  day-5-card:
    enter: { type: slide_right, duration: 500, delay: 1200, easing: ease-out }
  day-6-card:
    enter: { type: slide_right, duration: 500, delay: 1400, easing: ease-out }
  day-7-card:
    enter: { type: slide_right, duration: 500, delay: 1600, easing: ease-out }

slots:
  - { id: eyebrow,         path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",         default: "JUNE 2026 · CONTENT" }
  - { id: title,           path: "layers[4].content.value",  type: text, hint: "Headline",            default: "Posting calendar" }
  - { id: subtitle,        path: "layers[5].content.value",  type: text, hint: "Subtitle",            default: "One week. Seven posts. Built around three pillars." }
  - { id: day_1_topic,     path: "layers[9].content.value",  type: text, hint: "Mon · topic",         default: "One-paragraph onboarding fix for SaaS PMs" }
  - { id: day_2_topic,     path: "layers[13].content.value", type: text, hint: "Tue · topic",         default: "Drucker on measurement vs. what matters" }
  - { id: day_3_topic,     path: "layers[17].content.value", type: text, hint: "Wed · topic",         default: "73% of trials never reach the aha moment" }
  - { id: day_4_topic,     path: "layers[21].content.value", type: text, hint: "Thu · topic",         default: "How a 4-min activation flow saved a $2M ARR account" }
  - { id: day_5_topic,     path: "layers[25].content.value", type: text, hint: "Fri · topic",         default: "Reader: 'How do we know if onboarding is broken?'" }
  - { id: day_6_topic,     path: "layers[29].content.value", type: text, hint: "Sat · topic",         default: "Weekend reading list — 3 retention papers" }
  - { id: day_7_topic,     path: "layers[33].content.value", type: text, hint: "Sun · topic",         default: "Reflective close — quote + question for the week ahead" }
  - { id: hashtag_strategy, path: "layers[35].content.value", type: text, hint: "Hashtag strategy",   default: "Tags: #ProductLed #Retention #SaaSPM · 3 broad + 2 niche per post" }
