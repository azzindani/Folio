_protocol: template/v1

# Landscape LinkedIn link-preview card — title + byline + category + logo placeholder.
# Left-aligned editorial layout with subtle decorative shape on the right.
meta:
  id: tmpl-linkedin-post
  name: LinkedIn Post
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, social, linkedin, professional, indigo]

document:
  width: 1200
  height: 627
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 627
    fill: { type: solid, color: "$background" }

  - id: deco-blob
    type: circle
    z: 2
    cx: 1140
    cy: 80
    rx: 280
    ry: 280
    fill: { type: none }
    opacity: 0.22

  - id: deco-stripe
    type: rect
    z: 3
    x: 980
    y: 0
    width: 6
    height: 627
    fill: { type: solid, color: "$primary" }
    opacity: 0.6

  - id: accent-bar
    type: rect
    z: 4
    x: 80
    y: 120
    width: 56
    height: 4
    radius: 2
    fill: { type: solid, color: "$accent" }

  - id: category-pill
    type: rect
    z: 5
    x: 80
    y: 60
    width: 200
    height: 36
    radius: 18
    fill: { type: solid, color: "$surface2" }
    stroke: { color: "$border", width: 1 }

  - id: category-text
    type: text
    z: 6
    x: 80
    y: 68
    width: 200
    height: 0
    content: { type: plain, value: "LEADERSHIP" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.24
      text_transform: uppercase
      text_align: center

  - id: title
    type: text
    z: 10
    x: 80
    y: 160
    width: 820
    height: 0
    content: { type: plain, value: "The quiet skill that\nseparates senior engineers." }
    style:
      font_family: $heading
      font_size: 54
      font_weight: 700
      color: $text
      line_height: 1.12
      letter_spacing: -0.02

  - id: supporting-text
    type: text
    z: 11
    x: 80
    y: 360
    width: 820
    height: 0
    content: { type: plain, value: "It's not raw output. It's knowing what NOT to build — and saying so out loud." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.5

  - id: divider
    type: rect
    z: 15
    x: 80
    y: 490
    width: 820
    height: 1
    fill: { type: solid, color: "$border" }

  - id: byline
    type: text
    z: 20
    x: 80
    y: 510
    width: 600
    height: 0
    content: { type: plain, value: "Jordan Reyes" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  - id: role
    type: text
    z: 21
    x: 80
    y: 545
    width: 600
    height: 0
    content: { type: plain, value: "Staff Engineer · Vercel" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  - id: logo-frame
    type: rect
    z: 25
    x: 1040
    y: 500
    width: 80
    height: 80
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$primary", width: 2 }

  - id: logo-mark
    type: text
    z: 26
    x: 1040
    y: 520
    width: 80
    height: 0
    content: { type: plain, value: "JR" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $primary
      text_align: center

slots:
  - { id: category,        path: "layers[5].content.value",  type: text, hint: "Category / tag label",      default: "LEADERSHIP" }
  - { id: title,           path: "layers[6].content.value",  type: text, hint: "Main title (2 lines)",      default: "The quiet skill that\nseparates senior engineers." }
  - { id: supporting_text, path: "layers[7].content.value",  type: text, hint: "Supporting paragraph",       default: "It's not raw output. It's knowing what NOT to build — and saying so out loud." }
  - { id: byline,          path: "layers[9].content.value",  type: text, hint: "Author name",                default: "Jordan Reyes" }
  - { id: role,            path: "layers[10].content.value", type: text, hint: "Role / company",             default: "Staff Engineer · Vercel" }
