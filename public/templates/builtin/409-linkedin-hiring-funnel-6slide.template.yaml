_protocol: template/v1

# 6-slide LinkedIn carousel — the hiring funnel that actually converts.
# Cover → Intro → 4 stage slides (Sourcing/Screen/Interview/Offer) → CTA. Corporate slate.
meta:
  id: tmpl-linkedin-hiring-funnel-6slide
  name: LinkedIn Hiring Funnel (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, hr, recruiting, hiring, funnel, 4-5]
  description: "6-slide LinkedIn carousel walking through a hiring funnel: sourcing, screen, interview, offer."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "1/6" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 460
        width: 960
        height: 0
        content: { type: plain, value: "HIRING · 2026" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 520
        width: 960
        height: 0
        content: { type: plain, value: "The hiring funnel\nthat actually converts" }
        style: { font_family: $heading, font_size: 84, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 13
        x: 60
        y: 820
        width: 960
        height: 0
        content: { type: plain, value: "Four stages. One playbook. Swipe →" }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: handle
        type: text
        z: 14
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }

  # ── Slide 2 · Intro ────────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "2/6" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "THE PROBLEM" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Most pipelines leak before the offer." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15 }
      - id: body
        type: text
        z: 13
        x: 60
        y: 440
        width: 960
        height: 0
        content: { type: plain, value: "Recruiters chase volume. Hiring managers ghost candidates. Offers come too late. The fix is not more sourcing — it is a tighter funnel with named KPIs at every stage." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.55 }
      - id: kicker
        type: text
        z: 14
        x: 60
        y: 820
        width: 960
        height: 0
        content: { type: plain, value: "Here is the funnel that actually converts." }
        style: { font_family: $body, font_size: 24, font_weight: 600, color: $primary, line_height: 1.4 }

  # ── Slide 3 · Stage 01 Sourcing ────────────────────────────
  - id: stage-sourcing
    label: "01 Sourcing"
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "3/6" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: stage-num
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: stage-name
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Sourcing" }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 }
      - id: kpi-label
        type: text
        z: 20
        x: 60
        y: 460
        width: 960
        height: 0
        content: { type: plain, value: "KPI" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: kpi-value
        type: text
        z: 21
        x: 60
        y: 490
        width: 960
        height: 0
        content: { type: plain, value: "Qualified-applicant rate ≥ 30%" }
        style: { font_family: $heading, font_size: 44, font_weight: 700, color: $primary, line_height: 1.2 }
      - id: divider
        type: rect
        z: 15
        x: 60
        y: 620
        width: 960
        height: 1
        fill: { type: solid, color: "$text_muted" }
        opacity: 0.25
      - id: risk-label
        type: text
        z: 30
        x: 60
        y: 660
        width: 960
        height: 0
        content: { type: plain, value: "KEY RISK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase }
      - id: risk-text
        type: text
        z: 31
        x: 60
        y: 700
        width: 960
        height: 0
        content: { type: plain, value: "Job description is generic. You attract everyone — and convert nobody." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }

  # ── Slide 4 · Stage 02 Screen ──────────────────────────────
  - id: stage-screen
    label: "02 Screen"
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "4/6" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: stage-num
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: stage-name
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Screen" }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 }
      - id: kpi-label
        type: text
        z: 20
        x: 60
        y: 460
        width: 960
        height: 0
        content: { type: plain, value: "KPI" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: kpi-value
        type: text
        z: 21
        x: 60
        y: 490
        width: 960
        height: 0
        content: { type: plain, value: "Screen-to-interview ≥ 50%" }
        style: { font_family: $heading, font_size: 44, font_weight: 700, color: $primary, line_height: 1.2 }
      - id: divider
        type: rect
        z: 15
        x: 60
        y: 620
        width: 960
        height: 1
        fill: { type: solid, color: "$text_muted" }
        opacity: 0.25
      - id: risk-label
        type: text
        z: 30
        x: 60
        y: 660
        width: 960
        height: 0
        content: { type: plain, value: "KEY RISK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase }
      - id: risk-text
        type: text
        z: 31
        x: 60
        y: 700
        width: 960
        height: 0
        content: { type: plain, value: "Trivia questions over signal. You filter for résumés, not for the work." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }

  # ── Slide 5 · Stage 03 Interview ───────────────────────────
  - id: stage-interview
    label: "03 Interview"
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "5/6" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: stage-num
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.32 }
      - id: stage-name
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Interview" }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 }
      - id: kpi-label
        type: text
        z: 20
        x: 60
        y: 460
        width: 960
        height: 0
        content: { type: plain, value: "KPI" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: kpi-value
        type: text
        z: 21
        x: 60
        y: 490
        width: 960
        height: 0
        content: { type: plain, value: "Interview-to-offer ≥ 35%" }
        style: { font_family: $heading, font_size: 44, font_weight: 700, color: $primary, line_height: 1.2 }
      - id: divider
        type: rect
        z: 15
        x: 60
        y: 620
        width: 960
        height: 1
        fill: { type: solid, color: "$text_muted" }
        opacity: 0.25
      - id: risk-label
        type: text
        z: 30
        x: 60
        y: 660
        width: 960
        height: 0
        content: { type: plain, value: "KEY RISK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase }
      - id: risk-text
        type: text
        z: 31
        x: 60
        y: 700
        width: 960
        height: 0
        content: { type: plain, value: "Six rounds, no rubric. Candidates burn out before you ever decide." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }

  # ── Slide 6 · Stage 04 Offer + CTA ─────────────────────────
  - id: stage-offer
    label: "04 Offer"
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 160, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(0,0,0,0.35)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "6/6" }
        style: { font_family: $mono, font_size: 18, color: "#FFFFFF" }
      - id: stage-num
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "04" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.32 }
      - id: stage-name
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Offer" }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: "#FFFFFF", line_height: 1, letter_spacing: -0.03 }
      - id: kpi-value
        type: text
        z: 21
        x: 60
        y: 460
        width: 960
        height: 0
        content: { type: plain, value: "Offer-acceptance ≥ 85%" }
        style: { font_family: $heading, font_size: 44, font_weight: 700, color: "#FFFFFF", line_height: 1.2 }
      - id: cta-heading
        type: text
        z: 30
        x: 60
        y: 660
        width: 960
        height: 0
        content: { type: plain, value: "Run your funnel\nthis way next quarter." }
        style: { font_family: $heading, font_size: 60, font_weight: 800, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02 }
      - id: cta-sub
        type: text
        z: 31
        x: 60
        y: 920
        width: 960
        height: 0
        content: { type: plain, value: "Follow for weekly recruiter playbooks." }
        style: { font_family: $body, font_size: 26, color: "#F0F0FF", line_height: 1.4 }
      - id: cta-btn
        type: rect
        z: 32
        x: 60
        y: 1040
        width: 280
        height: 64
        radius: 32
        fill: { type: solid, color: "#FFFFFF" }
      - id: cta-text
        type: text
        z: 33
        x: 60
        y: 1058
        width: 280
        height: 0
        content: { type: plain, value: "Follow →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#0F172A", text_align: center }
      - id: handle
        type: text
        z: 40
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }

slots:
  - { id: cover_title,       path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",          default: "The hiring funnel\nthat actually converts" }
  - { id: cover_tagline,     path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",           default: "Four stages. One playbook. Swipe →" }
  - { id: intro_title,       path: "pages[1].layers[4].content.value", type: text, hint: "Intro title",             default: "Most pipelines leak before the offer." }
  - { id: intro_body,        path: "pages[1].layers[5].content.value", type: text, hint: "Intro body",              default: "Recruiters chase volume. Hiring managers ghost candidates. Offers come too late." }
  - { id: sourcing_kpi,      path: "pages[2].layers[6].content.value", type: text, hint: "Sourcing KPI",            default: "Qualified-applicant rate ≥ 30%" }
  - { id: sourcing_risk,     path: "pages[2].layers[9].content.value", type: text, hint: "Sourcing risk",           default: "Job description is generic. You attract everyone — and convert nobody." }
  - { id: screen_kpi,        path: "pages[3].layers[6].content.value", type: text, hint: "Screen KPI",              default: "Screen-to-interview ≥ 50%" }
  - { id: screen_risk,       path: "pages[3].layers[9].content.value", type: text, hint: "Screen risk",             default: "Trivia questions over signal. You filter for résumés, not for the work." }
  - { id: interview_kpi,     path: "pages[4].layers[6].content.value", type: text, hint: "Interview KPI",           default: "Interview-to-offer ≥ 35%" }
  - { id: interview_risk,    path: "pages[4].layers[9].content.value", type: text, hint: "Interview risk",          default: "Six rounds, no rubric. Candidates burn out before you ever decide." }
  - { id: offer_kpi,         path: "pages[5].layers[6].content.value", type: text, hint: "Offer KPI",               default: "Offer-acceptance ≥ 85%" }
  - { id: cta_heading,       path: "pages[5].layers[7].content.value", type: text, hint: "CTA heading",             default: "Run your funnel\nthis way next quarter." }
  - { id: cta_sub,           path: "pages[5].layers[8].content.value", type: text, hint: "CTA subline",             default: "Follow for weekly recruiter playbooks." }
