_protocol: template/v1

# LinkedIn 5-slide carousel — salary negotiation tactics with example dialogues.
# Portrait 1080×1350. dark-tech theme.
meta:
  id: tmpl-linkedin-salary-negotiation-5slide
  name: LinkedIn Salary Negotiation (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, career, salary, negotiation, 4-5]
  description: "5-slide LinkedIn carousel teaching 3 salary negotiation tactics with example dialogue blocks."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: dark-tech

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: cv-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: cv-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: cv-eyebrow
        type: text
        z: 10
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "CAREER · NEGOTIATION" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: cv-title
        type: text
        z: 11
        x: 72
        y: 300
        width: 936
        height: 0
        content: { type: plain, value: "How to negotiate\na $30k raise." }
        style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: cv-tagline
        type: text
        z: 12
        x: 72
        y: 620
        width: 936
        height: 0
        content: { type: plain, value: "3 tactics. Real dialogue. No \"justify your worth\" nonsense." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: cv-rule
        type: rect
        z: 13
        x: 72
        y: 780
        width: 80
        height: 4
        fill: { type: solid, color: "$accent" }
      - id: cv-author
        type: text
        z: 14
        x: 72
        y: 810
        width: 936
        height: 0
        content: { type: plain, value: "Swipe → the script." }
        style: { font_family: $body, font_size: 20, color: $text }
      - id: cv-page
        type: text
        z: 15
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "01 / 05" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Why Most Fail ────────────────────────────────
  - id: why-fail
    label: Why Most Fail
    layers:
      - { id: wf-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: wf-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: wf-eyebrow
        type: text
        z: 10
        x: 72
        y: 180
        width: 936
        height: 0
        content: { type: plain, value: "WHY MOST FAIL" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase }
      - id: wf-title
        type: text
        z: 11
        x: 72
        y: 240
        width: 936
        height: 0
        content: { type: plain, value: "They give the\nnumber first." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: wf-body
        type: text
        z: 12
        x: 72
        y: 540
        width: 936
        height: 0
        content: { type: plain, value: "Most people walk into the call thinking it's a math problem. It's a power dynamic.\n\nThe candidate who speaks the first number sets a ceiling on what the company will offer. The candidate who waits — and lets silence do the heavy lifting — walks out with leverage." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: wf-stat
        type: text
        z: 13
        x: 72
        y: 1000
        width: 936
        height: 0
        content: { type: plain, value: "Average left-on-the-table: $7,000 / year." }
        style: { font_family: $heading, font_size: 28, font_weight: 700, color: $primary, line_height: 1.3 }
      - id: wf-page
        type: text
        z: 14
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "02 / 05" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Tactic 01 · Anchor High ──────────────────────
  - id: tactic-1
    label: 01 Anchor High
    layers:
      - { id: t1-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: t1-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: t1-number
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: t1-title
        type: text
        z: 11
        x: 72
        y: 210
        width: 936
        height: 0
        content: { type: plain, value: "Anchor high." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: t1-rule-label
        type: text
        z: 12
        x: 72
        y: 360
        width: 936
        height: 0
        content: { type: plain, value: "RULE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: t1-rule
        type: text
        z: 13
        x: 72
        y: 390
        width: 936
        height: 0
        content: { type: plain, value: "State a number 10–15% above your target. They'll negotiate down to where you wanted to be." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: t1-card
        type: rect
        z: 14
        x: 72
        y: 620
        width: 936
        height: 540
        radius: 12
        fill: { type: solid, color: "$surface" }
      - id: t1-dialog-label
        type: text
        z: 15
        x: 104
        y: 660
        width: 872
        height: 0
        content: { type: plain, value: "EXAMPLE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36 }
      - id: t1-them
        type: text
        z: 16
        x: 104
        y: 710
        width: 872
        height: 0
        content: { type: plain, value: "Them: \"What's your expected range?\"" }
        style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.5 }
      - id: t1-you
        type: text
        z: 17
        x: 104
        y: 820
        width: 872
        height: 0
        content: { type: plain, value: "You: \"Based on the scope and the market for senior ICs in this region, I'm targeting $185k base. Where does that sit for you?\"" }
        style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.5 }
      - id: t1-page
        type: text
        z: 18
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "03 / 05" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Tactic 02 · Silence ──────────────────────────
  - id: tactic-2
    label: 02 Silence
    layers:
      - { id: t2-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: t2-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: t2-number
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: t2-title
        type: text
        z: 11
        x: 72
        y: 210
        width: 936
        height: 0
        content: { type: plain, value: "Silence is leverage." }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: t2-rule-label
        type: text
        z: 12
        x: 72
        y: 360
        width: 936
        height: 0
        content: { type: plain, value: "RULE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: t2-rule
        type: text
        z: 13
        x: 72
        y: 390
        width: 936
        height: 0
        content: { type: plain, value: "When they make an offer, repeat the number — then say nothing. Let them fill the silence." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: t2-card
        type: rect
        z: 14
        x: 72
        y: 620
        width: 936
        height: 540
        radius: 12
        fill: { type: solid, color: "$surface" }
      - id: t2-dialog-label
        type: text
        z: 15
        x: 104
        y: 660
        width: 872
        height: 0
        content: { type: plain, value: "EXAMPLE" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.36 }
      - id: t2-them
        type: text
        z: 16
        x: 104
        y: 710
        width: 872
        height: 0
        content: { type: plain, value: "Them: \"We can do $170k base.\"" }
        style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.5 }
      - id: t2-you
        type: text
        z: 17
        x: 104
        y: 820
        width: 872
        height: 0
        content: { type: plain, value: "You: \"$170k base.\"\n\n[pause · 8 seconds]\n\nThem: \"...we might be able to flex on equity or sign-on.\"" }
        style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.5 }
      - id: t2-page
        type: text
        z: 18
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "04 / 05" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Tactic 03 · Get It In Writing + CTA ──────────
  - id: tactic-3-cta
    label: 03 Writing + CTA
    layers:
      - { id: t3-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: t3-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: t3-number
        type: text
        z: 10
        x: 72
        y: 140
        width: 936
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: t3-title
        type: text
        z: 11
        x: 72
        y: 190
        width: 936
        height: 0
        content: { type: plain, value: "Get it in writing." }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.03 }
      - id: t3-rule
        type: text
        z: 12
        x: 72
        y: 360
        width: 936
        height: 0
        content: { type: plain, value: "Verbal offers don't exist. Ask for the breakdown — base, bonus, equity, vest — in email before you say yes." }
        style: { font_family: $body, font_size: 26, color: "#FFFFFF", line_height: 1.5 }
      - id: t3-card
        type: rect
        z: 13
        x: 72
        y: 560
        width: 936
        height: 280
        radius: 12
        fill: { type: solid, color: "#FFFFFF" }
      - id: t3-dialog
        type: text
        z: 14
        x: 104
        y: 600
        width: 872
        height: 0
        content: { type: plain, value: "You: \"Sounds great. Could you send the full breakdown — base, bonus, equity, vest schedule — so I can review with my partner tonight?\"" }
        style: { font_family: $mono, font_size: 22, color: $background, line_height: 1.5 }
      - id: t3-cta-heading
        type: text
        z: 15
        x: 72
        y: 920
        width: 936
        height: 0
        content: { type: plain, value: "Use this in\nyour next offer." }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.02 }
      - id: t3-cta-btn
        type: rect
        z: 16
        x: 72
        y: 1140
        width: 360
        height: 64
        radius: 32
        fill: { type: solid, color: "#FFFFFF" }
      - id: t3-cta-text
        type: text
        z: 17
        x: 72
        y: 1158
        width: 360
        height: 0
        content: { type: plain, value: "Follow for more →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: $primary, text_align: center }
      - id: t3-page
        type: text
        z: 18
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "05 / 05" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[3].content.value", type: text, hint: "Cover title",          default: "How to negotiate\na $30k raise." }
  - { id: cover_tagline,  path: "pages[0].layers[4].content.value", type: text, hint: "Cover tagline",        default: "3 tactics. Real dialogue. No \"justify your worth\" nonsense." }
  - { id: why_title,      path: "pages[1].layers[3].content.value", type: text, hint: "Why fail title",       default: "They give the\nnumber first." }
  - { id: why_body,       path: "pages[1].layers[4].content.value", type: text, hint: "Why fail body",        default: "Most people walk into the call..." }
  - { id: t1_title,       path: "pages[2].layers[3].content.value", type: text, hint: "Tactic 1 title",       default: "Anchor high." }
  - { id: t1_rule,        path: "pages[2].layers[5].content.value", type: text, hint: "Tactic 1 rule",        default: "State a number 10–15% above your target..." }
  - { id: t1_you,         path: "pages[2].layers[9].content.value", type: text, hint: "Tactic 1 dialogue",    default: "You: \"Based on the scope...\"" }
  - { id: t2_title,       path: "pages[3].layers[3].content.value", type: text, hint: "Tactic 2 title",       default: "Silence is leverage." }
  - { id: t2_rule,        path: "pages[3].layers[5].content.value", type: text, hint: "Tactic 2 rule",        default: "When they make an offer..." }
  - { id: t3_title,       path: "pages[4].layers[3].content.value", type: text, hint: "Tactic 3 title",       default: "Get it in writing." }
  - { id: cta_heading,    path: "pages[4].layers[7].content.value", type: text, hint: "CTA heading",          default: "Use this in\nyour next offer." }
