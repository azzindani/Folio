      - { id: map-glyph, type: text, z: 31, x: 1260, y: 400, width: 200, height: 0, content: { type: plain, value: "MAP" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $primary, text_align: center, letter_spacing: 0.6, rotation: 8 } }
      - { id: map-route, type: text, z: 32, x: 1260, y: 440, width: 200, height: 0, content: { type: plain, value: "MN → SD → WY\n→ MT → ID → WA" }, style: { font_family: $mono, font_size: 14, color: $text, text_align: center, line_height: 1.6, rotation: 8 } }
      - { id: map-miles, type: text, z: 33, x: 1260, y: 540, width: 200, height: 0, content: { type: plain, value: "2,141 mi · 9 days" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: $primary, text_align: center, rotation: 8 } }
