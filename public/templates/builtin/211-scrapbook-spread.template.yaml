      - { id: head-tape-1, type: rect, z: 5, x: 80, y: 80, width: 300, height: 50, fill: { type: solid, color: "$primary" }, opacity: 0.65, rotation: -3 }
      - { id: head-tape-2, type: rect, z: 5, x: 1140, y: 92, width: 280, height: 44, fill: { type: solid, color: "$secondary" }, opacity: 0.7, rotation: 5 }
      - { id: head-kicker, type: text, z: 10, x: 0, y: 200, width: 1500, height: 0, content: { type: plain, value: "JUNE · JULY · AUGUST" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: head-title, type: text, z: 11, x: 0, y: 240, width: 1500, height: 0, content: { type: plain, value: "Summer days." }, style: { font_family: $heading, font_size: 72, font_weight: 700, font_style: italic, color: $text, text_align: center, line_height: 1.1 } }
      - { id: photo-1, type: rect, z: 20, x: 140, y: 380, width: 420, height: 480, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: -5 }
      - { id: photo-1-fill, type: rect, z: 21, x: 160, y: 400, width: 380, height: 380, fill: { type: solid, color: $primary }, opacity: 0.6, rotation: -5 }
      - { id: photo-1-ph, type: text, z: 22, x: 140, y: 580, width: 420, height: 0, content: { type: plain, value: "[ the lake · 4th of july ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, text_align: center, rotation: -5 } }
      - { id: photo-1-cap, type: text, z: 23, x: 140, y: 800, width: 420, height: 0, content: { type: plain, value: "you said the water was warm." }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3, rotation: -5 } }
      - { id: photo-2, type: rect, z: 20, x: 600, y: 360, width: 420, height: 480, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: 4 }
      - { id: photo-2-fill, type: rect, z: 21, x: 620, y: 380, width: 380, height: 380, fill: { type: solid, color: $secondary }, opacity: 0.55, rotation: 4 }
      - { id: photo-2-ph, type: text, z: 22, x: 600, y: 560, width: 420, height: 0, content: { type: plain, value: "[ ice-cream · main street ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, text_align: center, rotation: 4 } }
      - { id: photo-2-cap, type: text, z: 23, x: 600, y: 790, width: 420, height: 0, content: { type: plain, value: "two scoops, before it melted" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3, rotation: 4 } }
      - { id: photo-3, type: rect, z: 20, x: 1040, y: 400, width: 360, height: 420, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: -7 }
      - { id: photo-3-fill, type: rect, z: 21, x: 1060, y: 420, width: 320, height: 320, fill: { type: solid, color: $primary }, opacity: 0.6, rotation: -7 }
      - { id: photo-3-ph, type: text, z: 22, x: 1040, y: 580, width: 360, height: 0, content: { type: plain, value: "[ sunset · porch ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, text_align: center, rotation: -7 } }
      - { id: photo-3-cap, type: text, z: 23, x: 1040, y: 760, width: 360, height: 0, content: { type: plain, value: "the sky went pink" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, text_align: center, line_height: 1.3, rotation: -7 } }
      - { id: note-1, type: rect, z: 30, x: 200, y: 1000, width: 540, height: 200, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$primary", width: 2 }, rotation: -2 }
      - { id: note-1-text, type: text, z: 31, x: 240, y: 1040, width: 460, height: 0, content: { type: plain, value: "summer feels like a long Sunday afternoon — we never want it to be Monday." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.4, rotation: -2 } }
      - { id: note-1-sig, type: text, z: 32, x: 520, y: 1150, width: 200, height: 0, content: { type: plain, value: "— July, somewhere" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: $primary, text_align: right, rotation: -2 } }
      - { id: ticket-2, type: rect, z: 30, x: 820, y: 1020, width: 360, height: 180, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 2 }, rotation: 5 }
      - { id: ticket-2-text, type: text, z: 31, x: 820, y: 1060, width: 360, height: 0, content: { type: plain, value: "FERRY · ROUTE 22\nOAKMONT  →  ISLAND\nADULT  ·  $9.50" }, style: { font_family: $mono, font_size: 15, font_weight: 700, color: $text, text_align: center, line_height: 1.55, letter_spacing: 0.3, rotation: 5 } }
      - { id: tape-bot-1, type: rect, z: 5, x: 320, y: 1370, width: 260, height: 50, fill: { type: solid, color: "$secondary" }, opacity: 0.55, rotation: 7 }
      - { id: tape-bot-2, type: rect, z: 5, x: 940, y: 1360, width: 280, height: 48, fill: { type: solid, color: "$primary" }, opacity: 0.6, rotation: -5 }
      - { id: page-num, type: text, z: 40, x: 0, y: 1455, width: 1500, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 3 · Spread 2 (Hometown) ───────────────────────────
  - id: spread-2
    label: Hometown
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: head-tape, type: rect, z: 5, x: 540, y: 80, width: 420, height: 60, fill: { type: solid, color: "$primary" }, opacity: 0.65, rotation: -2 }
      - { id: head-kicker, type: text, z: 10, x: 0, y: 200, width: 1500, height: 0, content: { type: plain, value: "RIVERTON · ELM STREET · THE OLD FIRE STATION" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.5 } }
      - { id: head-title, type: text, z: 11, x: 0, y: 240, width: 1500, height: 0, content: { type: plain, value: "Hometown things." }, style: { font_family: $heading, font_size: 72, font_weight: 700, font_style: italic, color: $text, text_align: center, line_height: 1.1 } }
      - { id: photo-big, type: rect, z: 20, x: 180, y: 380, width: 760, height: 540, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: -3 }
      - { id: photo-big-fill, type: rect, z: 21, x: 200, y: 400, width: 720, height: 440, fill: { type: solid, color: $secondary }, opacity: 0.5, rotation: -3 }
      - { id: photo-big-ph, type: text, z: 22, x: 180, y: 600, width: 760, height: 0, content: { type: plain, value: "[ main street, early autumn ]" }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, text_align: center, rotation: -3 } }
      - { id: photo-big-cap, type: text, z: 23, x: 180, y: 860, width: 760, height: 0, content: { type: plain, value: "every tree on this street is older than we are." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, text_align: center, line_height: 1.3, rotation: -3 } }
      - { id: photo-small-1, type: rect, z: 20, x: 1000, y: 380, width: 380, height: 280, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: 6 }
      - { id: photo-small-1-fill, type: rect, z: 21, x: 1020, y: 400, width: 340, height: 220, fill: { type: solid, color: "$primary" }, opacity: 0.55, rotation: 6 }
      - { id: photo-small-1-ph, type: text, z: 22, x: 1000, y: 510, width: 380, height: 0, content: { type: plain, value: "[ the diner ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: "#FFFFFF", text_align: center, opacity: 0.95, rotation: 6 } }
      - { id: photo-small-2, type: rect, z: 20, x: 1000, y: 700, width: 380, height: 280, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: -5 }
      - { id: photo-small-2-fill, type: rect, z: 21, x: 1020, y: 720, width: 340, height: 220, fill: { type: solid, color: "$secondary" }, opacity: 0.7, rotation: -5 }
      - { id: photo-small-2-ph, type: text, z: 22, x: 1000, y: 830, width: 380, height: 0, content: { type: plain, value: "[ the library steps ]" }, style: { font_family: $body, font_size: 14, font_style: italic, color: "#FFFFFF", text_align: center, opacity: 0.95, rotation: -5 } }
      - { id: list-card, type: rect, z: 30, x: 140, y: 1020, width: 700, height: 320, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: list-title, type: text, z: 31, x: 180, y: 1050, width: 620, height: 0, content: { type: plain, value: "Things that haven't changed:" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: $text, line_height: 1.3 } }
      - { id: list-body, type: text, z: 32, x: 180, y: 1110, width: 620, height: 0, content: { type: plain, value: "✓  the pancakes at Ruby's\n✓  the bell on the door of Holloway's books\n✓  the smell of leaves in October on Elm\n✓  the train whistle at 9:14, every night, on time" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, line_height: 1.7 } }
      - { id: stamp, type: rect, z: 40, x: 900, y: 1040, width: 220, height: 220, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$primary", width: 4 }, rotation: 8 }
      - { id: stamp-glyph, type: text, z: 41, x: 900, y: 1080, width: 220, height: 0, content: { type: plain, value: "★" }, style: { font_family: $heading, font_size: 64, color: $primary, text_align: center, rotation: 8 } }
      - { id: stamp-text, type: text, z: 42, x: 900, y: 1180, width: 220, height: 0, content: { type: plain, value: "FAVORITE\nPLACES" }, style: { font_family: $mono, font_size: 14, font_weight: 800, color: $text, text_align: center, line_height: 1.3, letter_spacing: 0.4, rotation: 8 } }
      - { id: doodle, type: text, z: 50, x: 1180, y: 1080, width: 200, height: 0, content: { type: plain, value: "← still here" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $primary, rotation: 10 } }
      - { id: tape-bot, type: rect, z: 5, x: 1180, y: 1380, width: 280, height: 50, fill: { type: solid, color: "$primary" }, opacity: 0.6, rotation: -6 }
      - { id: page-num, type: text, z: 60, x: 0, y: 1455, width: 1500, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

  # ── Page 4 · Spread 3 (Road Trip) ──────────────────────────
  - id: spread-3
    label: Road Trip
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: head-tape-1, type: rect, z: 5, x: 100, y: 100, width: 320, height: 56, fill: { type: solid, color: "$secondary" }, opacity: 0.65, rotation: -4 }
      - { id: head-tape-2, type: rect, z: 5, x: 1080, y: 100, width: 320, height: 56, fill: { type: solid, color: "$primary" }, opacity: 0.65, rotation: 6 }
