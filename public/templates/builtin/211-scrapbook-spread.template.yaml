      - { id: doodle-1, type: text, z: 60, x: 600, y: 1080, width: 200, height: 0, content: { type: plain, value: "→ best burger of the trip" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $primary, rotation: 3 } }
      - { id: doodle-2, type: text, z: 60, x: 600, y: 1180, width: 280, height: 0, content: { type: plain, value: "↓ no service for 6 hours" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $secondary, rotation: -3 } }
      - { id: polaroid-end, type: rect, z: 70, x: 980, y: 1040, width: 360, height: 320, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: -6 }
