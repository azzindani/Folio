_protocol: template/v1

# 6-page scrapbook — 1500×1500 square, editorial-cream theme.
# Cover → four scrapbook spreads (rotated photo rects + washi tape + handwriting) → back cover.
meta:
  id: tmpl-scrapbook-spread
  name: Scrapbook Spreads (6 pages)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [scrapbook, memory-book, photos, washi-tape, handwriting, square]
  description: "Six-page memory-book scrapbook: cover, four spreads featuring rotated photo-placeholder rects, washi-tape strips, handwriting-style captions, and a dedication back cover."

document:
  width: 1500
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1500, height: 1500, fill: { type: solid, color: "$background" } }
      - { id: paper-texture, type: rect, z: 1, x: 60, y: 60, width: 1380, height: 1380, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: tape-1, type: rect, z: 5, x: 100, y: 100, width: 320, height: 60, fill: { type: solid, color: "$primary" }, opacity: 0.65, rotation: -4 }
      - { id: tape-2, type: rect, z: 5, x: 1080, y: 100, width: 320, height: 60, fill: { type: solid, color: "$secondary" }, opacity: 0.7, rotation: 6 }
      - { id: tape-3, type: rect, z: 5, x: 100, y: 1380, width: 360, height: 56, fill: { type: solid, color: "$secondary" }, opacity: 0.6, rotation: 5 }
      - { id: tape-4, type: rect, z: 5, x: 1060, y: 1370, width: 340, height: 58, fill: { type: solid, color: "$primary" }, opacity: 0.6, rotation: -7 }
      - { id: ticket-1, type: rect, z: 10, x: 220, y: 320, width: 320, height: 200, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: -8 }
      - { id: ticket-1-text, type: text, z: 11, x: 220, y: 370, width: 320, height: 0, content: { type: plain, value: "ADMIT ONE\n— summer fair —\nROW C · SEAT 14" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $text, text_align: center, line_height: 1.5, letter_spacing: 0.3 }, rotation: -8 }
      - { id: polaroid-1, type: rect, z: 12, x: 960, y: 300, width: 320, height: 360, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 2 }, rotation: 6 }
      - { id: polaroid-1-photo, type: rect, z: 13, x: 980, y: 320, width: 280, height: 280, fill: { type: solid, color: $primary }, opacity: 0.6, rotation: 6 }
      - { id: polaroid-1-cap, type: text, z: 14, x: 960, y: 615, width: 320, height: 0, content: { type: plain, value: "snapshot" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text_muted, text_align: center, opacity: 0.3 }, rotation: 6 }
      - { id: title-block, type: rect, z: 20, x: 240, y: 720, width: 1020, height: 360, radius: 8, fill: { type: solid, color: "#FFFFFF" }, stroke: { color: "$border", width: 1 } }
      - { id: title-kicker, type: text, z: 21, x: 240, y: 770, width: 1020, height: 0, content: { type: plain, value: "A MEMORY BOOK · TWENTY TWENTY-SIX" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 22, x: 240, y: 820, width: 1020, height: 0, content: { type: plain, value: "All The Small\nThings We Kept." }, style: { font_family: $heading, font_size: 84, font_weight: 700, font_style: italic, color: $text, text_align: center, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: title-foot, type: text, z: 23, x: 240, y: 1020, width: 1020, height: 0, content: { type: plain, value: "compiled by hand, with sticky fingers" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text_muted, text_align: center } }
      - { id: doodle-heart, type: text, z: 30, x: 460, y: 1180, width: 140, height: 0, content: { type: plain, value: "♡" }, style: { font_family: $heading, font_size: 56, color: $primary, text_align: center, rotation: -10 } }
      - { id: doodle-star, type: text, z: 30, x: 700, y: 1170, width: 140, height: 0, content: { type: plain, value: "✦" }, style: { font_family: $heading, font_size: 48, color: $secondary, text_align: center } }
      - { id: doodle-arrow, type: text, z: 30, x: 940, y: 1180, width: 140, height: 0, content: { type: plain, value: "→" }, style: { font_family: $heading, font_size: 56, color: $primary, text_align: center, rotation: 8 } }
      - { id: page-num, type: text, z: 40, x: 0, y: 1455, width: 1500, height: 0, content: { type: plain, value: "01" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.4 } }

