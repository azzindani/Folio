      - { id: note-text, type: text, z: 41, x: 200, y: 800, width: 1100, height: 0, content: { type: plain, value: "Mile 1,604, somewhere north of Bozeman, you turned to me and said you couldn't remember a day that had ever lasted this long, in the best possible way. I think about that sentence a lot now." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.4, rotation: -1 } }
      - { id: note-sig, type: text, z: 42, x: 200, y: 920, width: 1100, height: 0, content: { type: plain, value: "— driver's seat, Aug 14" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: $primary, text_align: right, rotation: -1 } }
