_protocol: template/v1

# Single-page quarterly results poster. LinkedIn 4:5 portrait.
# Eyebrow, hero revenue stat, 2×2 KPI grid, full report CTA.
meta:
  id: tmpl-quarterly-results-poster
  name: Quarterly Results Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, finance, quarterly, results, kpi, 4-5]
  description: "LinkedIn 4:5 quarterly results poster with hero revenue stat, 2×2 KPI grid, and report CTA."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: forest-deep

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 14
    fill: { type: solid, color: "$primary" }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1110
    cy: 130
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "Q1 2026 · RESULTS" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: revenue
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "$4.2M" }
    style:
      font_family: $heading
      font_size: 240
      font_weight: 900
      color: $primary
      line_height: 0.95
      letter_spacing: -0.04

  - id: caption
    type: text
    z: 22
    x: 80
    y: 460
    width: 1040
    height: 0
    content: { type: plain, value: "ARR, +47% YoY" }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 700
      color: $text
      line_height: 1.2
      letter_spacing: -0.02

  - id: subcaption
    type: text
    z: 23
    x: 80
    y: 530
    width: 1040
    height: 0
    content: { type: plain, value: "Strongest quarter in company history. Driven by enterprise expansion and annual conversions." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.45

  - id: divider
    type: rect
    z: 10
    x: 80
    y: 720
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.25

  - id: kpi-header
    type: text
    z: 30
    x: 80
    y: 750
    width: 1040
    height: 0
    content: { type: plain, value: "KEY METRICS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: stat-1-label
    type: text
    z: 31
    x: 80
    y: 810
    width: 480
    height: 0
    content: { type: plain, value: "CUSTOMERS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.28
      text_transform: uppercase

  - id: stat-1-value
    type: text
    z: 32
    x: 80
    y: 845
    width: 480
    height: 0
    content: { type: plain, value: "1,847" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 800
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: stat-1-delta
    type: text
    z: 33
    x: 80
    y: 960
    width: 480
    height: 0
    content: { type: plain, value: "+312 net new" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $accent

  - id: stat-2-label
    type: text
    z: 34
    x: 620
    y: 810
    width: 500
    height: 0
    content: { type: plain, value: "NPS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.28
      text_transform: uppercase

  - id: stat-2-value
    type: text
    z: 35
    x: 620
    y: 845
    width: 500
    height: 0
    content: { type: plain, value: "58" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 800
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: stat-2-delta
    type: text
    z: 36
    x: 620
    y: 960
    width: 500
    height: 0
    content: { type: plain, value: "+11 from Q4" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $accent

  - id: stat-3-label
    type: text
    z: 37
    x: 80
    y: 1060
    width: 480
    height: 0
    content: { type: plain, value: "GROSS RETENTION" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.28
      text_transform: uppercase

  - id: stat-3-value
    type: text
    z: 38
    x: 80
    y: 1095
    width: 480
    height: 0
    content: { type: plain, value: "94%" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 800
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: stat-3-delta
    type: text
    z: 39
    x: 80
    y: 1210
    width: 480
    height: 0
    content: { type: plain, value: "+2 pts vs Q4" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $accent

  - id: stat-4-label
    type: text
    z: 40
    x: 620
    y: 1060
    width: 500
    height: 0
    content: { type: plain, value: "GROSS MARGIN" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.28
      text_transform: uppercase

  - id: stat-4-value
    type: text
    z: 41
    x: 620
    y: 1095
    width: 500
    height: 0
    content: { type: plain, value: "78%" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 800
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: stat-4-delta
    type: text
    z: 42
    x: 620
    y: 1210
    width: 500
    height: 0
    content: { type: plain, value: "Stable QoQ" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $accent

  - id: cta-card
    type: rect
    z: 50
    x: 80
    y: 1330
    width: 1040
    height: 110
    radius: 16
    fill: { type: solid, color: "$primary" }

  - id: cta-text
    type: text
    z: 51
    x: 112
    y: 1365
    width: 980
    height: 0
    content: { type: plain, value: "Full report inside →" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: "#FFFFFF"
      line_height: 1.2
      letter_spacing: -0.01

  - id: page-mark
    type: text
    z: 60
    x: 80
    y: 1460
    width: 1040
    height: 0
    content: { type: plain, value: "@company · 17 MAY 2026" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_transform: uppercase

animations:
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.25 }
  revenue:
    enter: { type: scale_in, duration: 900, delay: 200, easing: ease-out }
  caption:
    enter: { type: fade_up, duration: 600, delay: 700, easing: ease-out }
  stat-1-value:
    enter: { type: fade_up, duration: 600, delay: 400, easing: ease-out }
  stat-2-value:
    enter: { type: fade_up, duration: 600, delay: 550, easing: ease-out }
  stat-3-value:
    enter: { type: fade_up, duration: 600, delay: 700, easing: ease-out }
  stat-4-value:
    enter: { type: fade_up, duration: 600, delay: 850, easing: ease-out }
  cta-card:
    loop: { type: breathe, duration: 2800, scale: 1.02 }

slots:
  - { id: eyebrow,        path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",          default: "Q1 2026 · RESULTS" }
  - { id: revenue,        path: "layers[4].content.value",  type: text, hint: "Hero revenue stat",    default: "$4.2M" }
  - { id: caption,        path: "layers[5].content.value",  type: text, hint: "Revenue caption",      default: "ARR, +47% YoY" }
  - { id: subcaption,     path: "layers[6].content.value",  type: text, hint: "Sub-caption line",     default: "Strongest quarter in company history. Driven by enterprise expansion and annual conversions." }
  - { id: stat_1_value,   path: "layers[10].content.value", type: text, hint: "Stat 1 · customers",   default: "1,847" }
  - { id: stat_2_value,   path: "layers[13].content.value", type: text, hint: "Stat 2 · NPS",         default: "58" }
  - { id: stat_3_value,   path: "layers[16].content.value", type: text, hint: "Stat 3 · retention",   default: "94%" }
  - { id: stat_4_value,   path: "layers[19].content.value", type: text, hint: "Stat 4 · margin",      default: "78%" }
  - { id: cta_text,       path: "layers[22].content.value", type: text, hint: "CTA text",             default: "Full report inside →" }
  - { id: footer,         path: "layers[23].content.value", type: text, hint: "Footer attribution",   default: "@company · 17 MAY 2026" }
