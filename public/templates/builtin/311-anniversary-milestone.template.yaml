_protocol: template/v1

# Anniversary milestone card — 1080×1500 portrait, editorial-cream theme.
# Huge year number ("50 YEARS"), couple names, romantic message,
# photo placeholder circle.
meta:
  id: tmpl-anniversary-milestone
  name: Anniversary Milestone Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, anniversary, milestone, wedding, editorial, portrait]
  description: "Wedding anniversary milestone card with huge year count, couple names, romantic message, and photo placeholder."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1 outer frame
  - { id: frame-outer, type: rect, z: 1, x: 60, y: 60, width: 960, height: 1380, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 2 inner frame
  - { id: frame-inner, type: rect, z: 2, x: 78, y: 78, width: 924, height: 1344, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
  # 3 top ornament
  - { id: orn-top, type: text, z: 5, x: 0, y: 150, width: 1080, height: 0, content: { type: plain, value: "❦  ·  ✦  ·  ❦" }, style: { font_family: $heading, font_size: 24, color: "$primary", text_align: center, letter_spacing: 0.4 } }
  # 4 eyebrow
  - { id: eyebrow, type: text, z: 10, x: 0, y: 200, width: 1080, height: 0, content: { type: plain, value: "HAPPY ANNIVERSARY" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.8 } }
  # 5 short rule
  - { id: rule-top, type: rect, z: 11, x: 490, y: 260, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 6 huge year number
  - { id: years-num, type: text, z: 20, x: 0, y: 290, width: 1080, height: 0, content: { type: plain, value: "50" }, style: { font_family: $heading, font_size: 280, font_weight: 600, font_style: italic, color: "$text", text_align: center, line_height: 1 } }
  # 7 years word
  - { id: years-word, type: text, z: 21, x: 0, y: 580, width: 1080, height: 0, content: { type: plain, value: "YEARS TOGETHER" }, style: { font_family: $body, font_size: 24, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.8 } }
  # 8 rule under years
  - { id: rule-mid, type: rect, z: 22, x: 490, y: 640, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 9 photo placeholder circle outer
  - { id: photo-ring, type: circle, z: 30, cx: 540, cy: 800, rx: 130, ry: 130, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 0.5 } }
  # 10 photo placeholder inner ring
  - { id: photo-inner, type: circle, z: 31, cx: 540, cy: 800, rx: 118, ry: 118, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.25 } }
  # 11 photo placeholder caption
  - { id: photo-cap, type: text, z: 32, x: 0, y: 790, width: 1080, height: 0, content: { type: plain, value: "your photo" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: "$text_muted", text_align: center } }
  # 12 couple names
  - { id: couple, type: text, z: 40, x: 0, y: 980, width: 1080, height: 0, content: { type: plain, value: "Margaret & William" }, style: { font_family: $heading, font_size: 64, font_style: italic, color: "$primary", text_align: center, line_height: 1.1 } }
  # 13 small subtitle
  - { id: subtitle, type: text, z: 41, x: 0, y: 1070, width: 1080, height: 0, content: { type: plain, value: "married on the twelfth of June, nineteen seventy-six" }, style: { font_family: $body, font_size: 16, color: "$text_muted", text_align: center, letter_spacing: 0.3, font_style: italic } }
  # 14 rule
  - { id: rule-bot, type: rect, z: 42, x: 490, y: 1130, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 15 message
  - { id: message, type: text, z: 50, x: 120, y: 1170, width: 840, height: 0, content: { type: plain, value: "Half a century of mornings together, of shared coffee and stubborn arguments and slow Sunday walks. Here's to every year still ahead — may they be as kind to you as you have been to one another." }, style: { font_family: $heading, font_size: 19, font_style: italic, color: "$text", text_align: center, line_height: 1.6 } }
  # 16 bottom ornament
  - { id: orn-bot, type: text, z: 60, x: 0, y: 1380, width: 1080, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 22, color: "$primary", text_align: center } }

slots:
  - { id: years_count,  path: "layers[6].content.value",  type: text, hint: "Number of years",           default: "50" }
  - { id: couple_names, path: "layers[12].content.value", type: text, hint: "Couple names",              default: "Margaret & William" }
  - { id: message,      path: "layers[15].content.value", type: text, hint: "Romantic message paragraph", default: "Half a century of mornings together, of shared coffee and stubborn arguments and slow Sunday walks. Here's to every year still ahead — may they be as kind to you as you have been to one another." }
