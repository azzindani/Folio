_protocol: template/v1

# LinkedIn carousel — 7-slide PRD template playbook.
# Indigo-pro theme, 1080×1350 portrait.
meta:
  id: tmpl-linkedin-prd-template-7slide
  name: LinkedIn PRD Template (7 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, product, prd, pm, "4-5"]
  description: "Cover + intro + 5 section deep-dives + CTA — a stealable PRD framework."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

pages:
  # ── Slide 1 · Cover ─────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 160, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "1 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 500, width: 960, height: 0, content: { type: plain, value: "THE PM PLAYBOOK" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 560, width: 960, height: 0, content: { type: plain, value: "The PRD template\nI steal from." }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 880, width: 960, height: 0, content: { type: plain, value: "5 sections. Every spec. Swipe →" }, style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 2 · Intro ─────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "2 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "WHY THIS WORKS" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 240, width: 960, height: 0, content: { type: plain, value: "A PRD is not a doc.\nIt's a forcing function." }, style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: body, type: text, z: 13, x: 60, y: 540, width: 960, height: 0, content: { type: plain, value: "The best specs answer 5 questions before a single line of code is written. Skip any one and your launch slips." }, style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 } }
      - { id: callout, type: text, z: 14, x: 60, y: 800, width: 960, height: 0, content: { type: plain, value: "→ Steal each section. Adapt the prompts." }, style: { font_family: $body, font_size: 24, font_weight: 600, color: $primary, line_height: 1.4 } }
      - { id: handle, type: text, z: 15, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 3 · 01 Problem ────────────────────────────────
  - id: problem
    label: 01 Problem
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "3 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "Problem" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: q1, type: text, z: 20, x: 60, y: 600, width: 960, height: 0, content: { type: plain, value: "Q · Whose pain is sharp enough to pay for relief?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q2, type: text, z: 21, x: 60, y: 760, width: 960, height: 0, content: { type: plain, value: "Q · What workaround exists today, and why does it suck?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q3, type: text, z: 22, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "Q · What changes for users if we never ship?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 30, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 4 · 02 Users ──────────────────────────────────
  - id: users
    label: 02 Users
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "4 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "Users" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: q1, type: text, z: 20, x: 60, y: 600, width: 960, height: 0, content: { type: plain, value: "Q · Who is the primary persona — be uncomfortably specific." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q2, type: text, z: 21, x: 60, y: 760, width: 960, height: 0, content: { type: plain, value: "Q · What job-to-be-done are they hiring this feature for?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q3, type: text, z: 22, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "Q · Who is explicitly NOT the user this round?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 30, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 5 · 03 Solution ───────────────────────────────
  - id: solution
    label: 03 Solution
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "5 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "Solution" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: q1, type: text, z: 20, x: 60, y: 600, width: 960, height: 0, content: { type: plain, value: "Q · What is the smallest cut that proves the bet?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q2, type: text, z: 21, x: 60, y: 760, width: 960, height: 0, content: { type: plain, value: "Q · What are we explicitly NOT building this round?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q3, type: text, z: 22, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "Q · What does the happy path look like in 3 screens?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 30, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 6 · 04 Success metrics ────────────────────────
  - id: metrics
    label: 04 Success metrics
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "6 / 7" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "04" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "Success metrics" }, style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: q1, type: text, z: 20, x: 60, y: 600, width: 960, height: 0, content: { type: plain, value: "Q · What single number tells us this worked?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q2, type: text, z: 21, x: 60, y: 760, width: 960, height: 0, content: { type: plain, value: "Q · What guardrail metric must NOT regress?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: q3, type: text, z: 22, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "Q · When do we declare the experiment over?" }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: handle, type: text, z: 30, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 7 · 05 Risks + CTA ────────────────────────────
  - id: risks-cta
    label: 05 Risks + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 200, stops: [{ color: "$primary", position: 0 }, { color: "$background", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(8,5,40,0.55)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "7 / 7" }, style: { font_family: $mono, font_size: 18, color: "#FFFFFF" } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "05" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: "$accent", line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "Risks" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: q1, type: text, z: 20, x: 60, y: 540, width: 960, height: 0, content: { type: plain, value: "Q · What kills this feature in week 1?" }, style: { font_family: $body, font_size: 24, color: "#F0F0FF", line_height: 1.5 } }
      - { id: q2, type: text, z: 21, x: 60, y: 620, width: 960, height: 0, content: { type: plain, value: "Q · What's the rollback plan?" }, style: { font_family: $body, font_size: 24, color: "#F0F0FF", line_height: 1.5 } }
      - { id: cta-heading, type: text, z: 30, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "Save → use on your\nnext spec." }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: cta-btn, type: rect, z: 31, x: 60, y: 1090, width: 320, height: 68, radius: 34, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 32, x: 60, y: 1110, width: 320, height: 0, content: { type: plain, value: "Follow →" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$primary", text_align: center } }
      - { id: handle, type: text, z: 33, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF" } }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",      default: "The PRD template\nI steal from." }
  - { id: cover_tagline,  path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",       default: "5 sections. Every spec. Swipe →" }
  - { id: intro_title,    path: "pages[1].layers[4].content.value", type: text, hint: "Intro title",         default: "A PRD is not a doc.\nIt's a forcing function." }
  - { id: intro_body,     path: "pages[1].layers[5].content.value", type: text, hint: "Intro body",          default: "The best specs answer 5 questions before a single line of code is written. Skip any one and your launch slips." }
  - { id: problem_q1,     path: "pages[2].layers[5].content.value", type: text, hint: "Problem Q1",          default: "Q · Whose pain is sharp enough to pay for relief?" }
  - { id: users_q1,       path: "pages[3].layers[5].content.value", type: text, hint: "Users Q1",            default: "Q · Who is the primary persona — be uncomfortably specific." }
  - { id: solution_q1,    path: "pages[4].layers[5].content.value", type: text, hint: "Solution Q1",         default: "Q · What is the smallest cut that proves the bet?" }
  - { id: metrics_q1,     path: "pages[5].layers[5].content.value", type: text, hint: "Metrics Q1",          default: "Q · What single number tells us this worked?" }
  - { id: cta_heading,    path: "pages[6].layers[8].content.value", type: text, hint: "CTA heading",         default: "Save → use on your\nnext spec." }
  - { id: cta_handle,     path: "pages[6].layers[11].content.value", type: text, hint: "CTA handle",         default: "@yourhandle" }
