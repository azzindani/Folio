_protocol: template/v1

# 7-slide LinkedIn carousel — Career pivot / personal story arc.
# Portrait 1080×1350 (LinkedIn 4:5), warm sunset palette.
meta:
  id: tmpl-linkedin-career-story-7slide
  name: LinkedIn Career Story (7 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, story, career, narrative, 4-5]
  description: "Seven-slide LinkedIn carousel for a personal career-pivot narrative: cover hook, backstory, problem, turning point, action, outcome, lessons + CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: avatar-ring
        type: circle
        z: 2
        cx: 180
        cy: 1180
        rx: 90
        ry: 90
        fill: { type: solid, color: "$surface" }
        stroke: { color: "$primary", width: 3 }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 120
        width: 920
        height: 0
        content: { type: plain, value: "MY STORY" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 420
        width: 920
        height: 0
        content: { type: plain, value: "I quit my Big Tech job.\nHere's what I learned." }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: tagline
        type: text
        z: 12
        x: 80
        y: 720
        width: 920
        height: 0
        content: { type: plain, value: "Swipe → for the full story." }
        style: { font_family: $body, font_size: 24, color: $text_muted }
      - id: handle
        type: text
        z: 13
        x: 240
        y: 1170
        width: 760
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: counter
        type: text
        z: 14
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "1/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Setup / Before ───────────────────────────────
  - id: setup
    label: Setup
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "BEFORE" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: timeframe
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "2019 – 2023" }
        style: { font_family: $mono, font_size: 18, color: $text_muted }
      - id: title
        type: text
        z: 12
        x: 80
        y: 300
        width: 920
        height: 0
        content: { type: plain, value: "Senior PM,\n$400K, golden cuffs." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 13
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "I spent four years shipping enterprise features nobody asked for. Big team, bigger meetings. The pay was incredible. The work felt like nothing." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: counter
        type: text
        z: 14
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "2/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · The Problem ──────────────────────────────────
  - id: problem
    label: Problem
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "THE PROBLEM" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "Why I knew I had to leave." }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - id: pain-1-dot
        type: circle
        z: 20
        cx: 110
        cy: 580
        rx: 12
        ry: 12
        fill: { type: solid, color: "$secondary" }
      - id: pain-1-text
        type: text
        z: 21
        x: 150
        y: 562
        width: 850
        height: 0
        content: { type: plain, value: "I dreaded Mondays — for months, not weeks." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - id: pain-2-dot
        type: circle
        z: 22
        cx: 110
        cy: 720
        rx: 12
        ry: 12
        fill: { type: solid, color: "$secondary" }
      - id: pain-2-text
        type: text
        z: 23
        x: 150
        y: 702
        width: 850
        height: 0
        content: { type: plain, value: "My calendar belonged to other people." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - id: pain-3-dot
        type: circle
        z: 24
        cx: 110
        cy: 860
        rx: 12
        ry: 12
        fill: { type: solid, color: "$secondary" }
      - id: pain-3-text
        type: text
        z: 25
        x: 150
        y: 842
        width: 850
        height: 0
        content: { type: plain, value: "I'd stopped learning anything new." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - id: counter
        type: text
        z: 30
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "3/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Turning Point ────────────────────────────────
  - id: turning-point
    label: Turning Point
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - { id: quote-bar, type: rect, z: 2, x: 80, y: 760, width: 6, height: 280, radius: 3, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "TURNING POINT" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "The morning everything cracked." }
        style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - id: narrative
        type: text
        z: 12
        x: 80
        y: 400
        width: 920
        height: 0
        content: { type: plain, value: "On a Tuesday in March, I sat through my fourth roadmap review of the quarter. Same slides. Same arguments. I looked at my notebook and realized I hadn't written a real idea in six months." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - id: pull-quote
        type: text
        z: 13
        x: 120
        y: 800
        width: 880
        height: 0
        content: { type: plain, value: "\"If this is the best version of the next ten years, I don't want them.\"" }
        style: { font_family: $heading, font_size: 32, font_style: italic, font_weight: 600, color: $primary, line_height: 1.35 }
      - id: counter
        type: text
        z: 14
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "4/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · What I Did ───────────────────────────────────
  - id: action
    label: What I Did
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "WHAT I DID" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "Three moves, in order." }
        style: { font_family: $heading, font_size: 52, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - { id: chip-1, type: rect, z: 20, x: 80, y: 480, width: 56, height: 56, radius: 0, fill: { type: solid, color: "$primary" } }
      - id: chip-1-num
        type: text
        z: 21
        x: 80
        y: 494
        width: 56
        height: 0
        content: { type: plain, value: "1" }
        style: { font_family: $heading, font_size: 28, font_weight: 800, color: "#FFFFFF", text_align: center }
      - id: action-1
        type: text
        z: 22
        x: 170
        y: 488
        width: 830
        height: 0
        content: { type: plain, value: "Saved 18 months of runway before resigning." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: chip-2, type: rect, z: 23, x: 80, y: 660, width: 56, height: 56, radius: 0, fill: { type: solid, color: "$primary" } }
      - id: chip-2-num
        type: text
        z: 24
        x: 80
        y: 674
        width: 56
        height: 0
        content: { type: plain, value: "2" }
        style: { font_family: $heading, font_size: 28, font_weight: 800, color: "#FFFFFF", text_align: center }
      - id: action-2
        type: text
        z: 25
        x: 170
        y: 668
        width: 830
        height: 0
        content: { type: plain, value: "Shipped a tiny side-project every weekend." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - { id: chip-3, type: rect, z: 26, x: 80, y: 840, width: 56, height: 56, radius: 0, fill: { type: solid, color: "$primary" } }
      - id: chip-3-num
        type: text
        z: 27
        x: 80
        y: 854
        width: 56
        height: 0
        content: { type: plain, value: "3" }
        style: { font_family: $heading, font_size: 28, font_weight: 800, color: "#FFFFFF", text_align: center }
      - id: action-3
        type: text
        z: 28
        x: 170
        y: 848
        width: 830
        height: 0
        content: { type: plain, value: "Told ten friends — kept myself accountable." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.4 }
      - id: counter
        type: text
        z: 30
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "5/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 6 · The Outcome ──────────────────────────────────
  - id: outcome
    label: Outcome
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $background } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "OUTCOME" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: stat
        type: text
        z: 11
        x: 80
        y: 380
        width: 920
        height: 0
        content: { type: plain, value: "18 months\nlater" }
        style: { font_family: $heading, font_size: 140, font_weight: 900, color: $text, line_height: 0.95, letter_spacing: -0.04 }
      - id: support
        type: text
        z: 12
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "Half the income. Triple the energy. A product 4,000 people pay for — and a calendar I actually own." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: counter
        type: text
        z: 14
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "6/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 7 · Lessons + CTA ────────────────────────────────
  - id: lessons-cta
    label: Lessons + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 8, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "3 LESSONS" }
        style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "What I'd tell myself,\non day one." }
        style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: lesson-1-num
        type: text
        z: 20
        x: 80
        y: 500
        width: 60
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: lesson-1
        type: text
        z: 21
        x: 160
        y: 500
        width: 840
        height: 0
        content: { type: plain, value: "Money funds the leap. It doesn't make the leap." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 }
      - id: lesson-2-num
        type: text
        z: 22
        x: 80
        y: 620
        width: 60
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: lesson-2
        type: text
        z: 23
        x: 160
        y: 620
        width: 840
        height: 0
        content: { type: plain, value: "Shipping in public is faster than planning in private." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 }
      - id: lesson-3-num
        type: text
        z: 24
        x: 80
        y: 740
        width: 60
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary }
      - id: lesson-3
        type: text
        z: 25
        x: 160
        y: 740
        width: 840
        height: 0
        content: { type: plain, value: "The version of you that's scared is already gone." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 }
      - { id: cta-chip, type: rect, z: 30, x: 80, y: 940, width: 520, height: 64, radius: 32, fill: { type: solid, color: "$primary" } }
      - id: cta-text
        type: text
        z: 31
        x: 80
        y: 958
        width: 520
        height: 0
        content: { type: plain, value: "Save → revisit when you're stuck" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#FFFFFF", text_align: center }
      - id: handle
        type: text
        z: 32
        x: 80
        y: 1100
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle · follow for more stories" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: counter
        type: text
        z: 33
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "7/7" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

slots:
  - { id: cover_title,      path: "pages[0].layers[4].content.value",  type: text, hint: "Cover hook headline",   default: "I quit my Big Tech job.\nHere's what I learned." }
  - { id: cover_handle,     path: "pages[0].layers[6].content.value",  type: text, hint: "Author handle",          default: "@yourhandle" }
  - { id: setup_title,      path: "pages[1].layers[4].content.value",  type: text, hint: "Backstory headline",     default: "Senior PM,\n$400K, golden cuffs." }
  - { id: setup_body,       path: "pages[1].layers[5].content.value",  type: text, hint: "Backstory body",         default: "I spent four years shipping enterprise features nobody asked for. Big team, bigger meetings. The pay was incredible. The work felt like nothing." }
  - { id: problem_title,    path: "pages[2].layers[3].content.value",  type: text, hint: "Problem headline",       default: "Why I knew I had to leave." }
  - { id: turning_quote,    path: "pages[3].layers[6].content.value",  type: text, hint: "Pull-quote line",        default: "\"If this is the best version of the next ten years, I don't want them.\"" }
  - { id: outcome_stat,     path: "pages[5].layers[3].content.value",  type: text, hint: "Big outcome display",    default: "18 months\nlater" }
  - { id: cta_text,         path: "pages[6].layers[11].content.value", type: text, hint: "Closing CTA chip",       default: "Save → revisit when you're stuck" }
