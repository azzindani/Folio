_protocol: template/v1

# 4-page wedding invitation suite — 1240×1754 A4 portrait, editorial-cream theme.
# Main invitation → schedule → RSVP card → accommodations + dress code.
meta:
  id: tmpl-wedding-invitation-suite
  name: Wedding Invitation Suite (4 pages)
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, wedding, invitation, elegant, cream, a4]
  description: "Four-page wedding invitation suite with main invite, day schedule, RSVP card, and accommodations and dress code."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Main Invitation ────────────────────────────────
  - id: main-invitation
    label: Main Invitation
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: outer-frame, type: rect, z: 1, x: 80, y: 80, width: 1080, height: 1594, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
      - { id: inner-frame, type: rect, z: 2, x: 100, y: 100, width: 1040, height: 1554, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
      - { id: flourish-top, type: text, z: 5, x: 80, y: 200, width: 1080, height: 0, content: { type: plain, value: "❦  ·  ✦  ·  ❦" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center, letter_spacing: 0.4 } }
      - { id: pre-kicker, type: text, z: 10, x: 80, y: 320, width: 1080, height: 0, content: { type: plain, value: "TOGETHER WITH THEIR FAMILIES" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.6, text_align: center, text_transform: uppercase } }
      - { id: bride-name, type: text, z: 11, x: 80, y: 440, width: 1080, height: 0, content: { type: plain, value: "Elena Marchetti" }, style: { font_family: $heading, font_size: 100, font_weight: 400, font_style: italic, color: $text, line_height: 1.05, letter_spacing: -0.01, text_align: center } }
      - { id: amp, type: text, z: 12, x: 80, y: 580, width: 1080, height: 0, content: { type: plain, value: "&" }, style: { font_family: $heading, font_size: 64, font_style: italic, color: $primary, text_align: center, line_height: 1 } }
      - { id: groom-name, type: text, z: 13, x: 80, y: 680, width: 1080, height: 0, content: { type: plain, value: "Theodore Hayward" }, style: { font_family: $heading, font_size: 100, font_weight: 400, font_style: italic, color: $text, line_height: 1.05, letter_spacing: -0.01, text_align: center } }
      - { id: invite-line, type: text, z: 14, x: 80, y: 840, width: 1080, height: 0, content: { type: plain, value: "INVITE YOU TO JOIN THEIR CELEBRATION" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.6, text_align: center, text_transform: uppercase } }
      - { id: divider, type: rect, z: 15, x: 595, y: 920, width: 50, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: date-day, type: text, z: 20, x: 80, y: 970, width: 1080, height: 0, content: { type: plain, value: "Saturday" }, style: { font_family: $body, font_size: 18, color: $text_muted, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: date-main, type: text, z: 21, x: 80, y: 1020, width: 1080, height: 0, content: { type: plain, value: "the twelfth of September" }, style: { font_family: $heading, font_size: 56, font_style: italic, color: $text, line_height: 1.2, text_align: center } }
      - { id: date-year, type: text, z: 22, x: 80, y: 1100, width: 1080, height: 0, content: { type: plain, value: "two thousand and twenty-six" }, style: { font_family: $heading, font_size: 32, font_style: italic, color: $text_muted, text_align: center } }
      - { id: divider-2, type: rect, z: 23, x: 595, y: 1180, width: 50, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: time, type: text, z: 24, x: 80, y: 1220, width: 1080, height: 0, content: { type: plain, value: "Half past four in the afternoon" }, style: { font_family: $heading, font_size: 30, font_style: italic, color: $text, text_align: center } }
      - { id: venue-name, type: text, z: 25, x: 80, y: 1320, width: 1080, height: 0, content: { type: plain, value: "Casa Olivella" }, style: { font_family: $heading, font_size: 44, font_weight: 600, color: $primary, text_align: center, letter_spacing: 0.04 } }
      - { id: venue-addr, type: text, z: 26, x: 80, y: 1390, width: 1080, height: 0, content: { type: plain, value: "Via Borgo Vecchio 14 · Asolo · Italy" }, style: { font_family: $body, font_size: 20, color: $text_muted, text_align: center, line_height: 1.5 } }
      - { id: flourish-bot, type: text, z: 30, x: 80, y: 1540, width: 1080, height: 0, content: { type: plain, value: "❦  ·  ✦  ·  ❦" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center, letter_spacing: 0.4 } }

  # ── Page 2 · Schedule ───────────────────────────────────────
  - id: schedule
    label: Schedule
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: flourish-top, type: text, z: 5, x: 80, y: 180, width: 1080, height: 0, content: { type: plain, value: "—  ·  —" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center, letter_spacing: 0.4 } }
      - { id: page-title, type: text, z: 10, x: 80, y: 260, width: 1080, height: 0, content: { type: plain, value: "The Day" }, style: { font_family: $heading, font_size: 88, font_style: italic, color: $text, text_align: center, line_height: 1 } }
      - { id: page-sub, type: text, z: 11, x: 80, y: 380, width: 1080, height: 0, content: { type: plain, value: "12 SEPTEMBER 2026 · CASA OLIVELLA" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.6, text_align: center, text_transform: uppercase } }
      - { id: timeline, type: rect, z: 12, x: 620, y: 480, width: 1, height: 980, fill: { type: solid, color: "$primary" } }
      - { id: e1-dot, type: circle, z: 20, cx: 620, cy: 540, rx: 12, ry: 12, fill: { type: solid, color: "$primary" } }
      - { id: e1-time, type: text, z: 21, x: 200, y: 510, width: 380, height: 0, content: { type: plain, value: "4:30 PM" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary, text_align: right } }
      - { id: e1-title, type: text, z: 22, x: 660, y: 510, width: 480, height: 0, content: { type: plain, value: "Ceremony" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: $text } }
      - { id: e1-body, type: text, z: 23, x: 660, y: 560, width: 480, height: 0, content: { type: plain, value: "Olive grove terrace · please arrive by 4:15" }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: e2-dot, type: circle, z: 20, cx: 620, cy: 740, rx: 12, ry: 12, fill: { type: solid, color: "$primary" } }
      - { id: e2-time, type: text, z: 21, x: 200, y: 710, width: 380, height: 0, content: { type: plain, value: "5:30 PM" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary, text_align: right } }
      - { id: e2-title, type: text, z: 22, x: 660, y: 710, width: 480, height: 0, content: { type: plain, value: "Cocktail Hour" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: $text } }
      - { id: e2-body, type: text, z: 23, x: 660, y: 760, width: 480, height: 0, content: { type: plain, value: "Veneto spritz & canapés · garden courtyard" }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: e3-dot, type: circle, z: 20, cx: 620, cy: 940, rx: 12, ry: 12, fill: { type: solid, color: "$primary" } }
      - { id: e3-time, type: text, z: 21, x: 200, y: 910, width: 380, height: 0, content: { type: plain, value: "7:00 PM" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary, text_align: right } }
      - { id: e3-title, type: text, z: 22, x: 660, y: 910, width: 480, height: 0, content: { type: plain, value: "Dinner" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: $text } }
      - { id: e3-body, type: text, z: 23, x: 660, y: 960, width: 480, height: 0, content: { type: plain, value: "Five-course tasting menu · long tables, candlelight" }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: e4-dot, type: circle, z: 20, cx: 620, cy: 1140, rx: 12, ry: 12, fill: { type: solid, color: "$primary" } }
      - { id: e4-time, type: text, z: 21, x: 200, y: 1110, width: 380, height: 0, content: { type: plain, value: "9:30 PM" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary, text_align: right } }
      - { id: e4-title, type: text, z: 22, x: 660, y: 1110, width: 480, height: 0, content: { type: plain, value: "Toasts & First Dance" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: $text } }
      - { id: e4-body, type: text, z: 23, x: 660, y: 1160, width: 480, height: 0, content: { type: plain, value: "Cake cut, a few words, then the floor opens" }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: e5-dot, type: circle, z: 20, cx: 620, cy: 1340, rx: 12, ry: 12, fill: { type: solid, color: "$primary" } }
      - { id: e5-time, type: text, z: 21, x: 200, y: 1310, width: 380, height: 0, content: { type: plain, value: "11:00 PM" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary, text_align: right } }
      - { id: e5-title, type: text, z: 22, x: 660, y: 1310, width: 480, height: 0, content: { type: plain, value: "Late-night Send-off" }, style: { font_family: $heading, font_size: 36, font_weight: 600, color: $text } }
      - { id: e5-body, type: text, z: 23, x: 660, y: 1360, width: 480, height: 0, content: { type: plain, value: "Sparklers, espresso, biscotti for the road" }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5 } }
      - { id: page-num, type: text, z: 40, x: 80, y: 1640, width: 1080, height: 0, content: { type: plain, value: "ii" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text_muted, text_align: center } }

  # ── Page 3 · RSVP Card ──────────────────────────────────────
  - id: rsvp
    label: RSVP
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: outer-frame, type: rect, z: 1, x: 80, y: 80, width: 1080, height: 1594, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
      - { id: flourish, type: text, z: 5, x: 80, y: 240, width: 1080, height: 0, content: { type: plain, value: "❀" }, style: { font_family: $heading, font_size: 36, color: $primary, text_align: center } }
      - { id: page-title, type: text, z: 10, x: 80, y: 320, width: 1080, height: 0, content: { type: plain, value: "Kindly reply" }, style: { font_family: $heading, font_size: 88, font_style: italic, color: $text, text_align: center, line_height: 1 } }
      - { id: page-sub, type: text, z: 11, x: 80, y: 440, width: 1080, height: 0, content: { type: plain, value: "BY THE FIRST OF AUGUST · 2026" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.6, text_align: center, text_transform: uppercase } }
      - { id: name-label, type: text, z: 20, x: 200, y: 580, width: 840, height: 0, content: { type: plain, value: "M" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $text } }
      - { id: name-line, type: rect, z: 21, x: 240, y: 620, width: 800, height: 1, fill: { type: solid, color: "$text" } }
      - { id: q1, type: text, z: 22, x: 200, y: 700, width: 840, height: 0, content: { type: plain, value: "WILL JOYFULLY ATTEND" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: q1-checkbox-1, type: rect, z: 23, x: 200, y: 740, width: 24, height: 24, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
      - { id: q1-opt-1, type: text, z: 24, x: 240, y: 742, width: 300, height: 0, content: { type: plain, value: "with pleasure" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text } }
      - { id: q1-checkbox-2, type: rect, z: 23, x: 560, y: 740, width: 24, height: 24, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
      - { id: q1-opt-2, type: text, z: 24, x: 600, y: 742, width: 360, height: 0, content: { type: plain, value: "regretfully declines" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text } }
      - { id: q2, type: text, z: 25, x: 200, y: 820, width: 840, height: 0, content: { type: plain, value: "NUMBER OF GUESTS" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: q2-line, type: rect, z: 26, x: 200, y: 880, width: 200, height: 1, fill: { type: solid, color: "$text" } }
      - { id: q3, type: text, z: 27, x: 200, y: 940, width: 840, height: 0, content: { type: plain, value: "MENU SELECTION" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: q3-c1, type: rect, z: 28, x: 200, y: 980, width: 18, height: 18, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
      - { id: q3-o1, type: text, z: 29, x: 230, y: 980, width: 800, height: 0, content: { type: plain, value: "Sea bass with saffron risotto" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text } }
      - { id: q3-c2, type: rect, z: 28, x: 200, y: 1020, width: 18, height: 18, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
      - { id: q3-o2, type: text, z: 29, x: 230, y: 1020, width: 800, height: 0, content: { type: plain, value: "Lamb with rosemary potatoes" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text } }
      - { id: q3-c3, type: rect, z: 28, x: 200, y: 1060, width: 18, height: 18, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
      - { id: q3-o3, type: text, z: 29, x: 230, y: 1060, width: 800, height: 0, content: { type: plain, value: "Wild mushroom tortelli (vegetarian)" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text } }
      - { id: q4, type: text, z: 30, x: 200, y: 1140, width: 840, height: 0, content: { type: plain, value: "DIETARY NEEDS OR ALLERGIES" }, style: { font_family: $body, font_size: 16, font_weight: 600, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: q4-line, type: rect, z: 31, x: 200, y: 1200, width: 840, height: 1, fill: { type: solid, color: "$text" } }
      - { id: divider, type: rect, z: 40, x: 595, y: 1300, width: 50, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: reply-online, type: text, z: 41, x: 80, y: 1340, width: 1080, height: 0, content: { type: plain, value: "or reply online" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text_muted, text_align: center } }
      - { id: rsvp-url, type: text, z: 42, x: 80, y: 1390, width: 1080, height: 0, content: { type: plain, value: "elenaandtheo.com/rsvp" }, style: { font_family: $mono, font_size: 26, font_weight: 600, color: $primary, text_align: center, letter_spacing: 0.04 } }
      - { id: code, type: text, z: 43, x: 80, y: 1470, width: 1080, height: 0, content: { type: plain, value: "your code · OLIV-2026" }, style: { font_family: $body, font_size: 16, color: $text_muted, text_align: center, letter_spacing: 0.3 } }
      - { id: page-num, type: text, z: 50, x: 80, y: 1620, width: 1080, height: 0, content: { type: plain, value: "iii" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text_muted, text_align: center } }

  # ── Page 4 · Accommodations + Dress Code ────────────────────
  - id: accommodations
    label: Accommodations
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: flourish-top, type: text, z: 5, x: 80, y: 180, width: 1080, height: 0, content: { type: plain, value: "—  ·  —" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center, letter_spacing: 0.4 } }
      - { id: page-title, type: text, z: 10, x: 80, y: 260, width: 1080, height: 0, content: { type: plain, value: "Details" }, style: { font_family: $heading, font_size: 88, font_style: italic, color: $text, text_align: center, line_height: 1 } }
      - { id: page-sub, type: text, z: 11, x: 80, y: 380, width: 1080, height: 0, content: { type: plain, value: "WHERE TO STAY · WHAT TO WEAR · HOW TO GET THERE" }, style: { font_family: $body, font_size: 14, font_weight: 600, color: $text_muted, letter_spacing: 0.5, text_align: center, text_transform: uppercase } }
      - { id: sect-1-title, type: text, z: 20, x: 120, y: 500, width: 1000, height: 0, content: { type: plain, value: "Where to stay" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary } }
      - { id: sect-1-divider, type: rect, z: 21, x: 120, y: 560, width: 80, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: h1-name, type: text, z: 22, x: 120, y: 600, width: 500, height: 0, content: { type: plain, value: "Villa Cipriani" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: $text } }
      - { id: h1-detail, type: text, z: 23, x: 120, y: 644, width: 500, height: 0, content: { type: plain, value: "5 min from venue · group rate $240/night\nUse code OLIVELLA when booking by July 15" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.6 } }
      - { id: h2-name, type: text, z: 22, x: 660, y: 600, width: 500, height: 0, content: { type: plain, value: "Albergo al Sole" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: $text } }
      - { id: h2-detail, type: text, z: 23, x: 660, y: 644, width: 500, height: 0, content: { type: plain, value: "In town center · from $160/night\nWalkable to dinner spots and the train" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.6 } }
      - { id: sect-2-title, type: text, z: 30, x: 120, y: 820, width: 1000, height: 0, content: { type: plain, value: "Dress code" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary } }
      - { id: sect-2-divider, type: rect, z: 31, x: 120, y: 880, width: 80, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: dress, type: text, z: 32, x: 120, y: 920, width: 1000, height: 0, content: { type: plain, value: "Garden formal" }, style: { font_family: $heading, font_size: 32, font_weight: 600, color: $text } }
      - { id: dress-body, type: text, z: 33, x: 120, y: 980, width: 1000, height: 0, content: { type: plain, value: "Long dresses, soft suits, no tuxedos required. The ceremony is on grass — please leave the stilettos at the hotel. We will be photographed against a sea of olive trees, so think cream, sage, terracotta, and dusty rose." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.7 } }
      - { id: sect-3-title, type: text, z: 40, x: 120, y: 1200, width: 1000, height: 0, content: { type: plain, value: "Getting there" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: $primary } }
      - { id: sect-3-divider, type: rect, z: 41, x: 120, y: 1260, width: 80, height: 1, fill: { type: solid, color: "$primary" } }
      - { id: travel-1, type: text, z: 42, x: 120, y: 1300, width: 1000, height: 0, content: { type: plain, value: "Fly to Venice Marco Polo (VCE) · 1h drive to Asolo." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.6 } }
      - { id: travel-2, type: text, z: 42, x: 120, y: 1340, width: 1000, height: 0, content: { type: plain, value: "Shuttles depart hotels at 4:00 PM, return at 11:30 PM." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.6 } }
      - { id: travel-3, type: text, z: 42, x: 120, y: 1380, width: 1000, height: 0, content: { type: plain, value: "Parking is limited — we strongly recommend the shuttles." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.6 } }
      - { id: site, type: text, z: 50, x: 80, y: 1540, width: 1080, height: 0, content: { type: plain, value: "all the details at elenaandtheo.com" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $primary, text_align: center } }
      - { id: page-num, type: text, z: 51, x: 80, y: 1640, width: 1080, height: 0, content: { type: plain, value: "iv" }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text_muted, text_align: center } }

slots:
  - { id: bride_name,  path: "pages[0].layers[7].content.value",  type: text, hint: "Bride name",     default: "Elena Marchetti" }
  - { id: groom_name,  path: "pages[0].layers[9].content.value",  type: text, hint: "Groom name",     default: "Theodore Hayward" }
