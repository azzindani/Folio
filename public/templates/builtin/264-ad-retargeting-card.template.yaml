_protocol: template/v1

# Retargeting ad 300×250 — abandoned-cart recovery.
# Hook line + product image + price comparison + BUY NOW CTA. Sunset-glow theme.
meta:
  id: tmpl-ad-retargeting-card
  name: Ad Retargeting Card
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [ad, retargeting, ecommerce, "300x250", rectangle, sunset]
  description: "Retargeting ad 300×250 with hook line, product image, price strikethrough comparison, and BUY NOW CTA."

document:
  width: 300
  height: 250
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 300
    height: 250
    fill: { type: solid, color: $background }
  - id: hook
    type: text
    z: 1
    x: 16
    y: 14
    width: 268
    height: 0
    content: { type: plain, value: "Still thinking about it?" }
    style:
      font_family: $heading
      font_size: 15
      font_weight: 800
      color: $primary
      letter_spacing: -0.01

  - id: product-frame
    type: rect
    z: 2
    x: 16
    y: 42
    width: 112
    height: 112
    radius: 10
    fill: { type: solid, color: $surface }
    stroke: { color: "$border", width: 1 }

  - id: product-icon
    type: text
    z: 3
    x: 16
    y: 80
    width: 112
    height: 0
    content: { type: plain, value: "👟" }
    style:
      font_family: $heading
      font_size: 44
      text_align: center

  - id: sale-badge
    type: rect
    z: 4
    x: 12
    y: 36
    width: 56
    height: 22
    radius: 11
    fill: { type: solid, color: "$primary" }

  - id: sale-badge-text
    type: text
    z: 5
    x: 12
    y: 41
    width: 56
    height: 0
    content: { type: plain, value: "-40%" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      letter_spacing: 0.04

  - id: product-name
    type: text
    z: 6
    x: 144
    y: 50
    width: 144
    height: 0
    content: { type: plain, value: "Drift Runner v3" }
    style:
      font_family: $heading
      font_size: 16
      font_weight: 800
      color: $text
      line_height: 1.15

  - id: product-meta
    type: text
    z: 7
    x: 144
    y: 78
    width: 144
    height: 0
    content: { type: plain, value: "Trail · UK 9 · Slate" }
    style:
      font_family: $body
      font_size: 11
      color: $text_muted

  - id: price-original
    type: text
    z: 8
    x: 144
    y: 104
    width: 144
    height: 0
    content: { type: plain, value: "~~£189~~" }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted
      text_decoration: line-through

  - id: price-sale
    type: text
    z: 9
    x: 144
    y: 124
    width: 144
    height: 0
    content: { type: plain, value: "£114" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: $primary
      letter_spacing: -0.02

  - id: cta-bg
    type: rect
    z: 10
    x: 16
    y: 178
    width: 268
    height: 52
    radius: 26
    fill: { type: solid, color: "$primary" }
    effects:
      shadow:
        - { dx: 0, dy: 6, blur: 16, color: "rgba(0,0,0,0.22)" }

  - id: cta-text
    type: text
    z: 11
    x: 16
    y: 196
    width: 268
    height: 0
    content: { type: plain, value: "BUY NOW — free returns" }
    style:
      font_family: $body
      font_size: 15
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      letter_spacing: 0.04

slots:
  - { id: product_name,   path: "layers[6].content.value",  type: text, hint: "Product name",       default: "Drift Runner v3" }
  - { id: original_price, path: "layers[8].content.value",  type: text, hint: "Original price (strikethrough)", default: "~~£189~~" }
  - { id: sale_price,     path: "layers[9].content.value",  type: text, hint: "Sale price",         default: "£114" }
  - { id: cta_label,      path: "layers[11].content.value", type: text, hint: "CTA label",          default: "BUY NOW — free returns" }
