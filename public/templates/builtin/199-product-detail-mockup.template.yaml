_protocol: template/v1

# E-commerce product detail — 1920×1080 landscape, light-clean theme.
# Image left, info right: name, rating, price, swatches, add-to-cart, tabs.
meta:
  id: tmpl-product-detail-mockup
  name: Product Detail Mockup
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, screen, ecommerce, product, landscape, light]
  description: "E-commerce product-detail mockup with image, rating, price, swatches, add-to-cart CTA, and description tabs."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Breadcrumb ────────────────────────────────────────────
  - id: crumbs
    type: text
    z: 5
    x: 80
    y: 60
    width: 1760
    height: 0
    content: { type: plain, value: "Home  /  Audio  /  Headphones  /  Aurora Wireless" }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted

  # ── Product image area (left half) ────────────────────────
  - id: img-bg
    type: rect
    z: 10
    x: 80
    y: 120
    width: 880
    height: 880
    radius: 24
    fill:
      type: linear
      angle: 145
      stops:
        - { color: "$surface", position: 0 }
        - { color: "$surface2", position: 100 }

  - id: img-shape
    type: circle
    z: 11
    cx: 520
    cy: 560
    rx: 280
    ry: 280
    fill: { type: solid, color: "$text" }
    opacity: 0.85

  - id: img-shape-2
    type: circle
    z: 12
    cx: 520
    cy: 560
    rx: 180
    ry: 180
    fill: { type: solid, color: "$primary" }

  - id: img-label
    type: text
    z: 13
    x: 80
    y: 920
    width: 880
    height: 0
    content: { type: plain, value: "1 of 6  ·  click to zoom" }
    style:
      font_family: $body
      font_size: 14
      color: $text_muted
      text_align: center

  # ── Right column — name + rating ──────────────────────────
  - id: brand-tag
    type: text
    z: 20
    x: 1020
    y: 120
    width: 820
    height: 0
    content: { type: plain, value: "SONICA AUDIO" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 800
      color: $primary
      letter_spacing: 0.3

  - id: prod-name
    type: text
    z: 21
    x: 1020
    y: 158
    width: 820
    height: 0
    content: { type: plain, value: "Aurora Wireless\nNoise-Cancelling Headphones" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 800
      color: $text
      line_height: 1.15
      letter_spacing: -0.02

  - id: star-row
    type: text
    z: 22
    x: 1020
    y: 320
    width: 820
    height: 0
    content: { type: plain, value: "★★★★★" }
    style:
      font_family: $body
      font_size: 22
      color: $accent

  - id: rating-text
    type: text
    z: 23
    x: 1170
    y: 326
    width: 670
    height: 0
    content: { type: plain, value: "4.7  ·  2,381 reviews" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted

  # ── Price ─────────────────────────────────────────────────
  - id: price
    type: text
    z: 30
    x: 1020
    y: 380
    width: 400
    height: 0
    content: { type: plain, value: "$249" }
    style:
      font_family: $heading
      font_size: 68
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.02

  - id: price-old
    type: text
    z: 31
    x: 1200
    y: 402
    width: 200
    height: 0
    content: { type: plain, value: "$329" }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted

  - id: save-pill
    type: rect
    z: 32
    x: 1320
    y: 396
    width: 140
    height: 32
    radius: 16
    fill: { type: solid, color: "rgba(16,185,129,0.18)" }

  - id: save-text
    type: text
    z: 33
    x: 1320
    y: 404
    width: 140
    height: 0
    content: { type: plain, value: "Save 24%" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $accent
      text_align: center

  # ── Color swatches ────────────────────────────────────────
  - id: sw-label
    type: text
    z: 40
    x: 1020
    y: 490
    width: 820
    height: 0
    content: { type: plain, value: "COLOR" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.3

  - id: sw-1
    type: circle
    z: 41
    cx: 1042
    cy: 540
    rx: 18
    ry: 18
    fill: { type: solid, color: "$text" }
    stroke: { color: "$primary", width: 3 }

  - id: sw-2
    type: circle
    z: 42
    cx: 1092
    cy: 540
    rx: 18
    ry: 18
    fill: { type: solid, color: "#E5E7EB" }
    stroke: { color: "$border", width: 1 }

  - id: sw-3
    type: circle
    z: 43
    cx: 1142
    cy: 540
    rx: 18
    ry: 18
    fill: { type: solid, color: "$primary" }
    stroke: { color: "$border", width: 1 }

  - id: sw-4
    type: circle
    z: 44
    cx: 1192
    cy: 540
    rx: 18
    ry: 18
    fill: { type: solid, color: "$secondary" }
    stroke: { color: "$border", width: 1 }

  # ── Size / variant chips ──────────────────────────────────
  - id: sz-label
    type: text
    z: 50
    x: 1020
    y: 590
    width: 820
    height: 0
    content: { type: plain, value: "SIZE" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.3

  - id: sz-1
    type: rect
    z: 51
    x: 1020
    y: 620
    width: 90
    height: 48
    radius: 8
    fill: { type: solid, color: "$text" }

  - id: sz-1-text
    type: text
    z: 52
    x: 1020
    y: 632
    width: 90
    height: 0
    content: { type: plain, value: "Std" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: $background
      text_align: center

  - id: sz-2
    type: rect
    z: 53
    x: 1130
    y: 620
    width: 90
    height: 48
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: sz-2-text
    type: text
    z: 54
    x: 1130
    y: 632
    width: 90
    height: 0
    content: { type: plain, value: "XL" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text
      text_align: center

  # ── Add to cart CTA ───────────────────────────────────────
  - id: atc-bg
    type: rect
    z: 60
    x: 1020
    y: 720
    width: 600
    height: 80
    radius: 12
    fill: { type: solid, color: "$primary" }

  - id: atc-text
    type: text
    z: 61
    x: 1020
    y: 744
    width: 600
    height: 0
    content: { type: plain, value: "Add to cart  —  $249" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

  - id: wish-bg
    type: rect
    z: 62
    x: 1640
    y: 720
    width: 200
    height: 80
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: wish-text
    type: text
    z: 63
    x: 1640
    y: 744
    width: 200
    height: 0
    content: { type: plain, value: "♡  Save" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text
      text_align: center

  # ── Tabs ──────────────────────────────────────────────────
  - id: tab-rule
    type: rect
    z: 70
    x: 1020
    y: 870
    width: 820
    height: 1
    fill: { type: solid, color: "$border" }

  - id: tab-1
    type: text
    z: 71
    x: 1020
    y: 890
    width: 200
    height: 0
    content: { type: plain, value: "Description" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: $primary

  - id: tab-2
    type: text
    z: 72
    x: 1240
    y: 890
    width: 160
    height: 0
    content: { type: plain, value: "Specs" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted

  - id: tab-3
    type: text
    z: 73
    x: 1400
    y: 890
    width: 200
    height: 0
    content: { type: plain, value: "Reviews (2,381)" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted

  - id: tab-body
    type: text
    z: 74
    x: 1020
    y: 940
    width: 820
    height: 0
    content: { type: plain, value: "40-hour battery, hybrid active noise cancellation, hi-res LDAC audio, and a memory-foam fit you'll forget you're wearing." }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.6

slots:
  - { id: product_name, path: "layers[8].content.value",  type: text, hint: "Product name (2 lines)", default: "Aurora Wireless\nNoise-Cancelling Headphones" }
  - { id: price,        path: "layers[11].content.value", type: text, hint: "Current price",          default: "$249" }
  - { id: rating,       path: "layers[9].content.value",  type: text, hint: "Star row",               default: "★★★★★" }
  - { id: review_count, path: "layers[10].content.value", type: text, hint: "Rating + reviews",       default: "4.7  ·  2,381 reviews" }
