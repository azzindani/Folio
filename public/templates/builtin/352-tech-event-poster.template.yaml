_protocol: template/v1

# Single-page LinkedIn poster — tech conference/meetup/workshop announcement.
# Hierarchy: eyebrow · event name · tagline · date block · speakers · benefits · CTA.
meta:
  id: tmpl-tech-event-poster
  name: Tech Event Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, event, conference, meetup, tech, portrait, 4-5]
  description: "Single-page LinkedIn poster for a tech conference or meetup: eyebrow, event name, tagline, date block, 3 speakers, benefits, and save-your-seat CTA."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: neon-bloom

layers:
  # 0: full-bleed background
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # 1: ambient accent glow (top-right)
  - id: accent-dot
    type: circle
    z: 4
    cx: 1080
    cy: 180
    rx: 80
    ry: 80
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.55

  # 2: top accent band
  - id: top-accent
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 10
    fill: { type: solid, color: "$primary" }

  # 3: eyebrow
  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 110
    width: 1040
    height: 0
    content: { type: plain, value: "DEV CONFERENCE" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  # 4: event name line 1
  - id: event-name-1
    type: text
    z: 21
    x: 80
    y: 180
    width: 1040
    height: 0
    content: { type: plain, value: "Folio Dev Day" }
    style:
      font_family: $heading
      font_size: 100
      font_weight: 900
      color: $text
      line_height: 0.95
      letter_spacing: -0.03

  # 5: event name line 2
  - id: event-name-2
    type: text
    z: 22
    x: 80
    y: 290
    width: 1040
    height: 0
    content: { type: plain, value: "2026" }
    style:
      font_family: $heading
      font_size: 100
      font_weight: 900
      color: $accent
      line_height: 0.95
      letter_spacing: -0.03

  # 6: tagline
  - id: tagline
    type: text
    z: 23
    x: 80
    y: 410
    width: 1040
    height: 0
    content: { type: plain, value: "A day with the people building the future of design tooling." }
    style:
      font_family: $body
      font_size: 30
      color: $text_muted
      line_height: 1.4

  # 7: date block bg
  - id: date-bg
    type: rect
    z: 30
    x: 80
    y: 500
    width: 1040
    height: 200
    fill: { type: solid, color: "$surface" }
    corner_radius: 12

  # 8: day number (big, left side of block)
  - id: date-day
    type: text
    z: 31
    x: 110
    y: 530
    width: 220
    height: 0
    content: { type: plain, value: "12" }
    style:
      font_family: $heading
      font_size: 72
      font_weight: 800
      color: $primary
      line_height: 1.0
      letter_spacing: -0.02

  # 9: month name
  - id: date-month
    type: text
    z: 31
    x: 110
    y: 620
    width: 220
    height: 0
    content: { type: plain, value: "June 2026" }
    style:
      font_family: $mono
      font_size: 20
      font_weight: 700
      color: $text
      line_height: 1.4

  # 10: vertical divider
  - id: date-divider
    type: rect
    z: 31
    x: 360
    y: 540
    width: 1
    height: 120
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.4

  # 11: time label
  - id: time-label
    type: text
    z: 31
    x: 400
    y: 540
    width: 360
    height: 0
    content: { type: plain, value: "TIME" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $accent
      letter_spacing: 0.28

  # 12: time value
  - id: time-value
    type: text
    z: 31
    x: 400
    y: 568
    width: 360
    height: 0
    content: { type: plain, value: "9:00 AM – 6:00 PM PT" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.4

  # 13: location label
  - id: loc-label
    type: text
    z: 31
    x: 400
    y: 620
    width: 360
    height: 0
    content: { type: plain, value: "WHERE" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $accent
      letter_spacing: 0.28

  # 14: location value
  - id: loc-value
    type: text
    z: 31
    x: 400
    y: 648
    width: 360
    height: 0
    content: { type: plain, value: "Online + SF" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.4

  # 15: format label (right side of block)
  - id: format-label
    type: text
    z: 31
    x: 820
    y: 540
    width: 280
    height: 0
    content: { type: plain, value: "FORMAT" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $accent
      letter_spacing: 0.28

  # 16: format value
  - id: format-value
    type: text
    z: 31
    x: 820
    y: 568
    width: 280
    height: 0
    content: { type: plain, value: "Hybrid · 3 tracks" }
    style:
      font_family: $mono
      font_size: 22
      font_weight: 700
      color: $text
      line_height: 1.4

  # 17: speakers section header
  - id: speakers-header
    type: text
    z: 40
    x: 80
    y: 750
    width: 1040
    height: 0
    content: { type: plain, value: "Featured speakers" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 800
      color: $heading
      letter_spacing: -0.01

  # SPEAKER 1 (x=80, w=320)
  # 18: avatar circle
  - id: spk-1-avatar
    type: circle
    z: 41
    cx: 240
    cy: 880
    rx: 60
    ry: 60
    fill: { type: solid, color: "$primary" }
  # 19: avatar initials
  - id: spk-1-initials
    type: text
    z: 42
    x: 180
    y: 860
    width: 120
    height: 0
    content: { type: plain, value: "AM" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $background
      text_align: center
  # 20: speaker name
  - id: spk-1-name
    type: text
    z: 42
    x: 80
    y: 960
    width: 320
    height: 0
    content: { type: plain, value: "Ada Miller" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text
      line_height: 1.3
      text_align: center
  # 21: speaker role
  - id: spk-1-role
    type: text
    z: 42
    x: 80
    y: 992
    width: 320
    height: 0
    content: { type: plain, value: "Principal Engineer · Folio" }
    style:
      font_family: $body
      font_size: 17
      color: $text_muted
      line_height: 1.4
      text_align: center

  # SPEAKER 2 (x=440, w=320)
  - id: spk-2-avatar
    type: circle
    z: 41
    cx: 600
    cy: 880
    rx: 60
    ry: 60
    fill: { type: solid, color: "$accent" }
  - id: spk-2-initials
    type: text
    z: 42
    x: 540
    y: 860
    width: 120
    height: 0
    content: { type: plain, value: "JR" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $background
      text_align: center
  - id: spk-2-name
    type: text
    z: 42
    x: 440
    y: 960
    width: 320
    height: 0
    content: { type: plain, value: "Jin Rao" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text
      line_height: 1.3
      text_align: center
  - id: spk-2-role
    type: text
    z: 42
    x: 440
    y: 992
    width: 320
    height: 0
    content: { type: plain, value: "Head of Design · Studio" }
    style:
      font_family: $body
      font_size: 17
      color: $text_muted
      line_height: 1.4
      text_align: center

  # SPEAKER 3 (x=800, w=320)
  - id: spk-3-avatar
    type: circle
    z: 41
    cx: 960
    cy: 880
    rx: 60
    ry: 60
    fill: { type: solid, color: "$primary" }
  - id: spk-3-initials
    type: text
    z: 42
    x: 900
    y: 860
    width: 120
    height: 0
    content: { type: plain, value: "SK" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $background
      text_align: center
  - id: spk-3-name
    type: text
    z: 42
    x: 800
    y: 960
    width: 320
    height: 0
    content: { type: plain, value: "Sara Kim" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text
      line_height: 1.3
      text_align: center
  - id: spk-3-role
    type: text
    z: 42
    x: 800
    y: 992
    width: 320
    height: 0
    content: { type: plain, value: "Developer Advocate · OSS" }
    style:
      font_family: $body
      font_size: 17
      color: $text_muted
      line_height: 1.4
      text_align: center

  # 30: benefits section header
  - id: benefits-header
    type: text
    z: 50
    x: 80
    y: 1080
    width: 1040
    height: 0
    content: { type: plain, value: "What you'll get" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 800
      color: $heading
      letter_spacing: -0.01

  # benefit 1
  # 31: checkmark icon
  - id: ben-1-check
    type: text
    z: 51
    x: 80
    y: 1132
    width: 32
    height: 0
    content: { type: plain, value: "✓" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: $primary
  # 32: benefit text
  - id: ben-1-text
    type: text
    z: 51
    x: 120
    y: 1132
    width: 1000
    height: 0
    content: { type: plain, value: "9 talks across 3 tracks" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  # benefit 2
  - id: ben-2-check
    type: text
    z: 51
    x: 80
    y: 1176
    width: 32
    height: 0
    content: { type: plain, value: "✓" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: $primary
  - id: ben-2-text
    type: text
    z: 51
    x: 120
    y: 1176
    width: 1000
    height: 0
    content: { type: plain, value: "Workshop materials" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  # benefit 3
  - id: ben-3-check
    type: text
    z: 51
    x: 80
    y: 1220
    width: 32
    height: 0
    content: { type: plain, value: "✓" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: $primary
  - id: ben-3-text
    type: text
    z: 51
    x: 120
    y: 1220
    width: 1000
    height: 0
    content: { type: plain, value: "Recorded sessions" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.4

  # 37: CTA chip bg
  - id: cta-bg
    type: rect
    z: 60
    x: 80
    y: 1320
    width: 380
    height: 80
    fill: { type: solid, color: "$primary" }
    corner_radius: 12

  # 38: CTA text
  - id: cta-text
    type: text
    z: 61
    x: 80
    y: 1344
    width: 380
    height: 80
    content: { type: plain, value: "Save your seat →" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 800
      color: "#FFFFFF"
      text_align: center

  # 39: event URL
  - id: event-url
    type: text
    z: 61
    x: 80
    y: 1420
    width: 600
    height: 0
    content: { type: plain, value: "folio.dev/dev-day-2026" }
    style:
      font_family: $mono
      font_size: 18
      color: $text_muted

  # 40: organizer handle
  - id: organizer
    type: text
    z: 61
    x: 700
    y: 1350
    width: 420
    height: 0
    content: { type: plain, value: "@folio_team · Hosted by Folio" }
    style:
      font_family: $mono
      font_size: 18
      color: $text
      line_height: 1.4
      text_align: right

animations:
  event-name-1:
    enter: { type: scale_in, duration: 800, delay: 100 }
  event-name-2:
    enter: { type: scale_in, duration: 800, delay: 200 }
  date-bg:
    enter: { type: fade_up, duration: 600, delay: 400 }
  spk-1-avatar:
    enter: { type: fade_up, duration: 600, delay: 700 }
  spk-2-avatar:
    enter: { type: fade_up, duration: 600, delay: 850 }
  spk-3-avatar:
    enter: { type: fade_up, duration: 600, delay: 1000 }
  cta-bg:
    loop: { type: pulse, duration: 2400, scale: 1.04 }
  accent-dot:
    loop: { type: glow, duration: 2200, color: $primary }

slots:
  - { id: eyebrow,        path: "layers[3].content.value",  type: text, hint: "Eyebrow",            default: "DEV CONFERENCE" }
  - { id: event_name_1,   path: "layers[4].content.value",  type: text, hint: "Event name line 1",  default: "Folio Dev Day" }
  - { id: event_name_2,   path: "layers[5].content.value",  type: text, hint: "Event name line 2",  default: "2026" }
  - { id: tagline,        path: "layers[6].content.value",  type: text, hint: "Tagline",            default: "A day with the people building the future of design tooling." }
  - { id: date_day,       path: "layers[8].content.value",  type: text, hint: "Day number",         default: "12" }
  - { id: date_month,     path: "layers[9].content.value",  type: text, hint: "Month + year",       default: "June 2026" }
  - { id: time_value,     path: "layers[12].content.value", type: text, hint: "Event time",         default: "9:00 AM – 6:00 PM PT" }
  - { id: loc_value,      path: "layers[14].content.value", type: text, hint: "Location",           default: "Online + SF" }
  - { id: format_value,   path: "layers[16].content.value", type: text, hint: "Format / tracks",    default: "Hybrid · 3 tracks" }
  - { id: spk_1_name,     path: "layers[20].content.value", type: text, hint: "Speaker 1 name",     default: "Ada Miller" }
  - { id: spk_1_role,     path: "layers[21].content.value", type: text, hint: "Speaker 1 role",     default: "Principal Engineer · Folio" }
  - { id: spk_2_name,     path: "layers[24].content.value", type: text, hint: "Speaker 2 name",     default: "Jin Rao" }
  - { id: spk_2_role,     path: "layers[25].content.value", type: text, hint: "Speaker 2 role",     default: "Head of Design · Studio" }
  - { id: spk_3_name,     path: "layers[28].content.value", type: text, hint: "Speaker 3 name",     default: "Sara Kim" }
  - { id: spk_3_role,     path: "layers[29].content.value", type: text, hint: "Speaker 3 role",     default: "Developer Advocate · OSS" }
  - { id: event_url,      path: "layers[39].content.value", type: text, hint: "Event URL",          default: "folio.dev/dev-day-2026" }
