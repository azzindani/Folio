    y: 290
    width: 960
    height: 0
    content: { type: plain, value: "live rankings · updated every 5 minutes" }
    style:
      font_family: $body
      font_size: 16
      font_style: italic
      color: "$text_muted"
      text_align: center
      line_height: 1.3

  # ── Column header strip ──────────────────────────────────
