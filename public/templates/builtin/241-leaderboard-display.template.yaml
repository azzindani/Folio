_protocol: template/v1

# Gaming leaderboard — 1080×1920 portrait, dark-tech theme.
# TOP 10 ranking rows with rank · player · score · change.
# Gold/silver/bronze color for top 3.
meta:
  id: tmpl-leaderboard-display
  name: Leaderboard Display
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [leaderboard, gaming, contest, ranking, dark, portrait]
  description: "Top-10 gaming/contest leaderboard with player rows, scores, change indicators, and gold/silver/bronze tier colors."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  - id: bg-glow
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1080
    height: 400
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$background", position: 100 }
    opacity: 0.2

  # ── Header ────────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 130
    width: 960
    height: 0
    content: { type: plain, value: "STRIKEFORCE CHAMPIONSHIP · SEASON 7" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$accent"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: title
    type: text
    z: 11
    x: 60
    y: 175
    width: 960
    height: 0
    content: { type: plain, value: "TOP 10" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 900
      color: "$text"
      text_align: center
      line_height: 1
      letter_spacing: 0.04

  - id: subtitle
    type: text
    z: 12
