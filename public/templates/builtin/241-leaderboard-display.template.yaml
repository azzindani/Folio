    z: 250
    x: 40
    y: 1660
    width: 1000
    height: 1
    fill: { type: solid, color: "$accent" }
    opacity: 0.5

  - id: footer-end-label
    type: text
    z: 251
    x: 60
    y: 1700
    width: 960
    height: 0
    content: { type: plain, value: "CONTEST ENDS IN" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: footer-end-time
    type: text
    z: 252
    x: 60
    y: 1740
    width: 960
    height: 0
    content: { type: plain, value: "23 : 14 : 08" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: "$primary"
      text_align: center
      line_height: 1.1
      letter_spacing: 0.05

  - id: footer-name
    type: text
    z: 253
    x: 60
    y: 1840
    width: 960
    height: 0
    content: { type: plain, value: "live at strikeforce.gg/leaderboard" }
    style:
      font_family: $body
      font_size: 14
      color: "$text_muted"
      text_align: center
      line_height: 1.3

slots:
  - { id: contest_name, path: "layers[2].content.value",   type: text, hint: "Contest name eyebrow", default: "STRIKEFORCE CHAMPIONSHIP · SEASON 7" }
  - { id: end_time,     path: "layers[64].content.value", type: text, hint: "Contest end countdown", default: "23 : 14 : 08" }
