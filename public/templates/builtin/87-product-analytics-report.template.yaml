_protocol: template/v1

# Product analytics — DAU/WAU/MAU/Stickiness KPIs, feature adoption table,
# retention cohort chart, top user flows table, WAU by region area chart.
meta:
  id: tmpl-product-analytics-report
  name: Product Analytics
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, product, analytics, retention, engagement, interactive]
  description: "Product usage report: DAU/WAU/MAU, feature adoption, retention curve, top flows, regional engagement."

document:
  width: 1280
  height: 2100
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

report:
  layout: scroll
  data:
    sources:
      - id: features
        type: inline
        rows:
          - { feature: Dashboard Home,         adoption: 92.4, growth:   3.8, dau:  84200 }
          - { feature: Quick Search,           adoption: 78.6, growth:  12.4, dau:  71600 }
          - { feature: Saved Views,            adoption: 64.2, growth:  18.6, dau:  58400 }
          - { feature: Collaboration Comments, adoption: 52.8, growth:  24.2, dau:  48100 }
          - { feature: Export to CSV,          adoption: 48.4, growth:   2.6, dau:  44100 }
          - { feature: Slack Integration,      adoption: 38.2, growth:  31.8, dau:  34800 }
          - { feature: Custom Dashboards,      adoption: 32.6, growth:  16.4, dau:  29700 }
          - { feature: API Access,             adoption: 24.8, growth:  42.6, dau:  22600 }
          - { feature: SAML SSO,               adoption: 18.4, growth:   8.2, dau:  16800 }
          - { feature: Audit Logs,             adoption: 12.6, growth:  -4.8, dau:  11500 }
      - id: retention_curve
        type: inline
        rows:
          - { week: W0,  retained: 100.0 }
          - { week: W1,  retained:  68.4 }
          - { week: W2,  retained:  54.2 }
          - { week: W3,  retained:  46.8 }
          - { week: W4,  retained:  42.4 }
          - { week: W6,  retained:  37.8 }
          - { week: W8,  retained:  34.6 }
          - { week: W12, retained:  31.2 }
          - { week: W16, retained:  29.4 }
          - { week: W20, retained:  28.1 }
          - { week: W24, retained:  27.4 }
      - id: flows
        type: inline
        rows:
          - { flow: Sign-in → Dashboard → Saved View,             entries: 142800, completions: 128400, drop_rate:  10.1 }
          - { flow: Search → Open Record → Edit,                  entries:  98400, completions:  74200, drop_rate:  24.6 }
          - { flow: Onboarding → Connect Source → First Insight,  entries:  18600, completions:  11240, drop_rate:  39.6 }
          - { flow: Notification → Comment → Reply,               entries:  64200, completions:  48700, drop_rate:  24.1 }
          - { flow: Dashboard → Export → Download,                entries:  42800, completions:  38600, drop_rate:   9.8 }
          - { flow: Settings → Invite → Accept,                   entries:  12400, completions:   7820, drop_rate:  36.9 }
          - { flow: Trial Banner → Pricing → Upgrade,             entries:   8240, completions:   1124, drop_rate:  86.4 }
          - { flow: API Docs → Token Create → First Call,         entries:  14200, completions:   8460, drop_rate:  40.4 }
      - id: regional_wau
        type: inline
        rows:
          - { week: W1,  north_america: 184200, europe: 102400, apac:  58400, latam: 18600 }
          - { week: W2,  north_america: 192600, europe: 108200, apac:  62800, latam: 19400 }
          - { week: W3,  north_america: 201400, europe: 114600, apac:  66200, latam: 20800 }
          - { week: W4,  north_america: 208800, europe: 118400, apac:  68400, latam: 21200 }
          - { week: W5,  north_america: 214600, europe: 121800, apac:  71800, latam: 22400 }
          - { week: W6,  north_america: 221200, europe: 124200, apac:  74200, latam: 22900 }
          - { week: W7,  north_america: 228400, europe: 128600, apac:  76800, latam: 23800 }
          - { week: W8,  north_america: 234800, europe: 132400, apac:  78200, latam: 24600 }
          - { week: W9,  north_america: 241200, europe: 136800, apac:  81400, latam: 25400 }
          - { week: W10, north_america: 248600, europe: 141200, apac:  83800, latam: 26200 }
          - { week: W11, north_america: 256400, europe: 146400, apac:  86200, latam: 27400 }
          - { week: W12, north_america: 264800, europe: 152600, apac:  88600, latam: 28600 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "PRODUCT TEAM · WEEK 12 SNAPSHOT · GLOBAL"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 80
        format: markdown
        font_family: Playfair Display
        font_size: 44
        font_weight: 700
        line_height: 1.1
        content: "**Product Analytics Review**"

      - id: kpi-dau
        type: kpi_card
        x: 60
        y: 180
        width: 280
        height: 140
        label: Daily Active Users
        value: 91200
        format: number
        delta: 14.2
        delta_format: percent

      - id: kpi-wau
        type: kpi_card
        x: 360
        y: 180
        width: 280
        height: 140
        label: Weekly Active Users
        value: 528600
        format: number
        delta: 11.8
        delta_format: percent

      - id: kpi-mau
        type: kpi_card
        x: 660
        y: 180
        width: 280
        height: 140
        label: Monthly Active Users
        value: 1284600
        format: number
        delta: 8.6
        delta_format: percent

      - id: kpi-stickiness
        type: kpi_card
        x: 960
        y: 180
        width: 260
        height: 140
        label: Stickiness (DAU/MAU)
        value: 7.1
        format: percent
        delta: 0.4
        delta_format: percent

      - id: section-features
        type: rich_text
        x: 60
        y: 360
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Feature Adoption**"

      - id: tbl-features
        type: interactive_table
        x: 60
        y: 420
        width: 1160
        height: 500
        data_ref: features
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: feature,   title: Feature,    width: 320, sortable: true }
          - { field: adoption,  title: Adoption %, width: 200, sortable: true, formatter: percent, align: right }
          - { field: growth,    title: WoW Growth, width: 200, sortable: true, formatter: delta,   align: right }
          - { field: dau,       title: DAU,        width: 200, sortable: true, formatter: number,  align: right }

      - id: section-retention
        type: rich_text
        x: 60
        y: 960
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Retention Curve**"

      - id: chart-retention
        type: interactive_chart
        x: 60
        y: 1020
        width: 1160
        height: 360
        chart_type: line
        data_ref: retention_curve
        x_field: week
        y_field: retained
        title: Cohort Retention — % of W0 Users Active
        legend: false
        grid: true
        animate: true

      - id: section-flows
        type: rich_text
        x: 60
        y: 1420
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top User Flows**"

      - id: tbl-flows
        type: interactive_table
        x: 60
        y: 1480
        width: 1160
        height: 420
        data_ref: flows
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: flow,        title: Flow (Entry → Action → Exit), width: 520, sortable: true }
          - { field: entries,     title: Entries,                      width: 180, sortable: true, formatter: number, align: right }
          - { field: completions, title: Completions,                  width: 180, sortable: true, formatter: number, align: right }
          - { field: drop_rate,   title: Drop %,                       width: 160, sortable: true, formatter: percent, align: right }

      - id: section-regional
        type: rich_text
        x: 60
        y: 1940
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Weekly Active Users by Region**"

      - id: chart-regional
        type: interactive_chart
        x: 60
        y: 2000
        width: 1160
        height: 360
        chart_type: area
        data_ref: regional_wau
        x_field: week
        y_field: north_america
        title: WAU by Region — Last 12 Weeks
        legend: true
        grid: true
        animate: true

slots:
  - { id: report_title,     path: "pages[0].layers[1].content",  type: text, hint: "Report title",      default: "**Product Analytics Review**" }
  - { id: report_eyebrow,   path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",      default: "PRODUCT TEAM · WEEK 12 SNAPSHOT · GLOBAL" }
  - { id: features_section, path: "pages[0].layers[6].content",  type: text, hint: "Features heading", default: "**Feature Adoption**" }
  - { id: retention_section, path: "pages[0].layers[8].content", type: text, hint: "Retention heading", default: "**Retention Curve**" }
  - { id: flows_section,    path: "pages[0].layers[10].content", type: text, hint: "Flows heading",    default: "**Top User Flows**" }
  - { id: regional_section, path: "pages[0].layers[12].content", type: text, hint: "Regional heading", default: "**Weekly Active Users by Region**" }
