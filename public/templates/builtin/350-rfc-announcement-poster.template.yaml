_protocol: template/v1

# Single-page LinkedIn poster — Tech RFC / design-doc announcement.
# Status chips, problem, proposal, timeline mini-table, open questions.
meta:
  id: tmpl-rfc-announcement-poster
  name: RFC Announcement Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, rfc, design-doc, engineering, announcement, portrait, 4-5]
  description: "Single-page LinkedIn poster announcing a technical RFC / design doc — status chips, problem, proposal, timeline, open questions."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 14
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 90
    width: 1040
    height: 0
    content: { type: plain, value: "RFC 0023" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: rfc-title
    type: text
    z: 11
    x: 80
    y: 140
    width: 1040
    height: 0
    content: { type: plain, value: "Replacing Session Auth\nwith JWT" }
    style:
      font_family: $heading
      font_size: 88
      font_weight: 800
      color: $text
      line_height: 1.04
      letter_spacing: -0.025

  - id: chip-status-bg
    type: rect
    z: 9
    x: 80
    y: 380
    width: 200
    height: 48
    fill: { type: solid, color: "$primary" }
    radius: 24

  - id: chip-status-text
    type: text
    z: 14
    x: 80
    y: 396
    width: 200
    height: 0
    content: { type: plain, value: "Status: Open" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $background
      text_align: center
      letter_spacing: 0.12

  - id: chip-authors-bg
    type: rect
    z: 9
    x: 300
    y: 380
    width: 180
    height: 48
    fill: { type: solid, color: "$surface" }
    radius: 24

  - id: chip-authors-text
    type: text
    z: 15
    x: 300
    y: 396
    width: 180
    height: 0
    content: { type: plain, value: "Authors: 3" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.12

  - id: chip-comments-bg
    type: rect
    z: 9
    x: 500
    y: 380
    width: 200
    height: 48
    fill: { type: solid, color: "$surface" }
    radius: 24

  - id: chip-comments-text
    type: text
    z: 16
    x: 500
    y: 396
    width: 200
    height: 0
    content: { type: plain, value: "Comments: 17" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.12

  - id: problem-label
    type: text
    z: 17
    x: 80
    y: 470
    width: 1040
    height: 0
    content: { type: plain, value: "PROBLEM" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: problem-text
    type: text
    z: 18
    x: 80
    y: 504
    width: 1040
    height: 0
    content: { type: plain, value: "Session auth stores state server-side, forcing every service to hit Redis on each request. This caps horizontal scale and adds 8ms p50 latency across the request path. New mobile clients also need offline-friendly tokens." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.45

  - id: proposal-label
    type: text
    z: 19
    x: 80
    y: 660
    width: 1040
    height: 0
    content: { type: plain, value: "PROPOSAL" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.32
      text_transform: uppercase

  - id: proposal-bullet-1
    type: text
    z: 20
    x: 80
    y: 696
    width: 1040
    height: 0
    content: { type: plain, value: "•  Issue short-lived JWTs (15min) signed with rotating EdDSA keys." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.45

  - id: proposal-bullet-2
    type: text
    z: 21
    x: 80
    y: 740
    width: 1040
    height: 0
    content: { type: plain, value: "•  Refresh tokens stored in HTTP-only cookies, rotated on use." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.45

  - id: proposal-bullet-3
    type: text
    z: 22
    x: 80
    y: 784
    width: 1040
    height: 0
    content: { type: plain, value: "•  Drop Redis dependency from edge auth path entirely." }
    style:
      font_family: $body
      font_size: 24
      color: $text
      line_height: 1.45

  - id: timeline-card
    type: rect
    z: 8
    x: 80
    y: 850
    width: 1040
    height: 290
    fill: { type: solid, color: "$surface" }
    radius: 12

  - id: timeline-label
    type: text
    z: 23
    x: 108
    y: 878
    width: 984
    height: 0
    content: { type: plain, value: "TIMELINE" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: row-1-phase
    type: text
    z: 24
    x: 108
    y: 922
    width: 300
    height: 0
    content: { type: plain, value: "Discussion" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text
      letter_spacing: 0.08

  - id: row-1-dates
    type: text
    z: 25
    x: 480
    y: 922
    width: 612
    height: 0
    content: { type: plain, value: "2025-04-12 → 2025-04-26" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      line_height: 1.3

  - id: row-2-bg
    type: rect
    z: 9
    x: 92
    y: 968
    width: 1016
    height: 44
    fill: { type: solid, color: "$primary" }
    opacity: 0.18
    radius: 6

  - id: row-2-phase
    type: text
    z: 26
    x: 108
    y: 976
    width: 300
    height: 0
    content: { type: plain, value: "Prototype  ●" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.08

  - id: row-2-dates
    type: text
    z: 27
    x: 480
    y: 976
    width: 612
    height: 0
    content: { type: plain, value: "2025-04-27 → 2025-05-10" }
    style:
      font_family: $body
      font_size: 20
      color: $text
      line_height: 1.3

  - id: row-3-phase
    type: text
    z: 28
    x: 108
    y: 1030
    width: 300
    height: 0
    content: { type: plain, value: "Migration" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text
      letter_spacing: 0.08

  - id: row-3-dates
    type: text
    z: 29
    x: 480
    y: 1030
    width: 612
    height: 0
    content: { type: plain, value: "2025-05-11 → 2025-06-15" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      line_height: 1.3

  - id: row-4-phase
    type: text
    z: 30
    x: 108
    y: 1084
    width: 300
    height: 0
    content: { type: plain, value: "GA" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text
      letter_spacing: 0.08

  - id: row-4-dates
    type: text
    z: 31
    x: 480
    y: 1084
    width: 612
    height: 0
    content: { type: plain, value: "2025-06-16" }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      line_height: 1.3

  - id: questions-label
    type: text
    z: 32
    x: 80
    y: 1180
    width: 1040
    height: 0
    content: { type: plain, value: "OPEN QUESTIONS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.32
      text_transform: uppercase

  - id: question-1
    type: text
    z: 33
    x: 80
    y: 1216
    width: 1040
    height: 0
    content: { type: plain, value: "•  How do we revoke a leaked JWT before its 15min expiry?" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.45

  - id: question-2
    type: text
    z: 34
    x: 80
    y: 1256
    width: 1040
    height: 0
    content: { type: plain, value: "•  Do we keep session auth as a fallback for legacy admin tools?" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.45

  - id: footer-rule
    type: rect
    z: 4
    x: 80
    y: 1340
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.4

  - id: discussion-link
    type: text
    z: 35
    x: 80
    y: 1370
    width: 600
    height: 0
    content: { type: plain, value: "rfcs.internal/0023-jwt-auth" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary

  - id: cta-bg
    type: rect
    z: 9
    x: 80
    y: 1410
    width: 220
    height: 44
    fill: { type: solid, color: "$primary" }
    radius: 22

  - id: cta-text
    type: text
    z: 36
    x: 80
    y: 1424
    width: 220
    height: 0
    content: { type: plain, value: "Add comment →" }
    style:
      font_family: $mono
      font_size: 15
      font_weight: 700
      color: $background
      text_align: center
      letter_spacing: 0.12

  - id: handle
    type: text
    z: 37
    x: 620
    y: 1422
    width: 500
    height: 0
    content: { type: plain, value: "@platform.eng · folio.design" }
    style:
      font_family: $mono
      font_size: 16
      color: $text_muted
      text_align: right

animations:
  rfc-title:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  eyebrow:
    enter: { type: fade_down, duration: 400, delay: 50, easing: ease-out }
  chip-status-bg:
    enter: { type: fade_up, duration: 400, delay: 350, easing: ease-out }
  chip-status-text:
    enter: { type: fade_up, duration: 400, delay: 350, easing: ease-out }
  chip-authors-bg:
    enter: { type: fade_up, duration: 400, delay: 450, easing: ease-out }
  chip-authors-text:
    enter: { type: fade_up, duration: 400, delay: 450, easing: ease-out }
  chip-comments-bg:
    enter: { type: fade_up, duration: 400, delay: 550, easing: ease-out }
  chip-comments-text:
    enter: { type: fade_up, duration: 400, delay: 550, easing: ease-out }
  row-1-phase:
    enter: { type: slide_right, duration: 500, delay: 800, easing: ease-out }
  row-1-dates:
    enter: { type: slide_right, duration: 500, delay: 800, easing: ease-out }
  row-2-phase:
    enter: { type: slide_right, duration: 500, delay: 900, easing: ease-out }
  row-2-dates:
    enter: { type: slide_right, duration: 500, delay: 900, easing: ease-out }
  row-3-phase:
    enter: { type: slide_right, duration: 500, delay: 1000, easing: ease-out }
  row-3-dates:
    enter: { type: slide_right, duration: 500, delay: 1000, easing: ease-out }
  row-4-phase:
    enter: { type: slide_right, duration: 500, delay: 1100, easing: ease-out }
  row-4-dates:
    enter: { type: slide_right, duration: 500, delay: 1100, easing: ease-out }
  row-2-bg:
    loop: { type: pulse, duration: 2400, scale: 1.02 }

slots:
  - { id: eyebrow,         path: "layers[2].content.value",  type: text, hint: "RFC number eyebrow",      default: "RFC 0023" }
  - { id: rfc_title,       path: "layers[3].content.value",  type: text, hint: "RFC title (2 lines)",     default: "Replacing Session Auth\nwith JWT" }
  - { id: chip_status,     path: "layers[5].content.value",  type: text, hint: "Status chip",             default: "Status: Open" }
  - { id: chip_authors,    path: "layers[7].content.value",  type: text, hint: "Authors chip",            default: "Authors: 3" }
  - { id: chip_comments,   path: "layers[9].content.value",  type: text, hint: "Comments chip",           default: "Comments: 17" }
  - { id: problem,         path: "layers[11].content.value", type: text, hint: "Problem paragraph",       default: "Session auth stores state server-side, forcing every service to hit Redis on each request. This caps horizontal scale and adds 8ms p50 latency across the request path. New mobile clients also need offline-friendly tokens." }
  - { id: proposal_1,      path: "layers[13].content.value", type: text, hint: "Proposal bullet 1",       default: "•  Issue short-lived JWTs (15min) signed with rotating EdDSA keys." }
  - { id: proposal_2,      path: "layers[14].content.value", type: text, hint: "Proposal bullet 2",       default: "•  Refresh tokens stored in HTTP-only cookies, rotated on use." }
  - { id: proposal_3,      path: "layers[15].content.value", type: text, hint: "Proposal bullet 3",       default: "•  Drop Redis dependency from edge auth path entirely." }
  - { id: row_1_dates,     path: "layers[19].content.value", type: text, hint: "Discussion date range",   default: "2025-04-12 → 2025-04-26" }
  - { id: row_2_dates,     path: "layers[22].content.value", type: text, hint: "Prototype date range",    default: "2025-04-27 → 2025-05-10" }
  - { id: row_3_dates,     path: "layers[24].content.value", type: text, hint: "Migration date range",    default: "2025-05-11 → 2025-06-15" }
  - { id: row_4_dates,     path: "layers[26].content.value", type: text, hint: "GA date",                 default: "2025-06-16" }
  - { id: question_1,      path: "layers[28].content.value", type: text, hint: "Open question 1",         default: "•  How do we revoke a leaked JWT before its 15min expiry?" }
  - { id: question_2,      path: "layers[29].content.value", type: text, hint: "Open question 2",         default: "•  Do we keep session auth as a fallback for legacy admin tools?" }
  - { id: discussion_link, path: "layers[31].content.value", type: text, hint: "Discussion thread link",  default: "rfcs.internal/0023-jwt-auth" }
  - { id: handle,          path: "layers[34].content.value", type: text, hint: "Author handle",           default: "@platform.eng · folio.design" }
