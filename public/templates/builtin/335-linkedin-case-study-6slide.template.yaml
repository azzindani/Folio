      - id: body-1
        type: text
        z: 13
        x: 80
        y: 340
        width: 920
        height: 0
        content: { type: plain, value: "Acme Corp is a B2B SaaS platform serving mid-market operations teams across North America. Founded in 2017, they sell a workflow automation suite priced per seat, with annual contracts." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - id: body-2
        type: text
        z: 14
        x: 80
        y: 580
        width: 920
        height: 0
        content: { type: plain, value: "By Q4 2025 they had crossed 1,200 customers and $18M ARR, but their net revenue retention had slipped under 95% — a red flag for any growth-stage SaaS." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5 }
      - { id: stat-card-1, type: rect, z: 5, x: 80, y: 880, width: 293, height: 220, radius: 12, fill: { type: solid, color: "$surface" } }
