        z: 16
        x: 80
        y: 1130
        width: 920
        height: 0
        content: { type: plain, value: "@yourcompany · yourdomain.com" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: counter
        type: text
        z: 30
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "6/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

slots:
  - { id: cover_headline,    path: "pages[0].layers[5].content.value",  type: text, hint: "Cover result headline",     default: "How Acme cut churn 38% in 90 days" }
  - { id: cover_caption,     path: "pages[0].layers[6].content.value",  type: text, hint: "Client + industry caption", default: "Acme Corp · B2B SaaS · 250 employees" }
  - { id: context_body_1,    path: "pages[1].layers[4].content.value",  type: text, hint: "Context paragraph 1",       default: "Acme Corp is a B2B SaaS platform serving mid-market operations teams across North America. Founded in 2017, they sell a workflow automation suite priced per seat, with annual contracts." }
  - { id: context_body_2,    path: "pages[1].layers[5].content.value",  type: text, hint: "Context paragraph 2",       default: "By Q4 2025 they had crossed 1,200 customers and $18M ARR, but their net revenue retention had slipped under 95% — a red flag for any growth-stage SaaS." }
  - { id: challenge_headline,path: "pages[2].layers[3].content.value",  type: text, hint: "Challenge headline",        default: "Why churn was killing growth" }
  - { id: approach_headline, path: "pages[3].layers[3].content.value",  type: text, hint: "Approach headline",         default: "Our 3-step intervention" }
  - { id: result_metric,     path: "pages[4].layers[3].content.value",  type: text, hint: "Headline result metric",    default: "38%" }
  - { id: cta_quote,         path: "pages[5].layers[3].content.value",  type: text, hint: "Pull-quote from stakeholder",default: "We finally have a single view of customer health — and the playbook to act on it before renewal." }
