        style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.5 }
      - { id: card-2, type: rect, z: 5, x: 80, y: 640, width: 920, height: 240, radius: 12, fill: { type: solid, color: "$surface" } }
      - id: step-2-num
        type: text
        z: 20
        x: 110
        y: 670
        width: 80
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, letter_spacing: -0.02 }
      - id: step-2-title
        type: text
        z: 21
        x: 220
        y: 680
        width: 760
        height: 0
        content: { type: plain, value: "Segmented the CS book" }
        style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 }
      - id: step-2-body
        type: text
        z: 22
        x: 220
        y: 740
        width: 760
        height: 0
        content: { type: plain, value: "Split accounts by ARR tier. High-touch CSMs on top 20%, pooled motion on the long tail." }
        style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.5 }
      - { id: card-3, type: rect, z: 5, x: 80, y: 900, width: 920, height: 240, radius: 12, fill: { type: solid, color: "$surface" } }
      - id: step-3-num
        type: text
        z: 20
        x: 110
        y: 930
        width: 80
        height: 0
        content: { type: plain, value: "03" }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, letter_spacing: -0.02 }
      - id: step-3-title
        type: text
        z: 21
        x: 220
        y: 940
        width: 760
        height: 0
        content: { type: plain, value: "Unified health score" }
