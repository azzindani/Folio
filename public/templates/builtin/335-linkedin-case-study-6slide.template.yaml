      - id: big-metric
        type: text
        z: 12
        x: 80
        y: 360
        width: 920
        height: 0
        content: { type: plain, value: "38%" }
        style: { font_family: $heading, font_size: 240, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.05, text_align: center }
      - id: metric-caption
        type: text
        z: 13
        x: 80
        y: 680
        width: 920
        height: 0
        content: { type: plain, value: "drop in gross churn over 90 days" }
        style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text, line_height: 1.3, text_align: center }
      - id: divider
        type: rect
