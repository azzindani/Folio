      - { id: bullet-1-dot, type: rect, z: 20, x: 80, y: 460, width: 14, height: 14, radius: 2, fill: { type: solid, color: "$accent" } }
      - id: bullet-1-text
        type: text
        z: 21
        x: 130
        y: 450
        width: 870
        height: 0
        content: { type: plain, value: "Onboarding stalled at week two — only 41% of new accounts reached the activation milestone." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - { id: bullet-2-dot, type: rect, z: 20, x: 80, y: 720, width: 14, height: 14, radius: 2, fill: { type: solid, color: "$accent" } }
      - id: bullet-2-text
        type: text
        z: 22
        x: 130
        y: 710
        width: 870
        height: 0
        content: { type: plain, value: "CS owned a 1:120 book and could only triage tickets, not drive expansion." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - { id: bullet-3-dot, type: rect, z: 20, x: 80, y: 980, width: 14, height: 14, radius: 2, fill: { type: solid, color: "$accent" } }
      - id: bullet-3-text
        type: text
        z: 23
        x: 130
        y: 970
        width: 870
        height: 0
        content: { type: plain, value: "Health-score signals lived in three tools — nobody had one view of risk." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: counter
        type: text
        z: 30
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "3/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

