_protocol: template/v1

# 6-slide LinkedIn case study carousel — Cover / Context / Challenge / Approach / Result / CTA.
# Portrait 1080×1350 (LinkedIn 4:5), corporate-slate theme for B2B credibility.
meta:
  id: tmpl-linkedin-case-study-6slide
  name: LinkedIn Case Study (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [linkedin, carousel, document, social, portrait, case-study, b2b, 4-5]
  description: "B2B case-study carousel for LinkedIn. 6 portrait slides walking through client context, challenge, approach, headline result, and CTA. Designed for account managers, founders, and consultants to publish proof-driven posts."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: logo-rect, type: rect, z: 2, x: 80, y: 120, width: 220, height: 80, radius: 8, fill: { type: solid, color: "$surface" }, stroke: { color: "$text_muted", width: 1 }, opacity: 0.3 }
      - id: logo-label
        type: text
        z: 3
        x: 80
        y: 142
        width: 220
        height: 0
        opacity: 0.3
        content: { type: plain, value: "Client logo" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, letter_spacing: 0.18, text_align: center, text_transform: uppercase }
      - id: eyebrow
        type: text
        z: 11
        x: 80
        y: 360
        width: 920
        height: 0
        content: { type: plain, value: "CASE STUDY" }
        style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: headline
        type: text
        z: 12
        x: 80
        y: 420
        width: 920
        height: 0
        content: { type: plain, value: "How Acme cut churn 38% in 90 days" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: caption
        type: text
        z: 13
        x: 80
        y: 880
        width: 920
        height: 0
        content: { type: plain, value: "Acme Corp · B2B SaaS · 250 employees" }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.4 }
      - id: divider
        type: rect
        z: 5
        x: 80
        y: 960
        width: 120
        height: 4
        fill: { type: solid, color: "$accent" }
      - id: counter
        type: text
        z: 14
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "1/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Context ──────────────────────────────────────
  - id: context
