      - { id: stat-card-2, type: rect, z: 5, x: 393, y: 880, width: 294, height: 220, radius: 12, fill: { type: solid, color: "$surface" } }
      - id: stat-2-value
        type: text
        z: 20
        x: 393
        y: 920
        width: 294
        height: 0
        content: { type: plain, value: "250" }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, text_align: center, letter_spacing: -0.02 }
      - id: stat-2-label
        type: text
        z: 21
        x: 393
        y: 1010
        width: 294
        height: 0
        content: { type: plain, value: "EMPLOYEES" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.24, text_transform: uppercase }
      - { id: stat-card-3, type: rect, z: 5, x: 707, y: 880, width: 293, height: 220, radius: 12, fill: { type: solid, color: "$surface" } }
      - id: stat-3-value
        type: text
        z: 20
        x: 707
        y: 920
        width: 293
        height: 0
        content: { type: plain, value: "1,200" }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, text_align: center, letter_spacing: -0.02 }
      - id: stat-3-label
        type: text
        z: 21
        x: 707
        y: 1010
        width: 293
        height: 0
        content: { type: plain, value: "CUSTOMERS" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.24, text_transform: uppercase }
      - id: counter
        type: text
        z: 30
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "2/6" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Challenge ────────────────────────────────────
  - id: challenge
    label: Challenge
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-bar, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
