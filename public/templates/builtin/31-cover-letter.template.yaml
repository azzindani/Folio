_protocol: template/v1

# Formal cover letter (A4 portrait, 2480×3508 @ 300dpi) — light-clean theme.
# Sender block (top-right) · date · recipient · salutation · body · sign-off.
# Single primary-color stripe at top sets the document tone.
meta:
  id: tmpl-cover-letter
  name: Cover Letter (A4)
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, letter, formal, a4, professional, print]

document:
  width: 2480
  height: 3508
  unit: px
  dpi: 300

theme:
  ref: light-clean

layers:
  # --- background + top accent stripe ---
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 2480
    height: 3508
    fill: { type: solid, color: "$background" }

  - id: accent-stripe
    type: rect
    z: 5
    x: 0
    y: 0
    width: 2480
    height: 24
    fill:
      type: linear
      angle: 90
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }

  # --- sender block (right-aligned, top) ---
  - id: sender-name
    type: text
    z: 10
    x: 240
    y: 280
    width: 2000
    height: 0
    content: { type: plain, value: "Priya Anand" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 700
      color: $text
      line_height: 1.1
      text_align: right

  - id: sender-email
    type: text
    z: 11
    x: 240
    y: 360
    width: 2000
    height: 0
    content: { type: plain, value: "priya.anand@example.com" }
    style:
      font_family: $mono
      font_size: 26
      color: $text_muted
      line_height: 1.4
      text_align: right

  - id: sender-phone
    type: text
    z: 12
    x: 240
    y: 404
    width: 2000
    height: 0
    content: { type: plain, value: "+1 (415) 555-0188" }
    style:
      font_family: $mono
      font_size: 26
      color: $text_muted
      line_height: 1.4
      text_align: right

  - id: sender-location
    type: text
    z: 13
    x: 240
    y: 448
    width: 2000
    height: 0
    content: { type: plain, value: "San Francisco, CA" }
    style:
      font_family: $mono
      font_size: 26
      color: $text_muted
      line_height: 1.4
      text_align: right

  # --- date (left-aligned, separated by rule) ---
  - id: date
    type: text
    z: 20
    x: 240
    y: 620
    width: 2000
    height: 0
    content: { type: plain, value: "May 16, 2026" }
    style:
      font_family: $body
      font_size: 28
      color: $text
      line_height: 1.4

  # --- recipient block ---
  - id: recipient-name
    type: text
    z: 21
    x: 240
    y: 740
    width: 2000
    height: 0
    content: { type: plain, value: "Mr. Daniel Hofstader" }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 600
      color: $text
      line_height: 1.35

  - id: recipient-company
    type: text
    z: 22
    x: 240
    y: 788
    width: 2000
    height: 0
    content: { type: plain, value: "Hiring Manager · Northwind Logistics" }
    style:
      font_family: $body
      font_size: 26
      color: $text_muted
      line_height: 1.4

  # --- salutation ---
  - id: salutation
    type: text
    z: 30
    x: 240
    y: 920
    width: 2000
    height: 0
    content: { type: plain, value: "Dear Mr. Hofstader," }
    style:
      font_family: $body
      font_size: 30
      font_weight: 500
      color: $text
      line_height: 1.4

  # --- body paragraph ---
  - id: body
    type: text
    z: 31
    x: 240
    y: 1020
    width: 2000
    height: 0
    content:
      type: plain
      value: "I am writing to apply for the Senior Operations Analyst position at Northwind Logistics. Over the past seven years I have led cross-functional teams across fulfillment, demand planning, and supplier reliability, building forecasting systems that reduced stockouts by 38% while keeping carrying cost flat.\n\nWhat draws me to Northwind is the combination of operational rigor and an explicit commitment to local-first technology investments. I believe my background in data-driven decision systems and my history of mentoring early-career analysts would let me contribute meaningfully from week one.\n\nI would welcome the opportunity to discuss how my experience aligns with the goals you have for the team. I have attached my resume and would be glad to share references or a portfolio of recent projects on request."
    style:
      font_family: $body
      font_size: 28
      color: $text
      line_height: 1.7

  # --- sign-off ---
  - id: signoff
    type: text
    z: 40
    x: 240
    y: 2960
    width: 2000
    height: 0
    content: { type: plain, value: "Sincerely," }
    style:
      font_family: $body
      font_size: 28
      color: $text
      line_height: 1.4

  - id: signature
    type: text
    z: 41
    x: 240
    y: 3060
    width: 2000
    height: 0
    content: { type: plain, value: "Priya Anand" }
    style:
      font_family: $heading
      font_size: 34
      font_weight: 600
      color: $text
      line_height: 1.3

slots:
  - { id: sender_name,        path: "layers[2].content.value",  type: text, hint: "Sender full name",          default: "Priya Anand" }
  - { id: sender_email,       path: "layers[3].content.value",  type: text, hint: "Sender email",              default: "priya.anand@example.com" }
  - { id: sender_phone,       path: "layers[4].content.value",  type: text, hint: "Sender phone",              default: "+1 (415) 555-0188" }
  - { id: sender_location,    path: "layers[5].content.value",  type: text, hint: "Sender location",           default: "San Francisco, CA" }
  - { id: date,               path: "layers[6].content.value",  type: text, hint: "Date of letter",            default: "May 16, 2026" }
  - { id: recipient_name,     path: "layers[7].content.value",  type: text, hint: "Recipient name",            default: "Mr. Daniel Hofstader" }
  - { id: recipient_company,  path: "layers[8].content.value",  type: text, hint: "Recipient title / company", default: "Hiring Manager · Northwind Logistics" }
  - { id: salutation,         path: "layers[9].content.value",  type: text, hint: "Salutation line",           default: "Dear Mr. Hofstader," }
  - { id: body,               path: "layers[10].content.value", type: text, hint: "Body paragraphs",           default: "I am writing to apply for the Senior Operations Analyst position at Northwind Logistics..." }
  - { id: signature,          path: "layers[12].content.value", type: text, hint: "Signature name",            default: "Priya Anand" }
