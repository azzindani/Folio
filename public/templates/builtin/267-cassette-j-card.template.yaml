    style:
      font_family: $mono
      font_size: 11
      color: $text
      letter_spacing: 0.04

  - id: back-track-7
    type: text
    z: 37
    x: 460
    y: 190
    width: 320
    height: 0
    content: { type: plain, value: "B2  Last Exit ................. 4:30" }
    style:
      font_family: $mono
      font_size: 11
      color: $text
      letter_spacing: 0.04

  - id: back-track-8
    type: text
    z: 38
    x: 460
    y: 210
    width: 320
    height: 0
    content: { type: plain, value: "B3  Mile Marker 47 ....... 5:14" }
    style:
      font_family: $mono
