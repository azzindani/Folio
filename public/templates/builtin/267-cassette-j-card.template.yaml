      font_weight: 600
      color: $secondary
      letter_spacing: 0.42
      text_transform: uppercase

slots:
  - { id: artist, path: "layers[3].content.value",  type: text, hint: "Artist / band (also fills spine)", default: "NEON CASSETTE CLUB · NIGHT DRIVE TAPES VOL.2" }
  - { id: album,  path: "layers[10].content.value", type: text, hint: "Album / mixtape title",          default: "NIGHT DRIVE TAPES" }
  - { id: year,   path: "layers[24].content.value", type: text, hint: "Copyright footer",               default: "© 2026 NIGHT DRIVE TAPES" }
