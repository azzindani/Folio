_protocol: template/v1

# Cassette J-card inlay (800×400 landscape) — three panels.
# Cyber-synthwave: spine (vertical artist+album) | front (cover+title) | back (tracklist).
meta:
  id: tmpl-cassette-j-card
  name: Cassette J-Card
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, cassette, j-card, music, inlay, synthwave, landscape]
  description: "Cassette J-card inlay with spine, front cover, and back tracklist panels."

document:
  width: 800
  height: 400
  unit: px
  dpi: 96

theme:
  ref: cyber-synthwave

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 800
    height: 400
    fill: { type: solid, color: $background }
  - id: panel-divider-1
    type: rect
    z: 1
    x: 80
    y: 0
    width: 1
    height: 400
    fill: { type: solid, color: "$primary" }
    opacity: 0.6

  - id: panel-divider-2
    type: rect
    z: 2
    x: 440
    y: 0
    width: 1
    height: 400
    fill: { type: solid, color: "$primary" }
    opacity: 0.6

  - id: spine-artist
    type: text
    z: 10
    x: 12
    y: 380
    width: 380
    height: 0
    rotation: -90
    content: { type: plain, value: "NEON CASSETTE CLUB · NIGHT DRIVE TAPES VOL.2" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 800
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: front-glow
    type: circle
    z: 5
    cx: 260
    cy: 200
    rx: 180
    ry: 180
    fill: { type: none }
    opacity: 0.45

  - id: front-cover-plate
    type: rect
    z: 6
    x: 110
    y: 30
    width: 300
    height: 200
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }

  - id: front-cover-sun
    type: circle
    z: 7
    cx: 260
    cy: 170
    rx: 70
    ry: 70
    fill: { type: solid, color: $primary }
  - id: front-cover-line-1
    type: rect
    z: 8
    x: 110
    y: 200
    width: 300
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.8

  - id: front-cover-line-2
    type: rect
    z: 9
    x: 110
    y: 210
    width: 300
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: front-cover-line-3
    type: rect
    z: 10
    x: 110
    y: 220
    width: 300
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.3

  - id: front-album
    type: text
    z: 20
    x: 100
    y: 268
    width: 320
    height: 0
    content: { type: plain, value: "NIGHT DRIVE TAPES" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 900
      color: $text
      letter_spacing: 0.04
      text_align: center
      text_transform: uppercase

  - id: front-volume
    type: text
    z: 21
    x: 100
    y: 304
    width: 320
    height: 0
    content: { type: plain, value: "VOLUME II · MIXTAPE" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $secondary
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: front-artist
    type: text
    z: 22
    x: 100
    y: 340
    width: 320
    height: 0
    content: { type: plain, value: "NEON CASSETTE CLUB" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: back-eyebrow
    type: text
    z: 30
    x: 460
    y: 30
    width: 320
    height: 0
    content: { type: plain, value: "TRACK LIST · 60 MIN" }
    style:
      font_family: $mono
      font_size: 11
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_transform: uppercase

  - id: back-track-1
    type: text
    z: 31
    x: 460
    y: 60
    width: 320
    height: 0
    content: { type: plain, value: "A1  Headlights ............. 3:42" }
    style:
      font_family: $mono
      font_size: 11
      color: $text
      letter_spacing: 0.04

  - id: back-track-2
