_protocol: template/v1

# HuggingFace-style ML model release announcement. LinkedIn 4:5 portrait.
# Display name, architecture chips, 3-column benchmark grid, code snippet, attribution.
meta:
  id: tmpl-model-card-poster
  name: Model Card Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, ml, ai, model-card, technical, portrait, 4-5]
  description: "LinkedIn 4:5 model release announcement with architecture chips, benchmarks, and a usage snippet."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: accent-dot
    type: circle
    z: 5
    cx: 1110
    cy: 130
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "MODEL RELEASE · 2026" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: model-name
    type: text
    z: 21
    x: 80
    y: 180
    width: 1040
    height: 0
    content: { type: plain, value: "LLaMA-3 8B Instruct" }
    style:
      font_family: $heading
      font_size: 96
      font_weight: 900
      color: $text
      line_height: 0.95
      letter_spacing: -0.03

  - id: subtitle
    type: text
    z: 22
    x: 80
    y: 320
    width: 1040
    height: 0
    content: { type: plain, value: "Open-weight chat model · Q4 quantized · Instruction-tuned" }
    style:
      font_family: $body
      font_size: 26
      color: $text_muted
      line_height: 1.4

  - id: chip-1-bg
    type: rect
    z: 30
    x: 80
    y: 400
    width: 200
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }

  - id: chip-1-text
    type: text
    z: 31
    x: 80
    y: 412
    width: 200
    height: 0
    content: { type: plain, value: "8B params" }
    style:
      font_family: $mono
      font_size: 15
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.04

  - id: chip-2-bg
    type: rect
    z: 30
    x: 296
    y: 400
    width: 220
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }

  - id: chip-2-text
    type: text
    z: 31
    x: 296
    y: 412
    width: 220
    height: 0
    content: { type: plain, value: "32K context" }
    style:
      font_family: $mono
      font_size: 15
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.04

  - id: chip-3-bg
    type: rect
    z: 30
    x: 532
    y: 400
    width: 220
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }

  - id: chip-3-text
    type: text
    z: 31
    x: 532
    y: 412
    width: 220
    height: 0
    content: { type: plain, value: "Apache 2.0" }
