  - id: author-sub
    type: text
    z: 71
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "huggingface.co/meta-llama" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      line_height: 1.4

  - id: page-mark
    type: text
    z: 72
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "01 / FOLIO" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_align: right
      text_transform: uppercase

animations:
  accent-dot:
    loop: { type: pulse, duration: 2200, scale: 1.25 }
  model-name:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  subtitle:
    enter: { type: fade_up, duration: 600, delay: 250, easing: ease-out }
  bench-1-value:
    enter: { type: scale_in, duration: 600, delay: 400, easing: ease-out }
  bench-2-value:
    enter: { type: scale_in, duration: 600, delay: 550, easing: ease-out }
  bench-3-value:
    enter: { type: scale_in, duration: 600, delay: 700, easing: ease-out }
  snippet-card:
    enter: { type: fade_up, duration: 700, delay: 900, easing: ease-out }

slots:
  - { id: eyebrow,         path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",            default: "MODEL RELEASE · 2026" }
  - { id: model_name,      path: "layers[4].content.value",  type: text, hint: "Model display name",     default: "LLaMA-3 8B Instruct" }
  - { id: subtitle,        path: "layers[5].content.value",  type: text, hint: "Subtitle",               default: "Open-weight chat model · Q4 quantized · Instruction-tuned" }
  - { id: chip_params,     path: "layers[7].content.value",  type: text, hint: "Chip · params",          default: "8B params" }
  - { id: chip_context,    path: "layers[9].content.value",  type: text, hint: "Chip · context",         default: "32K context" }
  - { id: chip_license,    path: "layers[11].content.value", type: text, hint: "Chip · license",         default: "Apache 2.0" }
  - { id: chip_format,     path: "layers[13].content.value", type: text, hint: "Chip · format",          default: "GGUF + safetensors" }
  - { id: bench_1_value,   path: "layers[17].content.value", type: text, hint: "Benchmark 1 value",      default: "71.2" }
  - { id: bench_2_value,   path: "layers[20].content.value", type: text, hint: "Benchmark 2 value",      default: "64.8" }
  - { id: bench_3_value,   path: "layers[23].content.value", type: text, hint: "Benchmark 3 value",      default: "79.1" }
  - { id: trained_detail,  path: "layers[27].content.value", type: text, hint: "Training corpus line",   default: "15T tokens · curated web + code + multilingual corpora · RLHF aligned" }
  - { id: usage_snippet,   path: "layers[30].content.value", type: text, hint: "Code usage snippet",     default: "pip install transformers accelerate" }
  - { id: author,          path: "layers[31].content.value", type: text, hint: "Author handle + date",   default: "@meta-ai · Released 17 May 2026" }
