      font_family: $mono
      font_size: 15
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.04

  - id: chip-4-bg
    type: rect
    z: 30
    x: 768
    y: 400
    width: 260
    height: 44
    radius: 22
    fill: { type: solid, color: "$surface" }

  - id: chip-4-text
    type: text
