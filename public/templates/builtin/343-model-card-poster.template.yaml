    y: 710
    width: 320
    height: 0
    content: { type: plain, value: "5-shot reasoning across 57 academic subjects" }
    style:
      font_family: $body
      font_size: 15
      color: $text_muted
      line_height: 1.45

  - id: bench-2-label
    type: text
    z: 41
    x: 440
    y: 580
    width: 320
    height: 0
    content: { type: plain, value: "HumanEval" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.24
      text_transform: uppercase

  - id: bench-2-value
    type: text
    z: 42
    x: 440
    y: 610
    width: 320
    height: 0
    content: { type: plain, value: "64.8" }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 800
      color: $primary
      line_height: 1.0
      letter_spacing: -0.02

  - id: bench-2-caption
    type: text
    z: 43
    x: 440
    y: 710
    width: 320
    height: 0
    content: { type: plain, value: "Python function synthesis · pass@1" }
    style:
      font_family: $body
      font_size: 15
      color: $text_muted
      line_height: 1.45

  - id: bench-3-label
    type: text
    z: 41
    x: 800
    y: 580
    width: 320
    height: 0
    content: { type: plain, value: "GSM8K" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.24
      text_transform: uppercase

  - id: bench-3-value
    type: text
    z: 42
    x: 800
    y: 610
    width: 320
    height: 0
    content: { type: plain, value: "79.1" }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 800
      color: $primary
      line_height: 1.0
      letter_spacing: -0.02

  - id: bench-3-caption
    type: text
    z: 43
    x: 800
    y: 710
    width: 320
    height: 0
    content: { type: plain, value: "Grade-school math word problems · CoT" }
    style:
      font_family: $body
      font_size: 15
      color: $text_muted
      line_height: 1.45

  - id: divider-2
    type: rect
    z: 10
    x: 80
    y: 820
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.25

  - id: trained-label
    type: text
    z: 50
    x: 80
    y: 850
    width: 1040
    height: 0
    content: { type: plain, value: "TRAINED ON" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.36
      text_transform: uppercase

  - id: trained-detail
    type: text
    z: 51
    x: 80
    y: 880
    width: 1040
    height: 0
    content: { type: plain, value: "15T tokens · curated web + code + multilingual corpora · RLHF aligned" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.45

  - id: snippet-card
    type: rect
    z: 60
    x: 80
    y: 970
    width: 1040
    height: 340
    radius: 12
    fill: { type: solid, color: "$surface" }

  - id: snippet-label
    type: text
    z: 61
    x: 112
    y: 1000
    width: 980
    height: 0
    content: { type: plain, value: "USAGE" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: snippet-code
    type: text
    z: 62
    x: 112
    y: 1040
    width: 980
    height: 0
    content: { type: plain, value: "pip install transformers accelerate\n\nfrom transformers import pipeline\npipe = pipeline(\n    \"text-generation\",\n    model=\"meta-llama/Llama-3-8B-Instruct\",\n    torch_dtype=\"auto\",\n    device_map=\"auto\",\n)\nout = pipe(\"Explain quantization in one paragraph.\")" }
    style:
      font_family: $mono
      font_size: 15
      color: $text
      line_height: 1.55

  - id: author
    type: text
    z: 70
    x: 80
    y: 1370
    width: 700
    height: 0
    content: { type: plain, value: "@meta-ai · Released 17 May 2026" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text
