_protocol: template/v1

# Gift table sign — 1080×1500 portrait, pastel-dream theme.
# "Gifts & Cards" script, monogram, thank you message, laurel leaves (polygons).
meta:
  id: tmpl-gift-table-sign
  name: Gift Table Sign
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, wedding, reception, gift-table, sign, pastel, portrait]
  description: "Gift table sign with script header, monogram, laurel ornaments, and thank you message."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1 soft halo
  - { id: halo, type: circle, z: 1, cx: 540, cy: 760, rx: 540, ry: 540, fill: { type: none }, opacity: 0.18 }
  # 2 outer frame
  - { id: frame, type: rect, z: 2, x: 80, y: 80, width: 920, height: 1340, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
  # 3 left laurel stem
  - { id: laurel-l-stem, type: rect, z: 5, x: 268, y: 760, width: 2, height: 200, fill: { type: solid, color: "$primary" } }
  # 4 left laurel leaf 1
  - { id: laurel-l-1, type: polygon, z: 6, points: "210,780 240,800 270,790 240,810 215,810", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 5 left laurel leaf 2
  - { id: laurel-l-2, type: polygon, z: 6, points: "208,830 240,852 272,840 240,862 215,860", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 6 left laurel leaf 3
  - { id: laurel-l-3, type: polygon, z: 6, points: "210,884 240,906 270,894 240,914 215,914", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 7 left laurel leaf 4
  - { id: laurel-l-4, type: polygon, z: 6, points: "212,936 240,956 270,946 240,964 218,964", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 8 right laurel stem
  - { id: laurel-r-stem, type: rect, z: 5, x: 810, y: 760, width: 2, height: 200, fill: { type: solid, color: "$primary" } }
  # 9 right laurel leaf 1
  - { id: laurel-r-1, type: polygon, z: 6, points: "810,780 840,800 870,790 840,810 815,810", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 10 right laurel leaf 2
  - { id: laurel-r-2, type: polygon, z: 6, points: "810,830 840,852 870,840 840,862 815,860", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 11 right laurel leaf 3
  - { id: laurel-r-3, type: polygon, z: 6, points: "810,884 840,906 870,894 840,914 815,914", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 12 right laurel leaf 4
  - { id: laurel-r-4, type: polygon, z: 6, points: "810,936 840,956 870,946 840,964 818,964", fill: { type: solid, color: "$primary" }, opacity: 0.85 }
  # 13 top ornament
  - { id: orn-top, type: text, z: 10, x: 0, y: 220, width: 1080, height: 0, content: { type: plain, value: "❀  ·  ❀  ·  ❀" }, style: { font_family: $heading, font_size: 28, color: "$primary", text_align: center, letter_spacing: 0.4 } }
  # 14 huge header script
  - { id: header, type: text, z: 11, x: 0, y: 320, width: 1080, height: 0, content: { type: plain, value: "Gifts & Cards" }, style: { font_family: $heading, font_size: 110, font_style: italic, font_weight: 400, color: "$text", text_align: center, line_height: 1.1, letter_spacing: -0.02 } }
  # 15 subtitle
  - { id: subtitle, type: text, z: 12, x: 0, y: 470, width: 1080, height: 0, content: { type: plain, value: "please leave them here" }, style: { font_family: $heading, font_size: 32, font_style: italic, color: "#9B5E76", text_align: center } }
  # 16 rule
  - { id: rule, type: rect, z: 13, x: 490, y: 560, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 17 monogram circle
  - { id: mono-ring, type: circle, z: 20, cx: 540, cy: 760, rx: 130, ry: 130, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  # 18 monogram letters
  - { id: monogram, type: text, z: 21, x: 0, y: 720, width: 1080, height: 0, content: { type: plain, value: "A & J" }, style: { font_family: $heading, font_size: 92, font_style: italic, color: "$text", text_align: center } }
  # 19 message eyebrow
  - { id: msg-lbl, type: text, z: 30, x: 0, y: 1050, width: 1080, height: 0, content: { type: plain, value: "THANK YOU" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.8 } }
  # 20 message
  - { id: message, type: text, z: 31, x: 100, y: 1100, width: 880, height: 0, content: { type: plain, value: "Thank you for joining our celebration. Your presence is the greatest gift of all — anything more is icing on the (five-tier) cake." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text", text_align: center, line_height: 1.5 } }
  # 21 footer date
  - { id: footer, type: text, z: 32, x: 0, y: 1300, width: 1080, height: 0, content: { type: plain, value: "24 · 05 · 2026" }, style: { font_family: $body, font_size: 14, font_weight: 600, color: "$text_muted", text_align: center, letter_spacing: 0.6 } }
  # 22 bottom ornament
  - { id: orn-bot, type: text, z: 33, x: 0, y: 1360, width: 1080, height: 0, content: { type: plain, value: "❀" }, style: { font_family: $heading, font_size: 22, color: "$primary", text_align: center } }

slots:
  - { id: couple_names, path: "layers[18].content.value", type: text, hint: "Couple monogram", default: "A & J" }
