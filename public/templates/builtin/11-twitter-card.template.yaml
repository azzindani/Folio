_protocol: template/v1

# X/Twitter link preview card — hero + body + mini bar-chart decoration + footer.
# Asymmetric: copy on the left, data viz placeholder on the right.
meta:
  id: tmpl-twitter-card
  name: Twitter / X Card
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, social, twitter, x, dark, data]

document:
  width: 1200
  height: 675
  unit: px
  dpi: 96

theme:
  ref: dark-tech
  overrides:
    primary: "#3D9EE4"
    accent: "#00D4FF"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 675
    fill: { type: solid, color: $background }
  - id: glow
    type: circle
    z: 2
    cx: 1000
    cy: 540
    rx: 360
    ry: 360
    fill: { type: none }
    opacity: 0.18

  - id: accent-bar
    type: rect
    z: 5
    x: 0
    y: 0
    width: 1200
    height: 6
    fill: { type: solid, color: $primary }
  - id: accent-label
    type: text
    z: 10
    x: 70
    y: 60
    width: 600
    height: 0
    content: { type: plain, value: "BENCHMARK · 2026" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $accent
      letter_spacing: 0.28
      text_transform: uppercase

  - id: hero-title
    type: text
    z: 11
    x: 70
    y: 120
    width: 720
    height: 0
    content: { type: plain, value: "We measured 1M\ncold starts. Here's\nwhat broke." }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.03

  - id: body
    type: text
    z: 12
    x: 70
    y: 440
    width: 720
    height: 0
    content: { type: plain, value: "P99 latency jumped 4.2× during regional failover. The fix took 11 lines." }
    style:
      font_family: $body
      font_size: 20
      color: $text_muted
      line_height: 1.45

  - id: chart-frame
    type: rect
    z: 15
    x: 860
    y: 200
    width: 280
    height: 280
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: chart-axis
    type: rect
    z: 16
    x: 880
    y: 440
    width: 240
    height: 1
    fill: { type: solid, color: "$border" }

  - id: bar-1
    type: rect
    z: 17
    x: 900
    y: 380
    width: 36
    height: 60
    radius: 4
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: bar-2
    type: rect
    z: 17
    x: 956
    y: 320
    width: 36
    height: 120
    radius: 4
    fill: { type: solid, color: "$primary" }
    opacity: 0.7

  - id: bar-3
    type: rect
    z: 17
    x: 1012
    y: 260
    width: 36
    height: 180
    radius: 4
    fill: { type: solid, color: "$accent" }

  - id: bar-4
    type: rect
    z: 17
    x: 1068
    y: 350
    width: 36
    height: 90
    radius: 4
    fill: { type: solid, color: "$primary" }
    opacity: 0.6

  - id: chart-caption
    type: text
    z: 18
    x: 860
    y: 500
    width: 280
    height: 0
    content: { type: plain, value: "p50 · p90 · p99 · max" }
    style:
      font_family: $mono
      font_size: 12
      color: $text_muted
      text_align: center

  - id: footer-divider
    type: rect
    z: 25
    x: 70
    y: 590
    width: 1060
    height: 1
    fill: { type: solid, color: "$border" }

  - id: site-name
    type: text
    z: 26
    x: 70
    y: 615
    width: 600
    height: 0
    content: { type: plain, value: "engineering.folio.dev" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text

slots:
  - { id: accent_label, path: "layers[3].content.value",  type: text, hint: "Top accent label",        default: "BENCHMARK · 2026" }
  - { id: hero_title,   path: "layers[4].content.value",  type: text, hint: "Hero title (3 lines)",     default: "We measured 1M\ncold starts. Here's\nwhat broke." }
  - { id: body,         path: "layers[5].content.value",  type: text, hint: "Body copy",                default: "P99 latency jumped 4.2× during regional failover. The fix took 11 lines." }
  - { id: site_name,    path: "layers[14].content.value", type: text, hint: "Site / domain footer",    default: "engineering.folio.dev" }
