_protocol: template/v1

# 5-page Instagram Story set — 1080×1920 portrait, sunset-glow theme.
# Announcement → big stat → customer quote → behind-the-scenes → CTA.
meta:
  id: tmpl-instagram-story-set
  name: Instagram Story · 5-Part Set
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, instagram, story, social, portrait, sunset]
  description: "Five-part Instagram Story set with announcement, big stat reveal, customer quote, behind-the-scenes, and swipe-up CTA."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

pages:
  # ── Story 1 · Announcement Banner ───────────────────────────
  - id: announcement
    label: Announcement
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1920, fill: { type: linear, angle: 180, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1920, fill: { type: solid, color: "rgba(0,0,0,0.25)" } }
      - { id: glow, type: circle, z: 2, cx: 540, cy: 600, rx: 460, ry: 460, fill: { type: radial, stops: [{ color: "$secondary", position: 0 }, { color: "transparent", position: 100 }] }, opacity: 0.55 }
      - { id: top-strip, type: rect, z: 5, x: 60, y: 80, width: 960, height: 6, radius: 3, fill: { type: solid, color: "rgba(255,255,255,0.5)" } }
      - { id: top-strip-fill, type: rect, z: 6, x: 60, y: 80, width: 192, height: 6, radius: 3, fill: { type: solid, color: "#FFFFFF" } }
      - { id: brand, type: text, z: 10, x: 60, y: 140, width: 960, height: 0, content: { type: plain, value: "@SOLSTICE.COFFEE" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.4 } }
      - { id: kicker-pill, type: rect, z: 11, x: 60, y: 600, width: 280, height: 56, radius: 28, fill: { type: solid, color: "rgba(255,255,255,0.18)" }, stroke: { color: "rgba(255,255,255,0.4)", width: 1 } }
      - { id: kicker, type: text, z: 12, x: 60, y: 618, width: 280, height: 0, content: { type: plain, value: "✨ ANNOUNCEMENT" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.3, text_align: center } }
      - { id: announce, type: text, z: 13, x: 60, y: 720, width: 960, height: 0, content: { type: plain, value: "Our summer\nblend is\nback." }, style: { font_family: $heading, font_size: 150, font_weight: 800, color: "#FFFFFF", line_height: 0.95, letter_spacing: -0.04 } }
      - { id: sub, type: text, z: 14, x: 60, y: 1340, width: 960, height: 0, content: { type: plain, value: "Limited run · 1,200 bags · ships Friday." }, style: { font_family: $heading, font_size: 36, color: "#FFFFFF", opacity: 0.92, line_height: 1.3 } }
      - { id: arrow, type: text, z: 15, x: 60, y: 1700, width: 960, height: 0, content: { type: plain, value: "↑ swipe up to shop" }, style: { font_family: $body, font_size: 24, font_weight: 600, color: "#FFFFFF", text_align: center } }
      - { id: counter, type: text, z: 16, x: 60, y: 1850, width: 960, height: 0, content: { type: plain, value: "1 / 5" }, style: { font_family: $mono, font_size: 14, color: "#FFFFFF", opacity: 0.7, text_align: center, letter_spacing: 0.2 } }

  # ── Story 2 · Big Stat Reveal ───────────────────────────────
  - id: big-stat
    label: Big Stat
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1920, fill: { type: solid, color: "$background" } }
      - { id: top-strip-1, type: rect, z: 5, x: 60, y: 80, width: 470, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: top-strip-2, type: rect, z: 6, x: 540, y: 80, width: 470, height: 6, radius: 3, fill: { type: solid, color: "rgba(0,0,0,0.15)" } }
      - { id: top-strip-2-fill, type: rect, z: 7, x: 540, y: 80, width: 100, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: brand, type: text, z: 10, x: 60, y: 140, width: 960, height: 0, content: { type: plain, value: "@SOLSTICE.COFFEE" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: kicker, type: text, z: 11, x: 60, y: 480, width: 960, height: 0, content: { type: plain, value: "BY THE NUMBERS" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: $primary, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: stat-value, type: text, z: 12, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "84K" }, style: { font_family: $heading, font_size: 380, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.05, text_align: center } }
      - { id: stat-unit, type: text, z: 13, x: 60, y: 980, width: 960, height: 0, content: { type: plain, value: "bags sold last year" }, style: { font_family: $heading, font_size: 44, font_weight: 600, color: $primary, text_align: center } }
      - { id: divider, type: rect, z: 14, x: 480, y: 1100, width: 120, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: ctx-card, type: rect, z: 20, x: 90, y: 1180, width: 900, height: 460, radius: 24, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: ctx-title, type: text, z: 21, x: 130, y: 1230, width: 820, height: 0, content: { type: plain, value: "Translation:" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $text_muted, letter_spacing: 0.3 } }
      - { id: ctx-body, type: text, z: 22, x: 130, y: 1280, width: 820, height: 0, content: { type: plain, value: "That's 1.7 million cups of coffee\npoured by 14,000 of you\nin 32 countries." }, style: { font_family: $heading, font_size: 38, font_weight: 700, color: $text, line_height: 1.35 } }
      - { id: hearts, type: text, z: 23, x: 130, y: 1540, width: 820, height: 0, content: { type: plain, value: "♥  ♥  ♥" }, style: { font_family: $body, font_size: 28, color: $primary, letter_spacing: 0.4 } }
      - { id: arrow, type: text, z: 30, x: 60, y: 1760, width: 960, height: 0, content: { type: plain, value: "↑ keep tapping" }, style: { font_family: $body, font_size: 22, color: $text_muted, text_align: center } }
      - { id: counter, type: text, z: 31, x: 60, y: 1850, width: 960, height: 0, content: { type: plain, value: "2 / 5" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.2 } }

  # ── Story 3 · Customer Quote ────────────────────────────────
  - id: customer-quote
    label: Customer Quote
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1920, fill: { type: linear, angle: 180, stops: [{ color: "$surface", position: 0 }, { color: "$background", position: 100 }] } }
      - { id: glow, type: circle, z: 1, cx: 540, cy: 960, rx: 600, ry: 600, fill: { type: radial, stops: [{ color: "$primary", position: 0 }, { color: "transparent", position: 100 }] }, opacity: 0.18 }
      - { id: top-strip-1, type: rect, z: 5, x: 60, y: 80, width: 310, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: top-strip-2, type: rect, z: 5, x: 380, y: 80, width: 310, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: top-strip-3, type: rect, z: 6, x: 700, y: 80, width: 310, height: 6, radius: 3, fill: { type: solid, color: "rgba(0,0,0,0.15)" } }
      - { id: top-strip-3-fill, type: rect, z: 7, x: 700, y: 80, width: 80, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: kicker, type: text, z: 10, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "FROM A CUSTOMER" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: open-q, type: text, z: 11, x: 60, y: 280, width: 960, height: 0, content: { type: plain, value: "“" }, style: { font_family: $heading, font_size: 240, font_weight: 800, color: $primary, line_height: 1, text_align: center } }
      - { id: quote, type: text, z: 12, x: 100, y: 580, width: 880, height: 0, content: { type: plain, value: "This is the only bag I let myself ration. One scoop a morning. It's the difference between a good day and a great one." }, style: { font_family: $heading, font_size: 52, font_weight: 600, color: $text, line_height: 1.35, text_align: center, letter_spacing: -0.01 } }
      - { id: stars, type: text, z: 13, x: 60, y: 1240, width: 960, height: 0, content: { type: plain, value: "★ ★ ★ ★ ★" }, style: { font_family: $heading, font_size: 36, color: $primary, text_align: center, letter_spacing: 0.4 } }
      - { id: author-avatar, type: circle, z: 14, cx: 540, cy: 1380, rx: 60, ry: 60, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: author-initial, type: text, z: 15, x: 480, y: 1356, width: 120, height: 0, content: { type: plain, value: "JM" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: "#FFFFFF", text_align: center } }
      - { id: author-name, type: text, z: 16, x: 60, y: 1480, width: 960, height: 0, content: { type: plain, value: "Jamie M." }, style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text, text_align: center } }
      - { id: author-where, type: text, z: 17, x: 60, y: 1530, width: 960, height: 0, content: { type: plain, value: "Brooklyn · ordered 11 bags" }, style: { font_family: $body, font_size: 20, color: $text_muted, text_align: center } }
      - { id: tag-pill, type: rect, z: 20, x: 380, y: 1640, width: 320, height: 52, radius: 26, fill: { type: solid, color: "$primary" } }
      - { id: tag-text, type: text, z: 21, x: 380, y: 1656, width: 320, height: 0, content: { type: plain, value: "tag a coffee friend ☕" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "#FFFFFF", text_align: center } }
      - { id: counter, type: text, z: 30, x: 60, y: 1850, width: 960, height: 0, content: { type: plain, value: "3 / 5" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.2 } }

  # ── Story 4 · Behind the Scenes ─────────────────────────────
  - id: behind-scenes
    label: Behind the Scenes
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1920, fill: { type: solid, color: "$background" } }
      - { id: top-strip-1, type: rect, z: 5, x: 60, y: 80, width: 230, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: top-strip-2, type: rect, z: 5, x: 300, y: 80, width: 230, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: top-strip-3, type: rect, z: 5, x: 540, y: 80, width: 230, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: top-strip-4, type: rect, z: 6, x: 780, y: 80, width: 230, height: 6, radius: 3, fill: { type: solid, color: "rgba(0,0,0,0.15)" } }
      - { id: top-strip-4-fill, type: rect, z: 7, x: 780, y: 80, width: 80, height: 6, radius: 3, fill: { type: solid, color: "$primary" } }
      - { id: kicker, type: text, z: 10, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "BEHIND THE SCENES" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 60, y: 220, width: 960, height: 0, content: { type: plain, value: "How we\nroast it." }, style: { font_family: $heading, font_size: 108, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 } }
      - { id: img-frame, type: rect, z: 20, x: 60, y: 540, width: 960, height: 620, radius: 24, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] }, opacity: 0.5 }
      - { id: img-border, type: rect, z: 21, x: 60, y: 540, width: 960, height: 620, radius: 24, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 3 } }
      - { id: img-roaster, type: circle, z: 22, cx: 540, cy: 820, rx: 180, ry: 180, fill: { type: solid, color: "$text" } }
      - { id: img-roaster-glass, type: circle, z: 23, cx: 540, cy: 820, rx: 130, ry: 130, fill: { type: linear, angle: 135, stops: [{ color: "$secondary", position: 0 }, { color: "$primary", position: 100 }] } }
      - { id: img-bean-1, type: ellipse, z: 24, cx: 500, cy: 820, rx: 16, ry: 24, fill: { type: solid, color: "#4A2B0F" } }
      - { id: img-bean-2, type: ellipse, z: 24, cx: 540, cy: 800, rx: 16, ry: 24, fill: { type: solid, color: "#3A1F08" } }
      - { id: img-bean-3, type: ellipse, z: 24, cx: 580, cy: 830, rx: 16, ry: 24, fill: { type: solid, color: "#4A2B0F" } }
      - { id: img-bean-4, type: ellipse, z: 24, cx: 530, cy: 850, rx: 16, ry: 24, fill: { type: solid, color: "#3A1F08" } }
      - { id: img-label, type: text, z: 25, x: 100, y: 580, width: 200, height: 0, content: { type: plain, value: "TUE 06:14 AM" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.3 } }
      - { id: step-1-num, type: text, z: 30, x: 60, y: 1240, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: $primary } }
      - { id: step-1-text, type: text, z: 31, x: 130, y: 1248, width: 880, height: 0, content: { type: plain, value: "Beans land at 4:30am, still warm from Colombia." }, style: { font_family: $heading, font_size: 26, color: $text, line_height: 1.4 } }
      - { id: step-2-num, type: text, z: 30, x: 60, y: 1360, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: $primary } }
      - { id: step-2-text, type: text, z: 31, x: 130, y: 1368, width: 880, height: 0, content: { type: plain, value: "Roasted 14 minutes to a medium city level." }, style: { font_family: $heading, font_size: 26, color: $text, line_height: 1.4 } }
      - { id: step-3-num, type: text, z: 30, x: 60, y: 1480, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: $primary } }
      - { id: step-3-text, type: text, z: 31, x: 130, y: 1488, width: 880, height: 0, content: { type: plain, value: "Bagged the same day, never sits on a shelf." }, style: { font_family: $heading, font_size: 26, color: $text, line_height: 1.4 } }
      - { id: cta, type: text, z: 40, x: 60, y: 1700, width: 960, height: 0, content: { type: plain, value: "More on the blog →" }, style: { font_family: $body, font_size: 22, font_weight: 600, color: $primary, text_align: center } }
      - { id: counter, type: text, z: 41, x: 60, y: 1850, width: 960, height: 0, content: { type: plain, value: "4 / 5" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.2 } }

  # ── Story 5 · CTA with swipe-up ─────────────────────────────
  - id: cta
    label: CTA Swipe Up
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1920, fill: { type: linear, angle: 180, stops: [{ color: "$secondary", position: 0 }, { color: "$primary", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1920, fill: { type: solid, color: "rgba(0,0,0,0.3)" } }
      - { id: ring-glow, type: circle, z: 2, cx: 540, cy: 540, rx: 360, ry: 360, fill: { type: radial, stops: [{ color: "#FFFFFF", position: 0 }, { color: "transparent", position: 100 }] }, opacity: 0.25 }
      - { id: top-strip-bg, type: rect, z: 5, x: 60, y: 80, width: 960, height: 6, radius: 3, fill: { type: solid, color: "rgba(255,255,255,0.3)" } }
      - { id: top-strip-fill, type: rect, z: 6, x: 60, y: 80, width: 960, height: 6, radius: 3, fill: { type: solid, color: "#FFFFFF" } }
      - { id: brand, type: text, z: 10, x: 60, y: 140, width: 960, height: 0, content: { type: plain, value: "@SOLSTICE.COFFEE" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.4 } }
      - { id: kicker, type: text, z: 11, x: 60, y: 500, width: 960, height: 0, content: { type: plain, value: "READY?" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: heading, type: text, z: 12, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "Grab a\nbag." }, style: { font_family: $heading, font_size: 280, font_weight: 800, color: "#FFFFFF", line_height: 0.95, letter_spacing: -0.04, text_align: center } }
      - { id: sub, type: text, z: 13, x: 60, y: 1180, width: 960, height: 0, content: { type: plain, value: "Free shipping on orders over $40.\nUse code SUMMER for 15% off." }, style: { font_family: $heading, font_size: 30, color: "#FFFFFF", opacity: 0.95, line_height: 1.4, text_align: center } }
      - { id: cta-btn, type: rect, z: 20, x: 240, y: 1420, width: 600, height: 100, radius: 50, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-btn-text, type: text, z: 21, x: 240, y: 1454, width: 600, height: 0, content: { type: plain, value: "Shop now →" }, style: { font_family: $heading, font_size: 32, font_weight: 800, color: "$primary", text_align: center } }
      - { id: arrow-1, type: text, z: 30, x: 60, y: 1620, width: 960, height: 0, content: { type: plain, value: "↑" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1 } }
      - { id: swipe-text, type: text, z: 31, x: 60, y: 1730, width: 960, height: 0, content: { type: plain, value: "swipe up to checkout" }, style: { font_family: $body, font_size: 22, font_weight: 600, color: "#FFFFFF", text_align: center, letter_spacing: 0.2 } }
      - { id: counter, type: text, z: 32, x: 60, y: 1850, width: 960, height: 0, content: { type: plain, value: "5 / 5" }, style: { font_family: $mono, font_size: 14, color: "#FFFFFF", opacity: 0.7, text_align: center, letter_spacing: 0.2 } }

slots:
  - { id: brand_name,      path: "pages[0].layers[5].content.value",  type: text, hint: "Brand handle",         default: "@SOLSTICE.COFFEE" }
  - { id: announcement,    path: "pages[0].layers[8].content.value",  type: text, hint: "Big announcement",     default: "Our summer\nblend is\nback." }
  - { id: announce_sub,    path: "pages[0].layers[9].content.value",  type: text, hint: "Announcement detail",  default: "Limited run · 1,200 bags · ships Friday." }
  - { id: stat_value,      path: "pages[1].layers[7].content.value",  type: text, hint: "Big stat number",      default: "84K" }
  - { id: stat_unit,       path: "pages[1].layers[8].content.value",  type: text, hint: "Stat unit",            default: "bags sold last year" }
  - { id: customer_quote,  path: "pages[2].layers[7].content.value",  type: text, hint: "Customer quote",       default: "This is the only bag I let myself ration. One scoop a morning. It's the difference between a good day and a great one." }
  - { id: customer_name,   path: "pages[2].layers[11].content.value", type: text, hint: "Customer name",        default: "Jamie M." }
  - { id: cta_heading,     path: "pages[4].layers[7].content.value",  type: text, hint: "Final CTA heading",    default: "Grab a\nbag." }
