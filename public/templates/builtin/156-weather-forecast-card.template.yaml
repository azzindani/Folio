_protocol: template/v1

# Weather forecast widget — 1080×1350 portrait, ocean-blue theme.
# City + current condition top, large current temp with stylized sun
# (circle + rays), feels-like + humidity badges, 5 mini day cards in
# a row, sunrise/sunset footer.
meta:
  id: tmpl-weather-forecast-card
  name: Weather Forecast Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [weather, forecast, card, widget, portrait, ocean]
  description: "Weather forecast widget with current temperature, feels-like, humidity, and 5-day mini forecast row."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1350
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$background", position: 60 }
        - { color: "$surface", position: 100 }

  # ── Soft ambient glow ─────────────────────────────────────
  - id: glow
    type: circle
    z: 2
    cx: 800
    cy: 280
    rx: 360
    ry: 360
    fill:
      type: radial
      stops:
        - { color: "#FFE08A", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.45

  # ── City + condition ──────────────────────────────────────
  - id: city
    type: text
    z: 10
    x: 60
    y: 80
    width: 960
    height: 0
    content: { type: plain, value: "Lisbon, Portugal" }
    style:
      font_family: $heading
      font_size: 42
      font_weight: 700
      color: "#FFFFFF"
      line_height: 1.2

  - id: condition
    type: text
    z: 11
    x: 60
    y: 140
    width: 960
    height: 0
    content: { type: plain, value: "Mostly sunny  ·  light breeze" }
    style:
      font_family: $body
      font_size: 22
      color: "#FFFFFFD0"
      line_height: 1.3

  # ── Sun icon (circle + 8 ray lines) ───────────────────────
  - id: sun-core
    type: circle
    z: 20
    cx: 800
    cy: 350
    rx: 90
    ry: 90
    fill: { type: solid, color: "#FFD66B" }

  - id: ray-1
    type: line
    z: 21
    x1: 800
    y1: 200
    x2: 800
    y2: 240
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-2
    type: line
    z: 21
    x1: 800
    y1: 460
    x2: 800
    y2: 500
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-3
    type: line
    z: 21
    x1: 650
    y1: 350
    x2: 690
    y2: 350
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-4
    type: line
    z: 21
    x1: 910
    y1: 350
    x2: 950
    y2: 350
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-5
    type: line
    z: 21
    x1: 695
    y1: 245
    x2: 723
    y2: 273
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-6
    type: line
    z: 21
    x1: 877
    y1: 427
    x2: 905
    y2: 455
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-7
    type: line
    z: 21
    x1: 905
    y1: 245
    x2: 877
    y2: 273
    stroke: { color: "#FFD66B", width: 8 }

  - id: ray-8
    type: line
    z: 21
    x1: 723
    y1: 427
    x2: 695
    y2: 455
    stroke: { color: "#FFD66B", width: 8 }

  # ── Current temperature (huge) ────────────────────────────
  - id: current-temp
    type: text
    z: 30
    x: 60
    y: 240
    width: 600
    height: 0
    content: { type: plain, value: "24°" }
    style:
      font_family: $heading
      font_size: 260
      font_weight: 800
      color: "#FFFFFF"
      line_height: 1
      letter_spacing: -0.04

  - id: high-low
    type: text
    z: 31
    x: 60
    y: 500
    width: 600
    height: 0
    content: { type: plain, value: "H 27°  ·  L 18°" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 600
      color: "#FFFFFFD0"
      line_height: 1.3

  # ── Feels-like badge ──────────────────────────────────────
  - id: feels-pill
    type: rect
    z: 40
    x: 60
    y: 580
    width: 460
    height: 110
    radius: 24
    fill: { type: solid, color: "#FFFFFF22" }
    stroke: { color: "#FFFFFF55", width: 1 }

  - id: feels-label
    type: text
    z: 41
    x: 90
    y: 605
    width: 420
    height: 0
    content: { type: plain, value: "FEELS LIKE" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "#FFFFFFAA"
      letter_spacing: 0.4
      text_transform: uppercase

  - id: feels-value
    type: text
    z: 42
    x: 90
    y: 632
    width: 420
    height: 0
    content: { type: plain, value: "26°" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 700
      color: "#FFFFFF"
      line_height: 1.1

  # ── Humidity badge ────────────────────────────────────────
  - id: humid-pill
    type: rect
    z: 43
    x: 560
    y: 580
    width: 460
    height: 110
    radius: 24
    fill: { type: solid, color: "#FFFFFF22" }
    stroke: { color: "#FFFFFF55", width: 1 }

  - id: humid-label
    type: text
    z: 44
    x: 590
    y: 605
    width: 420
    height: 0
    content: { type: plain, value: "HUMIDITY" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "#FFFFFFAA"
      letter_spacing: 0.4
      text_transform: uppercase

  - id: humid-value
    type: text
    z: 45
    x: 590
    y: 632
    width: 420
    height: 0
    content: { type: plain, value: "62%" }
    style:
      font_family: $heading
      font_size: 48
      font_weight: 700
      color: "#FFFFFF"
      line_height: 1.1

  # ── 5-day forecast row ────────────────────────────────────
  - id: forecast-header
    type: text
    z: 50
    x: 60
    y: 750
    width: 960
    height: 0
    content: { type: plain, value: "NEXT 5 DAYS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "#FFFFFFCC"
      letter_spacing: 0.4
      text_transform: uppercase

  # Day 1 card
  - id: d1-card
    type: rect
    z: 51
    x: 60
    y: 800
    width: 180
    height: 280
    radius: 20
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: d1-day
