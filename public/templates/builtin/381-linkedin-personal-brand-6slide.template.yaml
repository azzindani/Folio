_protocol: template/v1

# LinkedIn 6-slide carousel — personal brand pillars with 4 action-paired pillar slides.
# Portrait 1080×1350. editorial-cream theme.
meta:
  id: tmpl-linkedin-personal-brand-6slide
  name: LinkedIn Personal Brand (6 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, career, branding, personal-brand, 4-5]
  description: "6-slide LinkedIn carousel on building an authentic personal brand with 4 pillar slides."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: cv-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: cv-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: cv-eyebrow
        type: text
        z: 10
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "CAREER · PERSONAL BRAND" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: cv-title
        type: text
        z: 11
        x: 72
        y: 300
        width: 936
        height: 0
        content: { type: plain, value: "Build a personal\nbrand that\nactually works." }
        style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: cv-tagline
        type: text
        z: 12
        x: 72
        y: 820
        width: 936
        height: 0
        content: { type: plain, value: "4 pillars. Zero performative posts. Real opportunities." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: cv-rule
        type: rect
        z: 13
        x: 72
        y: 960
        width: 80
        height: 4
        fill: { type: solid, color: "$accent" }
      - id: cv-author
        type: text
        z: 14
        x: 72
        y: 990
        width: 936
        height: 0
        content: { type: plain, value: "Save → use → revisit quarterly." }
        style: { font_family: $body, font_size: 20, color: $text }
      - id: cv-page
        type: text
        z: 15
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "01 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Why Most Feel Fake ───────────────────────────
  - id: why-fake
    label: Why Most Feel Fake
    layers:
      - { id: wf-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: wf-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: wf-eyebrow
        type: text
        z: 10
        x: 72
        y: 180
        width: 936
        height: 0
        content: { type: plain, value: "WHY MOST BRANDS FEEL FAKE" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase }
      - id: wf-title
        type: text
        z: 11
        x: 72
        y: 240
        width: 936
        height: 0
        content: { type: plain, value: "Because they're\nperformance, not\nperspective." }
        style: { font_family: $heading, font_size: 64, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: wf-body
        type: text
        z: 12
        x: 72
        y: 660
        width: 936
        height: 0
        content: { type: plain, value: "Most LinkedIn brands sound like a press release wrote them. Generic platitudes, lifted vocabulary, no opinion strong enough to push anything away.\n\nA real brand has friction. It tells you what someone is for and what they're done with. That contrast is the entire signal." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: wf-stat
        type: text
        z: 13
        x: 72
        y: 1100
        width: 936
        height: 0
        content: { type: plain, value: "Specificity > polish. Always." }
        style: { font_family: $heading, font_size: 28, font_weight: 700, color: $primary, line_height: 1.3 }
      - id: wf-page
        type: text
        z: 14
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "02 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Pillar 1 ─────────────────────────────────────
  - id: pillar-1
    label: Pillar 1 · POV
    layers:
      - { id: p1-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: p1-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: p1-num
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "PILLAR 01" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: p1-title
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "A point of view." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: p1-body
        type: text
        z: 12
        x: 72
        y: 380
        width: 936
        height: 0
        content: { type: plain, value: "Pick one belief that splits your audience. Defend it for a year." }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.5 }
      - id: p1-a-label
        type: text
        z: 20
        x: 72
        y: 600
        width: 936
        height: 0
        content: { type: plain, value: "DO THIS WEEK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: p1-a1
        type: text
        z: 21
        x: 72
        y: 660
        width: 936
        height: 0
        content: { type: plain, value: "→  Write down 3 takes you'd defend at a dinner table." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: p1-a2
        type: text
        z: 22
        x: 72
        y: 800
        width: 936
        height: 0
        content: { type: plain, value: "→  Post the most polarizing one as a single short paragraph." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: p1-page
        type: text
        z: 30
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "03 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Pillar 2 ─────────────────────────────────────
  - id: pillar-2
    label: Pillar 2 · Receipts
    layers:
      - { id: p2-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: p2-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: p2-num
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "PILLAR 02" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: p2-title
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "Receipts." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: p2-body
        type: text
        z: 12
        x: 72
        y: 380
        width: 936
        height: 0
        content: { type: plain, value: "Show the work, not the credential. Outputs > titles." }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.5 }
      - id: p2-a-label
        type: text
        z: 20
        x: 72
        y: 600
        width: 936
        height: 0
        content: { type: plain, value: "DO THIS WEEK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: p2-a1
        type: text
        z: 21
        x: 72
        y: 660
        width: 936
        height: 0
        content: { type: plain, value: "→  Publish one artifact — repo, deck, write-up, talk." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: p2-a2
        type: text
        z: 22
        x: 72
        y: 800
        width: 936
        height: 0
        content: { type: plain, value: "→  Pin it to your profile. Update it every quarter." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: p2-page
        type: text
        z: 30
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "04 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Pillar 3 ─────────────────────────────────────
  - id: pillar-3
    label: Pillar 3 · Cadence
    layers:
      - { id: p3-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: p3-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: p3-num
        type: text
        z: 10
        x: 72
        y: 160
        width: 936
        height: 0
        content: { type: plain, value: "PILLAR 03" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: p3-title
        type: text
        z: 11
        x: 72
        y: 220
        width: 936
        height: 0
        content: { type: plain, value: "A boring cadence." }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: p3-body
        type: text
        z: 12
        x: 72
        y: 360
        width: 936
        height: 0
        content: { type: plain, value: "Consistency compounds. Two posts a week, every week, beats one viral month a year." }
        style: { font_family: $body, font_size: 24, color: $text_muted, line_height: 1.5 }
      - id: p3-a-label
        type: text
        z: 20
        x: 72
        y: 600
        width: 936
        height: 0
        content: { type: plain, value: "DO THIS WEEK" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36 }
      - id: p3-a1
        type: text
        z: 21
        x: 72
        y: 660
        width: 936
        height: 0
        content: { type: plain, value: "→  Pick two fixed slots in your week. Write into them." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: p3-a2
        type: text
        z: 22
        x: 72
        y: 800
        width: 936
        height: 0
        content: { type: plain, value: "→  Keep a running notes file of post ideas — never start blank." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 }
      - id: p3-page
        type: text
        z: 30
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "05 / 06" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 6 · Pillar 4 + CTA ───────────────────────────────
  - id: pillar-4-cta
    label: Pillar 4 + CTA
    layers:
      - { id: p4-bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 200, stops: [{ color: "$background", position: 0 }, { color: "$primary", position: 100 }] } }
      - { id: p4-accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: p4-num
        type: text
        z: 10
        x: 72
        y: 140
        width: 936
        height: 0
        content: { type: plain, value: "PILLAR 04" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36 }
      - id: p4-title
        type: text
        z: 11
        x: 72
        y: 200
        width: 936
        height: 0
        content: { type: plain, value: "Generosity." }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.03 }
      - id: p4-body
        type: text
        z: 12
        x: 72
        y: 360
        width: 936
        height: 0
        content: { type: plain, value: "Brand follows reciprocity. Help 10 people before you ask for one." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF", line_height: 1.5 }
      - id: p4-a1
        type: text
        z: 20
        x: 72
        y: 540
        width: 936
        height: 0
        content: { type: plain, value: "→  Reply to 5 posts a day with substance, not emoji." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF", line_height: 1.5 }
      - id: p4-a2
        type: text
        z: 21
        x: 72
        y: 660
        width: 936
        height: 0
        content: { type: plain, value: "→  Introduce two strangers who should know each other." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF", line_height: 1.5 }
      - id: p4-cta-heading
        type: text
        z: 30
        x: 72
        y: 880
        width: 936
        height: 0
        content: { type: plain, value: "Pick one pillar.\nStart Monday." }
        style: { font_family: $heading, font_size: 60, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.02 }
      - id: p4-cta-btn
        type: rect
        z: 31
        x: 72
        y: 1100
        width: 360
        height: 64
        radius: 32
        fill: { type: solid, color: "#FFFFFF" }
      - id: p4-cta-text
        type: text
        z: 32
        x: 72
        y: 1118
        width: 360
        height: 0
        content: { type: plain, value: "Follow for more →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: $primary, text_align: center }
      - id: p4-page
        type: text
        z: 33
        x: 800
        y: 1290
        width: 208
        height: 0
        content: { type: plain, value: "06 / 06" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[3].content.value", type: text, hint: "Cover title",          default: "Build a personal\nbrand that\nactually works." }
  - { id: cover_tagline,  path: "pages[0].layers[4].content.value", type: text, hint: "Cover tagline",        default: "4 pillars. Zero performative posts. Real opportunities." }
  - { id: why_title,      path: "pages[1].layers[3].content.value", type: text, hint: "Why fake title",       default: "Because they're\nperformance, not\nperspective." }
  - { id: why_body,       path: "pages[1].layers[4].content.value", type: text, hint: "Why fake body",        default: "Most LinkedIn brands sound like..." }
  - { id: p1_title,       path: "pages[2].layers[3].content.value", type: text, hint: "Pillar 1 title",       default: "A point of view." }
  - { id: p1_a1,          path: "pages[2].layers[6].content.value", type: text, hint: "Pillar 1 action 1",    default: "→  Write down 3 takes..." }
  - { id: p2_title,       path: "pages[3].layers[3].content.value", type: text, hint: "Pillar 2 title",       default: "Receipts." }
  - { id: p3_title,       path: "pages[4].layers[3].content.value", type: text, hint: "Pillar 3 title",       default: "A boring cadence." }
  - { id: p4_title,       path: "pages[5].layers[3].content.value", type: text, hint: "Pillar 4 title",       default: "Generosity." }
  - { id: cta_heading,    path: "pages[5].layers[7].content.value", type: text, hint: "CTA heading",          default: "Pick one pillar.\nStart Monday." }
