_protocol: template/v1

# 8-page product catalog — 1240×1754 A4 portrait, light-clean theme.
# Cover → 4 category pages (4 products each) → best sellers → size chart → order info/back.
meta:
  id: tmpl-product-catalog
  name: Product Catalog · 8 Pages
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, catalog, product, retail, ecommerce, a4]
  description: "Eight-page product catalog with brand cover, four category pages (sixteen products total), best sellers spread, size chart, and ordering information."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

pages:
  # ── Page 1 · Cover ─────────────────────────────────────────
  - id: cover
