_protocol: template/v1

# 8-slide product pitch deck — 1920×1080 landscape, corporate-slate theme.
# Story arc: vision → customer-quote → feature-compare → pricing
# → case-study → roadmap → demo → contact.
meta:
  id: tmpl-pitch-deck-product
  name: Pitch Deck · Product (8 slides)
  type: deck
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [deck, pitch, product, sales, corporate, landscape]
  description: "Eight-slide product pitch deck covering vision, social proof, feature comparison, pricing tiers, case study, roadmap, demo, and contact."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

pages:
  # ── Slide 1 · Product Vision ────────────────────────────────
  - id: vision
    label: Product Vision
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: side-panel, type: rect, z: 1, x: 0, y: 0, width: 640, height: 1080, fill: { type: linear, angle: 180, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: side-accent, type: rect, z: 2, x: 640, y: 0, width: 6, height: 1080, fill: { type: solid, color: "$primary" } }
      - { id: brand, type: text, z: 10, x: 80, y: 100, width: 480, height: 0, content: { type: plain, value: "◇ HELIX" }, style: { font_family: $heading, font_size: 24, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.4, text_transform: uppercase } }
      - { id: kicker, type: text, z: 11, x: 80, y: 400, width: 480, height: 0, content: { type: plain, value: "PRODUCT VISION" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 80, y: 450, width: 480, height: 0, content: { type: plain, value: "Helix" }, style: { font_family: $heading, font_size: 108, font_weight: 800, color: "#FFFFFF", line_height: 1, letter_spacing: -0.04 } }
      - { id: subtitle, type: text, z: 13, x: 80, y: 590, width: 480, height: 0, content: { type: plain, value: "Engineering knowledge,\nwoven into every PR." }, style: { font_family: $heading, font_size: 36, font_weight: 400, color: "#FFFFFF", line_height: 1.25 } }
      - { id: side-foot, type: text, z: 14, x: 80, y: 1000, width: 480, height: 0, content: { type: plain, value: "Q2 2026 · Product Brief" }, style: { font_family: $mono, font_size: 14, color: "#FFFFFF", letter_spacing: 0.2 } }
      - { id: right-eyebrow, type: text, z: 20, x: 720, y: 400, width: 1100, height: 0, content: { type: plain, value: "The thesis" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: right-head, type: text, z: 21, x: 720, y: 440, width: 1100, height: 0, content: { type: plain, value: "Code review is the slowest part of shipping software." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.2, letter_spacing: -0.02 } }
      - { id: right-body, type: text, z: 22, x: 720, y: 660, width: 1100, height: 0, content: { type: plain, value: "Helix reads every PR, surfaces the same five questions a senior engineer would ask, and learns your team's house style. Reviews go from 18 hours to 90 minutes — without losing the human in the loop." }, style: { font_family: $body, font_size: 22, color: $text_muted, line_height: 1.6 } }
      - { id: right-stat-row, type: rect, z: 23, x: 720, y: 880, width: 1100, height: 1, fill: { type: solid, color: "$border" } }
      - { id: stat-a-num, type: text, z: 24, x: 720, y: 910, width: 320, height: 0, content: { type: plain, value: "92%" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: stat-a-lbl, type: text, z: 24, x: 720, y: 980, width: 320, height: 0, content: { type: plain, value: "Reviews shipped same-day" }, style: { font_family: $body, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: stat-b-num, type: text, z: 25, x: 1080, y: 910, width: 320, height: 0, content: { type: plain, value: "12×" }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: stat-b-lbl, type: text, z: 25, x: 1080, y: 980, width: 320, height: 0, content: { type: plain, value: "Faster lead-time for changes" }, style: { font_family: $body, font_size: 14, color: $text_muted, letter_spacing: 0.2 } }
      - { id: counter, type: text, z: 30, x: 1740, y: 100, width: 100, height: 0, content: { type: plain, value: "01 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Slide 2 · Customer Quote ────────────────────────────────
  - id: customer-quote
    label: Customer Quote
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 160, y: 120, width: 1600, height: 0, content: { type: plain, value: "WHAT TEAMS SAY" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: open-quote, type: text, z: 11, x: 120, y: 170, width: 400, height: 0, content: { type: plain, value: "“" }, style: { font_family: $heading, font_size: 320, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: quote, type: text, z: 12, x: 240, y: 320, width: 1540, height: 0, content: { type: plain, value: "We cut review queue time by 70%. Our staff engineers actually have time to design systems again — Helix took the rubber-stamping off their plate." }, style: { font_family: $heading, font_size: 56, font_weight: 600, color: $text, line_height: 1.3, letter_spacing: -0.015 } }
      - { id: divider, type: rect, z: 13, x: 240, y: 760, width: 80, height: 4, fill: { type: solid, color: "$primary" } }
      - { id: author-avatar, type: circle, z: 14, cx: 280, cy: 850, rx: 40, ry: 40, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: author-initial, type: text, z: 15, x: 240, y: 832, width: 80, height: 0, content: { type: plain, value: "RT" }, style: { font_family: $heading, font_size: 22, font_weight: 800, color: "#FFFFFF", text_align: center } }
      - { id: author-name, type: text, z: 16, x: 340, y: 820, width: 700, height: 0, content: { type: plain, value: "Renée Takahashi" }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text } }
      - { id: author-role, type: text, z: 17, x: 340, y: 860, width: 700, height: 0, content: { type: plain, value: "VP Engineering · Linear" }, style: { font_family: $body, font_size: 18, color: $text_muted } }
      - { id: logo-strip-label, type: text, z: 18, x: 1100, y: 820, width: 700, height: 0, content: { type: plain, value: "TRUSTED BY 200+ TEAMS" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase, text_align: right } }
      - { id: logo-strip, type: text, z: 19, x: 1100, y: 860, width: 700, height: 0, content: { type: plain, value: "Linear · Vercel · Anthropic · Ramp · Notion" }, style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.04 } }
      - { id: counter, type: text, z: 20, x: 1740, y: 1010, width: 100, height: 0, content: { type: plain, value: "02 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Slide 3 · Feature Comparison (3 cols) ───────────────────
  - id: feature-comparison
    label: Feature Comparison
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "WHAT'S DIFFERENT" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "Three things off-the-shelf bots cannot do." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: col-1, type: rect, z: 20, x: 120, y: 360, width: 540, height: 600, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: col-1-num, type: text, z: 21, x: 160, y: 400, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.03 } }
      - { id: col-1-title, type: text, z: 22, x: 160, y: 540, width: 460, height: 0, content: { type: plain, value: "Codebase-aware" }, style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col-1-body, type: text, z: 23, x: 160, y: 600, width: 460, height: 0, content: { type: plain, value: "Indexes your full repo, ADRs, and recent PRs. Reviews quote precedent — not generic lint advice." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.6 } }
      - { id: col-1-feat, type: text, z: 24, x: 160, y: 780, width: 460, height: 0, content: { type: plain, value: "→ 8 indexed languages\n→ ADR retrieval\n→ Cross-repo refs" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: col-2, type: rect, z: 20, x: 690, y: 360, width: 540, height: 600, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: col-2-num, type: text, z: 21, x: 730, y: 400, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.03 } }
      - { id: col-2-title, type: text, z: 22, x: 730, y: 540, width: 460, height: 0, content: { type: plain, value: "Style-aware" }, style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col-2-body, type: text, z: 23, x: 730, y: 600, width: 460, height: 0, content: { type: plain, value: "Learns your team's review history. After 50 PRs, comments match your senior engineer's tone and rigor." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.6 } }
      - { id: col-2-feat, type: text, z: 24, x: 730, y: 780, width: 460, height: 0, content: { type: plain, value: "→ Tone calibration\n→ House-style rules\n→ Per-reviewer profiles" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: col-3, type: rect, z: 20, x: 1260, y: 360, width: 540, height: 600, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: col-3-num, type: text, z: 21, x: 1300, y: 400, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $primary, line_height: 1, letter_spacing: -0.03 } }
      - { id: col-3-title, type: text, z: 22, x: 1300, y: 540, width: 460, height: 0, content: { type: plain, value: "Self-hosted-friendly" }, style: { font_family: $heading, font_size: 30, font_weight: 700, color: $text, line_height: 1.2 } }
      - { id: col-3-body, type: text, z: 23, x: 1300, y: 600, width: 460, height: 0, content: { type: plain, value: "Runs against your VPC. No source code ever leaves your perimeter. SOC 2 Type II out of the box." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.6 } }
      - { id: col-3-feat, type: text, z: 24, x: 1300, y: 780, width: 460, height: 0, content: { type: plain, value: "→ VPC deployment\n→ BYO model option\n→ SOC 2 Type II" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.8 } }
      - { id: counter, type: text, z: 30, x: 1740, y: 1010, width: 100, height: 0, content: { type: plain, value: "03 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Slide 4 · Pricing Tiers ─────────────────────────────────
  - id: pricing
    label: Pricing
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "PRICING" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "Pick the plan that scales with you." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 } }
      - { id: t1-card, type: rect, z: 20, x: 200, y: 360, width: 440, height: 620, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: t1-label, type: text, z: 21, x: 240, y: 400, width: 360, height: 0, content: { type: plain, value: "STARTER" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: t1-price, type: text, z: 22, x: 240, y: 460, width: 360, height: 0, content: { type: plain, value: "$0" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1 } }
      - { id: t1-period, type: text, z: 23, x: 240, y: 560, width: 360, height: 0, content: { type: plain, value: "free for solo developers" }, style: { font_family: $body, font_size: 16, color: $text_muted } }
      - { id: t1-divider, type: rect, z: 24, x: 240, y: 610, width: 360, height: 1, fill: { type: solid, color: "$border" } }
      - { id: t1-feats, type: text, z: 25, x: 240, y: 640, width: 360, height: 0, content: { type: plain, value: "✓ 1 seat\n✓ 50 PR reviews / mo\n✓ Public repos only\n✓ Community support" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 2 } }
      - { id: t1-cta, type: text, z: 26, x: 240, y: 900, width: 360, height: 0, content: { type: plain, value: "Start free →" }, style: { font_family: $body, font_size: 18, font_weight: 600, color: $primary } }
      - { id: t2-card, type: rect, z: 20, x: 740, y: 320, width: 440, height: 700, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 }, effects: { shadow: [{ dx: 0, dy: 16, blur: 50, color: "rgba(99,102,241,0.25)" }] } }
      - { id: t2-badge, type: rect, z: 21, x: 870, y: 290, width: 180, height: 32, radius: 16, fill: { type: solid, color: "$primary" } }
      - { id: t2-badge-text, type: text, z: 22, x: 870, y: 298, width: 180, height: 0, content: { type: plain, value: "MOST POPULAR" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.3, text_align: center } }
      - { id: t2-label, type: text, z: 23, x: 780, y: 360, width: 360, height: 0, content: { type: plain, value: "TEAM" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: t2-price, type: text, z: 24, x: 780, y: 420, width: 360, height: 0, content: { type: plain, value: "$39" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1 } }
      - { id: t2-period, type: text, z: 25, x: 780, y: 520, width: 360, height: 0, content: { type: plain, value: "per developer / month" }, style: { font_family: $body, font_size: 16, color: $text_muted } }
      - { id: t2-divider, type: rect, z: 26, x: 780, y: 570, width: 360, height: 1, fill: { type: solid, color: "$border" } }
      - { id: t2-feats, type: text, z: 27, x: 780, y: 600, width: 360, height: 0, content: { type: plain, value: "✓ Unlimited seats\n✓ Unlimited PR reviews\n✓ Private repos\n✓ Style learning\n✓ Slack + email support" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 2 } }
      - { id: t2-cta, type: text, z: 28, x: 780, y: 940, width: 360, height: 0, content: { type: plain, value: "Start 14-day trial →" }, style: { font_family: $body, font_size: 18, font_weight: 600, color: $primary } }
      - { id: t3-card, type: rect, z: 20, x: 1280, y: 360, width: 440, height: 620, radius: 20, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: t3-label, type: text, z: 21, x: 1320, y: 400, width: 360, height: 0, content: { type: plain, value: "ENTERPRISE" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $secondary, letter_spacing: 0.4 } }
      - { id: t3-price, type: text, z: 22, x: 1320, y: 460, width: 360, height: 0, content: { type: plain, value: "Custom" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.1 } }
      - { id: t3-period, type: text, z: 23, x: 1320, y: 560, width: 360, height: 0, content: { type: plain, value: "annual contracts, volume tiers" }, style: { font_family: $body, font_size: 16, color: $text_muted } }
      - { id: t3-divider, type: rect, z: 24, x: 1320, y: 610, width: 360, height: 1, fill: { type: solid, color: "$border" } }
      - { id: t3-feats, type: text, z: 25, x: 1320, y: 640, width: 360, height: 0, content: { type: plain, value: "✓ Everything in Team\n✓ Self-hosted / VPC\n✓ BYO model option\n✓ SOC 2 + audit logs\n✓ Dedicated CSM + SLA" }, style: { font_family: $body, font_size: 16, color: $text, line_height: 2 } }
      - { id: t3-cta, type: text, z: 26, x: 1320, y: 900, width: 360, height: 0, content: { type: plain, value: "Talk to sales →" }, style: { font_family: $body, font_size: 18, font_weight: 600, color: $secondary } }
      - { id: counter, type: text, z: 30, x: 1740, y: 1040, width: 100, height: 0, content: { type: plain, value: "04 / 08" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right } }

  # ── Slide 5 · Case Study ────────────────────────────────────
  - id: case-study
    label: Case Study
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1920, height: 1080, fill: { type: solid, color: "$background" } }
      - { id: eyebrow, type: text, z: 10, x: 120, y: 120, width: 1680, height: 0, content: { type: plain, value: "CASE STUDY · LINEAR" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 120, y: 170, width: 1680, height: 0, content: { type: plain, value: "How Linear cut PR queue time by 70% in eight weeks." }, style: { font_family: $heading, font_size: 48, font_weight: 700, color: $text, line_height: 1.2, letter_spacing: -0.02 } }
      - { id: chal-card, type: rect, z: 20, x: 120, y: 360, width: 540, height: 520, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$border", width: 1 } }
      - { id: chal-label, type: text, z: 21, x: 160, y: 400, width: 460, height: 0, content: { type: plain, value: "THE CHALLENGE" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: chal-body, type: text, z: 22, x: 160, y: 440, width: 460, height: 0, content: { type: plain, value: "120-engineer team. Average PR sat 18 hours waiting for review. Senior engineers spent half their week on rubber-stamps. Hiring couldn't keep up with code volume." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.6 } }
      - { id: chal-stat-1, type: text, z: 23, x: 160, y: 700, width: 460, height: 0, content: { type: plain, value: "→ 18 hr median review queue" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.7 } }
      - { id: chal-stat-2, type: text, z: 23, x: 160, y: 740, width: 460, height: 0, content: { type: plain, value: "→ 47% senior time on review" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.7 } }
      - { id: chal-stat-3, type: text, z: 23, x: 160, y: 780, width: 460, height: 0, content: { type: plain, value: "→ NPS dropping from 62 → 41" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.7 } }
      - { id: sol-card, type: rect, z: 20, x: 690, y: 360, width: 540, height: 520, radius: 16, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 2 } }
      - { id: sol-label, type: text, z: 21, x: 730, y: 400, width: 460, height: 0, content: { type: plain, value: "WHAT WE DID" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: sol-body, type: text, z: 22, x: 730, y: 440, width: 460, height: 0, content: { type: plain, value: "Indexed 5 years of merged PRs. Calibrated Helix on house style. Routed mechanical comments to Helix; humans focused on architecture." }, style: { font_family: $body, font_size: 19, color: $text, line_height: 1.6 } }
      - { id: sol-stat-1, type: text, z: 23, x: 730, y: 700, width: 460, height: 0, content: { type: plain, value: "→ Week 1: ingest + dry-run" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.7 } }
      - { id: sol-stat-2, type: text, z: 23, x: 730, y: 740, width: 460, height: 0, content: { type: plain, value: "→ Week 4: shadow-mode on 80% of PRs" }, style: { font_family: $body, font_size: 17, color: $text_muted, line_height: 1.7 } }
