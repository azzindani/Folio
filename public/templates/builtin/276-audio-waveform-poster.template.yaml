_protocol: template/v1

# Audio waveform feature poster (1200×1800 portrait).
# Ocean-blue: stylized waveform (~40 rect bars), title + artist,
# BPM + key technical metadata bottom.
meta:
  id: tmpl-audio-waveform-poster
  name: Audio Waveform Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, audio, waveform, music, ocean, portrait]
  description: "Generic audio-waveform feature poster with title, artist, BPM, and key."

document:
  width: 1200
  height: 1800
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

layers:
