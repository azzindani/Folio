      angle: 175
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  - id: bg-bloom-top
    type: circle
    z: 1
    cx: 600
    cy: 200
    rx: 540
    ry: 540
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.35

  - id: bg-bloom-bottom
    type: circle
    z: 2
    cx: 600
    cy: 1600
    rx: 480
    ry: 480
    fill:
