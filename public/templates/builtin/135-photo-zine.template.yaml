_protocol: template/v1

# 8-page photo zine — 1080×1350 portrait, mono-print theme.
# Cover → 3 photo essays → photographer interview → 4th photo essay → gear list → back cover.
meta:
  id: tmpl-photo-zine
  name: Photo Zine · Mono (8 pages)
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, photo-zine, photography, mono, print, portrait]
  description: "Eight-page photo zine with cover, four photo essays, photographer interview, gear list, and back cover."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: mono-print

pages:
  # ── Page 1 · Cover ──────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hero-frame, type: rect, z: 5, x: 60, y: 60, width: 960, height: 1080, fill: { type: solid, color: "$text" } }
      - { id: hero-shadow, type: ellipse, z: 6, cx: 540, cy: 1080, rx: 320, ry: 40, fill: { type: solid, color: "#000000" }, opacity: 0.4 }
      - { id: hero-subject, type: rect, z: 7, x: 340, y: 360, width: 400, height: 600, radius: 4, fill: { type: solid, color: "$surface" }, opacity: 0.4 }
      - { id: hero-line-1, type: rect, z: 8, x: 60, y: 60, width: 960, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: hero-line-2, type: rect, z: 8, x: 60, y: 1138, width: 960, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: vol-bar, type: rect, z: 10, x: 60, y: 80, width: 200, height: 36, fill: { type: solid, color: "$primary" } }
      - { id: vol, type: text, z: 11, x: 60, y: 90, width: 200, height: 0, content: { type: plain, value: "ISSUE 09" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $background, text_align: center, letter_spacing: 0.5 } }
      - { id: date, type: text, z: 12, x: 820, y: 90, width: 140, height: 0, content: { type: plain, value: "MAY 2026" }, style: { font_family: $mono, font_size: 12, color: "$background", text_align: right, letter_spacing: 0.3, opacity: 0.7 } }
      - { id: corner-tl, type: text, z: 13, x: 80, y: 1080, width: 200, height: 0, content: { type: plain, value: "+" }, style: { font_family: $mono, font_size: 28, color: "$background", opacity: 0.6 } }
      - { id: corner-tr, type: text, z: 13, x: 880, y: 1080, width: 100, height: 0, content: { type: plain, value: "+" }, style: { font_family: $mono, font_size: 28, color: "$background", text_align: right, opacity: 0.6 } }
      - { id: title, type: text, z: 20, x: 60, y: 1180, width: 960, height: 0, content: { type: plain, value: "GREY HOURS" }, style: { font_family: $heading, font_size: 88, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.02 } }
      - { id: sub, type: text, z: 21, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "A photo essay · winter on the north sea" }, style: { font_family: $body, font_size: 18, font_style: italic, color: $text_muted, line_height: 1.4 } }
      - { id: by, type: text, z: 22, x: 60, y: 1310, width: 960, height: 0, content: { type: plain, value: "PHOTOGRAPHS · KIM JE-WON" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $text, letter_spacing: 0.5 } }

  # ── Page 2 · Photo Essay 1 ──────────────────────────────────
  - id: essay-1
    label: Essay 1
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hdr, type: text, z: 10, x: 80, y: 80, width: 920, height: 0, content: { type: plain, value: "GREY HOURS  /  I" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: hdr-rule, type: rect, z: 11, x: 80, y: 110, width: 920, height: 1, fill: { type: solid, color: "$text" } }
      - { id: photo-big, type: rect, z: 20, x: 80, y: 150, width: 920, height: 720, fill: { type: solid, color: "$text" } }
      - { id: photo-big-fade, type: rect, z: 21, x: 80, y: 150, width: 920, height: 720, fill: { type: linear, angle: 180, stops: [{ color: "transparent", position: 0 }, { color: "rgba(0,0,0,0.4)", position: 100 }] } }
      - { id: subj-1, type: rect, z: 22, x: 380, y: 400, width: 320, height: 360, radius: 4, fill: { type: solid, color: "$surface" }, opacity: 0.35 }
      - { id: subj-2, type: circle, z: 23, cx: 540, cy: 460, rx: 60, ry: 60, fill: { type: solid, color: "$primary" }, opacity: 0.5 }
      - { id: ph-corner-1, type: text, z: 24, x: 100, y: 170, width: 200, height: 0, content: { type: plain, value: "01 / 04" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.4 } }
      - { id: cap-1, type: text, z: 30, x: 80, y: 900, width: 920, height: 0, content: { type: plain, value: "Whitby pier, 6:42 AM. The fishermen who still go out in February." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: cap-1-meta, type: text, z: 31, x: 80, y: 960, width: 920, height: 0, content: { type: plain, value: "M6 · 35mm Summicron · TRI-X 400 · pushed to 1600" }, style: { font_family: $mono, font_size: 13, color: $text_muted, letter_spacing: 0.2 } }
      - { id: para, type: text, z: 40, x: 80, y: 1040, width: 920, height: 0, content: { type: plain, value: "I had been awake since five, drinking instant coffee in a parked car. The pier is silent at that hour except for the rope and the gulls and one man, always the same man, sweeping water off the planks. He has been doing this since I started coming. I do not know his name." }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.7 } }
      - { id: pg, type: text, z: 50, x: 880, y: 1290, width: 120, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 3 · Photo Essay 2 ──────────────────────────────────
  - id: essay-2
    label: Essay 2
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hdr, type: text, z: 10, x: 80, y: 80, width: 920, height: 0, content: { type: plain, value: "GREY HOURS  /  II" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: hdr-rule, type: rect, z: 11, x: 80, y: 110, width: 920, height: 1, fill: { type: solid, color: "$text" } }
      - { id: ph-a, type: rect, z: 20, x: 80, y: 150, width: 450, height: 540, fill: { type: solid, color: "$text" } }
      - { id: ph-a-mark, type: rect, z: 21, x: 200, y: 320, width: 200, height: 260, radius: 4, fill: { type: solid, color: "$surface" }, opacity: 0.3 }
      - { id: ph-a-num, type: text, z: 22, x: 100, y: 170, width: 200, height: 0, content: { type: plain, value: "02 / 04" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.4 } }
      - { id: ph-b, type: rect, z: 20, x: 550, y: 150, width: 450, height: 540, fill: { type: solid, color: "$text" } }
      - { id: ph-b-mark, type: circle, z: 21, cx: 775, cy: 420, rx: 130, ry: 130, fill: { type: solid, color: "$primary" }, opacity: 0.4 }
      - { id: ph-b-num, type: text, z: 22, x: 570, y: 170, width: 200, height: 0, content: { type: plain, value: "03 / 04" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.4 } }
      - { id: cap-a, type: text, z: 30, x: 80, y: 720, width: 450, height: 0, content: { type: plain, value: "Nets drying, Filey." }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text } }
      - { id: cap-a-meta, type: text, z: 31, x: 80, y: 760, width: 450, height: 0, content: { type: plain, value: "50mm · f/4 · 1/250" }, style: { font_family: $mono, font_size: 11, color: $text_muted, letter_spacing: 0.2 } }
      - { id: cap-b, type: text, z: 30, x: 550, y: 720, width: 450, height: 0, content: { type: plain, value: "Lamp post at low tide." }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text } }
      - { id: cap-b-meta, type: text, z: 31, x: 550, y: 760, width: 450, height: 0, content: { type: plain, value: "35mm · f/2 · 1/60" }, style: { font_family: $mono, font_size: 11, color: $text_muted, letter_spacing: 0.2 } }
      - { id: pull, type: text, z: 40, x: 80, y: 880, width: 920, height: 0, content: { type: plain, value: "“ I came back for the cold. The cold makes you patient. ”" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: $primary, line_height: 1.4, text_align: center } }
      - { id: pull-attrib, type: text, z: 41, x: 80, y: 980, width: 920, height: 0, content: { type: plain, value: "— a fisherman, name withheld" }, style: { font_family: $body, font_size: 13, color: $text_muted, text_align: center, letter_spacing: 0.3 } }
      - { id: body, type: text, z: 50, x: 80, y: 1060, width: 920, height: 0, content: { type: plain, value: "I have learned to wait, in these places, in a way that I cannot wait anywhere else. The light moves. The boats move. The fishermen — who are mostly retired men keeping company — do not move very much at all. I do not photograph them most days. Most days I only watch." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: pg, type: text, z: 60, x: 880, y: 1290, width: 120, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 4 · Photo Essay 3 ──────────────────────────────────
  - id: essay-3
    label: Essay 3
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hdr, type: text, z: 10, x: 80, y: 80, width: 920, height: 0, content: { type: plain, value: "GREY HOURS  /  III" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: hdr-rule, type: rect, z: 11, x: 80, y: 110, width: 920, height: 1, fill: { type: solid, color: "$text" } }
      - { id: ph-top, type: rect, z: 20, x: 80, y: 150, width: 920, height: 380, fill: { type: solid, color: "$text" } }
      - { id: ph-top-elem, type: rect, z: 21, x: 240, y: 240, width: 600, height: 200, radius: 4, fill: { type: solid, color: "$primary" }, opacity: 0.3 }
      - { id: ph-top-num, type: text, z: 22, x: 100, y: 170, width: 200, height: 0, content: { type: plain, value: "04 / 04 · WIDE" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.4 } }
      - { id: cap-top, type: text, z: 30, x: 80, y: 560, width: 920, height: 0, content: { type: plain, value: "Sandsend after the tide, 4:11 PM. The whole beach to ourselves." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: ph-bot-a, type: rect, z: 40, x: 80, y: 660, width: 600, height: 480, fill: { type: solid, color: "$text" } }
      - { id: ph-bot-a-mark, type: rect, z: 41, x: 220, y: 800, width: 320, height: 200, radius: 4, fill: { type: solid, color: "$surface" }, opacity: 0.3 }
      - { id: ph-bot-a-num, type: text, z: 42, x: 100, y: 680, width: 200, height: 0, content: { type: plain, value: "05 / DETAIL" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.4 } }
      - { id: side-quote, type: text, z: 50, x: 700, y: 680, width: 300, height: 0, content: { type: plain, value: "The day stays grey\nfor seventeen hours\nthis time of year." }, style: { font_family: $heading, font_size: 22, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: side-meta, type: text, z: 51, x: 700, y: 900, width: 300, height: 0, content: { type: plain, value: "RUNSWICK BAY, 54.5°N" }, style: { font_family: $mono, font_size: 11, color: $text_muted, letter_spacing: 0.4 } }
      - { id: side-body, type: text, z: 52, x: 700, y: 960, width: 300, height: 0, content: { type: plain, value: "Even at noon the sea is the same colour as the sky. I have come to find this beautiful, although it took me some years." }, style: { font_family: $body, font_size: 14, color: $text, line_height: 1.7 } }
      - { id: pg, type: text, z: 60, x: 880, y: 1290, width: 120, height: 0, content: { type: plain, value: "04" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 5 · Interview ──────────────────────────────────────
  - id: interview
    label: Interview
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hdr, type: text, z: 10, x: 80, y: 80, width: 920, height: 0, content: { type: plain, value: "CONVERSATION" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: hdr-rule, type: rect, z: 11, x: 80, y: 110, width: 920, height: 1, fill: { type: solid, color: "$text" } }
      - { id: title, type: text, z: 12, x: 80, y: 150, width: 920, height: 0, content: { type: plain, value: "On waiting,\nand cold hands." }, style: { font_family: $heading, font_size: 68, font_weight: 700, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: sub, type: text, z: 13, x: 80, y: 320, width: 920, height: 0, content: { type: plain, value: "A conversation with Kim Je-Won, recorded over a long lunch in February." }, style: { font_family: $heading, font_size: 18, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: portrait, type: rect, z: 20, x: 80, y: 400, width: 200, height: 200, radius: 100, fill: { type: solid, color: "$text" } }
      - { id: portrait-hl, type: circle, z: 21, cx: 180, cy: 480, rx: 60, ry: 60, fill: { type: solid, color: "$surface" }, opacity: 0.3 }
      - { id: name, type: text, z: 22, x: 320, y: 440, width: 680, height: 0, content: { type: plain, value: "Kim Je-Won" }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: bio, type: text, z: 23, x: 320, y: 490, width: 680, height: 0, content: { type: plain, value: "Photographer, b. 1981, Daegu.\nLives between Seoul and the North York Moors." }, style: { font_family: $body, font_size: 14, color: $text_muted, line_height: 1.6 } }
      - { id: q1, type: text, z: 30, x: 80, y: 660, width: 920, height: 0, content: { type: plain, value: "Q · You used to photograph cities. Then you stopped." }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $primary, line_height: 1.5 } }
      - { id: a1, type: text, z: 31, x: 80, y: 720, width: 920, height: 0, content: { type: plain, value: "I stopped enjoying it, which was the simpler half of the answer. The other half is that I had become very fast in cities — fast at seeing, fast at deciding — and I wanted to find out what I would photograph if I were slow. The sea makes you slow." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: q2, type: text, z: 30, x: 80, y: 880, width: 920, height: 0, content: { type: plain, value: "Q · The work is very still. Do you wait for the photograph?" }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $primary, line_height: 1.5 } }
      - { id: a2, type: text, z: 31, x: 80, y: 940, width: 920, height: 0, content: { type: plain, value: "I wait for myself, mostly. The photographs are already there. They are there for hours. I am the one who needs to arrive." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: q3, type: text, z: 30, x: 80, y: 1080, width: 920, height: 0, content: { type: plain, value: "Q · Film, in 2026. Why." }, style: { font_family: $heading, font_size: 18, font_weight: 700, color: $primary, line_height: 1.5 } }
      - { id: a3, type: text, z: 31, x: 80, y: 1140, width: 920, height: 0, content: { type: plain, value: "I like the limit. Thirty-six frames. You put down the camera between them. You walk. You think. It is a different kind of attention." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.7 } }
      - { id: pg, type: text, z: 60, x: 880, y: 1290, width: 120, height: 0, content: { type: plain, value: "05" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 6 · Photo Essay 4 ──────────────────────────────────
  - id: essay-4
    label: Essay 4
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hdr, type: text, z: 10, x: 80, y: 80, width: 920, height: 0, content: { type: plain, value: "GREY HOURS  /  IV  ·  CODA" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: hdr-rule, type: rect, z: 11, x: 80, y: 110, width: 920, height: 1, fill: { type: solid, color: "$text" } }
      - { id: ph-full, type: rect, z: 20, x: 80, y: 150, width: 920, height: 880, fill: { type: solid, color: "$text" } }
      - { id: ph-full-grad, type: rect, z: 21, x: 80, y: 150, width: 920, height: 880, fill: { type: linear, angle: 180, stops: [{ color: "transparent", position: 0 }, { color: "transparent", position: 70 }, { color: "rgba(0,0,0,0.5)", position: 100 }] } }
      - { id: ph-figure, type: rect, z: 22, x: 420, y: 580, width: 160, height: 280, radius: 4, fill: { type: solid, color: "$primary" }, opacity: 0.4 }
      - { id: ph-horizon, type: rect, z: 23, x: 80, y: 580, width: 920, height: 1, fill: { type: solid, color: "$surface" }, opacity: 0.4 }
      - { id: ph-num, type: text, z: 24, x: 100, y: 170, width: 200, height: 0, content: { type: plain, value: "06 / 06 · FINAL" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: "$background", letter_spacing: 0.4 } }
      - { id: ph-caption-inset, type: text, z: 25, x: 100, y: 990, width: 920, height: 0, content: { type: plain, value: "Last frame, last roll." }, style: { font_family: $heading, font_size: 16, font_style: italic, color: "$background", opacity: 0.85 } }
      - { id: cap, type: text, z: 30, x: 80, y: 1060, width: 920, height: 0, content: { type: plain, value: "Robin Hood's Bay, 7:38 PM. Sun gone. Same as it was." }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, line_height: 1.4 } }
      - { id: cap-meta, type: text, z: 31, x: 80, y: 1120, width: 920, height: 0, content: { type: plain, value: "M6 · 35mm · f/2.8 · 1/15 · TRI-X 400" }, style: { font_family: $mono, font_size: 12, color: $text_muted, letter_spacing: 0.2 } }
      - { id: end-mark, type: text, z: 40, x: 80, y: 1200, width: 920, height: 0, content: { type: plain, value: "FIN  ◇" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, text_align: center, letter_spacing: 0.5 } }
      - { id: pg, type: text, z: 60, x: 880, y: 1290, width: 120, height: 0, content: { type: plain, value: "06" }, style: { font_family: $mono, font_size: 13, color: $text_muted, text_align: right, letter_spacing: 0.3 } }

  # ── Page 7 · Gear List ──────────────────────────────────────
  - id: gear
    label: Gear List
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: hdr, type: text, z: 10, x: 80, y: 80, width: 920, height: 0, content: { type: plain, value: "WHAT I CARRIED" }, style: { font_family: $mono, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: hdr-rule, type: rect, z: 11, x: 80, y: 110, width: 920, height: 1, fill: { type: solid, color: "$text" } }
      - { id: title, type: text, z: 12, x: 80, y: 150, width: 920, height: 0, content: { type: plain, value: "Gear list." }, style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: intro, type: text, z: 13, x: 80, y: 240, width: 920, height: 0, content: { type: plain, value: "All photographs in this issue were made with the following kit. Nothing here is precious; almost everything was bought used." }, style: { font_family: $body, font_size: 16, font_style: italic, color: $text_muted, line_height: 1.6 } }
      - { id: cam-label, type: text, z: 20, x: 80, y: 360, width: 920, height: 0, content: { type: plain, value: "CAMERAS" }, style: { font_family: $mono, font_size: 11, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: cam-rule, type: rect, z: 21, x: 80, y: 390, width: 920, height: 1, fill: { type: solid, color: "$border" } }
      - { id: g1-name, type: text, z: 22, x: 80, y: 420, width: 600, height: 0, content: { type: plain, value: "Leica M6 (1985, .72×)" }, style: { font_family: $heading, font_size: 18, color: $text, line_height: 1.5 } }
