      color: $text

  - id: i2-body
    type: text
    z: 58
    x: 90
    y: 1410
    width: 900
    height: 0
    content: { type: plain, value: "Queue backlog after a deploy regression delayed webhook delivery up to 18 minutes. All queued events delivered. Added regression test." }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.55

  # ── Incident 3 ────────────────────────────────────────────
  - id: i3-bg
    type: rect
    z: 59
    x: 60
    y: 1540
    width: 960
    height: 220
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: i3-date
    type: text
    z: 60
