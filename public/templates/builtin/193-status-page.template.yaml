  # ── Service row 4 — Webhooks ─────────────────────────────
  - id: svc4-bg
    type: rect
    z: 33
    x: 60
    y: 690
    width: 960
    height: 80
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: svc4-dot
    type: circle
    z: 34
    cx: 100
    cy: 730
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: svc4-name
    type: text
    z: 35
    x: 130
    y: 716
    width: 500
    height: 0
    content: { type: plain, value: "Webhooks Delivery" }
    style:
