    width: 960
    height: 80
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: svc6-dot
    type: circle
    z: 42
    cx: 100
    cy: 910
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: svc6-name
    type: text
    z: 43
    x: 130
    y: 896
    width: 500
    height: 0
    content: { type: plain, value: "Database Cluster" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  - id: svc6-up
    type: text
    z: 44
    x: 60
    y: 896
    width: 960
    height: 0
    content: { type: plain, value: "99.999% · operational" }
    style:
      font_family: $mono
      font_size: 16
      color: $accent
      text_align: right

  # ── Incident history header ───────────────────────────────
  - id: inc-hdr
    type: text
    z: 50
    x: 60
    y: 1020
    width: 960
    height: 0
    content: { type: plain, value: "RECENT INCIDENTS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.3

  # ── Incident 1 ────────────────────────────────────────────
  - id: i1-bg
    type: rect
    z: 51
    x: 60
    y: 1060
    width: 960
    height: 220
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: i1-date
    type: text
    z: 52
    x: 90
    y: 1086
    width: 900
    height: 0
    content: { type: plain, value: "MAY 14 · RESOLVED · 47 min" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $accent
      letter_spacing: 0.2

  - id: i1-title
    type: text
    z: 53
    x: 90
    y: 1118
    width: 900
    height: 0
    content: { type: plain, value: "Elevated API latency in EU-West-2" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 700
      color: $text

  - id: i1-body
    type: text
    z: 54
    x: 90
    y: 1170
    width: 900
    height: 0
    content: { type: plain, value: "A misconfigured connection pool caused P95 latency to rise to 800ms. Rolled back at 14:23 UTC; latency normalized within 4 minutes." }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      line_height: 1.55

  # ── Incident 2 ────────────────────────────────────────────
  - id: i2-bg
    type: rect
    z: 55
    x: 60
    y: 1300
    width: 960
    height: 220
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: i2-date
    type: text
    z: 56
    x: 90
    y: 1326
    width: 900
    height: 0
