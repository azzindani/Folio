    cy: 820
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: svc5-name
    type: text
    z: 39
    x: 130
    y: 806
    width: 500
    height: 0
    content: { type: plain, value: "Static CDN" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  - id: svc5-up
    type: text
    z: 40
    x: 60
    y: 806
    width: 960
    height: 0
