_protocol: template/v1

# Status dashboard page — 1080×1920 portrait, dark-tech theme.
# Operational banner, 6 service rows w/ uptime, 3 past incidents.
meta:
  id: tmpl-status-page
  name: Status Page
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [web, app, screen, status, uptime, portrait, dark]
  description: "Service status dashboard with operational banner, service uptime rows, and recent incident history."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  # ── Brand strip ───────────────────────────────────────────
  - id: brand
    type: text
    z: 5
    x: 60
    y: 70
    width: 960
    height: 0
    content: { type: plain, value: "ACME · STATUS" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.24

  - id: ts
    type: text
    z: 6
    x: 60
    y: 70
    width: 960
    height: 0
    content: { type: plain, value: "Updated · just now" }
    style:
      font_family: $mono
      font_size: 14
      color: $text_muted
      text_align: right

  # ── Overall banner ────────────────────────────────────────
  - id: banner
    type: rect
    z: 10
    x: 60
    y: 130
    width: 960
    height: 180
    radius: 16
    fill: { type: solid, color: "rgba(16,185,129,0.14)" }
    stroke: { color: "$accent", width: 2 }

  - id: banner-dot
    type: circle
    z: 11
    cx: 130
    cy: 220
    rx: 18
    ry: 18
    fill: { type: solid, color: "$accent" }

  - id: banner-text
    type: text
    z: 12
    x: 180
    y: 175
    width: 800
    height: 0
    content: { type: plain, value: "All Systems Operational" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: $text
      letter_spacing: -0.01

  - id: banner-sub
    type: text
    z: 13
    x: 180
    y: 235
    width: 800
    height: 0
    content: { type: plain, value: "All 6 services are running normally. No active incidents." }
    style:
      font_family: $body
      font_size: 18
      color: $text_muted

  # ── Services section header ───────────────────────────────
  - id: svc-hdr
    type: text
    z: 20
    x: 60
    y: 380
    width: 960
    height: 0
    content: { type: plain, value: "SERVICES" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $text_muted
      letter_spacing: 0.3

  # ── Service row 1 — API ──────────────────────────────────
  - id: svc1-bg
    type: rect
    z: 21
    x: 60
    y: 420
    width: 960
    height: 80
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: svc1-dot
    type: circle
    z: 22
    cx: 100
    cy: 460
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: svc1-name
    type: text
    z: 23
    x: 130
    y: 446
    width: 500
    height: 0
    content: { type: plain, value: "API Gateway" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: $text

  - id: svc1-up
    type: text
    z: 24
    x: 60
    y: 446
    width: 960
    height: 0
    content: { type: plain, value: "99.998% · operational" }
    style:
      font_family: $mono
      font_size: 16
      color: $accent
      text_align: right

  # ── Service row 2 — Dashboard ────────────────────────────
  - id: svc2-bg
    type: rect
    z: 25
    x: 60
    y: 510
    width: 960
    height: 80
    radius: 12
