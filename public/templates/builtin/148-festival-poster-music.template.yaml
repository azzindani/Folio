_protocol: template/v1

# Music festival poster (1200×1800 portrait).
# Sunset-glow sky gradient, big festival name top, three-tier lineup
# (headliners big, mid acts medium, support small), dates + location.
meta:
  id: tmpl-festival-poster-music
  name: Festival Poster — Music
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, festival, music, lineup, summer, sunset]
  description: "Sunset-sky music festival poster with festival name and three-tier lineup."

document:
  width: 1200
  height: 1800
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1800
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$secondary", position: 0 }
        - { color: "$primary", position: 50 }
        - { color: "$background", position: 100 }

  - id: sun-disc
    type: circle
    z: 1
    cx: 600
    cy: 940
    rx: 380
    ry: 380
    fill:
      type: radial
      stops:
        - { color: "#FFF1D0", position: 0 }
        - { color: "$primary", position: 100 }
    opacity: 0.85

  - id: sun-ring
    type: circle
    z: 2
    cx: 600
    cy: 940
    rx: 440
    ry: 440
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 1 }
    opacity: 0.55

  - id: skyline-1
    type: rect
    z: 3
    x: 0
    y: 1140
    width: 1200
    height: 4
    fill: { type: solid, color: "$primary" }
    opacity: 0.4

  - id: skyline-2
    type: rect
    z: 4
    x: 0
    y: 1170
    width: 1200
    height: 2
    fill: { type: solid, color: "$primary" }
    opacity: 0.25

  - id: festival-eyebrow
    type: text
    z: 10
    x: 80
    y: 140
    width: 1040
    height: 0
    content: { type: plain, value: "THREE DAYS · TWO STAGES · ONE COAST" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $text
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: festival-name-1
    type: text
    z: 11
    x: 60
    y: 220
    width: 1080
    height: 0
    content: { type: plain, value: "GOLDEN" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 900
      color: $text
      line_height: 0.88
      letter_spacing: -0.04
      text_align: center
      text_transform: uppercase

  - id: festival-name-2
    type: text
    z: 12
    x: 60
    y: 380
    width: 1080
    height: 0
    content: { type: plain, value: "MERIDIAN" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 900
      color: $text
      line_height: 0.88
      letter_spacing: -0.04
      text_align: center
      text_transform: uppercase

  - id: festival-rule
    type: rect
    z: 13
    x: 460
    y: 580
    width: 280
    height: 3
    fill: { type: solid, color: "$text" }

  - id: dates
    type: text
    z: 14
    x: 80
    y: 610
    width: 1040
    height: 0
    content: { type: plain, value: "AUGUST 7 · 8 · 9 · 2026" }
    style:
      font_family: $heading
      font_size: 40
      font_weight: 800
      color: $text
      letter_spacing: 0.12
      text_align: center
      text_transform: uppercase

  - id: location
    type: text
    z: 15
    x: 80
    y: 670
    width: 1040
    height: 0
    content: { type: plain, value: "COSTA SERENA · PORTUGAL" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 700
      color: $text
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: lineup-label
    type: text
    z: 20
    x: 80
    y: 1240
    width: 1040
    height: 0
    content: { type: plain, value: "— FEATURING —" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $text
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: headliner-1
    type: text
    z: 21
    x: 80
    y: 1290
    width: 1040
    height: 0
    content: { type: plain, value: "THE FLORENCE BIRDS" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 900
      color: $text
      line_height: 1.05
      letter_spacing: -0.01
      text_align: center
      text_transform: uppercase

  - id: headliner-2
    type: text
    z: 22
    x: 80
    y: 1370
    width: 1040
    height: 0
    content: { type: plain, value: "RIVER STATIC" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 900
      color: $text
      line_height: 1.05
      letter_spacing: -0.01
      text_align: center
      text_transform: uppercase

  - id: headliner-3
    type: text
    z: 23
    x: 80
    y: 1450
    width: 1040
    height: 0
    content: { type: plain, value: "CASSIA RAINE" }
    style:
      font_family: $heading
      font_size: 64
      font_weight: 900
      color: $text
      line_height: 1.05
      letter_spacing: -0.01
      text_align: center
      text_transform: uppercase

  - id: mid-acts
    type: text
    z: 24
    x: 80
    y: 1550
    width: 1040
    height: 0
    content:
      type: plain
      value: "ATLAS NORTH · MARIN VEGA · OK PARADE\nLOW TIDE BAND · SAFFRON CITY · WILD POSTAGE"
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text
      line_height: 1.25
      letter_spacing: 0.02
      text_align: center
      text_transform: uppercase

  - id: support-acts
    type: text
    z: 25
    x: 80
    y: 1660
    width: 1040
    height: 0
    content: { type: plain, value: "+ HAZEL LOOP · MOTH SONGS · CITRINE CITRINE · HARBOUR HARBOUR · OVERLAND · SUNDIAL TWO" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 600
      color: $text
      letter_spacing: 0.32
      text_align: center
      text_transform: uppercase

  - id: footer
    type: text
    z: 30
    x: 80
    y: 1740
    width: 1040
    height: 0
    content: { type: plain, value: "WEEKEND PASS €189 · GOLDENMERIDIAN.PT" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: $text
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

slots:
  - { id: festival_name, path: "layers[6].content.value",  type: text, hint: "Festival name line 1",      default: "GOLDEN" }
  - { id: festival_name_line_2, path: "layers[7].content.value", type: text, hint: "Festival name line 2", default: "MERIDIAN" }
  - { id: dates,         path: "layers[9].content.value",  type: text, hint: "Festival dates",            default: "AUGUST 7 · 8 · 9 · 2026" }
  - { id: location,      path: "layers[10].content.value", type: text, hint: "Festival location",         default: "COSTA SERENA · PORTUGAL" }
  - { id: headliner_1,   path: "layers[12].content.value", type: text, hint: "Headliner act 1",           default: "THE FLORENCE BIRDS" }
  - { id: headliner_2,   path: "layers[13].content.value", type: text, hint: "Headliner act 2",           default: "RIVER STATIC" }
  - { id: headliner_3,   path: "layers[14].content.value", type: text, hint: "Headliner act 3",           default: "CASSIA RAINE" }
