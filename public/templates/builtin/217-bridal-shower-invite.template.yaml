_protocol: template/v1

# Bridal shower invite — 1080×1500 portrait, editorial-cream theme.
# Thin-rule frame, italic display name, hosted-by + dress code + registry hint.
meta:
  id: tmpl-bridal-shower-invite
  name: Bridal Shower Invite
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, invitation, bridal, shower, elegant, cream, portrait]
  description: "Elegant bridal shower invite with bride-to-be name in italic script, host line, and event details."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }

  # ── Thin rule frame ──────────────────────────────────────
  - { id: outer-frame, type: rect, z: 1, x: 70, y: 70, width: 940, height: 1360, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
  - { id: inner-frame, type: rect, z: 2, x: 88, y: 88, width: 904, height: 1324, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }

  # ── Top ornament ─────────────────────────────────────────
  - { id: flourish-top, type: text, z: 5, x: 80, y: 220, width: 920, height: 0, content: { type: plain, value: "❦  ·  ❦  ·  ❦" }, style: { font_family: $heading, font_size: 28, color: "$primary", text_align: center, letter_spacing: 0.4 } }

  - { id: eyebrow, type: text, z: 10, x: 80, y: 320, width: 920, height: 0, content: { type: plain, value: "BRIDAL SHOWER" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.8, text_transform: uppercase } }

  - { id: inviting, type: text, z: 11, x: 80, y: 400, width: 920, height: 0, content: { type: plain, value: "in celebration of" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: "$text_muted", text_align: center } }

  - { id: bride-name, type: text, z: 12, x: 80, y: 470, width: 920, height: 0, content: { type: plain, value: "Charlotte Aveline" }, style: { font_family: $heading, font_size: 96, font_weight: 400, font_style: italic, color: "$primary", text_align: center, line_height: 1.1, letter_spacing: -0.01 } }

  - { id: bride-bride, type: text, z: 13, x: 80, y: 620, width: 920, height: 0, content: { type: plain, value: "the bride-to-be" }, style: { font_family: $body, font_size: 20, color: "$text_muted", text_align: center, letter_spacing: 0.3 } }

  - { id: divider, type: rect, z: 14, x: 490, y: 700, width: 100, height: 1, fill: { type: solid, color: "$primary" } }

  - { id: hosted-by-lbl, type: text, z: 15, x: 80, y: 740, width: 920, height: 0, content: { type: plain, value: "HOSTED BY" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.5 } }
  - { id: host-names,    type: text, z: 16, x: 80, y: 780, width: 920, height: 0, content: { type: plain, value: "Eleanor Aveline & Margot Pierce" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: "$text", text_align: center, line_height: 1.3 } }

  # ── Details ──────────────────────────────────────────────
  - { id: date,  type: text, z: 20, x: 80, y: 900, width: 920, height: 0, content: { type: plain, value: "Saturday, the twenty-second of August" }, style: { font_family: $heading, font_size: 28, font_style: italic, color: "$text", text_align: center, line_height: 1.4 } }
  - { id: time,  type: text, z: 21, x: 80, y: 950, width: 920, height: 0, content: { type: plain, value: "one o'clock in the afternoon" }, style: { font_family: $heading, font_size: 24, font_style: italic, color: "$text_muted", text_align: center } }

  - { id: divider-2, type: rect, z: 22, x: 490, y: 1020, width: 100, height: 1, fill: { type: solid, color: "$primary" } }

  - { id: venue-lbl, type: text, z: 23, x: 80, y: 1060, width: 920, height: 0, content: { type: plain, value: "AT" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.5 } }
  - { id: venue,     type: text, z: 24, x: 80, y: 1100, width: 920, height: 0, content: { type: plain, value: "The Rosewood Tea Room" }, style: { font_family: $heading, font_size: 32, font_weight: 600, color: "$text", text_align: center, line_height: 1.3 } }
  - { id: venue-addr,type: text, z: 25, x: 80, y: 1150, width: 920, height: 0, content: { type: plain, value: "47 Old Marlborough Road · Cambridge, MA" }, style: { font_family: $body, font_size: 18, color: "$text_muted", text_align: center } }

  # ── Footer notes ─────────────────────────────────────────
  - { id: dress-lbl, type: text, z: 30, x: 80, y: 1240, width: 920, height: 0, content: { type: plain, value: "DRESS CODE" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$primary", text_align: center, letter_spacing: 0.5 } }
  - { id: dress,     type: text, z: 31, x: 80, y: 1275, width: 920, height: 0, content: { type: plain, value: "Garden tea attire · soft pastels encouraged" }, style: { font_family: $heading, font_size: 20, font_style: italic, color: "$text", text_align: center } }

  - { id: registry-hint, type: text, z: 32, x: 80, y: 1340, width: 920, height: 0, content: { type: plain, value: "Registry details enclosed · charlotteandwill.com/registry" }, style: { font_family: $body, font_size: 16, color: "$text_muted", text_align: center, letter_spacing: 0.2 } }

  - { id: flourish-bot, type: text, z: 33, x: 80, y: 1390, width: 920, height: 0, content: { type: plain, value: "❦" }, style: { font_family: $heading, font_size: 24, color: "$primary", text_align: center } }

slots:
  - { id: bride_name, path: "layers[6].content.value",  type: text, hint: "Bride-to-be name",    default: "Charlotte Aveline" }
  - { id: host_names, path: "layers[10].content.value", type: text, hint: "Host(s) name(s)",     default: "Eleanor Aveline & Margot Pierce" }
  - { id: date,       path: "layers[11].content.value", type: text, hint: "Shower date",         default: "Saturday, the twenty-second of August" }
  - { id: time,       path: "layers[12].content.value", type: text, hint: "Shower time",         default: "one o'clock in the afternoon" }
  - { id: venue,      path: "layers[15].content.value", type: text, hint: "Venue name",          default: "The Rosewood Tea Room" }
  - { id: dress_code, path: "layers[18].content.value", type: text, hint: "Dress code line",     default: "Garden tea attire · soft pastels encouraged" }
