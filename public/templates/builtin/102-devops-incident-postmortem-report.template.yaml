      - id: section-timeline
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Incident Timeline**"

      - id: timeline-body
        type: rich_text
        x: 60
        y: 460
        width: 1160
        height: 380
        format: markdown
        font_family: IBM Plex Mono
        font_size: 14
        line_height: 1.7
        content: |
          - **14:18 UTC** — Synthetic check `auth.token.validate` exceeds 500ms SLO. PagerDuty fires P2 to on-call SRE (A. Rivera).
          - **14:24 UTC** — On-call acknowledges. Initial scan shows Redis cluster node `redis-auth-3` reporting OK in cluster view but unreachable from `auth-service` pods in `us-east-2`.
          - **14:31 UTC** — Customer reports begin. Status page set to *Investigating*. Incident escalated to **SEV-2**.
          - **14:42 UTC** — p99 latency on `auth-service` crosses 3s. Login success rate drops to 18%. Escalated to **SEV-1**, incident commander assigned (J. Tanaka).
          - **14:58 UTC** — Hypothesis: Redis cluster split-brain after the 13:50 node-pool autoscale event. Engineering bridge convened (6 responders).
          - **15:14 UTC** — Manual quorum recovery initiated. First rollback: scale auth-service to 0 replicas for 90 seconds to drain stale connections.
          - **15:27 UTC** — Redis cluster healthy. Auth latency returns to baseline. Replicas scaled back up to 12 (from 6).
          - **15:48 UTC** — Webhook dispatcher backlog drained. Search service degradation resolves. Status page set to *Monitoring*.
          - **16:06 UTC** — All synthetics green for 30 consecutive minutes. Incident closed. Total user impact: **1h 48m**.

      - id: section-services
        type: rich_text
        x: 60
        y: 880
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Service Impact**"

      - id: tbl-services
        type: interactive_table
        x: 60
        y: 940
        width: 1160
        height: 480
        data_ref: service_impact
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: service,          title: Service,           width: 320, sortable: true }
          - { field: downtime_min,     title: Downtime (min),    width: 220, sortable: true, formatter: number, align: right }
          - { field: requests_dropped, title: Requests Dropped,  width: 280, sortable: true, formatter: number, align: right }
          - { field: status,           title: Status,            width: 280, sortable: true, formatter: badge }

      - id: section-latency
        type: rich_text
        x: 60
        y: 1460
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**p99 Latency — auth-service**"

      - id: chart-latency
        type: interactive_chart
        x: 60
        y: 1520
        width: 1160
        height: 360
        chart_type: line
        data_ref: latency_p99
        x_field: time
        y_field: p99_ms
        title: p99 Latency (ms) vs Baseline — 14:00 → 16:00 UTC
        legend: true
        grid: true
        animate: true

      - id: section-rca
        type: rich_text
        x: 60
        y: 1920
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Root Cause Analysis**"

      - id: rca-body
        type: rich_text
        x: 60
        y: 1980
        width: 1160
        height: 200
        format: markdown
        font_family: Inter
        font_size: 15
        line_height: 1.7
        content: |
          **Trigger.** At 13:50 UTC the Kubernetes node-pool autoscaler evicted three nodes in `us-east-2a` that hosted Redis cluster members. Replacement nodes came up in `us-east-2b`, but a misconfigured `NetworkPolicy` (introduced two weeks earlier by PR #4218) blocked east-west traffic between AZs on port 6379.

          **Contributing factors.** (1) Redis cluster health-check reported nodes as `OK` because the cluster gossip protocol travels on a different port. (2) Auth-service connection pool held stale connections for the full 5-minute idle timeout, causing requests to queue rather than fail-fast. (3) No circuit breaker on the Redis client meant the entire pod hung instead of degrading to a cached-token mode.

          **What went well.** Synthetic checks fired within 24 seconds of customer-visible impact. Incident commander rotation worked as designed — handover at the 1-hour mark was clean. Status page updates were posted within SLO (5 min cadence).

      - id: section-actions
        type: rich_text
        x: 60
        y: 2220
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Action Items**"

      - id: tbl-actions
        type: interactive_table
        x: 60
        y: 2280
        width: 1160
        height: 460
        data_ref: action_items
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: id,     title: ID,     width: 110, sortable: true }
          - { field: item,   title: Action, width: 540, sortable: true }
          - { field: owner,  title: Owner,  width: 200, sortable: true, formatter: badge }
          - { field: status, title: Status, width: 180, sortable: true, formatter: badge }
          - { field: due,    title: Due,    width: 130, sortable: true }

