        currency: USD

      - id: kpi-pages
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: PagerDuty Pages
        value: 38
        format: number

      - id: kpi-rollbacks
        type: kpi_card
        x: 1036
