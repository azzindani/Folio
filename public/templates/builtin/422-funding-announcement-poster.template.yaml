_protocol: template/v1

# Single-page funding announcement poster. LinkedIn 4:5 portrait.
# Eyebrow + giant $amount + caption + 3 fact cards + CTA. Cyber-synthwave theme.
meta:
  id: tmpl-funding-announcement-poster
  name: Funding Announcement Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, startup, founder, funding, announcement, 4-5, cyber-synthwave]
  description: "LinkedIn 4:5 funding announcement poster: amount, caption, 3 fact cards (lead/use/team), and a hiring CTA."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: cyber-synthwave

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: linear, angle: 165, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }

  - { id: accent-dot, type: circle, z: 5, cx: 1110, cy: 130, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "SERIES A · ANNOUNCEMENT" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.36
      text_transform: uppercase

  - id: amount
    type: text
    z: 21
    x: 80
    y: 200
    width: 1040
    height: 0
    content: { type: plain, value: "$12M" }
    style:
      font_family: $heading
      font_size: 260
      font_weight: 900
      color: $primary
      line_height: 1.0
      letter_spacing: -0.04

  - id: caption
    type: text
    z: 22
    x: 80
    y: 540
    width: 1040
    height: 0
    content: { type: plain, value: "…to bring Folio Studio to 10× more customers." }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 700
      color: $text
      line_height: 1.25
      letter_spacing: -0.01

  - { id: divider-1, type: rect, z: 10, x: 80, y: 720, width: 1040, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }

  - { id: card-1-bg, type: rect, z: 30, x: 80, y: 760, width: 320, height: 220, radius: 16, fill: { type: solid, color: "$surface" } }
  - id: card-1-label
    type: text
    z: 31
    x: 112
    y: 790
    width: 256
    height: 0
    content: { type: plain, value: "LEAD INVESTOR" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
  - id: card-1-value
    type: text
    z: 32
    x: 112
    y: 830
    width: 256
    height: 0
    content: { type: plain, value: "Founders\nFund" }
    style: { font_family: $heading, font_size: 38, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.01 }

  - { id: card-2-bg, type: rect, z: 30, x: 440, y: 760, width: 320, height: 220, radius: 16, fill: { type: solid, color: "$surface" } }
  - id: card-2-label
    type: text
    z: 31
    x: 472
    y: 790
    width: 256
    height: 0
    content: { type: plain, value: "USE OF FUNDS" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
  - id: card-2-value
    type: text
    z: 32
    x: 472
    y: 830
    width: 256
    height: 0
    content: { type: plain, value: "Hiring\n+ GTM" }
    style: { font_family: $heading, font_size: 38, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.01 }

  - { id: card-3-bg, type: rect, z: 30, x: 800, y: 760, width: 320, height: 220, radius: 16, fill: { type: solid, color: "$surface" } }
  - id: card-3-label
    type: text
    z: 31
    x: 832
    y: 790
    width: 256
    height: 0
    content: { type: plain, value: "TEAM" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
  - id: card-3-value
    type: text
    z: 32
    x: 832
    y: 830
    width: 256
    height: 0
    content: { type: plain, value: "20 → 60\nthis year" }
    style: { font_family: $heading, font_size: 38, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.01 }

  - { id: divider-2, type: rect, z: 10, x: 80, y: 1060, width: 1040, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }

  - id: thanks-label
    type: text
    z: 50
    x: 80
    y: 1100
    width: 1040
    height: 0
    content: { type: plain, value: "WITH HUGE THANKS TO" }
    style: { font_family: $mono, font_size: 13, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }

  - id: thanks-detail
    type: text
    z: 51
    x: 80
    y: 1140
    width: 1040
    height: 0
    content: { type: plain, value: "Our 200 design partners, our team, and the community shipping with Folio every day." }
    style: { font_family: $body, font_size: 22, color: $text, line_height: 1.45 }

  - { id: cta-bg, type: rect, z: 60, x: 80, y: 1280, width: 360, height: 80, radius: 40, fill: { type: solid, color: "$primary" } }
  - id: cta-text
    type: text
    z: 61
    x: 80
    y: 1306
    width: 360
    height: 0
    content: { type: plain, value: "We're hiring →" }
    style: { font_family: $body, font_size: 24, font_weight: 700, color: "#FFFFFF", text_align: center }

  - id: author
    type: text
    z: 70
    x: 80
    y: 1410
    width: 700
    height: 0
    content: { type: plain, value: "folio.studio · @folio" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, line_height: 1.4 }

  - id: page-mark
    type: text
    z: 71
    x: 880
    y: 1410
    width: 240
    height: 0
    content: { type: plain, value: "FOLIO · 2026" }
    style: { font_family: $mono, font_size: 13, font_weight: 600, color: $text_muted, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

animations:
  accent-dot:
    loop: { type: pulse, duration: 2000, scale: 1.3 }
  amount:
    enter: { type: scale_in, duration: 900, delay: 200, easing: ease-out }
  caption:
    enter: { type: fade_up, duration: 500, delay: 600, easing: ease-out }
  card-1-bg:
    enter: { type: fade_up, duration: 500, delay: 400, easing: ease-out }
  card-2-bg:
    enter: { type: fade_up, duration: 500, delay: 600, easing: ease-out }
  card-3-bg:
    enter: { type: fade_up, duration: 500, delay: 800, easing: ease-out }
  cta-bg:
    loop: { type: breathe, duration: 2400, scale: 1.04 }

slots:
  - { id: eyebrow,       path: "layers[3].content.value",  type: text, hint: "Eyebrow tag",      default: "SERIES A · ANNOUNCEMENT" }
  - { id: amount,        path: "layers[4].content.value",  type: text, hint: "Funding amount",   default: "$12M" }
  - { id: caption,       path: "layers[5].content.value",  type: text, hint: "Caption line",     default: "…to bring Folio Studio to 10× more customers." }
  - { id: lead_value,    path: "layers[9].content.value",  type: text, hint: "Lead investor",    default: "Founders\nFund" }
  - { id: use_value,     path: "layers[12].content.value", type: text, hint: "Use of funds",     default: "Hiring\n+ GTM" }
  - { id: team_value,    path: "layers[15].content.value", type: text, hint: "Team growth",      default: "20 → 60\nthis year" }
  - { id: thanks_detail, path: "layers[18].content.value", type: text, hint: "Thanks paragraph", default: "Our 200 design partners, our team, and the community." }
  - { id: cta_text,      path: "layers[20].content.value", type: text, hint: "CTA label",        default: "We're hiring →" }
  - { id: author,        path: "layers[21].content.value", type: text, hint: "Handle + URL",     default: "folio.studio · @folio" }
