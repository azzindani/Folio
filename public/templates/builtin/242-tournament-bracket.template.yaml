_protocol: template/v1

# Single-elimination tournament bracket — 1920×1080 landscape,
# corporate-slate theme. 8-team bracket with R1 → QF → SF → F → Champion,
# trophy icon, dates per round.
meta:
  id: tmpl-tournament-bracket
  name: Tournament Bracket
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [tournament, bracket, sports, championship, corporate, landscape]
  description: "Single-elimination 8-team tournament bracket with round dates, connecting lines, and trophy for the champion."

document:
  width: 1920
  height: 1080
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1920
    height: 1080
    fill: { type: solid, color: "$background" }

  # ── Header band ───────────────────────────────────────────
  - id: header-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1920
    height: 130
    fill: { type: solid, color: "$primary" }

  - id: header-eyebrow
    type: text
    z: 10
    x: 60
    y: 30
    width: 1800
    height: 0
    content: { type: plain, value: "SINGLE-ELIMINATION · OFFICIAL BRACKET" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: "#FFFFFF"
      letter_spacing: 0.5
      text_transform: uppercase
      opacity: 0.8

  - id: header-title
    type: text
    z: 11
    x: 60
    y: 60
    width: 1200
    height: 0
    content: { type: plain, value: "Spring Cup 2026 · 8-Team Knockout" }
    style:
      font_family: $heading
      font_size: 42
      font_weight: 800
      color: "#FFFFFF"
      line_height: 1.1

  - id: header-dates
    type: text
    z: 12
    x: 60
    y: 60
    width: 1800
    height: 0
    content: { type: plain, value: "May 17 – May 24, 2026" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 600
      color: "#FFFFFF"
      text_align: right
      line_height: 1.3
      opacity: 0.9

  - id: header-stripe
    type: rect
    z: 13
    x: 0
    y: 130
    width: 1920
    height: 4
    fill: { type: solid, color: "$accent" }

  # ── Round labels row ──────────────────────────────────────
  - id: round-r1-label
    type: text
    z: 20
    x: 80
    y: 160
    width: 280
    height: 0
    content: { type: plain, value: "ROUND 1" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$primary"
      text_align: center
      letter_spacing: 0.4

  - id: round-r1-date
    type: text
    z: 21
    x: 80
    y: 185
    width: 280
    height: 0
    content: { type: plain, value: "May 17 – 18" }
    style:
      font_family: $body
      font_size: 12
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3

  - id: round-qf-label
    type: text
    z: 22
    x: 460
    y: 160
    width: 280
    height: 0
    content: { type: plain, value: "QUARTERFINALS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$primary"
      text_align: center
      letter_spacing: 0.4

  - id: round-qf-date
    type: text
    z: 23
    x: 460
    y: 185
    width: 280
    height: 0
    content: { type: plain, value: "May 20" }
    style:
      font_family: $body
      font_size: 12
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3

  - id: round-sf-label
    type: text
    z: 24
    x: 840
    y: 160
    width: 280
    height: 0
    content: { type: plain, value: "SEMIFINALS" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$primary"
      text_align: center
      letter_spacing: 0.4

  - id: round-sf-date
    type: text
    z: 25
    x: 840
    y: 185
    width: 280
    height: 0
    content: { type: plain, value: "May 22" }
    style:
      font_family: $body
      font_size: 12
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3

  - id: round-f-label
    type: text
    z: 26
    x: 1220
    y: 160
    width: 280
    height: 0
    content: { type: plain, value: "FINAL" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$primary"
      text_align: center
      letter_spacing: 0.4

  - id: round-f-date
    type: text
    z: 27
    x: 1220
    y: 185
    width: 280
    height: 0
    content: { type: plain, value: "May 24" }
    style:
      font_family: $body
      font_size: 12
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.3

  - id: round-champ-label
    type: text
    z: 28
    x: 1600
    y: 160
    width: 280
    height: 0
    content: { type: plain, value: "CHAMPION" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "$accent"
      text_align: center
      letter_spacing: 0.4

  # ── R1 — 8 teams in 4 matches ─────────────────────────────
  # Match 1
  - id: r1-m1
    type: rect
    z: 30
    x: 80
    y: 230
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: r1-m1-t1
    type: text
    z: 31
    x: 100
    y: 246
    width: 240
    height: 0
    content: { type: plain, value: "1.  Thunderbolts" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: r1-m1-rule
    type: rect
    z: 32
    x: 80
    y: 275
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: r1-m1-t2
    type: text
    z: 33
    x: 100
    y: 288
    width: 240
    height: 0
    content: { type: plain, value: "8.  Sand Hawks" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  # Match 2
  - id: r1-m2
    type: rect
    z: 34
    x: 80
    y: 370
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: r1-m2-t1
    type: text
    z: 35
    x: 100
    y: 386
    width: 240
    height: 0
    content: { type: plain, value: "4.  River Wolves" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: r1-m2-rule
    type: rect
    z: 36
    x: 80
    y: 415
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: r1-m2-t2
    type: text
    z: 37
    x: 100
    y: 428
    width: 240
    height: 0
    content: { type: plain, value: "5.  Iron Foxes" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  # Match 3
  - id: r1-m3
    type: rect
    z: 38
    x: 80
    y: 580
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: r1-m3-t1
    type: text
    z: 39
    x: 100
    y: 596
    width: 240
    height: 0
    content: { type: plain, value: "3.  Crimson Stags" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: r1-m3-rule
    type: rect
    z: 40
    x: 80
    y: 625
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: r1-m3-t2
    type: text
    z: 41
    x: 100
    y: 638
    width: 240
    height: 0
    content: { type: plain, value: "6.  Cliff Kings" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  # Match 4
  - id: r1-m4
    type: rect
    z: 42
    x: 80
    y: 720
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: r1-m4-t1
    type: text
    z: 43
    x: 100
    y: 736
    width: 240
    height: 0
    content: { type: plain, value: "2.  Glacier FC" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: r1-m4-rule
    type: rect
    z: 44
    x: 80
    y: 765
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: r1-m4-t2
    type: text
    z: 45
    x: 100
    y: 778
    width: 240
    height: 0
    content: { type: plain, value: "7.  Storm Petrels" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  # ── QF — 2 matches per half ──────────────────────────────
  - id: qf-m1
    type: rect
    z: 50
    x: 460
    y: 300
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: qf-m1-t1
    type: text
    z: 51
    x: 480
    y: 316
    width: 240
    height: 0
    content: { type: plain, value: "Thunderbolts" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: qf-m1-rule
    type: rect
    z: 52
    x: 460
    y: 345
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: qf-m1-t2
    type: text
    z: 53
    x: 480
    y: 358
    width: 240
    height: 0
    content: { type: plain, value: "River Wolves" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  - id: qf-m2
    type: rect
    z: 54
    x: 460
    y: 650
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: qf-m2-t1
    type: text
    z: 55
    x: 480
    y: 666
    width: 240
    height: 0
    content: { type: plain, value: "Crimson Stags" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: qf-m2-rule
    type: rect
    z: 56
    x: 460
    y: 695
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: qf-m2-t2
    type: text
    z: 57
    x: 480
    y: 708
    width: 240
    height: 0
    content: { type: plain, value: "Glacier FC" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  # ── SF — 1 match ─────────────────────────────────────────
  - id: sf-m1
    type: rect
    z: 60
    x: 840
    y: 480
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$accent", width: 2 }

  - id: sf-m1-t1
    type: text
    z: 61
    x: 860
    y: 496
    width: 240
    height: 0
    content: { type: plain, value: "Thunderbolts" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: sf-m1-rule
    type: rect
    z: 62
    x: 840
    y: 525
    width: 280
    height: 1
    fill: { type: solid, color: "$border" }

  - id: sf-m1-t2
    type: text
    z: 63
    x: 860
    y: 538
    width: 240
    height: 0
    content: { type: plain, value: "Glacier FC" }
    style:
      font_family: $body
      font_size: 16
      color: "$text_muted"
      line_height: 1.3

  # ── F — Final ────────────────────────────────────────────
  - id: f-m1
    type: rect
    z: 70
    x: 1220
    y: 480
    width: 280
    height: 90
    radius: 8
    fill: { type: solid, color: "$primary" }
    stroke: { color: "$accent", width: 3 }

  - id: f-m1-t1
    type: text
    z: 71
    x: 1240
    y: 496
    width: 240
    height: 0
    content: { type: plain, value: "Thunderbolts" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 800
      color: "#FFFFFF"
      line_height: 1.3

  - id: f-m1-rule
    type: rect
    z: 72
    x: 1220
    y: 525
    width: 280
    height: 1
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.4

  - id: f-m1-t2
    type: text
    z: 73
    x: 1240
    y: 538
    width: 240
    height: 0
    content: { type: plain, value: "TBD" }
    style:
      font_family: $body
      font_size: 16
      color: "#FFFFFF"
      line_height: 1.3
      opacity: 0.7

  # ── Champion block ──────────────────────────────────────
  - id: champ-bg
    type: rect
    z: 80
    x: 1600
    y: 430
    width: 280
    height: 200
    radius: 16
    fill: { type: solid, color: $accent }
  - id: champ-trophy
    type: text
    z: 81
    x: 1600
    y: 450
    width: 280
    height: 0
    content: { type: plain, value: "🏆" }
    style:
      font_family: $heading
      font_size: 72
      color: "#1A1A1A"
      text_align: center
      line_height: 1

  - id: champ-name
    type: text
    z: 82
    x: 1600
    y: 555
    width: 280
    height: 0
    content: { type: plain, value: "TBD" }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 800
      color: "#1A1A1A"
      text_align: center
      line_height: 1.2

  # ── Connecting lines (bracket structure) ─────────────────
  # R1 m1 → QF m1 (top half upper)
  - id: line-r1m1-h
    type: line
    z: 90
    x1: 360
    y1: 275
    x2: 410
    y2: 275
    stroke: { color: "$border", width: 2 }

  - id: line-r1m2-h
    type: line
    z: 91
    x1: 360
    y1: 415
    x2: 410
    y2: 415
    stroke: { color: "$border", width: 2 }

  - id: line-r1m1m2-v
    type: line
    z: 92
    x1: 410
    y1: 275
    x2: 410
    y2: 415
    stroke: { color: "$border", width: 2 }

  - id: line-to-qf1
    type: line
    z: 93
    x1: 410
    y1: 345
    x2: 460
    y2: 345
    stroke: { color: "$border", width: 2 }

  # R1 m3+m4 → QF m2
  - id: line-r1m3-h
    type: line
    z: 94
    x1: 360
    y1: 625
    x2: 410
    y2: 625
    stroke: { color: "$border", width: 2 }

  - id: line-r1m4-h
    type: line
    z: 95
    x1: 360
    y1: 765
    x2: 410
    y2: 765
    stroke: { color: "$border", width: 2 }

  - id: line-r1m3m4-v
    type: line
    z: 96
    x1: 410
    y1: 625
    x2: 410
    y2: 765
    stroke: { color: "$border", width: 2 }

  - id: line-to-qf2
    type: line
    z: 97
    x1: 410
    y1: 695
    x2: 460
    y2: 695
    stroke: { color: "$border", width: 2 }

  # QF → SF
  - id: line-qf1-h
    type: line
    z: 98
    x1: 740
    y1: 345
    x2: 790
    y2: 345
    stroke: { color: "$border", width: 2 }

  - id: line-qf2-h
    type: line
    z: 99
    x1: 740
    y1: 695
    x2: 790
    y2: 695
    stroke: { color: "$border", width: 2 }

  - id: line-qf-v
    type: line
    z: 100
    x1: 790
    y1: 345
    x2: 790
    y2: 695
    stroke: { color: "$border", width: 2 }

  - id: line-to-sf
    type: line
    z: 101
    x1: 790
    y1: 525
    x2: 840
    y2: 525
    stroke: { color: "$accent", width: 2 }

  # SF → F
  - id: line-sf-to-f
    type: line
    z: 102
    x1: 1120
    y1: 525
    x2: 1220
    y2: 525
    stroke: { color: "$accent", width: 2 }

  # F → Champion
  - id: line-f-to-champ
    type: line
    z: 103
    x1: 1500
    y1: 525
    x2: 1600
    y2: 525
    stroke: { color: "$accent", width: 3 }

  # ── Footer ────────────────────────────────────────────────
  - id: footer-rule
    type: rect
    z: 200
    x: 0
    y: 1010
    width: 1920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: footer-text
    type: text
    z: 201
    x: 60
    y: 1035
    width: 1800
    height: 0
    content:
      type: plain
      value: "SPRING CUP 2026 · 8 teams · single elimination · all matches at Riverside Arena · live at springcup.io"
    style:
      font_family: $body
      font_size: 14
      color: "$text_muted"
      text_align: center
      line_height: 1.3
      letter_spacing: 0.2

slots:
  - { id: tournament_name, path: "layers[5].content.value", type: text, hint: "Tournament title", default: "Spring Cup 2026 · 8-Team Knockout" }
  - { id: dates,           path: "layers[6].content.value", type: text, hint: "Tournament dates", default: "May 17 – May 24, 2026" }
