_protocol: template/v1

# Climate action tracker — global eyebrow, hero, 5 KPIs (temp anomaly, CO2, sea
# level, arctic ice, renewables share), 30-year temperature anomaly line,
# regional emissions stacked bar, top emitters table, renewable mix donut.
meta:
  id: tmpl-climate-dashboard-report
  name: Climate · Global Indicators
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, climate, environment, sustainability, emissions, interactive]
  description: "Climate dashboard: temperature anomaly, CO2 concentration, sea level, Arctic ice, renewable energy share, regional emissions, top-emitter table, energy mix."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: forest-deep

report:
  layout: scroll
  data:
    sources:
      - id: temp_anomaly_trend
        type: inline
        rows:
          - { year: "1995", anomaly: 0.45 }
          - { year: "1996", anomaly: 0.34 }
          - { year: "1997", anomaly: 0.47 }
          - { year: "1998", anomaly: 0.63 }
          - { year: "1999", anomaly: 0.42 }
          - { year: "2000", anomaly: 0.42 }
          - { year: "2001", anomaly: 0.55 }
          - { year: "2002", anomaly: 0.62 }
          - { year: "2003", anomaly: 0.61 }
          - { year: "2004", anomaly: 0.54 }
          - { year: "2005", anomaly: 0.68 }
          - { year: "2006", anomaly: 0.63 }
          - { year: "2007", anomaly: 0.66 }
          - { year: "2008", anomaly: 0.54 }
          - { year: "2009", anomaly: 0.66 }
          - { year: "2010", anomaly: 0.72 }
          - { year: "2011", anomaly: 0.61 }
          - { year: "2012", anomaly: 0.64 }
          - { year: "2013", anomaly: 0.68 }
          - { year: "2014", anomaly: 0.75 }
          - { year: "2015", anomaly: 0.90 }
          - { year: "2016", anomaly: 1.02 }
          - { year: "2017", anomaly: 0.92 }
          - { year: "2018", anomaly: 0.85 }
          - { year: "2019", anomaly: 0.98 }
          - { year: "2020", anomaly: 1.02 }
          - { year: "2021", anomaly: 0.85 }
          - { year: "2022", anomaly: 0.89 }
          - { year: "2023", anomaly: 1.18 }
          - { year: "2024", anomaly: 1.28 }
      - id: regional_emissions
        type: inline
        rows:
          - { region: "East Asia",        energy: 9840, industry: 3120, transport: 1840, land_use: 620 }
          - { region: "North America",    energy: 4280, industry: 1640, transport: 2160, land_use: 380 }
          - { region: "Europe",           energy: 2640, industry:  980, transport: 1280, land_use: 220 }
          - { region: "South Asia",       energy: 2480, industry:  920, transport:  680, land_use: 540 }
          - { region: "SE Asia & Pacific", energy: 1620, industry:  640, transport:  520, land_use: 880 }
          - { region: "Middle East",      energy: 1840, industry:  720, transport:  480, land_use:  60 }
          - { region: "Latin America",    energy:  920, industry:  420, transport:  640, land_use: 1240 }
          - { region: "Africa",           energy:  720, industry:  280, transport:  340, land_use:  680 }
      - id: top_emitters
        type: inline
        rows:
          - { country: China,         emissions_mt: 11680, per_capita: 8.20, yoy_change:   1.4, policy_rating: Moderate }
          - { country: United States, emissions_mt:  5006, per_capita: 14.86, yoy_change:  -2.8, policy_rating: Moderate }
          - { country: India,         emissions_mt:  2829, per_capita: 1.98, yoy_change:   6.2, policy_rating: Weak }
          - { country: Russia,        emissions_mt:  1652, per_capita: 11.42, yoy_change:  -1.4, policy_rating: Weak }
          - { country: Japan,         emissions_mt:  1062, per_capita: 8.54, yoy_change:  -3.6, policy_rating: Strong }
          - { country: Germany,       emissions_mt:   668, per_capita: 7.98, yoy_change:  -8.4, policy_rating: Strong }
          - { country: Iran,          emissions_mt:   745, per_capita: 8.61, yoy_change:   3.2, policy_rating: Weak }
          - { country: South Korea,   emissions_mt:   634, per_capita: 12.28, yoy_change:  -2.2, policy_rating: Moderate }
          - { country: Saudi Arabia,  emissions_mt:   621, per_capita: 17.34, yoy_change:   2.6, policy_rating: Weak }
          - { country: Canada,        emissions_mt:   582, per_capita: 14.95, yoy_change:  -1.8, policy_rating: Moderate }
      - id: renewable_mix
        type: inline
        rows:
          - { source: Hydro,        share_pct: 38.4, capacity_gw: 1392 }
          - { source: Wind,         share_pct: 24.8, capacity_gw:  899 }
          - { source: Solar PV,     share_pct: 21.2, capacity_gw:  768 }
          - { source: Bioenergy,    share_pct:  8.6, capacity_gw:  312 }
          - { source: Geothermal,   share_pct:  4.2, capacity_gw:  152 }
          - { source: Marine/Tidal, share_pct:  2.8, capacity_gw:  101 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "IPCC SYNTHESIS · GLOBAL INDICATORS · CY2024"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 32
        font_weight: 700
        line_height: 1.15
        content: "**Climate Action Tracker 2025**\n*Temperature anomaly, CO2 concentration, sea level, and renewable energy progress.*"

      - id: kpi-temp
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Global Temp Anomaly (°C)
        value: 1.28
        format: number
        decimals: 2
        delta: 8.5
        delta_format: percent

      - id: kpi-co2
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: CO2 Concentration (ppm)
        value: 424.6
        format: number
        decimals: 1
        delta: 0.6
        delta_format: percent

      - id: kpi-sealevel
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Sea Level Rise (mm)
        value: 102.4
        format: number
        decimals: 1
        delta: 4.8
        delta_format: percent

      - id: kpi-ice
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Arctic Sea Ice (km²)
        value: 4280000
        format: number
        delta: -2.4
        delta_format: percent

      - id: kpi-renewables
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Renewable Energy %
        value: 30.6
        format: percent
        delta: 2.8
        delta_format: percent

      - id: section-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Global Temperature Anomaly — 30 Year Trend**"

      - id: chart-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 400
        chart_type: line
        data_ref: temp_anomaly_trend
        x_field: year
        y_field: anomaly
        title: Annual Mean Temperature Anomaly vs 1951-1980 Baseline (°C)
        legend: true
        grid: true
        animate: true

      - id: section-regional
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Regional Emissions by Sector**"

      - id: chart-regional
        type: interactive_chart
        x: 60
        y: 960
        width: 740
        height: 400
        chart_type: bar
        data_ref: regional_emissions
        x_field: region
        y_field: energy
        title: Emissions by Region (Energy, Industry, Transport, Land Use · Mt CO2e)
        legend: true
        grid: true
        animate: true

      - id: chart-renewables
        type: interactive_chart
        x: 820
        y: 960
        width: 400
        height: 400
        chart_type: donut
        data_ref: renewable_mix
        x_field: source
        y_field: share_pct
        title: Renewable Energy Mix
        legend: true
        animate: true

      - id: section-emitters
        type: rich_text
        x: 60
        y: 1400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top 10 Emitting Countries**"

      - id: tbl-emitters
        type: interactive_table
        x: 60
        y: 1460
        width: 1160
        height: 600
        data_ref: top_emitters
        pagination: true
        page_size: 10
        filterable: true
        exportable: true
        columns:
          - { field: country,        title: Country,             width: 240, sortable: true }
          - { field: emissions_mt,   title: Emissions (Mt CO2),  width: 200, sortable: true, formatter: number, align: right }
          - { field: per_capita,     title: Per Capita (t),      width: 200, sortable: true, formatter: number, align: right }
          - { field: yoy_change,     title: YoY %,               width: 180, sortable: true, formatter: delta,  align: right }
          - { field: policy_rating,  title: Policy Rating,       width: 220, sortable: true, formatter: badge }

slots:
  - { id: report_title,      path: "pages[0].layers[1].content",  type: text, hint: "Report title",       default: "**Climate Action Tracker 2025**\n*Global temperature, atmospheric CO2, sea level, sea ice, and renewable energy progress.*" }
  - { id: report_eyebrow,    path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",       default: "IPCC SYNTHESIS · GLOBAL INDICATORS · CY2024" }
  - { id: trend_section,     path: "pages[0].layers[7].content",  type: text, hint: "Trend heading",      default: "**Global Temperature Anomaly — 30 Year Trend**" }
  - { id: regional_section,  path: "pages[0].layers[9].content",  type: text, hint: "Regional heading",   default: "**Regional Emissions by Sector**" }
  - { id: emitters_section,  path: "pages[0].layers[12].content", type: text, hint: "Emitters heading",   default: "**Top 10 Emitting Countries**" }
