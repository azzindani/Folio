_protocol: template/v1

# NDA cover page — 1240×1754 A4 portrait, mono-print theme.
# Centered "MUTUAL NON-DISCLOSURE AGREEMENT", parties, effective date,
# 3-sentence summary, signature placeholders bottom.
meta:
  id: tmpl-nda-cover
  name: NDA Cover
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, legal, nda, confidentiality, cover, mono, a4]
  description: "Mutual NDA cover page with centered title, parties, effective date, brief summary, and signature placeholders."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: mono-print

layers:
  # 0 — bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
  # 1 — outer frame
  - { id: frame, type: rect, z: 1, x: 120, y: 120, width: 1000, height: 1514, fill: { type: solid, color: "transparent" }, stroke: { color: "$text", width: 1 } }
  # 2 — confidential stamp top
  - { id: conf-stamp, type: text, z: 5, x: 120, y: 180, width: 1000, height: 0, content: { type: plain, value: "PRIVATE & CONFIDENTIAL" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: "$text_muted", letter_spacing: 0.8, text_align: center, text_transform: uppercase } }
  # 3 — divider top
  - { id: div1, type: rect, z: 6, x: 580, y: 220, width: 80, height: 1, fill: { type: solid, color: "$text" } }
  # 4 — title line 1
  - { id: title-1, type: text, z: 10, x: 120, y: 360, width: 1000, height: 0, content: { type: plain, value: "MUTUAL" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.04, line_height: 1 } }
  # 5 — title line 2
  - { id: title-2, type: text, z: 11, x: 120, y: 460, width: 1000, height: 0, content: { type: plain, value: "NON-DISCLOSURE" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.04, line_height: 1 } }
  # 6 — title line 3
  - { id: title-3, type: text, z: 12, x: 120, y: 560, width: 1000, height: 0, content: { type: plain, value: "AGREEMENT" }, style: { font_family: $heading, font_size: 84, font_weight: 800, color: "$text", text_align: center, letter_spacing: 0.04, line_height: 1 } }
  # 7 — divider mid
  - { id: div2, type: rect, z: 20, x: 480, y: 690, width: 280, height: 2, fill: { type: solid, color: "$text" } }
  # 8 — between label
  - { id: between, type: text, z: 21, x: 120, y: 720, width: 1000, height: 0, content: { type: plain, value: "BETWEEN" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "$text_muted", letter_spacing: 0.6, text_align: center } }
  # 9 — Party 1
  - { id: party-1, type: text, z: 22, x: 120, y: 760, width: 1000, height: 0, content: { type: plain, value: "Folio Studio Limited" }, style: { font_family: $heading, font_size: 32, font_weight: 700, color: "$text", text_align: center, line_height: 1.3 } }
  # 10 — &
  - { id: amp, type: text, z: 23, x: 120, y: 818, width: 1000, height: 0, content: { type: plain, value: "&" }, style: { font_family: $heading, font_size: 36, font_style: italic, color: "$text_muted", text_align: center, line_height: 1.2 } }
  # 11 — Party 2
  - { id: party-2, type: text, z: 24, x: 120, y: 866, width: 1000, height: 0, content: { type: plain, value: "Acme Robotics Holdings PLC" }, style: { font_family: $heading, font_size: 32, font_weight: 700, color: "$text", text_align: center, line_height: 1.3 } }
  # 12 — effective date label
  - { id: eff-label, type: text, z: 30, x: 120, y: 960, width: 1000, height: 0, content: { type: plain, value: "EFFECTIVE DATE" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.6, text_align: center } }
  # 13 — effective date
  - { id: eff-date, type: text, z: 31, x: 120, y: 986, width: 1000, height: 0, content: { type: plain, value: "May 17, 2026" }, style: { font_family: $heading, font_size: 24, color: "$text", text_align: center, line_height: 1.4 } }
  # 14 — summary heading
  - { id: sum-h, type: text, z: 40, x: 120, y: 1060, width: 1000, height: 0, content: { type: plain, value: "SUMMARY" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$primary", letter_spacing: 0.6, text_align: center } }
  # 15 — summary body
  - { id: summary, type: text, z: 41, x: 200, y: 1090, width: 840, height: 0, content: { type: plain, value: "The parties intend to evaluate a potential business relationship and, in the course of such evaluation, will exchange information of a confidential and proprietary nature. This Agreement establishes mutual obligations to protect that information and restrict its use. Confidentiality obligations survive for five (5) years from the Effective Date." }, style: { font_family: $body, font_size: 15, color: "$text", text_align: center, line_height: 1.7 } }
  # 16 — governing law label
  - { id: gov-label, type: text, z: 50, x: 120, y: 1280, width: 1000, height: 0, content: { type: plain, value: "GOVERNING LAW" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: "$text_muted", letter_spacing: 0.6, text_align: center } }
  # 17 — governing law value
  - { id: gov-val, type: text, z: 51, x: 120, y: 1306, width: 1000, height: 0, content: { type: plain, value: "Laws of England & Wales · Exclusive jurisdiction: London Courts" }, style: { font_family: $heading, font_size: 16, font_style: italic, color: "$text", text_align: center, line_height: 1.4 } }
  # 18 — sig label 1
  - { id: sig1-label, type: text, z: 60, x: 200, y: 1430, width: 360, height: 0, content: { type: plain, value: "FOR FOLIO STUDIO LIMITED" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 19 — sig line 1
  - { id: sig1-line, type: rect, z: 61, x: 200, y: 1490, width: 360, height: 1, fill: { type: solid, color: "$text" } }
  # 20 — sig name 1
  - { id: sig1-name, type: text, z: 62, x: 200, y: 1500, width: 360, height: 0, content: { type: plain, value: "Name · Title · Date" }, style: { font_family: $body, font_size: 11, font_style: italic, color: "$text_muted" } }
  # 21 — sig label 2
  - { id: sig2-label, type: text, z: 63, x: 680, y: 1430, width: 360, height: 0, content: { type: plain, value: "FOR ACME ROBOTICS HOLDINGS PLC" }, style: { font_family: $body, font_size: 10, font_weight: 700, color: "$text_muted", letter_spacing: 0.4 } }
  # 22 — sig line 2
  - { id: sig2-line, type: rect, z: 64, x: 680, y: 1490, width: 360, height: 1, fill: { type: solid, color: "$text" } }
  # 23 — sig name 2
  - { id: sig2-name, type: text, z: 65, x: 680, y: 1500, width: 360, height: 0, content: { type: plain, value: "Name · Title · Date" }, style: { font_family: $body, font_size: 11, font_style: italic, color: "$text_muted" } }
  # 24 — footer
  - { id: footer, type: text, z: 70, x: 120, y: 1600, width: 1000, height: 0, content: { type: plain, value: "Reference NDA-2026-0517 · Page 1 of 8" }, style: { font_family: $mono, font_size: 11, color: "$text_muted", text_align: center } }

slots:
  - { id: party_1,        path: "layers[9].content.value",  type: text, hint: "Party 1 (legal name)",   default: "Folio Studio Limited" }
  - { id: party_2,        path: "layers[11].content.value", type: text, hint: "Party 2 (legal name)",   default: "Acme Robotics Holdings PLC" }
  - { id: effective_date, path: "layers[13].content.value", type: text, hint: "Effective date",        default: "May 17, 2026" }
  - { id: governing_law,  path: "layers[17].content.value", type: text, hint: "Governing law",         default: "Laws of England & Wales · Exclusive jurisdiction: London Courts" }
