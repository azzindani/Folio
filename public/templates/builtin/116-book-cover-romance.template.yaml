_protocol: template/v1

# Soft romance book cover — 2:3 portrait (1600×2400).
# Blush palette, ornate script title centered, decorative flourishes,
# subtitle eyebrow, author name elegant below title.
meta:
  id: tmpl-book-cover-romance
  name: Book Cover — Romance
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, book, cover, romance, soft, pastel, script]
  description: "Soft pastel romance book cover with ornate script title and decorative flourishes."

document:
  width: 1600
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: pastel-dream
  overrides:
    primary: "#D08CA8"
    secondary: "#F2D6DE"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1600
    height: 2400
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "#FBE7EC", position: 0 }
        - { color: "#FFF4F6", position: 50 }
        - { color: "#F6D4DD", position: 100 }

  - id: outer-frame
    type: rect
    z: 2
    x: 80
    y: 80
    width: 1440
    height: 2240
    radius: 6
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }

  - id: inner-frame
    type: rect
    z: 3
    x: 110
    y: 110
    width: 1380
    height: 2180
    radius: 4
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 1, dasharray: "2 6" }

  - id: top-flourish
    type: text
    z: 10
    x: 80
    y: 220
    width: 1440
    height: 0
    content: { type: plain, value: "✦   ❀   ✦" }
    style:
      font_family: $heading
      font_size: 44
      color: "$primary"
      text_align: center
      letter_spacing: 0.4

  - id: eyebrow
    type: text
    z: 11
    x: 80
    y: 320
    width: 1440
    height: 0
    content: { type: plain, value: "A NEW NOVEL OF LOVE AND LONGING" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 500
      font_style: italic
      color: "$text_muted"
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: title-rule-top
    type: rect
    z: 14
    x: 600
    y: 760
    width: 400
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: title
    type: text
    z: 15
    x: 80
    y: 820
    width: 1440
    height: 0
    content: { type: plain, value: "Letters to" }
    style:
      font_family: $heading
      font_size: 180
      font_weight: 400
      font_style: italic
      color: "$text"
      line_height: 1.05
      text_align: center

  - id: title-2
    type: text
    z: 16
    x: 80
    y: 1020
    width: 1440
    height: 0
    content: { type: plain, value: "the Sea" }
    style:
      font_family: $heading
      font_size: 220
      font_weight: 400
      font_style: italic
      color: "$primary"
      line_height: 1.05
      text_align: center

  - id: title-rule-bottom
    type: rect
    z: 17
    x: 600
    y: 1320
    width: 400
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: center-flourish
    type: text
    z: 18
    x: 80
    y: 1380
    width: 1440
    height: 0
    content: { type: plain, value: "❀" }
    style:
      font_family: $heading
      font_size: 56
      color: "$primary"
      text_align: center

  - id: subtitle
    type: text
    z: 19
    x: 200
    y: 1500
    width: 1200
    height: 0
    content: { type: plain, value: "Two summers. One coastal town. A love that refuses to be forgotten." }
    style:
      font_family: $body
      font_size: 32
      font_weight: 400
      font_style: italic
      color: "$text"
      line_height: 1.4
      text_align: center

  - id: author-eyebrow
    type: text
    z: 25
    x: 80
    y: 2020
    width: 1440
    height: 0
    content: { type: plain, value: "BY" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: "$text_muted"
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: author
    type: text
    z: 26
    x: 80
    y: 2070
    width: 1440
    height: 0
    content: { type: plain, value: "Adeline Rosewood" }
    style:
      font_family: $heading
      font_size: 78
      font_weight: 500
      font_style: italic
      color: "$text"
      letter_spacing: 0.02
      text_align: center

  - id: bottom-flourish
    type: text
    z: 27
    x: 80
    y: 2210
    width: 1440
    height: 0
    content: { type: plain, value: "✦   ❀   ✦" }
    style:
      font_family: $heading
      font_size: 44
      color: "$primary"
      text_align: center

slots:
  - { id: title,    path: "layers[6].content.value",  type: text, hint: "Title line 1",   default: "Letters to" }
  - { id: title_2,  path: "layers[7].content.value",  type: text, hint: "Title line 2",   default: "the Sea" }
  - { id: subtitle, path: "layers[10].content.value", type: text, hint: "Subtitle / tagline", default: "Two summers. One coastal town. A love that refuses to be forgotten." }
  - { id: author,   path: "layers[12].content.value", type: text, hint: "Author name",    default: "Adeline Rosewood" }
