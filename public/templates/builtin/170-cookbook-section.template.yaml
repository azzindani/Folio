      - { id: subtitle, type: text, z: 12, x: 100, y: 290, width: 1040, height: 0, content: { type: plain, value: "Espresso, mascarpone, savoiardi — assembled in the morning, eaten after dinner." }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text_muted, line_height: 1.5 } }
