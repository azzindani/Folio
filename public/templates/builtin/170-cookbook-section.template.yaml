      - { id: meta-2-l, type: text, z: 20, x: 360, y: 410, width: 240, height: 0, content: { type: plain, value: "PREP" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: meta-2-v, type: text, z: 21, x: 360, y: 440, width: 240, height: 0, content: { type: plain, value: "15 min" }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: meta-3-l, type: text, z: 20, x: 620, y: 410, width: 240, height: 0, content: { type: plain, value: "BAKE" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: meta-3-v, type: text, z: 21, x: 620, y: 440, width: 240, height: 0, content: { type: plain, value: "8 min" }, style: { font_family: $heading, font_size: 28, font_weight: 700, color: $text } }
      - { id: meta-4-l, type: text, z: 20, x: 880, y: 410, width: 260, height: 0, content: { type: plain, value: "DIFFICULTY" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
