_protocol: template/v1

# 6-page cookbook section — 1240×1754 A4 portrait, editorial-cream theme.
# Section divider → recipe 1 → recipe 2 → recipe 3 → technique → pairing chart.
meta:
  id: tmpl-cookbook-section
  name: Cookbook · Desserts Section
  type: book
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [book, cookbook, recipes, desserts, food, editorial, a4]
  description: "Six-page cookbook chapter on desserts. Section divider, three full recipes with ingredients and steps, a technique tip page, and a pairing chart."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Section Divider ──────────────────────────────
  - id: section
    label: Section Divider
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: top-rule, type: rect, z: 1, x: 100, y: 200, width: 1040, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: bot-rule, type: rect, z: 2, x: 100, y: 1554, width: 1040, height: 2, fill: { type: solid, color: "$primary" } }
      - { id: chapter-num, type: text, z: 10, x: 100, y: 280, width: 1040, height: 0, content: { type: plain, value: "CHAPTER FIVE" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.6 } }
      - { id: ornament-top, type: text, z: 11, x: 100, y: 360, width: 1040, height: 0, content: { type: plain, value: "✦ ✦ ✦" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center, letter_spacing: 0.6 } }
      - { id: section-title, type: text, z: 20, x: 100, y: 580, width: 1040, height: 0, content: { type: plain, value: "Desserts" }, style: { font_family: $heading, font_size: 200, font_weight: 700, color: $text, text_align: center, font_style: italic, line_height: 1, letter_spacing: -0.02 } }
      - { id: section-sub, type: text, z: 21, x: 200, y: 820, width: 840, height: 0, content: { type: plain, value: "Sweet endings, slow afternoons, and the kind of cakes worth turning the oven on for." }, style: { font_family: $body, font_size: 26, font_style: italic, color: $text_muted, text_align: center, line_height: 1.5 } }
      - { id: image-frame, type: rect, z: 30, x: 320, y: 980, width: 600, height: 420, radius: 8, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: image-placeholder, type: text, z: 31, x: 320, y: 1170, width: 600, height: 0, content: { type: plain, value: "Hero shot — three desserts on linen" }, style: { font_family: $body, font_size: 18, font_style: italic, color: $text_muted, text_align: center, opacity: 0.3 } }
      - { id: toc-title, type: text, z: 40, x: 200, y: 1440, width: 840, height: 0, content: { type: plain, value: "IN THIS CHAPTER" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $text_muted, text_align: center, letter_spacing: 0.5 } }
      - { id: toc-1, type: text, z: 41, x: 200, y: 1480, width: 840, height: 0, content: { type: plain, value: "Chocolate Lava Cake  ·  Tiramisu for Two  ·  Lemon Tart with Brown Butter" }, style: { font_family: $body, font_size: 17, color: $text, text_align: center, line_height: 1.7 } }
      - { id: page-num, type: text, z: 50, x: 100, y: 1620, width: 1040, height: 0, content: { type: plain, value: "— 87 —" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, font_style: italic } }

  # ── Page 2 · Recipe 1: Chocolate Lava Cake ────────────────
  - id: recipe-1
    label: Chocolate Lava Cake
    layers:
