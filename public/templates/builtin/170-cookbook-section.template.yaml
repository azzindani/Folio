      - { id: kicker, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "RECIPE 01 · CLASSIC" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: title, type: text, z: 11, x: 100, y: 180, width: 1040, height: 0, content: { type: plain, value: "Chocolate Lava Cake" }, style: { font_family: $heading, font_size: 72, font_weight: 700, color: $text, font_style: italic, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: subtitle, type: text, z: 12, x: 100, y: 290, width: 1040, height: 0, content: { type: plain, value: "A molten-centred chocolate pudding that takes eight minutes and never disappoints." }, style: { font_family: $body, font_size: 20, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: divider, type: rect, z: 13, x: 100, y: 380, width: 1040, height: 1, fill: { type: solid, color: "$primary" } }
