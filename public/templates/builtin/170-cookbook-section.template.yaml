      - { id: ing-title, type: text, z: 40, x: 100, y: 1000, width: 460, height: 0, content: { type: plain, value: "INGREDIENTS" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: ing-rule, type: rect, z: 41, x: 100, y: 1040, width: 460, height: 1, fill: { type: solid, color: "$border" } }
      - { id: ing-list, type: text, z: 42, x: 100, y: 1060, width: 460, height: 0, content: { type: plain, value: "2 large egg yolks\n40 g caster sugar\n200 g mascarpone, cold\n100 ml double cream, cold\n1 tsp vanilla extract\n150 ml strong fresh espresso, cooled\n2 tbsp dark rum or marsala\n10 savoiardi (lady fingers)\nDutch cocoa, for dusting\nDark chocolate, for shaving" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 1.95 } }
      - { id: steps-title, type: text, z: 50, x: 620, y: 1000, width: 520, height: 0, content: { type: plain, value: "METHOD" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: steps-rule, type: rect, z: 51, x: 620, y: 1040, width: 520, height: 1, fill: { type: solid, color: "$border" } }
      - { id: step-1, type: text, z: 52, x: 620, y: 1070, width: 520, height: 0, content: { type: plain, value: "1.  Whisk yolks and sugar over a pan of simmering water until thick, pale, doubled in volume." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-2, type: text, z: 53, x: 620, y: 1180, width: 520, height: 0, content: { type: plain, value: "2.  Off the heat, fold in mascarpone until smooth. Whip cream with vanilla to soft peaks, fold in." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-3, type: text, z: 54, x: 620, y: 1290, width: 520, height: 0, content: { type: plain, value: "3.  Stir rum into espresso. Dip lady fingers, 2 seconds each — they should not fall apart." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-4, type: text, z: 55, x: 620, y: 1400, width: 520, height: 0, content: { type: plain, value: "4.  Layer in two glasses: biscuits, cream, biscuits, cream. Smooth tops." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-5, type: text, z: 56, x: 620, y: 1490, width: 520, height: 0, content: { type: plain, value: "5.  Cover, chill 4 hours minimum, overnight if you can. Dust with cocoa, top with chocolate shavings to serve." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: page-num, type: text, z: 70, x: 100, y: 1720, width: 1040, height: 0, content: { type: plain, value: "— 89 —" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center } }

