      - { id: s1-num, type: text, z: 40, x: 100, y: 720, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 36, font_weight: 700, color: $primary } }
      - { id: s1-title, type: text, z: 41, x: 200, y: 720, width: 940, height: 0, content: { type: plain, value: "Melt over medium heat in a light-coloured pan." }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text } }
      - { id: s1-body, type: text, z: 42, x: 200, y: 760, width: 940, height: 0, content: { type: plain, value: "A stainless or enamel pan lets you see the colour. Never start with a black non-stick — you cannot read it." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.6 } }
      - { id: s2-num, type: text, z: 50, x: 100, y: 880, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 36, font_weight: 700, color: $primary } }
      - { id: s2-title, type: text, z: 51, x: 200, y: 880, width: 940, height: 0, content: { type: plain, value: "Foam, then crackle — water cooking off." }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text } }
      - { id: s2-body, type: text, z: 52, x: 200, y: 920, width: 940, height: 0, content: { type: plain, value: "Stir gently with a heatproof spatula. The butter will hiss, then turn quiet — that's your cue something is about to happen." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.6 } }
      - { id: s3-num, type: text, z: 60, x: 100, y: 1040, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 36, font_weight: 700, color: $primary } }
      - { id: s3-title, type: text, z: 61, x: 200, y: 1040, width: 940, height: 0, content: { type: plain, value: "Solids fall, colour deepens — amber, then chestnut." }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text } }
      - { id: s3-body, type: text, z: 62, x: 200, y: 1080, width: 940, height: 0, content: { type: plain, value: "Tilt the pan, look at the pale tan flecks against the gold. They should darken to chestnut brown — not black. Smells like hazelnuts." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.6 } }
      - { id: s4-num, type: text, z: 70, x: 100, y: 1200, width: 80, height: 0, content: { type: plain, value: "04" }, style: { font_family: $heading, font_size: 36, font_weight: 700, color: $primary } }
      - { id: s4-title, type: text, z: 71, x: 200, y: 1200, width: 940, height: 0, content: { type: plain, value: "Tip into a cool bowl immediately, scraping every speck." }, style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text } }
      - { id: s4-body, type: text, z: 72, x: 200, y: 1240, width: 940, height: 0, content: { type: plain, value: "The pan keeps cooking even off the heat. Get it out fast or it tips into burnt. The browned solids hold all the flavour — never strain them." }, style: { font_family: $body, font_size: 16, color: $text_muted, line_height: 1.6 } }
      - { id: callout, type: rect, z: 80, x: 100, y: 1420, width: 1040, height: 200, radius: 8, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
