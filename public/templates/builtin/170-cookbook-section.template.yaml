      - { id: step-1, type: text, z: 52, x: 620, y: 1070, width: 520, height: 0, content: { type: plain, value: "1.  Pulse flour, sugar, butter to coarse crumbs. Add yolks, 1 tbsp water; pulse until just clumping." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-2, type: text, z: 53, x: 620, y: 1180, width: 520, height: 0, content: { type: plain, value: "2.  Press into 24 cm tart tin. Chill 30 min. Blind-bake 180°C until pale gold, 20 min." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-3, type: text, z: 54, x: 620, y: 1280, width: 520, height: 0, content: { type: plain, value: "3.  Brown butter in pan until nutty and amber. Cool. Whisk eggs, sugar, lemon, zest." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-4, type: text, z: 55, x: 620, y: 1380, width: 520, height: 0, content: { type: plain, value: "4.  Whisk in brown butter and cream. Pour into shell, bake 150°C until barely set, 25 min." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-5, type: text, z: 56, x: 620, y: 1480, width: 520, height: 0, content: { type: plain, value: "5.  Cool completely, then chill 2 hours. Dust with icing sugar, slice with a hot wet knife." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: page-num, type: text, z: 70, x: 100, y: 1720, width: 1040, height: 0, content: { type: plain, value: "— 90 —" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center } }

  # ── Page 5 · Technique Tip ────────────────────────────────
