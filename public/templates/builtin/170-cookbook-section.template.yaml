      - { id: image, type: rect, z: 30, x: 100, y: 560, width: 1040, height: 380, radius: 8, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: image-placeholder, type: text, z: 31, x: 100, y: 730, width: 1040, height: 0, content: { type: plain, value: "[ overhead shot — cake split open, molten centre ]" }, style: { font_family: $body, font_size: 18, font_style: italic, color: $text_muted, text_align: center } }
      - { id: ing-title, type: text, z: 40, x: 100, y: 1000, width: 460, height: 0, content: { type: plain, value: "INGREDIENTS" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: ing-rule, type: rect, z: 41, x: 100, y: 1040, width: 460, height: 1, fill: { type: solid, color: "$border" } }
      - { id: ing-list, type: text, z: 42, x: 100, y: 1060, width: 460, height: 0, content: { type: plain, value: "200 g dark chocolate, 70%, chopped\n200 g unsalted butter, plus more\n4 large eggs\n4 large egg yolks\n100 g caster sugar\n60 g plain flour, plus more\nGood pinch of flaky salt\nCocoa powder, for dusting\nVanilla ice cream, to serve" }, style: { font_family: $body, font_size: 17, color: $text, line_height: 2 } }
      - { id: steps-title, type: text, z: 50, x: 620, y: 1000, width: 520, height: 0, content: { type: plain, value: "METHOD" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
      - { id: steps-rule, type: rect, z: 51, x: 620, y: 1040, width: 520, height: 1, fill: { type: solid, color: "$border" } }
      - { id: step-1, type: text, z: 52, x: 620, y: 1070, width: 520, height: 0, content: { type: plain, value: "1.  Heat oven to 220°C. Butter four 175 ml ramekins, dust with cocoa, tap out excess." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-2, type: text, z: 53, x: 620, y: 1170, width: 520, height: 0, content: { type: plain, value: "2.  Melt chocolate and butter in a bowl set over simmering water. Stir until smooth, set aside." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-3, type: text, z: 54, x: 620, y: 1280, width: 520, height: 0, content: { type: plain, value: "3.  Whisk eggs, yolks and sugar until pale and tripled in volume, about 4 minutes." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-4, type: text, z: 55, x: 620, y: 1380, width: 520, height: 0, content: { type: plain, value: "4.  Fold chocolate into eggs, then fold in flour and salt. Divide between ramekins." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: step-5, type: text, z: 56, x: 620, y: 1480, width: 520, height: 0, content: { type: plain, value: "5.  Bake 8 minutes — edges set, middles wobble. Turn out, dust with cocoa, serve with ice cream." }, style: { font_family: $body, font_size: 16, color: $text, line_height: 1.6 } }
      - { id: tip-block, type: rect, z: 60, x: 100, y: 1610, width: 1040, height: 1, fill: { type: solid, color: "$border" } }
      - { id: tip, type: text, z: 61, x: 100, y: 1640, width: 1040, height: 0, content: { type: plain, value: "CHEF'S NOTE — Batter can be ramekin-filled and refrigerated up to 24 hours ahead; bake straight from the fridge and add 90 seconds." }, style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: page-num, type: text, z: 70, x: 100, y: 1720, width: 1040, height: 0, content: { type: plain, value: "— 88 —" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center } }

  # ── Page 3 · Recipe 2: Tiramisu ───────────────────────────
  - id: recipe-2
    label: Tiramisu for Two
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: solid, color: "$background" } }
      - { id: kicker, type: text, z: 10, x: 100, y: 140, width: 1040, height: 0, content: { type: plain, value: "RECIPE 02 · NO BAKE" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: $primary, letter_spacing: 0.5 } }
