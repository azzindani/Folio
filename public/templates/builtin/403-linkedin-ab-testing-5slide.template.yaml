_protocol: template/v1

# LinkedIn carousel — 5-slide A/B testing rules.
# Cyber-synthwave theme, 1080×1350.
meta:
  id: tmpl-linkedin-ab-testing-5slide
  name: LinkedIn A/B Testing (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, experimentation, ab-testing, analytics, "4-5"]
  description: "Cover + why-fail + 3 rules + CTA — A/B tests that don't lie."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: cyber-synthwave

pages:
  # ── Slide 1 · Cover ─────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 170, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "1 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 520, width: 960, height: 0, content: { type: plain, value: "EXPERIMENTATION · RULES" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "A/B tests that\ndon't lie." }, style: { font_family: $heading, font_size: 110, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: tagline, type: text, z: 13, x: 60, y: 900, width: 960, height: 0, content: { type: plain, value: "3 rules separate signal from noise. Swipe →" }, style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 } }
      - { id: handle, type: text, z: 14, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 2 · Why most A/B tests fail ───────────────────
  - id: fail
    label: Why most fail
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "2 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "THE TRAP" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.32, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 240, width: 960, height: 0, content: { type: plain, value: "Why most A/B tests fail" }, style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: fail-1-dot, type: circle, z: 20, cx: 90, cy: 500, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: fail-1-text, type: text, z: 21, x: 130, y: 480, width: 900, height: 0, content: { type: plain, value: "Stopping the test the second p<0.05 (peeking bias)." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: fail-2-dot, type: circle, z: 20, cx: 90, cy: 640, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: fail-2-text, type: text, z: 21, x: 130, y: 620, width: 900, height: 0, content: { type: plain, value: "Underpowered sample — too few users, can't detect lift." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: fail-3-dot, type: circle, z: 20, cx: 90, cy: 780, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: fail-3-text, type: text, z: 21, x: 130, y: 760, width: 900, height: 0, content: { type: plain, value: "Changing 5 things at once — no idea which moved the metric." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: callout, type: text, z: 30, x: 60, y: 980, width: 960, height: 0, content: { type: plain, value: "→ Fix one rule and your test results matter." }, style: { font_family: $body, font_size: 24, font_weight: 600, color: $primary, line_height: 1.4 } }
      - { id: handle, type: text, z: 31, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 3 · 01 Sample size ────────────────────────────
  - id: sample-size
    label: 01 Sample size
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "3 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "01" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "Sample size" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule-body, type: text, z: 20, x: 60, y: 540, width: 960, height: 0, content: { type: plain, value: "Compute n BEFORE you start. Stopping early because \"it looks good\" inflates false positives 2-3×." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: formula-card, type: rect, z: 30, x: 60, y: 800, width: 960, height: 180, radius: 12, fill: { type: solid, color: "$surface" } }
      - { id: formula-label, type: text, z: 31, x: 92, y: 830, width: 900, height: 0, content: { type: plain, value: "FORMULA · 80% POWER, α=0.05" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: formula-text, type: text, z: 32, x: 92, y: 870, width: 900, height: 0, content: { type: plain, value: "n ≈ 16 × σ² / MDE²    (per variant)\n\nExample · baseline 10% conv, want to detect +1% → n ≈ 15,700 per arm." }, style: { font_family: $mono, font_size: 18, color: $text, line_height: 1.55 } }
      - { id: handle, type: text, z: 40, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 4 · 02 One variable ───────────────────────────
  - id: one-variable
    label: 02 One variable
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "4 / 5" }, style: { font_family: $mono, font_size: 18, color: $text_muted } }
      - { id: section-num, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "02" }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: $primary, line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 340, width: 960, height: 0, content: { type: plain, value: "One variable" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: rule-body, type: text, z: 20, x: 60, y: 540, width: 960, height: 0, content: { type: plain, value: "Change ONE thing per test. Multi-variate sounds clever, kills sample size and confounds insight." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: example-card, type: rect, z: 30, x: 60, y: 800, width: 960, height: 220, radius: 12, fill: { type: solid, color: "$surface" } }
      - { id: example-label, type: text, z: 31, x: 92, y: 830, width: 900, height: 0, content: { type: plain, value: "EXAMPLE" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: example-text, type: text, z: 32, x: 92, y: 870, width: 900, height: 0, content: { type: plain, value: "✗ \"Bigger button + new copy + new color\" → which one moved CTR?\n\n✓ Test button copy. Lock everything else. Ship winner. Iterate on color next." }, style: { font_family: $body, font_size: 20, color: $text, line_height: 1.55 } }
      - { id: handle, type: text, z: 40, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: $text_muted } }

  # ── Slide 5 · 03 Significance ≠ relevance + CTA ─────────
  - id: significance-cta
    label: 03 Significance + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 200, stops: [{ color: "$primary", position: 0 }, { color: "$background", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(15,5,35,0.55)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "5 / 5" }, style: { font_family: $mono, font_size: 18, color: "#FFFFFF" } }
      - { id: section-num, type: text, z: 11, x: 60, y: 160, width: 960, height: 0, content: { type: plain, value: "03" }, style: { font_family: $heading, font_size: 100, font_weight: 900, color: "$accent", line_height: 1.0, letter_spacing: -0.05 } }
      - { id: section-title, type: text, z: 12, x: 60, y: 290, width: 960, height: 0, content: { type: plain, value: "Significance ≠ relevance" }, style: { font_family: $heading, font_size: 48, font_weight: 800, color: "#FFFFFF", line_height: 1.05, letter_spacing: -0.02 } }
      - { id: rule-body, type: text, z: 20, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "A 0.3% lift at p=0.04 across 80k users is statistically real and operationally invisible. Ask: would this lift move quarterly OKRs?" }, style: { font_family: $body, font_size: 22, color: "#F0F0FF", line_height: 1.5 } }
      - { id: cta-heading, type: text, z: 30, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "Save → run a\nbetter test." }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: cta-btn, type: rect, z: 31, x: 60, y: 1090, width: 320, height: 68, radius: 34, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 32, x: 60, y: 1110, width: 320, height: 0, content: { type: plain, value: "Follow →" }, style: { font_family: $body, font_size: 22, font_weight: 700, color: "$primary", text_align: center } }
      - { id: handle, type: text, z: 33, x: 60, y: 1260, width: 960, height: 0, content: { type: plain, value: "@yourhandle" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF" } }

slots:
  - { id: cover_title,     path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",     default: "A/B tests that\ndon't lie." }
  - { id: cover_tagline,   path: "pages[0].layers[5].content.value", type: text, hint: "Cover tagline",      default: "3 rules separate signal from noise. Swipe →" }
  - { id: fail_title,      path: "pages[1].layers[4].content.value", type: text, hint: "Fail title",         default: "Why most A/B tests fail" }
  - { id: rule_1_body,     path: "pages[2].layers[5].content.value", type: text, hint: "Sample size body",   default: "Compute n BEFORE you start. Stopping early because \"it looks good\" inflates false positives 2-3×." }
  - { id: rule_1_formula,  path: "pages[2].layers[8].content.value", type: text, hint: "Sample size formula",default: "n ≈ 16 × σ² / MDE²    (per variant)\n\nExample · baseline 10% conv, want to detect +1% → n ≈ 15,700 per arm." }
  - { id: rule_2_body,     path: "pages[3].layers[5].content.value", type: text, hint: "One-variable body",  default: "Change ONE thing per test. Multi-variate sounds clever, kills sample size and confounds insight." }
  - { id: rule_3_body,     path: "pages[4].layers[6].content.value", type: text, hint: "Significance body",  default: "A 0.3% lift at p=0.04 across 80k users is statistically real and operationally invisible. Ask: would this lift move quarterly OKRs?" }
  - { id: cta_heading,     path: "pages[4].layers[7].content.value", type: text, hint: "CTA heading",        default: "Save → run a\nbetter test." }
