_protocol: template/v1

# Apple Watch face — 396×484 portrait (Apple Watch Ultra), dark-tech theme.
# Huge digital time, date row, 4 corner complications, decorative ring.
meta:
  id: tmpl-apple-watch-face
  name: Apple Watch Face
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [watch, apple-watch, wearable, face, screen, dark]
  description: "Custom Apple Watch Ultra face with oversized time, date, decorative ring, and 4 corner complications."

document:
  width: 396
  height: 484
  unit: px
  dpi: 96

theme:
  ref: dark-tech

layers:
  # ── Black backdrop ────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 396
    height: 484
    fill: { type: solid, color: "#000000" }

  # ── Decorative ring (outer) ───────────────────────────────
  - id: ring
    type: circle
    z: 5
    cx: 198
    cy: 242
    rx: 188
    ry: 188
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2, opacity: 0.6 }

  - id: ring-arc
    type: circle
    z: 6
    cx: 198
    cy: 242
    rx: 174
    ry: 174
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$accent", width: 3, opacity: 0.4 }

  # ── Time (HH:MM) ──────────────────────────────────────────
  - id: hours
    type: text
    z: 20
    x: 20
    y: 170
    width: 175
    height: 0
    content: { type: plain, value: "10" }
    style:
      font_family: $heading
      font_size: 132
      font_weight: 800
      color: "$accent"
      text_align: right
      line_height: 1
      letter_spacing: -0.04

  - id: minutes
    type: text
    z: 21
    x: 201
    y: 170
    width: 175
    height: 0
    content: { type: plain, value: "42" }
    style:
      font_family: $heading
      font_size: 132
      font_weight: 800
      color: "#FFFFFF"
      text_align: left
      line_height: 1
      letter_spacing: -0.04

  - id: colon
    type: text
    z: 22
    x: 0
    y: 168
    width: 396
    height: 0
    content: { type: plain, value: ":" }
    style:
      font_family: $heading
      font_size: 124
      font_weight: 800
      color: "$accent"
      text_align: center
      line_height: 1

  # ── Date ──────────────────────────────────────────────────
  - id: date
    type: text
    z: 30
    x: 20
    y: 322
    width: 356
    height: 0
    content: { type: plain, value: "SUN · MAY 17" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 700
      color: $text_muted
      text_align: center
      letter_spacing: 0.18

  # ── TL complication — Battery ─────────────────────────────
  - id: comp-tl-bg
    type: rect
    z: 40
    x: 18
    y: 18
    width: 74
    height: 44
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: comp-tl-icon
    type: rect
    z: 41
    x: 26
    y: 32
    width: 18
    height: 12
    radius: 2
    fill: { type: solid, color: "$accent" }
    stroke: { color: "$accent", width: 1 }

  - id: comp-tl-text
    type: text
    z: 42
    x: 48
    y: 32
    width: 40
    height: 0
    content: { type: plain, value: "87%" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: "#FFFFFF"
      text_align: left

  # ── TR complication — Weather ─────────────────────────────
  - id: comp-tr-bg
    type: rect
    z: 43
    x: 304
    y: 18
    width: 74
    height: 44
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: comp-tr-sun
    type: circle
    z: 44
    cx: 318
    cy: 40
    rx: 8
    ry: 8
    fill: { type: solid, color: "$accent" }

  - id: comp-tr-text
    type: text
    z: 45
    x: 332
    y: 32
    width: 42
    height: 0
    content: { type: plain, value: "72°" }
    style:
      font_family: $mono
      font_size: 13
      font_weight: 700
      color: "#FFFFFF"
      text_align: left

  # ── BL complication — Calendar ────────────────────────────
  - id: comp-bl-bg
    type: rect
    z: 46
    x: 18
    y: 422
    width: 74
    height: 44
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: comp-bl-icon
    type: rect
    z: 47
    x: 26
    y: 434
    width: 18
    height: 18
    radius: 3
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }

  - id: comp-bl-text
    type: text
    z: 48
    x: 48
    y: 434
    width: 40
    height: 0
    content: { type: plain, value: "3pm" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: "#FFFFFF"
      text_align: left

  # ── BR complication — Steps ───────────────────────────────
  - id: comp-br-bg
    type: rect
    z: 49
    x: 304
    y: 422
    width: 74
    height: 44
    radius: 12
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: comp-br-ring
    type: circle
    z: 50
    cx: 318
    cy: 444
    rx: 8
    ry: 8
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$accent", width: 3 }

  - id: comp-br-text
    type: text
    z: 51
    x: 332
    y: 436
    width: 42
    height: 0
    content: { type: plain, value: "8.4k" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: "#FFFFFF"
      text_align: left

slots:
  - { id: hours,   path: "layers[2].content.value", type: text, hint: "Hours (HH)",   default: "10" }
  - { id: minutes, path: "layers[3].content.value", type: text, hint: "Minutes (MM)", default: "42" }
  - { id: date,    path: "layers[5].content.value", type: text, hint: "Date string",  default: "SUN · MAY 17" }
