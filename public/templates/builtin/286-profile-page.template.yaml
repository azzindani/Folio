_protocol: template/v1

# Social profile page — 1080×1920 portrait, pastel-dream theme.
# Cover banner, avatar circle, name + handle + bio, stats row, tabs, 3x3 post grid.
meta:
  id: tmpl-profile-page
  name: Profile Page
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [profile, social, ui, screen, mobile, portrait, pastel]
  description: "Social profile screen with cover banner, avatar, bio, stats row, tabs, and 3x3 grid of post placeholders."

document:
  width: 1080
  height: 1920
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1920
    fill: { type: solid, color: "$background" }

  # ── Cover banner (top 1/3) ────────────────────────────────
  - id: banner
    type: rect
    z: 5
    x: 0
    y: 0
    width: 1080
    height: 540
    fill: { type: solid, color: $primary }
  - id: banner-glow
    type: circle
    z: 6
    cx: 800
    cy: 200
    rx: 320
    ry: 320
    fill: { type: none }
    opacity: 0.35

  # ── Avatar (overlapping) ──────────────────────────────────
  - id: avatar-ring
    type: circle
    z: 10
    cx: 540
    cy: 540
    rx: 156
    ry: 156
    fill: { type: solid, color: "$background" }

  - id: avatar
    type: circle
    z: 11
    cx: 540
    cy: 540
    rx: 140
    ry: 140
    fill: { type: solid, color: $secondary }
  - id: avatar-letter
    type: text
    z: 12
    x: 400
    y: 482
    width: 280
    height: 0
    content: { type: plain, value: "M" }
    style:
      font_family: $heading
      font_size: 120
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  # ── Name + handle + bio ───────────────────────────────────
  - id: name
    type: text
    z: 20
    x: 60
    y: 720
    width: 960
    height: 0
    content: { type: plain, value: "Maya Chen" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: $text
      text_align: center
      letter_spacing: -0.02

  - id: handle
    type: text
    z: 21
    x: 60
    y: 792
    width: 960
    height: 0
    content: { type: plain, value: "@mayadraws" }
    style:
      font_family: $body
      font_size: 22
      font_weight: 500
      color: $primary
      text_align: center

  - id: bio
    type: text
    z: 22
    x: 120
    y: 850
    width: 840
    height: 0
    content: { type: plain, value: "Illustrator + type nerd. Drawing soft things in bright places. Open for commissions." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      text_align: center
      line_height: 1.45

  # ── Stats row ─────────────────────────────────────────────
  - id: stats-bg
    type: rect
    z: 30
    x: 60
    y: 980
    width: 960
    height: 130
    radius: 24
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: stat-followers-num
    type: text
    z: 31
    x: 60
    y: 1006
    width: 320
    height: 0
    content: { type: plain, value: "24.8K" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 800
      color: $text
      text_align: center

  - id: stat-followers-label
    type: text
    z: 32
    x: 60
    y: 1062
    width: 320
    height: 0
    content: { type: plain, value: "Followers" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      text_align: center
      letter_spacing: 0.06

  - id: stat-following-num
    type: text
    z: 33
    x: 380
    y: 1006
    width: 320
    height: 0
    content: { type: plain, value: "412" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 800
      color: $text
      text_align: center

  - id: stat-following-label
    type: text
    z: 34
    x: 380
    y: 1062
    width: 320
    height: 0
    content: { type: plain, value: "Following" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      text_align: center
      letter_spacing: 0.06

  - id: stat-posts-num
    type: text
    z: 35
    x: 700
    y: 1006
    width: 320
    height: 0
    content: { type: plain, value: "186" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 800
      color: $text
      text_align: center

  - id: stat-posts-label
    type: text
    z: 36
    x: 700
    y: 1062
    width: 320
    height: 0
    content: { type: plain, value: "Posts" }
    style:
      font_family: $body
      font_size: 16
      color: $text_muted
      text_align: center
      letter_spacing: 0.06

  # ── Tab bar ───────────────────────────────────────────────
  - id: tab-1
    type: rect
    z: 40
    x: 60
    y: 1160
    width: 300
    height: 56
    radius: 28
    fill: { type: solid, color: "$primary" }

  - id: tab-1-text
    type: text
    z: 41
    x: 60
    y: 1174
    width: 300
    height: 0
    content: { type: plain, value: "Posts" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

  - id: tab-2
    type: rect
    z: 42
    x: 390
    y: 1160
    width: 300
    height: 56
    radius: 28
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: tab-2-text
    type: text
    z: 43
    x: 390
    y: 1174
    width: 300
    height: 0
    content: { type: plain, value: "Reels" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text
      text_align: center

  - id: tab-3
    type: rect
    z: 44
    x: 720
    y: 1160
    width: 300
    height: 56
    radius: 28
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: tab-3-text
    type: text
    z: 45
    x: 720
    y: 1174
    width: 300
    height: 0
    content: { type: plain, value: "Tagged" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text
      text_align: center

  # ── 3x3 post grid ─────────────────────────────────────────
  - id: post-1
    type: rect
    z: 50
    x: 60
    y: 1260
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $primary }
  - id: post-2
    type: rect
    z: 51
    x: 390
    y: 1260
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $secondary }
  - id: post-3
    type: rect
    z: 52
    x: 720
    y: 1260
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $accent }
  - id: post-4
    type: rect
    z: 53
    x: 60
    y: 1480
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $accent }
  - id: post-5
    type: rect
    z: 54
    x: 390
    y: 1480
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $primary }
  - id: post-6
    type: rect
    z: 55
    x: 720
    y: 1480
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $secondary }
  - id: post-7
    type: rect
    z: 56
    x: 60
    y: 1700
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $primary }
  - id: post-8
    type: rect
    z: 57
    x: 390
    y: 1700
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $accent }
  - id: post-9
    type: rect
    z: 58
    x: 720
    y: 1700
    width: 300
    height: 200
    radius: 16
    fill: { type: solid, color: $secondary }
slots:
  - { id: name,      path: "layers[6].content.value",  type: text, hint: "Display name", default: "Maya Chen" }
  - { id: handle,    path: "layers[7].content.value",  type: text, hint: "@handle",      default: "@mayadraws" }
  - { id: bio,       path: "layers[8].content.value",  type: text, hint: "Bio text",     default: "Illustrator + type nerd. Drawing soft things in bright places. Open for commissions." }
  - { id: followers, path: "layers[10].content.value", type: text, hint: "Followers count", default: "24.8K" }
  - { id: following, path: "layers[12].content.value", type: text, hint: "Following count", default: "412" }
  - { id: posts,     path: "layers[14].content.value", type: text, hint: "Posts count",     default: "186" }
