_protocol: template/v1

# Release notes poster — single-page LinkedIn-style software release announcement.
# Version badge hero + three card sections (NEW / IMPROVED / FIXED).
meta:
  id: tmpl-release-notes-poster
  name: Release Notes Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, release, changelog, software, linkedin]

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1200
    height: 12
    fill: { type: solid, color: "$primary" }

  - id: sparkle
    type: circle
    z: 3
    cx: 1080
    cy: 200
    rx: 70
    ry: 70
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.35

  - id: eyebrow
    type: text
    z: 20
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "RELEASE NOTES" }
    style:
      font_family: $mono
      font_size: 16
      font_weight: 600
      color: $primary
      letter_spacing: 0.32
      text_transform: uppercase

  - id: version-badge
    type: text
    z: 21
    x: 80
    y: 170
    width: 1040
    height: 0
    content: { type: plain, value: "v2.1.0" }
    style:
      font_family: $heading
      font_size: 104
      font_weight: 900
      color: $text
      line_height: 1.0
      letter_spacing: -0.03

  - id: version-underline
    type: rect
    z: 22
    x: 80
    y: 290
    width: 280
    height: 6
    rx: 3
    fill: { type: solid, color: "$primary" }

  - id: tagline
    type: text
    z: 23
    x: 80
    y: 330
    width: 1040
    height: 0
    content: { type: plain, value: "Speed, polish, and a brand-new permissions system." }
    style:
      font_family: $heading
      font_size: 30
      font_weight: 600
      color: $text
      line_height: 1.3

  - id: date-caption
    type: text
    z: 24
    x: 80
    y: 400
    width: 1040
    height: 0
    content: { type: plain, value: "Released March 5, 2026" }
    style:
      font_family: $mono
      font_size: 15
      color: $text_muted
      letter_spacing: 0.12

  # Card 1 — NEW
  - id: card-new
    type: rect
    z: 30
    x: 80
    y: 470
    width: 1040
    height: 220
    rx: 12
    fill: { type: solid, color: "$surface" }

  - id: card-new-icon
    type: circle
    z: 31
    cx: 130
    cy: 510
    rx: 14
    ry: 14
    fill: { type: solid, color: "$primary" }

  - id: card-new-title
    type: text
    z: 32
    x: 160
    y: 498
    width: 900
    height: 0
    content: { type: plain, value: "✨ NEW" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 800
      color: $primary
      letter_spacing: 0.04

  - id: card-new-body
    type: text
    z: 33
    x: 110
    y: 555
    width: 980
    height: 0
    content: { type: plain, value: "• Role-based permissions with policy inheritance\n• Workspace API: programmatic seat + scope management\n• Dark theme rewritten — true blacks, calibrated surfaces" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  # Card 2 — IMPROVED
  - id: card-improved
    type: rect
    z: 30
    x: 80
    y: 720
    width: 1040
    height: 220
    rx: 12
    fill: { type: solid, color: "$surface" }

  - id: card-improved-icon
    type: rect
    z: 31
    x: 116
    y: 750
    width: 28
    height: 28
    rx: 6
    fill: { type: solid, color: "$primary" }

  - id: card-improved-title
    type: text
    z: 32
    x: 160
    y: 748
    width: 900
    height: 0
    content: { type: plain, value: "⚡ IMPROVED" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 800
      color: $primary
      letter_spacing: 0.04

  - id: card-improved-body
    type: text
    z: 33
    x: 110
    y: 805
    width: 980
    height: 0
    content: { type: plain, value: "• Search is 40% faster on large workspaces\n• Editor cold-start under 800ms on cached loads\n• Export pipeline now streams — no more 2GB peaks" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  # Card 3 — FIXED
  - id: card-fixed
    type: rect
    z: 30
    x: 80
    y: 970
    width: 1040
    height: 220
    rx: 12
    fill: { type: solid, color: "$surface" }

  - id: card-fixed-icon
    type: circle
    z: 31
    cx: 130
    cy: 1010
    rx: 14
    ry: 14
    fill: { type: solid, color: "$accent" }

  - id: card-fixed-title
    type: text
    z: 32
    x: 160
    y: 998
    width: 900
    height: 0
    content: { type: plain, value: "🐛 FIXED" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 800
      color: $primary
      letter_spacing: 0.04

  - id: card-fixed-body
    type: text
    z: 33
    x: 110
    y: 1055
    width: 980
    height: 0
    content: { type: plain, value: "• Drag handles no longer drift on zoomed canvases\n• Webhook retries now respect exponential backoff\n• Fixed a race causing duplicate undo entries on paste" }
    style:
      font_family: $body
      font_size: 22
      color: $text
      line_height: 1.5

  # Upgrade command code block
  - id: cmd-card
    type: rect
    z: 40
    x: 80
    y: 1230
    width: 720
    height: 80
    rx: 10
    fill: { type: solid, color: "$surface" }

  - id: cmd-prompt
    type: text
    z: 41
    x: 110
    y: 1258
    width: 40
    height: 0
    content: { type: plain, value: "$" }
    style:
      font_family: $mono
      font_size: 20
      font_weight: 700
      color: $primary

  - id: cmd-text
    type: text
    z: 41
    x: 140
    y: 1258
    width: 660
    height: 0
    content: { type: plain, value: "npm install your-pkg@2.1.0" }
    style:
      font_family: $mono
      font_size: 20
      color: $text
      line_height: 1.4

  # Changelog URL
  - id: changelog-label
    type: text
    z: 42
    x: 820
    y: 1240
    width: 300
    height: 0
    content: { type: plain, value: "FULL CHANGELOG" }
    style:
      font_family: $mono
      font_size: 12
      font_weight: 700
      color: $primary
      letter_spacing: 0.28
      text_transform: uppercase

  - id: changelog-url
    type: text
    z: 42
    x: 820
    y: 1268
    width: 300
    height: 0
    content: { type: plain, value: "yourpkg.dev/changelog" }
    style:
      font_family: $mono
      font_size: 16
      color: $text
      line_height: 1.4

  # Footer
  - id: footer-divider
    type: rect
    z: 70
    x: 80
    y: 1380
    width: 1040
    height: 1
    fill: { type: solid, color: "$text_muted" }
    opacity: 0.4

  - id: author
    type: text
    z: 71
    x: 80
    y: 1410
    width: 600
    height: 0
    content: { type: plain, value: "@yourpkg · shipped by the core team" }
    style:
      font_family: $body
      font_size: 16
      color: $text
      line_height: 1.4

  - id: footer-version
    type: text
    z: 71
    x: 820
    y: 1410
    width: 300
    height: 0
    content: { type: plain, value: "v2.1.0 · stable" }
    style:
      font_family: $mono
      font_size: 16
      color: $text_muted
      line_height: 1.4

animations:
  version-badge:
    enter: { type: scale_in, duration: 700, delay: 100 }
  version-underline:
    enter: { type: slide_right, duration: 500, delay: 500 }
  tagline:
    enter: { type: fade_up, duration: 600, delay: 300 }
  card-new:
    enter: { type: fade_up, duration: 600, delay: 400 }
  card-improved:
    enter: { type: fade_up, duration: 600, delay: 600 }
  card-fixed:
    enter: { type: fade_up, duration: 600, delay: 800 }
  sparkle:
    loop: { type: glow, duration: 2200, color: "$primary" }

slots:
  - { id: eyebrow,           path: "layers[3].content.value",  type: text, hint: "Eyebrow label",        default: "RELEASE NOTES" }
  - { id: version,           path: "layers[4].content.value",  type: text, hint: "Version badge",        default: "v2.1.0" }
  - { id: tagline,           path: "layers[6].content.value",  type: text, hint: "Release tagline",      default: "Speed, polish, and a brand-new permissions system." }
  - { id: date,              path: "layers[7].content.value",  type: text, hint: "Release date",         default: "Released March 5, 2026" }
  - { id: new_title,         path: "layers[10].content.value", type: text, hint: "NEW card title",       default: "✨ NEW" }
  - { id: new_bullets,       path: "layers[11].content.value", type: text, hint: "NEW bullets (3 lines)",default: "• Role-based permissions with policy inheritance\n• Workspace API: programmatic seat + scope management\n• Dark theme rewritten — true blacks, calibrated surfaces" }
  - { id: improved_title,    path: "layers[14].content.value", type: text, hint: "IMPROVED card title",  default: "⚡ IMPROVED" }
  - { id: improved_bullets,  path: "layers[15].content.value", type: text, hint: "IMPROVED bullets",     default: "• Search is 40% faster on large workspaces\n• Editor cold-start under 800ms on cached loads\n• Export pipeline now streams — no more 2GB peaks" }
  - { id: fixed_title,       path: "layers[18].content.value", type: text, hint: "FIXED card title",     default: "🐛 FIXED" }
  - { id: fixed_bullets,     path: "layers[19].content.value", type: text, hint: "FIXED bullets",        default: "• Drag handles no longer drift on zoomed canvases\n• Webhook retries now respect exponential backoff\n• Fixed a race causing duplicate undo entries on paste" }
  - { id: upgrade_cmd,       path: "layers[22].content.value", type: text, hint: "Upgrade command",      default: "npm install your-pkg@2.1.0" }
  - { id: changelog_url,     path: "layers[24].content.value", type: text, hint: "Changelog URL",        default: "yourpkg.dev/changelog" }
  - { id: author,            path: "layers[26].content.value", type: text, hint: "Author handle",        default: "@yourpkg · shipped by the core team" }
  - { id: footer_version,    path: "layers[27].content.value", type: text, hint: "Footer version tag",   default: "v2.1.0 · stable" }
