_protocol: template/v1

# 5-slide LinkedIn carousel · Tech debt beyond code (code/process/people).
# Cover → intro → 3 type slides with smell lists → CTA.
meta:
  id: tmpl-linkedin-tech-debt-5slide
  name: LinkedIn Tech Debt (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, engineering, tech-debt, devops, forest, 4-5]
  description: "LinkedIn 4:5 carousel · 3 kinds of tech debt nobody talks about. Forest-deep aesthetic."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: forest-deep

pages:
  # ── 1 · Cover ─────────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 170, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "01 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 400, width: 960, height: 0, content: { type: plain, value: "ENGINEERING CULTURE" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.34, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "Tech debt isn't\njust code debt." }, style: { font_family: $heading, font_size: 96, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: subtitle, type: text, z: 13, x: 60, y: 800, width: 960, height: 0, content: { type: plain, value: "3 kinds that quietly slow every team\n— and how to spot them." }, style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 } }
      - { id: swipe, type: text, z: 14, x: 60, y: 1240, width: 960, height: 0, content: { type: plain, value: "Swipe →" }, style: { font_family: $mono, font_size: 16, color: $primary, letter_spacing: 0.2 } }

  # ── 2 · Intro ─────────────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "02 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 200, width: 960, height: 0, content: { type: plain, value: "THE BIGGER PICTURE" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.34, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 250, width: 960, height: 0, content: { type: plain, value: "Debt accumulates in three places." }, style: { font_family: $heading, font_size: 58, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: row-1, type: text, z: 20, x: 60, y: 540, width: 960, height: 0, content: { type: plain, value: "01 · Code debt   — what we ship" }, style: { font_family: $mono, font_size: 28, color: $text, line_height: 1.7 } }
      - { id: row-2, type: text, z: 21, x: 60, y: 620, width: 960, height: 0, content: { type: plain, value: "02 · Process debt — how we ship" }, style: { font_family: $mono, font_size: 28, color: $text, line_height: 1.7 } }
      - { id: row-3, type: text, z: 22, x: 60, y: 700, width: 960, height: 0, content: { type: plain, value: "03 · People debt  — who ships it" }, style: { font_family: $mono, font_size: 28, color: $text, line_height: 1.7 } }
      - { id: callout, type: rect, z: 30, x: 60, y: 940, width: 960, height: 200, radius: 0, fill: { type: solid, color: "$surface" } }
      - { id: callout-text, type: text, z: 31, x: 92, y: 990, width: 900, height: 0, content: { type: plain, value: "If you only refactor the first one,\nyou're paying interest forever on the other two." }, style: { font_family: $body, font_size: 24, color: $text, line_height: 1.5, font_style: italic } }

  # ── 3 · 01 Code Debt ──────────────────────────────────────
  - id: code-debt
    label: 01 Code Debt
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "03 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: number, type: text, z: 11, x: 60, y: 180, width: 200, height: 0, content: { type: plain, value: "01" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, letter_spacing: 0.3 } }
      - { id: title, type: text, z: 12, x: 60, y: 230, width: 960, height: 0, content: { type: plain, value: "Code debt" }, style: { font_family: $heading, font_size: 80, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: def, type: text, z: 13, x: 60, y: 380, width: 960, height: 0, content: { type: plain, value: "Shortcuts in the codebase that make every future change harder than it should be." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: smell-header, type: text, z: 14, x: 60, y: 620, width: 960, height: 0, content: { type: plain, value: "SMELLS" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: smell-1, type: text, z: 20, x: 60, y: 680, width: 960, height: 0, content: { type: plain, value: "✗ \"TODO: refactor this\" — from 2022" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-2, type: text, z: 21, x: 60, y: 750, width: 960, height: 0, content: { type: plain, value: "✗ tests skipped because they're \"flaky\"" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-3, type: text, z: 22, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "✗ one file owns 12+ responsibilities" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-4, type: text, z: 23, x: 60, y: 890, width: 960, height: 0, content: { type: plain, value: "✗ two ways to do the same thing" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-5, type: text, z: 24, x: 60, y: 960, width: 960, height: 0, content: { type: plain, value: "✗ \"don't touch — nobody knows why\"" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: footer, type: text, z: 30, x: 60, y: 1140, width: 960, height: 0, content: { type: plain, value: "Interest paid in: PR review time." }, style: { font_family: $body, font_size: 22, color: $primary, font_style: italic, line_height: 1.4 } }

  # ── 4 · 02 Process Debt ───────────────────────────────────
  - id: process-debt
    label: 02 Process Debt
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "04 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: number, type: text, z: 11, x: 60, y: 180, width: 200, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, letter_spacing: 0.3 } }
      - { id: title, type: text, z: 12, x: 60, y: 230, width: 960, height: 0, content: { type: plain, value: "Process debt" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.02 } }
      - { id: def, type: text, z: 13, x: 60, y: 380, width: 960, height: 0, content: { type: plain, value: "Workflows that exist because they always have — not because they still serve the team." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: smell-header, type: text, z: 14, x: 60, y: 620, width: 960, height: 0, content: { type: plain, value: "SMELLS" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: smell-1, type: text, z: 20, x: 60, y: 680, width: 960, height: 0, content: { type: plain, value: "✗ standups that should've been a Slack post" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-2, type: text, z: 21, x: 60, y: 750, width: 960, height: 0, content: { type: plain, value: "✗ deploy requires 3 approvals + 2 wiki pages" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-3, type: text, z: 22, x: 60, y: 820, width: 960, height: 0, content: { type: plain, value: "✗ RFC template nobody reads" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-4, type: text, z: 23, x: 60, y: 890, width: 960, height: 0, content: { type: plain, value: "✗ retros with no action items" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: smell-5, type: text, z: 24, x: 60, y: 960, width: 960, height: 0, content: { type: plain, value: "✗ on-call rotation owned by 1 person" }, style: { font_family: $mono, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: footer, type: text, z: 30, x: 60, y: 1140, width: 960, height: 0, content: { type: plain, value: "Interest paid in: time-to-ship." }, style: { font_family: $body, font_size: 22, color: $primary, font_style: italic, line_height: 1.4 } }

  # ── 5 · 03 People Debt + CTA ──────────────────────────────
  - id: people-debt
    label: 03 People Debt
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 180, stops: [{ color: "$primary", position: 0 }, { color: "$background", position: 100 }] } }
      - { id: bg-overlay, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "rgba(0,0,0,0.5)" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "05 / 05" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF", letter_spacing: 0.2 } }
      - { id: number, type: text, z: 11, x: 60, y: 180, width: 200, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, letter_spacing: 0.3 } }
      - { id: title, type: text, z: 12, x: 60, y: 230, width: 960, height: 0, content: { type: plain, value: "People debt" }, style: { font_family: $heading, font_size: 72, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: def, type: text, z: 13, x: 60, y: 380, width: 960, height: 0, content: { type: plain, value: "Knowledge, trust, and ownership concentrated in too few heads." }, style: { font_family: $body, font_size: 26, color: "#F0F0FF", line_height: 1.5 } }
      - { id: smell-header, type: text, z: 14, x: 60, y: 580, width: 960, height: 0, content: { type: plain, value: "SMELLS" }, style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: smell-1, type: text, z: 20, x: 60, y: 640, width: 960, height: 0, content: { type: plain, value: "✗ only one person can deploy on Fridays" }, style: { font_family: $mono, font_size: 22, color: "#FFFFFF", line_height: 1.7 } }
      - { id: smell-2, type: text, z: 21, x: 60, y: 700, width: 960, height: 0, content: { type: plain, value: "✗ onboarding takes 6 weeks, doc is 2 years old" }, style: { font_family: $mono, font_size: 22, color: "#FFFFFF", line_height: 1.7 } }
      - { id: smell-3, type: text, z: 22, x: 60, y: 760, width: 960, height: 0, content: { type: plain, value: "✗ \"ask Dana\" is the actual runbook" }, style: { font_family: $mono, font_size: 22, color: "#FFFFFF", line_height: 1.7 } }
      - { id: cta-title, type: text, z: 30, x: 60, y: 900, width: 960, height: 0, content: { type: plain, value: "Pay it down\non purpose." }, style: { font_family: $heading, font_size: 76, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.02 } }
      - { id: cta-btn, type: rect, z: 31, x: 60, y: 1100, width: 360, height: 72, radius: 36, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 32, x: 60, y: 1122, width: 360, height: 0, content: { type: plain, value: "Save → audit your team" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: "#03001C", text_align: center } }
      - { id: handle, type: text, z: 33, x: 60, y: 1240, width: 960, height: 0, content: { type: plain, value: "@yourhandle · #engineering" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF", letter_spacing: 0.2 } }

slots:
  - { id: cover_title,        path: "pages[0].layers[4].content.value", type: text, hint: "Cover title",         default: "Tech debt isn't\njust code debt." }
  - { id: cover_subtitle,     path: "pages[0].layers[5].content.value", type: text, hint: "Cover subtitle",      default: "3 kinds that quietly slow every team\n— and how to spot them." }
  - { id: intro_title,        path: "pages[1].layers[4].content.value", type: text, hint: "Intro title",         default: "Debt accumulates in three places." }
  - { id: code_def,           path: "pages[2].layers[6].content.value", type: text, hint: "01 Code debt def",    default: "Shortcuts in the codebase that make every future change harder than it should be." }
  - { id: process_def,        path: "pages[3].layers[6].content.value", type: text, hint: "02 Process debt def", default: "Workflows that exist because they always have — not because they still serve the team." }
  - { id: people_def,         path: "pages[4].layers[6].content.value", type: text, hint: "03 People debt def",  default: "Knowledge, trust, and ownership concentrated in too few heads." }
  - { id: cta_title,          path: "pages[4].layers[11].content.value", type: text, hint: "CTA title",          default: "Pay it down\non purpose." }
  - { id: cta_handle,         path: "pages[4].layers[14].content.value", type: text, hint: "Handle / hashtags",  default: "@yourhandle · #engineering" }
