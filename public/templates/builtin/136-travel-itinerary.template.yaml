_protocol: template/v1

# 5-page travel itinerary — 1240×1754 A4 portrait, sunset-glow theme.
# Cover (destination + dates) → 3 day-by-day schedules → packing list + emergency contacts.
meta:
  id: tmpl-travel-itinerary-tokyo
  name: Travel Itinerary · Tokyo (5 pages)
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, travel, itinerary, tokyo, sunset, a4]
  description: "Five-page travel itinerary with cover, three day-by-day schedules with morning/afternoon/evening blocks, and packing list with emergency contacts."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

pages:
  # ── Page 1 · Cover ──────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1240, height: 1754, fill: { type: linear, angle: 165, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 50 }, { color: "$background", position: 100 }] } }
      - { id: sun, type: circle, z: 1, cx: 940, cy: 380, rx: 220, ry: 220, fill: { type: radial, stops: [{ color: "#FFFFFF", position: 0 }, { color: "transparent", position: 100 }] }, opacity: 0.55 }
