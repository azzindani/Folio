pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "COMMERCE OPS · FY2026 TTM · GLOBAL STOREFRONT"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**GMV Performance — Trailing 12 Months**\n*$128.6M GMV · 484K orders · 7.2% over plan*"

      - id: kpi-gmv
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: GMV ($M)
        value: 128.6
        format: number
        decimals: 1
        delta: 18.4
        delta_format: percent
        sparkline_data: gmv_trend
        sparkline_field: gmv_m
        sparkline_color: "$primary"

      - id: kpi-orders
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Orders
        value: 484200
        format: number
        delta: 14.6
        delta_format: percent

      - id: kpi-aov
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: AOV
        value: 265.6
        format: currency
        currency: USD
        delta: 3.4
        delta_format: percent

      - id: kpi-conversion
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Conversion
        value: 3.4
        format: percent
        delta: 0.3
        delta_format: percent

      - id: kpi-returns
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Returns
        value: 8.2
        format: percent
        delta: -0.6
        delta_format: percent

      - id: section-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Monthly GMV vs Target**"

      - id: chart-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 360
        chart_type: line
        data_ref: gmv_trend
        x_field: month
        y_field: gmv_m
        title: GMV ($M) vs Target — Trailing 12 Months
        legend: true
        grid: true
        animate: true

      - id: section-categories
        type: rich_text
        x: 60
        y: 860
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top Categories**"

      - id: tbl-categories
        type: interactive_table
        x: 60
        y: 920
        width: 1160
        height: 480
        data_ref: categories
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: category,    title: Category,    width: 360, sortable: true, formatter: badge }
          - { field: gmv_m,       title: GMV ($M),    width: 200, sortable: true, formatter: number,   align: right }
          - { field: orders,      title: Orders,      width: 200, sortable: true, formatter: number,   align: right }
          - { field: aov,         title: AOV,         width: 200, sortable: true, formatter: currency, align: right }
          - { field: growth_pct,  title: YoY %,       width: 200, sortable: true, formatter: delta,    align: right }

      - id: section-skus
        type: rich_text
        x: 60
        y: 1440
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top 12 SKUs**"

      - id: tbl-skus
        type: interactive_table
        x: 60
        y: 1500
        width: 1160
        height: 540
        data_ref: top_skus
        pagination: true
        page_size: 12
        filterable: true
        exportable: true
        columns:
          - { field: sku,        title: SKU,           width: 200, sortable: true }
          - { field: name,       title: Product,       width: 360, sortable: true }
          - { field: revenue,    title: Revenue,       width: 180, sortable: true, formatter: currency, align: right }
          - { field: units,      title: Units,         width: 140, sortable: true, formatter: number,   align: right }
          - { field: stock,      title: Stock On-Hand, width: 160, sortable: true, formatter: number,   align: right }
          - { field: velocity_d, title: Velocity (d),  width: 120, sortable: true, formatter: number,   align: right }

      - id: section-regions
        type: rich_text
        x: 60
        y: 2080
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Regional Performance ($M GMV)**"

      - id: chart-regions
        type: interactive_chart
        x: 60
        y: 2140
        width: 760
        height: 320
        chart_type: bar
        data_ref: regions
        x_field: region
        y_field: apparel
        title: GMV by Region — Stacked by Category
        legend: true
        grid: true
        animate: true

      - id: chart-channels
        type: interactive_chart
        x: 840
        y: 2140
        width: 380
        height: 320
        chart_type: donut
        data_ref: channels
        x_field: channel
        y_field: attributed_gmv_m
        title: Marketing Attribution ($M)
        legend: true
        animate: true

slots:
  - { id: report_title,       path: "pages[0].layers[1].content",  type: text, hint: "Report title",       default: "**GMV Performance — Trailing 12 Months**\n*$128.6M GMV · 484K orders · 7.2% over plan*" }
  - { id: report_eyebrow,     path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",       default: "COMMERCE OPS · FY2026 TTM · GLOBAL STOREFRONT" }
  - { id: trend_section,      path: "pages[0].layers[7].content",  type: text, hint: "Trend heading",      default: "**Monthly GMV vs Target**" }
  - { id: categories_section, path: "pages[0].layers[9].content",  type: text, hint: "Categories heading", default: "**Top Categories**" }
  - { id: skus_section,       path: "pages[0].layers[11].content", type: text, hint: "SKUs heading",       default: "**Top 12 SKUs**" }
  - { id: regions_section,    path: "pages[0].layers[13].content", type: text, hint: "Regions heading",    default: "**Regional Performance ($M GMV)**" }
