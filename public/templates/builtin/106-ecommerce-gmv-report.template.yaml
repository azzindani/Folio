_protocol: template/v1

# E-commerce GMV — hero w/ GMV banner, 5 KPIs (GMV, orders, AOV, conversion,
# returns), monthly GMV vs target line, top categories table, top SKUs table,
# region stacked bar, marketing-channel attribution donut.
meta:
  id: tmpl-ecommerce-gmv-report
  name: E-commerce · GMV Performance
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, ecommerce, gmv, orders, conversion, interactive]
  description: "E-commerce GMV performance: orders, AOV, conversion, top categories & SKUs, regional split, channel attribution."

document:
