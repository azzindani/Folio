_protocol: template/v1

# Learning platform course analytics — 4 KPIs (active learners, completion,
# avg hours, rating), 12-week enrollment line, top-courses table, cohort
# retention chart, drop-off-points table, 3 learner feedback quotes.
meta:
  id: tmpl-learning-platform-report
  name: Learning Platform · Course Analytics
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, learning, education, courses, retention, interactive]
  description: "Online learning analytics: enrollments, completion, top courses, cohort retention, drop-off points, learner voice."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

report:
  layout: scroll
  data:
    sources:
      - id: enrollment_trend
        type: inline
        rows:
          - { week: W1,  enrollments: 4280, completions: 2842 }
          - { week: W2,  enrollments: 4420, completions: 3018 }
          - { week: W3,  enrollments: 4680, completions: 3142 }
          - { week: W4,  enrollments: 4940, completions: 3284 }
          - { week: W5,  enrollments: 5180, completions: 3486 }
          - { week: W6,  enrollments: 5420, completions: 3624 }
          - { week: W7,  enrollments: 5640, completions: 3842 }
          - { week: W8,  enrollments: 5880, completions: 4018 }
          - { week: W9,  enrollments: 6120, completions: 4248 }
          - { week: W10, enrollments: 6380, completions: 4486 }
          - { week: W11, enrollments: 6680, completions: 4742 }
          - { week: W12, enrollments: 6940, completions: 4986 }
      - id: top_courses
        type: inline
        rows:
          - { course: "Python for Data Science — Foundations", enrollments: 14820, completion_pct: 68.4, rating: 4.7, revenue: 184200 }
          - { course: "Machine Learning with TensorFlow",      enrollments: 12480, completion_pct: 52.6, rating: 4.5, revenue: 248600 }
          - { course: "Frontend with React & TypeScript",      enrollments: 11240, completion_pct: 64.8, rating: 4.6, revenue: 162800 }
          - { course: "AWS Solutions Architect Prep",          enrollments:  9820, completion_pct: 48.2, rating: 4.4, revenue: 296400 }
          - { course: "Product Management Fundamentals",       enrollments:  8640, completion_pct: 71.4, rating: 4.8, revenue: 108200 }
          - { course: "SQL for Analysts — Zero to Hero",       enrollments:  8240, completion_pct: 74.2, rating: 4.7, revenue:  82400 }
          - { course: "UX Research Methods",                   enrollments:  6820, completion_pct: 62.4, rating: 4.6, revenue:  98600 }
          - { course: "Generative AI for Developers",          enrollments:  6480, completion_pct: 44.8, rating: 4.3, revenue: 142800 }
          - { course: "Kubernetes in Production",              enrollments:  5240, completion_pct: 38.6, rating: 4.4, revenue: 124800 }
          - { course: "Financial Modeling in Excel",           enrollments:  4820, completion_pct: 68.2, rating: 4.5, revenue:  72600 }
      - id: cohort_retention
        type: inline
        rows:
          - { week: W0, retained: 100.0 }
          - { week: W1, retained:  78.4 }
          - { week: W2, retained:  64.2 }
          - { week: W3, retained:  54.8 }
          - { week: W4, retained:  48.6 }
          - { week: W5, retained:  44.2 }
          - { week: W6, retained:  40.8 }
          - { week: W7, retained:  38.4 }
          - { week: W8, retained:  36.2 }
      - id: drop_offs
        type: inline
        rows:
          - { module: "M1 — Welcome & Setup",          visited: 14820, completed: 14242, drop_off_pct:  3.9 }
          - { module: "M2 — Core Concepts",            visited: 14242, completed: 12848, drop_off_pct:  9.8 }
          - { module: "M3 — Hands-on Lab 1",           visited: 12848, completed: 11142, drop_off_pct: 13.3 }
          - { module: "M4 — Intermediate Patterns",    visited: 11142, completed:  9468, drop_off_pct: 15.0 }
          - { module: "M5 — Capstone Brief",           visited:  9468, completed:  6842, drop_off_pct: 27.7 }
          - { module: "M6 — Hands-on Lab 2",           visited:  6842, completed:  5286, drop_off_pct: 22.7 }
          - { module: "M7 — Advanced Topics",          visited:  5286, completed:  4128, drop_off_pct: 21.9 }
          - { module: "M8 — Final Assessment",         visited:  4128, completed:  3842, drop_off_pct:  6.9 }

pages:
  - id: overview
    label: Overview
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: "$mono"
        font_size: 12
        font_weight: 600
        letter_spacing: 1
        color: "$primary"
        content: "LEARNING PLATFORM · Q2 FY2026 · ACADEMY"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 88
        format: markdown
        font_family: Playfair Display
        font_size: 56
        font_weight: 800
        line_height: 1.04
        letter_spacing: -0.02
        color: "$text"
        content: "**Course Analytics — Quarterly Review**"

      - id: kpi-learners
        type: kpi_card
        x: 60
        y: 180
        width: 290
        height: 140
        label: Active Learners
        value: 84620
        format: number
        delta: 24.6
        delta_format: percent
        sparkline_data: enrollment_trend
        sparkline_field: enrollments
        sparkline_color: "$primary"

      - id: kpi-completion
        type: kpi_card
        x: 370
        y: 180
        width: 290
        height: 140
        label: Completion Rate
        value: 62.8
        format: percent
        delta: 4.2
        delta_format: percent

      - id: kpi-hours
        type: kpi_card
        x: 680
        y: 180
        width: 290
        height: 140
        label: Avg Hours / Learner
        value: 18.4
        format: number
        decimals: 1
        delta: 2.6
        delta_format: number

      - id: kpi-rating
        type: kpi_card
        x: 990
        y: 180
        width: 230
        height: 140
        label: Avg Course Rating
        value: 4.6
        format: number
        decimals: 1
        delta: 0.1
        delta_format: number

      - id: section-enrollment
        type: rich_text
        x: 60
        y: 360
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 28
        font_weight: 800
        letter_spacing: -0.02
        content: "**Enrollment Trend — Last 12 Weeks**"

      - id: chart-enrollment
        type: interactive_chart
        x: 60
        y: 420
        width: 1160
        height: 360
        chart_type: line
        data_ref: enrollment_trend
        x_field: week
        y_field: enrollments
        title: Enrollments vs Completions
        legend: true
        grid: true
        animate: true

      - id: section-courses
        type: rich_text
        x: 60
        y: 820
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 28
        font_weight: 800
        letter_spacing: -0.02
        content: "**Top 10 Courses**"

      - id: tbl-courses
        type: interactive_table
        x: 60
        y: 880
        width: 1160
        height: 500
        data_ref: top_courses
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: course,         title: Course,         width: 420, sortable: true }
          - { field: enrollments,    title: Enrollments,    width: 180, sortable: true, formatter: number,   align: right }
          - { field: completion_pct, title: Completion %,   width: 180, sortable: true, formatter: percent,  align: right }
          - { field: rating,         title: Rating,         width: 140, sortable: true, formatter: number,   align: right }
          - { field: revenue,        title: Revenue,        width: 200, sortable: true, formatter: currency, align: right }

      - id: section-cohort
        type: rich_text
        x: 60
        y: 1420
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 28
        font_weight: 800
        letter_spacing: -0.02
        content: "**Cohort Retention — % of W0 Learners Active**"

      - id: chart-cohort
        type: interactive_chart
        x: 60
        y: 1480
        width: 1160
        height: 320
        chart_type: line
        data_ref: cohort_retention
        x_field: week
        y_field: retained
        title: 8-Week Cohort Retention Curve
        legend: false
        grid: true
        animate: true

      - id: section-dropoffs
        type: rich_text
        x: 60
        y: 1840
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 28
        font_weight: 800
        letter_spacing: -0.02
        content: "**Module Drop-off Points**"

      - id: tbl-dropoffs
        type: interactive_table
        x: 60
        y: 1900
        width: 1160
        height: 420
        data_ref: drop_offs
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: module,        title: Module,         width: 480, sortable: true }
          - { field: visited,       title: Visited,        width: 220, sortable: true, formatter: number,  align: right }
          - { field: completed,     title: Completed,      width: 220, sortable: true, formatter: number,  align: right }
          - { field: drop_off_pct,  title: Drop-off %,     width: 240, sortable: true, formatter: percent, align: right }

      - id: section-feedback
        type: rich_text
        x: 60
        y: 2360
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 28
        font_weight: 800
        letter_spacing: -0.02
        content: "**Learner Voice**"

      - id: quote-1
        type: rich_text
        x: 60
        y: 2420
        width: 380
        height: 200
        format: markdown
        font_family: Playfair Display
        font_size: 16
        line_height: 1.5
        content: |
          > *"The capstone in M5 was where I finally felt I was building something real. The first four modules clicked into place once I had to apply them."*
          >
          > — Elena R., Data Analyst · Buenos Aires

      - id: quote-2
        type: rich_text
        x: 460
        y: 2420
        width: 380
        height: 200
        format: markdown
        font_family: Playfair Display
        font_size: 16
        line_height: 1.5
        content: |
          > *"Lab 2 took me three sittings. I'd recommend chunking it into two shorter labs — the cognitive load is real after 90 minutes."*
          >
          > — Tomás G., Backend Engineer · Lisbon

      - id: quote-3
        type: rich_text
        x: 860
        y: 2420
        width: 360
        height: 200
        format: markdown
        font_family: Playfair Display
        font_size: 16
        line_height: 1.5
        content: |
          > *"Office hours saved this course for me. The recorded videos are great but the live Q&A is what turned passive watching into actual learning."*
          >
          > — Aiko M., Product Lead · Osaka

      - id: rule-top
        type: rect
        z: 12
        x: 60
        y: 162
        width: 1160
        height: 1
        fill: { type: solid, color: "$border" }

      - id: rule-tick
        type: rect
        z: 13
        x: 60
        y: 159
        width: 140
        height: 6
        fill: { type: solid, color: "$primary" }

slots:
  - { id: report_title,        path: "pages[0].layers[1].content",  type: text, hint: "Report title",         default: "**Course Analytics — Quarterly Review**" }
  - { id: report_eyebrow,      path: "pages[0].layers[0].content",  type: text, hint: "Eyebrow line",         default: "LEARNING PLATFORM · Q2 FY2026 · ACADEMY" }
  - { id: enrollment_section,  path: "pages[0].layers[6].content",  type: text, hint: "Enrollment heading",   default: "**Enrollment Trend — Last 12 Weeks**" }
  - { id: courses_section,     path: "pages[0].layers[8].content",  type: text, hint: "Courses heading",      default: "**Top 10 Courses**" }
  - { id: cohort_section,      path: "pages[0].layers[10].content", type: text, hint: "Cohort heading",       default: "**Cohort Retention — % of W0 Learners Active**" }
  - { id: dropoffs_section,    path: "pages[0].layers[12].content", type: text, hint: "Drop-off heading",     default: "**Module Drop-off Points**" }
  - { id: feedback_section,    path: "pages[0].layers[14].content", type: text, hint: "Feedback heading",     default: "**Learner Voice**" }
