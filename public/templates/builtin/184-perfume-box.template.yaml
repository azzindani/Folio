_protocol: template/v1

# Luxury perfume box front — 800×1400 portrait, editorial-cream theme.
# Maison name top in elegant serif, scent name large in serif italic,
# "EAU DE PARFUM" classification with gold rule, gold filigree corner
# ornaments (diamond + line motifs), volume + made-in footer.
meta:
  id: tmpl-perfume-box
  name: Perfume Box
  type: label
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [packaging, label, perfume, fragrance, luxury, editorial, portrait]
  description: "Luxury perfume box front with maison name, scent name, classification, volume, and made-in."

document:
  width: 800
  height: 1400
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 800
    height: 1400
    fill: { type: solid, color: "$background" }

  # ── Outer gold frame ──────────────────────────────────────
  - id: frame-outer
    type: rect
    z: 1
    x: 50
    y: 50
    width: 700
    height: 1300
    fill: { type: none }
    stroke: { color: "$primary", width: 2 }

  - id: frame-inner
    type: rect
    z: 2
    x: 70
    y: 70
    width: 660
    height: 1260
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  # ── Filigree corner top-left ──────────────────────────────
  - id: fil-tl-line-h
    type: line
    z: 5
    x1: 100
    y1: 130
    x2: 200
    y2: 130
    stroke: { color: "$primary", width: 1 }

  - id: fil-tl-line-v
    type: line
    z: 6
    x1: 100
    y1: 130
    x2: 100
    y2: 230
    stroke: { color: "$primary", width: 1 }

  - id: fil-tl-diamond
    type: rect
    z: 7
    x: 94
    y: 124
    width: 12
    height: 12
    rotation: 45
    fill: { type: solid, color: "$primary" }

  # ── Filigree corner top-right ─────────────────────────────
  - id: fil-tr-line-h
    type: line
    z: 8
    x1: 600
    y1: 130
    x2: 700
    y2: 130
    stroke: { color: "$primary", width: 1 }

  - id: fil-tr-line-v
    type: line
    z: 9
    x1: 700
    y1: 130
    x2: 700
    y2: 230
    stroke: { color: "$primary", width: 1 }

  - id: fil-tr-diamond
    type: rect
    z: 10
    x: 694
    y: 124
    width: 12
    height: 12
    rotation: 45
    fill: { type: solid, color: "$primary" }

  # ── Filigree corner bottom-left ───────────────────────────
  - id: fil-bl-line-h
    type: line
    z: 11
    x1: 100
    y1: 1270
    x2: 200
    y2: 1270
    stroke: { color: "$primary", width: 1 }

  - id: fil-bl-line-v
    type: line
    z: 12
    x1: 100
    y1: 1170
    x2: 100
    y2: 1270
    stroke: { color: "$primary", width: 1 }

  - id: fil-bl-diamond
    type: rect
    z: 13
    x: 94
    y: 1264
    width: 12
    height: 12
    rotation: 45
    fill: { type: solid, color: "$primary" }

  # ── Filigree corner bottom-right ──────────────────────────
  - id: fil-br-line-h
    type: line
    z: 14
    x1: 600
    y1: 1270
    x2: 700
    y2: 1270
    stroke: { color: "$primary", width: 1 }

  - id: fil-br-line-v
    type: line
    z: 15
    x1: 700
    y1: 1170
    x2: 700
    y2: 1270
    stroke: { color: "$primary", width: 1 }

  - id: fil-br-diamond
    type: rect
    z: 16
    x: 694
    y: 1264
    width: 12
    height: 12
    rotation: 45
    fill: { type: solid, color: "$primary" }

  # ── Maison name ───────────────────────────────────────────
  - id: maison
    type: text
    z: 25
    x: 100
    y: 200
    width: 600
    height: 0
    content: { type: plain, value: "MAISON D'ARGENT" }
    style:
      font_family: $heading
      font_size: 28
      font_weight: 700
      color: $text
      text_align: center
      letter_spacing: 0.62
      text_transform: uppercase

  - id: maison-sub
    type: text
    z: 26
    x: 100
    y: 246
    width: 600
    height: 0
    content: { type: plain, value: "paris · est. 1923"
    }
    style:
      font_family: $body
      font_size: 11
      font_style: italic
      color: $text_muted
      text_align: center
      letter_spacing: 0.32

  # ── Decorative central flourish ───────────────────────────
  - id: cent-line-1
    type: rect
    z: 30
    x: 380
    y: 320
    width: 40
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: cent-diamond
    type: rect
    z: 31
    x: 392
    y: 312
    width: 16
    height: 16
    rotation: 45
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: cent-line-2
    type: rect
    z: 32
    x: 360
    y: 360
    width: 80
    height: 1
    fill: { type: solid, color: "$primary" }

  # ── Scent name (serif italic) ─────────────────────────────
  - id: scent-name
    type: text
    z: 40
    x: 60
    y: 460
    width: 680
    height: 0
    content: { type: plain, value: "Nuit de Velours" }
    style:
      font_family: $heading
      font_size: 76
      font_style: italic
      font_weight: 400
      color: $text
      text_align: center
      line_height: 1.05
      letter_spacing: -0.01

  - id: scent-no
    type: text
    z: 41
    x: 100
    y: 580
    width: 600
    height: 0
    content: { type: plain, value: "·  no. xxi  ·" }
    style:
      font_family: $heading
      font_size: 16
      font_style: italic
      color: $primary
      text_align: center
      letter_spacing: 0.32

  # ── Mid divider ───────────────────────────────────────────
  - id: mid-rule
    type: rect
    z: 50
    x: 250
    y: 700
    width: 300
    height: 1
    fill: { type: solid, color: "$primary" }

  # ── Classification ────────────────────────────────────────
  - id: classification
    type: text
    z: 51
    x: 100
    y: 730
    width: 600
    height: 0
    content: { type: plain, value: "EAU DE PARFUM" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 600
      color: $text
      text_align: center
      letter_spacing: 0.62
      text_transform: uppercase

  - id: classification-sub
    type: text
    z: 52
    x: 100
    y: 770
    width: 600
    height: 0
    content: { type: plain, value: "natural spray vaporisateur"
    }
    style:
      font_family: $body
      font_size: 12
      font_style: italic
      color: $text_muted
      text_align: center
      letter_spacing: 0.18

  # ── Bottom divider ────────────────────────────────────────
  - id: bot-rule
    type: rect
    z: 53
    x: 250
    y: 820
    width: 300
    height: 1
    fill: { type: solid, color: "$primary" }

  # ── Notes hint ────────────────────────────────────────────
  - id: notes-hint
    type: text
    z: 55
    x: 140
    y: 880
    width: 520
    height: 0
    content: { type: plain, value: "an opulent composition of bourbon vanilla, smoked oud, and Damascus rose" }
    style:
      font_family: $body
      font_size: 13
      font_style: italic
      color: $text
      text_align: center
      line_height: 1.6

  # ── Crest circle ──────────────────────────────────────────
  - id: crest-circle
    type: circle
    z: 60
    cx: 400
    cy: 1080
    r: 48
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: crest-circle-inner
    type: circle
    z: 61
    cx: 400
    cy: 1080
    r: 38
    fill: { type: none }
    stroke: { color: "$primary", width: 1 }

  - id: crest-text
    type: text
    z: 62
    x: 352
    y: 1064
    width: 96
    height: 0
    content: { type: plain, value: "M·A" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 700
      color: $primary
      text_align: center
      line_height: 1.5

  # ── Footer rule ───────────────────────────────────────────
  - id: footer-rule
    type: rect
    z: 70
    x: 100
    y: 1200
    width: 600
    height: 1
    fill: { type: solid, color: "$primary" }

  # ── Volume + made-in ──────────────────────────────────────
  - id: volume
    type: text
    z: 71
    x: 100
    y: 1220
    width: 280
    height: 0
    content: { type: plain, value: "100 ml ℮ 3.4 fl. oz." }
    style:
      font_family: $body
      font_size: 12
      font_weight: 600
      color: $text
      text_align: left
      letter_spacing: 0.24

  - id: made-in
    type: text
    z: 72
    x: 420
    y: 1220
    width: 280
    height: 0
    content: { type: plain, value: "MADE IN FRANCE" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 600
      color: $text
      text_align: right
      letter_spacing: 0.32

  - id: footer-fineprint
    type: text
    z: 73
    x: 100
    y: 1260
    width: 600
    height: 0
    content: { type: plain, value: "FLAMMABLE  ·  KEEP AWAY FROM HEAT  ·  AVOID EYE CONTACT"
    }
    style:
      font_family: $body
      font_size: 9
      font_weight: 600
      color: $text_muted
      text_align: center
      letter_spacing: 0.42

slots:
  - { id: maison,         path: "layers[15].content.value", type: text, hint: "Maison / house name",   default: "MAISON D'ARGENT" }
  - { id: scent_name,     path: "layers[20].content.value", type: text, hint: "Scent name",            default: "Nuit de Velours" }
  - { id: classification, path: "layers[23].content.value", type: text, hint: "Classification",        default: "EAU DE PARFUM" }
  - { id: volume_ml,      path: "layers[31].content.value", type: text, hint: "Volume",                default: "100 ml ℮ 3.4 fl. oz." }
  - { id: made_in,        path: "layers[32].content.value", type: text, hint: "Made-in country",       default: "MADE IN FRANCE" }
