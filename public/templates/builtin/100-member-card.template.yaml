_protocol: template/v1

# Premium membership card — 1050×600 horizontal, dark-tech theme.
# Layout: large monogram top-left, glowing tier badge top-right,
# member name + ID + valid-thru lower-left, magnetic-strip band
# at bottom, holographic gradient backdrop.
meta:
  id: tmpl-member-card
  name: Membership Card · Premium
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, membership, loyalty, premium, dark, horizontal]
  description: "Premium membership card with monogram, tier badge, member ID, valid-thru, and magnetic-strip band."

document:
  width: 1050
  height: 600
  unit: px
  dpi: 300

theme:
  ref: dark-tech

layers:
  # ── Background (holographic gradient) ─────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1050
    height: 600
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 50 }
        - { color: "$background", position: 100 }

  - id: bg-overlay
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1050
    height: 600
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.18

  - id: bg-noise
    type: rect
    z: 2
    x: 0
    y: 0
    width: 1050
    height: 600
    fill:
      type: noise
      opacity: 0.05
      frequency: 0.9
      octaves: 2

  # ── Monogram (top-left) ──────────────────────────────────
  - id: mono-ring
    type: circle
    z: 10
    cx: 100
    cy: 100
    rx: 44
    ry: 44
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }

  - id: mono-inner
    type: circle
    z: 11
    cx: 100
    cy: 100
    rx: 34
    ry: 34
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }

  - id: mono-letter
    type: text
    z: 12
    x: 60
    y: 84
    width: 80
    height: 0
    content: { type: plain, value: "F" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1

  # ── Brand name beside monogram ───────────────────────────
  - id: brand-name
    type: text
    z: 13
    x: 160
    y: 85
    width: 400
    height: 0
    content: { type: plain, value: "FOLIO CLUB" }
    style:
      font_family: $heading
      font_size: 22
      font_weight: 800
      color: $text
      letter_spacing: 0.4
      line_height: 1.2
      text_transform: uppercase

  - id: brand-tag
    type: text
    z: 14
    x: 160
    y: 115
    width: 400
    height: 0
    content: { type: plain, value: "members since 2018" }
    style:
      font_family: $body
      font_size: 12
      font_style: italic
      color: $text_muted
      line_height: 1.3

  # ── Tier badge (top-right) ───────────────────────────────
  - id: tier-bg
    type: rect
    z: 20
    x: 800
    y: 70
    width: 180
    height: 60
    radius: 30
    fill:
      type: linear
      angle: 90
      stops:
        - { color: "$primary", position: 0 }
        - { color: "$secondary", position: 100 }

  - id: tier-text
    type: text
    z: 21
    x: 800
    y: 88
    width: 180
    height: 0
    content: { type: plain, value: "PLATINUM" }
    style:
      font_family: $heading
      font_size: 20
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.6
      text_align: center
      line_height: 1.2

  # ── Decorative chip (mid-left) ───────────────────────────
  - id: chip
    type: rect
    z: 30
    x: 80
    y: 250
    width: 80
    height: 60
    radius: 8
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "#D4AF37", position: 0 }
        - { color: "#8C6B1B", position: 100 }

  - id: chip-line-1
    type: rect
    z: 31
    x: 92
    y: 268
    width: 56
    height: 1
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.6

  - id: chip-line-2
    type: rect
    z: 32
    x: 92
    y: 280
    width: 56
    height: 1
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.6

  - id: chip-line-3
    type: rect
    z: 33
    x: 92
    y: 292
    width: 56
    height: 1
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.6

  - id: chip-divider
    type: rect
    z: 34
    x: 118
    y: 260
    width: 1
    height: 40
    fill: { type: solid, color: "#FFFFFF" }
    opacity: 0.6

  # ── Member name ───────────────────────────────────────────
  - id: member-label
    type: text
    z: 40
    x: 80
    y: 360
    width: 600
    height: 0
    content: { type: plain, value: "MEMBER" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.5
      text_transform: uppercase

  - id: member-name
    type: text
    z: 41
    x: 80
    y: 384
    width: 600
    height: 0
    content: { type: plain, value: "AISHA VANDERVELDE" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 700
      color: $text
      letter_spacing: 0.04
      line_height: 1.2
      text_transform: uppercase

  # ── Member ID (lower-left) ───────────────────────────────
  - id: id-label
    type: text
    z: 50
    x: 80
    y: 460
    width: 320
    height: 0
    content: { type: plain, value: "MEMBER ID" }
    style:
      font_family: $body
      font_size: 10
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.5
      text_transform: uppercase

  - id: id-value
    type: text
    z: 51
    x: 80
    y: 478
    width: 320
    height: 0
    content: { type: plain, value: "FC · 4824 · 9170" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 600
      color: $text
      letter_spacing: 0.2
      line_height: 1.3

  # ── Valid through (lower-mid) ────────────────────────────
  - id: valid-label
    type: text
    z: 52
    x: 440
    y: 460
    width: 240
    height: 0
    content: { type: plain, value: "VALID THROUGH" }
    style:
      font_family: $body
      font_size: 10
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.5
      text_transform: uppercase

  - id: valid-value
    type: text
    z: 53
    x: 440
    y: 478
    width: 240
    height: 0
    content: { type: plain, value: "12/2028" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 600
      color: $primary
      letter_spacing: 0.2
      line_height: 1.3

  # ── Status pill (lower-right) ────────────────────────────
  - id: status-dot
    type: circle
    z: 54
    cx: 800
    cy: 475
    rx: 5
    ry: 5
    fill: { type: solid, color: "#34D399" }

  - id: status-text
    type: text
    z: 55
    x: 815
    y: 467
    width: 200
    height: 0
    content: { type: plain, value: "ACTIVE MEMBER" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text
      letter_spacing: 0.3
      text_transform: uppercase
      line_height: 1.3

  # ── Magnetic-strip band (bottom) ─────────────────────────
  - id: strip-bg
    type: rect
    z: 60
    x: 0
    y: 540
    width: 1050
    height: 60
    fill: { type: solid, color: "#0A0A12" }

  - id: strip-inner
    type: rect
    z: 61
    x: 0
    y: 555
    width: 1050
    height: 30
    fill: { type: solid, color: "#1A1A24" }
    opacity: 0.8

  - id: strip-shimmer
    type: rect
    z: 62
    x: 0
    y: 555
    width: 1050
    height: 30
    fill:
      type: linear
      angle: 90
      stops:
        - { color: "transparent", position: 0 }
        - { color: "$primary", position: 50 }
        - { color: "transparent", position: 100 }
    opacity: 0.15

  # ── Subtle corner accent ─────────────────────────────────
  - id: corner-accent
    type: polygon
    z: 70
    points: "950,0 1050,0 1050,100"
    fill:
      type: linear
      angle: 135
      stops:
        - { color: "$secondary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.4

slots:
  - { id: member_name,   path: "layers[16].content.value", type: text, hint: "Member full name",  default: "AISHA VANDERVELDE" }
  - { id: tier,          path: "layers[9].content.value",  type: text, hint: "Membership tier",   default: "PLATINUM" }
  - { id: member_id,     path: "layers[18].content.value", type: text, hint: "Member ID",         default: "FC · 4824 · 9170" }
  - { id: valid_through, path: "layers[20].content.value", type: text, hint: "Valid through date", default: "12/2028" }
