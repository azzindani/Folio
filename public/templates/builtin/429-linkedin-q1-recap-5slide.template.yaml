_protocol: template/v1

# 5-slide LinkedIn carousel — Q1 2026 recap with stats grid + retros.
# 1080×1350 portrait, editorial-cream theme.
meta:
  id: tmpl-linkedin-q1-recap-5slide
  name: LinkedIn Q1 Recap (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, finance, quarterly, recap, retrospective, 4-5]
  description: "5-slide quarterly recap — cover, stats grid, wins, misses, Q2 priorities + CTA."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "1 / 5" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 380
        width: 960
        height: 0
        content: { type: plain, value: "QUARTERLY UPDATE" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 440
        width: 960
        height: 0
        content: { type: plain, value: "Q1 2026\nin 5 slides." }
        style: { font_family: $heading, font_size: 120, font_weight: 800, color: $text, line_height: 1.0, letter_spacing: -0.03 }
      - id: subline
        type: text
        z: 13
        x: 60
        y: 940
        width: 960
        height: 0
        content: { type: plain, value: "The numbers, the wins, the misses, the next bets." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: swipe
        type: text
        z: 14
        x: 60
        y: 1240
        width: 960
        height: 0
        content: { type: plain, value: "Swipe →" }
        style: { font_family: $body, font_size: 22, font_weight: 700, color: $primary }

  - id: numbers
    label: By the numbers
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$primary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "2 / 5" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "BY THE NUMBERS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "The four that matter." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: stat-1-label
        type: text
        z: 20
        x: 60
        y: 460
        width: 480
        height: 0
        content: { type: plain, value: "ARR" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.36, text_transform: uppercase }
      - id: stat-1-value
        type: text
        z: 21
        x: 60
        y: 500
        width: 480
        height: 0
        content: { type: plain, value: "$4.2M" }
        style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }
      - id: stat-1-delta
        type: text
        z: 22
        x: 60
        y: 620
        width: 480
        height: 0
        content: { type: plain, value: "+47% YoY" }
        style: { font_family: $body, font_size: 22, font_weight: 600, color: $accent }
      - id: stat-2-label
        type: text
        z: 23
        x: 600
        y: 460
        width: 420
        height: 0
        content: { type: plain, value: "CUSTOMERS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.36, text_transform: uppercase }
      - id: stat-2-value
        type: text
        z: 24
        x: 600
        y: 500
        width: 420
        height: 0
        content: { type: plain, value: "1,847" }
        style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }
      - id: stat-2-delta
        type: text
        z: 25
        x: 600
        y: 620
        width: 420
        height: 0
        content: { type: plain, value: "+312 net new" }
        style: { font_family: $body, font_size: 22, font_weight: 600, color: $accent }
      - id: stat-3-label
        type: text
        z: 26
        x: 60
        y: 800
        width: 480
        height: 0
        content: { type: plain, value: "NPS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.36, text_transform: uppercase }
      - id: stat-3-value
        type: text
        z: 27
        x: 60
        y: 840
        width: 480
        height: 0
        content: { type: plain, value: "58" }
        style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }
      - id: stat-3-delta
        type: text
        z: 28
        x: 60
        y: 960
        width: 480
        height: 0
        content: { type: plain, value: "+11 from Q4" }
        style: { font_family: $body, font_size: 22, font_weight: 600, color: $accent }
      - id: stat-4-label
        type: text
        z: 29
        x: 600
        y: 800
        width: 420
        height: 0
        content: { type: plain, value: "GROSS RETENTION" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $text_muted, letter_spacing: 0.36, text_transform: uppercase }
      - id: stat-4-value
        type: text
        z: 30
        x: 600
        y: 840
        width: 420
        height: 0
        content: { type: plain, value: "94%" }
        style: { font_family: $heading, font_size: 96, font_weight: 900, color: $primary, line_height: 1, letter_spacing: -0.03 }
      - id: stat-4-delta
        type: text
        z: 31
        x: 600
        y: 960
        width: 420
        height: 0
        content: { type: plain, value: "+2 pts" }
        style: { font_family: $body, font_size: 22, font_weight: 600, color: $accent }

  - id: worked
    label: What worked
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "3 / 5" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "WHAT WORKED" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Three things to double down on." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - id: win-1-mark
        type: text
        z: 20
        x: 60
        y: 500
        width: 60
        height: 0
        content: { type: plain, value: "✓" }
        style: { font_family: $body, font_size: 36, font_weight: 800, color: $accent }
      - id: win-1-text
        type: text
        z: 21
        x: 130
        y: 510
        width: 890
        height: 0
        content: { type: plain, value: "Onboarding flow rewrite cut time-to-value from 14 days to 4." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: win-2-mark
        type: text
        z: 22
        x: 60
        y: 680
        width: 60
        height: 0
        content: { type: plain, value: "✓" }
        style: { font_family: $body, font_size: 36, font_weight: 800, color: $accent }
      - id: win-2-text
        type: text
        z: 23
        x: 130
        y: 690
        width: 890
        height: 0
        content: { type: plain, value: "Annual plan offer at month 3 lifted ACV by 32%." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: win-3-mark
        type: text
        z: 24
        x: 60
        y: 860
        width: 60
        height: 0
        content: { type: plain, value: "✓" }
        style: { font_family: $body, font_size: 36, font_weight: 800, color: $accent }
      - id: win-3-text
        type: text
        z: 25
        x: 130
        y: 870
        width: 890
        height: 0
        content: { type: plain, value: "Two senior eng hires shipped the v2 API ahead of plan." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }

  - id: missed
    label: What didn't
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$secondary" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "4 / 5" }
        style: { font_family: $mono, font_size: 16, color: $text_muted }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "WHAT DIDN'T" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Three calls to honestly admit." }
        style: { font_family: $heading, font_size: 56, font_weight: 700, color: $text, line_height: 1.15, letter_spacing: -0.02 }
      - id: miss-1-mark
        type: text
        z: 20
        x: 60
        y: 500
        width: 60
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $body, font_size: 36, font_weight: 800, color: $secondary }
      - id: miss-1-text
        type: text
        z: 21
        x: 130
        y: 510
        width: 890
        height: 0
        content: { type: plain, value: "Enterprise tier missed its target. Sales cycles ran 4 weeks longer than modeled." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: miss-2-mark
        type: text
        z: 22
        x: 60
        y: 680
        width: 60
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $body, font_size: 36, font_weight: 800, color: $secondary }
      - id: miss-2-text
        type: text
        z: 23
        x: 130
        y: 690
        width: 890
        height: 0
        content: { type: plain, value: "Paid social burned $80k with sub-1× CAC payback. Killed in March." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }
      - id: miss-3-mark
        type: text
        z: 24
        x: 60
        y: 860
        width: 60
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $body, font_size: 36, font_weight: 800, color: $secondary }
      - id: miss-3-text
        type: text
        z: 25
        x: 130
        y: 870
        width: 890
        height: 0
        content: { type: plain, value: "Hired a head of marketing too early — role split into two ICs." }
        style: { font_family: $body, font_size: 28, color: $text, line_height: 1.5 }

  - id: priorities-cta
    label: Q2 priorities + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: $primary } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 10, fill: { type: solid, color: "$accent" } }
      - id: counter
        type: text
        z: 10
        x: 60
        y: 60
        width: 200
        height: 0
        content: { type: plain, value: "5 / 5" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }
      - id: eyebrow
        type: text
        z: 11
        x: 60
        y: 160
        width: 960
        height: 0
        content: { type: plain, value: "Q2 PRIORITIES" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 12
        x: 60
        y: 220
        width: 960
        height: 0
        content: { type: plain, value: "Three bets for the quarter ahead." }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02 }
      - id: pri-1
        type: text
        z: 20
        x: 60
        y: 500
        width: 960
        height: 0
        content: { type: plain, value: "1. Ship usage-based pricing + grandfather existing accounts." }
        style: { font_family: $body, font_size: 26, color: "#FFFFFF", line_height: 1.5 }
      - id: pri-2
        type: text
        z: 21
        x: 60
        y: 600
        width: 960
        height: 0
        content: { type: plain, value: "2. Hire two AEs in EMEA — open the second region." }
        style: { font_family: $body, font_size: 26, color: "#FFFFFF", line_height: 1.5 }
      - id: pri-3
        type: text
        z: 22
        x: 60
        y: 700
        width: 960
        height: 0
        content: { type: plain, value: "3. Launch the partner program with 5 integrations." }
        style: { font_family: $body, font_size: 26, color: "#FFFFFF", line_height: 1.5 }
      - id: cta-heading
        type: text
        z: 30
        x: 60
        y: 940
        width: 960
        height: 0
        content: { type: plain, value: "What's your Q1 grade?" }
        style: { font_family: $heading, font_size: 56, font_weight: 800, color: "#FFFFFF", line_height: 1.1, letter_spacing: -0.02 }
      - id: cta-sub
        type: text
        z: 31
        x: 60
        y: 1090
        width: 960
        height: 0
        content: { type: plain, value: "Follow for the Q2 retro in 90 days." }
        style: { font_family: $body, font_size: 24, color: "#FFFFFF" }
      - id: handle
        type: text
        z: 32
        x: 60
        y: 1260
        width: 960
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 16, color: "#FFFFFF" }

slots:
  - { id: cover_title,    path: "pages[0].layers[4].content.value", type: text, hint: "Cover headline",      default: "Q1 2026\nin 5 slides." }
  - { id: cover_subline,  path: "pages[0].layers[5].content.value", type: text, hint: "Cover subline",       default: "The numbers, the wins, the misses, the next bets." }
  - { id: stat_1_value,   path: "pages[1].layers[6].content.value", type: text, hint: "Stat 1 value (ARR)",  default: "$4.2M" }
  - { id: stat_2_value,   path: "pages[1].layers[9].content.value", type: text, hint: "Stat 2 value (Cust)", default: "1,847" }
  - { id: stat_3_value,   path: "pages[1].layers[12].content.value", type: text, hint: "Stat 3 value (NPS)", default: "58" }
  - { id: stat_4_value,   path: "pages[1].layers[15].content.value", type: text, hint: "Stat 4 value (Ret)", default: "94%" }
  - { id: win_1,          path: "pages[2].layers[6].content.value", type: text, hint: "Win 1",               default: "Onboarding flow rewrite cut time-to-value from 14 days to 4." }
  - { id: win_2,          path: "pages[2].layers[8].content.value", type: text, hint: "Win 2",               default: "Annual plan offer at month 3 lifted ACV by 32%." }
  - { id: win_3,          path: "pages[2].layers[10].content.value", type: text, hint: "Win 3",              default: "Two senior eng hires shipped the v2 API ahead of plan." }
  - { id: miss_1,         path: "pages[3].layers[6].content.value", type: text, hint: "Miss 1",              default: "Enterprise tier missed its target. Sales cycles ran 4 weeks longer than modeled." }
  - { id: miss_2,         path: "pages[3].layers[8].content.value", type: text, hint: "Miss 2",              default: "Paid social burned $80k with sub-1× CAC payback. Killed in March." }
  - { id: miss_3,         path: "pages[3].layers[10].content.value", type: text, hint: "Miss 3",             default: "Hired a head of marketing too early — role split into two ICs." }
  - { id: priority_1,     path: "pages[4].layers[5].content.value", type: text, hint: "Priority 1",          default: "1. Ship usage-based pricing + grandfather existing accounts." }
  - { id: priority_2,     path: "pages[4].layers[6].content.value", type: text, hint: "Priority 2",          default: "2. Hire two AEs in EMEA — open the second region." }
  - { id: priority_3,     path: "pages[4].layers[7].content.value", type: text, hint: "Priority 3",          default: "3. Launch the partner program with 5 integrations." }
  - { id: cta_heading,    path: "pages[4].layers[8].content.value", type: text, hint: "CTA heading",         default: "What's your Q1 grade?" }
  - { id: cta_handle,     path: "pages[4].layers[10].content.value", type: text, hint: "Footer handle",      default: "@yourhandle" }
