_protocol: template/v1

# Origami diagram — 1240×1754 A4 portrait, light-clean.
# Model name, 6 numbered step illustrations (polygon folds + arrow polygons), difficulty + paper requirements.
meta:
  id: tmpl-origami-diagram
  name: Origami Diagram
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, origami, paper, craft, japanese, a4, diagram]
  description: "Origami fold diagram with model name, 6 numbered step illustrations using polygons for fold representations, arrow indicators, and difficulty + paper-size info."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # Header
  - id: eyebrow
    type: text
    z: 1
    x: 60
    y: 70
    width: 1120
    height: 0
    content: { type: plain, value: "TRADITIONAL ORIGAMI  ·  折り紙" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: "$primary"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase

  - id: model-name
    type: text
    z: 2
    x: 60
    y: 100
    width: 1120
    height: 0
    content: { type: plain, value: "The Crane (Tsuru)" }
    style:
      font_family: $heading
      font_size: 52
      font_weight: 800
      color: "$text"
      text_align: center
      letter_spacing: -0.01

  - id: model-sub
    type: text
    z: 3
    x: 60
    y: 168
    width: 1120
    height: 0
    content: { type: plain, value: "DIFFICULTY: INTERMEDIATE  ·  PAPER: 15×15 cm KAMI  ·  ~12 STEPS · TIME ~10 min" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.4
      text_transform: uppercase

  - id: header-rule
    type: rect
    z: 4
    x: 60
    y: 210
    width: 1120
    height: 1
    fill: { type: solid, color: "$border" }

  # Step 1 — square (paper)
  - id: step1-panel
    type: rect
    z: 5
    x: 60
    y: 250
    width: 360
    height: 420
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
  - id: step1-label
    type: text
    z: 6
    x: 60
    y: 270
    width: 360
    height: 0
    content: { type: plain, value: "STEP 1  ·  START" }
    style: { font_family: $heading, font_size: 16, font_weight: 800, color: "$primary", text_align: center, letter_spacing: 0.32, text_transform: uppercase }
  - id: step1-square
    type: polygon
    z: 7
    points: "150,330 330,330 330,510 150,510"
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$text", width: 2 }
  - id: step1-caption
    type: text
    z: 8
    x: 80
    y: 540
    width: 320
    height: 0
    content: { type: plain, value: "Begin with a square sheet, colored side down." }
    style: { font_family: $body, font_size: 13, color: "$text", text_align: center, line_height: 1.5 }

  # Step 2 — triangle fold (diagonal crease)
  - id: step2-panel
    type: rect
    z: 5
    x: 440
    y: 250
    width: 360
    height: 420
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
  - id: step2-label
    type: text
    z: 6
    x: 440
    y: 270
    width: 360
    height: 0
    content: { type: plain, value: "STEP 2  ·  DIAGONAL" }
    style: { font_family: $heading, font_size: 16, font_weight: 800, color: "$primary", text_align: center, letter_spacing: 0.32, text_transform: uppercase }
  - id: step2-triangle
    type: polygon
    z: 7
    points: "530,510 710,330 710,510"
    fill: { type: solid, color: "$accent" }
    opacity: 0.3
    stroke: { color: "$text", width: 2 }
  - id: step2-triangle-outline
    type: polygon
    z: 7
    points: "530,510 530,330 710,330 710,510"
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 1 }
  - id: step2-arrow
    type: polygon
    z: 8
    points: "540,400 600,400 600,380 640,420 600,460 600,440 540,440"
    fill: { type: solid, color: "$secondary" }
  - id: step2-caption
    type: text
    z: 9
    x: 460
    y: 540
    width: 320
    height: 0
    content: { type: plain, value: "Fold corner to corner along the diagonal. Unfold." }
    style: { font_family: $body, font_size: 13, color: "$text", text_align: center, line_height: 1.5 }

  # Step 3 — vertical fold
  - id: step3-panel
    type: rect
    z: 5
    x: 820
    y: 250
    width: 360
    height: 420
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
  - id: step3-label
    type: text
    z: 6
    x: 820
    y: 270
    width: 360
    height: 0
    content: { type: plain, value: "STEP 3  ·  VERTICAL CREASE" }
    style: { font_family: $heading, font_size: 16, font_weight: 800, color: "$primary", text_align: center, letter_spacing: 0.32, text_transform: uppercase }
  - id: step3-square
    type: polygon
    z: 7
    points: "910,330 1090,330 1090,510 910,510"
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$text", width: 2 }
  - id: step3-crease
    type: rect
    z: 8
    x: 998
    y: 330
    width: 2
    height: 180
    fill: { type: solid, color: "$accent" }
    opacity: 0.7
  - id: step3-arrow-down
    type: polygon
    z: 8
    points: "920,420 960,420 960,400 980,440 960,480 960,460 920,460"
    fill: { type: solid, color: "$secondary" }
  - id: step3-caption
    type: text
    z: 9
    x: 840
    y: 540
    width: 320
    height: 0
    content: { type: plain, value: "Fold in half vertically and unfold to mark the crease." }
    style: { font_family: $body, font_size: 13, color: "$text", text_align: center, line_height: 1.5 }

  # Step 4 — preliminary base (square base)
  - id: step4-panel
    type: rect
    z: 5
    x: 60
    y: 720
    width: 360
    height: 420
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
  - id: step4-label
    type: text
    z: 6
    x: 60
    y: 740
    width: 360
    height: 0
    content: { type: plain, value: "STEP 4  ·  PRELIMINARY BASE" }
    style: { font_family: $heading, font_size: 16, font_weight: 800, color: "$primary", text_align: center, letter_spacing: 0.32, text_transform: uppercase }
  - id: step4-diamond
    type: polygon
    z: 7
    points: "240,790 330,890 240,990 150,890"
    fill: { type: solid, color: "$primary" }
    opacity: 0.25
    stroke: { color: "$text", width: 2 }
  - id: step4-diamond-divline
    type: rect
    z: 8
    x: 150
    y: 889
    width: 180
    height: 2
    fill: { type: solid, color: "$text" }
  - id: step4-caption
    type: text
    z: 9
    x: 80
    y: 1010
    width: 320
    height: 0
    content: { type: plain, value: "Collapse along creases to form the preliminary base diamond." }
    style: { font_family: $body, font_size: 13, color: "$text", text_align: center, line_height: 1.5 }

  # Step 5 — petal fold (bird base)
  - id: step5-panel
    type: rect
    z: 5
    x: 440
    y: 720
    width: 360
    height: 420
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
  - id: step5-label
    type: text
    z: 6
    x: 440
    y: 740
    width: 360
    height: 0
    content: { type: plain, value: "STEP 5  ·  PETAL FOLD" }
    style: { font_family: $heading, font_size: 16, font_weight: 800, color: "$primary", text_align: center, letter_spacing: 0.32, text_transform: uppercase }
  - id: step5-bird-body
    type: polygon
    z: 7
    points: "620,820 700,890 620,960 540,890"
    fill: { type: solid, color: "$primary" }
    opacity: 0.25
    stroke: { color: "$text", width: 2 }
  - id: step5-bird-flap-l
    type: polygon
    z: 8
    points: "620,820 550,810 540,890"
    fill: { type: solid, color: "$accent" }
    opacity: 0.35
    stroke: { color: "$text", width: 2 }
  - id: step5-bird-flap-r
    type: polygon
    z: 8
    points: "620,820 690,810 700,890"
    fill: { type: solid, color: "$accent" }
    opacity: 0.35
    stroke: { color: "$text", width: 2 }
  - id: step5-caption
    type: text
    z: 9
    x: 460
    y: 1010
    width: 320
    height: 0
    content: { type: plain, value: "Lift front layer, petal-fold along creased lines to form bird base." }
    style: { font_family: $body, font_size: 13, color: "$text", text_align: center, line_height: 1.5 }

  # Step 6 — finished crane
  - id: step6-panel
    type: rect
    z: 5
    x: 820
    y: 720
    width: 360
    height: 420
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }
  - id: step6-label
    type: text
    z: 6
    x: 820
    y: 740
    width: 360
    height: 0
    content: { type: plain, value: "STEP 6  ·  COMPLETE" }
    style: { font_family: $heading, font_size: 16, font_weight: 800, color: "$primary", text_align: center, letter_spacing: 0.32, text_transform: uppercase }
  # Crane silhouette — body, head, wing, tail
  - id: step6-body
    type: polygon
    z: 7
    points: "1000,890 1060,870 1090,890 1060,920 1000,910"
    fill: { type: solid, color: "$text" }
  - id: step6-head
    type: polygon
    z: 8
    points: "1090,890 1140,880 1130,860"
    fill: { type: solid, color: "$text" }
  - id: step6-wing-up
    type: polygon
    z: 8
    points: "1030,860 1050,800 1080,860"
    fill: { type: solid, color: "$text" }
  - id: step6-wing-down
    type: polygon
    z: 8
    points: "1020,920 1040,980 1070,920"
    fill: { type: solid, color: "$text" }
  - id: step6-tail
    type: polygon
    z: 8
    points: "950,870 990,890 950,910"
    fill: { type: solid, color: "$text" }
  - id: step6-caption
    type: text
    z: 9
    x: 840
    y: 1010
    width: 320
    height: 0
    content: { type: plain, value: "Pull head and tail outward; gently spread wings. The crane is complete!" }
    style: { font_family: $body, font_size: 13, color: "$text", text_align: center, line_height: 1.5 }

  # Symbols legend
  - id: legend-box
    type: rect
    z: 20
    x: 60
    y: 1200
    width: 1120
    height: 260
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$accent", width: 2 }

  - id: legend-title
    type: text
    z: 21
    x: 90
    y: 1220
    width: 1080
    height: 0
    content: { type: plain, value: "SYMBOLS USED IN THIS DIAGRAM" }
    style:
      font_family: $heading
      font_size: 16
      font_weight: 800
      color: "$accent"
      letter_spacing: 0.32
      text_transform: uppercase

  - id: leg-1-mark
    type: rect
    z: 22
    x: 90
    y: 1260
    width: 60
    height: 2
    fill: { type: solid, color: "$text" }
  - id: leg-1-text
    type: text
    z: 23
    x: 170
    y: 1252
    width: 360
    height: 0
    content: { type: plain, value: "─── valley fold (fold toward you)" }
    style: { font_family: $body, font_size: 13, color: "$text" }

  - id: leg-2-mark
    type: rect
    z: 22
    x: 90
    y: 1300
    width: 18
    height: 2
    fill: { type: solid, color: "$text" }
  - id: leg-2-mark-2
    type: rect
    z: 22
    x: 116
    y: 1300
    width: 18
    height: 2
    fill: { type: solid, color: "$text" }
  - id: leg-2-text
    type: text
    z: 23
    x: 170
    y: 1292
    width: 360
    height: 0
    content: { type: plain, value: "- - - mountain fold (fold away from you)" }
    style: { font_family: $body, font_size: 13, color: "$text" }

  - id: leg-3-arrow
    type: polygon
    z: 22
    points: "90,1340 130,1340 130,1330 150,1345 130,1360 130,1350"
    fill: { type: solid, color: "$secondary" }
  - id: leg-3-text
    type: text
    z: 23
    x: 170
    y: 1336
    width: 360
    height: 0
    content: { type: plain, value: "▸ direction of fold or motion" }
    style: { font_family: $body, font_size: 13, color: "$text" }

  - id: leg-4-mark
    type: circle
    z: 22
    cx: 120
    cy: 1390
    rx: 16
    ry: 16
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 2 }
  - id: leg-4-text
    type: text
    z: 23
    x: 170
    y: 1382
    width: 360
    height: 0
    content: { type: plain, value: "○ rotate model" }
    style: { font_family: $body, font_size: 13, color: "$text" }

  - id: leg-5-mark
    type: rect
    z: 22
    x: 600
    y: 1260
    width: 28
    height: 28
    fill: { type: solid, color: "$accent" }
    opacity: 0.4
    stroke: { color: "$text", width: 1 }
  - id: leg-5-text
    type: text
    z: 23
    x: 650
    y: 1264
    width: 460
    height: 0
    content: { type: plain, value: "colored side = front of paper visible" }
    style: { font_family: $body, font_size: 13, color: "$text" }

  - id: leg-6-mark
    type: rect
    z: 22
    x: 600
    y: 1300
    width: 28
    height: 28
    fill: { type: solid, color: "#FFFFFF" }
    stroke: { color: "$text", width: 1 }
  - id: leg-6-text
    type: text
    z: 23
    x: 650
    y: 1304
    width: 460
    height: 0
    content: { type: plain, value: "white side = back of paper visible" }
    style: { font_family: $body, font_size: 13, color: "$text" }

  # Tips footer
  - id: tip-text
    type: text
    z: 30
    x: 60
    y: 1520
    width: 1120
    height: 0
    content:
      type: plain
      value: "TIP — Crease each fold sharply with a fingernail or bone folder for cleaner, more accurate results.\nTake your time on Steps 4–5. The bird base is the foundation for hundreds of other models."
    style:
      font_family: $body
      font_size: 14
      font_style: italic
      color: "$text"
      text_align: center
      line_height: 1.7

  - id: footer
    type: text
    z: 31
    x: 60
    y: 1700
    width: 1120
    height: 0
    content: { type: plain, value: "© FOLIO PAPER STUDIO  ·  TRADITIONAL JAPANESE FOLD  ·  AGE 8+" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: "$text_muted"
      text_align: center
      letter_spacing: 0.4
      text_transform: uppercase

slots:
  - { id: model_name, path: "layers[2].content.value", type: text, hint: "Model name",           default: "The Crane (Tsuru)" }
  - { id: difficulty, path: "layers[3].content.value", type: text, hint: "Difficulty meta line", default: "DIFFICULTY: INTERMEDIATE  ·  PAPER: 15×15 cm KAMI  ·  ~12 STEPS · TIME ~10 min" }
  - { id: paper_size, path: "layers[1].content.value", type: text, hint: "Eyebrow / discipline", default: "TRADITIONAL ORIGAMI  ·  折り紙" }
