      - { id: caption-num, type: text, z: 21, x: 120, y: 770, width: 80, height: 0, content: { type: plain, value: "3" }, style: { font_family: $heading, font_size: 60, font_weight: 800, color: $primary, line_height: 1 } }
      - { id: caption-text, type: text, z: 22, x: 220, y: 790, width: 760, height: 0, content: { type: plain, value: "The path opened into a garden full of singing flowers, and a tiny owl welcomed Pip with a soft hoot. ‘We've been waiting,' it said." }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: $text, line_height: 1.5 } }
      - { id: page-num, type: text, z: 30, x: 60, y: 1010, width: 960, height: 0, content: { type: plain, value: "4 of 5" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.2 } }

  # ── Page 5 · The End ────────────────────────────────────────
  - id: the-end
    label: The End
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1080, fill: { type: linear, angle: 180, stops: [{ color: "$surface", position: 0 }, { color: "$background", position: 100 }] } }
