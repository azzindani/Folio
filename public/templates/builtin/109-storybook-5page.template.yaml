      - { id: ring-1, type: circle, z: 2, cx: 540, cy: 540, rx: 280, ry: 280, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 2 }, opacity: 0.4 }
      - { id: ring-2, type: circle, z: 3, cx: 540, cy: 540, rx: 220, ry: 220, fill: { type: solid, color: "transparent" }, stroke: { color: "$secondary", width: 2 }, opacity: 0.5 }
      - { id: star-1, type: text, z: 4, x: 240, y: 220, width: 80, height: 0, content: { type: plain, value: "✦" }, style: { font_family: $heading, font_size: 36, color: $secondary, text_align: center } }
      - { id: star-2, type: text, z: 4, x: 800, y: 240, width: 80, height: 0, content: { type: plain, value: "✧" }, style: { font_family: $heading, font_size: 28, color: $primary, text_align: center } }
      - { id: star-3, type: text, z: 4, x: 240, y: 820, width: 80, height: 0, content: { type: plain, value: "✧" }, style: { font_family: $heading, font_size: 32, color: $primary, text_align: center } }
      - { id: star-4, type: text, z: 4, x: 800, y: 820, width: 80, height: 0, content: { type: plain, value: "✦" }, style: { font_family: $heading, font_size: 40, color: $secondary, text_align: center } }
      - { id: kicker, type: text, z: 10, x: 60, y: 440, width: 960, height: 0, content: { type: plain, value: "AND THAT WAS THE NIGHT" }, style: { font_family: $body, font_size: 18, font_weight: 700, color: $primary, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: title, type: text, z: 11, x: 60, y: 490, width: 960, height: 0, content: { type: plain, value: "The End." }, style: { font_family: $heading, font_size: 132, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03, text_align: center } }
      - { id: sub, type: text, z: 12, x: 60, y: 680, width: 960, height: 0, content: { type: plain, value: "Sweet dreams, little adventurer." }, style: { font_family: $heading, font_size: 28, font_style: italic, color: $text_muted, text_align: center, line_height: 1.4 } }
      - { id: cred, type: text, z: 13, x: 60, y: 900, width: 960, height: 0, content: { type: plain, value: "Hartwell & Sato · Honeybee Books · 2026" }, style: { font_family: $body, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.2 } }
      - { id: page-num, type: text, z: 14, x: 60, y: 1010, width: 960, height: 0, content: { type: plain, value: "5 of 5" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: center, letter_spacing: 0.2 } }

slots:
  - { id: title,           path: "pages[0].layers[10].content.value", type: text, hint: "Story title",       default: "Pip and the\nMoonlit Garden" }
  - { id: author,          path: "pages[0].layers[11].content.value", type: text, hint: "Story credit",      default: "story by Eliza Hartwell · pictures by Tomo Sato" }
  - { id: scene_1_caption, path: "pages[1].layers[18].content.value", type: text, hint: "Scene 1 caption",   default: "Pip the rabbit lived in a small wooden house at the edge of the meadow. Every night, when the moon came out, Pip would peek out the window and dream of adventures." }
  - { id: scene_2_caption, path: "pages[2].layers[22].content.value", type: text, hint: "Scene 2 caption",   default: "One quiet evening, Pip followed a trail of glowing fireflies down a path that twisted between the silver-tipped grass." }
  - { id: scene_3_caption, path: "pages[3].layers[20].content.value", type: text, hint: "Scene 3 caption",   default: "The path opened into a garden full of singing flowers, and a tiny owl welcomed Pip with a soft hoot. ‘We've been waiting,' it said." }
  - { id: ending,          path: "pages[4].layers[12].content.value", type: text, hint: "Ending subtitle",   default: "Sweet dreams, little adventurer." }
