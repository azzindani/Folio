_protocol: template/v1

# Single-page poster — Team values, 3 vertical tiles each with icon + name + line.
# Indigo-pro, formal but warm.
meta:
  id: tmpl-team-values-poster
  name: Team Values Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, leadership, team, culture, values, 4-5]
  description: "Indigo-pro poster declaring three core team values in vertically stacked tiles with icon, name, and tagline."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: indigo-pro

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1500
    fill: { type: solid, color: "$background" }

  - id: accent-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 1200
    height: 10
    fill: { type: solid, color: "$primary" }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 130
    width: 1040
    height: 0
    content: { type: plain, value: "OUR VALUES" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $primary
      letter_spacing: 0.4
      text_transform: uppercase

  - id: title
    type: text
    z: 11
    x: 80
    y: 180
    width: 1040
    height: 0
    content: { type: plain, value: "What we believe\nwhen the work\ngets hard." }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.03

  # ── Tile 1 ───────────────────────────────────────────────
  - id: tile-1-bg
    type: rect
    z: 20
    x: 80
    y: 500
    width: 1040
    height: 240
    radius: 12
    fill: { type: solid, color: "$surface" }

  - id: tile-1-icon
    type: rect
    z: 21
    x: 120
    y: 540
    width: 120
    height: 120
    radius: 24
    fill: { type: solid, color: "$primary" }

  - id: tile-1-name
    type: text
    z: 22
    x: 280
    y: 540
    width: 800
    height: 0
    content: { type: plain, value: "Ship to learn." }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: tile-1-desc
    type: text
    z: 23
    x: 280
    y: 620
    width: 800
    height: 0
    content: { type: plain, value: "We'd rather ship the rough version and learn in days than polish the perfect version for months." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.45

  # ── Tile 2 ───────────────────────────────────────────────
  - id: tile-2-bg
    type: rect
    z: 20
    x: 80
    y: 770
    width: 1040
    height: 240
    radius: 12
    fill: { type: solid, color: "$surface" }

  - id: tile-2-icon
    type: circle
    z: 21
    cx: 180
    cy: 870
    rx: 60
    ry: 60
    fill: { type: solid, color: "$accent" }

  - id: tile-2-name
    type: text
    z: 22
    x: 280
    y: 810
    width: 800
    height: 0
    content: { type: plain, value: "Tell the truth." }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: tile-2-desc
    type: text
    z: 23
    x: 280
    y: 890
    width: 800
    height: 0
    content: { type: plain, value: "Disagree in the room. Decide and commit. Bad news travels in straight lines, not whispers." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.45

  # ── Tile 3 ───────────────────────────────────────────────
  - id: tile-3-bg
    type: rect
    z: 20
    x: 80
    y: 1040
    width: 1040
    height: 240
    radius: 12
    fill: { type: solid, color: "$surface" }

  - id: tile-3-icon
    type: rect
    z: 21
    x: 120
    y: 1080
    width: 120
    height: 120
    radius: 60
    fill: { type: solid, color: "$primary" }

  - id: tile-3-name
    type: text
    z: 22
    x: 280
    y: 1080
    width: 800
    height: 0
    content: { type: plain, value: "Own it together." }
    style:
      font_family: $heading
      font_size: 44
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: tile-3-desc
    type: text
    z: 23
    x: 280
    y: 1160
    width: 800
    height: 0
    content: { type: plain, value: "There is no \"your half.\" If it touches the team, it's the team's. Credit and blame travel as one." }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.45

  - id: footer
    type: text
    z: 30
    x: 80
    y: 1410
    width: 1040
    height: 0
    content: { type: plain, value: "What we believe at <Team>" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.3
      text_transform: uppercase

animations:
  title:
    enter: { type: fade_up, duration: 700, delay: 100, easing: ease-out }
  tile-1-bg:
    enter: { type: slide_up, duration: 600, delay: 400, easing: ease-out }
  tile-2-bg:
    enter: { type: slide_up, duration: 600, delay: 600, easing: ease-out }
  tile-3-bg:
    enter: { type: slide_up, duration: 600, delay: 800, easing: ease-out }
  eyebrow:
    enter: { type: fade_in, duration: 500, delay: 0, easing: ease-out }

slots:
  - { id: eyebrow,      path: "layers[2].content.value",  type: text, hint: "Eyebrow tag",        default: "OUR VALUES" }
  - { id: title,        path: "layers[3].content.value",  type: text, hint: "Title",              default: "What we believe\nwhen the work\ngets hard." }
  - { id: value_1_name, path: "layers[6].content.value",  type: text, hint: "Value 1 name",       default: "Ship to learn." }
  - { id: value_1_desc, path: "layers[7].content.value",  type: text, hint: "Value 1 description", default: "We'd rather ship the rough version and learn in days than polish the perfect version for months." }
  - { id: value_2_name, path: "layers[10].content.value", type: text, hint: "Value 2 name",       default: "Tell the truth." }
  - { id: value_2_desc, path: "layers[11].content.value", type: text, hint: "Value 2 description", default: "Disagree in the room. Decide and commit. Bad news travels in straight lines, not whispers." }
  - { id: value_3_name, path: "layers[14].content.value", type: text, hint: "Value 3 name",       default: "Own it together." }
  - { id: value_3_desc, path: "layers[15].content.value", type: text, hint: "Value 3 description", default: "There is no \"your half.\" If it touches the team, it's the team's. Credit and blame travel as one." }
  - { id: footer,       path: "layers[16].content.value", type: text, hint: "Footer line",        default: "What we believe at <Team>" }
