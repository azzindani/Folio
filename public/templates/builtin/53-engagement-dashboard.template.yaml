_protocol: template/v1

# Single-page user engagement dashboard — 4 sparkline KPIs, multi-series DAU/WAU/MAU line,
# feature usage bar, cohort retention table. Exports to interactive HTML.
meta:
  id: tmpl-engagement-dashboard
  name: User Engagement Dashboard
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, engagement, product, cohorts, retention, interactive]
  description: "Product engagement view: DAU/WAU/MAU sparklines, multi-series trend, feature usage, cohort retention."

document:
  width: 1280
  height: 1800
  unit: px
  dpi: 96

theme:
  ref: forest-deep

report:
  layout: scroll
  data:
    sources:
      - id: daily_activity
        type: inline
        rows:
          - { date: "2025-12-01", dau: 18420, wau: 64200, mau: 142800, avg_session_minutes: 12.4 }
          - { date: "2025-12-02", dau: 19180, wau: 65100, mau: 143200, avg_session_minutes: 13.1 }
          - { date: "2025-12-03", dau: 19840, wau: 66400, mau: 143800, avg_session_minutes: 12.8 }
          - { date: "2025-12-04", dau: 20120, wau: 67200, mau: 144500, avg_session_minutes: 13.4 }
          - { date: "2025-12-05", dau: 20680, wau: 68100, mau: 145300, avg_session_minutes: 13.7 }
          - { date: "2025-12-06", dau: 17420, wau: 68400, mau: 145600, avg_session_minutes: 14.2 }
          - { date: "2025-12-07", dau: 16840, wau: 68200, mau: 145900, avg_session_minutes: 14.6 }
          - { date: "2025-12-08", dau: 21240, wau: 69500, mau: 146400, avg_session_minutes: 13.2 }
          - { date: "2025-12-09", dau: 22180, wau: 70800, mau: 147200, avg_session_minutes: 13.8 }
          - { date: "2025-12-10", dau: 22640, wau: 71600, mau: 148100, avg_session_minutes: 14.1 }
          - { date: "2025-12-11", dau: 23120, wau: 72400, mau: 148700, avg_session_minutes: 14.3 }
          - { date: "2025-12-12", dau: 23680, wau: 73200, mau: 149400, avg_session_minutes: 14.7 }
          - { date: "2025-12-13", dau: 19840, wau: 73600, mau: 149800, avg_session_minutes: 15.1 }
          - { date: "2025-12-14", dau: 19280, wau: 73800, mau: 150200, avg_session_minutes: 15.4 }
      - id: features
        type: inline
        rows:
          - { feature: Dashboard,        uses: 184200, share_pct: 28.4 }
          - { feature: Search,           uses: 142800, share_pct: 22.0 }
          - { feature: Export,           uses:  86400, share_pct: 13.3 }
          - { feature: Notifications,    uses:  74200, share_pct: 11.4 }
          - { feature: Collaboration,    uses:  62800, share_pct:  9.7 }
          - { feature: API Console,      uses:  41600, share_pct:  6.4 }
          - { feature: Reports,          uses:  38400, share_pct:  5.9 }
          - { feature: Settings,         uses:  18800, share_pct:  2.9 }
      - id: cohorts
        type: inline
        rows:
          - { cohort_week: "2025-W36", week_0: 100, week_1: 64.2, week_2: 48.7, week_3: 41.3, week_4: 36.8 }
          - { cohort_week: "2025-W37", week_0: 100, week_1: 66.4, week_2: 51.2, week_3: 43.8, week_4: 38.4 }
          - { cohort_week: "2025-W38", week_0: 100, week_1: 67.8, week_2: 52.4, week_3: 45.1, week_4: 39.7 }
          - { cohort_week: "2025-W39", week_0: 100, week_1: 69.2, week_2: 54.6, week_3: 46.9, week_4: 41.2 }
          - { cohort_week: "2025-W40", week_0: 100, week_1: 70.4, week_2: 56.1, week_3: 48.3, week_4: 42.8 }
          - { cohort_week: "2025-W41", week_0: 100, week_1: 71.8, week_2: 57.9, week_3: 49.6, week_4: 43.5 }
          - { cohort_week: "2025-W42", week_0: 100, week_1: 72.6, week_2: 58.8, week_3: 50.4, week_4: 44.2 }
          - { cohort_week: "2025-W43", week_0: 100, week_1: 73.4, week_2: 59.6, week_3: 51.2, week_4: 45.1 }

pages:
  - id: dashboard
    label: Dashboard
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "PRODUCT ENGAGEMENT · 14-DAY ROLLING · ALL TIERS"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 80
        format: markdown
        font_family: Playfair Display
        font_size: 44
        font_weight: 700
        line_height: 1.1
        content: "**User Engagement Dashboard**"

      - id: kpi-dau
        type: kpi_card
        x: 60
        y: 180
        width: 280
        height: 150
        label: DAU
        value: 19280
        format: number
        delta: 14.2
        delta_format: percent
        sparkline_data: daily_activity
        sparkline_field: dau
        sparkline_color: "$primary"

      - id: kpi-wau
        type: kpi_card
        x: 360
        y: 180
        width: 280
        height: 150
        label: WAU
        value: 73800
        format: number
        delta: 9.7
        delta_format: percent
        sparkline_data: daily_activity
        sparkline_field: wau
        sparkline_color: "$primary"

      - id: kpi-mau
        type: kpi_card
        x: 660
        y: 180
        width: 280
        height: 150
        label: MAU
        value: 150200
        format: number
        delta: 6.4
        delta_format: percent
        sparkline_data: daily_activity
        sparkline_field: mau
        sparkline_color: "$primary"

      - id: kpi-session
        type: kpi_card
        x: 960
        y: 180
        width: 260
        height: 150
        label: Avg Session (min)
        value: 15.4
        format: number
        delta: 18.6
        delta_format: percent
        sparkline_data: daily_activity
        sparkline_field: avg_session_minutes
        sparkline_color: "$primary"

      - id: section-trend
        type: rich_text
        x: 60
        y: 360
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Active Users — 14 Day Trend**"

      - id: chart-active-users
        type: interactive_chart
        x: 60
        y: 420
        width: 1160
        height: 360
        chart_type: line
        data_ref: daily_activity
        x_field: date
        y_field: dau
        title: DAU / WAU / MAU
        legend: true
        grid: true
        animate: true

      - id: section-features
        type: rich_text
        x: 60
        y: 810
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Feature Usage**"

      - id: chart-features
        type: interactive_chart
        x: 60
        y: 870
        width: 1160
        height: 320
        chart_type: bar
        data_ref: features
        x_field: feature
        y_field: uses
        title: Uses by Feature (14 Days)
        legend: false
        grid: true
        animate: true

      - id: section-cohorts
        type: rich_text
        x: 60
        y: 1220
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Cohort Retention**"

      - id: tbl-cohorts
        type: interactive_table
        x: 60
        y: 1280
        width: 1160
        height: 460
        data_ref: cohorts
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: cohort_week, title: Cohort,   width: 180, sortable: true }
          - { field: week_0,      title: "Week 0", width: 180, sortable: true, formatter: percent, align: right }
          - { field: week_1,      title: "Week 1", width: 180, sortable: true, formatter: percent, align: right }
          - { field: week_2,      title: "Week 2", width: 180, sortable: true, formatter: percent, align: right }
          - { field: week_3,      title: "Week 3", width: 180, sortable: true, formatter: percent, align: right }
          - { field: week_4,      title: "Week 4", width: 180, sortable: true, formatter: percent, align: right }

slots:
  - { id: report_title,    path: "pages[0].layers[1].content", type: text, hint: "Dashboard title",    default: "**User Engagement Dashboard**" }
  - { id: report_eyebrow,  path: "pages[0].layers[0].content", type: text, hint: "Eyebrow",            default: "PRODUCT ENGAGEMENT · 14-DAY ROLLING · ALL TIERS" }
  - { id: trend_heading,   path: "pages[0].layers[6].content", type: text, hint: "Trend heading",      default: "**Active Users — 14 Day Trend**" }
  - { id: features_heading, path: "pages[0].layers[8].content", type: text, hint: "Features heading", default: "**Feature Usage**" }
  - { id: cohorts_heading, path: "pages[0].layers[10].content", type: text, hint: "Cohorts heading",  default: "**Cohort Retention**" }
