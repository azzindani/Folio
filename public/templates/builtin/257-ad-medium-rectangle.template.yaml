_protocol: template/v1

# IAB Medium Rectangle 300×250 — stacked layout.
# Brand top → headline → value prop → CTA bottom. Sunset-glow theme.
meta:
  id: tmpl-ad-medium-rectangle
  name: Ad Medium Rectangle
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [ad, banner, mpu, iab, "300x250", rectangle, sunset]
  description: "IAB 300×250 medium rectangle ad with brand, two-line headline, value prop, and CTA button."

document:
  width: 300
  height: 250
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 300
    height: 250
    fill:
      type: linear
      angle: 160
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  - id: glow
    type: circle
    z: 1
    cx: 280
    cy: 20
    rx: 120
    ry: 120
    fill:
      type: radial
      stops:
        - { color: "$primary", position: 0 }
        - { color: "transparent", position: 100 }
    opacity: 0.32

  - id: brand-dot
    type: circle
    z: 2
    cx: 24
    cy: 26
    rx: 6
    ry: 6
    fill: { type: solid, color: "$primary" }

  - id: brand
    type: text
    z: 3
    x: 36
    y: 20
    width: 240
    height: 0
    content: { type: plain, value: "Solara Energy" }
    style:
      font_family: $heading
      font_size: 14
      font_weight: 800
      color: $text
      letter_spacing: 0.02

  - id: headline
    type: text
    z: 4
    x: 20
    y: 60
    width: 260
    height: 0
    content: { type: plain, value: "Cut your power bill\nby up to 70%." }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 800
      color: $text
      line_height: 1.1
      letter_spacing: -0.02

  - id: value-bullet
    type: text
    z: 5
    x: 20
    y: 142
    width: 260
    height: 0
    content: { type: plain, value: "✓  Free home survey · zero upfront" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 600
      color: $text_muted

  - id: divider
    type: rect
    z: 6
    x: 20
    y: 174
    width: 260
    height: 1
    fill: { type: solid, color: "$border" }

  - id: cta-bg
    type: rect
    z: 7
    x: 20
    y: 192
    width: 260
    height: 44
    radius: 8
    fill: { type: solid, color: "$primary" }
    effects:
      shadow:
        - { dx: 0, dy: 4, blur: 12, color: "rgba(0,0,0,0.18)" }

  - id: cta-text
    type: text
    z: 8
    x: 20
    y: 206
    width: 260
    height: 0
    content: { type: plain, value: "Get my free quote →" }
    style:
      font_family: $body
      font_size: 15
      font_weight: 700
      color: "#FFFFFF"
      text_align: center

slots:
  - { id: brand,      path: "layers[3].content.value", type: text, hint: "Brand name",     default: "Solara Energy" }
  - { id: headline,   path: "layers[4].content.value", type: text, hint: "Headline (2 lines)", default: "Cut your power bill\nby up to 70%." }
  - { id: value_prop, path: "layers[5].content.value", type: text, hint: "Value-prop bullet", default: "✓  Free home survey · zero upfront" }
  - { id: cta_label,  path: "layers[8].content.value", type: text, hint: "CTA label",       default: "Get my free quote →" }
