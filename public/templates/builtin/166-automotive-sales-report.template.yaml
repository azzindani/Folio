_protocol: template/v1

# Automotive dealership sales — dealership eyebrow, hero, 5 KPIs (units,
# revenue, gross, days-on-lot, F&I), 12-month sales trend, model performance
# table, trade-in source donut, sales rep leaderboard.
meta:
  id: tmpl-automotive-sales-report
  name: Automotive · Dealership Sales
  type: report
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [report, automotive, dealership, sales, finance, interactive]
  description: "Dealership sales report: units, revenue, gross profit, inventory aging, model mix, trade-in sources, sales rep performance."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

report:
  layout: scroll
  data:
    sources:
      - id: monthly_sales
        type: inline
        rows:
          - { month: Jun, units: 148, revenue: 5184000 }
          - { month: Jul, units: 162, revenue: 5742000 }
          - { month: Aug, units: 174, revenue: 6248000 }
          - { month: Sep, units: 158, revenue: 5618000 }
          - { month: Oct, units: 142, revenue: 5024000 }
          - { month: Nov, units: 168, revenue: 5984000 }
          - { month: Dec, units: 196, revenue: 7124000 }
          - { month: Jan, units: 124, revenue: 4382000 }
          - { month: Feb, units: 138, revenue: 4862000 }
          - { month: Mar, units: 172, revenue: 6184000 }
          - { month: Apr, units: 184, revenue: 6628000 }
          - { month: May, units: 198, revenue: 7184000 }
      - id: model_performance
        type: inline
        rows:
          - { model: "Toyota RAV4",           units: 142, revenue: 4828000, avg_margin_pct: 12.4, days_on_lot: 18 }
          - { model: "Ford F-150",            units: 124, revenue: 6076000, avg_margin_pct: 14.8, days_on_lot: 22 }
          - { model: "Honda Civic",           units: 118, revenue: 2832000, avg_margin_pct: 10.6, days_on_lot: 14 }
          - { model: "Toyota Camry",          units:  96, revenue: 2784000, avg_margin_pct: 11.2, days_on_lot: 16 }
          - { model: "Chevrolet Silverado",   units:  88, revenue: 4224000, avg_margin_pct: 13.6, days_on_lot: 28 }
          - { model: "Honda CR-V",            units:  82, revenue: 2542000, avg_margin_pct: 12.8, days_on_lot: 18 }
          - { model: "Tesla Model Y",         units:  74, revenue: 3478000, avg_margin_pct:  9.4, days_on_lot: 12 }
          - { model: "Ford Bronco",           units:  62, revenue: 3286000, avg_margin_pct: 15.2, days_on_lot: 34 }
          - { model: "Toyota Highlander",     units:  58, revenue: 2842000, avg_margin_pct: 13.4, days_on_lot: 24 }
          - { model: "Jeep Wrangler",         units:  54, revenue: 2484000, avg_margin_pct: 14.6, days_on_lot: 32 }
