          - { source: "Wholesale Network",    share_pct:  9 }
          - { source: "Off-Street Purchase",  share_pct:  7 }
      - id: rep_leaderboard
        type: inline
        rows:
          - { rep: "Daniel Reyes",       units: 28, gross: 84200, csi_score: 96.4 }
          - { rep: "Megan Thompson",     units: 26, gross: 78600, csi_score: 94.8 }
          - { rep: "Aaron Park",         units: 24, gross: 72400, csi_score: 92.6 }
          - { rep: "Lila Khan",          units: 22, gross: 68200, csi_score: 95.2 }
          - { rep: "Brandon Hayes",      units: 20, gross: 62800, csi_score: 91.4 }
          - { rep: "Emily Chen",         units: 18, gross: 56400, csi_score: 93.8 }
          - { rep: "Marcus Bauer",       units: 16, gross: 48600, csi_score: 90.2 }
          - { rep: "Olivia Rossi",       units: 14, gross: 42800, csi_score: 92.0 }
          - { rep: "Noah Williams",      units: 12, gross: 36400, csi_score: 88.6 }
          - { rep: "Priya Shah",         units: 10, gross: 30200, csi_score: 89.4 }

pages:
  - id: sales
    label: Sales
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "PARKVIEW AUTO GROUP · MAY 2026 · DEALERSHIP SALES REPORT"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 110
        format: markdown
        font_family: Playfair Display
        font_size: 42
        font_weight: 700
        line_height: 1.15
        content: "**Dealership Sales — Trailing 12 Months**\n*Volume, revenue, gross profit, inventory aging, model mix, and sales rep leaderboard.*"

      - id: kpi-units
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: Units Sold
        value: 1968
        format: number
        delta: 12.4
        delta_format: percent
        sparkline_data: monthly_sales
        sparkline_field: units
        sparkline_color: "$primary"

      - id: kpi-revenue
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Revenue
        value: 70764000
        format: currency
        currency: USD
        delta: 16.8
        delta_format: percent

      - id: kpi-gross
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Gross Profit
        value: 9248000
        format: currency
        currency: USD
        delta: 14.2
        delta_format: percent

      - id: kpi-days
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Avg Days on Lot
        value: 22
        format: number
        delta: -4.6
        delta_format: percent

      - id: kpi-fandi
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: F&I per Unit
        value: 1842
        format: currency
        currency: USD
        delta: 8.4
        delta_format: percent

      - id: section-trend
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Monthly Sales Trend — Trailing 12 Months**"

      - id: chart-trend
        type: interactive_chart
        x: 60
        y: 460
        width: 1160
        height: 400
        chart_type: line
        data_ref: monthly_sales
        x_field: month
        y_field: units
        title: Units Sold and Revenue by Month
        legend: true
        grid: true
        animate: true

      - id: section-models
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top 10 Models — Volume Leaders**"

      - id: tbl-models
        type: interactive_table
        x: 60
        y: 960
        width: 1160
        height: 540
        data_ref: model_performance
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: model,            title: Model,            width: 320, sortable: true, formatter: badge }
          - { field: units,            title: Units,            width: 160, sortable: true, formatter: number,   align: right }
          - { field: revenue,          title: Revenue USD,      width: 240, sortable: true, formatter: currency, align: right }
          - { field: avg_margin_pct,   title: Avg Margin %,     width: 220, sortable: true, formatter: percent,  align: right }
          - { field: days_on_lot,      title: Days on Lot,      width: 220, sortable: true, formatter: number,   align: right }

      - id: section-trades
        type: rich_text
        x: 60
        y: 1540
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Trade-In Source Mix**"

      - id: chart-trades
        type: interactive_chart
        x: 60
        y: 1600
        width: 540
        height: 380
        chart_type: donut
        data_ref: trade_source
        x_field: source
        y_field: share_pct
        title: Used Inventory by Acquisition Source (%)
        legend: true
        animate: true

      - id: callout-trades
        type: rich_text
        x: 620
        y: 1600
        width: 600
        height: 380
        format: markdown
        font_family: Inter
        font_size: 16
        line_height: 1.6
        color: "$text_primary"
        content: "**Inventory Mix Notes**\n\n- Customer trade-ins dominate at 48%, up 6 points QoQ as new-car deals pulled in higher-quality units.\n- Auction buys rose to 22% to backfill mid-priced sedans short on customer trades.\n- Lease returns settled at 14% — captive-finance partners shifted to a 36-month default term in late 2025.\n- Wholesale network and off-street purchases combined account for 16% of supply, used primarily for sub-$15k inventory.\n- Average reconditioning spend on trade-ins is $842 per unit, holding flat YoY."

      - id: section-reps
        type: rich_text
        x: 60
        y: 2020
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Sales Rep Leaderboard — Month to Date**"

      - id: tbl-reps
        type: interactive_table
        x: 60
        y: 2080
        width: 1160
        height: 300
        data_ref: rep_leaderboard
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: rep,         title: Sales Rep,    width: 360, sortable: true }
          - { field: units,       title: Units,        width: 220, sortable: true, formatter: number,   align: right }
          - { field: gross,       title: Gross USD,    width: 280, sortable: true, formatter: currency, align: right }
          - { field: csi_score,   title: CSI Score,    width: 300, sortable: true, formatter: number,   align: right }

slots:
  - { id: report_title,       path: "pages[0].layers[1].content",  type: text, hint: "Report title",        default: "**Dealership Sales — Trailing 12 Months**\n*Volume, revenue, gross profit, inventory aging, model mix, and sales rep leaderboard.*" }
  - { id: report_eyebrow,     path: "pages[0].layers[0].content",  type: text, hint: "Dealership eyebrow",  default: "PARKVIEW AUTO GROUP · MAY 2026 · DEALERSHIP SALES REPORT" }
  - { id: trend_section,      path: "pages[0].layers[7].content",  type: text, hint: "Trend heading",       default: "**Monthly Sales Trend — Trailing 12 Months**" }
  - { id: models_section,     path: "pages[0].layers[9].content",  type: text, hint: "Models heading",      default: "**Top 10 Models — Volume Leaders**" }
  - { id: trades_section,     path: "pages[0].layers[11].content", type: text, hint: "Trades heading",      default: "**Trade-In Source Mix**" }
  - { id: reps_section,       path: "pages[0].layers[14].content", type: text, hint: "Reps heading",        default: "**Sales Rep Leaderboard — Month to Date**" }
