      - { id: photo-frame, type: rect, z: 5, x: 80, y: 80, width: 920, height: 540, radius: 12, fill: { type: linear, angle: 135, stops: [{ color: "$secondary", position: 0 }, { color: "$primary", position: 100 }] }, opacity: 0.4 }
      - { id: photo-border, type: rect, z: 6, x: 80, y: 80, width: 920, height: 540, radius: 12, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
      - { id: pan-shadow, type: ellipse, z: 7, cx: 540, cy: 410, rx: 220, ry: 30, fill: { type: solid, color: "#000000" }, opacity: 0.18 }
      - { id: pan-outer, type: ellipse, z: 8, cx: 540, cy: 360, rx: 220, ry: 90, fill: { type: solid, color: "#3A2418" } }
      - { id: pan-inner, type: ellipse, z: 9, cx: 540, cy: 360, rx: 200, ry: 80, fill: { type: solid, color: "#5C3924" } }
      - { id: butter-pool, type: ellipse, z: 10, cx: 540, cy: 360, rx: 170, ry: 60, fill: { type: solid, color: "#D49A4F" } }
      - { id: butter-foam-1, type: ellipse, z: 11, cx: 480, cy: 340, rx: 30, ry: 10, fill: { type: solid, color: "#F5C972" }, opacity: 0.8 }
      - { id: butter-foam-2, type: ellipse, z: 11, cx: 580, cy: 360, rx: 40, ry: 12, fill: { type: solid, color: "#F5C972" }, opacity: 0.8 }
      - { id: butter-foam-3, type: ellipse, z: 11, cx: 520, cy: 380, rx: 25, ry: 8, fill: { type: solid, color: "#F5C972" }, opacity: 0.7 }
      - { id: pan-handle, type: rect, z: 12, x: 760, y: 350, width: 200, height: 16, radius: 8, fill: { type: solid, color: "#3A2418" } }
      - { id: photo-label-pill, type: rect, z: 13, x: 100, y: 100, width: 200, height: 36, radius: 18, fill: { type: solid, color: "rgba(255,255,255,0.85)" } }
      - { id: photo-label, type: text, z: 14, x: 100, y: 110, width: 200, height: 0, content: { type: plain, value: "BROWN-BUTTER PAN" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text, letter_spacing: 0.3, text_align: center, text_transform: uppercase } }
      - { id: step-pill, type: rect, z: 20, x: 80, y: 660, width: 160, height: 60, radius: 30, fill: { type: solid, color: "$primary" } }
      - { id: step-label, type: text, z: 21, x: 80, y: 678, width: 160, height: 0, content: { type: plain, value: "STEP 1 OF 2" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.3, text_align: center } }
      - { id: step-title, type: text, z: 22, x: 80, y: 760, width: 920, height: 0, content: { type: plain, value: "Brown the butter." }, style: { font_family: $heading, font_size: 72, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: time-est, type: text, z: 23, x: 80, y: 860, width: 920, height: 0, content: { type: plain, value: "≈ 6 minutes · listen, don't watch the clock." }, style: { font_family: $body, font_size: 18, font_style: italic, color: $primary, letter_spacing: 0.2 } }
      - { id: divider, type: rect, z: 24, x: 80, y: 920, width: 60, height: 3, fill: { type: solid, color: "$primary" } }
      - { id: body, type: text, z: 25, x: 80, y: 960, width: 920, height: 0, content: { type: plain, value: "Melt the butter in a wide pan over medium heat. Once it foams, swirl gently. After three or four minutes the milk solids will turn the color of toasted almond and the smell will shift from creamy to nutty. Pull it off the heat the second that happens — it goes from brown to burnt fast." }, style: { font_family: $heading, font_size: 22, color: $text, line_height: 1.7 } }
      - { id: tip-bullet, type: text, z: 26, x: 80, y: 1220, width: 920, height: 0, content: { type: plain, value: "→ Use a light-bottomed pan — you need to see the color change." }, style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.5, font_style: italic } }
      - { id: page-num, type: text, z: 30, x: 940, y: 1290, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

