      - { id: serves-2-lbl, type: text, z: 21, x: 400, y: 310, width: 260, height: 0, content: { type: plain, value: "PREP" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: serves-2-val, type: text, z: 22, x: 400, y: 336, width: 260, height: 0, content: { type: plain, value: "10 min" }, style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text } }
      - { id: serves-3-lbl, type: text, z: 21, x: 680, y: 310, width: 260, height: 0, content: { type: plain, value: "COOK" }, style: { font_family: $body, font_size: 11, font_weight: 700, color: $text_muted, letter_spacing: 0.4 } }
      - { id: serves-3-val, type: text, z: 22, x: 680, y: 336, width: 260, height: 0, content: { type: plain, value: "25 min" }, style: { font_family: $heading, font_size: 32, font_weight: 700, color: $primary } }
