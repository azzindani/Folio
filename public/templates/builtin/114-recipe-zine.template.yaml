slots:
  - { id: recipe_name,      path: "pages[0].layers[22].content.value", type: text, hint: "Recipe name (cover)",     default: "Brown-Butter\nLemon Pasta" }
  - { id: subtitle,         path: "pages[0].layers[23].content.value", type: text, hint: "Cover subtitle",          default: "Five ingredients. Three pans you already own.\nThe kind of pasta you'll memorize." }
  - { id: cook_time,        path: "pages[0].layers[21].content.value", type: text, hint: "Time + meal kicker",      default: "DINNER · 35 MIN" }
  - { id: serves,           path: "pages[1].layers[6].content.value",  type: text, hint: "Number of servings",      default: "4" }
  - { id: ingredients_list, path: "pages[1].layers[12].content.value", type: text, hint: "Lead ingredient",         default: "unsalted butter · the good kind" }
  - { id: step_1_title,     path: "pages[2].layers[18].content.value", type: text, hint: "Step 1 title",            default: "Brown the butter." }
  - { id: step_1_body,      path: "pages[2].layers[21].content.value", type: text, hint: "Step 1 instructions",     default: "Melt the butter in a wide pan over medium heat. Once it foams, swirl gently. After three or four minutes the milk solids will turn the color of toasted almond and the smell will shift from creamy to nutty. Pull it off the heat the second that happens — it goes from brown to burnt fast." }
  - { id: step_2_title,     path: "pages[3].layers[24].content.value", type: text, hint: "Step 2 title",            default: "Toss it all together." }
  - { id: step_2_body,      path: "pages[3].layers[27].content.value", type: text, hint: "Step 2 instructions",     default: "Drain the pasta one minute before the box says, holding back a mug of pasta water. Drop the noodles into the brown butter with the lemon zest, juice, and half the parmigiano. Toss vigorously, adding pasta water by the splash until the sauce coats every strand and glosses the pan." }
