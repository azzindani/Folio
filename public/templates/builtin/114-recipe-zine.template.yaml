_protocol: template/v1

# 6-page recipe zine — 1080×1350 portrait, editorial-cream theme.
# Cover → ingredients → prep step 1 → prep step 2 → plating tip → credits.
meta:
  id: tmpl-recipe-zine
  name: Recipe Zine · 6 Pages
  type: carousel
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [carousel, recipe, zine, food, cookbook, cream]
  description: "Six-page recipe zine with cover, ingredients list, two prep steps, plating tip, and credits with related recipes."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

pages:
  # ── Page 1 · Cover ──────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: photo-frame, type: rect, z: 5, x: 80, y: 80, width: 920, height: 720, radius: 12, fill: { type: linear, angle: 135, stops: [{ color: "$primary", position: 0 }, { color: "$secondary", position: 100 }] }, opacity: 0.4 }
      - { id: photo-border, type: rect, z: 6, x: 80, y: 80, width: 920, height: 720, radius: 12, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1 } }
      - { id: plate-shadow, type: ellipse, z: 7, cx: 540, cy: 510, rx: 280, ry: 60, fill: { type: solid, color: "#000000" }, opacity: 0.18 }
      - { id: plate, type: circle, z: 8, cx: 540, cy: 480, rx: 240, ry: 240, fill: { type: solid, color: "#FFFFFF" } }
      - { id: plate-inner, type: circle, z: 9, cx: 540, cy: 480, rx: 200, ry: 200, fill: { type: solid, color: "#FAF4EA" } }
      - { id: pasta-mound, type: circle, z: 10, cx: 540, cy: 480, rx: 150, ry: 150, fill: { type: solid, color: "#E8B872" } }
      - { id: pasta-1, type: ellipse, z: 11, cx: 480, cy: 440, rx: 60, ry: 14, fill: { type: solid, color: "#C29250" } }
      - { id: pasta-2, type: ellipse, z: 11, cx: 600, cy: 460, rx: 60, ry: 14, fill: { type: solid, color: "#C29250" } }
      - { id: pasta-3, type: ellipse, z: 11, cx: 520, cy: 510, rx: 70, ry: 14, fill: { type: solid, color: "#C29250" } }
      - { id: herb-1, type: ellipse, z: 12, cx: 510, cy: 420, rx: 12, ry: 18, fill: { type: solid, color: "#7BAB5B" } }
      - { id: herb-2, type: ellipse, z: 12, cx: 580, cy: 440, rx: 10, ry: 16, fill: { type: solid, color: "#7BAB5B" } }
      - { id: herb-3, type: ellipse, z: 12, cx: 540, cy: 490, rx: 14, ry: 20, fill: { type: solid, color: "#5C8A42" } }
      - { id: kicker-pill, type: rect, z: 20, x: 80, y: 840, width: 280, height: 48, radius: 24, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 1.5 } }
      - { id: kicker, type: text, z: 21, x: 80, y: 854, width: 280, height: 0, content: { type: plain, value: "DINNER · 35 MIN" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4, text_align: center, text_transform: uppercase } }
      - { id: title, type: text, z: 22, x: 80, y: 920, width: 920, height: 0, content: { type: plain, value: "Brown-Butter\nLemon Pasta" }, style: { font_family: $heading, font_size: 96, font_weight: 700, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: sub, type: text, z: 23, x: 80, y: 1130, width: 920, height: 0, content: { type: plain, value: "Five ingredients. Three pans you already own.\nThe kind of pasta you'll memorize." }, style: { font_family: $heading, font_size: 24, font_style: italic, color: $text_muted, line_height: 1.5 } }
      - { id: foot, type: text, z: 24, x: 80, y: 1280, width: 920, height: 0, content: { type: plain, value: "ISSUE 14 · the small dinners zine" }, style: { font_family: $body, font_size: 14, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: page-num, type: text, z: 25, x: 940, y: 1280, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

