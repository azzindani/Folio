      - { id: i2-name, type: text, z: 32, x: 320, y: 568, width: 680, height: 0, content: { type: plain, value: "unsalted butter · the good kind" }, style: { font_family: $heading, font_size: 22, color: $text } }
      - { id: i2-line, type: rect, z: 33, x: 80, y: 616, width: 920, height: 1, fill: { type: solid, color: "$border" } }
      - { id: i3-amt, type: text, z: 31, x: 80, y: 646, width: 220, height: 0, content: { type: plain, value: "2 large" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text } }
      - { id: i3-name, type: text, z: 32, x: 320, y: 646, width: 680, height: 0, content: { type: plain, value: "lemons · zest of both, juice of one" }, style: { font_family: $heading, font_size: 22, color: $text } }
      - { id: i3-line, type: rect, z: 33, x: 80, y: 694, width: 920, height: 1, fill: { type: solid, color: "$border" } }
      - { id: i4-amt, type: text, z: 31, x: 80, y: 724, width: 220, height: 0, content: { type: plain, value: "60 g" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text } }
      - { id: i4-name, type: text, z: 32, x: 320, y: 724, width: 680, height: 0, content: { type: plain, value: "parmigiano · finely grated, plus more for serving" }, style: { font_family: $heading, font_size: 22, color: $text } }
      - { id: i4-line, type: rect, z: 33, x: 80, y: 772, width: 920, height: 1, fill: { type: solid, color: "$border" } }
      - { id: i5-amt, type: text, z: 31, x: 80, y: 802, width: 220, height: 0, content: { type: plain, value: "1 small bunch" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text } }
      - { id: i5-name, type: text, z: 32, x: 320, y: 802, width: 680, height: 0, content: { type: plain, value: "flat-leaf parsley · roughly chopped" }, style: { font_family: $heading, font_size: 22, color: $text } }
      - { id: i5-line, type: rect, z: 33, x: 80, y: 850, width: 920, height: 1, fill: { type: solid, color: "$border" } }
      - { id: list-header-2, type: text, z: 40, x: 80, y: 900, width: 920, height: 0, content: { type: plain, value: "TO TASTE" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: i6-amt, type: text, z: 41, x: 80, y: 950, width: 220, height: 0, content: { type: plain, value: "—" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text_muted } }
      - { id: i6-name, type: text, z: 42, x: 320, y: 950, width: 680, height: 0, content: { type: plain, value: "flaky sea salt · cracked black pepper · olive oil" }, style: { font_family: $heading, font_size: 22, color: $text } }
      - { id: tip-card, type: rect, z: 50, x: 80, y: 1060, width: 920, height: 160, radius: 12, fill: { type: solid, color: "$surface" }, stroke: { color: "$primary", width: 1 } }
      - { id: tip-label, type: text, z: 51, x: 120, y: 1090, width: 840, height: 0, content: { type: plain, value: "QUICK NOTE" }, style: { font_family: $body, font_size: 12, font_weight: 700, color: $primary, letter_spacing: 0.4 } }
      - { id: tip-body, type: text, z: 52, x: 120, y: 1124, width: 840, height: 0, content: { type: plain, value: "Pull a mug of starchy pasta water before you drain — it's the difference between sauce and oil slick." }, style: { font_family: $heading, font_size: 20, font_style: italic, color: $text, line_height: 1.5 } }
      - { id: page-num, type: text, z: 60, x: 940, y: 1290, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right, letter_spacing: 0.2 } }

