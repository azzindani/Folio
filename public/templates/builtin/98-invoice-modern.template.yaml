slots:
  - { id: company_name,   path: "layers[3].content.value",  type: text, hint: "Issuing company name",     default: "Folio Studio Ltd." }
  - { id: invoice_number, path: "layers[7].content.value",  type: text, hint: "Invoice number",           default: "INV-2026-0427" }
