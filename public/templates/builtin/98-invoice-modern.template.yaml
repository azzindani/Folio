_protocol: template/v1

# Modern invoice — A4 portrait 1240×1754, light-clean theme.
# Top: logo placeholder left + invoice meta right.
# Middle: billed-from / billed-to block.
# Body: 5-row line-items table (description | qty | rate | amount).
# Footer: subtotal/tax/total stack + payment terms.
meta:
  id: tmpl-invoice-modern
  name: Invoice · Modern
  type: invoice
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [invoice, billing, finance, a4, professional, clean]
  description: "Modern A4 invoice with logo, invoice meta, billed-to block, 5-row line-items table, totals stack, and payment terms."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # ── Logo placeholder (top-left) ──────────────────────────
  - id: logo-mark
    type: rect
    z: 5
    x: 80
    y: 80
    width: 60
    height: 60
    radius: 10
    fill: { type: solid, color: "$primary" }

  - id: logo-letter
    type: text
    z: 6
    x: 80
    y: 92
    width: 60
    height: 0
    content: { type: plain, value: "F" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1.2

  - id: company-name
    type: text
    z: 7
    x: 160
    y: 90
    width: 460
    height: 0
    content: { type: plain, value: "Folio Studio Ltd." }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: $text
      line_height: 1.2
      letter_spacing: -0.01

  - id: company-tag
