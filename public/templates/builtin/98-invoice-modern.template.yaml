  - { id: client_name,    path: "layers[18].content.value", type: text, hint: "Client / bill-to name",    default: "Northwind Retail Group" }
  - { id: client_address, path: "layers[19].content.value", type: text, hint: "Client address (multi-line)", default: "488 Mission St, Floor 12\nSan Francisco, CA 94105\nUnited States" }
