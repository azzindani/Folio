_protocol: template/v1

# Theater play poster (1200×1800 portrait).
# Editorial-cream classical playbill: serif play title, BY playwright,
# DIRECTED BY, cast list (top 4), run dates, theater + tickets-from-price.
meta:
  id: tmpl-theater-play-poster
  name: Theater Play Poster
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, theater, play, playbill, drama]
  description: "Classical playbill theater poster with serif title, cast list and run dates."

document:
  width: 1200
  height: 1800
  unit: px
  dpi: 96

theme:
  ref: editorial-cream
  overrides:
    primary: "#8C2C1F"
    secondary: "#1A1A1A"

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1200
    height: 1800
    fill: { type: solid, color: "$background" }

  - id: frame-outer
    type: rect
    z: 1
    x: 60
    y: 60
    width: 1080
    height: 1680
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$secondary", width: 3 }

  - id: frame-inner
    type: rect
    z: 2
    x: 80
    y: 80
    width: 1040
    height: 1640
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 1 }
    opacity: 0.5

  - id: header-bar
    type: rect
    z: 3
    x: 60
    y: 60
    width: 1080
    height: 100
    fill: { type: solid, color: "$secondary" }

  - id: header-text
    type: text
    z: 4
    x: 80
    y: 92
    width: 1040
    height: 0
    content: { type: plain, value: "THE LAMPLIGHT THEATRE COMPANY · SEASON XXXVII" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $background
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: a-new-play
    type: text
    z: 10
    x: 80
    y: 240
    width: 1040
    height: 0
    content: { type: plain, value: "— A NEW PLAY IN THREE ACTS —" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $primary
      letter_spacing: 0.5
      text_align: center
      text_transform: uppercase

  - id: title
    type: text
    z: 11
    x: 80
    y: 320
    width: 1040
    height: 0
    content:
      type: plain
      value: "The Salt\nGardens"
    style:
      font_family: $heading
      font_size: 140
      font_weight: 700
      color: $secondary
      line_height: 1.0
      letter_spacing: -0.01
      text_align: center

  - id: title-rule
    type: rect
    z: 12
    x: 360
    y: 660
    width: 480
    height: 1
    fill: { type: solid, color: "$primary" }

  - id: by-label
    type: text
    z: 20
    x: 80
    y: 690
    width: 1040
    height: 0
    content: { type: plain, value: "BY" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: playwright
    type: text
    z: 21
    x: 80
    y: 730
    width: 1040
    height: 0
    content: { type: plain, value: "Iola Tremaine" }
    style:
      font_family: $heading
      font_size: 50
      font_weight: 500
      font_style: italic
      color: $secondary
      letter_spacing: 0.005
      text_align: center

  - id: director-label
    type: text
    z: 22
    x: 80
    y: 820
    width: 1040
    height: 0
    content: { type: plain, value: "DIRECTED BY" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: director
    type: text
    z: 23
    x: 80
    y: 860
    width: 1040
    height: 0
    content: { type: plain, value: "Sebastian Olarte" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 500
      color: $secondary
      letter_spacing: 0.005
      text_align: center

  - id: cast-rule-top
    type: rect
    z: 30
    x: 80
    y: 970
    width: 1040
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: cast-label
    type: text
    z: 31
    x: 80
    y: 990
    width: 1040
    height: 0
    content: { type: plain, value: "WITH" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: cast-list
    type: text
    z: 32
    x: 80
    y: 1030
    width: 1040
    height: 0
    content:
      type: plain
      value: "BEATRICE HAVENS\nNOAH MIRANDA-LEE\nESTELLE WYNTER\nGEORGES DE PRADA"
    style:
      font_family: $heading
      font_size: 32
      font_weight: 500
      color: $secondary
      line_height: 1.35
      letter_spacing: 0.005
      text_align: center

  - id: cast-rule-bottom
    type: rect
    z: 33
    x: 80
    y: 1240
    width: 1040
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: run-dates-label
    type: text
    z: 40
    x: 80
    y: 1290
    width: 1040
    height: 0
    content: { type: plain, value: "RUN DATES" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.46
      text_align: center
      text_transform: uppercase

  - id: run-dates
    type: text
    z: 41
    x: 80
    y: 1330
    width: 1040
    height: 0
    content: { type: plain, value: "April 12 — May 18, 2026" }
    style:
      font_family: $heading
      font_size: 38
      font_weight: 500
      color: $secondary
      letter_spacing: 0.005
      text_align: center

  - id: showtimes
    type: text
    z: 42
    x: 80
    y: 1390
    width: 1040
    height: 0
    content: { type: plain, value: "TUE–SAT 19:30 · SUN MATINÉE 14:00" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

  - id: theater-rule
    type: rect
    z: 50
    x: 80
    y: 1480
    width: 1040
    height: 1
    fill: { type: solid, color: "$primary" }
    opacity: 0.5

  - id: theater-name
    type: text
    z: 51
    x: 80
    y: 1510
    width: 1040
    height: 0
    content: { type: plain, value: "THE LAMPLIGHT THEATRE" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 700
      color: $secondary
      letter_spacing: 0.12
      text_align: center
      text_transform: uppercase

  - id: theater-address
    type: text
    z: 52
    x: 80
    y: 1570
    width: 1040
    height: 0
    content: { type: plain, value: "42 OAKWELL STREET · LONDON · WC1B" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.36
      text_align: center
      text_transform: uppercase

  - id: footer-bar
    type: rect
    z: 60
    x: 60
    y: 1660
    width: 1080
    height: 80
    fill: { type: solid, color: "$secondary" }

  - id: tickets-from
    type: text
    z: 61
    x: 80
    y: 1684
    width: 1040
    height: 0
    content: { type: plain, value: "TICKETS FROM £22" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 800
      color: $background
      letter_spacing: 0.18
      text_align: center
      text_transform: uppercase

  - id: tickets-url
    type: text
    z: 62
    x: 80
    y: 1716
    width: 1040
    height: 0
    content: { type: plain, value: "BOOK · LAMPLIGHTTHEATRE.UK" }
    style:
      font_family: $mono
      font_size: 14
      font_weight: 700
      color: $primary
      letter_spacing: 0.42
      text_align: center
      text_transform: uppercase

slots:
  - { id: title,         path: "layers[6].content.value",  type: text, hint: "Play title (2 lines)", default: "The Salt\nGardens" }
  - { id: playwright,    path: "layers[9].content.value",  type: text, hint: "Playwright name",      default: "Iola Tremaine" }
  - { id: director,      path: "layers[11].content.value", type: text, hint: "Director name",        default: "Sebastian Olarte" }
  - { id: cast_list,     path: "layers[14].content.value", type: text, hint: "Top cast (\\n separated)", default: "BEATRICE HAVENS\nNOAH MIRANDA-LEE\nESTELLE WYNTER\nGEORGES DE PRADA" }
  - { id: run_dates,     path: "layers[17].content.value", type: text, hint: "Run dates",            default: "April 12 — May 18, 2026" }
  - { id: theater_name,  path: "layers[20].content.value", type: text, hint: "Theater name",         default: "THE LAMPLIGHT THEATRE" }
