_protocol: template/v1

# 5-slide LinkedIn carousel — Bad-boss anti-patterns.
# Cover → 4 anti-pattern slides with ✗ glyph + DO INSTEAD callout. Punchy tone.
meta:
  id: tmpl-linkedin-bad-boss
  name: LinkedIn · 5 Signs of a Bad Boss (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, leadership, management, anti-patterns, 4-5]
  description: "5-slide LinkedIn carousel calling out four management anti-patterns with punchy do-instead callouts."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: high-contrast

pages:
  # ── Slide 1 · Cover ──────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "MANAGER, READ THIS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.36, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 280
        width: 920
        height: 0
        content: { type: plain, value: "5 Signs You're\na Bad Boss" }
        style: { font_family: $heading, font_size: 104, font_weight: 900, color: $text, line_height: 1.0, letter_spacing: -0.04 }
      - id: subtitle
        type: text
        z: 12
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "Uncomfortable. Useful. Swipe →" }
        style: { font_family: $body, font_size: 28, color: $text_muted, line_height: 1.4 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "1/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Anti-pattern 1 ─────────────────────────────
  - id: anti-1
    label: Anti 01
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: glyph
        type: text
        z: 10
        x: 80
        y: 200
        width: 200
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 180, font_weight: 900, color: $primary, line_height: 1 }
      - id: behavior
        type: text
        z: 11
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "You take credit\nfor wins." }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 720
        width: 920
        height: 0
        content: { type: plain, value: "When the project lands well, the headline becomes yours. The team notices. They always do." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1080, width: 920, height: 96, radius: 8, fill: { type: solid, color: "$surface" } }
      - id: callout-text
        type: text
        z: 16
        x: 112
        y: 1112
        width: 856
        height: 0
        content: { type: plain, value: "DO INSTEAD → Name the team in public. Take blame in private." }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.06 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "2/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Anti-pattern 2 ─────────────────────────────
  - id: anti-2
    label: Anti 02
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: glyph
        type: text
        z: 10
        x: 80
        y: 200
        width: 200
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 180, font_weight: 900, color: $primary, line_height: 1 }
      - id: behavior
        type: text
        z: 11
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "You micromanage\nthe details." }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 720
        width: 920
        height: 0
        content: { type: plain, value: "You hired smart people then refuse to let them think. They will either quit or stop trying." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1080, width: 920, height: 96, radius: 8, fill: { type: solid, color: "$surface" } }
      - id: callout-text
        type: text
        z: 16
        x: 112
        y: 1112
        width: 856
        height: 0
        content: { type: plain, value: "DO INSTEAD → Set the goal. Hand over the steering wheel." }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.06 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "3/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Anti-pattern 3 ─────────────────────────────
  - id: anti-3
    label: Anti 03
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: glyph
        type: text
        z: 10
        x: 80
        y: 200
        width: 200
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 180, font_weight: 900, color: $primary, line_height: 1 }
      - id: behavior
        type: text
        z: 11
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "You avoid hard\nconversations." }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 720
        width: 920
        height: 0
        content: { type: plain, value: "Bad news gets softer in every retelling until reality hits. By then you've lost the room." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1080, width: 920, height: 96, radius: 8, fill: { type: solid, color: "$surface" } }
      - id: callout-text
        type: text
        z: 16
        x: 112
        y: 1112
        width: 856
        height: 0
        content: { type: plain, value: "DO INSTEAD → Say it kindly. Say it now. Say it once." }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.06 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "4/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · Anti-pattern 4 ─────────────────────────────
  - id: anti-4
    label: Anti 04
    layers:
      - { id: bg,           type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band,  type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: glyph
        type: text
        z: 10
        x: 80
        y: 200
        width: 200
        height: 0
        content: { type: plain, value: "✗" }
        style: { font_family: $heading, font_size: 180, font_weight: 900, color: $primary, line_height: 1 }
      - id: behavior
        type: text
        z: 11
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "You only show up\nwhen it breaks." }
        style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.03 }
      - id: explanation
        type: text
        z: 12
        x: 80
        y: 720
        width: 920
        height: 0
        content: { type: plain, value: "Crisis-driven leadership trains your team to hide problems until they're fires. Then you're a firefighter, not a leader." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.55 }
      - { id: callout-bg, type: rect, z: 15, x: 80, y: 1080, width: 920, height: 96, radius: 8, fill: { type: solid, color: "$surface" } }
      - id: callout-text
        type: text
        z: 16
        x: 112
        y: 1112
        width: 856
        height: 0
        content: { type: plain, value: "DO INSTEAD → Be present when it's quiet. That's when work gets built." }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: $accent, letter_spacing: 0.06 }
      - id: pagination
        type: text
        z: 20
        x: 880
        y: 1280
        width: 140
        height: 0
        content: { type: plain, value: "5/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

slots:
  - { id: cover_title,      path: "pages[0].layers[3].content.value", type: text, hint: "Cover headline",       default: "5 Signs You're\na Bad Boss" }
  - { id: cover_subtitle,   path: "pages[0].layers[4].content.value", type: text, hint: "Cover subtitle",       default: "Uncomfortable. Useful. Swipe →" }
  - { id: anti1_behavior,   path: "pages[1].layers[3].content.value", type: text, hint: "Anti-pattern 1 name",  default: "You take credit\nfor wins." }
  - { id: anti1_text,       path: "pages[1].layers[4].content.value", type: text, hint: "Anti-pattern 1 text",  default: "When the project lands well, the headline becomes yours. The team notices. They always do." }
  - { id: anti1_callout,    path: "pages[1].layers[6].content.value", type: text, hint: "Do-instead callout 1", default: "DO INSTEAD → Name the team in public. Take blame in private." }
  - { id: anti2_behavior,   path: "pages[2].layers[3].content.value", type: text, hint: "Anti-pattern 2 name",  default: "You micromanage\nthe details." }
  - { id: anti2_text,       path: "pages[2].layers[4].content.value", type: text, hint: "Anti-pattern 2 text",  default: "You hired smart people then refuse to let them think. They will either quit or stop trying." }
  - { id: anti2_callout,    path: "pages[2].layers[6].content.value", type: text, hint: "Do-instead callout 2", default: "DO INSTEAD → Set the goal. Hand over the steering wheel." }
  - { id: anti3_behavior,   path: "pages[3].layers[3].content.value", type: text, hint: "Anti-pattern 3 name",  default: "You avoid hard\nconversations." }
  - { id: anti3_text,       path: "pages[3].layers[4].content.value", type: text, hint: "Anti-pattern 3 text",  default: "Bad news gets softer in every retelling until reality hits. By then you've lost the room." }
  - { id: anti3_callout,    path: "pages[3].layers[6].content.value", type: text, hint: "Do-instead callout 3", default: "DO INSTEAD → Say it kindly. Say it now. Say it once." }
  - { id: anti4_behavior,   path: "pages[4].layers[3].content.value", type: text, hint: "Anti-pattern 4 name",  default: "You only show up\nwhen it breaks." }
  - { id: anti4_text,       path: "pages[4].layers[4].content.value", type: text, hint: "Anti-pattern 4 text",  default: "Crisis-driven leadership trains your team to hide problems until they're fires. Then you're a firefighter, not a leader." }
  - { id: anti4_callout,    path: "pages[4].layers[6].content.value", type: text, hint: "Do-instead callout 4", default: "DO INSTEAD → Be present when it's quiet. That's when work gets built." }
