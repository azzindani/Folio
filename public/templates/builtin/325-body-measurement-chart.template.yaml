_protocol: template/v1

# Body measurement chart — 1080×1620 portrait, pastel-dream theme.
# Name + start-date header, 10 measurement rows × 4 date columns,
# weight + body-fat % row for tracking progress.
meta:
  id: tmpl-body-measurement-chart
  name: Body Measurement Chart
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [fitness, body, measurement, tracking, chart, portrait, pastel]
  description: "Body measurement tracking chart with 10 rows (chest, waist, hips, biceps, thighs, etc.) across 4 date columns plus weight + body-fat % row."

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill: { type: solid, color: "$background" }

  - id: top-shape
    type: circle
    z: 1
    x: 920
    y: -80
    width: 280
    height: 280
    fill: { type: solid, color: "$primary", opacity: 0.18 }

  - id: side-shape
    type: circle
    z: 2
    x: -100
    y: 1480
    width: 220
    height: 220
    fill: { type: solid, color: "$secondary", opacity: 0.18 }

  # ── Header ────────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 60
    y: 60
    width: 960
    height: 0
    content: { type: plain, value: "PROGRESS TRACKER" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: $primary
      letter_spacing: 0.5
      text_transform: uppercase

  - id: title
    type: text
    z: 11
    x: 60
    y: 95
    width: 960
    height: 0
    content: { type: plain, value: "Body Measurements" }
    style:
      font_family: $heading
      font_size: 58
      font_weight: 800
      color: $text
      line_height: 1.05
      letter_spacing: -0.02

  - id: name-label
    type: text
    z: 12
    x: 60
    y: 185
    width: 480
    height: 0
    content: { type: plain, value: "NAME" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: name-value
    type: text
    z: 13
    x: 60
    y: 205
    width: 480
    height: 0
    content: { type: plain, value: "Aisha Patel" }
    style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text, line_height: 1.3 }

  - id: start-label
    type: text
    z: 14
    x: 600
    y: 185
    width: 220
    height: 0
    content: { type: plain, value: "START DATE" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: start-value
    type: text
    z: 15
    x: 600
    y: 205
    width: 220
    height: 0
    content: { type: plain, value: "2026-01-15" }
    style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text, line_height: 1.3 }

  - id: height-label
    type: text
    z: 16
    x: 840
    y: 185
    width: 180
    height: 0
    content: { type: plain, value: "HEIGHT" }
    style: { font_family: $body, font_size: 11, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: height-value
    type: text
    z: 17
    x: 840
    y: 205
    width: 180
    height: 0
    content: { type: plain, value: "5'6\" / 168 cm" }
    style: { font_family: $heading, font_size: 24, font_weight: 700, color: $text, line_height: 1.3 }

  # ── Table background card ─────────────────────────────────
  - id: table-card
    type: rect
    z: 20
    x: 60
    y: 280
    width: 960
    height: 1080
    radius: 18
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  # ── Table header columns ──────────────────────────────────
  - id: th-bg
    type: rect
    z: 21
    x: 60
    y: 280
    width: 960
    height: 56
    radius: 18
    fill: { type: solid, color: "$primary", opacity: 0.85 }

  - id: th-area
    type: text
    z: 22
    x: 90
    y: 298
    width: 220
    height: 0
    content: { type: plain, value: "AREA" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.5, text_transform: uppercase }

  - id: th-d1
    type: text
    z: 23
    x: 340
    y: 298
    width: 160
    height: 0
    content: { type: plain, value: "JAN 15" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.5, text_align: center, text_transform: uppercase }

  - id: th-d2
    type: text
    z: 24
    x: 510
    y: 298
    width: 160
    height: 0
    content: { type: plain, value: "FEB 15" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.5, text_align: center, text_transform: uppercase }

  - id: th-d3
    type: text
    z: 25
    x: 680
    y: 298
    width: 160
    height: 0
    content: { type: plain, value: "MAR 15" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.5, text_align: center, text_transform: uppercase }

  - id: th-d4
    type: text
    z: 26
    x: 850
    y: 298
    width: 160
    height: 0
    content: { type: plain, value: "APR 15" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: "#FFFFFF", letter_spacing: 0.5, text_align: center, text_transform: uppercase }

  # ── Rows: 10 measurement areas + weight + bf% ─────────────
  - id: row-chest
    type: text
    z: 30
    x: 90
    y: 360
    width: 220
    height: 0
    content: { type: plain, value: "Chest" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-chest-vals
    type: text
    z: 31
    x: 340
    y: 360
    width: 670
    height: 0
    content: { type: plain, value: "38.0\"      37.5\"      37.0\"      36.8\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-chest-rule
    type: rect
    z: 32
    x: 80
    y: 395
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-waist
    type: text
    z: 33
    x: 90
    y: 410
    width: 220
    height: 0
    content: { type: plain, value: "Waist" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-waist-vals
    type: text
    z: 34
    x: 340
    y: 410
    width: 670
    height: 0
    content: { type: plain, value: "31.0\"      30.2\"      29.5\"      28.9\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-waist-rule
    type: rect
    z: 35
