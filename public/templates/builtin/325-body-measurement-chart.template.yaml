    height: 0
    content: { type: plain, value: "Shoulders" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-shoul-vals
    type: text
    z: 52
    x: 340
    y: 710
    width: 670
    height: 0
    content: { type: plain, value: "42.0\"      42.5\"      43.0\"      43.4\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-shoul-rule
    type: rect
    z: 53
    x: 80
    y: 745
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-neck
    type: text
    z: 54
    x: 90
    y: 760
    width: 220
    height: 0
    content: { type: plain, value: "Neck" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-neck-vals
    type: text
    z: 55
    x: 340
    y: 760
    width: 670
    height: 0
    content: { type: plain, value: "13.0\"      13.0\"      13.1\"      13.2\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-neck-rule
    type: rect
    z: 56
    x: 80
    y: 795
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-glut
    type: text
    z: 57
    x: 90
