    y: 445
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-hips
    type: text
    z: 36
    x: 90
    y: 460
    width: 220
    height: 0
    content: { type: plain, value: "Hips" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-hips-vals
    type: text
    z: 37
    x: 340
    y: 460
    width: 670
    height: 0
    content: { type: plain, value: "40.0\"      39.5\"      39.0\"      38.6\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-hips-rule
    type: rect
    z: 38
    x: 80
    y: 495
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-bicep
    type: text
    z: 39
    x: 90
    y: 510
    width: 220
    height: 0
    content: { type: plain, value: "Biceps (R)" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-bicep-vals
    type: text
    z: 40
    x: 340
    y: 510
    width: 670
    height: 0
    content: { type: plain, value: "12.0\"      12.2\"      12.5\"      12.8\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-bicep-rule
    type: rect
    z: 41
    x: 80
    y: 545
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-fore
    type: text
    z: 42
    x: 90
    y: 560
    width: 220
    height: 0
    content: { type: plain, value: "Forearm (R)" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-fore-vals
    type: text
    z: 43
    x: 340
    y: 560
    width: 670
    height: 0
    content: { type: plain, value: "9.5\"       9.6\"       9.7\"       9.8\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-fore-rule
    type: rect
    z: 44
    x: 80
    y: 595
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-thigh
    type: text
    z: 45
    x: 90
    y: 610
    width: 220
    height: 0
    content: { type: plain, value: "Thigh (R)" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-thigh-vals
    type: text
    z: 46
    x: 340
    y: 610
    width: 670
    height: 0
    content: { type: plain, value: "22.0\"      22.3\"      22.6\"      22.9\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-thigh-rule
    type: rect
    z: 47
    x: 80
    y: 645
    width: 920
    height: 1
    fill: { type: solid, color: "$border" }

  - id: row-calf
    type: text
    z: 48
    x: 90
    y: 660
    width: 220
    height: 0
    content: { type: plain, value: "Calf (R)" }
    style: { font_family: $body, font_size: 17, font_weight: 600, color: $text }

  - id: row-calf-vals
    type: text
    z: 49
    x: 340
    y: 660
    width: 670
    height: 0
    content: { type: plain, value: "14.0\"      14.1\"      14.2\"      14.3\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-calf-rule
    type: rect
    z: 50
    x: 80
