  - id: row-glut-vals
    type: text
    z: 58
    x: 340
    y: 810
    width: 670
    height: 0
    content: { type: plain, value: "41.0\"      40.5\"      40.0\"      39.6\"" }
    style: { font_family: $mono, font_size: 15, color: $text, text_align: center, letter_spacing: 0.05 }

  # ── Weight + body-fat divider ─────────────────────────────
  - id: total-rule
    type: rect
    z: 60
    x: 80
    y: 870
    width: 920
    height: 2
    fill: { type: solid, color: "$primary" }

  - id: row-weight
    type: text
    z: 61
    x: 90
    y: 890
    width: 220
    height: 0
    content: { type: plain, value: "WEIGHT" }
    style: { font_family: $body, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5, text_transform: uppercase }

  - id: row-weight-vals
    type: text
    z: 62
    x: 340
    y: 890
    width: 670
    height: 0
    content: { type: plain, value: "152 lb     148 lb     145 lb     142 lb" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $text, text_align: center, letter_spacing: 0.05 }

  - id: row-bf
    type: text
    z: 63
    x: 90
    y: 940
    width: 220
    height: 0
    content: { type: plain, value: "BODY FAT %" }
    style: { font_family: $body, font_size: 14, font_weight: 800, color: $primary, letter_spacing: 0.5, text_transform: uppercase }

  - id: row-bf-vals
    type: text
    z: 64
    x: 340
