    height: 0
    content: { type: plain, value: "26.0%      24.5%      23.1%      21.8%" }
    style: { font_family: $mono, font_size: 18, font_weight: 700, color: $text, text_align: center, letter_spacing: 0.05 }

  # ── Tips card ─────────────────────────────────────────────
  - id: tips-card
    type: rect
    z: 70
    x: 60
    y: 1400
    width: 960
    height: 160
    radius: 16
    fill: { type: solid, color: "$secondary", opacity: 0.18 }
    stroke: { color: "$secondary", width: 2 }

  - id: tips-label
    type: text
    z: 71
    x: 90
    y: 1420
    width: 900
    height: 0
    content: { type: plain, value: "MEASUREMENT TIPS" }
    style: { font_family: $body, font_size: 12, font_weight: 800, color: $secondary, letter_spacing: 0.5, text_transform: uppercase }

  - id: tips-body
    type: text
    z: 72
    x: 90
    y: 1445
    width: 900
    height: 0
    content: { type: plain, value: "Measure same time of day · relaxed muscle · tape parallel to floor · same body part L/R noted" }
    style: { font_family: $body, font_size: 15, color: $text, line_height: 1.4 }

  - id: tips-body-2
    type: text
    z: 73
    x: 90
    y: 1500
    width: 900
    height: 0
    content: { type: plain, value: "Weigh-in: morning, post-bathroom, pre-meal · take photos monthly for visual reference." }
    style: { font_family: $body, font_size: 14, font_style: italic, color: $text_muted, line_height: 1.4 }

slots:
  - { id: name,        path: "layers[6].content.value",  type: text, hint: "Person's name",     default: "Aisha Patel" }
  - { id: start_date,  path: "layers[8].content.value",  type: text, hint: "Start date",        default: "2026-01-15" }
  - { id: height,      path: "layers[10].content.value", type: text, hint: "Height",            default: "5'6\" / 168 cm" }
