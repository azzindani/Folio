_protocol: template/v1

# Print-ready business card front face — mono-print theme, editorial feel.
# 3.5"×2" at ~300dpi (1050×600 landscape). Solid fills only.
meta:
  id: tmpl-business-card
  name: Business Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [card, business, print, contact, mono]

document:
  width: 1050
  height: 600
  unit: px
  dpi: 300

theme:
  ref: mono-print

layers:
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1050
    height: 600
    fill: { type: solid, color: "$background" }

  - id: logo-mark
    type: rect
    z: 5
    x: 80
    y: 80
    width: 56
    height: 56
    radius: 6
    fill: { type: solid, color: "$primary" }

  - id: name
    type: text
    z: 10
    x: 80
    y: 200
    width: 890
    height: 0
    content: { type: plain, value: "Jordan Aldwin" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 700
      color: $text
      line_height: 1.05
      letter_spacing: -0.01

  - id: title
    type: text
    z: 11
    x: 80
    y: 280
    width: 890
    height: 0
    content: { type: plain, value: "Principal Product Designer" }
    style:
      font_family: $body
      font_size: 20
      font_weight: 500
      color: $text_muted
      line_height: 1.3

  - id: company
    type: text
    z: 12
    x: 80
    y: 320
    width: 890
    height: 0
    content: { type: plain, value: "Folio Studio" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $primary
      letter_spacing: 0.04
      text_transform: uppercase

  - id: divider
    type: line
    z: 15
    x1: 80
    y1: 400
    x2: 280
    y2: 400
    stroke: { color: "$border", width: 2 }

  - id: email
    type: text
    z: 20
    x: 80
    y: 440
    width: 890
    height: 0
    content: { type: plain, value: "jordan@folio.studio" }
    style:
      font_family: $mono
      font_size: 16
      color: $text
      line_height: 1.4

  - id: phone
    type: text
    z: 21
    x: 80
    y: 480
    width: 890
    height: 0
    content: { type: plain, value: "+1 (415) 555-0142" }
    style:
      font_family: $mono
      font_size: 16
      color: $text
      line_height: 1.4

slots:
  - { id: name,    path: "layers[2].content.value", type: text, hint: "Full name",        default: "Jordan Aldwin" }
  - { id: title,   path: "layers[3].content.value", type: text, hint: "Job title",        default: "Principal Product Designer" }
  - { id: company, path: "layers[4].content.value", type: text, hint: "Company name",     default: "Folio Studio" }
  - { id: email,   path: "layers[6].content.value", type: text, hint: "Email address",    default: "jordan@folio.studio" }
  - { id: phone,   path: "layers[7].content.value", type: text, hint: "Phone number",     default: "+1 (415) 555-0142" }
