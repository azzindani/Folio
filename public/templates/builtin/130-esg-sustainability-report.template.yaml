_protocol: template/v1

# ESG sustainability annual report — corporate eyebrow, hero, 5 KPIs (CO2,
# renewable, diversity, water, waste), 5-year emissions line, energy mix donut,
# initiatives table, diversity stacked bar, community impact table.
meta:
  id: tmpl-esg-sustainability-report
  name: ESG · Sustainability Report
  type: report
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [report, esg, sustainability, environment, social, governance, corporate, interactive]
  description: "Annual ESG report: emissions, energy mix, diversity, water, waste, sustainability initiatives, community impact."

document:
  width: 1280
  height: 2400
  unit: px
  dpi: 96

theme:
  ref: forest-deep

report:
  layout: scroll
  data:
    sources:
      - id: emissions_trend
        type: inline
        rows:
          - { year: 2021, scope_1: 142800, scope_2: 286400, scope_3: 824200 }
          - { year: 2022, scope_1: 138400, scope_2: 268200, scope_3: 798600 }
          - { year: 2023, scope_1: 128600, scope_2: 242800, scope_3: 762400 }
          - { year: 2024, scope_1: 116200, scope_2: 198400, scope_3: 728600 }
          - { year: 2025, scope_1:  98400, scope_2: 162800, scope_3: 684200 }
      - id: energy_mix
        type: inline
        rows:
          - { source: Solar,             share_pct: 28.4 }
          - { source: Wind,              share_pct: 24.2 }
          - { source: Hydroelectric,     share_pct: 12.6 }
          - { source: Natural Gas,       share_pct: 22.8 }
          - { source: Grid (mixed),      share_pct:  9.4 }
          - { source: Biomass,           share_pct:  2.6 }
      - id: initiatives
        type: inline
        rows:
          - { initiative: "Solar Rooftop Expansion",         department: Facilities,     budget: 4280000, impact_metric: "12 GWh/yr renewable" }
          - { initiative: "Fleet Electrification Phase 2",   department: Operations,     budget: 6840000, impact_metric: "1,842 tCO2e avoided" }
          - { initiative: "Water Recycling System",          department: Manufacturing,  budget: 2480000, impact_metric: "24M gallons reused" }
          - { initiative: "Zero-Waste-to-Landfill Program",  department: Operations,     budget:  842000, impact_metric: "94% diversion rate" }
          - { initiative: "Supplier Sustainability Audit",   department: Procurement,    budget:  428000, impact_metric: "286 suppliers assessed" }
          - { initiative: "Pay-Equity Audit & Adjustment",   department: People,         budget:  624000, impact_metric: "0.4% gap closed" }
          - { initiative: "Inclusive Leadership Training",   department: People,         budget:  186000, impact_metric: "1,248 leaders trained" }
          - { initiative: "Green Building Retrofit (HQ)",    department: Facilities,     budget: 8640000, impact_metric: "LEED Platinum cert" }
      - id: diversity
        type: inline
        rows:
          - { level: Individual Contributor,  women_pct: 44.2, men_pct: 54.4, nonbinary_pct: 1.4 }
          - { level: Senior IC,               women_pct: 40.8, men_pct: 58.0, nonbinary_pct: 1.2 }
          - { level: Manager,                 women_pct: 38.4, men_pct: 60.6, nonbinary_pct: 1.0 }
          - { level: Senior Manager,          women_pct: 34.6, men_pct: 64.6, nonbinary_pct: 0.8 }
          - { level: Director,                women_pct: 30.2, men_pct: 69.2, nonbinary_pct: 0.6 }
          - { level: VP & Above,              women_pct: 26.8, men_pct: 72.8, nonbinary_pct: 0.4 }
      - id: community
        type: inline
        rows:
          - { program: "Local Schools STEM Outreach",       beneficiaries: 4280, hours: 1840, spend:  248000 }
          - { program: "Community Food Bank Partnership",   beneficiaries: 8642, hours: 2640, spend:  186000 }
          - { program: "Habitat Build Days",                beneficiaries:  486, hours:  984, spend:   84000 }
          - { program: "Disaster Relief Match Fund",        beneficiaries: 2842, hours:  248, spend:  342000 }
          - { program: "Veterans Employment Initiative",    beneficiaries:  184, hours:  624, spend:  128000 }
          - { program: "Environmental Restoration Days",    beneficiaries: 1248, hours: 1242, spend:   96000 }

pages:
  - id: report
    label: ESG Report
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: $mono
        font_size: 12
        color: "$primary"
        letter_spacing: 1
        content: "TERRACORP INDUSTRIES · 2025 SUSTAINABILITY REPORT · GRI / SASB ALIGNED"

      - id: hero
        type: rich_text
        x: 60
        y: 92
        width: 1160
        height: 120
        format: markdown
        font_family: Playfair Display
        font_size: 48
        font_weight: 800
        line_height: 1.04
        letter_spacing: -0.02
        content: "**Sustainability Report — 2025**\n*Progress toward net-zero, inclusive workplaces, and community impact.*"

      - id: kpi-co2
        type: kpi_card
        x: 60
        y: 220
        width: 224
        height: 140
        label: CO2 Reduction %
        value: 18.4
        format: percent
        delta: 4.2
        delta_format: percent
        sparkline_data: emissions_trend
        sparkline_field: scope_1
        sparkline_color: "$primary"

      - id: kpi-renewable
        type: kpi_card
        x: 304
        y: 220
        width: 224
        height: 140
        label: Renewable Energy %
        value: 67.8
        format: percent
        delta: 8.4
        delta_format: percent

      - id: kpi-diversity
        type: kpi_card
        x: 548
        y: 220
        width: 224
        height: 140
        label: Diversity Index
        value: 72.4
        format: number
        decimals: 1
        delta: 3.6
        delta_format: number

      - id: kpi-water
        type: kpi_card
        x: 792
        y: 220
        width: 224
        height: 140
        label: Water Saved (gal)
        value: 24600000
        format: number
        delta: 14.6
        delta_format: percent

      - id: kpi-waste
        type: kpi_card
        x: 1036
        y: 220
        width: 184
        height: 140
        label: Waste Diverted %
        value: 94.2
        format: percent
        delta: 2.8
        delta_format: percent

      - id: section-emissions
        type: rich_text
        x: 60
        y: 400
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        letter_spacing: -0.02
        content: "**Greenhouse Gas Emissions — 5-Year Trend (tCO2e)**"

      - id: chart-emissions
        type: interactive_chart
        x: 60
        y: 460
        width: 740
        height: 380
        chart_type: line
        data_ref: emissions_trend
        x_field: year
        y_field: scope_1
        title: Scope 1 / 2 / 3 Emissions by Year
        legend: true
        grid: true
        animate: true

      - id: chart-energy
        type: interactive_chart
        x: 820
        y: 460
        width: 400
        height: 380
        chart_type: donut
        data_ref: energy_mix
        x_field: source
        y_field: share_pct
        title: Energy Mix by Source
        legend: true
        animate: true

      - id: section-initiatives
        type: rich_text
        x: 60
        y: 880
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        letter_spacing: -0.02
        content: "**Sustainability Initiatives — 2025**"

      - id: tbl-initiatives
        type: interactive_table
        x: 60
        y: 940
        width: 1160
        height: 460
        data_ref: initiatives
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: initiative,     title: Initiative,      width: 360, sortable: true }
          - { field: department,     title: Department,      width: 200, sortable: true, formatter: badge }
          - { field: budget,         title: Budget (USD),    width: 220, sortable: true, formatter: currency, align: right }
          - { field: impact_metric,  title: Impact,          width: 380, sortable: true }

      - id: section-diversity
        type: rich_text
        x: 60
        y: 1440
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        letter_spacing: -0.02
        content: "**Workforce Diversity by Career Level**"

      - id: chart-diversity
        type: interactive_chart
        x: 60
        y: 1500
        width: 1160
        height: 360
        chart_type: bar
        data_ref: diversity
        x_field: level
        y_field: women_pct
        title: Representation % — Women / Men / Nonbinary by Level
        legend: true
        grid: true
        animate: true

      - id: section-community
        type: rich_text
        x: 60
        y: 1900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 800
        letter_spacing: -0.02
        content: "**Community Impact Programs**"

      - id: tbl-community
        type: interactive_table
        x: 60
        y: 1960
        width: 1160
        height: 380
        data_ref: community
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: program,         title: Program,          width: 380, sortable: true, formatter: badge }
          - { field: beneficiaries,   title: Beneficiaries,    width: 220, sortable: true, formatter: number,   align: right }
          - { field: hours,           title: Volunteer Hours,  width: 220, sortable: true, formatter: number,   align: right }
          - { field: spend,           title: Spend (USD),      width: 280, sortable: true, formatter: currency, align: right }

      - { id: rule-top, type: rect, z: 12, x: 60, y: 72, width: 1160, height: 1, fill: { type: solid, color: "$border" } }
      - { id: rule-tick, type: rect, z: 13, x: 60, y: 69, width: 150, height: 6, fill: { type: solid, color: "$primary" } }

slots:
  - { id: report_title,        path: "pages[0].layers[1].content",  type: text, hint: "Report title",         default: "**Sustainability Report — 2025**\n*Our progress toward net-zero by 2040, inclusive workplaces, and measurable community impact.*" }
  - { id: report_eyebrow,      path: "pages[0].layers[0].content",  type: text, hint: "Corporate eyebrow",    default: "TERRACORP INDUSTRIES · 2025 SUSTAINABILITY REPORT · GRI / SASB ALIGNED" }
  - { id: emissions_section,   path: "pages[0].layers[7].content",  type: text, hint: "Emissions heading",   default: "**Greenhouse Gas Emissions — 5-Year Trend (tCO2e)**" }
  - { id: initiatives_section, path: "pages[0].layers[10].content", type: text, hint: "Initiatives heading", default: "**Sustainability Initiatives — 2025**" }
  - { id: diversity_section,   path: "pages[0].layers[12].content", type: text, hint: "Diversity heading",   default: "**Workforce Diversity by Career Level**" }
  - { id: community_section,   path: "pages[0].layers[14].content", type: text, hint: "Community heading",   default: "**Community Impact Programs**" }
