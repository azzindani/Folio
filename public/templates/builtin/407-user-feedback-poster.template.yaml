_protocol: template/v1

# User feedback / testimonial poster. LinkedIn 4:5 portrait.
# Italic display quote + avatar + name + 5-star rating.
meta:
  id: tmpl-user-feedback-poster
  name: User Feedback Poster
  type: poster
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [poster, linkedin, testimonial, feedback, social-proof, "4-5"]
  description: "LinkedIn 4:5 customer testimonial with display quote, avatar, attribution, and stars."

document:
  width: 1200
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1200, height: 1500, fill: { type: solid, color: "$background" } }

  - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1200, height: 12, fill: { type: solid, color: "$primary" } }

  - id: eyebrow
    type: text
    z: 10
    x: 80
    y: 120
    width: 1040
    height: 0
    content: { type: plain, value: "FROM A REAL USER" }
    style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.4, text_transform: uppercase }

  - id: quote-mark
    type: text
    z: 11
    x: 80
    y: 200
    width: 200
    height: 0
    content: { type: plain, value: "“" }
    style: { font_family: $heading, font_size: 200, font_weight: 800, color: $accent, line_height: 0.8 }

  - id: quote
    type: text
    z: 20
    x: 80
    y: 420
    width: 1040
    height: 0
    content: { type: plain, value: "I genuinely cannot remember how my workflow worked before this. Setup took 10 minutes, and the time it has saved me since is unreasonable." }
    style: { font_family: $heading, font_size: 46, font_style: italic, font_weight: 500, color: $text, line_height: 1.3, letter_spacing: -0.01 }

  - { id: divider, type: rect, z: 30, x: 80, y: 980, width: 1040, height: 1, fill: { type: solid, color: "$text_muted" }, opacity: 0.3 }

  - { id: avatar, type: circle, z: 40, cx: 140, cy: 1100, rx: 60, ry: 60, fill: { type: solid, color: $primary } }

  - id: avatar-initial
    type: text
    z: 41
    x: 80
    y: 1075
    width: 120
    height: 0
    content: { type: plain, value: "M" }
    style: { font_family: $heading, font_size: 56, font_weight: 800, color: "#FFFFFF", text_align: center, line_height: 1.0 }

  - id: name
    type: text
    z: 50
    x: 230
    y: 1070
    width: 700
    height: 0
    content: { type: plain, value: "Maya Okafor" }
    style: { font_family: $heading, font_size: 32, font_weight: 700, color: $text, line_height: 1.1, letter_spacing: -0.01 }

  - id: name-caption
    type: text
    z: 51
    x: 230
    y: 1118
    width: 700
    height: 0
    content: { type: plain, value: "Power user since 2023" }
    style: { font_family: $body, font_size: 18, color: $text_muted, line_height: 1.4 }

  - id: star-1
    type: text
    z: 60
    x: 80
    y: 1230
    width: 80
    height: 0
    content: { type: plain, value: "★" }
    style: { font_family: $heading, font_size: 48, color: "#F59E0B", line_height: 1.0 }

  - id: star-2
    type: text
    z: 61
    x: 150
    y: 1230
    width: 80
    height: 0
    content: { type: plain, value: "★" }
    style: { font_family: $heading, font_size: 48, color: "#F59E0B", line_height: 1.0 }

  - id: star-3
    type: text
    z: 62
    x: 220
    y: 1230
    width: 80
    height: 0
    content: { type: plain, value: "★" }
    style: { font_family: $heading, font_size: 48, color: "#F59E0B", line_height: 1.0 }

  - id: star-4
    type: text
    z: 63
    x: 290
    y: 1230
    width: 80
    height: 0
    content: { type: plain, value: "★" }
    style: { font_family: $heading, font_size: 48, color: "#F59E0B", line_height: 1.0 }

  - id: star-5
    type: text
    z: 64
    x: 360
    y: 1230
    width: 80
    height: 0
    content: { type: plain, value: "★" }
    style: { font_family: $heading, font_size: 48, color: "#F59E0B", line_height: 1.0 }

  - id: rating-label
    type: text
    z: 65
    x: 460
    y: 1248
    width: 400
    height: 0
    content: { type: plain, value: "5.0 / Verified review" }
    style: { font_family: $mono, font_size: 16, color: $text_muted, line_height: 1.4, letter_spacing: 0.04 }

  - id: page-mark
    type: text
    z: 70
    x: 880
    y: 1400
    width: 240
    height: 0
    content: { type: plain, value: "01 / FOLIO" }
    style: { font_family: $mono, font_size: 13, font_weight: 600, color: $text_muted, letter_spacing: 0.3, text_align: right, text_transform: uppercase }

  - id: handle
    type: text
    z: 71
    x: 80
    y: 1400
    width: 700
    height: 0
    content: { type: plain, value: "@yourhandle · yourproduct.com" }
    style: { font_family: $mono, font_size: 14, color: $text_muted, line_height: 1.4 }

animations:
  quote:
    enter: { type: fade_up, duration: 800, delay: 200, easing: ease-out }
  avatar:
    enter: { type: scale_in, duration: 600, delay: 600, easing: ease-out }
  avatar-initial:
    enter: { type: scale_in, duration: 600, delay: 600, easing: ease-out }
  name:
    enter: { type: fade_up, duration: 500, delay: 700, easing: ease-out }
  star-1:
    enter: { type: scale_in, duration: 400, delay: 800, easing: ease-out }
  star-2:
    enter: { type: scale_in, duration: 400, delay: 900, easing: ease-out }
  star-3:
    enter: { type: scale_in, duration: 400, delay: 1000, easing: ease-out }
  star-4:
    enter: { type: scale_in, duration: 400, delay: 1100, easing: ease-out }
  star-5:
    enter: { type: scale_in, duration: 400, delay: 1200, easing: ease-out }

slots:
  - { id: eyebrow,       path: "layers[2].content.value",  type: text, hint: "Eyebrow",         default: "FROM A REAL USER" }
  - { id: quote,         path: "layers[4].content.value",  type: text, hint: "Display quote",   default: "I genuinely cannot remember how my workflow worked before this. Setup took 10 minutes, and the time it has saved me since is unreasonable." }
  - { id: avatar_initial,path: "layers[7].content.value",  type: text, hint: "Avatar initial",  default: "M" }
  - { id: name,          path: "layers[8].content.value",  type: text, hint: "Name",            default: "Maya Okafor" }
  - { id: name_caption,  path: "layers[9].content.value",  type: text, hint: "Caption",         default: "Power user since 2023" }
  - { id: rating_label,  path: "layers[15].content.value", type: text, hint: "Rating label",    default: "5.0 / Verified review" }
  - { id: handle,        path: "layers[17].content.value", type: text, hint: "Handle",          default: "@yourhandle · yourproduct.com" }
