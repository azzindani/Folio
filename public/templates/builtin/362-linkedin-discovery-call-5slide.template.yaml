_protocol: template/v1

# 5-slide LinkedIn carousel — discovery call questions. 1080×1350 portrait.
meta:
  id: tmpl-linkedin-discovery-call-5slide
  name: LinkedIn Discovery Call Questions (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, sales, discovery, qualification, 4-5]
  description: "5-slide LinkedIn carousel: the 3 questions that move a discovery call from chat to deal."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: ocean-blue

pages:
  # ── Slide 1 · Cover ────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 160, stops: [{ color: "$background", position: 0 }, { color: "$surface", position: 100 }] } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 480
        width: 920
        height: 0
        content: { type: plain, value: "DISCOVERY · 2026 EDITION" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $primary, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 540
        width: 920
        height: 0
        content: { type: plain, value: "The 3 questions\nthat close deals." }
        style: { font_family: $heading, font_size: 100, font_weight: 800, color: $text, line_height: 1, letter_spacing: -0.03 }
      - id: subtitle
        type: text
        z: 12
        x: 80
        y: 860
        width: 920
        height: 0
        content: { type: plain, value: "Stop demo-ing. Start qualifying. Here's how the best reps run discovery." }
        style: { font_family: $body, font_size: 26, color: $text_muted, line_height: 1.4 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "1/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 2 · Intro ────────────────────────────────────────
  - id: intro
    label: Intro
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: eyebrow
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "WHY THIS MATTERS" }
        style: { font_family: $mono, font_size: 16, font_weight: 700, color: $accent, letter_spacing: 0.32, text_transform: uppercase }
      - id: title
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "Most reps run discovery like a survey." }
        style: { font_family: $heading, font_size: 60, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 }
      - id: body
        type: text
        z: 12
        x: 80
        y: 460
        width: 920
        height: 0
        content: { type: plain, value: "They check boxes. They take notes. They never get to the truth.\n\nThese 3 questions cut through the polite chat and surface whether a deal is real — usually inside 20 minutes." }
        style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "2/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 3 · Q1 ───────────────────────────────────────────
  - id: q1
    label: Question 01
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "01" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, letter_spacing: 0.2 }
      - id: question
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "What made you take this call today?" }
        style: { font_family: $heading, font_size: 72, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: why-label
        type: text
        z: 12
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "WHY IT WORKS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: why-body
        type: text
        z: 13
        x: 80
        y: 660
        width: 920
        height: 0
        content: { type: plain, value: "Everyone is busy. If they cleared 30 minutes for you, something specific is broken. This question forces them to name it in their own words — and gives you the language to sell back." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "3/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 4 · Q2 ───────────────────────────────────────────
  - id: q2
    label: Question 02
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$primary" } }
      - id: number
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "02" }
        style: { font_family: $mono, font_size: 22, font_weight: 700, color: $primary, letter_spacing: 0.2 }
      - id: question
        type: text
        z: 11
        x: 80
        y: 200
        width: 920
        height: 0
        content: { type: plain, value: "Walk me through what you tried before." }
        style: { font_family: $heading, font_size: 70, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 }
      - id: why-label
        type: text
        z: 12
        x: 80
        y: 620
        width: 920
        height: 0
        content: { type: plain, value: "WHY IT WORKS" }
        style: { font_family: $mono, font_size: 14, font_weight: 700, color: $accent, letter_spacing: 0.36, text_transform: uppercase }
      - id: why-body
        type: text
        z: 13
        x: 80
        y: 660
        width: 920
        height: 0
        content: { type: plain, value: "Past attempts show urgency, budget appetite, and which internal politics killed the last project. If they say \"nothing\" — the problem isn't real enough to spend on. Disqualify fast." }
        style: { font_family: $body, font_size: 24, color: $text, line_height: 1.55 }
      - id: counter
        type: text
        z: 20
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "4/5" }
        style: { font_family: $mono, font_size: 14, color: $text_muted, text_align: right }

  # ── Slide 5 · CTA + Q3 (provocative) ───────────────────────
  - id: cta
    label: Question 03 + CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 180, stops: [{ color: "$primary", position: 0 }, { color: "$background", position: 100 }] } }
      - { id: accent-band, type: rect, z: 1, x: 0, y: 0, width: 1080, height: 12, fill: { type: solid, color: "$accent" } }
      - id: number
        type: text
        z: 10
        x: 80
        y: 140
        width: 920
        height: 0
        content: { type: plain, value: "03 · THE CLOSER" }
        style: { font_family: $mono, font_size: 18, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.32, text_transform: uppercase }
      - id: question
        type: text
        z: 11
        x: 80
        y: 220
        width: 920
        height: 0
        content: { type: plain, value: "If we don't fix this, what happens in 6 months?" }
        style: { font_family: $heading, font_size: 80, font_weight: 800, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.03 }
      - id: why-body
        type: text
        z: 12
        x: 80
        y: 740
        width: 920
        height: 0
        content: { type: plain, value: "Status-quo is the real competitor. This question makes the cost of inaction visible — and turns \"interesting\" into \"urgent.\"" }
        style: { font_family: $body, font_size: 26, color: "#FFFFFF", line_height: 1.45 }
      - { id: cta-btn, type: rect, z: 13, x: 80, y: 980, width: 360, height: 72, radius: 36, fill: { type: solid, color: "$primary" } }
      - id: cta-text
        type: text
        z: 14
        x: 80
        y: 1002
        width: 360
        height: 0
        content: { type: plain, value: "Follow for more →" }
        style: { font_family: $body, font_size: 20, font_weight: 700, color: "#FFFFFF", text_align: center }
      - id: handle
        type: text
        z: 15
        x: 80
        y: 1280
        width: 920
        height: 0
        content: { type: plain, value: "@yourhandle" }
        style: { font_family: $mono, font_size: 14, color: "#FFFFFF", text_align: right }

slots:
  - { id: cover_title,    path: "pages[0].layers[3].content.value", type: text, hint: "Cover title",       default: "The 3 questions\nthat close deals." }
  - { id: cover_subtitle, path: "pages[0].layers[4].content.value", type: text, hint: "Cover subtitle",    default: "Stop demo-ing. Start qualifying." }
  - { id: intro_body,     path: "pages[1].layers[4].content.value", type: text, hint: "Intro body",        default: "Most reps check boxes." }
  - { id: q1_question,    path: "pages[2].layers[3].content.value", type: text, hint: "Question 01",       default: "What made you take this call today?" }
  - { id: q1_why,         path: "pages[2].layers[5].content.value", type: text, hint: "Question 01 why",   default: "Everyone is busy." }
  - { id: q2_question,    path: "pages[3].layers[3].content.value", type: text, hint: "Question 02",       default: "Walk me through what you tried before." }
  - { id: q2_why,         path: "pages[3].layers[5].content.value", type: text, hint: "Question 02 why",   default: "Past attempts show urgency and budget." }
  - { id: q3_question,    path: "pages[4].layers[3].content.value", type: text, hint: "Question 03",       default: "If we don't fix this, what happens in 6 months?" }
  - { id: q3_why,         path: "pages[4].layers[4].content.value", type: text, hint: "Question 03 why",   default: "Status-quo is the real competitor." }
  - { id: handle,         path: "pages[4].layers[7].content.value", type: text, hint: "Handle",            default: "@yourhandle" }
