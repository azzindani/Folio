_protocol: template/v1

# Retro 70s rock-poster — warm sunset palette, thick rounded type,
# concentric arcs at the top, radiating sunburst beams, decorative star.
# Composition: sunburst origin at top-center → big title below → subtitle →
# date pill → location row → corner star.
meta:
  id: tmpl-retro-poster
  name: Retro 70s Poster
  type: poster
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [poster, retro, 70s, sunburst, mod, warm]

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  # ── warm background
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill:
      type: linear
      angle: 180
      stops:
        - { color: "$background", position: 0 }
        - { color: "$surface", position: 100 }

  # ── CONCENTRIC ARCS (top, 6 nested stroked circles, varied sizes)
  - id: arc-1
    type: circle
    z: 5
    cx: 540
    cy: 200
    rx: 900
    ry: 900
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 6 }
    opacity: 0.55

  - id: arc-2
    type: circle
    z: 6
    cx: 540
    cy: 200
    rx: 780
    ry: 780
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$secondary", width: 6 }
    opacity: 0.6

  - id: arc-3
    type: circle
    z: 7
    cx: 540
    cy: 200
    rx: 660
    ry: 660
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$accent", width: 8 }
    opacity: 0.7

  - id: arc-4
    type: circle
    z: 8
    cx: 540
    cy: 200
    rx: 540
    ry: 540
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$primary", width: 8 }
    opacity: 0.75

  - id: arc-5
    type: circle
    z: 9
    cx: 540
    cy: 200
    rx: 420
    ry: 420
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$secondary", width: 10 }
    opacity: 0.8

  - id: arc-6
    type: circle
    z: 10
    cx: 540
    cy: 200
    rx: 300
    ry: 300
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$accent", width: 10 }
    opacity: 0.85

  # ── SUNBURST BEAMS (12 thin rotated rects fanned from origin 540,200)
  # Each rect is 12×900, centered at the origin, rotated to its angle.
  # Beams visible below the origin point only (upper half clips off canvas).
  - id: beam-1
    type: rect
    z: 12
    x: 534
    y: -250
    width: 12
    height: 900
    rotation: -75
    fill: { type: solid, color: "$primary" }
    opacity: 0.65

  - id: beam-2
    type: rect
    z: 13
    x: 534
    y: -250
    width: 12
    height: 900
    rotation: -60
    fill: { type: solid, color: "$accent" }
    opacity: 0.7

  - id: beam-3
    type: rect
    z: 14
    x: 534
    y: -250
    width: 14
    height: 900
    rotation: -45
    fill: { type: solid, color: "$secondary" }
    opacity: 0.7

  - id: beam-4
    type: rect
    z: 15
    x: 534
    y: -250
    width: 12
    height: 900
    rotation: -30
    fill: { type: solid, color: "$primary" }
    opacity: 0.7

  - id: beam-5
    type: rect
    z: 16
    x: 534
    y: -250
    width: 16
    height: 900
    rotation: -15
    fill: { type: solid, color: "$accent" }
    opacity: 0.7

  - id: beam-6
    type: rect
    z: 17
    x: 534
    y: -250
    width: 18
    height: 900
    rotation: 0
    fill: { type: solid, color: "$secondary" }
    opacity: 0.75

  - id: beam-7
    type: rect
    z: 18
    x: 534
    y: -250
    width: 16
    height: 900
    rotation: 15
    fill: { type: solid, color: "$accent" }
    opacity: 0.7

  - id: beam-8
    type: rect
    z: 19
    x: 534
    y: -250
    width: 12
    height: 900
    rotation: 30
    fill: { type: solid, color: "$primary" }
    opacity: 0.7

  - id: beam-9
    type: rect
    z: 20
    x: 534
    y: -250
    width: 14
    height: 900
    rotation: 45
    fill: { type: solid, color: "$secondary" }
    opacity: 0.7

  - id: beam-10
    type: rect
    z: 21
    x: 534
    y: -250
    width: 12
    height: 900
    rotation: 60
    fill: { type: solid, color: "$accent" }
    opacity: 0.7

  - id: beam-11
    type: rect
    z: 22
    x: 534
    y: -250
    width: 12
    height: 900
    rotation: 75
    fill: { type: solid, color: "$primary" }
    opacity: 0.65

  - id: beam-12
    type: rect
    z: 23
    x: 534
    y: -250
    width: 10
    height: 900
    rotation: 90
    fill: { type: solid, color: "$secondary" }
    opacity: 0.5

  # ── sun disc at origin
  - id: sun-disc
    type: circle
    z: 30
    cx: 540
    cy: 200
    rx: 160
    ry: 160
    fill:
      type: radial
      stops:
        - { color: "$accent", position: 0 }
        - { color: "$primary", position: 100 }

  - id: sun-rim
    type: circle
    z: 31
    cx: 540
    cy: 200
    rx: 160
    ry: 160
    fill: { type: solid, color: "transparent" }
    stroke: { color: "$text", width: 4 }
    opacity: 0.6

  # ── title block — big rounded display
  - id: title-bg-strip
    type: rect
    z: 40
    x: 60
    y: 720
    width: 960
    height: 280
    radius: 24
    fill: { type: solid, color: "$primary" }

  - id: title
    type: text
    z: 41
    x: 60
    y: 760
    width: 960
    height: 0
    content: { type: plain, value: "GROOVE" }
    style:
      font_family: $heading
      font_size: 200
      font_weight: 900
      color: "$accent"
      line_height: 1
      letter_spacing: -0.03
      text_align: center
      text_transform: uppercase

  - id: subtitle
    type: text
    z: 42
    x: 60
    y: 1060
    width: 960
    height: 0
    content: { type: plain, value: "a summer of sound · live & loud" }
    style:
      font_family: $heading
      font_size: 36
      font_weight: 800
      font_style: italic
      color: $text
      line_height: 1.2
      text_align: center
      letter_spacing: 0.02

  # ── decorative star (2 overlapping rotated squares)
  - id: star-square-a
    type: rect
    z: 45
    x: 100
    y: 1140
    width: 80
    height: 80
    rotation: 0
    fill: { type: solid, color: "$accent" }

  - id: star-square-b
    type: rect
    z: 46
    x: 100
    y: 1140
    width: 80
    height: 80
    rotation: 45
    fill: { type: solid, color: "$accent" }

  - id: star-dot
    type: circle
    z: 47
    cx: 140
    cy: 1180
    rx: 14
    ry: 14
    fill: { type: solid, color: "$primary" }

  # second decorative star bottom-right
  - id: star2-square-a
    type: rect
    z: 48
    x: 900
    y: 1140
    width: 80
    height: 80
    fill: { type: solid, color: "$accent" }

  - id: star2-square-b
    type: rect
    z: 49
    x: 900
    y: 1140
    width: 80
    height: 80
    rotation: 45
    fill: { type: solid, color: "$accent" }

  - id: star2-dot
    type: circle
    z: 50
    cx: 940
    cy: 1180
    rx: 14
    ry: 14
    fill: { type: solid, color: "$primary" }

  # ── event date pill
  - id: date-pill
    type: rect
    z: 55
    x: 240
    y: 1280
    width: 600
    height: 110
    radius: 55
    fill: { type: solid, color: "$text" }

  - id: event-date
    type: text
    z: 56
    x: 240
    y: 1310
    width: 600
    height: 0
    content: { type: plain, value: "JULY 12 · 1976" }
    style:
      font_family: $heading
      font_size: 54
      font_weight: 900
      color: "$accent"
      text_align: center
      letter_spacing: 0.06

  # ── location row
  - id: loc-rule-left
    type: line
    z: 60
    x1: 80
    y1: 1460
    x2: 360
    y2: 1460
    stroke: { color: "$text", width: 3 }

  - id: loc-rule-right
    type: line
    z: 61
    x1: 720
    y1: 1460
    x2: 1000
    y2: 1460
    stroke: { color: "$text", width: 3 }

  - id: location
    type: text
    z: 62
    x: 60
    y: 1440
    width: 960
    height: 0
    content: { type: plain, value: "FILLMORE WEST · SAN FRANCISCO" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: $text
      text_align: center
      letter_spacing: 0.16
      text_transform: uppercase

  # ── footer caption
  - id: footer-line
    type: text
    z: 70
    x: 60
    y: 1540
    width: 960
    height: 0
    content: { type: plain, value: "DOORS · 7PM   //   ALL AGES   //   $8 AT THE DOOR" }
    style:
      font_family: $mono
      font_size: 18
      font_weight: 700
      color: $text_muted
      text_align: center
      letter_spacing: 0.18

slots:
  - { id: title,      path: "layers[22].content.value", type: text, hint: "Big bold title (short, all-caps)", default: "GROOVE" }
  - { id: subtitle,   path: "layers[23].content.value", type: text, hint: "Italic subtitle",                  default: "a summer of sound · live & loud" }
  - { id: event_date, path: "layers[31].content.value", type: text, hint: "Event date pill text",             default: "JULY 12 · 1976" }
  - { id: location,   path: "layers[34].content.value", type: text, hint: "Venue + city (all-caps)",          default: "FILLMORE WEST · SAN FRANCISCO" }
