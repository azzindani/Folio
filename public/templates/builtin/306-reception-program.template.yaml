_protocol: template/v1

# Reception program — 1080×1500 portrait, editorial-cream theme.
# Timeline of six reception events with start times, plus DJ/band + last-call footer.
meta:
  id: tmpl-reception-program
  name: Reception Program
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [card, wedding, reception, program, timeline, editorial, portrait]
  description: "Reception program with six-event timeline, DJ/band credit, and last-call time."

document:
  width: 1080
  height: 1500
  unit: px
  dpi: 96

theme:
  ref: editorial-cream

layers:
  # 0 bg
  - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1500, fill: { type: solid, color: "$background" } }
  # 1 outer frame
  - { id: frame, type: rect, z: 1, x: 60, y: 60, width: 960, height: 1380, fill: { type: solid, color: "transparent" }, stroke: { color: "$primary", width: 0.5 } }
  # 2 top ornament
  - { id: orn-top, type: text, z: 5, x: 0, y: 130, width: 1080, height: 0, content: { type: plain, value: "❦  ·  ❦" }, style: { font_family: $heading, font_size: 24, color: "$primary", text_align: center, letter_spacing: 0.4 } }
  # 3 couple
  - { id: couple, type: text, z: 10, x: 0, y: 175, width: 1080, height: 0, content: { type: plain, value: "Amelia & Jonathan" }, style: { font_family: $heading, font_size: 52, font_style: italic, color: "$text", text_align: center } }
  # 4 reception date subtitle
  - { id: sub, type: text, z: 11, x: 0, y: 250, width: 1080, height: 0, content: { type: plain, value: "RECEPTION · 24 MAY 2026" }, style: { font_family: $body, font_size: 16, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.7 } }
  # 5 title
  - { id: title, type: text, z: 12, x: 0, y: 300, width: 1080, height: 0, content: { type: plain, value: "The Evening" }, style: { font_family: $heading, font_size: 64, font_style: italic, color: "$primary", text_align: center, line_height: 1 } }
  # 6 rule
  - { id: rule, type: rect, z: 13, x: 490, y: 400, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 7 timeline vertical line
  - { id: tl-line, type: rect, z: 14, x: 380, y: 460, width: 1, height: 760, fill: { type: solid, color: "$primary" } }
  # 8 event 1 dot
  - { id: e1-dot, type: circle, z: 20, cx: 380, cy: 490, rx: 8, ry: 8, fill: { type: solid, color: "$primary" } }
  - { id: e1-time, type: text, z: 21, x: 120, y: 470, width: 240, height: 0, content: { type: plain, value: "5:00 PM" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: right } }
  - { id: e1-title, type: text, z: 22, x: 420, y: 470, width: 540, height: 0, content: { type: plain, value: "Cocktail Hour" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text" } }
  - { id: e1-body, type: text, z: 23, x: 420, y: 510, width: 540, height: 0, content: { type: plain, value: "Garden terrace · signature cocktails & passed bites" }, style: { font_family: $body, font_size: 15, color: "$text_muted", line_height: 1.5 } }
  # 9 event 2
  - { id: e2-dot, type: circle, z: 20, cx: 380, cy: 620, rx: 8, ry: 8, fill: { type: solid, color: "$primary" } }
  - { id: e2-time, type: text, z: 21, x: 120, y: 600, width: 240, height: 0, content: { type: plain, value: "6:30 PM" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: right } }
  - { id: e2-title, type: text, z: 22, x: 420, y: 600, width: 540, height: 0, content: { type: plain, value: "Grand Entrance & First Dance" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text" } }
  - { id: e2-body, type: text, z: 23, x: 420, y: 640, width: 540, height: 0, content: { type: plain, value: "Couple's first dance · At Last by Etta James" }, style: { font_family: $body, font_size: 15, color: "$text_muted", line_height: 1.5 } }
  # 10 event 3
  - { id: e3-dot, type: circle, z: 20, cx: 380, cy: 750, rx: 8, ry: 8, fill: { type: solid, color: "$primary" } }
  - { id: e3-time, type: text, z: 21, x: 120, y: 730, width: 240, height: 0, content: { type: plain, value: "7:00 PM" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: right } }
  - { id: e3-title, type: text, z: 22, x: 420, y: 730, width: 540, height: 0, content: { type: plain, value: "Dinner Service" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text" } }
  - { id: e3-body, type: text, z: 23, x: 420, y: 770, width: 540, height: 0, content: { type: plain, value: "Four courses · please be seated by half past" }, style: { font_family: $body, font_size: 15, color: "$text_muted", line_height: 1.5 } }
  # 11 event 4
  - { id: e4-dot, type: circle, z: 20, cx: 380, cy: 880, rx: 8, ry: 8, fill: { type: solid, color: "$primary" } }
  - { id: e4-time, type: text, z: 21, x: 120, y: 860, width: 240, height: 0, content: { type: plain, value: "8:30 PM" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: right } }
  - { id: e4-title, type: text, z: 22, x: 420, y: 860, width: 540, height: 0, content: { type: plain, value: "Toasts" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text" } }
  - { id: e4-body, type: text, z: 23, x: 420, y: 900, width: 540, height: 0, content: { type: plain, value: "Best man · maid of honour · parents of the couple" }, style: { font_family: $body, font_size: 15, color: "$text_muted", line_height: 1.5 } }
  # 12 event 5
  - { id: e5-dot, type: circle, z: 20, cx: 380, cy: 1010, rx: 8, ry: 8, fill: { type: solid, color: "$primary" } }
  - { id: e5-time, type: text, z: 21, x: 120, y: 990, width: 240, height: 0, content: { type: plain, value: "9:15 PM" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: right } }
  - { id: e5-title, type: text, z: 22, x: 420, y: 990, width: 540, height: 0, content: { type: plain, value: "Cake Cutting" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text" } }
  - { id: e5-body, type: text, z: 23, x: 420, y: 1030, width: 540, height: 0, content: { type: plain, value: "Five-tier vanilla bean & raspberry · please gather round" }, style: { font_family: $body, font_size: 15, color: "$text_muted", line_height: 1.5 } }
  # 13 event 6
  - { id: e6-dot, type: circle, z: 20, cx: 380, cy: 1140, rx: 8, ry: 8, fill: { type: solid, color: "$primary" } }
  - { id: e6-time, type: text, z: 21, x: 120, y: 1120, width: 240, height: 0, content: { type: plain, value: "9:45 PM" }, style: { font_family: $heading, font_size: 26, font_style: italic, color: "$primary", text_align: right } }
  - { id: e6-title, type: text, z: 22, x: 420, y: 1120, width: 540, height: 0, content: { type: plain, value: "Dancing Until Midnight" }, style: { font_family: $heading, font_size: 26, font_weight: 600, color: "$text" } }
  - { id: e6-body, type: text, z: 23, x: 420, y: 1160, width: 540, height: 0, content: { type: plain, value: "Open floor · take a request to the booth" }, style: { font_family: $body, font_size: 15, color: "$text_muted", line_height: 1.5 } }
  # 14 rule
  - { id: rule-2, type: rect, z: 30, x: 490, y: 1260, width: 100, height: 1, fill: { type: solid, color: "$primary" } }
  # 15 music credit label
  - { id: mus-lbl, type: text, z: 31, x: 0, y: 1290, width: 1080, height: 0, content: { type: plain, value: "MUSIC BY" }, style: { font_family: $body, font_size: 13, font_weight: 700, color: "$text_muted", text_align: center, letter_spacing: 0.6 } }
  # 16 DJ/band
  - { id: dj, type: text, z: 32, x: 0, y: 1320, width: 1080, height: 0, content: { type: plain, value: "The Wildwood Trio · DJ Marlon Reeves" }, style: { font_family: $heading, font_size: 22, font_style: italic, color: "$text", text_align: center } }
  # 17 last call
  - { id: last-call, type: text, z: 33, x: 0, y: 1380, width: 1080, height: 0, content: { type: plain, value: "Last call at 11:30 PM · send-off at midnight" }, style: { font_family: $body, font_size: 14, font_weight: 600, color: "$primary", text_align: center, letter_spacing: 0.4 } }

slots:
  - { id: couple_names,   path: "layers[3].content.value", type: text, hint: "Couple names",    default: "Amelia & Jonathan" }
  - { id: reception_date, path: "layers[4].content.value", type: text, hint: "Reception date",  default: "RECEPTION · 24 MAY 2026" }
