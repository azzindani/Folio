pages:
  - id: annual
    label: Annual Report
    layers:
      - id: eyebrow
        type: rich_text
        x: 60
        y: 36
        width: 1160
        height: 24
        format: markdown
        font_family: IBM Plex Mono
        font_size: 12
        color: "$text_muted"
        content: "BRIGHT HORIZONS FOUNDATION · FY2026 · ANNUAL REPORT TO DONORS"

      - id: hero
        type: rich_text
        x: 60
        y: 64
        width: 1160
        height: 130
        format: markdown
        font_family: Playfair Display
        font_size: 40
        font_weight: 700
        line_height: 1.2
        content: "**A Year of Generosity — FY2026**\n*Together, our 4,846 donors funded literacy programs, food security, and youth mentorship in 14 communities.*"

      - id: kpi-raised
        type: kpi_card
        x: 60
        y: 240
        width: 224
        height: 140
        label: Total Raised
        value: 2876400
        format: currency
        currency: USD
        delta: 18.4
        delta_format: percent
        sparkline_data: giving_trend
        sparkline_field: raised
        sparkline_color: "$primary"

