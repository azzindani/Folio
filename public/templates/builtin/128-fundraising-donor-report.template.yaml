        type: kpi_card
        x: 792
        y: 240
        width: 224
        height: 140
        label: Donor Retention %
        value: 68.4
        format: percent
        delta: 2.8
        delta_format: percent

      - id: kpi-programs
        type: kpi_card
        x: 1036
        y: 240
        width: 184
        height: 140
        label: Programs Funded
        value: 24
        format: number
        delta: 4
        delta_format: number

      - id: section-giving
        type: rich_text
        x: 60
        y: 420
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Monthly Giving — FY2026**"

      - id: chart-giving
        type: interactive_chart
        x: 60
        y: 480
        width: 740
        height: 380
        chart_type: line
        data_ref: giving_trend
        x_field: month
        y_field: raised
        title: Monthly Raised vs Target
        legend: true
        grid: true
        animate: true

      - id: chart-segments
        type: interactive_chart
        x: 820
        y: 480
        width: 400
        height: 380
        chart_type: donut
        data_ref: donor_segments
        x_field: segment
        y_field: total
        title: Giving by Donor Segment
        legend: true
        animate: true

      - id: section-campaigns
        type: rich_text
        x: 60
        y: 900
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Campaign Performance**"

      - id: tbl-campaigns
        type: interactive_table
        x: 60
        y: 960
        width: 1160
        height: 420
        data_ref: campaigns
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: campaign,  title: Campaign,        width: 340, sortable: true, formatter: badge }
          - { field: goal,      title: Goal,            width: 180, sortable: true, formatter: currency, align: right }
          - { field: raised,    title: Raised,          width: 180, sortable: true, formatter: currency, align: right }
          - { field: roi,       title: ROI,             width: 160, sortable: true, formatter: number,   align: right }
          - { field: donors,    title: Donors,          width: 180, sortable: true, formatter: number,   align: right }

      - id: section-donors
        type: rich_text
        x: 60
        y: 1420
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Top Lifetime Donors**"

      - id: tbl-donors
        type: interactive_table
        x: 60
        y: 1480
        width: 1160
        height: 460
        data_ref: top_donors
        pagination: false
        filterable: true
        exportable: true
        columns:
          - { field: donor,        title: Donor,            width: 360, sortable: true }
          - { field: cumulative,   title: Lifetime Giving,  width: 220, sortable: true, formatter: currency, align: right }
          - { field: gifts,        title: Gifts,            width: 140, sortable: true, formatter: number,   align: right }
          - { field: first_year,   title: First Year,       width: 160, sortable: true, formatter: number,   align: right }
          - { field: last_gift,    title: Last Gift,        width: 200, sortable: true }

      - id: section-impact
        type: rich_text
        x: 60
        y: 1980
        width: 1160
        height: 40
        format: markdown
        font_family: Playfair Display
        font_size: 24
        font_weight: 700
        content: "**Program Impact**"

      - id: impact-body
        type: rich_text
        x: 60
        y: 2040
        width: 1160
        height: 320
        format: markdown
        font_family: Inter
        font_size: 15
        line_height: 1.7
        content: |
          **Literacy Initiative.** Our after-school tutoring program reached **1,842 students** across 14 elementary schools this year — a 24% increase from FY2025. Reading-level assessments showed an average gain of **1.6 grade levels** among participants who attended at least 20 sessions.

          **Food Security.** Mobile pantries distributed **186,400 meals** to 8,200 families in food-insecure neighborhoods. The new Saturday market in the Eastside corridor served 642 new households in its first six months.

          **Youth Mentorship.** Pairing 412 high school students with professional mentors, **94% of participating seniors graduated on time** and 86% enrolled in post-secondary education or workforce programs. The college-prep cohort produced 38 first-generation college students this spring.

          **Looking Ahead.** With your continued support, FY2027 priorities include expanding the literacy program to two new districts, launching a workforce training partnership with local employers, and completing Phase 2 of the community center capital campaign.

