    height: 0
    content: { type: plain, value: "English · Irish · French" }
    style:
      font_family: $body
      font_size: 14
      color: "#FFFFFF"
      line_height: 1.5
      opacity: 0.9

  # ── Main column heading ──────────────────────────────────
  - id: summary-heading
    type: text
    z: 60
    x: 500
    y: 100
    width: 700
    height: 0
    content: { type: plain, value: "ABOUT ME" }
