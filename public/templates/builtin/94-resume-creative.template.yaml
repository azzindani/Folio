slots:
  - { id: name,          path: "layers[5].content.value",  type: text, hint: "Full name",                  default: "Saoirse Whitman" }
  - { id: role_title,    path: "layers[6].content.value",  type: text, hint: "Role / title headline",      default: "Illustrator & Brand Designer" }
  - { id: contact_email, path: "layers[11].content.value", type: text, hint: "Email address",              default: "saoirse@whitman.studio" }
  - { id: contact_phone, path: "layers[12].content.value", type: text, hint: "Phone number",               default: "+353 1 555 0184" }
  - { id: summary,       path: "layers[32].content.value", type: text, hint: "Personal summary / about",   default: "Illustrator and brand designer with 8 years of experience crafting playful, story-led identities for indie publishers, food brands, and arts non-profits. Loves watercolor, riso, and tiny absurd characters." }
  - { id: skill_list,    path: "layers[17].content.value", type: text, hint: "Top skill pill",             default: "Illustration" }
