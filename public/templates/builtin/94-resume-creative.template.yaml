_protocol: template/v1

# Creative resume — A4 portrait 1240×1754, pastel-dream theme.
# Distinct from 30-resume-cv: pastel sidebar with rounded corners,
# illustration-style avatar disc, soft section pills, no skill bars
# (uses pill chips instead). Friendly tone for creative roles.
meta:
  id: tmpl-resume-creative
  name: Creative Resume
  type: resume
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [resume, cv, creative, pastel, a4, portrait, sidebar]
  description: "Creative resume with pastel sidebar (avatar, contact, skill pills) and main column for experience + education."

document:
  width: 1240
  height: 1754
  unit: px
  dpi: 96

theme:
  ref: pastel-dream

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1240
    height: 1754
    fill: { type: solid, color: "$background" }

  # ── Sidebar plate (rounded right edge) ────────────────────
  - id: sidebar
    type: rect
    z: 1
    x: 40
    y: 40
    width: 420
    height: 1674
    radius: 24
    fill: { type: solid, color: "$primary" }

  # ── Avatar disc (illustration placeholder) ────────────────
  - id: avatar-ring
    type: circle
    z: 5
    cx: 250
    cy: 200
    rx: 100
    ry: 100
    fill: { type: solid, color: "$background" }

  - id: avatar-inner
    type: circle
    z: 6
    cx: 250
    cy: 200
    rx: 88
    ry: 88
    fill: { type: solid, color: $secondary }
  - id: avatar-emoji
    type: text
    z: 7
    x: 170
    y: 165
    width: 160
    height: 0
    content: { type: plain, value: "✿" }
    style:
      font_family: $heading
      font_size: 70
      color: "#FFFFFF"
      text_align: center
      line_height: 1
      opacity: 0.85

  # ── Name + role ──────────────────────────────────────────
  - id: name
    type: text
    z: 10
    x: 80
    y: 340
    width: 340
    height: 0
    content: { type: plain, value: "Saoirse Whitman" }
    style:
      font_family: $heading
      font_size: 42
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1.1
      letter_spacing: -0.01

  - id: role-title
    type: text
    z: 11
    x: 80
    y: 400
    width: 340
    height: 0
    content: { type: plain, value: "Illustrator & Brand Designer" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 500
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3
      opacity: 0.9

  - id: name-dot-1
    type: circle
    z: 12
    cx: 235
    cy: 460
    rx: 4
    ry: 4
    fill: { type: solid, color: "$background" }

  - id: name-dot-2
    type: circle
    z: 13
    cx: 250
    cy: 460
    rx: 4
    ry: 4
    fill: { type: solid, color: "$background" }

  - id: name-dot-3
    type: circle
    z: 14
    cx: 265
    cy: 460
    rx: 4
    ry: 4
    fill: { type: solid, color: "$background" }

  # ── Contact section heading ──────────────────────────────
  - id: contact-heading
    type: text
    z: 20
    x: 80
    y: 510
    width: 340
    height: 0
    content: { type: plain, value: "✦  CONTACT" }
    style:
      font_family: $heading
      font_size: 16
      font_weight: 800
      color: "#FFFFFF"
      letter_spacing: 0.3
      text_transform: uppercase

  - id: contact-email
    type: text
    z: 21
    x: 80
    y: 555
    width: 340
    height: 0
    content: { type: plain, value: "saoirse@whitman.studio" }
    style:
      font_family: $body
      font_size: 14
      color: "#FFFFFF"
      line_height: 1.4
      opacity: 0.9

  - id: contact-phone
    type: text
    z: 22
    x: 80
    y: 585
    width: 340
    height: 0
    content: { type: plain, value: "+353 1 555 0184" }
    style:
      font_family: $body
      font_size: 14
      color: "#FFFFFF"
      line_height: 1.4
      opacity: 0.9

  - id: contact-location
    type: text
    z: 23
    x: 80
    y: 615
    width: 340
    height: 0
    content: { type: plain, value: "Dublin, Ireland" }
    style:
      font_family: $body
      font_size: 14
      color: "#FFFFFF"
      line_height: 1.4
      opacity: 0.9

  - id: contact-web
    type: text
    z: 24
    x: 80
    y: 645
    width: 340
    height: 0
    content: { type: plain, value: "whitman.studio" }
    style:
      font_family: $body
      font_size: 14
