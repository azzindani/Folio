_protocol: template/v1

# Course completion certificate — 1600×1200 landscape, corporate-slate theme.
# Distinguishing layout: split-color left band (primary), course-name as hero,
# horizontal info row (date · hours · instructor), no center seal — uses a
# small verification chip in the lower-right instead.
meta:
  id: tmpl-completion-certificate
  name: Completion Certificate
  type: certificate
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [certificate, completion, course, professional, corporate, landscape]
  description: "Course completion certificate with course name as hero, completion details row, and verification chip."

document:
  width: 1600
  height: 1200
  unit: px
  dpi: 96

theme:
  ref: corporate-slate

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1600
    height: 1200
    fill: { type: solid, color: "$background" }

  # ── Left color band (vertical) ────────────────────────────
  - id: left-band
    type: rect
    z: 1
    x: 0
    y: 0
    width: 120
    height: 1200
    fill: { type: solid, color: "$primary" }

  - id: left-band-stripe
    type: rect
    z: 2
    x: 120
    y: 0
    width: 8
    height: 1200
    fill: { type: solid, color: "$secondary" }

  # ── Brand mark in left band ───────────────────────────────
  - id: brand-mark
    type: rect
    z: 3
    x: 40
    y: 60
    width: 40
    height: 40
    radius: 6
    fill: { type: solid, color: "$background" }

  - id: brand-letter
    type: text
    z: 4
    x: 20
    y: 67
    width: 80
    height: 0
    content: { type: plain, value: "F" }
    style:
      font_family: $heading
      font_size: 24
      font_weight: 800
      color: $primary
      text_align: center
      line_height: 1

  # ── Eyebrow ───────────────────────────────────────────────
  - id: eyebrow
    type: text
    z: 10
    x: 200
    y: 160
    width: 1300
    height: 0
    content: { type: plain, value: "CERTIFICATE OF COMPLETION" }
    style:
      font_family: $body
      font_size: 16
      font_weight: 700
      color: $primary
      letter_spacing: 0.6
      text_transform: uppercase

  - id: eyebrow-rule
    type: rect
    z: 11
    x: 200
    y: 198
    width: 80
    height: 3
    fill: { type: solid, color: "$primary" }

  # ── Presented to label ────────────────────────────────────
  - id: presented-to
    type: text
    z: 20
    x: 200
    y: 250
    width: 1300
    height: 0
    content: { type: plain, value: "This certifies that" }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      font_style: italic
      line_height: 1.3

  # ── Recipient name ────────────────────────────────────────
  - id: recipient-name
    type: text
    z: 21
    x: 200
    y: 300
    width: 1300
    height: 0
    content: { type: plain, value: "Marcus Aurelius Thompson" }
    style:
      font_family: $heading
      font_size: 76
      font_weight: 700
      color: $text
      line_height: 1.05
      letter_spacing: -0.02

  # ── Completion line ──────────────────────────────────────
  - id: completion-line
    type: text
    z: 22
    x: 200
    y: 410
    width: 1300
    height: 0
    content: { type: plain, value: "has successfully completed the program" }
    style:
      font_family: $body
      font_size: 22
      color: $text_muted
      line_height: 1.3
      font_style: italic

  # ── Course name (hero, with quote-tick) ───────────────────
  - id: course-tick
    type: rect
    z: 30
    x: 200
    y: 480
    width: 6
    height: 120
    fill: { type: solid, color: "$primary" }

  - id: course-name
    type: text
    z: 31
    x: 240
    y: 490
    width: 1260
    height: 0
    content: { type: plain, value: "Advanced Data Engineering with Python" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 700
      color: $primary
      line_height: 1.15
      letter_spacing: -0.01

  # ── Info row divider ─────────────────────────────────────
  - id: info-divider
    type: rect
    z: 40
    x: 200
    y: 720
    width: 1300
    height: 1
    fill: { type: solid, color: "$border" }

  # ── Date column ──────────────────────────────────────────
  - id: date-label
    type: text
    z: 50
    x: 200
    y: 760
    width: 380
    height: 0
    content: { type: plain, value: "COMPLETED" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: date-value
    type: text
    z: 51
    x: 200
    y: 790
    width: 380
    height: 0
    content: { type: plain, value: "May 16, 2026" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.2

  # ── Hours column ─────────────────────────────────────────
  - id: hours-label
    type: text
    z: 52
    x: 640
    y: 760
    width: 380
    height: 0
    content: { type: plain, value: "TOTAL HOURS" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: hours-value
    type: text
    z: 53
    x: 640
    y: 790
    width: 380
    height: 0
    content: { type: plain, value: "60 hours · 24 modules" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.2

  # ── Instructor column ────────────────────────────────────
  - id: instructor-label
    type: text
    z: 54
    x: 1080
    y: 760
    width: 420
    height: 0
    content: { type: plain, value: "INSTRUCTOR" }
    style:
      font_family: $body
      font_size: 13
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: instructor-value
    type: text
    z: 55
    x: 1080
    y: 790
    width: 420
    height: 0
    content: { type: plain, value: "Dr. Elena Ramírez" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 600
      color: $text
      line_height: 1.2

  # ── Signature line ────────────────────────────────────────
  - id: sig-line
    type: rect
    z: 60
    x: 200
    y: 980
    width: 320
    height: 1
    fill: { type: solid, color: "$text" }

  - id: sig-name
    type: text
    z: 61
    x: 200
    y: 1000
    width: 400
    height: 0
    content: { type: plain, value: "Authorized Signature" }
    style:
      font_family: $body
      font_size: 13
      color: $text_muted
      letter_spacing: 0.3
      text_transform: uppercase

  # ── Verification chip (lower-right) ──────────────────────
  - id: chip-bg
    type: rect
    z: 70
    x: 1200
    y: 980
    width: 300
    height: 100
    radius: 8
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: chip-label
    type: text
    z: 71
    x: 1220
    y: 1000
    width: 260
    height: 0
    content: { type: plain, value: "VERIFY AT" }
    style:
      font_family: $body
      font_size: 11
      font_weight: 700
      color: $text_muted
      letter_spacing: 0.4
      text_transform: uppercase

  - id: chip-url
    type: text
    z: 72
    x: 1220
    y: 1020
    width: 260
    height: 0
    content: { type: plain, value: "folio.academy/verify" }
    style:
      font_family: $mono
      font_size: 15
      color: $text
      line_height: 1.3

  - id: chip-id
    type: text
    z: 73
    x: 1220
    y: 1048
    width: 260
    height: 0
    content: { type: plain, value: "ID: FA-2026-DE-9214" }
    style:
      font_family: $mono
      font_size: 12
      color: $text_muted
      line_height: 1.3

slots:
  - { id: recipient,       path: "layers[8].content.value",  type: text, hint: "Recipient full name",        default: "Marcus Aurelius Thompson" }
  - { id: course_name,     path: "layers[11].content.value", type: text, hint: "Course / program name",      default: "Advanced Data Engineering with Python" }
  - { id: completion_date, path: "layers[14].content.value", type: text, hint: "Completion date",            default: "May 16, 2026" }
  - { id: total_hours,     path: "layers[16].content.value", type: text, hint: "Total hours / modules",      default: "60 hours · 24 modules" }
  - { id: instructor,      path: "layers[18].content.value", type: text, hint: "Instructor name",            default: "Dr. Elena Ramírez" }
