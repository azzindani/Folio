_protocol: template/v1

# Pet vaccination record — 1050×750 landscape, light-clean theme.
# Pet name + species + DOB header, owner info, 6-row vaccination
# table (vaccine × date given × next due × veterinarian × clinic),
# microchip number footer.
meta:
  id: tmpl-pet-vaccination-record
  name: Pet Vaccination Record
  type: card
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [pet, vaccination, health, vet, record, card, landscape]
  description: "Pet vaccination record card with pet + owner info, 6-row vaccine table (vaccine, date given, next due, vet, clinic), microchip footer."

document:
  width: 1050
  height: 750
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1050
    height: 750
    fill: { type: solid, color: "$background" }

  - id: card
    type: rect
    z: 1
    x: 20
    y: 20
    width: 1010
    height: 710
    radius: 16
    fill: { type: solid, color: "$surface" }
    stroke: { color: "$border", width: 1 }

  - id: top-accent
    type: rect
    z: 2
    x: 20
    y: 20
    width: 1010
    height: 8
    radius: 4
    fill: { type: solid, color: "$primary" }

  # ── Header: title + paw icon ──────────────────────────────
  - id: paw-circle
    type: circle
    z: 10
    x: 40
    y: 56
    width: 60
    height: 60
    fill: { type: solid, color: "$primary", opacity: 0.18 }

  - id: paw-text
    type: text
    z: 11
    x: 40
    y: 72
    width: 60
    height: 0
    content: { type: plain, value: "🐾" }
    style: { font_family: $heading, font_size: 28, text_align: center, line_height: 1 }

  - id: title
    type: text
    z: 12
    x: 120
    y: 50
    width: 600
    height: 0
    content: { type: plain, value: "VACCINATION RECORD" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 800
      color: $text
      letter_spacing: 0.05

  - id: subtitle
    type: text
    z: 13
    x: 120
    y: 88
    width: 600
    height: 0
    content: { type: plain, value: "Official immunization history for veterinary records" }
    style: { font_family: $body, font_size: 13, font_style: italic, color: $text_muted, line_height: 1.3 }

  - id: rec-id
    type: text
    z: 14
    x: 720
    y: 50
    width: 290
    height: 0
    content: { type: plain, value: "REC-VAX-2026-0473" }
    style: { font_family: $mono, font_size: 14, font_weight: 700, color: $primary, text_align: right, letter_spacing: 0.1 }

  - id: rec-issued
    type: text
    z: 15
    x: 720
    y: 75
    width: 290
    height: 0
    content: { type: plain, value: "ISSUED 2026-05-17" }
    style: { font_family: $body, font_size: 12, font_weight: 700, color: $text_muted, text_align: right, letter_spacing: 0.3 }

  # ── Pet + owner info row ──────────────────────────────────
  - id: info-bg
    type: rect
    z: 20
    x: 40
    y: 140
    width: 970
    height: 110
    radius: 10
    fill: { type: solid, color: "$primary", opacity: 0.06 }

  - id: pet-label
    type: text
    z: 21
    x: 60
    y: 155
    width: 280
    height: 0
    content: { type: plain, value: "PET NAME" }
    style: { font_family: $body, font_size: 10, font_weight: 800, color: $text_muted, letter_spacing: 0.4, text_transform: uppercase }

  - id: pet-value
    type: text
    z: 22
    x: 60
    y: 175
    width: 280
    height: 0
    content: { type: plain, value: "MOCHI" }
    style: { font_family: $heading, font_size: 22, font_weight: 800, color: $text, line_height: 1.2 }

  - id: pet-species-label
    type: text
    z: 23
    x: 60
    y: 215
    width: 280
    height: 0
    content: { type: plain, value: "SPECIES · BREED" }
