  - { id: owner_name, path: "layers[19].content.value", type: text, hint: "Owner name",     default: "Sarah Chen" }
  - { id: microchip,  path: "layers[65].content.value", type: text, hint: "Microchip number", default: "985 1410 0028 3947" }
