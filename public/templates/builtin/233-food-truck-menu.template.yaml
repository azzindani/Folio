_protocol: template/v1

# Food truck menu — 1080×1620 portrait, sunset-glow theme.
# Truck name + tagline, 6 menu items with descriptions,
# specialty-of-the-day callout block, location/social footer.
meta:
  id: tmpl-food-truck-menu
  name: Food Truck Menu
  type: menu
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [menu, food-truck, casual, street-food, sunset, portrait]
  description: "Food truck menu with 6 items, descriptions, prices, specialty-of-the-day callout, location and social media footer."

document:
  width: 1080
  height: 1620
  unit: px
  dpi: 96

theme:
  ref: sunset-glow

layers:
  # ── Background gradient ───────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 1080
    height: 1620
    fill: { type: solid, color: $background }
  # ── Top decorative chevron ────────────────────────────────
  - id: chevron
    type: polygon
    z: 1
    points: "0,0 1080,0 1080,80 540,140 0,80"
    fill: { type: solid, color: "$primary" }

  # ── Masthead ──────────────────────────────────────────────
  - id: tagline
    type: text
    z: 10
    x: 80
    y: 180
    width: 920
    height: 0
    content: { type: plain, value: "GRUB ON WHEELS" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 800
      color: "$accent"
      text_align: center
      letter_spacing: 0.6
      text_transform: uppercase

  - id: truck-name
    type: text
    z: 11
    x: 80
    y: 230
    width: 920
    height: 0
    content: { type: plain, value: "Smokestack & Skillet" }
    style:
      font_family: $heading
      font_size: 78
      font_weight: 800
      color: "$text"
      text_align: center
      line_height: 1
      letter_spacing: -0.02

  - id: truck-sub
    type: text
    z: 12
    x: 80
    y: 330
    width: 920
    height: 0
    content: { type: plain, value: "wood-fired tacos · slow-smoked everything" }
    style:
      font_family: $body
      font_size: 18
      font_style: italic
      color: "$text_muted"
      text_align: center
      line_height: 1.3

  # ── Specialty callout ─────────────────────────────────────
  - id: special-bg
    type: rect
    z: 20
    x: 60
    y: 400
    width: 960
    height: 120
    radius: 20
    fill: { type: solid, color: "$primary" }

  - id: special-eyebrow
    type: text
    z: 21
    x: 60
    y: 420
    width: 960
    height: 0
    content: { type: plain, value: "TODAY'S SPECIAL" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      letter_spacing: 0.5
      text_transform: uppercase
      opacity: 0.85

  - id: special-name
    type: text
    z: 22
    x: 60
    y: 450
    width: 960
    height: 0
    content: { type: plain, value: "Brisket Birria Tacos · $14" }
    style:
      font_family: $heading
      font_size: 32
      font_weight: 800
      color: "#FFFFFF"
      text_align: center
      line_height: 1.3

  # ── Item 1 — Pulled Pork Sliders ──────────────────────────
  - id: i1-name
    type: text
    z: 30
    x: 80
    y: 580
    width: 700
    height: 0
    content: { type: plain, value: "Pulled Pork Sliders" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 700
      color: "$text"
      line_height: 1.3

  - id: i1-price
    type: text
    z: 31
    x: 80
    y: 580
    width: 920
    height: 0
    content: { type: plain, value: "$11" }
    style:
      font_family: $heading
      font_size: 26
      font_weight: 800
      color: "$accent"
      text_align: right
      line_height: 1.3

  - id: i1-desc
    type: text
    z: 32
    x: 80
    y: 620
    width: 920
    height: 0
    content: { type: plain, value: "12-hour smoked pork shoulder · house pickles · brioche · 3 sliders" }
    style:
