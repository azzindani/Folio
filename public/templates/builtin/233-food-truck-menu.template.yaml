slots:
  - { id: truck_name,      path: "layers[3].content.value",  type: text, hint: "Truck name",            default: "Smokestack & Skillet" }
  - { id: today_special,   path: "layers[7].content.value",  type: text, hint: "Today's special",      default: "Brisket Birria Tacos · $14" }
  - { id: today_location,  path: "layers[27].content.value", type: text, hint: "Location + hours",     default: "Mission Dolores Park · 11AM–3PM" }
