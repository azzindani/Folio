_protocol: template/v1

# 5-slide LinkedIn carousel · Blameless incident postmortem walkthrough.
# Cover → timeline → root cause → action items → blameless CTA.
meta:
  id: tmpl-linkedin-incident-postmortem-5slide
  name: LinkedIn Incident Postmortem (5 slides)
  type: carousel
  created: "2026-05-17"
  modified: "2026-05-17"
  generator: folio
  tags: [carousel, linkedin, engineering, devops, sre, postmortem, incident, 4-5]
  description: "LinkedIn 4:5 carousel · postmortem walkthrough with timeline, root cause, and action items."

document:
  width: 1080
  height: 1350
  unit: px
  dpi: 96

theme:
  ref: high-contrast

pages:
  # ── 1 · Cover ─────────────────────────────────────────────
  - id: cover
    label: Cover
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 14, fill: { type: solid, color: "$secondary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "01 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: tag-bg, type: rect, z: 11, x: 60, y: 360, width: 200, height: 44, radius: 4, fill: { type: solid, color: "$secondary" } }
      - { id: tag-text, type: text, z: 12, x: 60, y: 372, width: 200, height: 0, content: { type: plain, value: "P0 · RESOLVED" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.32, text_align: center, text_transform: uppercase } }
      - { id: title, type: text, z: 13, x: 60, y: 460, width: 960, height: 0, content: { type: plain, value: "Postmortem:\nProd went down\nat 3am." }, style: { font_family: $heading, font_size: 92, font_weight: 900, color: $text, line_height: 1.0, letter_spacing: -0.03 } }
      - { id: subtitle, type: text, z: 14, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "Duration · 42 min   Impact · 12% of users\nMTTR · 28 min      Severity · Sev-1" }, style: { font_family: $mono, font_size: 22, color: $text_muted, line_height: 1.6 } }
      - { id: swipe, type: text, z: 15, x: 60, y: 1240, width: 960, height: 0, content: { type: plain, value: "Swipe → for the breakdown" }, style: { font_family: $mono, font_size: 16, color: $secondary, letter_spacing: 0.2 } }

  # ── 2 · Timeline ──────────────────────────────────────────
  - id: timeline
    label: Timeline
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 14, fill: { type: solid, color: "$secondary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "02 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "TIMELINE" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.34, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 230, width: 960, height: 0, content: { type: plain, value: "What happened, minute by minute." }, style: { font_family: $heading, font_size: 52, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: rail, type: rect, z: 19, x: 220, y: 420, width: 2, height: 720, fill: { type: solid, color: "$text_muted" }, opacity: 0.4 }
      - { id: dot-1, type: circle, z: 20, cx: 221, cy: 440, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: time-1, type: text, z: 21, x: 60, y: 426, width: 140, height: 0, content: { type: plain, value: "02:58" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.1 } }
      - { id: event-1, type: text, z: 22, x: 260, y: 426, width: 760, height: 0, content: { type: plain, value: "Deploy of release v8.4.1 begins." }, style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 } }
      - { id: dot-2, type: circle, z: 20, cx: 221, cy: 560, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: time-2, type: text, z: 21, x: 60, y: 546, width: 140, height: 0, content: { type: plain, value: "03:02" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.1 } }
      - { id: event-2, type: text, z: 22, x: 260, y: 546, width: 760, height: 0, content: { type: plain, value: "P99 latency spikes to 4.2s. PagerDuty fires." }, style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 } }
      - { id: dot-3, type: circle, z: 20, cx: 221, cy: 680, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: time-3, type: text, z: 21, x: 60, y: 666, width: 140, height: 0, content: { type: plain, value: "03:09" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.1 } }
      - { id: event-3, type: text, z: 22, x: 260, y: 666, width: 760, height: 0, content: { type: plain, value: "On-call ack. Incident channel opened." }, style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 } }
      - { id: dot-4, type: circle, z: 20, cx: 221, cy: 800, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: time-4, type: text, z: 21, x: 60, y: 786, width: 140, height: 0, content: { type: plain, value: "03:18" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.1 } }
      - { id: event-4, type: text, z: 22, x: 260, y: 786, width: 760, height: 0, content: { type: plain, value: "DB connection pool exhausted — confirmed." }, style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 } }
      - { id: dot-5, type: circle, z: 20, cx: 221, cy: 920, rx: 10, ry: 10, fill: { type: solid, color: "$secondary" } }
      - { id: time-5, type: text, z: 21, x: 60, y: 906, width: 140, height: 0, content: { type: plain, value: "03:26" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $text, text_align: right, letter_spacing: 0.1 } }
      - { id: event-5, type: text, z: 22, x: 260, y: 906, width: 760, height: 0, content: { type: plain, value: "Rollback to v8.4.0 initiated." }, style: { font_family: $body, font_size: 24, color: $text, line_height: 1.4 } }
      - { id: dot-6, type: circle, z: 20, cx: 221, cy: 1040, rx: 10, ry: 10, fill: { type: solid, color: "$accent" } }
      - { id: time-6, type: text, z: 21, x: 60, y: 1026, width: 140, height: 0, content: { type: plain, value: "03:40" }, style: { font_family: $mono, font_size: 22, font_weight: 700, color: $accent, text_align: right, letter_spacing: 0.1 } }
      - { id: event-6, type: text, z: 22, x: 260, y: 1026, width: 760, height: 0, content: { type: plain, value: "Service restored. All-clear declared." }, style: { font_family: $body, font_size: 24, font_weight: 700, color: $accent, line_height: 1.4 } }

  # ── 3 · Root Cause ────────────────────────────────────────
  - id: root-cause
    label: Root Cause
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 14, fill: { type: solid, color: "$secondary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "03 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "ROOT CAUSE" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.34, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 230, width: 960, height: 0, content: { type: plain, value: "One config flag.\nOne missing test." }, style: { font_family: $heading, font_size: 76, font_weight: 800, color: $text, line_height: 1.05, letter_spacing: -0.02 } }
      - { id: body, type: text, z: 13, x: 60, y: 500, width: 960, height: 0, content: { type: plain, value: "Release v8.4.1 introduced a new connection-pool config that defaulted to 10 connections per pod (down from 100). Under load, every pod queued requests until the pool exhausted. Existing tests covered correctness but not concurrency, so the regression slipped through CI." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.55 } }
      - { id: callout, type: rect, z: 14, x: 60, y: 980, width: 960, height: 200, radius: 12, fill: { type: solid, color: "$surface" } }
      - { id: callout-tag, type: text, z: 15, x: 92, y: 1010, width: 900, height: 0, content: { type: plain, value: "THE 5 WHYS" }, style: { font_family: $mono, font_size: 13, font_weight: 700, color: $secondary, letter_spacing: 0.36, text_transform: uppercase } }
      - { id: callout-text, type: text, z: 16, x: 92, y: 1050, width: 900, height: 0, content: { type: plain, value: "Not the engineer's fault — the system let a 1-line config change ship without a load test." }, style: { font_family: $body, font_size: 22, color: $text, line_height: 1.5, font_style: italic } }

  # ── 4 · Action Items ──────────────────────────────────────
  - id: actions
    label: Action Items
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: solid, color: "$background" } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 14, fill: { type: solid, color: "$secondary" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "04 / 05" }, style: { font_family: $mono, font_size: 16, color: $text_muted, letter_spacing: 0.2 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 180, width: 960, height: 0, content: { type: plain, value: "5 ACTION ITEMS" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: $secondary, letter_spacing: 0.34, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 230, width: 960, height: 0, content: { type: plain, value: "What we changed." }, style: { font_family: $heading, font_size: 56, font_weight: 800, color: $text, line_height: 1.1, letter_spacing: -0.02 } }
      - { id: num-1, type: text, z: 20, x: 60, y: 420, width: 80, height: 0, content: { type: plain, value: "01" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $secondary, letter_spacing: 0.2 } }
      - { id: action-1, type: text, z: 21, x: 160, y: 420, width: 860, height: 0, content: { type: plain, value: "Add load tests to CI for any pool/config change." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: num-2, type: text, z: 20, x: 60, y: 540, width: 80, height: 0, content: { type: plain, value: "02" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $secondary, letter_spacing: 0.2 } }
      - { id: action-2, type: text, z: 21, x: 160, y: 540, width: 860, height: 0, content: { type: plain, value: "Gate prod deploys on canary p99 < 800ms." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: num-3, type: text, z: 20, x: 60, y: 660, width: 80, height: 0, content: { type: plain, value: "03" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $secondary, letter_spacing: 0.2 } }
      - { id: action-3, type: text, z: 21, x: 160, y: 660, width: 860, height: 0, content: { type: plain, value: "Alert on pool saturation > 70%, not just errors." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: num-4, type: text, z: 20, x: 60, y: 780, width: 80, height: 0, content: { type: plain, value: "04" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $secondary, letter_spacing: 0.2 } }
      - { id: action-4, type: text, z: 21, x: 160, y: 780, width: 860, height: 0, content: { type: plain, value: "Auto-rollback when canary breaches SLO." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: num-5, type: text, z: 20, x: 60, y: 900, width: 80, height: 0, content: { type: plain, value: "05" }, style: { font_family: $mono, font_size: 28, font_weight: 700, color: $secondary, letter_spacing: 0.2 } }
      - { id: action-5, type: text, z: 21, x: 160, y: 900, width: 860, height: 0, content: { type: plain, value: "Document the runbook for pool exhaustion." }, style: { font_family: $body, font_size: 26, color: $text, line_height: 1.5 } }
      - { id: footer-note, type: text, z: 30, x: 60, y: 1100, width: 960, height: 0, content: { type: plain, value: "Each item has an owner and a deadline." }, style: { font_family: $body, font_size: 20, color: $text_muted, font_style: italic, line_height: 1.4 } }

  # ── 5 · CTA Blameless ─────────────────────────────────────
  - id: cta
    label: CTA
    layers:
      - { id: bg, type: rect, z: 0, x: 0, y: 0, width: 1080, height: 1350, fill: { type: linear, angle: 180, stops: [{ color: "$text", position: 0 }, { color: "$secondary", position: 100 }] } }
      - { id: accent-band, type: rect, z: 2, x: 0, y: 0, width: 1080, height: 14, fill: { type: solid, color: "$accent" } }
      - { id: counter, type: text, z: 10, x: 60, y: 60, width: 200, height: 0, content: { type: plain, value: "05 / 05" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF", letter_spacing: 0.2 } }
      - { id: eyebrow, type: text, z: 11, x: 60, y: 360, width: 960, height: 0, content: { type: plain, value: "THE LESSON" }, style: { font_family: $mono, font_size: 16, font_weight: 700, color: "#FFFFFF", letter_spacing: 0.34, text_transform: uppercase } }
      - { id: title, type: text, z: 12, x: 60, y: 420, width: 960, height: 0, content: { type: plain, value: "Build a\nblameless\nculture." }, style: { font_family: $heading, font_size: 120, font_weight: 900, color: "#FFFFFF", line_height: 1.0, letter_spacing: -0.03 } }
      - { id: sub, type: text, z: 13, x: 60, y: 920, width: 960, height: 0, content: { type: plain, value: "Systems fail. People learn. Process improves.\nThat's the loop." }, style: { font_family: $body, font_size: 28, color: "#F0F0FF", line_height: 1.5 } }
      - { id: cta-btn, type: rect, z: 14, x: 60, y: 1100, width: 360, height: 72, radius: 8, fill: { type: solid, color: "#FFFFFF" } }
      - { id: cta-text, type: text, z: 15, x: 60, y: 1122, width: 360, height: 0, content: { type: plain, value: "Share with your SRE team" }, style: { font_family: $body, font_size: 20, font_weight: 700, color: "#03001C", text_align: center } }
      - { id: handle, type: text, z: 16, x: 60, y: 1240, width: 960, height: 0, content: { type: plain, value: "@yourhandle · #sre · #devops" }, style: { font_family: $mono, font_size: 16, color: "#FFFFFF", letter_spacing: 0.2 } }

slots:
  - { id: cover_title,      path: "pages[0].layers[5].content.value",  type: text, hint: "Cover headline",          default: "Postmortem:\nProd went down\nat 3am." }
  - { id: cover_meta,       path: "pages[0].layers[6].content.value",  type: text, hint: "Incident meta",           default: "Duration · 42 min   Impact · 12% of users\nMTTR · 28 min      Severity · Sev-1" }
  - { id: timeline_title,   path: "pages[1].layers[4].content.value",  type: text, hint: "Timeline title",          default: "What happened, minute by minute." }
  - { id: root_cause_title, path: "pages[2].layers[4].content.value",  type: text, hint: "Root cause headline",     default: "One config flag.\nOne missing test." }
  - { id: root_cause_body,  path: "pages[2].layers[5].content.value",  type: text, hint: "Root cause body",         default: "Release v8.4.1 introduced a new connection-pool config that defaulted to 10 connections per pod (down from 100). Under load, every pod queued requests until the pool exhausted. Existing tests covered correctness but not concurrency, so the regression slipped through CI." }
  - { id: actions_title,    path: "pages[3].layers[4].content.value",  type: text, hint: "Action items title",      default: "What we changed." }
  - { id: cta_title,        path: "pages[4].layers[4].content.value",  type: text, hint: "CTA title",               default: "Build a\nblameless\nculture." }
  - { id: cta_handle,       path: "pages[4].layers[7].content.value",  type: text, hint: "Handle / hashtags",       default: "@yourhandle · #sre · #devops" }
