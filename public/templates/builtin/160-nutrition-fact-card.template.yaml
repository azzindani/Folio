_protocol: template/v1

# Nutrition facts label — 800×1400 portrait, light-clean theme.
# FDA-style bold-bordered box: "NUTRITION FACTS" header bar, serving
# size line, big calories row, macro grid (Protein/Carbs/Fat/Fiber
# with %DV), bold dividers, micros list (Vit A, Vit C, Vit D, Iron,
# Calcium) with %DV column, footnote.
meta:
  id: tmpl-nutrition-fact-card
  name: Nutrition Fact Card
  type: card
  created: "2026-05-16"
  modified: "2026-05-16"
  generator: folio
  tags: [nutrition, label, food, fda-style, card, portrait]
  description: "FDA-style nutrition facts label with calories, macro grid, micros, and percent daily values."

document:
  width: 800
  height: 1400
  unit: px
  dpi: 96

theme:
  ref: light-clean

layers:
  # ── Background ────────────────────────────────────────────
  - id: bg
    type: rect
    z: 0
    x: 0
    y: 0
    width: 800
    height: 1400
    fill: { type: solid, color: "$background" }

  # ── Outer bold label frame ────────────────────────────────
  - id: frame
    type: rect
    z: 1
    x: 40
    y: 40
    width: 720
    height: 1320
    fill: { type: solid, color: "$background" }
    stroke: { color: "$text", width: 4 }

  # ── Recipe name eyebrow ───────────────────────────────────
  - id: recipe-name
    type: text
    z: 5
    x: 60
    y: 60
    width: 680
    height: 0
    content: { type: plain, value: "Quinoa Power Bowl" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 600
      color: $text_muted
      letter_spacing: 0.04
      line_height: 1.3

  # ── "NUTRITION FACTS" header (massive) ────────────────────
  - id: header
    type: text
    z: 10
    x: 60
    y: 100
    width: 680
    height: 0
    content: { type: plain, value: "Nutrition Facts" }
    style:
      font_family: $heading
      font_size: 56
      font_weight: 800
      color: $text
      line_height: 1
      letter_spacing: -0.02

  - id: header-rule-thin
    type: rect
    z: 11
    x: 60
    y: 180
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  # ── Serving size ──────────────────────────────────────────
  - id: serving-line-1
    type: text
    z: 12
    x: 60
    y: 200
    width: 680
    height: 0
    content: { type: plain, value: "1 serving per container" }
    style: { font_family: $body, font_size: 16, color: $text, line_height: 1.4 }

  - id: serving-size-label
    type: text
    z: 13
    x: 60
    y: 226
    width: 400
    height: 0
    content: { type: plain, value: "Serving size" }
    style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, line_height: 1.4 }

  - id: serving-size-value
    type: text
    z: 14
    x: 60
    y: 226
    width: 680
    height: 0
    content: { type: plain, value: "1 bowl (340g)" }
    style: { font_family: $heading, font_size: 22, font_weight: 700, color: $text, text_align: right, line_height: 1.4 }

  # ── Heavy rule under serving ──────────────────────────────
  - id: heavy-rule-1
    type: rect
    z: 15
    x: 60
    y: 275
    width: 680
    height: 12
    fill: { type: solid, color: "$text" }

  # ── Amount per serving line ───────────────────────────────
  - id: amount-line
    type: text
    z: 20
    x: 60
    y: 295
    width: 680
    height: 0
    content: { type: plain, value: "Amount per serving" }
    style: { font_family: $body, font_size: 14, font_weight: 600, color: $text, line_height: 1.4 }

  # ── Calories row (huge) ───────────────────────────────────
  - id: cal-label
    type: text
    z: 21
    x: 60
    y: 320
    width: 400
    height: 0
    content: { type: plain, value: "Calories" }
    style: { font_family: $heading, font_size: 40, font_weight: 800, color: $text, line_height: 1.1 }

  - id: cal-value
    type: text
    z: 22
    x: 60
    y: 312
    width: 680
    height: 0
    content: { type: plain, value: "520" }
    style: { font_family: $heading, font_size: 72, font_weight: 900, color: $text, text_align: right, line_height: 1 }

  - id: medium-rule-1
    type: rect
    z: 23
    x: 60
    y: 415
    width: 680
    height: 4
    fill: { type: solid, color: "$text" }

  # ── % Daily Value header ──────────────────────────────────
  - id: dv-header
    type: text
    z: 30
    x: 60
    y: 430
    width: 680
    height: 0
    content: { type: plain, value: "% Daily Value*" }
    style:
      font_family: $body
      font_size: 14
      font_weight: 700
      color: $text
      text_align: right
      line_height: 1.4

  # ── Macro grid ────────────────────────────────────────────
  - id: macro-fat-label
    type: text
    z: 31
    x: 60
    y: 465
    width: 540
    height: 0
    content: { type: plain, value: "Total Fat 18g" }
    style:
      font_family: $body
      font_size: 18
      color: $text
      line_height: 1.4
      font_weight: 700

  - id: macro-fat-dv
    type: text
    z: 32
    x: 60
    y: 465
    width: 680
    height: 0
    content: { type: plain, value: "23%" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $text
      text_align: right
      line_height: 1.4

  - id: macro-fat-rule
    type: rect
    z: 33
    x: 60
    y: 500
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: macro-carb-label
    type: text
    z: 34
    x: 60
    y: 515
    width: 540
    height: 0
    content: { type: plain, value: "Total Carbohydrate 62g" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $text
      line_height: 1.4

  - id: macro-carb-dv
    type: text
    z: 35
    x: 60
    y: 515
    width: 680
    height: 0
    content: { type: plain, value: "23%" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $text
      text_align: right
      line_height: 1.4

  - id: macro-fiber-label
    type: text
    z: 36
    x: 100
    y: 550
    width: 500
    height: 0
    content: { type: plain, value: "Dietary Fiber 9g" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: macro-fiber-dv
    type: text
    z: 37
    x: 60
    y: 550
    width: 680
    height: 0
    content: { type: plain, value: "32%" }
    style:
      font_family: $body
      font_size: 17
      font_weight: 700
      color: $text
      text_align: right
      line_height: 1.4

  - id: macro-carb-rule
    type: rect
    z: 38
    x: 60
    y: 585
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: macro-protein-label
    type: text
    z: 39
    x: 60
    y: 600
    width: 540
    height: 0
    content: { type: plain, value: "Protein 22g" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $text
      line_height: 1.4

  - id: macro-protein-dv
    type: text
    z: 40
    x: 60
    y: 600
    width: 680
    height: 0
    content: { type: plain, value: "44%" }
    style:
      font_family: $body
      font_size: 18
      font_weight: 700
      color: $text
      text_align: right
      line_height: 1.4

  - id: heavy-rule-2
    type: rect
    z: 41
    x: 60
    y: 645
    width: 680
    height: 8
    fill: { type: solid, color: "$text" }

  # ── Micros list ───────────────────────────────────────────
  - id: micro-vita-label
    type: text
    z: 50
    x: 60
    y: 665
    width: 540
    height: 0
    content: { type: plain, value: "Vitamin A 320μg" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: micro-vita-dv
    type: text
    z: 51
    x: 60
    y: 665
    width: 680
    height: 0
    content: { type: plain, value: "36%" }
    style: { font_family: $body, font_size: 17, color: $text, text_align: right, line_height: 1.4 }

  - id: micro-rule-1
    type: rect
    z: 52
    x: 60
    y: 700
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: micro-vitc-label
    type: text
    z: 53
    x: 60
    y: 715
    width: 540
    height: 0
    content: { type: plain, value: "Vitamin C 42mg" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: micro-vitc-dv
    type: text
    z: 54
    x: 60
    y: 715
    width: 680
    height: 0
    content: { type: plain, value: "47%" }
    style: { font_family: $body, font_size: 17, color: $text, text_align: right, line_height: 1.4 }

  - id: micro-rule-2
    type: rect
    z: 55
    x: 60
    y: 750
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: micro-vitd-label
    type: text
    z: 56
    x: 60
    y: 765
    width: 540
    height: 0
    content: { type: plain, value: "Vitamin D 4μg" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: micro-vitd-dv
    type: text
    z: 57
    x: 60
    y: 765
    width: 680
    height: 0
    content: { type: plain, value: "20%" }
    style: { font_family: $body, font_size: 17, color: $text, text_align: right, line_height: 1.4 }

  - id: micro-rule-3
    type: rect
    z: 58
    x: 60
    y: 800
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: micro-iron-label
    type: text
    z: 59
    x: 60
    y: 815
    width: 540
    height: 0
    content: { type: plain, value: "Iron 6mg" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: micro-iron-dv
    type: text
    z: 60
    x: 60
    y: 815
    width: 680
    height: 0
    content: { type: plain, value: "33%" }
    style: { font_family: $body, font_size: 17, color: $text, text_align: right, line_height: 1.4 }

  - id: micro-rule-4
    type: rect
    z: 61
    x: 60
    y: 850
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: micro-calcium-label
    type: text
    z: 62
    x: 60
    y: 865
    width: 540
    height: 0
    content: { type: plain, value: "Calcium 180mg" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: micro-calcium-dv
    type: text
    z: 63
    x: 60
    y: 865
    width: 680
    height: 0
    content: { type: plain, value: "14%" }
    style: { font_family: $body, font_size: 17, color: $text, text_align: right, line_height: 1.4 }

  - id: micro-rule-5
    type: rect
    z: 64
    x: 60
    y: 900
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: micro-sodium-label
    type: text
    z: 65
    x: 60
    y: 915
    width: 540
    height: 0
    content: { type: plain, value: "Sodium 420mg" }
    style: { font_family: $body, font_size: 17, color: $text, line_height: 1.4 }

  - id: micro-sodium-dv
    type: text
    z: 66
    x: 60
    y: 915
    width: 680
    height: 0
    content: { type: plain, value: "18%" }
    style: { font_family: $body, font_size: 17, color: $text, text_align: right, line_height: 1.4 }

  - id: heavy-rule-3
    type: rect
    z: 70
    x: 60
    y: 960
    width: 680
    height: 4
    fill: { type: solid, color: "$text" }

  # ── Footnote ──────────────────────────────────────────────
  - id: footnote
    type: text
    z: 71
    x: 60
    y: 980
    width: 680
    height: 0
    content: { type: plain, value: "* The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice." }
    style:
      font_family: $body
      font_size: 13
      color: $text
      line_height: 1.5

  # ── Ingredient roll-up note ───────────────────────────────
  - id: ing-rule
    type: rect
    z: 80
    x: 60
    y: 1140
    width: 680
    height: 1
    fill: { type: solid, color: "$text" }

  - id: ing-header
    type: text
    z: 81
    x: 60
    y: 1160
    width: 680
    height: 0
    content: { type: plain, value: "INGREDIENTS" }
    style:
      font_family: $body
      font_size: 12
      font_weight: 800
      color: $text
      letter_spacing: 0.4
      text_transform: uppercase

  - id: ing-list
    type: text
    z: 82
    x: 60
    y: 1190
    width: 680
    height: 0
    content: { type: plain, value: "Quinoa, chickpeas, kale, roasted sweet potato, tahini dressing, sunflower seeds, lemon, olive oil, sea salt." }
    style:
      font_family: $body
      font_size: 13
      color: $text
      line_height: 1.5

  # ── Brand footer ──────────────────────────────────────────
  - id: brand-footer
    type: text
    z: 90
    x: 60
    y: 1300
    width: 680
    height: 0
    content: { type: plain, value: "Folio Kitchen  ·  Made fresh daily" }
    style:
      font_family: $body
      font_size: 13
      font_style: italic
      color: $text_muted
      text_align: center
      line_height: 1.3

slots:
  - { id: recipe_name,  path: "layers[2].content.value",  type: text, hint: "Recipe / dish name",      default: "Quinoa Power Bowl" }
  - { id: serving_size, path: "layers[7].content.value",  type: text, hint: "Serving size",            default: "1 bowl (340g)" }
  - { id: calories,     path: "layers[11].content.value", type: text, hint: "Calories per serving",    default: "520" }
  - { id: fat_g,        path: "layers[14].content.value", type: text, hint: "Total fat (with unit)",   default: "Total Fat 18g" }
  - { id: carbs_g,      path: "layers[17].content.value", type: text, hint: "Total carbs (with unit)", default: "Total Carbohydrate 62g" }
  - { id: fiber_g,      path: "layers[19].content.value", type: text, hint: "Fiber (with unit)",       default: "Dietary Fiber 9g" }
  - { id: protein_g,    path: "layers[22].content.value", type: text, hint: "Protein (with unit)",     default: "Protein 22g" }
